# Cross-compile fixups for sys-apps/policycoreutils — scoped via package.env.
#
# policycoreutils builds with a HAND-WRITTEN Makefile (no autotools/configure),
# so it never goes through portage's econf. That matters twice over:
#
#  1) No --sysroot reaches the compiler.
#     For autotools packages, portage's econf auto-appends
#     --with-sysroot="${ESYSROOT}" (see phase-helpers.sh), which teaches the
#     build the cross sysroot. A raw Makefile gets nothing, so the cross gcc
#     falls back to its CONFIGURED default sysroot (/usr/${CHOST}). The headers
#     for THIS build (glibc, libselinux, libsemanage, …) live in the emerge
#     ROOT/ESYSROOT (the build sysroot), not in the crossdev sysroot — so
#     <stdio.h>/<fts.h> are "not found". We fix this by baking --sysroot into CC.
#
#  2) The Makefile calls bare `pkg-config`, i.e. the HOST pkg-config, which
#     searches the host's /usr/lib64/pkgconfig and never sees the target's
#     libselinux.pc / libsemanage.pc -> "Package 'libselinux' not found".
#     We redirect every pkg-config call through the crossdev wrapper
#     (${CHOST}-pkg-config -> cross-pkg-config) and point it at the build
#     sysroot's .pc files.
#
# ESYSROOT is exported by portage into the ebuild env and equals the build
# sysroot (ROOT/SYSROOT set by build-orangepi3-lts-stage4.sh's cross_emerge).
# These env files are sourced as bash, so ${ESYSROOT}/${CHOST} expand here.
# Mirrors specs-frite/specs-orangepi5's identical
# portage/env/policycoreutils-cross.conf (identical cross-compile gap).

# (1) Make the raw Makefile's $(CC) carry the cross sysroot so libc + selinux
#     headers resolve. tc-getCC in the ebuild honors a CC override from the env.
CC="${CHOST}-gcc --sysroot=${ESYSROOT}"
CXX="${CHOST}-g++ --sysroot=${ESYSROOT}"

# (2) Route pkg-config through the crossdev wrapper and aim it at the target
#     sysroot's .pc files. The wrapper already exports PKG_CONFIG_SYSROOT_DIR
#     from ESYSROOT/SYSROOT, but we set these explicitly so a bare `pkg-config`
#     in the Makefile (which does NOT consult the wrapper's CHOST default)
#     still resolves the target packages.
PKG_CONFIG="${CHOST}-pkg-config"
PKG_CONFIG_SYSROOT_DIR="${ESYSROOT}"
PKG_CONFIG_LIBDIR="${ESYSROOT}/usr/lib64/pkgconfig:${ESYSROOT}/usr/lib/pkgconfig:${ESYSROOT}/usr/share/pkgconfig"
PKG_CONFIG_PATH="${ESYSROOT}/usr/lib64/pkgconfig:${ESYSROOT}/usr/lib/pkgconfig:${ESYSROOT}/usr/share/pkgconfig"
