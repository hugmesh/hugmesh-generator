# golive-providers.conf — the declarative go-live PROVIDER CATALOG (v1).
#
# Read by scripts/go-live.sh (the engine) and scripts/go-live-menu.sh (the
# whiptail front door). Adding a provider is ONE new [section] here — none of
# the front-ends carry per-provider logic of their own.
#
# SCHEMA (one [provider-id] section per provider; `key = value` rows):
#   title      one-line human label (shown in menus / --list)
#   model      exposure model: tunnel | public-dns | ddns | funnel | router
#   summary    what picking this provider means, in one sentence
#   inputs     space list of REQUIRED inputs the engine collects:
#                token       secret token (via --token-file or a masked prompt)
#                record-ip   the public A/AAAA record value (--record-ip)
#                subdomain   DDNS hostname label (--ddns-subdomain)
#   optional   space list of OPTIONAL inputs (same vocabulary, plus:
#                cf-api-token  Cloudflare API token for the thin --create-dns
#                              driver (--cf-api-token-file)
#                tunnel-id     Cloudflare tunnel UUID (--tunnel-id))
#   token_dest keys-layout destination (relative to --keys-dir) the secret is
#              written to on --emit. SECRETS GO NOWHERE ELSE — the paths named
#              here are gitignored; real values are never committed/echoed.
#   emits      space list of artifacts --emit renders into --out:
#                checklist    step-by-step provider checklist (autofilled)
#                records-csv  copy-paste DNS record set (records.csv)
#                zone-file    BIND-style zone fragment (zone.db)
#                ddns-config  DDNS updater script + cron.d snippet
#   verify     space list of --verify probes: dns http tunnel ddns funnel
#   link       repeated rows: `link = <URL> <label…>` — the EXACT provider
#              pages the operator needs, deep-linked (printed by --links).
#   note       repeated rows: caveats surfaced by --info and the menu.
#
# API SURFACE (v1 non-goal guardrail): the ONLY real API drivers in v1 are the
# thin single-endpoint DDNS updaters (duckdns / cloudflare) and the OPTIONAL
# Cloudflare CNAME creator (--create-dns). Everything else is deep-link +
# autofill + downloadable files, deliberately — no registrar API drivers, no
# router mutation.

[cloudflare-tunnel]
title    = Cloudflare Tunnel — outbound tunnel to the in-cluster ingress (flagship)
model    = tunnel
summary  = No open inbound ports: cloudflared (specs/cluster/apps/12-cloudflared.yaml, ENV=prod) dials out to Cloudflare and serves apex + api./matrix./mastodon. + the *.<domain> wildcard.
inputs   = token
optional = cf-api-token tunnel-id
token_dest = cloudflared/tunnel-token
emits    = checklist records-csv
verify   = dns http tunnel
link     = https://one.dash.cloudflare.com/ Cloudflare Zero Trust dashboard — Networks → Tunnels (create the tunnel, copy its token)
link     = https://dash.cloudflare.com/ Cloudflare dashboard — DNS → Records (add the CNAMEs if not using --create-dns)
link     = https://developers.cloudflare.com/cloudflare-one/connections/connect-networks/ Cloudflare Tunnel docs
note     = The tunnel token is consumed via ExternalSecrets → Vault secret/<brand>/cloudflared (keys-template/cloudflared/README.md); --emit writes it ONLY to the keys layout.
note     = ENV=test images prune the cloudflared app at build time — this provider needs an ENV=prod image.
note     = Public hostnames must ALSO exist as CNAMEs to <tunnel-id>.cfargotunnel.com; --emit renders them, the optional --create-dns thin driver can create them.

[registrar-manual]
title    = Bring-your-own-domain registrar — copy-paste DNS records (NO API)
model    = public-dns
summary  = Any registrar: the engine renders the exact record set (records.csv + zone.db) pointing apex/api./matrix./mastodon./* at your public IP (or tunnel CNAME); you paste it into the registrar's DNS page.
inputs   = record-ip
optional = tunnel-id
token_dest =
emits    = checklist records-csv zone-file
verify   = dns http
link     = https://ap.www.namecheap.com/domains/list/ Namecheap — Domain List → Manage → Advanced DNS
link     = https://dcc.godaddy.com/manage/dns GoDaddy — DNS Management
link     = https://porkbun.com/account/domainsSpeedy Porkbun — Domain Management → DNS
link     = https://console.aws.amazon.com/route53/v2/hostedzones AWS Route 53 — Hosted zones
link     = https://account.squarespace.com/domains Squarespace Domains (ex-Google Domains) — DNS settings
note     = Deliberately NO registrar API driver in v1 — deep-link + downloadable files only.
note     = Behind CGNAT (no reachable public IP)? Use cloudflare-tunnel or tailscale-funnel instead of A/AAAA records.

[ddns]
title    = Dynamic DNS — DuckDNS / Cloudflare-DDNS thin updater (real driver)
model    = ddns
summary  = Home/dynamic-IP path: a single-token update endpoint keeps your hostname pointed at the current IP; --emit renders the updater + cron.d snippet, --verify performs one real update.
inputs   = token subdomain
optional = record-ip
token_dest = ddns/token
emits    = checklist ddns-config
verify   = ddns dns
link     = https://www.duckdns.org/ DuckDNS — sign in, add a subdomain, copy the account token
link     = https://dash.cloudflare.com/profile/api-tokens Cloudflare — My Profile → API Tokens (scope: Zone.DNS Edit on the one zone)
link     = https://www.duckdns.org/spec.jsp DuckDNS update-endpoint spec
note     = Pick the service with --ddns-service duckdns|cloudflare (duckdns is the default).
note     = The emitted updater reads the token from the keys-layout file at runtime — the token never appears in argv or cron mail.

[tailscale-funnel]
title    = Tailscale Funnel — public HTTPS via the tailnet, no DNS records at all
model    = funnel
summary  = Tailnet-native path: `tailscale funnel` publishes the node's ingress on its ts.net hostname over Tailscale's edge — no public IP, no registrar, no open ports.
inputs   =
optional =
token_dest =
emits    = checklist
verify   = funnel
link     = https://login.tailscale.com/admin/settings/features Tailscale admin — enable HTTPS certificates + Funnel for the tailnet
link     = https://login.tailscale.com/admin/acls Tailscale admin — ACLs (grant the node the funnel attribute)
link     = https://tailscale.com/kb/1223/funnel Tailscale Funnel docs
note     = Funnel is a TAILSCALE-HOSTED control-plane feature. The default Snapdragon mesh is self-hosted headscale, which does NOT implement Funnel — this provider applies only to nodes joined to tailscale.com.
note     = The public name is the node's <node>.<tailnet>.ts.net hostname, not your brand domain — pair with registrar-manual later if you want a vanity CNAME.

[router-manual]
title    = Router / home gateway — port-forward instructions only (NO mutation)
model    = router
summary  = Direct exposure: forward WAN TCP 80/443 to the ingress node's LAN IP on your router; the engine renders the exact checklist and never touches the router itself.
inputs   =
optional = record-ip
token_dest =
emits    = checklist
verify   = dns http
link     = http://192.168.1.1/ Common router admin page (192.168.1.1)
link     = http://192.168.0.1/ Common router admin page (192.168.0.1)
link     = https://portforward.com/router.htm Per-vendor port-forwarding guides (portforward.com)
note     = v1 NEVER mutates the router — no UPnP calls, no admin-API drivers; instructions only.
note     = Combine with registrar-manual (records) or ddns (dynamic IP) so a public name actually points at the forwarded IP.
