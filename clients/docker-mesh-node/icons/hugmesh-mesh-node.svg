<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- HugMesh mesh-node icon: a central node linked to a ring of mesh peers. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2a4a"/>
      <stop offset="1" stop-color="#0c1730"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7a3c"/>
      <stop offset="1" stop-color="#e8431f"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="48" fill="url(#bg)"/>
  <g stroke="#5fb0ff" stroke-width="6" stroke-linecap="round" opacity="0.85">
    <line x1="128" y1="128" x2="128" y2="56"/>
    <line x1="128" y1="128" x2="190" y2="92"/>
    <line x1="128" y1="128" x2="190" y2="164"/>
    <line x1="128" y1="128" x2="128" y2="200"/>
    <line x1="128" y1="128" x2="66" y2="164"/>
    <line x1="128" y1="128" x2="66" y2="92"/>
  </g>
  <g fill="#5fb0ff">
    <circle cx="128" cy="56" r="16"/>
    <circle cx="190" cy="92" r="16"/>
    <circle cx="190" cy="164" r="16"/>
    <circle cx="128" cy="200" r="16"/>
    <circle cx="66" cy="164" r="16"/>
    <circle cx="66" cy="92" r="16"/>
  </g>
  <circle cx="128" cy="128" r="34" fill="url(#node)" stroke="#fff" stroke-width="4"/>
</svg>
