      SPRING_LIQUIBASE_USER: tube_bff
      SPRING_LIQUIBASE_PASSWORD: tube_bff
      # tube.google.* is ESO-projected from Vault in-cluster. TokenCipher decodes the
      # DEK in its CONSTRUCTOR, so a blank value is not "fails closed when the connect
      # endpoints are exercised" — the whole service refuses to start:
      #   IllegalStateException: tube.google.dek is required (ESO-projected from Vault)
      #   but was blank
      # These are DEV-ONLY placeholders of the required shape (base64 of 32 bytes),
      # identical in spirit to the repo's own application-test.yml values, and exist
      # only so the local stack boots. They encrypt nothing real: no Google OAuth
      # client is configured locally, so no refresh token is ever minted. Override via
      # the environment to exercise the real Google-connect path.
      TUBE_GOOGLE_DEK: "${TUBE_GOOGLE_DEK:-MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=}"
      TUBE_GOOGLE_STATE_HMAC_KEY: "${TUBE_GOOGLE_STATE_HMAC_KEY:-MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=}"
      # Same story one bean over: TubeMediaTokenService refuses to construct without
      # a media-signing key ("TUBE_MEDIA_KEY is not set — tube media URL signing
      # cannot function"). Dev-only placeholder, same shape + provenance as above.
      TUBE_MEDIA_KEY: "${TUBE_MEDIA_KEY:-MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=}"
    depends_on:
      tube-bff-db: { condition: service_healthy }
      casdoor: { condition: service_started }
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # NOTE: the tube-media Nginx sidecar (signed-URL-gated /tube/content/** static
  # serving, specs/cluster/manifests/tube/deployment.yaml) is intentionally NOT
  # wired here for the same reason as the owncast streaming server above — out of
  # this task's UI+BFF scope (documented limitation).

  # ════════════════════════════════════════════════════════════════════
  #  STATIC FRAGMENT FLEET — the remote-fragment SYNC image (Spring-Native).
  #  In k8s this is an nginx pod + a sync sidecar over a shared volume; for
  #  compose we run the sync service standalone in `once`->serve mode. The
  #  CASDOOR_CLIENT_* are dev placeholders (machine account app-fragment-sync);
  #  with no matching Casdoor app it has no enabled fragments to pull, so it
  #  serves an empty set — fine for bring-up (documented limitation).
  # ════════════════════════════════════════════════════════════════════
  hugmesh-remote-fragment:
    <<: *amd64
    build:
      context: ${STACK_SRC:-../../.stack-src}/hugmesh-remote-fragment
    environment:
      SYNC_MODE: loop
      SERVER_PORT: "8081"
      SYNC_TARGET_DIR: /usr/share/nginx/html
      FEDERATION_BASE_URL: "http://hugmesh-federation-api:8080"
      CASDOOR_TOKEN_URL: "http://casdoor:8000/api/login/oauth/access_token"
      CASDOOR_ORG: hugmesh
      CASDOOR_CLIENT_ID: dev-fragment-sync-client
      CASDOOR_CLIENT_SECRET: dev-fragment-sync-secret
    depends_on:
      hugmesh-federation-api: { condition: service_started }
      casdoor: { condition: service_started }

  # ════════════════════════════════════════════════════════════════════
  #  ANGULAR HOST + FEDERATED REMOTES (each Dockerfile -> nginx :80)
  # ════════════════════════════════════════════════════════════════════

  # hugmesh-host-shell — the Angular host (front page). The fe-gateway catch-all
  # route forwards /** here. specs/cluster/manifests/frontend/deployment.yaml.
  # The SERVICE name stays snapdragon-systems-web on purpose: it is the compose
  # DNS name the fe-gateway routes target (gateway-routes/fe/application-routes.yml),
  # not a build context — renaming it would need both sides changed together.
  snapdragon-systems-web:
    <<: *amd64
    build:
      context: ${STACK_SRC:-../../.stack-src}/hugmesh-host-shell
    environment:
      # Runtime THEME — the HIGHEST-LEVERAGE hook in the fleet: this shell's
      # :root defines the cross-repo --hug-* contract, and the federated remotes
      # render INSIDE this document, so one :root:root override here re-themes
      # every token-adopted remote at once. Same login-ui mechanism: the
      # entrypoint hook writes the env verbatim to /tmp/snap-theme.css
      # (SNAP_THEME_OUT — the docroot is NOT writable for uid 101 on
      # nginx-unprivileged) and nginx serves it via an exact-match alias.
      SNAP_THEME_CSS: ${SNAP_THEME_CSS:-}
      CASDOOR_ISSUER: ${CASDOOR_ISSUER_URI:-http://localhost:8000}
      MATRIX_URL: ${MATRIX_URL:-http://localhost:8008}
      MASTODON_URL: ${MASTODON_URL:-http://localhost:3000}
      SOCIAL_UI_BASE: /social

  hugmesh-admin-ui:
    <<: *amd64
    build:
      context: ${STACK_SRC:-../../.stack-src}/hugmesh-admin-ui
    environment:
      # Runtime THEME: already-derived --sd-* token text (studio core/theme.py
      # css_root(); same contract and threading as login-ui's SNAP_THEME_CSS
      # above). The entrypoint hook (50-snap-theme.sh) writes it verbatim to
      # /tmp/snap-theme.css (SNAP_THEME_OUT in the image) and nginx serves it
      # via the exact-match /snap-theme.css alias. An ENV VAR, not a build arg,
      # and that distinction is the point: a rebrand is compose up with a new
      # value, NO image rebuild. Empty (the default) => shipped default brand.
      SNAP_THEME_CSS: ${SNAP_THEME_CSS:-}

  hugmesh-mod-ui:
    <<: *amd64
    build:
      context: ${STACK_SRC:-../../.stack-src}/hugmesh-mod-ui
    environment:
      # Runtime theme (fleet 50-snap-theme.sh hook; see login-ui above).
      SNAP_THEME_CSS: ${SNAP_THEME_CSS:-}

  hugmesh-user-ui:
    <<: *amd64
    build:
      context: ${STACK_SRC:-../../.stack-src}/hugmesh-user-ui
    environment:
      # Runtime theme (fleet 50-snap-theme.sh hook; see login-ui above).
      SNAP_THEME_CSS: ${SNAP_THEME_CSS:-}

  hugmesh-login-ui:
    <<: *amd64
    build:
      context: ${STACK_SRC:-../../.stack-src}/hugmesh-login-ui
      args:
        # WHICH TRANSLATION CATALOGS THIS IMAGE SHIPS. Comma-separated locale tags;
        # EMPTY (the default) => English-only, zero catalog files in the image and
        # zero catalog requests in the browser. English is the login-ui's SOURCE
        # language, compiled into the bundle, so it needs no catalog — the default
        # is genuinely the smallest artifact.
        #
        # A BUILD ARG, not an `environment:` entry, and that distinction is the whole
        # point: which catalogs SHIP is decided at build time. Selecting among
        # catalogs already baked into every image via a runtime env var would leave
        # every image byte-identical — a knob wired to nothing. (WHICH catalog a
        # given browser then loads IS runtime, and is answered by locale detection
        # inside the app; that is a different question.)
        #
        # Threaded from the Studio: LocalMeshBootstrapConfig.web_locales ->
        # LocalStackNode._build_env() -> `make stack-up` (STACK_ENV) -> here ->
        # the login-ui Dockerfile's ARG SNAP_WEB_LOCALES. Provable:
        #   docker run --rm <image> ls -R /usr/share/nginx/html/i18n
        SNAP_WEB_LOCALES: ${SNAP_WEB_LOCALES:-}
    # Runtime globals the login-ui nginx entrypoint writes into snap-config.js so its
    # (already-built) NATIVE login form turns ON. The browser NEVER learns a Casdoor URL:
    # login-ui renders a first-party username/password form and POSTs it to SNAP_BFF_URL
    # + /bff/login (the front door), then hydrates /bff/session — user-bff does all the
    # PKCE + internal-Casdoor work server-side. No SNAP_OIDC_ISSUER / SNAP_CASDOOR_ISSUER /
    # SNAP_OIDC_REDIRECT_URI here BY DESIGN: handing the browser a Casdoor origin or an
    # authorize/redirect URL is exactly what this hardening removes. SNAP_BFF_URL is the
    # only endpoint the browser talks to for auth.
    environment:
      SNAP_OIDC_ENABLED: "true"
      # EMPTY default = SAME-ORIGIN relative /bff/** calls (the SPA reads
      # `__HUG_BFF_URL__ ?? ''`), and empty is the only value that works on
      # BOTH front doors at once: the old absolute http://localhost:8088
      # default made every login POST from the HTTPS door
      # (https://localhost:8488) an active-mixed-content request the browser
      # BLOCKS outright — and a cross-origin one besides, so the bff_session
      # cookie would land on the wrong origin even if it hadn't been blocked.
      # Set SNAP_BFF_URL only to point the login SPA at an EXTERNAL gateway.
      SNAP_BFF_URL: ${SNAP_BFF_URL:-}
      # Runtime login THEME: already-derived --sd-* token text (studio core/theme.py
      # css_root(); Studio threads it LocalMeshBootstrapConfig.login_theme_css ->
      # LocalStackNode._build_env() -> STACK_ENV -> here). The login-ui entrypoint
      # (50-snap-theme.sh) writes it verbatim to snap-theme.css — an ENV VAR, not a
      # build arg, and that distinction is the point: a rebrand is compose up with a
      # new value, NO image rebuild. Empty (the default) => shipped default brand.
      SNAP_THEME_CSS: ${SNAP_THEME_CSS:-}

  hugmesh-mastodon-ui:
    <<: *amd64
    build:
      context: ${STACK_SRC:-../../.stack-src}/hugmesh-mastodon-ui
    environment:
      # Runtime theme (fleet 50-snap-theme.sh hook; see login-ui above).
      SNAP_THEME_CSS: ${SNAP_THEME_CSS:-}

  hugmesh-matrix-ui:
    <<: *amd64
    build:
      context: ${STACK_SRC:-../../.stack-src}/hugmesh-matrix-ui
    environment:
      # Runtime theme (fleet 50-snap-theme.sh hook; see login-ui above).
      SNAP_THEME_CSS: ${SNAP_THEME_CSS:-}

  hugmesh-api-docs:
    <<: *amd64
    build:
      context: ${STACK_SRC:-../../.stack-src}/hugmesh-api-docs

  # forum-ui — mounted at /social/forum/** (a PATH remote, not a forum.<domain>
  # subdomain — the *.hugmesh.net vanity wildcard would swallow it),
  # congruent with the matrix-ui/mastodon-ui shells at /social/matrix,
  # /social/mastodon (specs/cluster/apps/49-forum-ui.yaml). No env needed, same as
  # matrix-ui/mastodon-ui above.
  hugmesh-forum-ui:
    <<: *amd64
    build:
      context: ${STACK_SRC:-../../.stack-src}/hugmesh-forum-ui
    environment:
      # Runtime theme (fleet 50-snap-theme.sh hook; see login-ui above).
      SNAP_THEME_CSS: ${SNAP_THEME_CSS:-}

  # wiki-ui / owncast-ui / tube-ui — federated remotes added for the full local
  # repo set (same rationale as mod-ui/user-ui above): the cluster serves them via
  # the dynamic module-federation remote-fragment fleet rather than a fixed
  # gateway path, so they have no cluster route yet, but a direct /<slug>/** path
  # here (mirroring admin-ui/mod-ui/user-ui) is reachable + e2e-testable locally.
  hugmesh-wiki-ui:
    <<: *amd64
    build:
      context: ${STACK_SRC:-../../.stack-src}/hugmesh-wiki-ui
    environment:
      # Runtime theme (fleet 50-snap-theme.sh hook; see login-ui above).
      SNAP_THEME_CSS: ${SNAP_THEME_CSS:-}

  hugmesh-owncast-ui:
    <<: *amd64
    build:
      context: ${STACK_SRC:-../../.stack-src}/hugmesh-owncast-ui
    environment:
      # Runtime theme (fleet 50-snap-theme.sh hook; see login-ui above).
      SNAP_THEME_CSS: ${SNAP_THEME_CSS:-}

  hugmesh-tube-ui:
    <<: *amd64
    build:
      context: ${STACK_SRC:-../../.stack-src}/hugmesh-tube-ui
    environment:
      # Runtime theme (fleet 50-snap-theme.sh hook; see login-ui above).
      SNAP_THEME_CSS: ${SNAP_THEME_CSS:-}

  # character-studio-ui — mounted at /character-studio/** (already a canonical
  # cluster route-access row, specs/cluster/manifests/route-access/initdb/20-schema.sql).
  # No dedicated BFF: it talks to the always-present BFFs over the existing
  # same-origin /bff/** routes (see specs/cluster/manifests/character-studio's own
  # comment — "no dedicated BFF in this slug yet"), so no BFF/DB service is added
  # for it here.
  hugmesh-character-studio-ui:
    <<: *amd64
    build:
      context: ${STACK_SRC:-../../.stack-src}/hugmesh-character-studio-ui
    environment:
      # Runtime theme (fleet 50-snap-theme.sh hook; see login-ui above).
      SNAP_THEME_CSS: ${SNAP_THEME_CSS:-}

  # character-forge-ui — mounted at /character-forge/** (canonical cluster
  # route-access row + fe route, specs/cluster/apps/20-gateway-fe.yaml). UNLIKE
  # character-studio-ui it has a dedicated BFF (hugmesh-character-forge-bff-api
  # above, /bff/character-forge/**). The frontend lives in the SAME repo as the
  # BFF (frontend/ subdir of hugmesh-character-forge-bff-api — one repo: BFF
  # root + godot/ + frontend/), so the build context points INTO that clone.
  # That NESTED context is the one thing here unlike its siblings, and it was the
  # second reason this slug used to be profiled out: scripts/patch-stack-src.sh's
  # --base-href injection was keyed by TOP-LEVEL checkout name, so it structurally
  # could not reach a UI living in a subdir of another repo and this page would
  # have shipped `<base href="/">` under a /character-forge/ mount — the exact
  # defect fixed fleet-wide in #459. That patch is now keyed on the path RELATIVE
  # to STACK_SRC and walks one level into each checkout, so this UI gets
  # `--base-href=/character-forge/` like every other path-mounted UI
  # (tests/stack/test-patch-stack-src.sh case 17 pins it).
  hugmesh-character-forge-ui:
    <<: *amd64
    build:
      context: ${STACK_SRC:-../../.stack-src}/hugmesh-character-forge-bff-api/frontend
    environment:
      # Runtime theme (fleet 50-snap-theme.sh hook; see login-ui above).
      SNAP_THEME_CSS: ${SNAP_THEME_CSS:-}

  # ── hugmesh-tor — v3 onion (hidden service) for the local mesh (OPT-IN) ──
  # Publishes the fe-gateway as a Tor v3 .onion, mirroring the NODE `tor` optional
  # service (docs/TOR-HIDDEN-SERVICE.md) for the LOCAL docker mesh — INBOUND
  # reachability with NO public IP / DNS / open ports. OPT-IN behind the `tor`
  # compose profile: `make stack-up TOR=1` (or `--profile tor`); a default stack
  # never creates it, so the unprofiled stack is byte-identical to before. Built
  # from ./tor (multi-arch alpine+tor, NO platform pin) so it runs natively on
  # Linux docker AND Docker Desktop (Windows/macOS) and on arm64 hosts. tor
  # resolves `hugmesh-fe-gateway` over the compose network and forwards the
  # onion :80 there. The minted .onion hostname is copied to ./tor-onion/hostname
  # (gitignored) for the host/GUI to read; the private key persists in the
  # tor-onion-keys volume so the address is stable across restarts.
  hugmesh-tor:
    profiles: ["tor"]
    build:
      context: ./tor
    environment:
      TOR_ONION_UPSTREAM: ${TOR_ONION_UPSTREAM:-hugmesh-fe-gateway:8080}
    volumes:
      - tor-onion-keys:/var/lib/tor/hugmesh-onion
      - ./tor-onion:/onion-out
    depends_on:
      hugmesh-fe-gateway:
        condition: service_started
    restart: unless-stopped

  # ── hugmesh-anubis — Techaro Anubis PoW anti-scraper gate (OPT-IN) ──
  # Mirrors specs/cluster/manifests/anubis/deployment.yaml (cluster: public
  # Ingress -> Anubis :8923 -> fe-gateway :8080). Locally it is an ALTERNATIVE
  # published front door, the tor precedent above: the direct :8088/:8488 doors
  # are untouched and http://localhost:${ANUBIS_HOST_PORT:-8923} serves the same
  # platform THROUGH the PoW gate. OPT-IN behind the `anubis` profile
  # (`make stack-up ANUBIS=1`); a default stack never creates it, so the
  # unprofiled bring-up stays byte-identical. Image PINNED like the cluster
  # (specs/cluster/manifests/anubis/kustomization.yaml); multi-arch, so no
  # platform pin — same as hugmesh-tor. Anubis is its own Go reverse proxy
  # (TARGET env) and re-resolves upstream DNS at dial time via Docker's embedded
  # DNS, so it does NOT need the nginx variables+resolver idiom that
  # tls-front/default.conf documents — no stale-IP trap in this path.
  # NO healthcheck on purpose: the upstream image is distroless (no shell/curl;
  # the cluster probes /healthz via kubelet httpGet, which needs no in-container
  # binary). Add test: ["CMD", "anubis", "--healthcheck"] only after verifying
  # the flag against this tag at first bring-up.
  hugmesh-anubis:
    profiles: ["anubis"]
    image: ghcr.io/techarohq/anubis:v1.25.0
    environment:
      # Same knobs as the cluster Deployment's env block.
      BIND: ":8923"
      METRICS_BIND: ":9090"
      TARGET: ${ANUBIS_TARGET:-http://hugmesh-fe-gateway:8080}
      # This door is PUBLISHED DIRECTLY (no fronting proxy), so no one sets
      # X-Real-Ip and Anubis's default (trust the header, for cluster ingress)
      # 500s every request with "[misconfiguration] X-Real-Ip header is not
      # set". On this topology the socket's remote address IS the client.
      USE_REMOTE_ADDRESS: "true"
      DIFFICULTY: "5"
      SERVE_ROBOTS_TXT: "true"
    ports:
      # The PoW-gated door; 8923 is free on this stack and matches the cluster
      # gate port. The :9090 metrics/health listener stays UNPUBLISHED (the
      # cluster keeps it internal too — admin-bff-only).
      - "${ANUBIS_HOST_PORT:-8923}:8923"
    depends_on:
      hugmesh-fe-gateway:
        condition: service_started
    restart: unless-stopped

volumes:
  route-access-pg:
  federation-pg:
  admin-bff-pg:
  forum-bff-pg:
  character-forge-bff-pg:
  wiki-bff-pg:
  owncast-bff-pg:
  tube-bff-pg:
  federation-bundles:
  # v3 onion key custody for the OPT-IN hugmesh-tor service (`--profile tor`).
  # Persisting the key keeps the .onion address stable across restarts; only the
  # PUBLIC hostname is ever copied out (to ./tor-onion) — the key never leaves here.
  tor-onion-keys:
