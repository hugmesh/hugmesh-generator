# tls-front/default.conf — the local stack's HTTPS front door.
#
# Terminates TLS on :8488 (host knob PUBLIC_HTTPS_PORT) and proxies
# byte-transparently to the SAME fe-gateway the plain-HTTP :8088 publish hits —
# both doors serve the identical platform, so everything that works on
# http://localhost:8088 works on https://localhost:8488. ENV-independent by
# design: the test/prod knob only changes the Casdoor issuer baked into the
# services behind the gateway, never this terminator, so HTTPS works under
# ENV=test and ENV=prod alike.
#
# The cert/key come from tests/stack/.tls-front (per-machine, gitignored,
# minted by `make stack-certs` via gen-certs.sh). Deliberately NOT the
# committed tests/stack/certs fixtures: that CA's PRIVATE key is public in the
# repo, and a browser must never be asked to trust a CA anyone can sign with.
# Trust the green lock with tests/stack/.tls-front/ca.crt, or just accept the
# self-signed warning.

# WebSocket upgrade pass-through (map is http{}-scope; conf.d files are
# included there). Falls back to "" for plain requests so keep-alive works.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# A DOMAIN'S OWN LOOK, served by Host (Studio core/look_serving.py). When the
# Studio starts a mesh with added domains it writes tests/stack/.looks/
# (gitignored): one folder of hug-theme.css + snap-theme.css per domain and
# hosts.map, one `<domain name> <brand id>;` line per domain that has a look of
# its own. tests/stack/compose.looks.yaml mounts that folder read-only at
# /etc/hugmesh-looks, and the Makefile adds that overlay only while hosts.map
# exists. With no mount the glob below matches nothing (nginx accepts an empty
# glob include), every Host maps to the sentinel and every request goes to the
# gateway exactly as before. `_unmapped` can never be a brand folder: a brand id
# is lowercase letters, digits and hyphens only.
map $host $hug_look {
    default _unmapped;
    include /etc/hugmesh-looks/hosts.map*;
}

server {
    listen 8443 ssl;
    http2 on;
    server_name localhost;

    ssl_certificate     /etc/hugmesh-tls/fullchain.crt;
    ssl_certificate_key /etc/hugmesh-tls/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # NO Strict-Transport-Security header — deliberate, not an oversight. HSTS
    # is scoped per-HOST (localhost), NOT per-port: sending it once would make
    # the browser force-upgrade EVERY localhost port to https, breaking the
    # plain doors this stack also publishes (8088 front door, 8000 Casdoor,
    # 8008 tuwunel, the Studio dev servers, ...).
    #
    # Not emitting it here was NOT enough: the fe-gateway sets it itself (Spring
    # Security's default header set — it is on the plain :8088 door too), and
    # nginx passes upstream headers through, so the https door shipped HSTS
    # anyway. That BRICKED the mesh in Chrome (operator report 2026-08-14:
    # "https://localhost:8488/ can't be opened in browser" while curl -k still
    # returned 200): once localhost is HSTS-pinned, this stack's self-signed
    # cert — CN is the cluster domain (gen-certs.sh mints CN=${DOMAIN}, i.e.
    # hugmesh.net; it carried the pre-rebrand domain when this was hit), which
    # does not even match localhost — becomes a
    # NON-BYPASSABLE interstitial with no "proceed anyway" link, for a year.
    # Strip it at the door so the local lane's own decision actually holds.
    #
    # NOTE for anyone already pinned: removing the header does not un-pin a
    # browser that saw it. Clear it at chrome://net-internals/#hsts ("Delete
    # domain security policies" -> localhost).
    proxy_hide_header Strict-Transport-Security;

    # Mastodon media uploads via the be-gateway routes are the biggest bodies
    # that cross the front door; nginx's 1m default would 413 them.
    client_max_body_size 100m;

    # Re-resolve the upstream instead of pinning the IP it had at startup.
    #
    # nginx resolves a LITERAL proxy_pass hostname exactly once, when the config
    # loads, and then caches that address forever. Recreating hugmesh-fe-gateway
    # (any `docker compose up -d` that rebuilds it, the Studio's GUI bring-up,
    # a `make stack-up` refresh) hands it a NEW bridge IP, and this container
    # keeps proxying to the dead one — or worse, to whatever container has since
    # been given that address, so one service's traffic silently lands on
    # another's. Observed three times on this stack: the front door answered 502,
    # then later 401 with `www-authenticate: Bearer` (an API upstream, not the
    # SPA), and each time the only fix was restarting this container by hand.
    #
    # 127.0.0.11 is Docker's embedded DNS. A VARIABLE in proxy_pass is what makes
    # nginx defer resolution to request time and honour `valid=10s`; with a
    # variable nginx no longer appends the request URI itself, hence the explicit
    # $request_uri (which carries the query string too).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $fe_gateway hugmesh-fe-gateway;

    # The proxy settings sit at server level so the two proxying locations
    # below (`/` and the theme location's fallback `@gateway`) share ONE copy;
    # a location that sets none of its own inherits all of them.
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # SSE (Mercure-style live channels ride /bff/** through the gateway):
    # buffering would hold events back until the buffer fills.
    proxy_buffering off;
    proxy_read_timeout 300s;

    location / {
        proxy_pass http://$fe_gateway:8080$request_uri;
    }

    # Any path ending in hug-theme.css or snap-theme.css (login-ui links it
    # relatively, so it arrives as /login/hug-theme.css, /_remotes/login/...,
    # /hug-theme.css): answered from the requesting domain's own folder when
    # hosts.map names its Host, otherwise passed to the gateway untouched. The
    # capture is NAMED because a map evaluation may run a regex of its own and
    # reset the numbered ones. no-store, the same posture login-ui's own nginx
    # gives this file: a look changed at the next start must show on the next
    # load. This location answers from disk and never proxies, so its
    # Cache-Control describes a file the door owns; the gateway's own responses
    # (via @gateway and `/`) keep theirs untouched (tests/stack/
    # test-no-store-posture.sh pins exactly that split).
    location ~ "(?:^|/)(?<hug_look_file>hug|snap)-theme\.css$" {
        root /etc/hugmesh-looks/$hug_look;
        try_files /${hug_look_file}-theme.css @gateway;
        add_header Cache-Control "no-store" always;
    }

    location @gateway {
        proxy_pass http://$fe_gateway:8080$request_uri;
    }
}
