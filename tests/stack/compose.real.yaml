# Real-services integration stack (NOT mocks). Brings up the actual Matrix
# (Synapse), Mastodon and Casdoor servers, replacing the Node mock-*.mjs
# doubles for THOSE pieces only. It does NOT include any first-party Spring
# service (gateway/BFFs) — those only come up in compose.local.yaml
# (`make stack-up`), which includes this file for its Synapse/Mastodon tier
# and IS the fully-real path (real gateway + BFFs + Casdoor OAuth login; see
# docs/LOCAL-STACK.md). The lightweight Playwright harness (tests/stack/up.sh)
# can point its UI at the real Synapse here (REAL_MATRIX=1) but still runs
# mock-bff.mjs as the BFF in that mode — see up-real.sh's closing note for
# exactly what that pairing does and doesn't cover.
#
# Bring up with tests/stack/up-real.sh (it generates the Mastodon secrets +
# runs Mastodon's db:prepare first, then `docker compose -f compose.real.yaml
# up -d`). Synapse needs no first-run step from up-real.sh any more — its own
# entrypoint below self-heals its config on every start (see the synapse
# service), so a bare `docker compose --profile social up -d` (e.g. `make
# stack-up SOCIAL=1`) gets a working, registration-enabled Synapse too.
name: snapdragon-real

services:
  # ── Identity: Casdoor (OAuth2/OIDC) + its Postgres ───────────────
  casdoor-db:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: casdoor, POSTGRES_USER: casdoor, POSTGRES_PASSWORD: casdoor }
    volumes: [casdoor-pg:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U casdoor"], interval: 5s, retries: 20 }

  casdoor:
    image: casbin/casdoor:latest
    depends_on: { casdoor-db: { condition: service_healthy } }
    environment:
      RUNNING_IN_DOCKER: "true"
      driverName: postgres
      dataSourceName: "user=casdoor password=casdoor host=casdoor-db port=5432 sslmode=disable dbname=casdoor"
    ports: ["8000:8000"]

  # ── Matrix: Synapse ────────────────────────────────────────────────
  # Self-healing config: the entrypoint below generates homeserver.yaml into
  # the volume on first boot (if missing) and idempotently ensures
  # registration is enabled, THEN execs the image's real entrypoint
  # (/start.py, confirmed via `docker image inspect`) to actually run
  # Synapse. This runs on every container start regardless of how the
  # `synapse` service is brought up (up-real.sh, `make stack-up SOCIAL=1`, or
  # a bare `docker compose --profile social up`), so a fresh `synapse` volume
  # can never again come up without registration enabled — previously only
  # up-real.sh's separate pre-step did this, so any bring-up that skipped it
  # left every BFF Matrix-account mint 403 with "Registration has been
  # disabled" (see docs/LOCAL-STACK.md and platform TODO notes for the
  # incident this fixes at the source instead of a one-off in-container
  # patch).
  #
  # NOTE for anyone re-deriving this logic: on today's synapse image,
  # `/start.py generate` already writes its OWN random
  # registration_shared_secret into the generated config, so the
  # `registration_shared_secret` append below is normally a no-op (that's
  # fine — nothing in this repo hardcodes the secret's value; Synapse's
  # admin tooling, e.g. seed-e2e.sh's `register_new_matrix_user`, reads
  # whatever value is actually in the config). The setting that actually
  # matters for the BFF's public-registration mint flow is
  # `enable_registration` — the earlier version of this idempotent-append
  # logic (up-real.sh) appended it WITHOUT a leading newline; since the
  # generated file's last line is a `# vim:ft=yaml` comment with no trailing
  # newline, that append silently merged into the comment and never actually
  # took effect. The `ensure trailing newline` line below exists specifically
  # to avoid repeating that bug.
  synapse:
    image: matrixdotorg/synapse:latest
    volumes: [synapse:/data]
    ports: ["8008:8008"]
    environment:
      SYNAPSE_SERVER_NAME: ${SYNAPSE_SERVER_NAME:-localhost}
      SYNAPSE_REPORT_STATS: ${SYNAPSE_REPORT_STATS:-no}
      SYNAPSE_REG_SECRET: ${SYNAPSE_REG_SECRET:-snapdragon-reg-secret}
    entrypoint:
      - sh
      - -c
      - |
        set -e
        cfg=/data/homeserver.yaml
        if [ ! -f "$$cfg" ]; then
          echo "==> Generating Synapse config (server_name=$${SYNAPSE_SERVER_NAME})"
          /start.py generate
        fi
        # Ensure the file ends in a newline before any append below, so a
        # key never silently merges into the preceding line (see NOTE above).
        [ -z "$$(tail -c1 "$$cfg")" ] || printf '\n' >> "$$cfg"
        grep -q '^registration_shared_secret:' "$$cfg" || \
          printf 'registration_shared_secret: "%s"\n' "$${SYNAPSE_REG_SECRET}" >> "$$cfg"
        grep -q '^enable_registration:' "$$cfg" || \
          printf 'enable_registration: true\nenable_registration_without_verification: true\n' >> "$$cfg"
        exec /start.py
    healthcheck: { test: ["CMD-SHELL", "curl -sf http://localhost:8008/health || exit 1"], interval: 5s, retries: 30 }

  # ── Platform datastore: Cassandra (gateway revocation list + URL registry) ──
  # The snapdragon services use Cassandra, NOT Redis. Redis appears below ONLY
  # because Mastodon (third-party) hard-requires it; that Redis is scoped to
  # Mastodon and is not a platform component.
  cassandra:
    image: cassandra:5
    environment: { CASSANDRA_CLUSTER_NAME: SnapdragonGatewayCluster, CASSANDRA_DC: dc1, MAX_HEAP_SIZE: 512M, HEAP_NEWSIZE: 128M }
    volumes: [cassandra:/var/lib/cassandra]
    healthcheck: { test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces' || exit 1"], interval: 10s, retries: 30, start_period: 60s }

  # ── Mastodon: web + sidekiq + streaming + Postgres + (mandatory) Redis ──
  mastodon-db:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: mastodon, POSTGRES_USER: mastodon, POSTGRES_PASSWORD: mastodon }
    volumes: [mastodon-pg:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U mastodon"], interval: 5s, retries: 20 }

  # Mastodon-internal dependency ONLY — Mastodon cannot use Cassandra.
  mastodon-redis:
    image: redis:7-alpine
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 20 }

  mastodon-web:
    image: ghcr.io/mastodon/mastodon:v4.3.1
    command: ["bundle", "exec", "puma", "-C", "config/puma.rb"]
    env_file: [.mastodon.env]
    depends_on:
      mastodon-db: { condition: service_healthy }
      mastodon-redis: { condition: service_healthy }
    ports: ["3000:3000"]

  mastodon-sidekiq:
    image: ghcr.io/mastodon/mastodon:v4.3.1
    command: ["bundle", "exec", "sidekiq"]
    env_file: [.mastodon.env]
    depends_on:
      mastodon-db: { condition: service_healthy }
      mastodon-redis: { condition: service_healthy }

  mastodon-streaming:
    image: ghcr.io/mastodon/mastodon-streaming:v4.3.1
    command: ["node", "./streaming/index.js"]
    env_file: [.mastodon.env]
    depends_on:
      mastodon-db: { condition: service_healthy }
      mastodon-redis: { condition: service_healthy }
    ports: ["4000:4000"]

volumes:
  casdoor-pg:
  mastodon-pg:
  synapse:
  cassandra:
