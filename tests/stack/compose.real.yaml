# Real-services integration stack (NOT mocks). Brings up the actual Matrix
# (tuwunel — the SAME homeserver the cluster payload deploys), Mastodon and
# Casdoor servers, replacing the Node mock-*.mjs doubles for THOSE pieces
# only. It does NOT include any first-party Spring service (gateway/BFFs) —
# those only come up in compose.local.yaml (`make stack-up`), which includes
# this file for its tuwunel/Mastodon tier and IS the fully-real path (real
# gateway + BFFs + Casdoor OAuth login; see docs/LOCAL-STACK.md). The
# lightweight Playwright harness (tests/stack/up.sh) can point its UI at the
# real tuwunel here (REAL_MATRIX=1) but still runs mock-bff.mjs as the BFF in
# that mode — see up-real.sh's closing note for exactly what that pairing
# does and doesn't cover.
#
# Bring up with tests/stack/up-real.sh (it generates the Mastodon secrets +
# runs Mastodon's db:prepare first, then `docker compose -f compose.real.yaml
# up -d`). tuwunel needs no first-run step at all — it is configured entirely
# declaratively via TUWUNEL_* env on the service below, so a bare `docker
# compose --profile social up -d` (e.g. `make stack-up SOCIAL=1`) gets a
# working, registration-enabled homeserver too.
name: hugmesh-real

services:
  # ── Identity: Casdoor (OAuth2/OIDC) + its Postgres ───────────────
  casdoor-db:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: casdoor, POSTGRES_USER: casdoor, POSTGRES_PASSWORD: casdoor }
    volumes: [casdoor-pg:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U casdoor"], interval: 5s, retries: 20 }

  casdoor:
    image: casbin/casdoor:latest
    depends_on: { casdoor-db: { condition: service_healthy } }
    environment:
      RUNNING_IN_DOCKER: "true"
      driverName: postgres
      dataSourceName: "user=casdoor password=casdoor host=casdoor-db port=5432 sslmode=disable dbname=casdoor"
      # PIN THE TOKEN ISSUER. Casdoor ships `origin =` EMPTY in conf/app.conf, and with
      # no origin it derives a token's `iss` from the REQUEST HOST. A browser reaching
      # it on the published port gets iss=http://localhost:8000, but a service calling
      # it over the compose network gets iss=http://casdoor:8000 — while EVERY service
      # validates against CASDOOR_ISSUER_URI=http://localhost:8000. So browser logins
      # worked and machine-to-machine tokens did not: hugmesh-remote-fragment minted a
      # perfectly good client_credentials token ("[casdoor] minted service token for
      # dev-fragment-sync-client") and then got 401 from
      # GET http://hugmesh-federation-api:8080/api/federation/manifest on every 60s tick,
      # forever. Casdoor's conf.GetConfigString falls back to the environment when the
      # app.conf key is empty, so setting `origin` here makes EVERY token — however it
      # was requested — carry the one issuer the services already trust.
      origin: "http://localhost:8000"
    ports: ["8000:8000"]

  # ── Matrix: tuwunel ────────────────────────────────────────────────
  # tuwunel (Rust Conduit/conduwuit successor) — the SAME homeserver and image
  # tag the cluster payload deploys (specs/cluster/manifests/tuwunel/
  # tuwunel.yaml), ending the old "mainline Synapse locally, tuwunel on the
  # cluster" divergence. Where Synapse needed a self-healing entrypoint
  # (generate homeserver.yaml, idempotently append enable_registration on
  # every start), tuwunel is configured ENTIRELY declaratively via the
  # TUWUNEL_* env below — a fresh volume comes up registration-enabled on
  # EVERY bring-up path (up-real.sh, `make stack-up SOCIAL=1`, or a bare
  # `docker compose --profile social up`) with no entrypoint override and no
  # first-run step, so the BFF's Matrix-account mint can never again 403 with
  # "Registration has been disabled".
  #
  # Registration posture (LAN test stack — the tuwunel equivalent of the old
  # Synapse enable_registration + enable_registration_without_verification):
  #   * open registration: ALLOW_REGISTRATION plus the explicit
  #     YES_I_AM_VERY_VERY_SURE... acknowledgment tuwunel requires for a
  #     tokenless open server. The BFF mint flow (public POST
  #     /_matrix/client/v3/register with m.login.dummy) works unchanged.
  #   * REGISTRATION_SHARED_SECRET: tuwunel v1.7 implements Synapse's
  #     /_synapse/admin/v1/register HMAC protocol; kept so operators retain
  #     the register_new_matrix_user-style admin mint (seed-e2e.sh itself
  #     uses the public flow and does not need it).
  #   * GRANT_ADMIN_TO_FIRST_USER=false: tuwunel's default silently promotes
  #     the FIRST registered user to server admin (#admins room membership) —
  #     locally that would be whichever e2e user happens to register first.
  #     Synapse parity: nobody is server admin on this stack.
  #
  # The image is distroless (no shell, no curl), so an in-container
  # healthcheck is impossible; nothing in the stack gates on one. Readiness
  # probes live in up-real.sh / seed-e2e.sh and hit
  # GET /_matrix/client/versions — the same endpoint the cluster
  # readinessProbe uses (Synapse's /health does not exist on tuwunel).
  #
  # server_name is PINNED into RocksDB at first boot — to change
  # MATRIX_SERVER_NAME afterwards, wipe the volume first (down-real.sh, or
  # `docker volume rm hugmesh-real_tuwunel` / `hugmesh-local_tuwunel`,
  # depending on which compose project — up-real.sh vs `make stack-up
  # SOCIAL=1` — created it).
  tuwunel:
    image: ghcr.io/matrix-construct/tuwunel:v1.7.0
    volumes: [tuwunel:/var/lib/tuwunel]
    ports: ["8008:8008"]
    environment:
      TUWUNEL_SERVER_NAME: ${MATRIX_SERVER_NAME:-localhost}
      # tuwunel's default bind is loopback-only — 0.0.0.0 so the gateway/BFF
      # services (and the host port publish) can reach it.
      TUWUNEL_ADDRESS: 0.0.0.0
      TUWUNEL_PORT: "8008"
      TUWUNEL_DATABASE_PATH: /var/lib/tuwunel
      TUWUNEL_ALLOW_REGISTRATION: "true"
      TUWUNEL_YES_I_AM_VERY_VERY_SURE_I_WANT_AN_OPEN_REGISTRATION_SERVER_PRONE_TO_ABUSE: "true"
      TUWUNEL_REGISTRATION_SHARED_SECRET: ${MATRIX_REG_SECRET:-hugmesh-reg-secret}
      TUWUNEL_GRANT_ADMIN_TO_FIRST_USER: "false"
      TUWUNEL_ALLOW_FEDERATION: "false"

  # ── Platform datastore: Cassandra (gateway revocation list + URL registry) ──
  # The hugmesh services use Cassandra, NOT Redis. Redis appears below ONLY
  # because Mastodon (third-party) hard-requires it; that Redis is scoped to
  # Mastodon and is not a platform component.
  cassandra:
    image: cassandra:5
    environment: { CASSANDRA_CLUSTER_NAME: HugMeshGatewayCluster, CASSANDRA_DC: dc1, MAX_HEAP_SIZE: 512M, HEAP_NEWSIZE: 128M }
    volumes: [cassandra:/var/lib/cassandra]
    healthcheck: { test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces' || exit 1"], interval: 10s, retries: 30, start_period: 60s }

  # ── Mastodon: web + sidekiq + streaming + Postgres + (mandatory) Redis ──
  mastodon-db:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: mastodon, POSTGRES_USER: mastodon, POSTGRES_PASSWORD: mastodon }
    volumes: [mastodon-pg:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U mastodon"], interval: 5s, retries: 20 }

  # Mastodon-internal dependency ONLY — Mastodon cannot use Cassandra.
  mastodon-redis:
    image: redis:7-alpine
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 20 }

  # One-shot: load the Mastodon schema. `mastodon-db` is an EMPTY postgres, and
  # mastodon-web/sidekiq query `users` on boot — both died with
  #   PG::UndefinedTable: ERROR: relation "users" does not exist
  # on `make stack-up SOCIAL=1`. tests/stack/up-real.sh has always run
  # `run --rm mastodon-web bundle exec rails db:prepare` by hand before starting
  # the web tier; this makes the plain compose path (which the Studio bootstrap
  # uses) self-heal the same way, instead of requiring a terminal detour.
  # db:prepare is idempotent — it creates+migrates, or no-ops on a loaded schema.
  mastodon-init:
    image: ghcr.io/mastodon/mastodon:v4.3.1
    profiles: [social]
    restart: "no"
    command: ["bundle", "exec", "rails", "db:prepare"]
    env_file: [.mastodon.env]
    depends_on:
      mastodon-db: { condition: service_healthy }
      mastodon-redis: { condition: service_healthy }

  mastodon-web:
    image: ghcr.io/mastodon/mastodon:v4.3.1
    command: ["bundle", "exec", "puma", "-C", "config/puma.rb"]
    env_file: [.mastodon.env]
    depends_on:
      mastodon-init: { condition: service_completed_successfully }
      mastodon-db: { condition: service_healthy }
      mastodon-redis: { condition: service_healthy }
    ports: ["3000:3000"]

  mastodon-sidekiq:
    image: ghcr.io/mastodon/mastodon:v4.3.1
    command: ["bundle", "exec", "sidekiq"]
    env_file: [.mastodon.env]
    depends_on:
      mastodon-init: { condition: service_completed_successfully }
      mastodon-db: { condition: service_healthy }
      mastodon-redis: { condition: service_healthy }

  mastodon-streaming:
    image: ghcr.io/mastodon/mastodon-streaming:v4.3.1
    command: ["node", "./streaming/index.js"]
    env_file: [.mastodon.env]
    depends_on:
      mastodon-db: { condition: service_healthy }
      mastodon-redis: { condition: service_healthy }
    ports: ["4000:4000"]

volumes:
  casdoor-pg:
  mastodon-pg:
  # NOTE: machines that ran the pre-tuwunel stack keep an orphaned synapse
  # volume (compose only removes volumes named in the CURRENT file):
  # `hugmesh-real_synapse` from the up-real.sh path and/or
  # `hugmesh-local_synapse` from the `make stack-up SOCIAL=1` path — reclaim
  # with `docker volume rm hugmesh-real_synapse hugmesh-local_synapse`.
  tuwunel:
  cassandra:
