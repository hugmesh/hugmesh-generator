# compose.alt-social.yaml — ALTERNATIVE third-party social backends for the
# local test stack, each behind its OWN compose profile so the core platform (and
# even `SOCIAL=1`) comes up without them:
#
#   phpBB   — an alternative FORUM to the first-party hugmesh-forum-ui +
#             hugmesh-forum-bff-api pair.        `make stack-up PHPBB=1`
#   Akkoma  — an alternative FEDIVERSE server to Mastodon (Akkoma is a Pleroma
#             fork, same ActivityPub/Mastodon-client API surface).
#                                                `make stack-up AKKOMA=1`
#
# Both are DEFAULT-OFF, following the tube/owncast precedent: optional services
# that must never slow down or destabilise the default bring-up. They compose
# freely with SOCIAL=1 (`make stack-up SOCIAL=1 AKKOMA=1` runs Mastodon AND
# Akkoma side by side, which is the point — the test stack can then prove the
# federation surface against two different server implementations).
#
# Each gets its OWN Postgres rather than sharing mastodon-db: Akkoma requires
# database superuser-level extensions (citext/pg_trgm/uuid-ossp) and phpBB owns
# its schema outright, so sharing would couple two independent teardowns.
#
# ── WHERE THE IMAGES COME FROM ──
#   phpBB  — built from hugmesh-forum-api, which IS the phpBB image this platform
#            deploys: official phpBB 3.3 plus the `hugmesh/forumapi` headless
#            extension. That extension is not optional decoration — phpBB ships no
#            REST API, so it is the only thing hugmesh-forum-bff-api can talk to.
#            (An earlier revision of this file built a VANILLA phpBB from the
#            release zip; that board answered 401 on every /api/v1/hugmesh/** call
#            because the routes simply did not exist.) Upstream phpBB publishes no
#            usable image of its own — github.com/phpbb/docker is stale PHP 5.4-7.0
#            scaffolding and bitnami/phpbb 404s — which is why the platform builds
#            its own rather than pinning one.
#   Akkoma — upstream ships no prebuilt image at all; its own docker-compose
#            builds from source via docker-resources/build.sh. A from-source
#            Elixir build would add many minutes to a DEFAULT-OFF option, so we
#            use the actively-maintained community mirror below, PINNED BY
#            DIGEST. That is an UNOFFICIAL image and is called out as such in
#            docs/LOCAL-STACK.md — acceptable for a local test lane, NOT a
#            pattern to copy into specs/cluster/ for a real deployment.
name: hugmesh-local

services:
  # ── phpBB (profile: phpbb) ────────────────────────────────────────────────
  phpbb-db:
    image: postgres:16-alpine
    profiles: ["phpbb"]
    environment:
      POSTGRES_DB: phpbb
      POSTGRES_USER: phpbb
      POSTGRES_PASSWORD: phpbb
    networks:
      default:
        # The extension repo's shipped install YAML hardcodes `dbhost: db`, and it
        # is consumed verbatim by the image entrypoint on first boot. An alias is
        # cheaper and less surprising than forking their file or renaming this
        # service to the very generic `db`.
        aliases: [db]
    volumes: [phpbb-pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phpbb"]
      interval: 5s
      retries: 20

  phpbb:
    # The REAL phpBB image: official phpBB 3.3 with the `hugmesh/forumapi` headless
    # extension baked in — the same image the cluster deployment references as
    # `<org>/phpbb:dev` (specs/cluster/manifests/forum/phpbb.yaml).
    #
    # This REPLACES an earlier hand-rolled vanilla-phpBB Dockerfile in tests/stack/.
    # Vanilla phpBB was the wrong backend: phpBB ships NO REST API, so the whole
    # forum path — hugmesh-forum-ui -> /bff/forum/** -> hugmesh-forum-bff-api ->
    # /api/v1/hugmesh/** -> phpBB's own services — has nothing to talk to without
    # the extension. A vanilla board answers 401 on every one of those routes and
    # the admin console reports `degraded`, which looks like an auth bug rather
    # than a missing server component.
    #
    # Serves on 8080 (not 80) and runs as UID 33; its entrypoint regenerates
    # config.php from the PHPBB_DB_* env each boot, installs the schema ONCE when
    # the DB is empty, and enables the extension.
    build:
      context: ${STACK_SRC:-../../.stack-src}/hugmesh-forum-api
    profiles: ["phpbb"]
    environment:
      PHPBB_DB_HOST: phpbb-db
      PHPBB_DB_PORT: "5432"
      PHPBB_DB_NAME: phpbb
      PHPBB_DB_USER: phpbb
      PHPBB_APP_PASSWORD: phpbb
      PHPBB_TABLE_PREFIX: phpbb_
      # Shipped BY the extension repo for exactly this lane; the entrypoint runs it
      # once against an empty DB, then removes install/. Dev-only literals
      # (sysadmin/adminadmin) live in that file, not here.
      PHPBB_INSTALL_CONFIG: /var/www/html/ext/hugmesh/forumapi/docker/install-config.compose.yml
      # The extension validates the Casdoor JWT server-side and fails CLOSED, so
      # both must be right or every API call 401s. JWKS is fetched in-network from
      # the casdoor container; the issuer must match the `iss` claim the browser's
      # token actually carries, which is the PUBLISHED issuer, not the in-network
      # DNS name — same split the BFFs use above.
      HUGMESH_JWKS_URI: "http://casdoor:8000/.well-known/jwks"
      HUGMESH_JWT_ISSUER: ${CASDOOR_ISSUER_URI:-http://localhost:8000}
    depends_on:
      phpbb-db: { condition: service_healthy }
    # Published for direct access; the gateway also serves it at /social/phpbb/.
    ports: ["8081:8080"]

  # ── Akkoma (profile: akkoma) ──────────────────────────────────────────────
  akkoma-db:
    image: postgres:16-alpine
    profiles: ["akkoma"]
    environment:
      POSTGRES_DB: akkoma
      POSTGRES_USER: akkoma
      POSTGRES_PASSWORD: akkoma
    volumes: [akkoma-pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U akkoma"]
      interval: 5s
      retries: 20

  akkoma:
    # UNOFFICIAL community mirror of AkkomaGang/akkoma (upstream publishes no
    # image — see the header). Pinned by DIGEST, not just tag, so the content is
    # immutable even if the tag is force-pushed. v3.20.0.
    image: teslamint/akkoma:v3.20.0@sha256:3b0929d8553bc5f98619f632b4840c09642a863ec16061bd5def6e77518df78c
    profiles: ["akkoma"]
    environment:
      DB_HOST: akkoma-db
      DB_PORT: "5432"
      DB_NAME: akkoma
      DB_USER: akkoma
      DB_PASS: akkoma
      # Akkoma derives every federated URL from these; they must match the host
      # the instance is reached on or ActivityPub ids are generated wrong.
      INSTANCE_NAME: "HugMesh Test (Akkoma)"
      DOMAIN: "localhost"
      ADMIN_EMAIL: admin@hugmesh.local
      NOTIFY_EMAIL: admin@hugmesh.local
    depends_on:
      akkoma-db: { condition: service_healthy }
    volumes:
      # ONE volume at /var/lib/pleroma (the image's data root — it is a Pleroma
      # fork and kept the pleroma paths): it holds uploads/, static/ AND the
      # secret.exs the image GENERATES on first boot (secret_key_base, signing
      # salt, VAPID keypair). Without persistence those are regenerated every
      # start, which invalidates existing sessions and web-push subscriptions.
      - akkoma-data:/var/lib/pleroma
      # Imported last by the baked /etc/pleroma/config.exs, so it overrides it.
      # Supplies the upload base_url the image omits — the container exits 1 on
      # boot without it. Read-only: the container must never rewrite its own
      # committed config.
      - ./akkoma/config.exs:/var/lib/pleroma/config.exs:ro
    # The image entrypoint waits for postgres and runs `pleroma_ctl migrate`
    # itself, so no init sidecar is needed (unlike mastodon-init).
    ports: ["4001:4000"]

volumes:
  phpbb-pg:
  akkoma-pg:
  akkoma-data:
