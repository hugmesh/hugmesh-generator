# compose.m2-local.yaml — COLD-BUILD override: thread the LOCAL private-maven
# registry (tests/stack/m2-bootstrap.sh) into EVERY Java service whose Dockerfile
# resolves org-private systems.hugmesh:* artifacts via its committed settings.xml
# (${env.CI_API_V4_URL}/groups/${env.GITLAB_GROUP_ID}/-/packages/maven).
# Everything else in compose.local.yaml is untouched.
#
# "Every" is load-bearing: the forum/wiki/owncast/tube BFFs were added to
# compose.local.yaml after this override was written and were silently left out,
# so a cold build reached them with an EMPTY CI_API_V4_URL, resolved
# systems.hugmesh:hugmesh-parent against a nonsense URL, and failed — after the
# four wired services had already built. They parent on hugmesh-parent 2.8.0 and
# take the same two ARGs as the original four; there is nothing service-specific
# here. studio/tests/test_local_mesh_source_axis.py cross-checks this file
# against the cloned Dockerfiles whenever .stack-src is populated.
#
# The gateway trio and hugmesh-api are here for a second-order reason: their
# repos depend on systems.hugmesh:hugmesh-commons but ship NO settings.xml and
# declare NO build args, so scripts/patch-stack-src.sh injects both into the
# cloned checkout (see wire_local_maven_registry there). Once patched they are
# ordinary consumers of these two args — and the ONE image the gateway trio
# shares is built three times, once per service, so all three need them.
#
# NOT included by hand: `make stack-up`/`stack-build` auto-append
#   --env-file tests/stack/.m2-registry.env -f tests/stack/compose.m2-local.yaml
# whenever the env file exists — i.e. whenever `make stack-m2-bootstrap` has
# run. The env file (gitignored) carries CI_API_V4_URL (the registry
# container's docker-bridge IP — host-bound ports are not reachable from build
# containers on some hosts, so the registry is itself a container) and
# GITLAB_GROUP_ID.
#
# WHY THERE IS NO `environment:` ANYWHERE IN THIS FILE (and why runtime env such
# as the gateway APP_MFA_* trio must NOT be copied here for "parity"): this file is
# a BUILD-time override only — `build.context` + `build.args`. Compose deep-merges
# `-f compose.local.yaml -f compose.m2-local.yaml`, so every service here INHERITS
# compose.local.yaml's entire `environment:` map unchanged. Re-declaring a runtime
# var here would be dead duplication and a second place to drift out of sync.
# tests/stack/test-gateway-mfa-env.sh asserts this file stays env-free.
#
# No ci_job_token secret is wired: every Dockerfile guards the secret mount
# (`if [ -f /run/secrets/ci_job_token ]`) and the static registry ignores auth
# headers, so builds succeed without any token. BuildKit itself (the
# `# syntax=docker/dockerfile:1.7` + secret-mount syntax) is enabled by the
# Makefile exporting DOCKER_BUILDKIT=1 on every stack compose call.
services:
  hugmesh-federation-api:
    build:
      context: ${STACK_SRC:-../../.stack-src}/hugmesh-federation-api
      args:
        CI_API_V4_URL: ${CI_API_V4_URL:?private-maven registry not bootstrapped - run 'make stack-m2-bootstrap' first}
        GITLAB_GROUP_ID: ${GITLAB_GROUP_ID:-1}

  hugmesh-admin-bff-api:
    build:
      context: ${STACK_SRC:-../../.stack-src}/hugmesh-admin-bff-api
      args:
        CI_API_V4_URL: ${CI_API_V4_URL:?private-maven registry not bootstrapped - run 'make stack-m2-bootstrap' first}
        GITLAB_GROUP_ID: ${GITLAB_GROUP_ID:-1}

  hugmesh-mod-bff-api:
    build:
      context: ${STACK_SRC:-../../.stack-src}/hugmesh-mod-bff-api
      args:
        CI_API_V4_URL: ${CI_API_V4_URL:?private-maven registry not bootstrapped - run 'make stack-m2-bootstrap' first}
        GITLAB_GROUP_ID: ${GITLAB_GROUP_ID:-1}

  hugmesh-user-bff-api:
    build:
      context: ${STACK_SRC:-../../.stack-src}/hugmesh-user-bff-api
      args:
        CI_API_V4_URL: ${CI_API_V4_URL:?private-maven registry not bootstrapped - run 'make stack-m2-bootstrap' first}
        GITLAB_GROUP_ID: ${GITLAB_GROUP_ID:-1}

  hugmesh-forum-bff-api:
    build:
      context: ${STACK_SRC:-../../.stack-src}/hugmesh-forum-bff-api
      args:
        CI_API_V4_URL: ${CI_API_V4_URL:?private-maven registry not bootstrapped - run 'make stack-m2-bootstrap' first}
        GITLAB_GROUP_ID: ${GITLAB_GROUP_ID:-1}

  hugmesh-wiki-bff-api:
    build:
      context: ${STACK_SRC:-../../.stack-src}/hugmesh-wiki-bff-api
      args:
        CI_API_V4_URL: ${CI_API_V4_URL:?private-maven registry not bootstrapped - run 'make stack-m2-bootstrap' first}
        GITLAB_GROUP_ID: ${GITLAB_GROUP_ID:-1}

  hugmesh-owncast-bff-api:
    build:
      context: ${STACK_SRC:-../../.stack-src}/hugmesh-owncast-bff-api
      args:
        CI_API_V4_URL: ${CI_API_V4_URL:?private-maven registry not bootstrapped - run 'make stack-m2-bootstrap' first}
        GITLAB_GROUP_ID: ${GITLAB_GROUP_ID:-1}

  hugmesh-tube-bff-api:
    build:
      context: ${STACK_SRC:-../../.stack-src}/hugmesh-tube-bff-api
      args:
        CI_API_V4_URL: ${CI_API_V4_URL:?private-maven registry not bootstrapped - run 'make stack-m2-bootstrap' first}
        GITLAB_GROUP_ID: ${GITLAB_GROUP_ID:-1}

  # Joined the default set when the `charforge` opt-in profile came off (its repo
  # finished the Snapdragon->HugMesh rebrand, so it cold-builds like its siblings).
  # Ordinary consumer: parents on hugmesh-parent 2.8.0, ships its own settings.xml
  # and declares both ARGs. Only the BFF image builds from this checkout ROOT — the
  # character-forge UI builds from its frontend/ subdir, an Angular image that
  # resolves nothing from maven and so is deliberately NOT listed here.
  hugmesh-character-forge-bff-api:
    build:
      context: ${STACK_SRC:-../../.stack-src}/hugmesh-character-forge-bff-api
      args:
        CI_API_V4_URL: ${CI_API_V4_URL:?private-maven registry not bootstrapped - run 'make stack-m2-bootstrap' first}
        GITLAB_GROUP_ID: ${GITLAB_GROUP_ID:-1}

  hugmesh-pki-gateway:
    build:
      context: ${STACK_SRC:-../../.stack-src}/hugmesh-gateway
      args:
        CI_API_V4_URL: ${CI_API_V4_URL:?private-maven registry not bootstrapped - run 'make stack-m2-bootstrap' first}
        GITLAB_GROUP_ID: ${GITLAB_GROUP_ID:-1}

  hugmesh-be-gateway:
    build:
      context: ${STACK_SRC:-../../.stack-src}/hugmesh-gateway
      args:
        CI_API_V4_URL: ${CI_API_V4_URL:?private-maven registry not bootstrapped - run 'make stack-m2-bootstrap' first}
        GITLAB_GROUP_ID: ${GITLAB_GROUP_ID:-1}

  hugmesh-fe-gateway:
    build:
      context: ${STACK_SRC:-../../.stack-src}/hugmesh-gateway
      args:
        CI_API_V4_URL: ${CI_API_V4_URL:?private-maven registry not bootstrapped - run 'make stack-m2-bootstrap' first}
        GITLAB_GROUP_ID: ${GITLAB_GROUP_ID:-1}

  hugmesh-api:
    build:
      context: ${STACK_SRC:-../../.stack-src}/hugmesh-actions
      args:
        CI_API_V4_URL: ${CI_API_V4_URL:?private-maven registry not bootstrapped - run 'make stack-m2-bootstrap' first}
        GITLAB_GROUP_ID: ${GITLAB_GROUP_ID:-1}

  # Joined the set when its repo started resolving net.hugmesh:hugmesh-commons for
  # real. It previously declared the PRE-RENAME systems.snapdragon:snapdragon-commons,
  # which is published nowhere — so patch-stack-src.sh DELETED the dependency outright
  # and the build needed no registry at all. Once the checkout tracked main again the
  # dependency became live and resolvable, and the missing entry here surfaced as
  #   Could not transfer ... from/to gitlab-maven (/groups//-/packages/maven)
  # — the empty interpolations of the two args this file exists to supply.
  hugmesh-remote-fragment:
    build:
      context: ${STACK_SRC:-../../.stack-src}/hugmesh-remote-fragment
      args:
        CI_API_V4_URL: ${CI_API_V4_URL:?private-maven registry not bootstrapped - run 'make stack-m2-bootstrap' first}
        GITLAB_GROUP_ID: ${GITLAB_GROUP_ID:-1}
