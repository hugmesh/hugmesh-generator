<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <!-- flat-vector VN background: beach at sunset (no text/image/script) -->
  <rect width="1600" height="180" fill="#8f4f7c"/>
  <rect y="180" width="1600" height="140" fill="#c95f7f"/>
  <rect y="320" width="1600" height="120" fill="#f97e6d"/>
  <rect y="440" width="1600" height="100" fill="#ffb26b"/>
  <!-- sun on the horizon -->
  <circle cx="800" cy="540" r="120" fill="#ffd97a"/>
  <circle cx="800" cy="540" r="160" fill="#ffd97a" opacity="0.25"/>
  <!-- sea -->
  <rect y="540" width="1600" height="200" fill="#35568f"/>
  <rect y="540" width="1600" height="12" fill="#6d7fbf" opacity="0.8"/>
  <rect x="640" y="560" width="320" height="8" rx="4" fill="#ffd97a" opacity="0.7"/>
  <rect x="560" y="596" width="480" height="8" rx="4" fill="#ffb26b" opacity="0.5"/>
  <rect x="180" y="620" width="240" height="7" rx="3" fill="#8fa3d9" opacity="0.5"/>
  <rect x="1120" y="650" width="300" height="7" rx="3" fill="#8fa3d9" opacity="0.5"/>
  <rect x="480" y="668" width="620" height="8" rx="4" fill="#ffb26b" opacity="0.4"/>
  <!-- sand -->
  <path d="M0 740 q400 -40 800 0 q400 40 800 0 l0 160 -1600 0 z" fill="#e8c58f"/>
  <path d="M0 760 q400 -36 800 4 q400 36 800 -4 l0 20 q-400 36 -800 4 q-400 -36 -800 -4 z" fill="#d9ae74" opacity="0.6"/>
  <!-- palm silhouette -->
  <path d="M240 880 q30 -220 -30 -330 l44 -8 q70 130 40 338 z" fill="#2b2138"/>
  <path d="M250 550 q-90 -60 -190 -30 q80 -60 190 -14 z" fill="#2b2138"/>
  <path d="M250 550 q-40 -100 -140 -130 q110 0 170 96 z" fill="#2b2138"/>
  <path d="M256 546 q30 -104 130 -130 q-84 88 -86 140 z" fill="#2b2138"/>
  <path d="M258 552 q100 -40 180 20 q-100 -16 -180 20 z" fill="#2b2138"/>
  <!-- gulls -->
  <path d="M1080 240 q20 -18 40 0 q20 -18 40 0" stroke="#3c2b45" stroke-width="6" fill="none"/>
  <path d="M1220 300 q16 -14 32 0 q16 -14 32 0" stroke="#3c2b45" stroke-width="5" fill="none"/>
  <!-- beach ball -->
  <circle cx="1310" cy="800" r="44" fill="#f2f2f2"/>
  <path d="M1310 756 a44 44 0 0 1 0 88 q-20 -44 0 -88" fill="#e86a8a"/>
  <path d="M1310 756 a44 44 0 0 0 0 88 q20 -44 0 -88" fill="#5a8fd9"/>
</svg>
