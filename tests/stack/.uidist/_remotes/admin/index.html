       (`ng serve admin`, the @offline e2e lane) — favicon.ico is the canonical
       multi-resolution platform icon copied from the host shell's src/. -->
  <title>HugMesh Admin (remote)</title>

  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="description" content="HugMesh platform administration console"/>
  <meta name="theme-color" content="#0a0a12"/>

  <!-- Runtime THEME (colours + fonts), written at container start by
       docker-entrypoint.d/50-snap-theme.sh from SNAP_THEME_CSS and served from
       /tmp via the nginx.conf exact-match alias (the docroot is root-owned
       under the unprivileged base, uid 101). Carries ALREADY-DERIVED sd token
       text under a doubled ":root:root" selector, which out-specifies the
       compiled :root fallbacks in the Angular-injected stylesheet — the index
       writer appends its styles bundle link AFTER this line, right before the
       closing head tag — so the theme wins regardless of which sheet the
       browser loads last. Empty (zero-byte) on unbranded deploys, so the
       shipped defaults render. RELATIVE path (no leading slash) so it resolves
       against the /admin/ base href; the fe-gateway StripPrefix=1 maps
       /admin/snap-theme.css back to /snap-theme.css on this container. -->
  <link rel="stylesheet" href="snap-theme.css"/>
