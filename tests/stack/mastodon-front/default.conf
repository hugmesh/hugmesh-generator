# mastodon-front/default.conf — ONE origin for the compose lane's Mastodon:
# Rails (mastodon-web:3000) and the streaming server (mastodon-streaming:4000)
# behind a single front, the way every real Mastodon is deployed (upstream's
# dist/nginx.conf does the same split). user-bff-api's hsproxy and media proxy
# talk to THIS, not to mastodon-web (tests/stack/compose.local.yaml,
# APP_HS_TOKEN_MASTODON_URL / MEDIA_PROXY_MASTODON_BASE_URL). The cluster has the
# same shape: user-bff -> akkoma-proxy:4443 -> Akkoma. The fe/be gateway routes
# for native clients (Tusky/Ivory) still go straight to mastodon-web; nothing on
# them changes here.
#
# It fixes two defects the browser saw on /social/mastodon (GUI-35):
#
# 1. LIVE UPDATES NEVER CONNECTED. The hsproxy forwards
#    /bff/user/mastodon/api/v1/streaming/user to its ONE upstream. When that was
#    mastodon-web, Rails answered (Api::V1::StreamingController)
#      301 Location: https://localhost/api/v1/streaming/user
#    because Rails does not serve the streaming API. That target is another
#    origin, so mastodon-ui reported "the streaming endpoint redirected away from
#    this origin" and polled every 30 s instead. The streaming location below
#    sends that path to the streaming server, which answers 200
#    text/event-stream.
#
# 2. AVATARS, HEADERS AND MEDIA DID NOT LOAD on any door but localhost:8488.
#    Mastodon builds every asset URL from its own host, https://LOCAL_DOMAIN
#    (Rails root_url): https://localhost/avatars/original/missing.png,
#    https://localhost/system/media_attachments/... . LOCAL_DOMAIN stays
#    `localhost` on purpose: it is the account's federation identity
#    (tests/stack/gen-mastodon-env.sh). No other host works either, because this
#    lane has many doors at once: localhost:8088 and localhost:8488, the
#    `make view` doors on 127.0.0.1:9090 and 9091 (Host hugmesh.net), the Studio's
#    per-domain doors and the onion. One absolute host serves one of them. So the
#    front rewrites the media URLs to the ROOT-RELATIVE path the browser already
#    reaches Mastodon through, /bff/user/mastodon/<same path>. A relative URL
#    resolves against whichever door the page came from. The hsproxy strips
#    /bff/user/mastodon again and mastodon-web serves the bytes (the image runs
#    with RAILS_SERVE_STATIC_FILES=true).
#
#    The rewrite matches the MEDIA path prefixes only. Account `url`/`uri`
#    (https://localhost/@alice, https://localhost/users/alice) are identity and
#    permalinks, and links inside post HTML are links. They pass through
#    unchanged.
#
#    `localhost` below MUST equal the LOCAL_DOMAIN that gen-mastodon-env.sh writes.
#    tests/stack/test-mastodon-front.sh checks the two agree. An operator who sets a
#    different LOCAL_DOMAIN in their own .mastodon.env gets no rewrite, so the URLs
#    keep their old absolute form and nothing breaks that was not already broken.

# WebSocket upgrade pass-through for /api/v1/streaming (map is http{}-scope;
# conf.d files are included there). "" for plain requests keeps keep-alive.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 8080;
    server_name _;

    # Re-resolve the upstreams per request (Docker's embedded DNS), never pin
    # the IP they had when nginx started. A recreated mastodon-web gets a new
    # bridge IP, and a literal proxy_pass host would keep dialling the old one.
    # This is the same trap and the same idiom as tls-front/default.conf.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $mastodon_web mastodon-web;
    set $mastodon_streaming mastodon-streaming;

    # Media uploads (POST /api/v2/media) come through here now. nginx's default
    # limit is 1m, which would 413 uploads that reached mastodon-web before.
    # Mastodon's own limit is 99 MB for video.
    client_max_body_size 100m;

    proxy_http_version 1.1;
    # PINNED, not $http_host. Rails HostAuthorization admits only LOCAL_DOMAIN,
    # WEB_DOMAIN and ALTERNATE_DOMAINS, and gen-mastodon-env.sh puts exactly
    # `mastodon-web:3000` in ALTERNATE_DOMAINS. The client dials
    # `mastodon-front:8080`, and gen-mastodon-env.sh never rewrites a key that is
    # already set, so forwarding that Host would 403 every request on every
    # existing checkout.
    proxy_set_header Host mastodon-web:3000;
    # Mastodon's production force_ssl redirects any request it believes arrived
    # over plain http. TLS ends at the front door, so https is the truth.
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # sub_filter can only rewrite a body it can read. Ask the upstream for
    # identity encoding so a future gzip-enabled image cannot turn the rewrite
    # into a silent no-op.
    proxy_set_header Accept-Encoding "";
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # The media-URL rewrite (defect 2). It applies to API JSON and to the
    # streaming server's event-stream (a live `update` frame carries the same
    # account/media URLs). text/html is always included by nginx.
    sub_filter_types application/json text/event-stream;
    sub_filter_once off;
    sub_filter 'https://localhost/system/'  '/bff/user/mastodon/system/';
    sub_filter 'https://localhost/avatars/' '/bff/user/mastodon/avatars/';
    sub_filter 'https://localhost/headers/' '/bff/user/mastodon/headers/';
    sub_filter 'https://localhost/packs/'   '/bff/user/mastodon/packs/';

    location / {
        proxy_pass http://$mastodon_web:3000$request_uri;
    }

    # The streaming API (defect 1). Prefix match, no regex, so it wins over `/`
    # for /api/v1/streaming, /api/v1/streaming/user, ?stream=... and so on.
    location ^~ /api/v1/streaming {
        proxy_pass http://$mastodon_streaming:4000$request_uri;
        # An event-stream must reach the client frame by frame. With buffering on,
        # nginx would hold frames until its buffer filled.
        proxy_buffering off;
        # The streaming server writes a heartbeat (":thump") every 15 s. These only
        # bound a stream that has gone completely silent.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
