# HugMesh Image Studio — installer build, signing and release
# (Windows MSI, Linux Flatpak for x86_64 and aarch64, Linux PyInstaller tarball).
#
# THIS IS A NEW PATTERN FOR THIS ORG, deliberately. Every other release.yml in the
# fleet means "build a container image and push it to GHCR". This workflow publishes
# real downloadable installers, because that is what a Downloads page on a public docs
# site needs and a container image cannot be one.
#
# HOW A RELEASE IS CUT (2026-10-28): `scripts/release-studio.sh <version>` on a
# terminal, or Actions > "Cut a Studio release" in the browser. Both drive
# studio-release-cut.yml, which bumps __version__ on main, creates the studio-v<version>
# tag ON GITHUB and dispatches THIS workflow on that tag with publish=true. Nobody
# needs to push a tag by hand any more, though a hand-pushed tag still works.
#
# THE SITE'S DATA FILE: the Downloads page on hugmesh.github.io renders from its
# `src/assets/releases.json`, which the site's own pages.yml rebuilds from the GitHub
# Releases API (hourly cron, a `releases-updated` repository_dispatch, or a manual
# run of pages.yml). Nobody writes that file by hand. The publish job below still
# attaches a `releases.json` to the release (the same shape, plus the signature
# material) and sends the dispatch when SITE_DISPATCH_TOKEN exists; without the
# secret the site catches up within the hour.
#
# TRIGGER: workflow_dispatch, plus a `studio-v*` tag. A run on a tag ref is the
# publish decision; a dispatch on main is a build-only rehearsal.
#
# BETA SCHEME (org-wide, 2026-10-21). __version__ is MAJOR.MINOR.PATCH-beta.N. Only a
# run on a `studio-v<version>` tag ref publishes (a tag push, or a dispatch ON the tag
# with "publish" ticked, which is what the cut workflow does). A dispatch on main builds
# all three packages and stops there; with "publish" ticked on main the version job
# fails in seconds instead of building for 40 minutes and then skipping. Any other ref
# is refused by the version job. A release whose version has a "-" is marked
# pre-release and is never made "latest".
#
# RE-PUBLISHING IS EXPLICIT (2026-10-28). The publish job's first step fails RED when
# the release already exists, unless the run was dispatched with `republish=true`
# (scripts/release-studio.sh <version> --republish, or the cut form with republish
# ticked and the version typed into confirm). A republish replaces every file of the
# release with new bytes, so every checksum, signature and attestation changes and
# anyone who downloaded earlier can no longer verify what they have; the release
# notes and the run summary then say so. The old green-skip gates (eleven `if:` lines
# that let a run publish nothing and still pass) are gone: they were deleted by hand on
# main on 2026-10-22, and a green skip is exactly what nobody notices.
#
# RUNNERS: GITHUB-HOSTED ONLY (operator rule, 2026-10-21). Every download that is
# published must be built and signed on GitHub's own runners. So every job here names
# a hosted image literally and nothing reads RUNS_ON or RUNS_ON_PUBLISH: a variable
# pointing at the self-hosted runner can no longer move the build or the signing onto
# a machine nobody can audit (and once the repository is public, the self-hosted
# runner group refuses public repositories, so such a job would queue forever).
# The release notes tell users to verify with --deny-self-hosted-runners.
#
# SIGNING (all in the publish job, all BEFORE the release is created, so a signing
# failure leaves no release behind):
#   * SHA256SUMS lists every published file (installers for every arch, tarball, SBOMs).
#   * cosign signs SHA256SUMS keyless (Sigstore, GitHub OIDC). The bundle
#     SHA256SUMS.sigstore.json carries signature, certificate and transparency-log
#     entry. The job verifies its own signature against the exact workflow identity
#     before going on.
#   * actions/attest-build-provenance attests every file in release/ (SLSA build
#     provenance, stored by GitHub and in the public Sigstore log).
#   * Authenticode (MSI job) runs only when the STUDIO_AUTHENTICODE_PFX_BASE64 secret
#     is set. Until then the MSI is not code-signed and SmartScreen warns; the release
#     notes and releases.json say which of the two happened.
# PINNING: every action in this file is pinned to a full commit SHA, with the tag it
# was resolved from as a comment. The build jobs' outputs are what the publish job
# signs, and the publish job holds contents/id-token/attestations write, so a moved
# tag on any action here could change what gets signed or published.
#
# WHY SIGNING STAYS IN THE PUBLISH JOB: one job holds id-token: write, and it is the
# job that creates the release, so no other job can mint a signing identity. The
# build-provenance attestation still names THIS workflow run (repository, workflow
# file, tag ref, run id, hosted runner), and the files it covers are the ones the
# build jobs uploaded as artifacts of this same run, so provenance binds each file to
# this run even though the bytes were produced one job earlier.
#
# Artifact attestations need a PUBLIC repository on this org's plan: on a private
# repository the attest step fails, the job stops, and nothing is released. That is
# intended: nothing unsigned is published.
name: Studio release (MSI + Flatpak + tarball)

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Create the GitHub Release (only when run on a studio-v* tag). On main this never publishes; to publish run scripts/release-studio.sh or Actions > Cut a Studio release.'
        type: boolean
        default: false
      republish:
        description: 'REPLACE the files of the existing studio-v<version> release with new bytes. Every checksum, signature and attestation changes and anyone who already downloaded can no longer verify what they have. The normal path is the next beta N.'
        type: boolean
        default: false
  push:
    # A tag filter only ever matches tags: 'main' here (added by hand on 2026-10-23)
    # could never fire and only made the trigger look like it covered the branch.
    tags: ['studio-v*']

permissions:
  contents: read

concurrency:
  group: studio-release-${{ github.ref }}
  # NOT cancel-in-progress: a half-cancelled release can leave a tag with some assets
  # attached and others missing, which is worse than a duplicate run.
  cancel-in-progress: false

jobs:
  version:
    # Hosted literally, like every job here (see RUNNERS above). A RUNS_ON_PUBLISH
    # expression here would let one repository variable put the version gate on the
    # self-hosted runner, whose group refuses public repositories: the run would queue
    # forever and nothing would be released.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.read.outputs.version }}
      msi_version: ${{ steps.read.outputs.msi_version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - id: read
        name: Read the version from the source of truth
        # __init__.py's __version__ is the ONE version. The installer filenames, the
        # About box and the release tag all derive from it, so they cannot disagree.
        #
        # msi_version is the MSI's numeric ProductVersion (0.3.0-beta.1 -> 0.3.1). An MSI
        # cannot carry "-beta.N"; packaging/wix/msi_version.py explains the mapping and
        # build-msi-wine.sh calls the same script. It also refuses any version the
        # mapping does not know (a -SNAPSHOT, an -rc), so this step fails first.
        run: |
          version=$(python3 -c "import re,pathlib; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('studio/hugmesh_studio/__init__.py').read_text()).group(1))")
          case "$version" in
            *-SNAPSHOT*) echo "::error::__version__ $version is a SNAPSHOT; nothing published may carry one"; exit 1 ;;
          esac
          msi_version=$(python3 studio/packaging/wix/msi_version.py "$version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "msi_version=$msi_version" >> "$GITHUB_OUTPUT"
          echo "Studio version: $version (MSI ProductVersion $msi_version)"

      - name: Refuse any ref other than main or a studio-v* tag
        # The beta scheme's trigger split: a tag publishes, main only builds, and
        # nothing else runs at all (a feature branch would otherwise build installers
        # that look like release candidates).
        env:
          REF: ${{ github.ref }}
        run: |
          case "$REF" in
            refs/heads/main|refs/tags/studio-v*) echo "ref $REF accepted" ;;
            *) echo "::error::studio-release runs only on main or on a studio-v* tag, not on $REF"; exit 1 ;;
          esac

      - name: Tag must match the version it claims to release
        if: startsWith(github.ref, 'refs/tags/studio-v')
        run: |
          tag="${GITHUB_REF_NAME#studio-v}"
          if [ "$tag" != "${{ steps.read.outputs.version }}" ]; then
            echo "::error::tag studio-v$tag does not match __version__ ${{ steps.read.outputs.version }}"
            exit 1
          fi

      - name: A publish from main is impossible
        # Red in seconds, not a 40-minute build that then skips the publish job: a
        # dispatch on main with "publish" ticked is the mistake of 2026-10-22, and a
        # green run that published nothing is what made it hard to see.
        if: inputs.publish == true && !startsWith(github.ref, 'refs/tags/studio-v')
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error::publish was ticked on $REF, which never publishes. To release: scripts/release-studio.sh <version>, or Actions > Cut a Studio release"
          exit 1

      - name: Say whether this run will publish
        if: always()
        env:
          REF: ${{ github.ref }}
          EVENT: ${{ github.event_name }}
          PUBLISH: ${{ inputs.publish }}
          REPUBLISH: ${{ inputs.republish }}
        run: |
          # No `$( [ ... ] && ... )` here: under `bash -e` a false test inside a
          # substitution fails the assignment and the job, which killed every tag push.
          extra=""
          if [ "$PUBLISH" = "true" ]; then extra=", publish=true"; fi
          case "$REF" in
            refs/tags/studio-v*)
              if [ "$EVENT" = "push" ] || [ "$PUBLISH" = "true" ]; then
                verdict="WILL publish (tag ref; ${EVENT} event${extra})"
              else
                verdict="WILL NOT publish (tag ref, but publish was not ticked)"
              fi ;;
            *) verdict="WILL NOT publish ($REF is not a studio-v* tag; only a tag ref publishes)" ;;
          esac
          echo "ref=$REF, event=$EVENT, publish=${PUBLISH:-false}, republish=${REPUBLISH:-false}: this run $verdict" | tee -a "$GITHUB_STEP_SUMMARY"

  msi:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      # "true" only when the Authenticode steps below actually signed the exe and the MSI.
      authenticode: ${{ steps.authenticode.outputs.enabled }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      # The numeric ProductVersion for `-define Version=`; the file name keeps VERSION.
      MSI_VERSION: ${{ needs.version.outputs.msi_version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: studio/packaging/wix/windows-build-requirements.txt

      - name: Install the hash-locked build dependencies
        # The SAME lock build-msi-wine.sh installs (PyInstaller, PySide6, Pillow, tzdata
        # and their dependencies, every wheel pinned by SHA-256), so the Wine dry run
        # and this build freeze the same packages, and pip refuses any file PyPI serves
        # that is not the one recorded. The studio package itself is NOT installed: the
        # spec freezes the checkout's own copy (pathex), exactly as under Wine.
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r studio/packaging/wix/windows-build-requirements.txt
          python -m pip freeze

      - name: Render the application icon
        working-directory: studio
        # Qt's `windows` platform, not gen_icons.py's `offscreen` default: offscreen has
        # no fonts, so the mark's "S" is drawn as an empty box (measured under Wine; see
        # packaging/wix/README.md). gen_icons.py only setdefault()s the variable, so
        # setting it here is enough and the script is unchanged.
        env:
          QT_QPA_PLATFORM: windows
        run: python packaging/gen_icons.py --out build/icons

      - name: Check the icon has its letter
        working-directory: studio
        # An empty box has ~0 white pixels in the centre, a bold sans "S" several
        # thousand. This is the guard build-msi-wine.sh applies before freezing.
        run: python packaging/check_icon.py build/icons/icon-256.png

      - name: Freeze with PyInstaller
        working-directory: studio
        env:
          HUGMESH_STUDIO_ICON: build/icons/hugmesh-studio.ico
        run: pyinstaller --noconfirm --clean packaging/hugmesh-studio.spec

      - name: Smoke-test the frozen binary
        working-directory: studio
        # --print-specs is the app's Qt-FREE path, so this proves the bundle's Python
        # side is complete without needing a display. A bundle missing
        # core/progress-tables.json fails right here, at import time, which is exactly
        # where it should fail rather than on a user's desktop.
        #
        # Start-Process, not `exe > specs.json`: the exe is a WINDOWED (console=False)
        # executable. PowerShell neither waits for such a process nor hands it a valid
        # stdout, so a plain redirect left it with "OSError: [Errno 22]" and an empty
        # file (run 37690716536). Start-Process wires the file handles itself and waits.
        # The timeout is there because a bundle that cannot import hangs on an error
        # dialog instead of exiting (measured under Wine; see packaging/wix/README.md).
        run: |
          $exe = (Resolve-Path dist\hugmesh-studio\hugmesh-studio.exe).Path
          $p = Start-Process -FilePath $exe -ArgumentList '--print-specs' `
            -RedirectStandardOutput specs.json -RedirectStandardError specs.err `
            -NoNewWindow -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "--print-specs did not exit within 120 s" }
          if ($p.ExitCode -ne 0) { Get-Content specs.err; throw "--print-specs exited $($p.ExitCode)" }
          if ((Get-Item specs.json).Length -eq 0) { Get-Content specs.err; throw "no output from --print-specs" }
          Get-Content specs.json -TotalCount 3
        shell: pwsh

      - name: Authenticode — is a signing certificate configured?
        # OPTIONAL, and off until the operator adds the secret. No certificate or
        # signing service exists for this org today, and none is invented here.
        #   STUDIO_AUTHENTICODE_PFX_BASE64    base64 of a code-signing .pfx
        #   STUDIO_AUTHENTICODE_PFX_PASSWORD  its password
        #   vars.STUDIO_AUTHENTICODE_TIMESTAMP_URL  RFC 3161 server (default DigiCert's)
        # A secret cannot be tested in an `if:`, so this step turns "is it set" into an
        # output. A cloud signing service (SignPath for open source, Azure Trusted
        # Signing) would replace the two signing steps below at the same two places.
        id: authenticode
        env:
          PFX_B64: ${{ secrets.STUDIO_AUTHENTICODE_PFX_BASE64 }}
        run: |
          if ($env:PFX_B64) {
            "enabled=true" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
            Write-Host "Authenticode signing is configured; the exe and the MSI will be signed."
          } else {
            "enabled=false" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
            Write-Host "::notice::STUDIO_AUTHENTICODE_PFX_BASE64 is not set: the MSI is NOT code-signed and SmartScreen will warn. Provenance and cosign signatures are still produced."
          }
        shell: pwsh

      - name: Authenticode — sign the executable
        # Before WiX packs it, so the installed program carries the signature too.
        if: steps.authenticode.outputs.enabled == 'true'
        working-directory: studio
        env:
          PFX_B64: ${{ secrets.STUDIO_AUTHENTICODE_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.STUDIO_AUTHENTICODE_PFX_PASSWORD }}
          TIMESTAMP_URL: ${{ vars.STUDIO_AUTHENTICODE_TIMESTAMP_URL || 'http://timestamp.digicert.com' }}
          TARGET: dist\hugmesh-studio\hugmesh-studio.exe
        run: |
          $target = $env:TARGET
          if (-not (Test-Path $target)) { throw "nothing to sign at $target" }
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found in the Windows SDK" }
          $pfx = Join-Path $env:RUNNER_TEMP "authenticode.pfx"
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_B64))
            & $signtool.FullName sign /fd SHA256 /f $pfx /p $env:PFX_PASSWORD /tr $env:TIMESTAMP_URL /td SHA256 /d "HugMesh Image Studio" $target
            if ($LASTEXITCODE -ne 0) { throw "signtool sign failed ($LASTEXITCODE) on $target" }
            & $signtool.FullName verify /pa /v $target
            if ($LASTEXITCODE -ne 0) { throw "signtool verify failed ($LASTEXITCODE) on $target" }
          } finally {
            Remove-Item -Force -ErrorAction SilentlyContinue $pfx
          }
        shell: pwsh

      - name: Build the licence page
        working-directory: studio
        run: python packaging/wix/make_license_rtf.py --in ../LICENSE --out build/License.rtf

      - name: Install WiX
        # PINNED, and the extension at the SAME version. An unpinned `dotnet tool
        # install` gets WiX 7, which refuses to run (WIX7015) until the project owner
        # accepts the Open Source Maintenance Fee EULA; 6.0.2 is the last release before
        # that gate. An unpinned extension would pull 7.0.0 into a 6.x tool (WIX6101).
        # There is no harvest step: no wix release has a `harvest` command, and
        # packaging/wix/Files.wxs (committed) expands the frozen tree at build time
        # with WiX's own <Files> element.
        run: |
          dotnet tool install --global wix --version 6.0.2
          wix --version
          wix extension add -g WixToolset.UI.wixext/6.0.2
          wix extension list -g
        shell: pwsh

      - name: Build the MSI
        working-directory: studio
        # AppDir is passed absolute so it does not depend on how Files.wxs resolves a
        # relative path. Same arguments as the Wine-tested recipe in build-msi-wine.sh.
        run: |
          $appDir = (Resolve-Path dist/hugmesh-studio).Path
          wix build -arch x64 `
            -define Version=$env:MSI_VERSION `
            -define IconFile=build/icons/hugmesh-studio.ico `
            -define LicenseFile=build/License.rtf `
            -define AppDir=$appDir `
            -ext WixToolset.UI.wixext `
            -out "hugmesh-studio-$env:VERSION-x64.msi" `
            packaging/wix/Package.wxs packaging/wix/Files.wxs
          if ($LASTEXITCODE -ne 0) { throw "wix build failed ($LASTEXITCODE)" }
          if (-not (Test-Path "hugmesh-studio-$env:VERSION-x64.msi")) { throw "no MSI was written" }
          Get-Item "hugmesh-studio-$env:VERSION-x64.msi" | Format-List Name, Length
        shell: pwsh

      - name: Authenticode — sign the MSI
        # Before the checksum: the published hash, SHA256SUMS and the attestation must
        # all be of the signed bytes.
        if: steps.authenticode.outputs.enabled == 'true'
        working-directory: studio
        env:
          PFX_B64: ${{ secrets.STUDIO_AUTHENTICODE_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.STUDIO_AUTHENTICODE_PFX_PASSWORD }}
          TIMESTAMP_URL: ${{ vars.STUDIO_AUTHENTICODE_TIMESTAMP_URL || 'http://timestamp.digicert.com' }}
          TARGET: hugmesh-studio-${{ env.VERSION }}-x64.msi
        run: |
          $target = $env:TARGET
          if (-not (Test-Path $target)) { throw "nothing to sign at $target" }
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found in the Windows SDK" }
          $pfx = Join-Path $env:RUNNER_TEMP "authenticode.pfx"
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_B64))
            & $signtool.FullName sign /fd SHA256 /f $pfx /p $env:PFX_PASSWORD /tr $env:TIMESTAMP_URL /td SHA256 /d "HugMesh Image Studio" $target
            if ($LASTEXITCODE -ne 0) { throw "signtool sign failed ($LASTEXITCODE) on $target" }
            & $signtool.FullName verify /pa /v $target
            if ($LASTEXITCODE -ne 0) { throw "signtool verify failed ($LASTEXITCODE) on $target" }
          } finally {
            Remove-Item -Force -ErrorAction SilentlyContinue $pfx
          }
        shell: pwsh

      - name: Checksum
        working-directory: studio
        run: |
          $file = "hugmesh-studio-$env:VERSION-x64.msi"
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
          "$hash  $file" | Out-File -Encoding ascii "$file.sha256"
          Write-Host "$hash  $file"
        shell: pwsh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: msi
          path: |
            studio/hugmesh-studio-*.msi
            studio/hugmesh-studio-*.msi.sha256
          if-no-files-found: error

  linux:
    needs: version
    # A PyInstaller "onedir" bundle for Linux desktops without Flatpak. It links
    # against the build host's glibc, so it runs on glibc 2.39 or newer (Ubuntu 24.04,
    # Debian 13, Fedora 40 and later); older systems use the Flatpak. Pinned to the
    # image, not ubuntu-latest, so that floor does not move silently.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'

      - name: Install the Qt runtime libraries PyInstaller's PySide6 hook loads
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install the pinned build dependencies into a build venv
        # Same versions as the Windows lock (packaging/wix/windows-build-requirements.txt),
        # wheels only. The venv is what the SBOM below describes.
        run: |
          python -m venv .build-venv
          .build-venv/bin/python -m pip install --only-binary=:all: -r studio/packaging/linux-build-requirements.txt
          .build-venv/bin/python -m pip freeze

      - name: Freeze with PyInstaller
        working-directory: studio
        # Same spec as Windows. No HUGMESH_STUDIO_ICON: a Linux executable has no
        # embedded icon.
        run: ../.build-venv/bin/pyinstaller --noconfirm --clean packaging/hugmesh-studio.spec

      - name: Smoke-test the frozen binary
        working-directory: studio
        # --print-specs is the Qt-free path: it fails at import time on a bundle that
        # is missing any of the package-data files.
        run: |
          ./dist/hugmesh-studio/hugmesh-studio --print-specs > specs.json
          if [ ! -s specs.json ]; then
            echo "::error::no output from --print-specs: the frozen bundle is incomplete"
            exit 1
          fi
          head -c 400 specs.json; echo

      - name: Pack the tarball
        working-directory: studio
        # Reproducible: sorted names, numeric root ownership, every mtime set to the
        # commit's time, and gzip without its own timestamp.
        run: |
          name="hugmesh-studio-${VERSION}-linux-x86_64"
          epoch=$(git log -1 --format=%ct)
          rm -rf "pack/$name" && mkdir -p pack
          cp -a dist/hugmesh-studio "pack/$name"
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime="@$epoch" \
            -C pack -cf - "$name" | gzip -n -9 > "$name.tar.gz"
          sha256sum "$name.tar.gz" | tee "$name.tar.gz.sha256"

      - name: SBOM of the Python packages the bundle was frozen from
        # "Where cheap": a failing SBOM tool must not hold the release back. The
        # publish job lists whatever SBOMs exist; releases.json links only those.
        continue-on-error: true
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
        with:
          path: .build-venv
          format: spdx-json
          output-file: studio/hugmesh-studio-${{ env.VERSION }}-linux-x86_64.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: linux
          path: |
            studio/hugmesh-studio-*-linux-x86_64.tar.gz
            studio/hugmesh-studio-*-linux-x86_64.tar.gz.sha256
            studio/hugmesh-studio-*-linux-x86_64.spdx.json
          if-no-files-found: error

  flatpak:
    needs: version
    # Hosted on purpose: `sudo apt-get` below cannot run on the Gentoo self-hosted runner.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Install flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder appstream desktop-file-utils
          flatpak remote-add --if-not-exists --user flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Validate the desktop entry and AppStream metadata
        working-directory: studio/packaging/flatpak
        # --no-net: the only remaining validator complaints are URL-reachability
        # checks against hugmesh.net (not yet deployed). Failing a build because a
        # documentation URL is not public yet would be noise, while every structural
        # check still runs.
        run: |
          desktop-file-validate org.hugmesh.ImageStudio.desktop
          appstreamcli validate --no-net org.hugmesh.ImageStudio.metainfo.xml

      - name: Install the runtime
        # The branch is the manifest's runtime-version; tests/test_flatpak_packaging_files.py
        # holds the two together. Flathub lists 6.8 and 6.9 as end-of-life (2026-10-29).
        run: |
          flatpak install --user -y flathub org.kde.Platform//6.11 org.kde.Sdk//6.11

      - name: Build the Flatpak
        working-directory: studio/packaging/flatpak
        run: |
          flatpak-builder --user --disable-rofiles-fuse --force-clean \
            --repo=repo build-dir org.hugmesh.ImageStudio.yml

      - name: Export a single-file bundle
        working-directory: studio/packaging/flatpak
        # A .flatpak BUNDLE rather than a Flathub submission: HugMesh's own governed
        # desktops actively remove the flathub remote
        # (keys-template/desktop-governance/flatpak/flathub-disable.conf), so Flathub
        # is not a delivery path for the machines most likely to want this.
        #
        # --runtime-repo writes a RuntimeRepo key into the bundle: where the runtime
        # (org.kde.Platform) comes from when the installing machine does not have it.
        # Without it the beta.1 bundle failed on a host with no remotes ("requires the
        # runtime org.kde.Platform/x86_64/6.8 which was not found", 2026-10-29); with it
        # `flatpak install` adds that remote to the same installation (user or system)
        # and pulls the runtime first. docs/STUDIO-INSTALLERS.md says what that means on
        # a governed desktop.
        run: |
          flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo repo "hugmesh-studio-${VERSION}-x86_64.flatpak" org.hugmesh.ImageStudio
          sha256sum "hugmesh-studio-${VERSION}-x86_64.flatpak" | tee "hugmesh-studio-${VERSION}-x86_64.flatpak.sha256"

      - name: Smoke-test the bundle
        working-directory: studio/packaging/flatpak
        # THE MSI JOB HAS HAD ONE SINCE IT WAS WRITTEN AND THIS JOB DID NOT, which is
        # how a bundle that died at `import hugmesh_studio.core.config` could have
        # been built, checksummed, uploaded and attached to a release with every step
        # green: core/roles.py read the role vocabulary out of a `scripts/` directory
        # that only exists in a checkout, and `pip3 install --prefix` above ships the
        # package alone. Nothing here builds the app a second time — it INSTALLS the
        # exact artifact that is about to be published and runs it.
        #
        # --print-specs is the app's Qt-FREE path (app.py: model only, no
        # QApplication), so this needs no display and no session bus, and it fails at
        # IMPORT time on a bundle missing any of the four package-data files.
        run: |
          flatpak install --user -y --noninteractive \
            "hugmesh-studio-${VERSION}-x86_64.flatpak"
          flatpak run --command=hugmesh-studio org.hugmesh.ImageStudio \
            --print-specs > specs.json
          if [ ! -s specs.json ]; then
            echo "::error::no output from --print-specs — the installed bundle is incomplete"
            exit 1
          fi
          head -c 400 specs.json; echo

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: flatpak
          path: |
            studio/packaging/flatpak/hugmesh-studio-*.flatpak
            studio/packaging/flatpak/hugmesh-studio-*.flatpak.sha256
          if-no-files-found: error

  flatpak-aarch64:
    needs: version
    # The SAME manifest on GitHub's hosted arm64 runner (free for public repositories):
    # python-deps.json pins the aarch64 PySide6 wheels next to the x86_64 ones, and
    # nothing in the manifest names an architecture, so the only differences from the
    # job above are the runner, the bundle's name and the artifact's name. A TWIN JOB
    # rather than a matrix on purpose: the x86_64 job is the proven path and its
    # commands are what tests/test_flatpak_packaging_files.py reads the local build
    # script against; a matrix would have changed every line of it to add one arch.
    #
    # Two checks this job has that the x86_64 one does not: the runner's arch is
    # asserted before anything is built (a mislabelled runner would otherwise export an
    # x86_64 bundle under the aarch64 name and every later check would pass), and Qt is
    # started offscreen inside the installed bundle, because --print-specs is the
    # app's Qt-FREE path and so proves nothing about the aarch64 wheels.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.version.outputs.version }}
      ARCH: aarch64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Install flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder appstream desktop-file-utils
          flatpak remote-add --if-not-exists --user flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: The runner must really be aarch64
        # The bundle's name below is a promise about its contents. `flatpak --default-arch`
        # is what flatpak-builder and build-bundle will use, so it is the fact to check.
        run: |
          have=$(flatpak --default-arch)
          if [ "$have" != "$ARCH" ]; then
            echo "::error::this job builds the $ARCH Flatpak but flatpak's default arch on this runner is $have ($(uname -m))"
            exit 1
          fi
          echo "flatpak default arch: $have ($(uname -m))"

      - name: Validate the desktop entry and AppStream metadata
        working-directory: studio/packaging/flatpak
        run: |
          desktop-file-validate org.hugmesh.ImageStudio.desktop
          appstreamcli validate --no-net org.hugmesh.ImageStudio.metainfo.xml

      - name: Install the runtime
        # The same branch as the x86_64 job: tests/test_flatpak_packaging_files.py reads
        # every org.kde.Platform// and org.kde.Sdk// in this file against the manifest.
        run: |
          flatpak install --user -y flathub org.kde.Platform//6.11 org.kde.Sdk//6.11

      - name: Build the Flatpak
        working-directory: studio/packaging/flatpak
        run: |
          flatpak-builder --user --disable-rofiles-fuse --force-clean \
            --repo=repo build-dir org.hugmesh.ImageStudio.yml

      - name: Export a single-file bundle
        working-directory: studio/packaging/flatpak
        # --runtime-repo as above: the bundle names Flathub as where its runtime comes from.
        run: |
          flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo repo "hugmesh-studio-${VERSION}-${ARCH}.flatpak" org.hugmesh.ImageStudio
          sha256sum "hugmesh-studio-${VERSION}-${ARCH}.flatpak" | tee "hugmesh-studio-${VERSION}-${ARCH}.flatpak.sha256"

      - name: Smoke-test the bundle (--print-specs, the Qt-free path)
        working-directory: studio/packaging/flatpak
        run: |
          flatpak install --user -y --noninteractive \
            "hugmesh-studio-${VERSION}-${ARCH}.flatpak"
          flatpak run --command=hugmesh-studio org.hugmesh.ImageStudio \
            --print-specs > specs.json
          if [ ! -s specs.json ]; then
            echo "::error::no output from --print-specs — the installed bundle is incomplete"
            exit 1
          fi
          head -c 400 specs.json; echo

      - name: Smoke-test the bundle (Qt starts offscreen on the aarch64 wheels)
        working-directory: studio/packaging/flatpak
        # The same check as build-flatpak-local.sh's smoke test 2: PySide6 (not a PyQt6
        # fallback) loads, a QApplication starts on the offscreen platform and grabs a
        # widget, and the package-data files are inside the install. --nofilesystem=host
        # keeps it inside the sandbox. This is the step that would catch an x86_64
        # wheel inside an aarch64 bundle, which --print-specs never imports.
        run: |
          out=$(flatpak run --nofilesystem=host --env=QT_QPA_PLATFORM=offscreen \
            --command=python3 org.hugmesh.ImageStudio - <<'PY'
          import os, platform, sys
          import hugmesh_studio
          from hugmesh_studio.gui.qt import QtCore, QtWidgets, BINDING

          package = os.path.dirname(hugmesh_studio.__file__)
          expected = ["core/device-catalog.json", "core/progress-tables.json", "core/_roles-lib.sh"]
          missing = [p for p in expected if not os.path.isfile(os.path.join(package, p))]
          if missing:
              sys.exit(f"package data missing from the install: {missing}")
          app = QtWidgets.QApplication(["flatpak-smoke"])
          label = QtWidgets.QLabel("smoke")
          label.resize(120, 40)
          label.show()
          shot = label.grab()
          if BINDING != "PySide6" or app.platformName() != "offscreen" or shot.isNull():
              sys.exit(f"unexpected Qt state: binding={BINDING} platform={app.platformName()} "
                       f"grab_null={shot.isNull()}")
          print(f"qt-ok binding={BINDING} qt={QtCore.qVersion()} platform={app.platformName()} "
                f"machine={platform.machine()} grab={shot.width()}x{shot.height()}")
          PY
          )
          echo "$out"
          case "$out" in
            *"qt-ok binding=PySide6"*"machine=$ARCH"*) ;;
            *) echo "::error::the Qt smoke test did not report qt-ok on $ARCH"; exit 1 ;;
          esac

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: flatpak-aarch64
          path: |
            studio/packaging/flatpak/hugmesh-studio-*-aarch64.flatpak
            studio/packaging/flatpak/hugmesh-studio-*-aarch64.flatpak.sha256
          if-no-files-found: error

  publish:
    needs: [version, msi, linux, flatpak, flatpak-aarch64]
    # Only a studio-v* tag ref publishes: the tag push itself, or a dispatch ON that tag
    # with "publish" ticked (the re-run path). A dispatch on main never does, ticked or not.
    if: ${{ startsWith(github.ref, 'refs/tags/studio-v') && (github.event_name == 'push' || inputs.publish) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The write permissions live ONLY on this job. The build jobs above stay read-only,
    # so a compromised build step can neither create a release nor sign anything.
    #   contents: write      create the release
    #   id-token: write      the GitHub OIDC token cosign and the attestation sign with
    #   attestations: write  store the build-provenance attestations
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      AUTHENTICODE: ${{ needs.msi.outputs.authenticode }}
    steps:
      - name: Never overwrite a published release
        # RED, NOT A GREEN SKIP. An existing release stops this job with an error
        # unless the run was dispatched with republish=true; then it prints a warning
        # naming how many files are about to be replaced and sets replaced=true, which
        # the notes and the summary pick up. The former contract (a green run that
        # published nothing, gated on a `skip` output) was deleted by hand on main on
        # 2026-10-22 and nobody noticed for a day; a red run cannot be missed, and
        # there is no `skip` for a hand edit to remove any more. republish=true with
        # no release is also an error: it is never a silent first publish.
        #
        # Only gh's own "release not found" counts as absent: any other failure
        # (network, auth, rate limit) stops the job, because the publish step below
        # would otherwise run against a release that may exist and replace its
        # same-named files.
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
          REPUBLISH: ${{ inputs.republish }}
        run: |
          if out=$(gh release view "studio-v$VERSION" --repo "$GITHUB_REPOSITORY" --json tagName,assets 2>&1); then
            summary=$(printf '%s' "$out" | python3 -c 'import json,sys
          try:
              assets = json.load(sys.stdin).get("assets") or []
              print(len(assets), max((a.get("updatedAt") or "?" for a in assets), default="?"))
          except Exception:
              print("? ?")')
            count=${summary%% *}
            newest=${summary#* }
            if [ "$REPUBLISH" = "true" ]; then
              echo "::warning::REPUBLISHING studio-v$VERSION: $count files will be replaced (newest currently from $newest); every checksum, signature and attestation changes"
              echo "replaced=true" >> "$GITHUB_OUTPUT"
            else
              echo "::error::release studio-v$VERSION already exists; nothing was changed. To replace its files on purpose (every checksum changes): scripts/release-studio.sh $VERSION --republish"
              exit 1
            fi
          else
            case "$out" in
              *"release not found"*)
                if [ "$REPUBLISH" = "true" ]; then
                  echo "::error::republish was requested but release studio-v$VERSION does not exist; run a normal release"
                  exit 1
                fi
                echo "replaced=false" >> "$GITHUB_OUTPUT" ;;
              *) echo "::error::could not tell whether release studio-v$VERSION exists: $out"; exit 1 ;;
            esac
          fi

      - name: The ref must be the tag of this version
        # Belt and braces under the version job's tag gate, which was deleted by hand
        # once (2026-10-23: a push of studio-v0.3.1-beta.1 published under the
        # 0.3.0-beta.1 name, and the certificate identity names the wrong tag). The
        # asset names derive from VERSION and the cosign identity from github.ref; this
        # step is what keeps the two the same thing.
        run: |
          if [ "$GITHUB_REF" != "refs/tags/studio-v$VERSION" ]; then
            echo "::error::this run is on $GITHUB_REF but __version__ is $VERSION; a release is published only from refs/tags/studio-v$VERSION"
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

        with:
          # This job's token can write releases: keep it out of .git/config. Nothing
          # below uses git; the release and the dispatch go through the API.
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0

        with:
          path: artifacts

      - name: Collect the installers
        # Every installer the build jobs promise, by name: the MSI, BOTH Flatpaks (one
        # per architecture) and the tarball. A missing one is an error, never a release
        # with fewer files than the notes describe.
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.msi' -o -name '*.flatpak' -o -name '*.tar.gz' -o -name '*.spdx.json' \) -exec cp {} release/ \;
          for want in "hugmesh-studio-$VERSION-x64.msi" "hugmesh-studio-$VERSION-x86_64.flatpak" "hugmesh-studio-$VERSION-aarch64.flatpak" "hugmesh-studio-$VERSION-linux-x86_64.tar.gz"; do
            [ -s "release/$want" ] || { echo "::error::release/$want is missing"; exit 1; }
          done
          ls -la release

      - name: SBOM of the Windows build's locked Python packages
        # The MSI job installs exactly windows-build-requirements.txt (--require-hashes),
        # so the lock IS the list of third-party packages frozen into the MSI.
        continue-on-error: true
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
        with:
          file: studio/packaging/wix/windows-build-requirements.txt
          format: spdx-json
          output-file: release/hugmesh-studio-${{ env.VERSION }}-windows-x64.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Write SHA256SUMS
        working-directory: release
        run: |
          shopt -s nullglob
          files=(*.msi *.flatpak *.tar.gz *.spdx.json)
          sha256sum -- "${files[@]}" > SHA256SUMS
          cat SHA256SUMS

      - name: Generate releases.json for the documentation site
        # The shape of src/assets/releases.json.example in hugmesh.github.io. Every
        # field added for signing (per-installer "sbom", top-level "checksums",
        # "signature", "provenance", "verify") is additive: the page ignores keys it does
        # not know. A "linux" + "tarball" entry is listed with the Linux downloads, and
        # the two "linux" + "flatpak" entries carry an "arch" (x86_64 or aarch64).
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, datetime
          version = os.environ["VERSION"]
          repo = os.environ["GITHUB_REPOSITORY"]
          signed = os.environ.get("AUTHENTICODE") == "true"
          tag = f"studio-v{version}"
          base = f"https://github.com/{repo}/releases/download/{tag}"
          release = pathlib.Path("release")

          def entry(path, platform, kind, label, notes, sbom):
              data = path.read_bytes()
              out = {
                  "platform": platform,
                  "kind": kind,
                  "label": label,
                  "file": path.name,
                  "url": f"{base}/{path.name}",
                  "size": f"{len(data) / (1024 * 1024):.0f} MB",
                  "sha256": hashlib.sha256(data).hexdigest(),
                  "notes": notes,
              }
              if sbom and (release / sbom).exists():
                  out["sbom"] = f"{base}/{sbom}"
              return out

          msi_note = ("Per-user install, no administrator rights required. "
                      + ("Authenticode-signed. " if signed else
                         "Not code-signed yet, so Windows SmartScreen will warn on first run; "
                         "verify the checksum and the GitHub attestation before running it. ")
                      + "Building images additionally needs Docker Desktop.")
          installers = []
          for path in sorted(release.iterdir()):
              if path.name.endswith(".msi"):
                  installers.append(entry(path, "windows", "msi", "Windows installer (x64)",
                                          msi_note, f"hugmesh-studio-{version}-windows-x64.spdx.json"))
              elif path.name.endswith(".flatpak"):
                  # One bundle per architecture, named hugmesh-studio-<version>-<arch>.flatpak
                  # by the flatpak jobs; the label and the arch field say which is which.
                  arch = path.name[len(f"hugmesh-studio-{version}-"):-len(".flatpak")]
                  if arch not in ("x86_64", "aarch64"):
                      raise SystemExit(f"{path.name}: not a bundle of a known architecture")
                  item = entry(
                      path, "linux", "flatpak", f"Flatpak bundle ({arch})",
                      "Install with: flatpak install --user ./" + path.name + " (needs the "
                      "org.kde.Platform 6.11 runtime for " + arch + "; the bundle names Flathub "
                      "as its source, so the install offers to add that remote and fetch it). "
                      "Point it at a hugmesh-generator checkout on first run; building images "
                      "needs Docker on the host.", None)
                  item["arch"] = arch
                  installers.append(item)
              elif path.name.endswith(".tar.gz"):
                  installers.append(entry(
                      path, "linux", "tarball", "Linux tarball (x86_64, glibc 2.39+)",
                      "Unpack and run hugmesh-studio-" + version + "-linux-x86_64/hugmesh-studio. "
                      "No install step; needs glibc 2.39 or newer (Ubuntu 24.04, Debian 13, "
                      "Fedora 40 or later). Older systems: use the Flatpak.",
                      f"hugmesh-studio-{version}-linux-x86_64.spdx.json"))

          workflow = f"{repo}/.github/workflows/studio-release.yml"
          out = {
              "version": version,
              "published": datetime.datetime.now(datetime.timezone.utc).date().isoformat(),
              "notesUrl": f"https://github.com/{repo}/releases/tag/{tag}",
              "installers": installers,
              "checksums": f"{base}/SHA256SUMS",
              "signature": {
                  "kind": "cosign-keyless",
                  "bundle": f"{base}/SHA256SUMS.sigstore.json",
                  "identity": f"https://github.com/{workflow}@refs/tags/{tag}",
                  "issuer": "https://token.actions.githubusercontent.com",
              },
              "provenance": {
                  "kind": "github-artifact-attestation",
                  "signerWorkflow": workflow,
                  "sourceRef": f"refs/tags/{tag}",
              },
              "authenticode": signed,
              "verify": [
                  f"gh attestation verify <file> --repo {repo} --signer-workflow {workflow} "
                  f"--source-ref refs/tags/{tag} --deny-self-hosted-runners",
                  f"cosign verify-blob --bundle SHA256SUMS.sigstore.json "
                  f"--certificate-identity https://github.com/{workflow}@refs/tags/{tag} "
                  f"--certificate-oidc-issuer https://token.actions.githubusercontent.com SHA256SUMS",
                  "sha256sum --check --ignore-missing SHA256SUMS",
              ],
          }
          pathlib.Path("release/releases.json").write_text(json.dumps(out, indent=2) + "\n")
          print(json.dumps(out, indent=2))
          PY

      - name: Install cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5  # v3.10.1
        with:
          cosign-release: 'v2.4.1'

      - name: Sign SHA256SUMS (cosign keyless) and check the signature
        # Keyless: the certificate is issued to THIS workflow file at THIS tag, by
        # GitHub's OIDC issuer, and logged in Sigstore's public transparency log. The
        # check right after uses the same identity the release notes tell users to use,
        # so a notes/identity mismatch fails here and not on a user's machine.
        working-directory: release
        env:
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/studio-release.yml@${{ github.ref }}
        run: |
          cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
          cosign verify-blob --bundle SHA256SUMS.sigstore.json \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            SHA256SUMS

      - name: Attest build provenance for every published file
        # One SLSA provenance attestation per file in release/: the installers, the
        # tarball, the SBOMs, SHA256SUMS, its cosign bundle and releases.json. On a
        # PRIVATE repository on this org's plan this step fails, and so nothing is
        # released: publish after the repository is public.
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f  # v3.2.0
        with:
          subject-path: release/*

      - name: Write the release notes
        env:
          REPLACED: ${{ steps.exists.outputs.replaced }}
        run: |
          tag="studio-v$VERSION"
          workflow="$GITHUB_REPOSITORY/.github/workflows/studio-release.yml"
          if [ "$REPLACED" = "true" ]; then
            replaced_note="> **Files replaced on $(date -u +%F) from ${GITHUB_SHA:-?} by run ${GITHUB_SERVER_URL:-https://github.com}/$GITHUB_REPOSITORY/actions/runs/${GITHUB_RUN_ID:-?}; every checksum, signature and attestation changed.** Anyone who downloaded before this date must re-download to verify."
          else
            replaced_note=""
          fi
          # The exact certificate identity as an anchored regular expression (dots escaped).
          identity_re="^$(printf '%s' "https://github.com/$workflow@refs/tags/$tag" | sed 's/[.]/\\./g')\$"
          if [ "$AUTHENTICODE" = "true" ]; then
            win_sign="It is Authenticode-signed."
          else
            win_sign="It is **not code-signed** yet (no certificate is configured), so SmartScreen will warn on first run. Verify it as below before running it."
          fi
          case "$VERSION" in *-*) stage=" (beta, pre-release)" ;; *) stage="" ;; esac
          cat > release-notes.md <<EOF
          HugMesh Image Studio $VERSION$stage.
          ${replaced_note:+
          $replaced_note
          }
          **Windows**: download \`hugmesh-studio-$VERSION-x64.msi\`. It installs per-user, so no administrator rights are needed. $win_sign

          **Linux x86_64**: \`hugmesh-studio-$VERSION-x86_64.flatpak\` (install with \`flatpak install --user ./hugmesh-studio-$VERSION-x86_64.flatpak\`; needs the org.kde.Platform 6.11 runtime, and the bundle names Flathub as the place to fetch it from, so the install offers to add that remote when the runtime is missing), or \`hugmesh-studio-$VERSION-linux-x86_64.tar.gz\` (unpack and run \`hugmesh-studio\`; needs glibc 2.39 or newer).

          **Linux aarch64** (ARM64: Raspberry Pi 4/5 desktops, Apple-silicon VMs, Ampere and Snapdragon machines): \`hugmesh-studio-$VERSION-aarch64.flatpak\`, built on GitHub's hosted arm64 runner from the same manifest and installed the same way (\`flatpak install --user ./hugmesh-studio-$VERSION-aarch64.flatpak\`). There is no aarch64 tarball.

          Every bundle carries its architecture in its name; \`flatpak install\` refuses one built for another architecture. All packages contain the same application. The Studio drives host tooling (Docker, QEMU, kubectl) rather than replacing it, and needs a \`hugmesh-generator\` checkout to read build scripts and cluster specs from: point it at one on first run.

          ## Verify what you downloaded

          Every file was built and signed by GitHub Actions on GitHub-hosted runners, by \`.github/workflows/studio-release.yml\` at tag \`$tag\`.

          1. Build provenance, for each file (a current GitHub CLI: every flag below exists in gh 2.94):

          \`\`\`
          gh attestation verify hugmesh-studio-$VERSION-x64.msi \\
            --repo $GITHUB_REPOSITORY \\
            --signer-workflow $workflow \\
            --source-ref refs/tags/$tag \\
            --deny-self-hosted-runners
          \`\`\`

          2. The cosign signature on \`SHA256SUMS\` (cosign 2.x), then the checksums:

          \`\`\`
          cosign verify-blob --bundle SHA256SUMS.sigstore.json \\
            --certificate-identity https://github.com/$workflow@refs/tags/$tag \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \\
            SHA256SUMS
          sha256sum --check --ignore-missing SHA256SUMS
          \`\`\`

          The same identity as an exact regular expression, for \`--certificate-identity-regexp\`:

          \`\`\`
          cosign verify-blob --bundle SHA256SUMS.sigstore.json \\
            --certificate-identity-regexp '$identity_re' \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \\
            SHA256SUMS
          \`\`\`

          On Windows, \`Get-FileHash .\\hugmesh-studio-$VERSION-x64.msi -Algorithm SHA256\` must print the MSI's line in \`SHA256SUMS\`.

          SBOMs (SPDX JSON) list the Python packages frozen into the MSI and the tarball. \`releases.json\` is the data file for the Downloads page on hugmesh.net.
          EOF
          cat release-notes.md

      - name: Publish the release
        # LAST of the release steps: everything above (sums, cosign, attestations) has
        # already succeeded, so a release never exists without its signatures.
        #
        # On a republish this REPLACES the same-named assets of the existing release
        # (softprops overwrites by name). Nothing deletes the old assets first, on
        # purpose: every asset name derives from VERSION, and "The ref must be the tag
        # of this version" pins VERSION to the tag, so a stale name cannot occur, while
        # deleting first would leave an empty release for the minutes the upload takes.
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          tag_name: studio-v${{ env.VERSION }}
          name: HugMesh Image Studio ${{ env.VERSION }}
          draft: false
          # Beta scheme: any version with a "-" is a pre-release and never "latest".
          prerelease: ${{ contains(env.VERSION, '-') }}
          make_latest: ${{ contains(env.VERSION, '-') && 'false' || 'true' }}
          body_path: release-notes.md
          # false only because an SBOM may be absent; the installers' presence is
          # checked by "Collect the installers" above.
          fail_on_unmatched_files: false
          files: |
            release/*.msi
            release/*.flatpak
            release/*.tar.gz
            release/*.spdx.json
            release/SHA256SUMS
            release/SHA256SUMS.sigstore.json
            release/releases.json

      - name: Summarise
        env:
          REPLACED: ${{ steps.exists.outputs.replaced }}
        run: |
          if [ "$REPLACED" = "true" ]; then
            title='## Studio '"$VERSION"' REPUBLISHED: all checksums changed'
          else
            title='## Studio '"$VERSION"' published, signed and attested'
          fi
          # shellcheck disable=SC2016  # the backticks are Markdown, not command substitution
          {
            echo "$title"
            echo
            echo "Release: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/studio-v$VERSION"
            echo
            echo 'Downloads page: hugmesh.github.io rebuilds `releases.json` from the Releases API within the hour (pages.yml cron) or now via `gh workflow run pages.yml --repo hugmesh/hugmesh.github.io`. The `releases-updated` dispatch (next step) asks for it sooner when SITE_DISPATCH_TOKEN exists. The file attached to this release:'
            echo
            echo '```json'
            cat release/releases.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Tell hugmesh.github.io to rebuild its downloads data
        # Contract: .wf-scripts downloads/DISPATCH-CONTRACT.md (event type
        # releases-updated). Not gated on anything: it runs after every publish and
        # every explicit republish. To re-send only this notice, do not re-run this
        # workflow (a re-run is a republish and needs republish=true): run
        # `gh workflow run pages.yml --repo hugmesh/hugmesh.github.io` instead, which
        # rebuilds the site's data from the Releases API. GITHUB_TOKEN cannot reach
        # another repository; SITE_DISPATCH_TOKEN is a fine-grained token (or GitHub App
        # token) with Contents: read and write on hugmesh/hugmesh.github.io only.
        env:
          SITE_DISPATCH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
          SITE_REPO: hugmesh/hugmesh.github.io
        run: |
          if [ -z "$SITE_DISPATCH_TOKEN" ]; then
            echo "::notice::SITE_DISPATCH_TOKEN is not set; skipping the releases-updated dispatch to $SITE_REPO. The site rebuilds releases.json from the Releases API within the hour (pages.yml cron), or now via: gh workflow run pages.yml --repo $SITE_REPO"
            exit 0
          fi
          payload=$(python3 -c 'import json,os; v=os.environ["VERSION"]; r=os.environ["GITHUB_REPOSITORY"]; t="studio-v"+v; print(json.dumps({"event_type":"releases-updated","client_payload":{"source":r,"kind":"studio","version":v,"tag":t,"releases_json":"https://github.com/%s/releases/download/%s/releases.json"%(r,t)}}))')
          curl -fsS -X POST \
            -H "Authorization: Bearer $SITE_DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$SITE_REPO/dispatches" \
            -d "$payload"
          echo "sent releases-updated to $SITE_REPO: $payload"
