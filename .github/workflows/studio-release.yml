# HugMesh Image Studio — installer build and release (Windows MSI + Linux Flatpak).
#
# THIS IS A NEW PATTERN FOR THIS ORG, deliberately. Every other release.yml in the
# fleet means "build a container image and push it to GHCR"; there are no GitHub
# Releases, no tags and no uploaded artifacts anywhere. This workflow publishes real
# downloadable installers, because that is what a Downloads page on a public docs site
# needs and a container image cannot be one.
#
# WHY THE SITE READS A STATIC FILE, NOT THE GITHUB API: hugmesh-generator is PRIVATE.
# An anonymous visitor to hugmesh.net cannot read its releases, so the Downloads page
# renders from a committed `src/assets/releases.json`. The publish job below emits that
# file, in the exact shape of `src/assets/releases.json.example` in the site repo.
#
# TRIGGER: workflow_dispatch, plus a `studio-v*` tag. The fleet convention is
# dispatch-only and exists so nobody accidentally pushes an image; a tag that a human
# deliberately created and pushed IS the explicit decision that convention protects,
# so honouring it here does not weaken it.
name: Studio release (MSI + Flatpak)

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Create a GitHub Release from the built installers'
        type: boolean
        default: false
  push:
    tags: ['studio-v*']

permissions:
  contents: read

concurrency:
  group: studio-release-${{ github.ref }}
  # NOT cancel-in-progress: a half-cancelled release can leave a tag with some assets
  # attached and others missing, which is worse than a duplicate run.
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: read
        name: Read the version from the source of truth
        # __init__.py's __version__ is the ONE version. The installer filenames, the
        # About box and the release tag all derive from it, so they cannot disagree.
        run: |
          version=$(python3 -c "import re,pathlib; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('studio/hugmesh_studio/__init__.py').read_text()).group(1))")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Studio version: $version"

      - name: Tag must match the version it claims to release
        if: startsWith(github.ref, 'refs/tags/studio-v')
        run: |
          tag="${GITHUB_REF_NAME#studio-v}"
          if [ "$tag" != "${{ steps.read.outputs.version }}" ]; then
            echo "::error::tag studio-v$tag does not match __version__ ${{ steps.read.outputs.version }}"
            exit 1
          fi

  msi:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install build dependencies
        # tzdata: Windows ships no system timezone database, so core/timezones.py
        # silently collapses to its short fallback list without it.
        run: |
          python -m pip install --upgrade pip
          python -m pip install "./studio[win]" pyinstaller pillow

      - name: Render the application icon
        working-directory: studio
        # Qt's `windows` platform, not gen_icons.py's `offscreen` default: offscreen has
        # no fonts, so the mark's "S" is drawn as an empty box (measured under Wine; see
        # packaging/wix/README.md). gen_icons.py only setdefault()s the variable, so
        # setting it here is enough and the script is unchanged.
        env:
          QT_QPA_PLATFORM: windows
        run: python packaging/gen_icons.py --out build/icons

      - name: Check the icon has its letter
        working-directory: studio
        # An empty box has ~0 white pixels in the centre, a bold sans "S" several
        # thousand. This is the guard build-msi-wine.sh applies before freezing.
        run: python packaging/check_icon.py build/icons/icon-256.png

      - name: Freeze with PyInstaller
        working-directory: studio
        env:
          HUGMESH_STUDIO_ICON: build/icons/hugmesh-studio.ico
        run: pyinstaller --noconfirm --clean packaging/hugmesh-studio.spec

      - name: Smoke-test the frozen binary
        working-directory: studio
        # --print-specs is the app's Qt-FREE path, so this proves the bundle's Python
        # side is complete without needing a display. A bundle missing
        # core/progress-tables.json fails right here, at import time, which is exactly
        # where it should fail rather than on a user's desktop.
        #
        # Start-Process, not `exe > specs.json`: the exe is a WINDOWED (console=False)
        # executable. PowerShell neither waits for such a process nor hands it a valid
        # stdout, so a plain redirect left it with "OSError: [Errno 22]" and an empty
        # file (run 37690716536). Start-Process wires the file handles itself and waits.
        # The timeout is there because a bundle that cannot import hangs on an error
        # dialog instead of exiting (measured under Wine; see packaging/wix/README.md).
        run: |
          $exe = (Resolve-Path dist\hugmesh-studio\hugmesh-studio.exe).Path
          $p = Start-Process -FilePath $exe -ArgumentList '--print-specs' `
            -RedirectStandardOutput specs.json -RedirectStandardError specs.err `
            -NoNewWindow -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "--print-specs did not exit within 120 s" }
          if ($p.ExitCode -ne 0) { Get-Content specs.err; throw "--print-specs exited $($p.ExitCode)" }
          if ((Get-Item specs.json).Length -eq 0) { Get-Content specs.err; throw "no output from --print-specs" }
          Get-Content specs.json -TotalCount 3
        shell: pwsh

      - name: Build the licence page
        working-directory: studio
        run: python packaging/wix/make_license_rtf.py --in ../LICENSE --out build/License.rtf

      - name: Install WiX
        # PINNED, and the extension at the SAME version. An unpinned `dotnet tool
        # install` gets WiX 7, which refuses to run (WIX7015) until the project owner
        # accepts the Open Source Maintenance Fee EULA; 6.0.2 is the last release before
        # that gate. An unpinned extension would pull 7.0.0 into a 6.x tool (WIX6101).
        # There is no harvest step: no wix release has a `harvest` command, and
        # packaging/wix/Files.wxs (committed) expands the frozen tree at build time
        # with WiX's own <Files> element.
        run: |
          dotnet tool install --global wix --version 6.0.2
          wix --version
          wix extension add -g WixToolset.UI.wixext/6.0.2
          wix extension list -g
        shell: pwsh

      - name: Build the MSI
        working-directory: studio
        # AppDir is passed absolute so it does not depend on how Files.wxs resolves a
        # relative path. Same arguments as the Wine-tested recipe in build-msi-wine.sh.
        run: |
          $appDir = (Resolve-Path dist/hugmesh-studio).Path
          wix build -arch x64 `
            -define Version=$env:VERSION `
            -define IconFile=build/icons/hugmesh-studio.ico `
            -define LicenseFile=build/License.rtf `
            -define AppDir=$appDir `
            -ext WixToolset.UI.wixext `
            -out "hugmesh-studio-$env:VERSION-x64.msi" `
            packaging/wix/Package.wxs packaging/wix/Files.wxs
          if ($LASTEXITCODE -ne 0) { throw "wix build failed ($LASTEXITCODE)" }
          if (-not (Test-Path "hugmesh-studio-$env:VERSION-x64.msi")) { throw "no MSI was written" }
          Get-Item "hugmesh-studio-$env:VERSION-x64.msi" | Format-List Name, Length
        shell: pwsh

      - name: Checksum
        working-directory: studio
        run: |
          $file = "hugmesh-studio-$env:VERSION-x64.msi"
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
          "$hash  $file" | Out-File -Encoding ascii "$file.sha256"
          Write-Host "$hash  $file"
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: msi
          path: |
            studio/hugmesh-studio-*.msi
            studio/hugmesh-studio-*.msi.sha256
          if-no-files-found: error

  flatpak:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder appstream desktop-file-utils
          flatpak remote-add --if-not-exists --user flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Validate the desktop entry and AppStream metadata
        working-directory: studio/packaging/flatpak
        # --no-net: the only remaining validator complaints are URL-reachability
        # checks against hugmesh.net (not yet deployed) and a PRIVATE repository.
        # Failing a build because a documentation URL is not public yet would be
        # noise, while every structural check still runs.
        run: |
          desktop-file-validate org.hugmesh.ImageStudio.desktop
          appstreamcli validate --no-net org.hugmesh.ImageStudio.metainfo.xml

      - name: Install the runtime
        run: |
          flatpak install --user -y flathub org.kde.Platform//6.8 org.kde.Sdk//6.8

      - name: Build the Flatpak
        working-directory: studio/packaging/flatpak
        run: |
          flatpak-builder --user --disable-rofiles-fuse --force-clean \
            --repo=repo build-dir org.hugmesh.ImageStudio.yml

      - name: Export a single-file bundle
        working-directory: studio/packaging/flatpak
        # A .flatpak BUNDLE rather than a Flathub submission: HugMesh's own governed
        # desktops actively remove the flathub remote
        # (keys-template/desktop-governance/flatpak/flathub-disable.conf), so Flathub
        # is not a delivery path for the machines most likely to want this.
        run: |
          flatpak build-bundle repo "hugmesh-studio-${VERSION}-x86_64.flatpak" org.hugmesh.ImageStudio
          sha256sum "hugmesh-studio-${VERSION}-x86_64.flatpak" | tee "hugmesh-studio-${VERSION}-x86_64.flatpak.sha256"

      - name: Smoke-test the bundle
        working-directory: studio/packaging/flatpak
        # THE MSI JOB HAS HAD ONE SINCE IT WAS WRITTEN AND THIS JOB DID NOT, which is
        # how a bundle that died at `import hugmesh_studio.core.config` could have
        # been built, checksummed, uploaded and attached to a release with every step
        # green: core/roles.py read the role vocabulary out of a `scripts/` directory
        # that only exists in a checkout, and `pip3 install --prefix` above ships the
        # package alone. Nothing here builds the app a second time — it INSTALLS the
        # exact artifact that is about to be published and runs it.
        #
        # --print-specs is the app's Qt-FREE path (app.py: model only, no
        # QApplication), so this needs no display and no session bus, and it fails at
        # IMPORT time on a bundle missing any of the four package-data files.
        run: |
          flatpak install --user -y --noninteractive \
            "hugmesh-studio-${VERSION}-x86_64.flatpak"
          flatpak run --command=hugmesh-studio org.hugmesh.ImageStudio \
            --print-specs > specs.json
          if [ ! -s specs.json ]; then
            echo "::error::no output from --print-specs — the installed bundle is incomplete"
            exit 1
          fi
          head -c 400 specs.json; echo

      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: |
            studio/packaging/flatpak/hugmesh-studio-*.flatpak
            studio/packaging/flatpak/hugmesh-studio-*.flatpak.sha256
          if-no-files-found: error

  publish:
    needs: [version, msi, flatpak]
    if: ${{ inputs.publish || startsWith(github.ref, 'refs/tags/studio-v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # contents: write lives ONLY on this job. The build jobs above stay read-only, so
    # a compromised build step cannot create a release.
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect the installers
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.msi' -o -name '*.flatpak' \) -exec cp {} release/ \;
          cd release
          sha256sum ./* > SHA256SUMS
          ls -la
          cat SHA256SUMS

      - name: Generate releases.json for the documentation site
        # Emitted as a release asset AND printed to the job summary. It is not pushed
        # to hugmesh/hugmesh.github.io from here: GITHUB_TOKEN cannot reach another
        # repository, and adding a cross-repo PAT for a once-per-release file would be
        # the first PAT in this org. A maintainer copies it into the site repo, which
        # is also the moment the release notes get written.
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, datetime
          version = os.environ["VERSION"]
          repo = os.environ["GITHUB_REPOSITORY"]
          tag = f"studio-v{version}"
          base = f"https://github.com/{repo}/releases/download/{tag}"

          def entry(path, platform, kind, label, notes):
              data = path.read_bytes()
              size = len(data)
              return {
                  "platform": platform,
                  "kind": kind,
                  "label": label,
                  "file": path.name,
                  "url": f"{base}/{path.name}",
                  "size": f"{size / (1024 * 1024):.0f} MB",
                  "sha256": hashlib.sha256(data).hexdigest(),
                  "notes": notes,
              }

          installers = []
          for path in sorted(pathlib.Path("release").iterdir()):
              if path.suffix == ".msi":
                  installers.append(entry(
                      path, "windows", "msi", "Windows installer (x64)",
                      "Per-user install — no administrator rights required. Not code-signed, "
                      "so Windows SmartScreen will warn on first run; verify the checksum below. "
                      "Building images additionally needs Docker Desktop."))
              elif path.suffix == ".flatpak":
                  installers.append(entry(
                      path, "linux", "flatpak", "Flatpak bundle (x86_64)",
                      "Install with: flatpak install --user ./" + path.name + " — needs the "
                      "org.kde.Platform 6.8 runtime. Point it at a hugmesh-generator checkout "
                      "on first run; building images needs Docker on the host."))

          out = {
              "version": version,
              "published": datetime.datetime.now(datetime.timezone.utc).date().isoformat(),
              "notesUrl": f"https://github.com/{repo}/releases/tag/{tag}",
              "installers": installers,
          }
          pathlib.Path("release/releases.json").write_text(json.dumps(out, indent=2) + "\n")
          print(json.dumps(out, indent=2))
          PY

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: studio-v${{ env.VERSION }}
          name: HugMesh Image Studio ${{ env.VERSION }}
          draft: false
          files: |
            release/*.msi
            release/*.flatpak
            release/SHA256SUMS
            release/releases.json
          body: |
            HugMesh Image Studio ${{ env.VERSION }}.

            **Windows** — download the `.msi`. It installs per-user, so no administrator
            rights are needed. It is not code-signed; SmartScreen will warn on first run.

            **Linux** — download the `.flatpak` and install it with
            `flatpak install --user ./hugmesh-studio-${{ env.VERSION }}-x86_64.flatpak`.

            Verify what you downloaded against `SHA256SUMS` before running it.

            Both installers package the same application. The Studio drives host tooling
            (Docker, QEMU, kubectl) rather than replacing it, and needs a
            `hugmesh-generator` checkout to read build scripts and cluster specs from —
            point it at one on first run.

            `releases.json` is attached for the documentation site's Downloads page.

      - name: Summarise
        run: |
          {
            echo '## Studio '"$VERSION"' published'
            echo
            echo 'Copy `releases.json` into `hugmesh.github.io` at `src/assets/releases.json` to update the Downloads page:'
            echo
            echo '```json'
            cat release/releases.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
