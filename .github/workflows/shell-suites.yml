# Pre-merge shell-suite gate.
#
# WHY THIS FILE EXISTS. This repo had 123 shell test suites and ZERO of them could
# stop a bad merge. tests/scripts/test-guard-integrity.sh check 3 reported "all 123
# suites are invoked by a pipeline job or a make target" — literally true, and
# completely misleading: GitLab here is an in-cluster PULL MIRROR
# (mirror_trigger_builds:true) whose pipelines run AFTER the merge, and a Makefile
# target gates nothing at all. GitHub Actions is the only thing that gates a PR.
#
# WHICH SUITES, AND WHY THESE. Every suite below was EXECUTED in the image named by
# its job before being listed here — not classified by reading it. Reading is a
# guess: several suites exit 0 while skipping their most valuable assertions when a
# tool is absent, and would have looked perfectly gateable from source.
#
# The lists are EXPLICIT, never a glob. A glob quietly changes what is gated when a
# file is renamed; an explicit list plus the missing-file check below turns that
# into an error. tests/scripts/test-guard-integrity.sh check 7 counts these names
# and pins the total, so neither adding nor dropping one can be silent.
#
# ...WITH ONE HOLE, and it is named here rather than left to be discovered. check 7
# builds its census by walking tests/ for files called test-*.sh, so the *_test.sh
# convention that tests/qemu/ and tests/menu/ use is outside that census entirely.
# tests/qemu/kernel_extract_test.sh below IS gated by this file, but it does not
# move check 7's number and neither would deleting it — the pin cannot see it. The
# other eight suites on that convention are gated NOWHERE and counted nowhere:
#   tests/menu/build_menu_cmd_test.sh      tests/qemu/devices_test.sh
#   tests/menu/ncurses_charset_test.sh     tests/qemu/mesh-cluster_test.sh
#   tests/qemu/assertions_test.sh          tests/qemu/save_test.sh
#   tests/qemu/avc-workout_test.sh         tests/qemu/verdict_test.sh
# That is the same "in NEITHER place" hole the 2026-08-22 sweep closed for the
# test-*.sh convention, re-opened by a naming difference. Closing it means running
# each of the eight in a CI image first to decide gated-vs-documented (the
# measure-by-execution rule above), and widening check 7's census so the number
# stays honest afterwards. Deliberately NOT bundled into the PR that added the
# suite below: that PR fixes a harness defect, and this is a coverage change that
# has to be measured on its own.
#
# NOT LISTED HERE (deliberate, with reasons). Every suite on disk is either listed
# above or listed here: six were in NEITHER place until 2026-08-22, which made this
# very block's claim false. Each of the six was then RUN in alpine:3 to decide
# which it was -- three are now gated, three are below.
# THE SECOND NAMING CONVENTION (2026-08-26). The 2026-08-22 sweep below closed the
# "in NEITHER place" hole for suites named `test-*.sh`. A naming difference reopened
# it the same week: tests/qemu/ and tests/menu/ name their suites `*_test.sh`, and
# check 7's census walked for `test-*.sh` only. Eight suites were therefore counted
# nowhere and gated nowhere -- invisible to the very number that exists to make this
# gap visible. tests/qemu/verdict_test.sh was one of them: it exists to stop the QEMU
# matrix reporting PASS rows whose assertions.log holds real FAILs, and it could not
# stop a merge. Seven of the eight are gated in the alpine job below and one in the
# node job; each was EXECUTED in that image first, and each was then MUTATION-TESTED
# there -- a real defect planted in the production script it covers -- so "it passes"
# is not being confused with "it asserts something". The census in
# tests/scripts/test-guard-integrity.sh now matches BOTH spellings, and its negative
# control (j) plants an orphaned `*_test.sh` to prove the walker really reaches the
# second one.
#
# ONE OF THE EIGHT IS NOT IN THE ALPINE JOB, ON PURPOSE.
#   * tests/menu/ncurses_charset_test.sh -> the NODE job.
#       Its central assertion ("after transliteration, no byte above 0x7F survives")
#       is a `grep -P`, and alpine:3 ships busybox grep, which has no -P: it exits 2
#       with a usage message, the `if` reads false, and the suite records a PASS.
#       Measured with the ⚙ mapping deleted from scripts/build-menu.sh: alpine 20
#       passed / 0 failed (VACUOUS), node:24-alpine -- which apk-installs GNU grep
#       3.12 -- 19 passed / 1 failed. The node job's preflight now asserts `grep -P`
#       works, so that dependency cannot rot back into a silent skip.
#   The other seven run correctly on alpine:3 with the package line below and need
#   nothing it does not install: no QEMU, no docker, no root, no sibling checkout.
#   Two of them (avc-workout_test.sh, mesh-cluster_test.sh) are alpine-ONLY -- they
#   are RED in node:24-alpine, which has no make/gawk/util-linux (31/9 and 137/27).
#
# NOT LISTED HERE (deliberate, with reasons). Every suite on disk -- under EITHER
# naming convention -- is either listed above or listed here: six were in NEITHER
# place until 2026-08-22 and eight more until 2026-08-26, which made this very
# block's claim false both times. Each was then RUN in a CI image to decide which it
# was -- of the first six, three are now gated and three are below; all eight of the
# second batch are gated.
#   * tests/scripts/test-liquibase-grant-roles.sh
#       python:3.12-slim + perl/PyYAML, with the checkout parent mounted and SERVICE_SRC_ROOT set
#   * tests/scripts/test-service-env-contract.sh
#       alpine:3 + apk add bash python3 py3-yaml, PLUS the 9 first-party BFF checkouts mounted and SERVI
#   * tests/scripts/test-eso-target-collisions.sh
#       alpine:3 + apk add bash python3 py3-yaml helm coreutils (+ --network host)
#   * tests/stack/test-web-locales-wiring.sh
#       python:3.12-slim + pyyaml + apt-get install make + host docker CLI and compose plugin bind-mount
#   * tests/casdoor/test-jwt-custom-token.sh
#       a container runtime INSIDE the job container (it starts casdoor itself);
#       alpine:3 has neither docker nor podman and no daemon socket is mounted
#   * tests/device-registry/test-layer-a-headscale-acl.sh
#       the hugmesh-admin-bff-api sibling checkout, for the BFF-side Layer-A compiler
#   * tests/stack/test-gateway-auth-flag-parity.sh
#       the hugmesh-gateway sibling checkout. It compares the EFFECTIVE auth-carrier
#       flags on the two lanes, and "effective" means resolving each key through the
#       IMAGE DEFAULT in hugmesh-gateway/src/main/resources/application.yml
#       (bff-exchange defaults FALSE, bff-session defaults TRUE — so "set on one side
#       only" means opposite things for the two keys and a presence check would be
#       wrong in both directions). A hosted runner cannot clone the org-private repo,
#       and the suite reports INCOMPLETE and FAILS rather than degrading, so listing
#       it here would just paint the PR gate red. It IS gated post-merge by
#       .gitlab-ci.yml's lint:gateway-auth-flag-parity, which clones it.
#   * tests/stack/test-m2-bootstrap.sh
#       the ${STACK_SRC:-.stack-src} consumer checkouts its pin-drift leg walks
#       (`make stack-clone`), or M2_PIN_DRIFT_SKIP=1
#   * tests/egress-vpn/test-secret-contract.sh
#       needs the hugmesh-admin-bff-api sibling checkout for its writer half. It
#       is CORRECT on a hosted runner (45 passed, 0 failed) but exits 3 saying
#       WRITER HALF UNCHECKED, which is the honest answer and not a gateable one.
#       Its other two defects are fixed: the writer path had not followed the
#       systems.hugmesh -> net.hugmesh package move (#141), and census_files()
#       used `grep --exclude-dir`, which busybox does not have, so on alpine the
#       census came back empty and reported nine false "blind spots".
#   * tests/scripts/test-federation-module-slugs.sh
#       leg A runs the federation_modules registration gate against the REAL
#       hugmesh-federation-api Liquibase changelog, which is a sibling checkout this
#       workflow does not have; with it absent the suite reports leg A UNVERIFIED and
#       exits 3 (its hermetic mutation legs still all pass). That is the honest answer
#       and not a gateable one, so it gates on GitLab instead
#       (lint:federation-module-slugs-gate-honesty clones the sibling first). Same
#       shape and same reason as tests/egress-vpn/test-secret-contract.sh above.
#   * tests/pentest/nuclei/test-templates.sh
#       RED on issue #146; also needs a pinned nuclei v3.9.0 the CI images do not
#       carry. #157 may already have fixed it (the failing check was a
#       `| grep -q` under pipefail) -- re-run it on a box with nuclei to find out.
#
# That one is the last of the nine suites found RED while measuring pre-merge
# coverage and filed as #140-#146; the other eight now gate. Gating a red suite
# would make this workflow red on day one and train everyone to ignore it;
# leaving them out means any red it shows is a NEW regression.
name: shell-suites

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shell-suites-${{ github.ref }}
  cancel-in-progress: true

jobs:
  alpine:
    name: shell suites (alpine)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: alpine:3
    steps:
      - run: apk add --no-cache attr bash coreutils curl e2fsprogs-extra flock gawk git helm jq make mtools nodejs openjdk17-jre-headless openjdk21-jre-headless openssh-keygen openssl py3-yaml python3 tar util-linux xz
      - uses: actions/checkout@v4
      - name: trust the workspace
        # Container jobs run as root against a checkout git considers foreign, so
        # `git ls-files` returns NOTHING. test-platform-key-spelling.sh refuses to
        # run in that state (correctly — it would scan zero files and pass), and
        # other git-reading suites would quietly cover less. Explicit rather than
        # relying on actions/checkout doing it for us.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: preflight
        run: |
          # PREFLIGHT. Many of these suites SKIP their most valuable assertions when a
          # tool is missing and still exit 0 — test-self-report silently drops its jq
          # body-parse asserts, test-cloud-deploy-driver prints "PASS make absent".
          # If the install step ever silently degrades, the whole job would go green
          # having asserted almost nothing. Fail here instead.
          missing=""
          # mcopy/minfo/mformat (mtools) + sfdisk (util-linux) + cmp are what
          # tests/qemu/launch_pi_kernel_test.sh builds its fixture image with. That
          # suite exits 2 with a named reason when they are absent rather than
          # exiting 0, so it cannot go quietly inert — but a missing package here
          # would still cost the whole job that suite, so name it at the door.
          for b in bash jq openssl python3 git make flock gawk mcopy minfo mformat sfdisk cmp; do command -v "$b" >/dev/null 2>&1 || missing="$missing $b"; done
          [ -z "$missing" ] || { echo "::error::preflight: missing$missing — suites would silently skip"; exit 1; }
          echo "preflight ok: bash jq openssl python3 git make flock gawk mcopy minfo mformat sfdisk cmp"
      - name: run suites
        shell: bash
        run: |
          # tests/qemu/role_topology_test.sh is the ONE tests/qemu suite listed here.
          # That family is named <thing>_test.sh, and test-guard-integrity.sh discovers
          # only test-*.sh (:89), so NOTHING in tests/qemu/ has ever been counted by
          # check 7 or gated by this workflow — it is a blind spot, not a decision, and
          # it is why a role_topology suite added under the house naming would have sat
          # inert exactly like DAST did. This one is hermetic (no guest, no image, no
          # loop device; bash + sed + grep + cmp only), so it is cheap to gate and there
          # is no reason not to. Its neighbours (verdict_test.sh, assertions_test.sh,
          # devices_test.sh, save_test.sh, mesh-cluster_test.sh, avc-workout_test.sh)
          # remain ungated — they were NOT measured in this image and are not being
          # claimed as covered here.
          SUITES="
            tests/api/test-bff-admin.sh
            tests/auto-update/test-provision-update.sh
            tests/auto-update/test-update-poller.sh
            tests/boot/test-kubelet-join-bootstrap.sh
            tests/cloud-deploy/test-cloud-deploy-driver.sh
            tests/desktop-governance/test-desktop-sudo-mapper.sh
            tests/desktop-governance/test-gen-sso-session-start.sh
            tests/desktop-governance/test-provision-desktop-governance.sh
            tests/device-registry/test-registry-allow-deny.sh
            tests/device-registry/test-self-report.sh
            tests/domain-registry/test-domain-reconcile-verify.sh
            tests/domain-registry/test-foreign-ingest-fuzz.sh
            tests/egress-vpn/test-optional-service-gate.sh
            tests/egress-vpn/test-provision-vpn.sh
            tests/egress-vpn/test-split-tunnel.sh
            tests/egress-vpn/test-vpn-mark.sh
            tests/egress-vpn/test-vpn-secret-projector.sh
            tests/egress-vpn/test-x86-role-gate.sh
            tests/go-live/test-go-live-driver.sh
            tests/go-live/test-go-live-reconcile-verify.sh
            tests/keystores/test-keystores-external-ca.sh
            tests/keystores/test-keystores.sh
            tests/menu/build_menu_cmd_test.sh
            tests/node-storage/test-bake-coverage.sh
            tests/node-storage/test-degrade.sh
            tests/node-storage/test-pool-entrypoint.sh
            tests/node-storage/test-provision-pool.sh
            tests/pentest/test-dast-honesty.sh
            tests/phone/test-make-phone-face.sh
            tests/phone/test-mdm-providers.sh
            tests/qemu/loop_preflight_test.sh
            tests/qemu/stage4_rootfs_test.sh
            tests/qemu/kernel_extract_test.sh
            tests/qemu/launch_pi_kernel_test.sh
            tests/qemu/role_topology_test.sh
            tests/qemu/assertions_test.sh
            tests/qemu/avc-workout_test.sh
            tests/qemu/devices_test.sh
            tests/qemu/mesh-cluster_test.sh
            tests/qemu/save_test.sh
            tests/qemu/verdict_test.sh
            tests/scripts/test-anubis-env-gate.sh
            tests/scripts/test-arm-ro-distdir.sh
            tests/scripts/test-binpkg-pool-fingerprint.sh
            tests/scripts/test-brand-path-validation.sh
            tests/scripts/test-builder-log-paths.sh
            tests/scripts/test-calamares-boost-seed.sh
            tests/scripts/test-casdoor-domains-appset.sh
            tests/scripts/test-casdoor-init-honesty.sh
            tests/scripts/test-casdoor-jwt-no-preferred-username.sh
            tests/scripts/test-catalog-discovery-gate.sh
            tests/scripts/test-cloud-package.sh
            tests/scripts/test-container-image-tags.sh
            tests/scripts/test-download-verify.sh
            tests/scripts/test-dracut-cross-lib.sh
            tests/scripts/test-e2e-persona-catalogue.sh
            tests/scripts/test-edge-ai-cuda-host-compiler.sh
            tests/scripts/test-fetch-retry-hardening.sh
            tests/scripts/test-frite-builder-input-validation.sh
            tests/scripts/test-github-auth-lib.sh
            tests/scripts/test-guard-integrity.sh
            tests/scripts/test-harbor-robots-ownership.sh
            tests/scripts/test-host-accept-keywords.sh
            tests/scripts/test-host-bdep-pool.sh
            tests/scripts/test-host-mutation-guard.sh
            tests/scripts/test-host-selinux-tools.sh
            tests/scripts/test-hugmesh-view.sh
            tests/scripts/test-idp-builder-functions.sh
            tests/scripts/test-image-builder-always-on.sh
            tests/scripts/test-installer-ui-node-default.sh
            tests/scripts/test-kernel-artifact-cache.sh
            tests/scripts/test-kind-bootstrap-honesty.sh
            tests/scripts/test-kind-profile-app-closure.sh
            tests/scripts/test-kind-profile-route-closure.sh
            tests/scripts/test-lsm-posture-honesty.sh
            tests/scripts/test-no-duplicate-env.sh
            tests/scripts/test-nullmailer-cross-postinst.sh
            tests/scripts/test-outbound-mtls-client.sh
            tests/scripts/test-password-reset-front-door.sh
            tests/scripts/test-platform-key-spelling.sh
            tests/scripts/test-portage-config-sync.sh
            tests/scripts/test-provision-manifest-injection.sh
            tests/scripts/test-publish-images.sh
            tests/scripts/test-reserved-prefix-copy-gate.sh
            tests/scripts/test-route-access-oracle.sh
            tests/scripts/test-rpi5-builder-input-validation.sh
            tests/scripts/test-rpi5-per-board-pkgdir.sh
            tests/scripts/test-shared-build-assets.sh
            tests/scripts/test-spec-use-parity.sh
            tests/scripts/test-studio-launch.sh
            tests/scripts/test-sunshine-fence.sh
            tests/scripts/test-tools-path-lib.sh
            tests/scripts/test-x86-identity-injection.sh
            tests/scripts/test-x86-kernel-net-symbols.sh
            tests/stack/test-attestation-dockerfile-patches.sh
            tests/stack/test-coturn-optional-service.sh
            tests/stack/test-front-door-client-surface.sh
            tests/stack/test-no-store-posture.sh
            tests/stack/test-optional-services-exclude.sh
            tests/stack/test-probe-auth-surface.sh
            tests/stack/test-tls-front.sh
          "
          # Accumulate. A bare `for t in ...; do bash "$t"; done` exits with the LAST
          # suite's status and silently forgives every earlier one — that is defect
          # shape (3) in tests/scripts/test-guard-integrity.sh's own taxonomy.
          rc=0; failed=""; ran=0
          for t in $SUITES; do
            [ -f "$t" ] || { echo "::error::listed suite does not exist: $t"; rc=1; failed="$failed $t(MISSING)"; continue; }
            echo "::group::$t"
            # </dev/null: a suite must never inherit the job's stdin. One that
            # lets a child prompt (ssh-keygen does) would otherwise block until
            # the job timeout, or, in a `while read` runner, silently eat the
            # rest of the suite list.
            # The STATUS is reported, not just PASS/FAIL: 141 is SIGPIPE (a
            # pipeline stage killed, NOT a failed assertion), 137 is the OOM
            # killer, 124 the timeout. Without it every one of those looks
            # exactly like a guard that legitimately went red.
            if bash "$t" </dev/null; then echo "PASS $t"; else
              s=$?; echo "FAIL($s) $t"
              case "$s" in
                141) echo "::warning::$t exited 141 (SIGPIPE) — a pipeline stage was killed mid-write; this is NOT an assertion failure" ;;
                137) echo "::warning::$t exited 137 (SIGKILL) — almost always the OOM killer on the runner" ;;
                124) echo "::warning::$t exited 124 — it hit the timeout" ;;
              esac
              rc=1; failed="$failed $t($s)"
            fi
            echo "::endgroup::"
            ran=$((ran+1))
          done
          echo "── ran $ran suite(s) ──"
          [ -z "$failed" ] || { echo "::error::failed:$failed"; }
          exit $rc

  debian:
    name: shell suites (debian/python)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: python:3.12-slim
    steps:
      - run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git jq openssl perl procps make m4 openssh-client libarchive-tools passwd default-jre-headless
          pip install --quiet pyyaml
      - uses: actions/checkout@v4
      - name: trust the workspace
        # Container jobs run as root against a checkout git considers foreign, so
        # `git ls-files` returns NOTHING. test-platform-key-spelling.sh refuses to
        # run in that state (correctly — it would scan zero files and pass), and
        # other git-reading suites would quietly cover less. Explicit rather than
        # relying on actions/checkout doing it for us.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: preflight
        run: |
          # PREFLIGHT. Many of these suites SKIP their most valuable assertions when a
          # tool is missing and still exit 0 — test-self-report silently drops its jq
          # body-parse asserts, test-cloud-deploy-driver prints "PASS make absent".
          # If the install step ever silently degrades, the whole job would go green
          # having asserted almost nothing. Fail here instead.
          missing=""
          for b in bash jq openssl python3 git perl make; do command -v "$b" >/dev/null 2>&1 || missing="$missing $b"; done
          [ -z "$missing" ] || { echo "::error::preflight: missing$missing — suites would silently skip"; exit 1; }
          echo "preflight ok: bash jq openssl python3 git perl make"
          python3 -c "import yaml" || { echo "::error::pyyaml missing — yaml suites would skip"; exit 1; }
      - name: run suites
        shell: bash
        run: |
          SUITES="
            tests/auto-update/test-builder-opt-in.sh
            tests/egress-vpn/test-vpn-reconcile-verify.sh
            tests/keystores/test-keystores-multidomain.sh
            tests/managed-services/test-managed-services-gate.sh
            tests/node-storage/test-appset.sh
            tests/node-storage/test-node-agent.sh
            tests/phone/test-phone-wizard.sh
            tests/scripts/test-cassandra-cluster-wiring.sh
            tests/scripts/test-client-connect-routes.sh
            tests/scripts/test-cluster-manifest-integrity.sh
            tests/scripts/test-eso-provider-refs.sh
            tests/scripts/test-eso-seed-contract.sh
            tests/scripts/test-first-run-lib.sh
            tests/scripts/test-gitlab-ci-wellformed.sh
            tests/scripts/test-headscale-oidc-secret-staging.sh
            tests/scripts/test-mfa-raw-jwt-posture.sh
            tests/scripts/test-mfa-required-rules.sh
            tests/scripts/test-passhash-lib.sh
            tests/scripts/test-pki-role-san-coverage.sh
            tests/scripts/test-provision-keys-escrow-guard.sh
            tests/scripts/test-python-targets-seed.sh
            tests/scripts/test-x86-artifact-integrity.sh
            tests/stack/test-mfa-flip-wiring.sh
            tests/stack/test-patch-stack-src.sh
            tests/workload-console/test-workload-console.sh
          "
          # Accumulate. A bare `for t in ...; do bash "$t"; done` exits with the LAST
          # suite's status and silently forgives every earlier one — that is defect
          # shape (3) in tests/scripts/test-guard-integrity.sh's own taxonomy.
          rc=0; failed=""; ran=0
          for t in $SUITES; do
            [ -f "$t" ] || { echo "::error::listed suite does not exist: $t"; rc=1; failed="$failed $t(MISSING)"; continue; }
            echo "::group::$t"
            # </dev/null: a suite must never inherit the job's stdin. One that
            # lets a child prompt (ssh-keygen does) would otherwise block until
            # the job timeout, or, in a `while read` runner, silently eat the
            # rest of the suite list.
            # The STATUS is reported, not just PASS/FAIL: 141 is SIGPIPE (a
            # pipeline stage killed, NOT a failed assertion), 137 is the OOM
            # killer, 124 the timeout. Without it every one of those looks
            # exactly like a guard that legitimately went red.
            if bash "$t" </dev/null; then echo "PASS $t"; else
              s=$?; echo "FAIL($s) $t"
              case "$s" in
                141) echo "::warning::$t exited 141 (SIGPIPE) — a pipeline stage was killed mid-write; this is NOT an assertion failure" ;;
                137) echo "::warning::$t exited 137 (SIGKILL) — almost always the OOM killer on the runner" ;;
                124) echo "::warning::$t exited 124 — it hit the timeout" ;;
              esac
              rc=1; failed="$failed $t($s)"
            fi
            echo "::endgroup::"
            ran=$((ran+1))
          done
          echo "── ran $ran suite(s) ──"
          [ -z "$failed" ] || { echo "::error::failed:$failed"; }
          exit $rc

  node:
    name: shell suites (node)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: node:24-alpine
    steps:
      - run: apk add --no-cache bash coreutils findutils git grep jq openssl py3-yaml python3 sed tar
      - uses: actions/checkout@v4
      - name: trust the workspace
        # Container jobs run as root against a checkout git considers foreign, so
        # `git ls-files` returns NOTHING. test-platform-key-spelling.sh refuses to
        # run in that state (correctly — it would scan zero files and pass), and
        # other git-reading suites would quietly cover less. Explicit rather than
        # relying on actions/checkout doing it for us.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: render tooling + git identity
        # test-templating-rename-pr.sh drives the real handlebars render tooling and
        # makes commits. Without the node deps it exits 3 INCOMPLETE — "this suite
        # checked nothing ... Refusing to exit 0" — which is correct behaviour and is
        # exactly how this omission was caught, instead of the job going green on a
        # suite that rendered nothing.
        run: |
          npm ci --prefix scripts/tooling
          git config --global user.email ci@hugmesh.invalid
          git config --global user.name  "hugmesh ci"
      - name: preflight
        run: |
          # PREFLIGHT. Many of these suites SKIP their most valuable assertions when a
          # tool is missing and still exit 0 — test-self-report silently drops its jq
          # body-parse asserts, test-cloud-deploy-driver prints "PASS make absent".
          # If the install step ever silently degrades, the whole job would go green
          # having asserted almost nothing. Fail here instead.
          missing=""
          for b in bash jq openssl python3 git node; do command -v "$b" >/dev/null 2>&1 || missing="$missing $b"; done
          [ -z "$missing" ] || { echo "::error::preflight: missing$missing — suites would silently skip"; exit 1; }
          [ -d scripts/tooling/node_modules/handlebars ] || { echo "::error::handlebars absent — the drift gate would render nothing"; exit 1; }
          # PCRE grep. tests/menu/ncurses_charset_test.sh proves the menu's non-UTF-8
          # transliteration leaves NO byte above 0x7F, and the only assertion that can
          # say so is `grep -P '[^\x00-\x7F]'`. busybox grep has no -P: it exits 2 with
          # a usage message, the `if` reads false, and the suite records a PASS having
          # checked nothing. MEASURED 2026-08-26 on alpine:3 with a real regression
          # planted (the ⚙ mapping deleted from scripts/build-menu.sh): alpine 20
          # passed / 0 failed, this image 19 passed / 1 failed. That is why the suite
          # lives in THIS job and not the alpine one, and why its dependency is
          # asserted here instead of assumed.
          printf '\303\251\n' | grep -P '[^\x00-\x7F]' >/dev/null || { echo "::error::grep has no working -P — ncurses_charset_test.sh's non-ASCII assertion would pass vacuously"; exit 1; }
          echo "preflight ok: bash jq openssl python3 git node handlebars grep-P"
      - name: run suites
        shell: bash
        run: |
          SUITES="
            tests/domain-registry/test-domain-reconcile-fuzz.sh
            tests/domain-registry/test-templating-rename-pr.sh
            tests/menu/ncurses_charset_test.sh
          "
          # Accumulate. A bare `for t in ...; do bash "$t"; done` exits with the LAST
          # suite's status and silently forgives every earlier one — that is defect
          # shape (3) in tests/scripts/test-guard-integrity.sh's own taxonomy.
          rc=0; failed=""; ran=0
          for t in $SUITES; do
            [ -f "$t" ] || { echo "::error::listed suite does not exist: $t"; rc=1; failed="$failed $t(MISSING)"; continue; }
            echo "::group::$t"
            # </dev/null: a suite must never inherit the job's stdin. One that
            # lets a child prompt (ssh-keygen does) would otherwise block until
            # the job timeout, or, in a `while read` runner, silently eat the
            # rest of the suite list.
            # The STATUS is reported, not just PASS/FAIL: 141 is SIGPIPE (a
            # pipeline stage killed, NOT a failed assertion), 137 is the OOM
            # killer, 124 the timeout. Without it every one of those looks
            # exactly like a guard that legitimately went red.
            if bash "$t" </dev/null; then echo "PASS $t"; else
              s=$?; echo "FAIL($s) $t"
              case "$s" in
                141) echo "::warning::$t exited 141 (SIGPIPE) — a pipeline stage was killed mid-write; this is NOT an assertion failure" ;;
                137) echo "::warning::$t exited 137 (SIGKILL) — almost always the OOM killer on the runner" ;;
                124) echo "::warning::$t exited 124 — it hit the timeout" ;;
              esac
              rc=1; failed="$failed $t($s)"
            fi
            echo "::endgroup::"
            ran=$((ran+1))
          done
          echo "── ran $ran suite(s) ──"
          [ -z "$failed" ] || { echo "::error::failed:$failed"; }
          exit $rc

  extras:
    name: shell suites (tool-heavy)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: python:3.12-slim
    steps:
      - run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git jq openssl curl ca-certificates \
            make m4 checkpolicy semodule-utils policycoreutils selinux-policy-dev
          pip install --quiet pyyaml
          # Pinned. An unpinned "latest" here would change what these suites assert
          # without a commit ever saying so.
          curl -fsSL https://get.helm.sh/helm-v3.16.3-linux-amd64.tar.gz \
            | tar -xz -C /tmp linux-amd64/helm
          mv /tmp/linux-amd64/helm /usr/local/bin/helm
          curl -fsSLo /usr/local/bin/kubectl https://dl.k8s.io/release/v1.31.0/bin/linux/amd64/kubectl
          chmod +x /usr/local/bin/kubectl
      - uses: actions/checkout@v4
      - name: trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: preflight
        run: |
          # kubectl matters MORE than usual here: without it
          # tests/stack/test-mdm-manifests-render.sh exits 0 having rendered and
          # asserted nothing. If the download above ever silently fails, this job
          # would pass while covering a third less than it claims.
          missing=""
          for b in bash jq openssl python3 git helm kubectl checkpolicy make; do command -v "$b" >/dev/null 2>&1 || missing="$missing $b"; done
          [ -z "$missing" ] || { echo "::error::preflight: missing$missing — suites would silently skip"; exit 1; }
          python3 -c "import yaml" || { echo "::error::pyyaml missing"; exit 1; }
          echo "preflight ok"
      - name: run suites
        shell: bash
        run: |
          SUITES="
            tests/scripts/test-selinux-policy-install.sh
            tests/scripts/test-selinux-auditallow-generator.sh
            tests/stack/test-gateway-mfa-env.sh
            tests/stack/test-mdm-manifests-render.sh
          "
          rc=0; failed=""; ran=0
          for t in $SUITES; do
            [ -f "$t" ] || { echo "::error::listed suite does not exist: $t"; rc=1; failed="$failed $t(MISSING)"; continue; }
            echo "::group::$t"
            # </dev/null: a suite must never inherit the job's stdin. One that
            # lets a child prompt (ssh-keygen does) would otherwise block until
            # the job timeout, or, in a `while read` runner, silently eat the
            # rest of the suite list.
            # The STATUS is reported, not just PASS/FAIL: 141 is SIGPIPE (a
            # pipeline stage killed, NOT a failed assertion), 137 is the OOM
            # killer, 124 the timeout. Without it every one of those looks
            # exactly like a guard that legitimately went red.
            if bash "$t" </dev/null; then echo "PASS $t"; else
              s=$?; echo "FAIL($s) $t"
              case "$s" in
                141) echo "::warning::$t exited 141 (SIGPIPE) — a pipeline stage was killed mid-write; this is NOT an assertion failure" ;;
                137) echo "::warning::$t exited 137 (SIGKILL) — almost always the OOM killer on the runner" ;;
                124) echo "::warning::$t exited 124 — it hit the timeout" ;;
              esac
              rc=1; failed="$failed $t($s)"
            fi
            echo "::endgroup::"
            ran=$((ran+1))
          done
          echo "── ran $ran suite(s) ──"
          [ -z "$failed" ] || { echo "::error::failed:$failed"; }
          exit $rc
