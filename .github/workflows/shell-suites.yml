                124) echo "::warning::$t exited 124 — it hit the timeout" ;;
              esac
              rc=1; failed="$failed $t($s)"
            fi
            echo "::endgroup::"
            ran=$((ran+1))
          done
          echo "── ran $ran suite(s) ──"
          [ -z "$failed" ] || { echo "::error::failed:$failed"; }
          exit $rc
