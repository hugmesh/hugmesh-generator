  node:
    name: shell suites (node)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: node:24-alpine
    steps:
      # make: test-e2e-toolchain-readiness.sh renders and DRIVES the repo Makefile
      # (legs C/D) — node:24-alpine ships no make, and without it the suite exits 2
      # SKIPPED-LOUDLY, which this job's runner rightly counts as a failure.
      # openssh-keygen: test-foreign-ingest-fuzz.sh's Phase-7 key-staging leg drives
      # gen-provision-keys.sh --foreign-mesh-trust, which mints a real Ed25519 keypair.
      # Without it that leg prints "SKIP key-staging" and the suite still exits 0 — the
      # silent-skip shape this whole file exists to stop. MEASURED in node:24-alpine
      # 2026-09-04, this apk set with and without the package: the seven suites already
      # listed below are byte-identical either way (101/0, 82/0, 20/0, 14/0, 14/0, 30/0,
      # 176/0+1skip), and the foreign-ingest suite goes 89 passed -> 92 passed. So it
      # buys three real assertions and costs nothing.
      - run: apk add --no-cache bash coreutils findutils git grep jq make openssh-keygen openssl py3-yaml python3 sed tar
      - uses: actions/checkout@v4
      - name: trust the workspace
        # Container jobs run as root against a checkout git considers foreign, so
        # `git ls-files` returns NOTHING. test-platform-key-spelling.sh refuses to
        # run in that state (correctly — it would scan zero files and pass), and
        # other git-reading suites would quietly cover less. Explicit rather than
        # relying on actions/checkout doing it for us.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: render tooling + git identity
        # test-templating-rename-pr.sh drives the real handlebars render tooling and
        # makes commits. Without the node deps it exits 3 INCOMPLETE — "this suite
        # checked nothing ... Refusing to exit 0" — which is correct behaviour and is
        # exactly how this omission was caught, instead of the job going green on a
        # suite that rendered nothing.
        run: |
          npm ci --prefix scripts/tooling
          git config --global user.email ci@hugmesh.invalid
          git config --global user.name  "hugmesh ci"
      - name: preflight
        run: |
          # PREFLIGHT. Many of these suites SKIP their most valuable assertions when a
          # tool is missing and still exit 0 — test-self-report silently drops its jq
          # body-parse asserts, test-cloud-deploy-driver prints "PASS make absent".
          # If the install step ever silently degrades, the whole job would go green
          # having asserted almost nothing. Fail here instead.
          missing=""
          for b in bash jq openssl python3 git node make ssh-keygen; do command -v "$b" >/dev/null 2>&1 || missing="$missing $b"; done
          [ -z "$missing" ] || { echo "::error::preflight: missing$missing — suites would silently skip"; exit 1; }
          [ -d scripts/tooling/node_modules/handlebars ] || { echo "::error::handlebars absent — the drift gate would render nothing"; exit 1; }
          # PCRE grep. tests/menu/ncurses_charset_test.sh proves the menu's non-UTF-8
          # transliteration leaves NO byte above 0x7F, and the only assertion that can
          # say so is `grep -P '[^\x00-\x7F]'`. busybox grep has no -P: it exits 2 with
          # a usage message, the `if` reads false, and the suite records a PASS having
          # checked nothing. MEASURED 2026-08-26 on alpine:3 with a real regression
          # planted (the ⚙ mapping deleted from scripts/build-menu.sh): alpine 20
          # passed / 0 failed, this image 19 passed / 1 failed. That is why the suite
          # lives in THIS job and not the alpine one, and why its dependency is
          # asserted here instead of assumed.
          printf '\303\251\n' | grep -P '[^\x00-\x7F]' >/dev/null || { echo "::error::grep has no working -P — ncurses_charset_test.sh's non-ASCII assertion would pass vacuously"; exit 1; }
          echo "preflight ok: bash jq openssl python3 git node ssh-keygen handlebars grep-P"
      - name: run suites
        shell: bash
        run: |
          SUITES="
            tests/domain-registry/test-domain-reconcile-fuzz.sh
            tests/domain-registry/test-foreign-ingest-fuzz.sh
            tests/domain-registry/test-templating-rename-pr.sh
            tests/menu/ncurses_charset_test.sh
            tests/scripts/test-e2e-coverage-matrix-harness.sh
            tests/scripts/test-e2e-docker-base-url-parity.sh
            tests/scripts/test-e2e-reporter-shape.sh
            tests/scripts/test-e2e-toolchain-readiness.sh
          "
          # Accumulate. A bare `for t in ...; do bash "$t"; done` exits with the LAST
