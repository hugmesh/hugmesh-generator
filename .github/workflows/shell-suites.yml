          # without a commit ever saying so.
          curl -fsSL https://get.helm.sh/helm-v3.16.3-linux-amd64.tar.gz \
            | tar -xz -C /tmp linux-amd64/helm
          mv /tmp/linux-amd64/helm /usr/local/bin/helm
          curl -fsSLo /usr/local/bin/kubectl https://dl.k8s.io/release/v1.31.0/bin/linux/amd64/kubectl
          chmod +x /usr/local/bin/kubectl
