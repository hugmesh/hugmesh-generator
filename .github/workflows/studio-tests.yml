# HugMesh Image Studio — pre-merge test gate.
#
# THIS IS THIS REPOSITORY'S FIRST GITHUB WORKFLOW, and the README used to say not to
# add one ("Actions is billing-blocked org-wide"). That claim is stale and is corrected
# in the same change that adds this file: `gh api repos/hugmesh/<repo>/actions/permissions`
# returns {"enabled":true,"allowed_actions":"all"}, and sibling repos have run
# ubuntu-latest jobs successfully. Real CI is still GitLab (.gitlab-ci.yml, 83 jobs on
# the in-cluster runner); this is an additive convenience so a studio/ change gets a
# fast answer on a pull request without waiting for the cluster.
#
# RUNNER: ubuntu-latest, NEVER [self-hosted, hugmesh-x86]. Zero self-hosted runners are
# registered against this org, so every job that has ever requested that label queued
# for 24 hours and was cancelled. A gate that can never go green is worse than no gate.
name: Studio tests

on:
  pull_request:
    paths:
      - 'studio/**'
      - '.github/workflows/studio-tests.yml'
      # NOT a studio path, deliberately. studio/tests/test_theme_boundary.py and
      # test_login_theme_pipeline.py assert against this compose file — it is the
      # PRODUCER half of the runtime-theme contract (the HUG_THEME_CSS passthrough
      # every themed UI service carries). A rename or a dropped passthrough lands
      # ONLY in this file, so without this path the very gate that exists to catch
      # a one-sided theme rename would not run on the change that causes one.
      - 'tests/stack/compose.local.yaml'
      # Same reason, different contract. studio/tests/test_local_stack_preflight.py's
      # drift guard runs THIS script's own `_check_path_from_pins` against the Python
      # preflight's derivation of the same maven coordinate. A rename that lands only
      # here (`systems/hugmesh` -> `net/hugmesh` did exactly that) touches no studio
      # path, so without this line the guard would not run on the change it exists for.
      - 'tests/stack/m2-bootstrap.sh'
      # Same reason again. studio/tests/test_route_access_env.py RUNS this script: the
      # Mesh Monitor's compose scale calls it before `up --scale` and reads the
      # tests/stack/.env key it writes. A change to its file name, flags or file format
      # lands only here.
      - 'tests/stack/gen-route-access-env.sh'
      # The same pair for the local stack's DB passwords (hugmesh-generator#857):
      # studio/tests/test_stack_db_read_env.py RUNS the resolver (the scale's
      # ensure_stack_db_env) and reads the key table the Studio's read paths fill.
      - 'tests/stack/gen-stack-db-env.sh'
      - 'tests/stack/stack-db-passwords.tsv'
      # Same reason a third time, and the one this unit added. The spec -> persona
      # index (studio/hugmesh_studio/core/e2e_personas.py) is DERIVED from these six
      # files and from nothing in studio/: the typed RBAC catalogue and the specs that
      # slice it, plus the three shell seeders that decide which of those personas a
      # mesh actually provisions. Its guard exists to fail when a spec, a roster or a
      # matrix drifts — and every one of those drifts lands ONLY here, so without
      # these paths the gate would never run on the change it was written to catch.
      - 'tests/e2e/specs/**'
      - 'tests/qemu/seed-accounts.sh'
      - 'tests/stack/seed-e2e.sh'
      - 'tests/e2e-extra-personas.sh'
      # And a fourth time, for the lane this integration created. Two studio tests
      # assert against the ROOT Makefile rather than against anything in studio/:
      # test_pages_e2e_tree.py pins that `stack-e2e` still expands $(E2E_SPECS) (the
      # only leg a stub `make` cannot prove — without it the Studio hands the suite a
      # selection it silently ignores and runs all 221 tests), and test_cli_args.py
      # reads the same file. A drift there lands ONLY in the Makefile, so without
      # this path the gate would not run on the change it exists to catch.
      - 'Makefile'
      # studio/tests/test_desktop_option_parity.py drives the make menu's Desktop
      # options (it sources this script and runs its real handler) and reads the
      # flags the desktop builders parse. A menu change lands only here.
      - 'scripts/build-menu.sh'
      # hugmesh-generator#591: the named-file pin suite below, and the scripts its
      # fleet pins run (test_fleet_tor.py executes the REAL build-all-roles.sh
      # against stub builders and reads the rpi5 builder's default service line).
      - 'tests/scripts/test-studio-tor-domain-pins.sh'
      - 'scripts/build-all-roles.sh'
      - 'scripts/_roles-lib.sh'
      - 'build-rpi5-stage4.sh'
      # studio/tests/test_studio_installers_doc.py holds the installers page's "clone
      # hugmesh-generator" rows to the release jobs that prove a package carries the
      # tree. The page and the release workflow are both outside studio/, and a change
      # to either alone (a seed step added to the MSI job, a row edited) is exactly the
      # drift that guard exists to catch.
      - 'docs/STUDIO-INSTALLERS.md'
      - '.github/workflows/studio-release.yml'
  # A PUSH to main, for the Studio release machinery only. The release guard tests
  # (test_studio_beta_version.py, test_studio_release_signing.py,
  # test_studio_release_cut.py) parse the release workflows, and on 2026-10-22/23
  # studio-release.yml was edited by hand on main through the web UI: three of them
  # went red and nothing showed it, because this workflow ran only on pull requests.
  # Now such an edit goes red where it happened. A push made with GITHUB_TOKEN (the
  # cut workflow's bump commit) does not fire this, by GitHub's no-cascade rule; the
  # cut runs the same tests itself before it commits anything.
  push:
    branches: [main]
    paths:
      - '.github/workflows/studio-release.yml'
      - '.github/workflows/studio-release-cut.yml'
      - 'studio/packaging/release_version.py'
      - 'studio/hugmesh_studio/__init__.py'
      - 'studio/packaging/flatpak/org.hugmesh.ImageStudio.metainfo.xml'
      - 'scripts/release-studio.sh'
      # The GUARDS themselves, and every file they read by a literal path. On
      # 2026-11-05/06 test_studio_beta_version.py was hand-edited and then cut from 21
      # tests to 1 on main through the web UI. Each of those commits touched only
      # studio/tests/*, so the list above never fired and nothing went red. The 0.4 cut
      # then ran its guard step on the one remaining test.
      # studio/tests/test_studio_tests_push_paths.py derives this set from the cut's
      # guard step and from the files the guards open, and fails if any entry is missing.
      - '.github/workflows/studio-tests.yml'
      - 'studio/tests/test_studio_beta_version.py'
      - 'studio/tests/test_studio_release_signing.py'
      - 'studio/tests/test_studio_release_cut.py'
      - 'studio/tests/test_release_studio_script.py'
      - 'studio/tests/test_studio_tests_push_paths.py'
      - 'studio/packaging/wix/msi_version.py'
      - 'studio/packaging/build-msi-wine.sh'
      - 'studio/packaging/wix/windows-build-requirements.txt'
      - 'studio/packaging/linux-build-requirements.txt'
      # The cut's guard step runs under pytest.ini's options, so an edit to it can
      # change what the guards do; test_studio_beta_version.py's bump simulation reads it.
      - 'studio/pytest.ini'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: studio-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    # No workflow in this fleet sets a timeout, which is exactly why 54 runs sat in a
    # queue for a day. 20 minutes is ~25x the suite's real runtime.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        # FULL checkout, not a sparse studio/ one: the suite parses the nine
        # build-*-stage4.sh scripts, the Makefile, Dockerfile.build, scripts/*.sh and
        # tests/stack/compose.local.yaml to assert the GUI and the CLI agree.

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install test dependencies
        # NO Qt binding is installed on purpose. The GUI tests are excluded below, and
        # importing a real Qt in a headless container is what makes the full suite
        # abort rather than fail — see the exclusion list.
        #
        # cryptography IS installed on purpose, although it is an optional runtime
        # dependency of the Studio: core/config.py reads a certificate's subject and
        # expiry only when it is importable, and without it says "install
        # python-cryptography to show subject and expiry". tests/test_tui_vault.py
        # pins the cryptography-backed message, so a runner without it fails that test
        # on every run (run 37682050311) while a box that has it passes.
        run: python -m pip install --upgrade pip pytest PyYAML jsonschema cryptography

      - name: Run the Qt-free suite
        working-directory: studio
        # TWO exclusions, for two different reasons — both stated rather than folded
        # into one silent flag list.
        #
        # --ignore: six GUI test files. With a Qt binding installed a full
        #   single-process run ABORTS partway through (SIGABRT/SIGSEGV inside Qt's
        #   event-loop teardown) on every Python/binding combination tried, and
        #   neither pytest-xdist nor pytest-forked rescues it. GitLab runs the fuller
        #   `test:studio-suite` job against PySide6 with QT_QPA_PLATFORM=offscreen;
        #   this job is the fast pre-merge subset and says so rather than pretending
        #   to be complete.
        #
        # --deselect: whatever tests/known-failures.txt lists — tests that already
        #   fail on main. A brand-new gate that is red on day one gets ignored within
        #   a week, so it grades the change under review, not the backlog. They are
        #   NOT hidden: the next step re-runs exactly those and reports them.
        #
        #   THE LIST IS CURRENTLY EMPTY, and the loop below is written to stay
        #   correct that way: `deselect` stays "" and pytest gets no extra flags.
        #   The 12 entries it used to carry were audited on 2026-08-20 and every one
        #   of them was either a missing-Qt-binding failure that belonged in an
        #   importorskip, a stale pin, or a live drift with a fix — see the file's
        #   own header for which was which.
        run: |
          deselect=""
          while read -r line; do
            case "$line" in ''|'#'*) continue ;; esac
            deselect="$deselect --deselect $line"
          done < tests/known-failures.txt

          # shellcheck disable=SC2086
          python -m pytest -q tests \
            --ignore=tests/test_local_mesh_bringup.py \
            --ignore=tests/test_localmesh_log_coalescing.py \
            --ignore=tests/test_login_theme_gui.py \
            --ignore=tests/test_probe_lifecycle.py \
            --ignore=tests/test_theme_editor_gui.py \
            --ignore=tests/test_use_flag_filter.py \
            $deselect

      # hugmesh-generator#591: the Tor / per-domain pins as ONE named suite, so the
      # guard over the guards counts it as gated (check 7) and a renamed pin file
      # turns it RED instead of silently leaving the set. This job installs no Qt
      # binding, so HUGMESH_PINS_ALLOW_NO_QT=1 lets the Qt-free half gate here and
      # the wrapper PRINTS how many GUI pins skipped; on a box with the Studio venv
      # the same command runs all of them and refuses any skip. MEASURED 2026-09-23
      # on a Qt-free venv (pytest + PyYAML + jsonschema only, this job's install
      # line; python 3.14 there, 3.12 here): 231 passed, 7 skipped (the seven
      # Qt-bound modules), rc=0; with the Studio venv (PyQt6): 379 passed,
      # 0 skipped, rc=0.
      - name: Tor / per-domain pins (the named-file suite)
        env:
          HUGMESH_STUDIO_PYTHON: python
          HUGMESH_PINS_ALLOW_NO_QT: '1'
        run: bash tests/scripts/test-studio-tor-domain-pins.sh

      - name: Report the known failures
        working-directory: studio
        # Non-blocking BY DESIGN, and the whole reason deselecting is honest here: the
        # backlog stays visible on every run, and the moment one of these starts
        # passing the summary says so and the line can be deleted.
        if: always()
        continue-on-error: true
        run: |
          # `|| true` IS LOad-BEARING. Actions runs `run:` under `bash -e`, and grep
          # exits 1 when it selects no lines — which is exactly what happens once the
          # list is all comments. Without it this step dies on its FIRST line, writes
          # nothing to the summary at all, and only `continue-on-error: true` keeps
          # the job green. Observed, not theorised: run 32423468651.
          nodes=$(grep -vE '^[[:space:]]*#|^[[:space:]]*$' tests/known-failures.txt || true)
          echo "## Known failures (pre-existing on main)" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"

          # EMPTY LIST IS THE GOOD CASE, and it MUST short-circuit. `pytest $nodes`
          # with $nodes empty is not "run nothing" — studio/pytest.ini sets
          # `testpaths = tests`, so it runs the WHOLE suite, unfiltered by the
          # --ignore list the blocking step above applies. That collection errors on
          # the six GUI files (no Qt binding here), pytest exits non-zero, and this
          # step writes "Still failing, as expected" — a sentence with no failing
          # known entry behind it. The file's own instruction is to delete a line the
          # moment its test passes, so emptying the list is the intended end state and
          # walking into that message is the trap it leads to.
          # shellcheck disable=SC2016  # the backticks are Markdown, not command substitution
          if [ -z "$nodes" ]; then
            {
              echo 'None. `studio/tests/known-failures.txt` lists no deselected tests,'
              echo 'so the blocking step above ran the whole Qt-free suite with nothing'
              echo 'muted. Keep it that way.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # shellcheck disable=SC2016,SC2086  # Markdown backticks; $nodes is a word list
          if python -m pytest -q --no-header $nodes > known.txt 2>&1; then
            {
              echo '**These now PASS.** Delete them from `studio/tests/known-failures.txt`'
              echo 'so they start gating again.'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo 'Still failing, as expected. Not caused by this pull request.'
              echo
              echo 'NB this is ONE aggregate exit code over every id in the file: a single'
              echo 'permanently-failing entry (a missing binding, say) keeps this red and'
              echo 'hides a fix in all the others. If you are reading this, check the list'
              echo 'itself before believing it.'
              echo
              echo '```'
              grep -E '^(FAILED|ERROR)|passed|failed' known.txt | tail -20
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check the packaging metadata is loadable
        working-directory: studio
        # Cheap, and it catches the class of mistake that only shows up when a release
        # is being cut: a pyproject that does not parse, or a version that moved in
        # __init__.py without the packaging following it.
        run: |
          python -c "
          import tomllib, pathlib, re
          meta = tomllib.load(open('pyproject.toml','rb'))
          src = pathlib.Path('hugmesh_studio/__init__.py').read_text()
          version = re.search(r'__version__ = \"([^\"]+)\"', src).group(1)
          assert meta['project']['name'] == 'hugmesh-image-studio', meta['project']['name']
          assert meta['tool']['setuptools']['dynamic']['version']['attr'] == 'hugmesh_studio.__version__'
          print('pyproject OK; version', version)
          "

  windows:
    # The MSI runs the Studio NATIVELY on Windows, and until 2026-10-29 no test had ever
    # run there. The first run of the 0.3.0-beta.1 MSI on Windows 11 found: every run log
    # written as a 0-byte *-FAILED.log (an unguarded os.fchmod), DER keys corrupted
    # LF->CRLF (os.open without O_BINARY), crashed builds stuck "running" forever
    # (os.kill(pid, 0) is not a probe on Windows), local-mesh and DevOps verbs failing
    # with "make is required", every CLI flag printing nothing (a windowed exe has
    # no stdout), and --print-specs itself exiting 2 because the default image login
    # was the raw Windows account name ("Magus"), which the login allowlist refuses.
    #
    # NAMED FILES, NOT THE SUITE. The suite assumes POSIX throughout (bash fixtures,
    # mode bits, os.geteuid at import) and does not finish on Windows: a test that calls
    # os.kill(pid, 0) there sends Ctrl+C to the console group and kills pytest itself.
    # These files are the Windows contract; a new Windows fix adds its test here.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: studio/packaging/wix/windows-build-requirements.txt

      - name: Install the MSI's locked packages, then pytest
        # The same hash-locked set the MSI freezes (PySide6 included: the run-log test
        # drives the real page code). pytest is a second install because a
        # --require-hashes install refuses any line without a hash.
        # Each native call is checked: pwsh does not stop on a failing exe, so without the
        # checks a failed locked install was masked by a successful second one, and the
        # run-log test below (importorskip on Qt) would SKIP and the job go green.
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r studio/packaging/wix/windows-build-requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "the locked install failed ($LASTEXITCODE)" }
          python -m pip install pytest PyYAML jsonschema
          if ($LASTEXITCODE -ne 0) { throw "pip install pytest failed ($LASTEXITCODE)" }
          python -c "import PySide6.QtCore as q; print('PySide6', q.qVersion())"
          if ($LASTEXITCODE -ne 0) { throw "PySide6 does not import: the run-log test would skip" }

      - name: Run the Windows contract
        working-directory: studio
        env:
          QT_QPA_PLATFORM: offscreen
        run: >-
          python -m pytest -q
          tests/test_native_windows_gates.py
          tests/test_windows_binary_writes.py
          tests/test_default_local_user.py
          tests/test_golive_target.py
          tests/test_no_console.py
          tests/test_localmesh_run_log_private.py
          tests/test_build_sessions.py
          tests/test_windows_text_io.py
          tests/test_generator_dir.py
          tests/test_windows_sentences.py
          tests/test_org_export_windows.py
          tests/test_windows_fleet.py
          tests/test_docker_asset_mounts.py
          tests/test_windows_sweep_c1.py
          tests/test_windows_sweep_c2.py
          tests/test_windows_sweep_c3.py
          tests/test_windows_sweep_c4.py
          tests/test_windows_sweep_c5.py
          tests/test_windows_sweep_c6.py
          tests/test_windows_sweep_c7.py
          tests/test_windows_sweep_c8.py
          tests/test_windows_sweep_c9.py
          tests/test_windows_sweep_c10.py
          tests/test_windows_load_and_cleanup.py
          tests/test_windows_polish.py
          tests/test_mesh_token.py
          tests/test_mesh_token_tray.py
          tests/test_mesh_token_issue.py
          tests/test_mesh_token_issue_dialog.py
          tests/test_tui_mesh_token.py
          tests/test_qemu_windows.py
          tests/test_qemu_windows_cli.py
          tests/test_pages_mesh_emulation_whpx.py
          tests/test_tui_meshemu_whpx.py
          "tests/test_tui_gui_parity.py::test_the_emulation_backend_choices_are_one_tuple_on_every_face"
          tests/test_golive_registry.py
          "tests/test_tui_gui_parity.py::test_go_live_offers_and_plans_the_same_domains_on_both_faces"
          "tests/test_windows_packaging_files.py::test_the_spec_freezes_the_entry_shim_as_a_windowed_onedir"
          "tests/test_windows_packaging_files.py::test_windows_also_freezes_a_console_twin_into_the_same_tree"
          tests/test_local_ai_windows.py
          tests/test_local_ai_status.py
          tests/test_local_ai_cli.py
          tests/test_assistant_code_edits.py
          tests/test_session_locations.py
          tests/test_pages_session_locations.py
          tests/test_managed_generator.py
          tests/test_local_ai_models.py
          tests/test_ollama_docker.py
          tests/test_local_ai_dock.py
          tests/test_local_ai_dock_pull.py

  macos:
    # The macOS app: "HugMesh Image Studio.app" in a .dmg, for Apple silicon and Intel.
    # A Mac runs the Studio as a POSIX program whose builds go through a Docker VM
    # (Docker Desktop, colima or OrbStack), like Windows and unlike Linux; the darwin
    # branches in core/ are unit-tested on Linux with an injected sys.platform, and THIS
    # job is where they meet a real Mac: real diskutil/sysctl output, real /bin/bash 3.2,
    # a real Finder-style PATH, a real cocoa window.
    #
    # NAMED FILES, as in the windows job: these are the macOS contract, and a new macOS
    # fix adds its test here. Then packaging/build-macos-app.sh freezes, checks,
    # smoke-tests and packs the app. studio-release.yml has no macOS job yet (the .dmg
    # is not on a release); when it gets one it must run this SAME script, so that what
    # a pull request proves is what the release ships.
    #
    # macos-15 is Apple silicon (arm64) and macos-15-intel is x86_64; both are GitHub's
    # standard hosted images, pinned by version rather than macos-latest so the
    # minimum-macOS floor the bundle is tested on does not move silently. No Docker on
    # either (hosted macOS runners have no nested virtualisation), so a Mac BUILD of an
    # image is not proven here; the Studio says so (EXPERIMENTAL) in its preflight.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: studio/packaging/macos-build-requirements.txt

      - name: Record the host facts the darwin code parses
        # What core/macos_host.py and core/flash_targets.py read on a Mac, captured from
        # the runner itself, so the test fixtures are this output and not someone's
        # memory of it. Never fails the job; the files are uploaded below.
        continue-on-error: true
        run: |
          out="$RUNNER_TEMP/host-facts"
          mkdir -p "$out"
          cap() { name=$1; shift; "$@" > "$out/$name" 2>&1 || echo "exit $?" >> "$out/$name"; }
          cap uname.txt uname -a
          cap sw_vers.txt sw_vers
          cap sysctl.txt sysctl hw.optional.arm64 kern.hv_support hw.memsize hw.ncpu machdep.cpu.brand_string kern.osproductversion
          cap bash-bin.txt /bin/bash --version
          cap bash-path.txt bash --version
          cap which.txt which -a bash sed make readlink find grep awk xz qemu-system-x86_64 docker colima
          cap gnu.txt sh -c 'sed --version | head -1; make --version | head -1; readlink --version | head -1; find --version | head -1; grep --version | head -1; awk --version | head -1'
          cap brew-opt.txt ls /opt/homebrew/opt /usr/local/opt
          cap diskutil-list.plist diskutil list -plist
          cap diskutil-list-external.plist diskutil list -plist external physical
          cap diskutil-info-root.plist diskutil info -plist /
          cap diskutil-apfs.plist diskutil apfs list -plist
          cap launchctl.txt launchctl managername
          cap env-path.txt sh -c 'echo "$PATH"'
          ls -la "$out"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-host-facts-${{ matrix.arch }}
          path: ${{ runner.temp }}/host-facts
          retention-days: 14

      - name: Install the pinned build dependencies, then pytest
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --only-binary=:all: -r studio/packaging/macos-build-requirements.txt
          "$RUNNER_TEMP/venv/bin/python" -m pip install pytest PyYAML jsonschema
          "$RUNNER_TEMP/venv/bin/python" -m pip freeze
          "$RUNNER_TEMP/venv/bin/python" -c "import PySide6.QtCore as q; print('PySide6', q.qVersion())"

      - name: Run the macOS contract
        working-directory: studio
        env:
          QT_QPA_PLATFORM: offscreen
        # -v: the tests marked "needs a real Mac" are this job's proof, so each one is
        # named in the log as PASSED rather than folded into a row of dots.
        run: >-
          "$RUNNER_TEMP/venv/bin/python" -m pytest -v -rs
          tests/test_macos_packaging.py
          tests/test_macos_host.py
          tests/test_platform_macos.py
          tests/test_macos_terminals.py
          tests/test_entry_bootstrap.py
          tests/test_macos_docker_cpus.py
          tests/test_macos_stock_texts.py
          tests/test_macos_stock_texts_gui.py
          tests/test_pages_build_macos.py

      - name: A stock Mac - the self-check names the missing GNU tools and exits 1
        # Before Homebrew's GNU tools are installed: macOS's own bash 3.2 and BSD sed,
        # find, grep and stat. Run from the checkout with launchd's PATH (what a Finder
        # launch gets); the refusal must name each missing formula and the brew line.
        run: |
          set +e
          env -i HOME="$RUNNER_TEMP/stock-home" PATH=/usr/bin:/bin:/usr/sbin:/sbin \
            PYTHONPATH="$GITHUB_WORKSPACE/studio" \
            "$RUNNER_TEMP/venv/bin/python" -m hugmesh_studio --self-check --json \
            --generator-dir "$GITHUB_WORKSPACE" > "$RUNNER_TEMP/stock.json"
          rc=$?
          set -e
          "$RUNNER_TEMP/venv/bin/python" studio/packaging/check_macos_bundle.py \
            --self-check-report "$RUNNER_TEMP/stock.json" --exit-code "$rc" --require-gnu 0
          "$RUNNER_TEMP/venv/bin/python" - "$RUNNER_TEMP/stock.json" <<'PY'
          import json, sys
          mac = json.load(open(sys.argv[1]))["macos"]
          want = {"bash", "gnu-sed", "coreutils", "findutils", "grep"}
          missing = set(mac["gnu_missing"])
          assert want <= missing, f"a stock Mac should lack {sorted(want - missing)}: {mac}"
          print("stock Mac refused as it should:", sorted(missing))
          PY

      - name: Install the GNU userland the docs ask for
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: brew install bash coreutils gnu-sed findutils grep make

      - name: Build, check and smoke-test the app, then pack the .dmg
        run: >-
          bash studio/packaging/build-macos-app.sh
          --python "$RUNNER_TEMP/venv/bin/python"
          --arch ${{ matrix.arch }}
          --dist "$RUNNER_TEMP/dist"
          --gui-smoke
          --require-gnu

      - name: From the checkout, with launchd's PATH - the whole self-check passes
        # The half the frozen app cannot do (it has no Python sources to list the
        # generator paths from): every path and make target the Studio names, and
        # `bash -n` on every script, with the bash 5 the PATH hook found.
        run: |
          env -i HOME="$RUNNER_TEMP/full-home" PATH=/usr/bin:/bin:/usr/sbin:/sbin \
            PYTHONPATH="$GITHUB_WORKSPACE/studio" \
            "$RUNNER_TEMP/venv/bin/python" -m hugmesh_studio --self-check --json \
            --generator-dir "$GITHUB_WORKSPACE" > "$RUNNER_TEMP/full.json"
          "$RUNNER_TEMP/venv/bin/python" - "$RUNNER_TEMP/full.json" <<'PY'
          import json, sys
          r = json.load(open(sys.argv[1]))
          print(json.dumps({k: r.get(k) for k in ("checked_paths", "scripts_parsed", "macos", "problems")}, indent=1))
          assert r["macos"]["gnu_missing"] == [] and r["macos"]["bash_major"] >= 4, r["macos"]
          assert r["checked_paths"] > 0 and r["scripts_parsed"] > 0, "a vacuous self-check"
          assert not r["problems"], r["problems"]
          PY

      - name: With launchd's PATH - the text UI and a module command line find the GNU tools too
        # The PATH hook used to run for the window only. Homebrew leaves its GNU tools
        # in <prefix>/opt/<formula>/libexec/gnubin, off every shell's PATH, so the text
        # UI and `python -m hugmesh_studio.core.<module>` refused a Mac that HAD run the
        # brew line. Both are started here with the PATH a Finder launch gets, against
        # the runner's real Homebrew: first shown to lack the tools without the hook
        # (so this proves something), then driven through their real entries.
        run: |
          env -i HOME="$RUNNER_TEMP/tui-home" PATH=/usr/bin:/bin:/usr/sbin:/sbin \
            PYTHONPATH="$GITHUB_WORKSPACE/studio" GEN="$GITHUB_WORKSPACE" \
            "$RUNNER_TEMP/venv/bin/python" - <<'PY'
          import io, os, subprocess, sys
          from hugmesh_studio.core import macos_host, platform_info
          before = macos_host.gnu_userland_missing()
          assert before, "launchd's PATH already holds the GNU tools: the hook proves nothing"
          print("without the hook this PATH lacks:", before)
          finder_env = dict(os.environ)
          from hugmesh_studio.tui import app as tui
          rc = tui.main(["--worklist", "no-such-session"], inp=io.StringIO(""), out=io.StringIO())
          assert rc == 2, rc
          assert macos_host.gnu_userland_missing() == [], macos_host.gnu_userland_missing()
          said = platform_info.host_script_blocker("Mesh emulation")
          assert said == "", said
          print("text UI entry: the GNU tools are found; PATH now starts", os.environ["PATH"].split(":")[:3])
          # a module command line, in a process of its own, from the same Finder PATH
          cli = subprocess.run(
              [sys.executable, "-m", "hugmesh_studio.core.cloud_deploy", "list",
               "--generator-dir", os.environ["GEN"]],
              env=finder_env, stdin=subprocess.DEVNULL, capture_output=True, text=True,
              timeout=300)
          out = cli.stdout + cli.stderr
          print("cloud_deploy list: exit", cli.returncode)
          print(out[:2000])
          assert "this Mac is missing" not in out, "the module command line was refused"
          PY

      - name: The case-sensitive APFS volume the build preflight asks for
        # The remedy the build preflight prints for a case-folding output folder, run
        # for real: add the volume to the boot container, check that a folder on it
        # does NOT fold case (that is what clears the refusal) while the default volume
        # still does, then delete it. It says whether addVolume and the folder needed
        # sudo, because the remedy text has to say so too.
        run: |
          container=$(diskutil info -plist / | plutil -extract APFSContainerReference raw -)
          echo "boot container: $container"
          if diskutil apfs addVolume "$container" 'Case-sensitive APFS' HugMeshProbe; then
            echo "PROBE addVolume: as the user, no sudo"
          else
            echo "PROBE addVolume: needed sudo"
            sudo diskutil apfs addVolume "$container" 'Case-sensitive APFS' HugMeshProbe
          fi
          ls -ld /Volumes/HugMeshProbe
          if mkdir -p /Volumes/HugMeshProbe/out; then
            echo "PROBE folder: user-writable"
          else
            echo "PROBE folder: needed sudo"
            sudo mkdir -p /Volumes/HugMeshProbe/out
            sudo chown "$USER" /Volumes/HugMeshProbe/out
          fi
          PYTHONPATH="$GITHUB_WORKSPACE/studio" "$RUNNER_TEMP/venv/bin/python" - <<'PY'
          import os, tempfile
          from hugmesh_studio.core import platform_info
          from hugmesh_studio.core.build_driver import BuildDriver
          from hugmesh_studio.core.config import ImageConfig
          out = "/Volumes/HugMeshProbe/out"
          assert platform_info.folds_case(out) is False, platform_info.folds_case(out)
          assert platform_info.folds_case(tempfile.gettempdir()) is True
          host = platform_info.HostInfo(os="darwin", is_gentoo=False, has_docker=True,
                                        has_bash=True, has_kvm=False, is_root=False,
                                        builder_image="hugmesh-builder")
          gen = os.environ["GITHUB_WORKSPACE"]
          on_volume = BuildDriver(gen, host, workdir=out).preflight(ImageConfig(), "docker")
          assert not any("ignores case" in p for p in on_volume), on_volume
          default = BuildDriver(gen, host, workdir=tempfile.gettempdir()).preflight(
              ImageConfig(), "docker")
          assert any("ignores case" in p for p in default), default
          print("the case-sensitive volume clears the refusal; the default volume is refused")
          PY
          diskutil apfs deleteVolume /Volumes/HugMeshProbe \
            || sudo diskutil apfs deleteVolume /Volumes/HugMeshProbe \
            || echo "could not delete the probe volume (the runner is discarded anyway)"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-dmg-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/dist/*.dmg
            ${{ runner.temp }}/dist/*.dmg.sha256
            ${{ runner.temp }}/dist/*.png
          if-no-files-found: warn
          retention-days: 7
