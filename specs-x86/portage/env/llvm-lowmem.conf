# Memory-bounded build for LLVM/clang (pulled by media-libs/mesa[llvm] -> radeonsi
# for the be+gpu role). llvm-core/llvm-21 is enormous: many translation units peak
# 2-4 GB each and the libLLVM.so link uses several GB. At the build's global
# MAKEOPTS=-j28 this OOM-CRASHED the 32 GB host (≈28×2 GB ≈ 56 GB). Cap to a
# memory-safe job count for these packages only; EMERGE_JOBS=1 already serializes
# packages so llvm and clang never build at the same time, keeping peak RAM bounded.
MAKEOPTS="-j4 -l8"
