# Memory-bounded build for LLVM/clang (pulled by media-libs/mesa[llvm] -> radeonsi
# for the be+gpu role). llvm-core/llvm-21 is enormous: many translation units peak
# 2-6 GB each at the Scalar/Transforms layer and the libLLVM.so link uses several GB.
# At -j28 this OOM-CRASHED the 32 GB host (≈28×2 GB ≈ 56 GB). At -j4 (≈4×6 GB ≈
# 24 GB + 12 GB system baseline ≈ 36 GB) it still OOM-crashed. Use -j2 so LLVM peak
# stays ≈12 GB; EMERGE_JOBS=1 already serializes packages so llvm and clang never
# build at the same time.
MAKEOPTS="-j2 -l4"
