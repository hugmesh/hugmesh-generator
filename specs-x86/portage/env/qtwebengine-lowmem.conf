# Memory-bounded build for dev-qt/qtwebengine (a Chromium fork — one of the
# heaviest packages in the tree, pulled by dev-qt/qtwebview -> net-im/neochat in
# the --capable set). Like LLVM, many of its translation units peak multiple GB
# and the final link is huge; at the global -j it OOM-crashes this 32 GB host
# (which reboots under sustained build load). Cap to -j2 so the peak stays bounded;
# EMERGE_JOBS=1 already serializes packages so webengine never overlaps another.
MAKEOPTS="-j2 -l4"
