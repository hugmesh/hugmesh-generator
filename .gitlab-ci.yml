# the generated grub.cfg and in the SIGNED UKI for months while the running kernel had
# neither (console.log: asked lsm=lockdown,yama,selinux,bpf, got
# "LSM: initializing lsm=lockdown,capability,selinux"). The old build guard string-
# matched CONFIG_LSM and the old boot-verify grepped /proc/cmdline for the word
# "lockdown" — both graded the image's claim about itself. This offline lint asserts
# (1) every name in a fragment's CONFIG_LSM has its enabling CONFIG_* in that same
# fragment, (2) each board's boot cmdline asks for exactly what the fragment builds
# (lsm= AND lockdown=, both directions), (3) every builder's guard is fail-closed and
# DERIVES its symbols from CONFIG_LSM, (4) the x86 grub cmdline (whose consumers all
# use a silent `${VAR:-short}` fallback) carries and asserts the full hardening set,
