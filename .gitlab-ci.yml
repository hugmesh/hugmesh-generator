# HugMesh CI — runs on the in-cluster GitLab Runner (privileged, x86_64 host).
# Builds every ISO + container image and DELIVERS the ISOs as release assets so
# the admin UI can link to the latest builds. NOTE: ISOs contain NO keys — the
# KEYS material is supplied from the USB stick at first boot, never baked in or
# published.
stages: [lint, verify, iso, images, deliver, sca, dast, load]

variables:
  # Where delivered ISOs live; the admin BFF reads "latest" links from here.
  ISO_BASE: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/iso/latest"

# Route-federation consistency / reserved-prefix drift guard. Asserts the
# canonical reserved set (specs/cluster/reserved-prefixes.yaml) covers every
# dedicated gateway route prefix + reserved subdomain (apps/20-gateway-*.yaml +
# manifests/route-access/schema.sql) AND that the in-cluster ConfigMap mirror
# matches the source. A newly added route prefix that is not reserved FAILS here,
# catching the drift that would let a vanity username shadow a real route. Cheap,
# so it runs first on every branch (no privileged runner needed).
#
# THE SIBLING CLONES ARE PART OF THE GATE, NOT A CONVENIENCE. The script's most
# valuable stage is the code-copy assertion: it parses the ReservedNames.java in
# each app repo and asserts the set EQUALS the canonical YAML. Until 2026-07-29
# that stage printed `[SKIP] … (not checked out)` here and the job still went
# green — so the assertion had never actually run in a pipeline, while a real
# drift (hugmesh-actions missing character-forge/hmdm/attest + the two games
# slugs) sat on main. The script now exits 3 (INCOMPLETE) when a copy is absent,
# so this job MUST provide them. Same clone recipe as sca:dependency-check: the
# org mirror derived from CI_REPOSITORY_URL, which carries the read-only CI job
# token — no secret committed. A clone failure fails the job, on purpose.
#   NB image: `python:3` (not `-slim`) — we need git, and the full image also
#   ships PyYAML's build deps; pyyaml itself is still installed explicitly (the
#   script FATALs on exit 2 without it, exactly as lint:cluster-manifest-integrity
#   already assumes for the same base image).
lint:reserved-prefixes:
  stage: lint
  image: python:3
  tags: [hugmesh-x86]
  variables:
    # Where the sibling ReservedNames.java copies get cloned to; the script reads
    # this instead of looking for checkouts next to the repo.
    RESERVED_SIBLING_ROOT: "${CI_PROJECT_DIR}/.reserved-siblings"
  before_script:
    - pip install --quiet pyyaml
    - ORG_BASE="$(dirname "${CI_REPOSITORY_URL}")"
    - mkdir -p "${RESERVED_SIBLING_ROOT}"
    # The three physical ReservedNames copies (auth-core's is the shared one that
    # user-bff-api + admin-bff-api both consume as a Maven dependency). Keep this
    # list in lockstep with CODE_COPIES in scripts/validate-reserved-prefixes.sh —
    # a repo listed there but not cloned here now makes the job INCOMPLETE (exit
    # 3) rather than silently green.
    - |
      for r in hugmesh-federation-api hugmesh-actions hugmesh-auth-core; do
        git clone --depth 1 "${ORG_BASE}/${r}.git" "${RESERVED_SIBLING_ROOT}/${r}"
      done
  script:
    - bash scripts/validate-reserved-prefixes.sh

# federation_modules REGISTRATION drift gate. optional-services.yaml declares, per
# optional service, the federation module slug + mountAt + the hugmesh-federation-api
# Liquibase changeset that seeds the row; every `kind: FederationModuleRegistration`
# descriptor under manifests/ declares the same shape. Nothing checked that the two
# sides agree, and on 2026-08-26 they did not: `akkoma` and `tuwunel` were declared as
# module slugs, but 023/024 seed `mastodon`/`matrix` and no changeset ever seeds an
# akkoma or tuwunel row — so anything resolving the module by the registry's slug
# looked it up under a name no row carries, silently (the host shell just never finds
# the remote; tests/stack/seed-e2e.sh leg 4 logs "no federation_modules row … skipped"
# and stays green). Three changeset forward-references were also pointing at numbers
# that had since been taken by unrelated changesets.
#
# The changelog lives in ANOTHER repo, so this job clones it — same recipe as
# lint:reserved-prefixes above, and for the same reason: without it the script exits 3
# (INCOMPLETE) rather than reporting a green run it did not earn.
lint:federation-module-slugs:
  stage: lint
  image: python:3
  tags: [hugmesh-x86]
  variables:
    FEDERATION_SIBLING_ROOT: "${CI_PROJECT_DIR}/.federation-siblings"
  before_script:
    - pip install --quiet pyyaml
    - ORG_BASE="$(dirname "${CI_REPOSITORY_URL}")"
    - mkdir -p "${FEDERATION_SIBLING_ROOT}"
    - git clone --depth 1 "${ORG_BASE}/hugmesh-federation-api.git" "${FEDERATION_SIBLING_ROOT}/hugmesh-federation-api"
  script:
    - bash scripts/validate-federation-module-slugs.sh

# Guards THAT guard. Synthesises a changelog FROM the registry (so both sides agree by
# construction) and then mutates one side at a time — slug drift, a forward reference
# onto a taken number, a missing <include>, mountAt drift, and BOTH vacuity shapes
# (deriver yields nothing / declarations derived but none landed). A guard that
# compares an empty set passes, which is exactly how this class of check dies. Leg A
# also runs the gate against the real clone, so a green run here is not purely
# synthetic; without the clone the suite exits 3 (UNVERIFIED), never 0.
lint:federation-module-slugs-gate-honesty:
  stage: lint
  image: python:3
  tags: [hugmesh-x86]
  variables:
    FEDERATION_SIBLING_ROOT: "${CI_PROJECT_DIR}/.federation-siblings"
  before_script:
    - pip install --quiet pyyaml
    - ORG_BASE="$(dirname "${CI_REPOSITORY_URL}")"
    - mkdir -p "${FEDERATION_SIBLING_ROOT}"
    - git clone --depth 1 "${ORG_BASE}/hugmesh-federation-api.git" "${FEDERATION_SIBLING_ROOT}/hugmesh-federation-api"
  script:
    - bash tests/scripts/test-federation-module-slugs.sh

# Guards the guard: proves validate-reserved-prefixes.sh cannot report a clean
# PASS when its ReservedNames.java code-copy assertion did not actually run — the
# silent-skip hole that let a five-label hugmesh-actions drift sit on a "green"
# main. Synthesises the sibling trees from the canonical YAML in a temp dir
# (absent / present / drifted / partial), so it needs no clones and no network,
# and it carries the drift case as a negative control so a green run cannot be
# vacuous. It also asserts the job ABOVE still clones every declared copy — i.e.
# that the gate is honest AND wired to succeed honestly.
lint:reserved-prefixes-gate-honesty:
  stage: lint
  image: python:3-slim
  tags: [hugmesh-x86]
  before_script:
    - pip install --quiet pyyaml
  script:
    - bash tests/scripts/test-reserved-prefix-copy-gate.sh

# Cluster-manifest REFERENTIAL INTEGRITY gate. Every existing lint reads one file
# in isolation or greps for a string; none of them notices that a merge fused two
# Kubernetes objects into one document, parked a workload in a namespace the
# rebrand deleted, seeded route-access rows for a gateway id that no longer
# exists, line-continued two `for app in ...` headers into one word list, mounted
# an *-mtls Secret nothing provisions, handed two workloads the same SELinux
# MCS category, or left a SERVICE-only `/…/internal/**` ingest receiver governed
# only by its tier's `**` ALLOW floor (route-access decides on the LONGEST
# matching pattern, so a `**` floor SUBSUMES every internal path beneath it).
# All of those SHIPPED on main at once; this job is the gate
# that would have stopped them. Includes its own negative controls (each check is
# re-run against a corrupted copy of the tree and must bite), so a green run
# cannot be vacuous. Offline, no cluster, no privileged runner.
lint:cluster-manifest-integrity:
  stage: lint
  image: python:3-slim
  tags: [hugmesh-x86]
  before_script:
    - pip install --quiet pyyaml
  script:
    # NB: the [pki-roles] check EXECUTES the ConfigMap's init-pki.sh under a vault
    # stub, so bash (present in python:3-slim, Debian) is a hard requirement — a
    # regex cannot tell what a fused `for entry in ...` word list expands to.
    - bash tests/scripts/test-cluster-manifest-integrity.sh

# External Matrix/Mastodon CLIENT reachability gate. The fe route table ends in a
# /** catch-all to the Angular shell, whose nginx serves index.html for anything
# unrouted — so a MISSING protocol route does not 404, it returns 200 text/html
# and passes any status-code-only check. This job simulates Spring Cloud Gateway's
# first-match-wins ordering over both fe route tables and asserts every path a real
# client handshake performs resolves to a HOMESERVER rather than the shell, plus
# the route-access posture for the patterns that exposes. Six negative controls
# (route deleted / moved below the catch-all / repointed at the shell) must each
# trip it, so a green run cannot be vacuous. Offline, no cluster, no network.
lint:client-connect-routes:
  stage: lint
  image: python:3-slim
  tags: [hugmesh-x86]
  before_script:
    - pip install --quiet pyyaml
  script:
    - bash tests/scripts/test-client-connect-routes.sh

# /_fragments/** must be routed at something that can SERVE bundles. The compose
# lane pointed it at the remote-fragment SYNC app on its ACTUATOR port, and ran
# no fragment web server at all — so SYNC_TARGET_DIR was a docroot nothing
# served and federated remotes could not load (which presents as a BLANK PAGE,
# not a 404). This asserts the route's target service EXISTS in the compose
# project, that its port is DERIVED from the target's own nginx conf rather than
# hardcoded, that the served docroot is a volume some service actually writes,
# and that compose and the cluster agree on WHICH COMPONENT serves the path.
# Eight negative controls must each trip it. Offline, no docker, no network.
lint:fragment-route-target:
  stage: lint
  image: python:3-slim
  tags: [hugmesh-x86]
  before_script:
    - pip install --quiet pyyaml
  script:
    - bash tests/scripts/test-fragment-route-target.sh

# ExternalSecret TARGET-OWNERSHIP gate. The job above reads this repo's own
# manifests; it cannot know what an UPSTREAM chart creates, and that is exactly
# where this bug lived. specs/cluster declared an ExternalSecret targeting Secret
# `harbor-registry` in hugmesh-pki with creationPolicy: Owner — a name the Harbor
# Helm chart itself already creates in that namespace
# (harbor/templates/registry/registry-secret.yaml, type Opaque, holding
# REGISTRY_HTTP_SECRET). It had been erroring since bootstrap ("field is
# immutable"), so the imagePullSecret it existed to create never existed and the
# pods it existed to unblock would still ImagePullBackOff — and the only thing
# stopping ESO from CLOBBERING Harbor's own registry credentials was that
# unrelated type-immutability rule. This job renders every third-party chart this
# repo releases into a namespace it also puts ExternalSecrets in (real `helm
# template`, the Application's own committed values) and fails if any target
# lands on a chart-owned Secret name, if any ExternalSecret target doubles as a
# literal Secret manifest, or if any workload names a pull secret nothing
# materializes. Scope is DERIVED from the manifests, so adding an ExternalSecret
# to a new namespace pulls that namespace's chart into the check automatically.
# Five negative controls (including the exact pre-fix manifest, a DIFFERENT
# chart-owned name, and an empty-tree vacuity control) run against staged copies.
lint:eso-target-collisions:
  stage: lint
  image: python:3-slim
  tags: [hugmesh-x86]
  variables:
    # Same pinned helm as lint:gateway-mfa-env / lint:probe-auth-surface below —
    # one version for the whole pipeline, so no two chart renders can disagree
    # about what Helm does.
    HELM_VERSION: "v3.19.2"
    HELM_SHA256: "2114c9dea2844dce6d0ee2d792a9aae846be8cf53d5b19dc2988b5a0e8fec26e"
  before_script:
    - pip install --quiet pyyaml
    # Pinned-helm install, FAIL-CLOSED: the sha256 of the WHOLE download is
    # verified before extraction, and only linux-amd64/helm is ever extracted.
    # helm is NOT optional — the guard hard-fails without it rather than skipping,
    # because "no chart rendered" would read as "no collisions found".
    - |
      python3 - <<'PY'
      import hashlib, io, os, sys, tarfile, urllib.request
      ver = os.environ["HELM_VERSION"]
      want = os.environ["HELM_SHA256"].lower()
      url = "https://get.helm.sh/helm-%s-linux-amd64.tar.gz" % ver
      blob = urllib.request.urlopen(url, timeout=120).read()
      got = hashlib.sha256(blob).hexdigest()
      if got != want:
          sys.exit("FAIL-CLOSED: sha256 mismatch for %s\n  pinned %s\n  got    %s"
                   % (url, want, got))
      with tarfile.open(fileobj=io.BytesIO(blob), mode="r:gz") as t:
          f = t.extractfile("linux-amd64/helm")
          if f is None:
              sys.exit("FAIL-CLOSED: linux-amd64/helm missing from the verified tarball")
          with open("/usr/local/bin/helm", "wb") as out:
              out.write(f.read())
      os.chmod("/usr/local/bin/helm", 0o755)
      print("helm %s installed, sha256 %s OK" % (ver, got))
      PY
    - helm version --short
  script:
    - bash tests/scripts/test-eso-target-collisions.sh

# Workload-console generator gate (tests/workload-console/test-workload-console.sh):
# the two-SA RBAC least-privilege invariants (the security acceptance bar), the
# optional-services registration (default off, hidden module), the
# build-rpi5-stage4.sh gate branch (not selected => the RBAC app + manifests +
# route-access rows are PRUNED; selected => kept), the digest-pin (@sha256:)
# Kyverno deploy-provenance policy, and the route-access row + Application shape —
# proven by sourcing the REAL builder helper functions against a sandbox tree, no
# cross-build. Same offline python3+PyYAML recipe as lint:cluster-manifest-integrity
# above; the suite was CI-orphaned until now.
#
# procps is a HARD requirement, not a convenience: the exec-allowlist property check
# probes each allowlisted command's real option surface and live behaviour, and it
# treats an entry whose binary is absent as a FAILURE rather than a skip. python:3-slim
# ships coreutils but not ps/free/uptime, so without procps this job would go red on
# three entries it cannot prove — which is the correct fail-closed direction, and is
# also why the package is installed instead of the check being softened.
lint:workload-console:
  stage: lint
  image: python:3-slim
  tags: [hugmesh-x86]
  before_script:
    - apt-get update -qq && apt-get install -qq -y --no-install-recommends procps >/dev/null
    - pip install --quiet pyyaml
  script:
    - bash tests/workload-console/test-workload-console.sh

# This file's own well-formedness. Three branches appended a lint job here and
# every pair merged WITHOUT a git conflict into a file where one job had lost
# its body — GitLab rejects a null job at pipeline creation, so the whole
# pipeline stops running and every gate above silently stops guarding. Runs on
# every change to this file, and always on the default branch, because the
# failure mode is created by MERGING two individually-fine branches.
# No container may declare the same env name twice. #543 re-declared
# ROUTE_MIRROR_CASSANDRA in a container that already set it 125 lines earlier
# under a comment explaining why that value matters; kubernetes silently keeps
# the LAST, so the documented entry was dead and the next person to correct it
# would have changed nothing. Values happened to agree, so nothing broke — this
# closes the trap before it is sprung.
lint:no-duplicate-env:
  stage: lint
  image: python:3-slim
  tags: [hugmesh-x86]
  before_script:
    - pip install --quiet pyyaml
  script:
    - bash tests/scripts/test-no-duplicate-env.sh

# The first-boot nullmailer ownership re-fix (#60 item 7). nullmailer's
# pkg_postinst chowns BY NAME with `|| die`; under the cross builders'
# ROOT=<sysroot> merges the ebuild's own BDEPEND never merges to /, so the chown
# runs against the HOST passwd and dies. The re-fix lives in the SHARED first-boot
# finaliser, which means a regression there hits every arch at once — and the
# original defect was that the re-fix ANNOUNCED SUCCESS UNCONDITIONALLY, so a
# broken one is indistinguishable from a working one by reading the boot log.
# Static: the suite reads specs/etc/local.d/01-firstboot.start.tmpl and needs only
# awk/grep/sed, no root and no image build.
lint:nullmailer-cross-postinst:
  stage: lint
  image: alpine:3
  tags: [hugmesh-x86]
  before_script:
    - apk add --no-cache bash
  script:
    - bash tests/scripts/test-nullmailer-cross-postinst.sh

# scripts/_tools-path-lib.sh. The Studio pins kind under
# ~/.local/share/hugmesh-studio/tools/bin and puts it on PATH for its own children
# only, so a terminal `make kind-up` died with "missing required tool: kind" on a
# box where kind was installed — a message that reads as "not installed" and sends
# the reader to install a second copy at a different version. The suite is fully
# hermetic (it builds fake tools dirs and drives the lib via HUGMESH_TOOLS_BIN), so
# it asserts the same thing on a runner with no Studio as on the workstation.
lint:tools-path-lib:
  stage: lint
  image: alpine:3
  tags: [hugmesh-x86]
  before_script:
    - apk add --no-cache bash
  script:
    - bash tests/scripts/test-tools-path-lib.sh

# tests/pentest/run-pentest.sh had three stacked ways to turn "no scan happened"
# into a green job, and the third defeated the second's own stated purpose. This
# suite pins that an ABSENT scan and an UNCOMPUTABLE verdict both fail loudly.
# It does NOT change the gating policy — the pentest stage stays allow_failure.
# Hermetic: it copies the harness and drives it through a SYNTHETIC env profile,
# so it can never reach tests/stack/up.sh or down.sh.
# The instrument that can NARROW an INFERRED-WIDE rule. See the script header:
# AVC denials say what to ADD; narrowing needs what was EXERCISED (auditallow).
lint:selinux-auditallow-generator:
  stage: lint
  image: alpine:3
  tags: [hugmesh-x86]
  before_script:
    - apk add --no-cache bash
  script:
    - bash tests/scripts/test-selinux-auditallow-generator.sh

lint:dast-honesty:
  stage: lint
  image: python:3-slim
  tags: [hugmesh-x86]
  script:
    - bash tests/pentest/test-dast-honesty.sh

# GitHub credential preflight for first-party clones. Deliberately NO `rules:` —
# it must run on every pipeline. This gate exists because the two properties it
# checks fail SILENTLY: a leaked token looks like a working build, and a missing
# credential used to surface as git's own "could not read Username" (or, on a
# terminal, a Username/Password prompt GitHub stopped honouring in 2021, which
# blocks the build until someone gives up). Both are proven by executing the lib
# against a stub gh, not by reading it.
lint:github-auth-lib:
  stage: lint
  image: alpine:3
  tags: [hugmesh-x86]
  before_script:
    - apk add --no-cache bash git
  script:
    - bash tests/scripts/test-github-auth-lib.sh

lint:gitlab-ci-wellformed:
  stage: lint
  image: python:3-slim
  tags: [hugmesh-x86]
  before_script:
    - pip install --quiet pyyaml
  script:
    - bash tests/scripts/test-gitlab-ci-wellformed.sh
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - changes:
        - .gitlab-ci.yml
        - tests/scripts/test-gitlab-ci-wellformed.sh

# Vault-PKI ISSUANCE SIMULATOR. The job above proves each `pki_int/issue/<role>`
# an ExternalSecret calls EXISTS; it never asked whether the role would accept
# the names asked of it, and the answer was no. The issuing roles allowed
# `svc.cluster.local` + allow_subdomains (i.e. *.svc.cluster.local ONLY) while
# every ESO generator also requests the TWO-LABEL `<service>.<namespace>` SAN, so
# on a live cluster EVERY generic-loop app got
#   Code: 400 * subject alternate name hugmesh-user-bff-api.hugmesh-backend
#   not allowed by this role
# — no app could be issued its mTLS cert, no keystore initContainer got material,
# and the fleet mTLS wave had never once run. Two roles (media-poisoner, harbor)
# had already been hand-patched around that exact error instead of fixing it.
# This job ports Vault's own ValidateNames and simulates every requested
# CN/SAN against the params its role is really created with, in BOTH directions:
# every requested name must be issuable, and no role may issue another workload's
# identity — so "fix it by widening the role" fails here instead of shipping.
# Carries a matcher self-test plus negative controls for every defect class
# (including two vacuity controls), so a green run cannot be vacuous. Offline,
# no cluster, no vault, no privileged runner.
lint:pki-role-san-coverage:
  stage: lint
  image: python:3-slim
  tags: [hugmesh-x86]
  before_script:
    - pip install --quiet pyyaml
  script:
    # Same bash requirement as the job above, and for the same reason: the role
    # parameters are read by EXECUTING init-pki.sh under a vault stub.
    - bash tests/scripts/test-pki-role-san-coverage.sh

# ESO SEED-CONTRACT gate. scripts/gen-cluster-secrets.sh is the ONLY thing that
# provisions cluster secrets — ONLINE (`vault kv put`) and OFFLINE (the USB
# secrets.json bundle) — and NOTHING in CI ever compared what it writes against
# what the ExternalSecrets read. They drifted: route-access-db-roles required a
# SIXTH route-access password (superadmin_gateway_password) that the script never
# minted. ESO resolves an ExternalSecret ALL-OR-NOTHING, so that one missing
# property cost the WHOLE Secret: route-access-db never started, the
# gateway_route_access table (source of truth for ALL route authorization) never
# existed, and every gateway fell back to its baked CanonicalSeed. Reproduced live
# on kind 2026-08-05 and shipped via BOTH delivery paths.
#
# This job runs the REAL gen-cluster-secrets.sh FIVE times under a `vault` stub
# that records argv — default (every optional feature off), all-optional-on, one
# ISOLATED run per declared optional feature, and one under a NON-default
# CLUSTER_DOMAIN — then asserts EVERY {key, property} and EVERY materialized
# Secret key is covered by both products.
#
# SCOPE, stated to match the behaviour exactly: EVERY ExternalSecret under
# specs/cluster is walked, not only manifests/external-secrets (three live
# outside it — the cassandra-hardening overlay's two and manifests/cloudflared —
# and were unguarded). A file is checked when its own directory's
# kustomization.yaml lists it; anything else is reported under [not-rendered]. A
# DARK overlay no ArgoCD Application points at is still CHECKED, because an
# operator applies it by hand at flip time.
#
# Classification is PER REFERENCE, never per object: a generator-backed
# `dataFrom` entry excuses only the keys IT produces, so an unseeded KV remoteRef
# sharing the same ExternalSecret is still caught. References that are
# legitimately not the seeder's job (Vault-PKI generator certs,
# operator-provisioned homeserver tokens, in-cluster-minted Harbor robots, files
# absent from the kustomization) are CLASSIFIED and printed with their reason,
# and a classification that no longer matches a live reference is itself a
# failure. "Conditional" is never an auto-pass either: an entry a default run
# cannot satisfy must be attributable to a NAMED feature flag whose isolated run
# produces it, with that feature's seeder guard line and its manifest's own
# "may not materialize" statement both still present.
#
# NINETEEN negative controls plus three tooling-preflight controls, so a green
# run cannot be vacuous: they cover the original defect, a brand-new unseeded
# property, an unwritten Vault path, an offline-only gap, a doubled KV mount, a
# stale classification, an extract-Secret key mismatch, an unseeded KV property
# hidden inside a generator-backed object (both online and offline halves), an
# unseeded property outside manifests/external-secrets, an unexplained
# conditional, a conditional the manifests no longer support, a literal the
# bundle disagrees with, a domain-bearing literal that stops tracking
# CLUSTER_DOMAIN (and the symmetric case, and a probe that does not rebrand), a
# blank-but-present value, an unresolvable template variable, and a missing run
# artifact.
#
# A MISSING TOOL IS A HARD FAILURE HERE, never a silent skip. The gate exits
# non-zero when python3 / PyYAML / openssl is absent; the ONLY way to turn that
# into an exit-0 skip is the deliberate local opt-out env var named in
# tests/scripts/test-eso-seed-contract.sh's header. That name is deliberately NOT
# written anywhere in this file, and the gate's own control (t3) greps this file
# for it and FAILS the build if it ever appears — in a job, in a global
# `variables:` block, or anywhere else. So the CI path cannot go green without
# having actually run.
#
# Offline: no cluster, no vault binary, no docker, no network; writes only into
# its own mktemp dir (never keys-out).
lint:eso-seed-contract:
  stage: lint
  image: python:3-slim
  tags: [hugmesh-x86]
  before_script:
    - pip install --quiet pyyaml
  script:
    # bash + openssl are both present in python:3-slim (Debian): the gate EXECUTES
    # the real seeder, which mints every value with `openssl rand`, and no static
    # read of the script could tell what its arrays and conditionals expand to.
    - bash tests/scripts/test-eso-seed-contract.sh

# HARBOR-ROBOTS OWNERSHIP gate. The job above proves every ExternalSecret
# reference is SEEDED; it says nothing about who may OVERWRITE a seeded value,
# and that is where this bug lived. secret/<brand>/harbor-robots had two writers:
# manifests/harbor/harbor-provision-job.yaml, which mints Harbor's pull/push
# robot accounts and is the ONLY thing that can ever hold their secrets (Harbor
# reveals a robot secret exactly once), and gen-cluster-secrets.sh, which did an
# UNCONDITIONAL `vault kv put` of two literal REPLACE_WITH_* placeholders. KV v2
# `put` replaces the whole document and the Job skips on HARBOR state, not on
# Vault state — so every re-run of the seeder killed four real credentials
# permanently, and ESO went on rendering a perfectly-shaped dockerconfigjson for
# all five namespaces and reporting Synced. The only symptom is a 401 at pull
# time, which the kind lane never reaches because it side-loads its images
# (docs/KIND-SSO-E2E-FINDINGS.md #17).
#
# This gate asserts BEHAVIOUR, not text: it EXECUTES the real seeder against a
# faithful fake KV v2 (put replaces, patch merges, patch on a virgin path fails)
# pre-loaded with the document the Job leaves behind, and EXECUTES the Job's own
# reconcile.py — extracted from its ConfigMap — against an in-process fake Harbor
# + Vault API. Eight negative controls run against staged copies, including the
# EXACT pre-fix seeder, an escape hatch that puts instead of patching, an escape
# hatch that silently does nothing, a run that never reaches the online branch, a
# provision Job that stops merging, and a sabotaged fake Vault (the control on
# the controls). Offline: no cluster, no vault binary, no Harbor, no network.
lint:harbor-robots-ownership:
  stage: lint
  image: python:3-slim
  tags: [hugmesh-x86]
  before_script:
    - pip install --quiet pyyaml
  script:
    # bash + openssl are both present in python:3-slim (Debian): the guard runs
    # the real gen-cluster-secrets.sh, which mints every value with `openssl rand`.
    - bash tests/scripts/test-harbor-robots-ownership.sh

# KIND SSO HARNESS HONESTY gate. Two ways specs/cluster/bootstrap/kind-local
# reported work it had not done. (1) The identity seed: Casdoor answers a DENIED
# call with HTTP 200 + {"status":"error"} (upstream controllers/util.go
# ResponseError() never sets an HTTP status, and RequireSignedIn/RequireAdmin
# both report through it), so the `curl -sf` seed hook could not see a denial —
# and a WRONG admin password is the documented fresh-cluster state. Result: empty
# cookie jar, every get-* empty, users "re-added" anonymously, every role
# "skipped", exit 0, "SSO slice seeded." (2) The KV seed had no already-done
# guard, so a re-run re-minted every password while the Postgres volumes kept the
# first run's — `password authentication failed for user "userbff"`, i.e. the
# step documented as idempotent wedged the cluster it claimed to converge.
# This job RENDERS the real seed hook with the real tests/qemu/seed-accounts.sh
# and RUNS it (plus the real verify/KV helpers) against a curl stub that
# reproduces Casdoor's actual contract, and a vault stub + recording seeder for
# the idempotence contract. Deny controls are DERIVED from the endpoints the hook
# really calls, so a new endpoint is covered without editing the suite; vacuity
# controls (correct password, full 15-user catalogue, first-run seed) prove a
# green run is not green because the hook is simply broken.
# (3) THE BRING-UP PRINTED "Done." OVER A CLUSTER WITH NO mTLS CERTIFICATE AT
# ALL. The generator-credential step seeded vault-ca/vault-token and reported
# "ready" — the hook reporting on its own work — with nothing asserting that an
# ExternalSecret ever produced anything. It had not: 26 sat in SecretSyncedError
# and every pod mounting a *-mtls Secret hung in Init:0/1. The suite now runs the
# real verify_mtls_issuance() out of the real script against a kubectl stub and
# REAL openssl-minted certificates, requiring it to go red on each way the
# property breaks — no ExternalSecrets at all, Secret never issued, Secret
# present but empty, unparseable tls.crt, a leaf signed by another CA, and a key
# that does not match its cert — with a genuine CA-signed leaf as the positive
# control. (4) The same step used to `exit 1` when external-secrets/vault-token
# was absent, aborting the entire bring-up on an already-initialized Vault; the
# real block is executed against a stub cluster of that exact shape and must
# recover from vault/vault-bootstrap instead. (5) That post-condition's
# DENOMINATOR must come from the REPO, not the cluster. Enumerating the
# generator-backed ExternalSecrets the LIVE cluster declares makes the failure it
# most needs to see invisible — when the ExternalSecret itself never lands it
# leaves the enumeration too, so the denominator shrinks with the failure and the
# check can only fail at zero. Measured live: repo 29 generators, cluster 26,
# reported "mTLS verified: 26/26" and printed Done. The controls make repo and
# cluster DISAGREE, which the old single-input shape could not express at all:
# a repo-declared generator with no ExternalSecret is red; the same absence
# DECLARED with `# mtls-issuance: not-delivered <why>` is green; a marker with no
# usable reason is red; and a marker on a generator the cluster DOES carry is red,
# because a stale exemption would absorb the next delivery failure.
# Offline: bash + jq + openssl, no cluster, no kind, no docker, no network.
lint:kind-bootstrap-honesty:
  stage: lint
  image: python:3-slim
  tags: [hugmesh-x86]
  before_script:
    # openssl is REQUIRED, not incidental: the mTLS post-condition controls mint
    # and verify real certificates with it, and the suite fails hard rather than
    # skipping when it is missing — so a job image without it would be red for an
    # environmental reason, which is a broken image and not a finding.
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends jq openssl
  script:
    - bash tests/scripts/test-kind-bootstrap-honesty.sh

# Local-browsing gate (scripts/hugmesh-view.py + scripts/hugmesh-view.tsv). The
# tool exists because every front door routes by HOST HEADER, the names need an
# /etc/hosts entry nobody has root for, and the https door pairs a self-signed
# cert with HSTS — a combination Chrome will not let you click through and then
# remembers for a year. EVERY way that tool can fail is silent: a Host header
# that does not arrive reads as a broken app; an un-rewritten Location sends the
# browser mid-SSO to a name that does not resolve; a cookie left carrying
# `Domain=` is DISCARDED, so the user lands back on the login form with no error
# anywhere; an un-stripped HSTS header pins 127.0.0.1 itself — HSTS is per HOST,
# not per port — and forces every OTHER plain-http service on this workstation's
# loopback to https for a year; and a `kubectl port-forward` that outlives its
# parent keeps holding the port, so the NEXT run's door quietly serves the
# PREVIOUS run's service. So the
# suite drives the real rewrite/collision/cleanup rules and pins each one with a
# NEGATIVE CONTROL — an arrangement where the same assertion must go red — plus
# a live proxy leg against a loopback stand-in upstream, a FAKE kubectl that
# prints the real `Forwarding from 127.0.0.1:<port>` line and then serves, and a
# temp emulated-device registry. Offline: python3 + bash, no cluster, no kind,
# no docker, no network, no root.
lint:hugmesh-view:
  stage: lint
  image: python:3-slim
  tags: [hugmesh-x86]
  before_script:
    # openssl is REQUIRED, not incidental: the tool mints its own name-constrained
    # loopback CA with it, and the suite both verifies its own leaf AND proves the
    # constraint bites by signing a www.example.com cert that must FAIL to verify.
    # The suite exits 2 rather than skipping when openssl is missing, so a job
    # image without it would be red for an environmental reason — a broken image,
    # not a finding. certutil is deliberately NOT installed: the trust leg drives a
    # FAKE one on PATH, because a gate that can reach a real NSS store is a gate
    # that can damage an operator's browser.
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends openssl
  script:
    - bash tests/scripts/test-hugmesh-view.sh

# kubelet join/TLS-bootstrap gate (issue #48). specs/etc/init.d/kubelet hardcoded
# command_args with no --bootstrap-kubeconfig and never read
# /var/lib/kubelet/kubeadm-flags.env, so `kubeadm join`'s TLS bootstrap could never
# complete on ANY node (hardware included) — while `kubeadm init` writes kubelet.conf
# directly, which is why single-node always looked fine. The gate pins the bootstrap
# flag + the kubeadm-flags.env sourcing on the LIVE command_args line, proves both by
# sourcing the script in plain sh against a sandboxed env file (absent -> byte-identical
# single-node args; present -> kubeadm's flags land), asserts the shared overlay stays
# the ONLY copy (no specs-*/ per-arch fork) and that both k8s builders install it from
# ${SHARED_SPECS}, and re-runs itself against five staged regressions that each must go
# red. Offline: bash + sh + grep/sed, no root, no docker, no cluster.
lint:kubelet-join-bootstrap:
  stage: lint
  image: alpine:3
  tags: [hugmesh-x86]
  before_script:
    - apk add --no-cache bash
  script:
    - bash tests/boot/test-kubelet-join-bootstrap.sh

# QEMU 3-node mesh-cluster lane (issue #48 PR B, the orchestration half on top of
# the kubelet join fix above). NOTHING boots: qemu-system/qemu-img are PATH stubs
# recording their argv and the orchestrator runs behind its MESH_*_CMD seams. Pins
# launch-x86.sh's default-off --mesh-net/--mesh-mac/--mesh-id shared-L2 NIC (argv
# effect + fail-closed validation), proves mesh-cluster.sh's wiring (CP boots
# first, offline-minted pinned token/ca-hash consistent across all three KEYS
# payloads, distinct MACs/forwards, SKIP + --dry-run gating, join/registration
# failures fail the run), pins that no live line ever runs `qemu-img commit` (an
# overlay committed back silently rewrites the GOLDEN image), and carries staged
# regressions that must each turn a leg red. openssl mints/verifies the throwaway
# cluster CA; openssh supplies ssh-keygen for the login-key payload.
lint:qemu-mesh-cluster:
  stage: lint
  image: alpine:3
  tags: [hugmesh-x86]
  before_script:
    - apk add --no-cache bash openssl openssh
  script:
    - bash tests/qemu/mesh-cluster_test.sh

# QEMU runner-hygiene lane. NOTHING boots and no container is created: `docker`
# and `losetup` are PATH stubs recording their argv, and the loop-device
# preflight is driven against a seam directory instead of the real /dev.
#
# It pins three 2026-08-26 defects, all of which were invisible from a green run:
# (1) the host boots with max_loop=0, so /dev carries only loop-control until the
# first attach materialises loop0 — and a container's /dev is a CREATION-TIME
# SNAPSHOT, so rows whose containers were created before that instant died in
# extract_kernel while the row that created the node passed. Every failure leaves
# the node behind, so the harness HEALS ITSELF INTO PASSING; the suite therefore
# forces the visible node count low, which a check against the real /dev cannot.
# (2) --jobs 0 is documented (and implemented in the keep-alive lane) as "ungated,
# all at once", but the plain fan-out's `running >= JOBS` gate read 1 >= 0 as true
# and FULLY SERIALIZED the matrix — never red, only slow. (3) emit_result
# interpolated label/platform/board/role/mode/image RAW into its result JSON, so
# one quote in an operator-supplied --label or in an image path wrote a row the
# Studio renders as '?', and its FAILED count was scraped with an unanchored
# '[0-9]+ failed' that matched rc-status's "0 failed" long before the verdict line.
# Every check carries a negative control, and the file prints what it does NOT
# prove rather than implying a green run covers it.
lint:qemu-runner-hygiene:
  stage: lint
  image: alpine:3
  tags: [hugmesh-x86]
  before_script:
    - apk add --no-cache bash python3
  script:
    - bash tests/qemu/loop_preflight_test.sh
    # And prove the suite above can FAIL. The battery breaks run-qemu-docker.sh
    # thirteen ways — partition nodes counted as devices, `-v /dev:/dev` bent to
    # `-v /dev:/dev-host`, `--privileged` to `--privileged=false-not-really`,
    # --rm dropped, attach/detach interleaved, the verdict taken from docker's
    # exit code, --jobs 0 re-serialized, the call site deleted — and demands RED
    # for each, verifying every mutation actually changed the file first. It
    # restores the tree on EXIT and ends on a positive control that the restored
    # tree is green. Two of these (the -v and --privileged bends) survived at a
    # full 30/0 before the assertions were changed from substring greps to
    # whole-argv-word matches, which is exactly why this runs in CI and not once
    # by hand.
    - bash tests/qemu/loop_preflight_mutations.sh

# ALWAYS-ON in-cluster Kaniko image-builder gate. Nothing in CI referenced the
# image-builder at all before this, and its on/off switch is THE DIRECTORY A FILE
# SITS IN: the root app-of-apps recurses specs/cluster/apps, so moving
# 60-image-builder.yaml out of the parked apps-optional/ sibling is what makes ArgoCD
# start creating the build namespace — a live cluster-behaviour flip that a bare
# `git mv` (in either direction) performs with no code change and no signal. This job
# pins the flip: the Application is in the always-synced set, the root really does
# recurse it, the synced manifests are structurally valid (PSS restricted namespace +
# default-deny ingress), the Kaniko Job stays a TEMPLATE outside the kustomization so
# nothing runs until a build is dispatched, the ESO push secret targets the namespace
# the app creates, the opt-in CI guard is gone, the dispatcher's sed bindings still
# match the template's ${...} set (BOTH sides of each binding, so the two destination
# expressions cannot be swapped), a failing dispatch cannot block the later security
# stages, and no retired pre-rebrand identifier survives in the surface. That last check
# is POSITIONAL: the two still-legitimate occurrences of the old brand (the frozen
# label-KEY namespace and the live GitHub org path segment — enumerated verbatim in
# tests/scripts/image_builder_always_on.py, which is NOT itself part of the scanned
# surface) are exempt only in their own syntactic position, so the same text in a
# registry host, an image reference or a repoURL is still a finding. Carries negative
# controls for every check — including reversing the move, reinstating a stale repo name,
# and planting the old brand in each functional field — so a green run cannot be vacuous.
# Offline, no cluster, no kubectl, no network.
lint:image-builder-always-on:
  stage: lint
  image: python:3-slim
  tags: [hugmesh-x86]
  before_script:
    - pip install --quiet pyyaml
  script:
    - bash tests/scripts/test-image-builder-always-on.sh

# Service-catalog DISCOVERY gate. The catalog ApplicationSets find a repo by
# `pathsExist` on a FIXED deploy-descriptor filename; the HugMesh rebrand renamed
# that file to `hugmesh-deploy.yaml` repo by repo, leaving the pre-rebrand
# `snapdragon-deploy.yaml` live in the ones that had not moved yet, while both
# generators matched only one name. The unmatched repos were INVISIBLE to the
# catalog and nothing said so —
# an scmProvider filter that matches no repo is not an error, it just generates no
# Application (no event, no degraded app, no log line). This job asserts every
# registered adopter (specs/cluster/catalog/adopters.yaml) is matched by a filter,
# that both generators accept the same name set, and — by CLONING the adopter
# repos — that the registry still equals what those repos actually ship. An
# adopter that cannot be cloned makes the run INCOMPLETE (exit 3), never a silent
# green, so the clone list below MUST stay in lockstep with the registry (the job
# right after this one fails if it drifts).
lint:catalog-descriptor-discovery:
  stage: lint
  image: python:3-slim
  tags: [hugmesh-x86]
  variables:
    # Where the adopter checkouts get cloned to; the gate reads this instead of
    # looking for checkouts next to the repo.
    CATALOG_SIBLING_ROOT: "${CI_PROJECT_DIR}/.catalog-adopters"
  before_script:
    - pip install --quiet pyyaml
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git
    - ORG_BASE="$(dirname "${CI_REPOSITORY_URL}")"
    - mkdir -p "${CATALOG_SIBLING_ROOT}"
    # The nine repos specs/cluster/catalog/adopters.yaml declares. Keep this list
    # in lockstep with that registry — a repo registered there but not cloned here
    # makes the job INCOMPLETE (exit 3) rather than silently green, and
    # tests/scripts/test-catalog-discovery-gate.sh case (l) fails on the drift.
    - |
      for r in hugmesh-admin-bff-api hugmesh-character-forge-bff-api \
               hugmesh-federation-api hugmesh-forum-bff-api \
               hugmesh-forum-ui hugmesh-user-bff-api hugmesh-be-gateway \
               hugmesh-mod-bff-api hugmesh-remote-fragment; do
        git clone --depth 1 "${ORG_BASE}/${r}.git" "${CATALOG_SIBLING_ROOT}/${r}"
      done
  script:
    - bash scripts/validate-catalog-discovery.sh

# Guards the guard above. The defect it exists to catch was SILENT (a filter that
# matches nothing is not an error), so a visibility check that has never been seen
# to bite is not a control. Re-breaks a staged copy of the tree ten ways — the
# exact pre-fix single-name filter, its mirror image, a one-sided fix, both names
# crammed into ONE pathsExist entry (which ANDs, so it matches nothing at all),
# registry drift, an unregistered adopter, a missing deploy/, an unprotected
# rename, absent checkouts, the opt-out — and requires the specific failure each
# time. Synthesises the adopter checkouts in a temp dir, so no clones and no
# network. Also asserts the job ABOVE really clones every registered adopter.
lint:catalog-discovery-gate-honesty:
  stage: lint
  image: python:3-slim
  tags: [hugmesh-x86]
  before_script:
    - pip install --quiet pyyaml
  script:
    - bash tests/scripts/test-catalog-discovery-gate.sh

# D6/D8 MFA route-access gate. The route-access table's `mfa_required` column has
# shipped for a while, but until the seed actually WROTE it, turning
# APP_MFA_ENABLED on was a pure no-op — the gateway only demands the MFA_SATISFIED
# marker when the DECIDING longest-pattern row is mfa_required=true, and every row
# was false. This job pins the write, and pins the FOUR ways it silently breaks:
# a parallel row (dropped by ON CONFLICT DO NOTHING because mfa_required is NOT in
# uq_route_access_row), flipping only the `/**` floors (longest-pattern-wins means
# every longer sub-path row stays the false deciding rule), scoping the write
# to one gateway (both /bff/superadmin/** and /bff/admin/… are governed on two
# gateways each, so the other one stays an un-MFA'd door), and a LATER statement
# that un-flips a row (the file's NET effect is what runs, so every behavioural
# verdict is read back from a real SQL engine after replaying the file's own
# statements in order — not inferred from the text of one statement). It also holds
# the operator's binding enablement posture: cluster MFA stays OFF and
# APP_MFA_ENFORCE_PRIVILEGED_FLOOR stays OFF everywhere — checked by PARSING every
# gateway ArgoCD Application (helm.values / valuesObject / parameters, both the
# chart `mfa.*` spelling and a raw APP_MFA_* extraEnv), with valueFiles and other
# un-readable inputs failing LOUDLY rather than passing quietly, PLUS a shape-aware
# sweep of everything that parse cannot reach (chart templates — which are Helm and
# therefore not valid YAML — ConfigMaps, plain Deployments, the compose stack) that
# understands the k8s `- name:` / `value:` env-LIST form a per-line grep cannot see.
# It also EXECUTES the four SQL blocks docs/MFA-ROLLOUT.md asks operators to run, so
# the runbook cannot drift into plausible-but-false prose. Every check is re-run
# against a deliberately-corrupted staged copy, and every one of those controls
# asserts its own precondition (nc/nd/np alike — np was the straggler, and until it
# was fixed an unrelated rename in a live app manifest made three controls report the
# POSTURE GUARD as vacuous when it was the control that had failed to run), so
# "the check is vacuous" can never be reported for a mutation that silently failed to
# apply. Controls also refuse to score a PASS off an EMPTY reading: if the checker
# crashed or the key is simply absent, that is reported as proving nothing rather than
# read as "the control bit".
# PyYAML + the stdlib sqlite3 module drive the simulation + mutation-control legs,
# PLUS a postgres:16-alpine SERVICE CONTAINER — the exact image the route-access
# initdb runs in production — for the gate's real-engine leg (1c): with
# POSTGRES_HOST set, the seed is replayed VERBATIM via psql (twice, ON_ERROR_STOP,
# nothing translated, nothing skipped) and the resulting mfa_required set must
# match the sqlite replay ROW FOR ROW. That proves the IS DISTINCT FROM /
# ALTER COLUMN … SET NOT NULL / expression-index ON CONFLICT / ctid de-dup
# semantics on the engine that executes them, on every pipeline — they used to be
# sqlite-only, with a printed "never run on Postgres" caveat. The leg is
# FAIL-CLOSED: with POSTGRES_HOST set, an unreachable service or a missing psql
# fails the job, never skips. POSTGRES_HOST_AUTH_METHOD=trust configures the
# throwaway service container only (job-network-scoped, torn down with the job —
# no secret committed, nothing listens beyond the runner's service network).
# Still no cluster and no docker of our own; the service container is the
# runner's. First (and so far only) `services:` user in this file — the syntax
# follows docs.gitlab.com/ci/services/postgres/.
lint:mfa-required-rules:
  stage: lint
  image: python:3-slim
  tags: [hugmesh-x86]
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    # Read by the service container (official postgres image env) AND by the test
    # (POSTGRES_HOST is the switch that makes leg 1c mandatory).
    POSTGRES_HOST: postgres
    POSTGRES_HOST_AUTH_METHOD: trust
  before_script:
    - pip install --quiet pyyaml
    - apt-get update -qq && apt-get install -qq -y --no-install-recommends postgresql-client >/dev/null
  script:
    - bash tests/scripts/test-mfa-required-rules.sh

# Gateway MFA-ENFORCEMENT env gate. The gateway is what enforces MFA at route level
# (GatewayRouteAccessFilter.decide() honours gateway_route_access.mfa_required plus
# the privileged floor), and its three properties — app.mfa.enabled /
# .freshness-window / .enforce-privileged-floor — appeared in NO file in this repo,
# so enforcement was unreachable from GitOps and from the local stack. This job
# locks in both the wiring and the DELIBERATELY ASYMMETRIC posture the operator
# chose: the cluster chart ships MFA OFF for all four gateway instances (the
# privileged floor is NOT exempt for SUPERADMIN, so enabling it before operators
# have enrolled a second factor locks them out of the privileged plane — flipping it
# is an explicit operator action), while the compose dev stack defaults it ON so the
# enforcement leg is exercisable end-to-end locally.
# The assertion that earns this job its slot is (4b): nothing ArgoCD syncs from
# specs/cluster/apps may set mfa.enabled true. That regression has ALREADY shipped
# once here and had to be undone by hand — a comment asking people not to do it is
# not a gate. Its reach is deliberately ArgoCD's, not a convenient glob: every
# .yaml/.yml/.json under that directory RECURSIVELY, ApplicationSet templates as
# well as Applications, and all five ways a source can hand helm a value (values,
# valuesObject, parameters, fileParameters, valueFiles — the last two are reported
# as unreadable and FAIL rather than passing as default-off). An earlier revision
# of this job checked only top-level `*.yaml` and only the `values` string, and
# stayed green while a gateway Application turned MFA on three different ways.
# A gateway instance — cluster Application or compose service — cannot be added
# without being declared to the test, and the mutation controls (8a-8t) plant each
# of those regressions on a staged copy every run, so a green run cannot be vacuous.
# "Which Applications deploy the gateway chart" is decided on the CANONICAL
# source.path, because ArgoCD resolves it against the repo root: `./specs/…`,
# `specs/…/` and `specs/…/./…` are one directory to Argo. A raw string compare made
# a fifth gateway spelled any of those ways invisible to the consumer, release AND
# unreadable-input checks — it scored a clean sheet while carrying a valueFiles
# entry nothing could read (controls 8r.1-8r.5; 8s pins that canonicalisation is
# spelling-only and does not sweep in a different chart).
# WHAT IT CANNOT SEE: an Application applied out of band, i.e. not committed under
# specs/cluster/apps at all. WHAT IT DECLINES TO MODEL: multi-source Applications
# (spec.sources) — it says so in those words and fails, rather than guessing which
# source is the chart (control 8t).
# Tools: python3 + PyYAML + bash + a PINNED helm — no cluster, no docker. helm is
# not in python:3-slim (and neither is curl), so before_script downloads
# helm ${HELM_VERSION} linux-amd64 (runner tag hugmesh-x86) with the python stdlib
# and verifies its sha256 against the pin BEFORE anything is extracted. That
# install is FAIL-CLOSED: a failed download, a checksum mismatch, or a broken
# binary exits nonzero and fails the JOB — it must never degrade into the
# model-only path. With helm present, assertion (9) is LOAD-BEARING in CI: every
# run cross-checks the python render model against four real `helm template`
# renders (before this, (9) had SKIPped on every CI run — the model was never
# checked against helm where it counts). REQUIRE_HELM=1 makes (9) mandatory: if a
# future image change silently loses helm, the SKIP becomes a FAIL instead of a
# green run with less coverage. Local runs without helm keep the documented SKIP.
# The script preflights every external tool it uses and refuses to emit a pass/fail
# count if one is missing — it runs under `set -uo pipefail` without `-e`, so a
# `python:3-slim` short of `sort`/`find`/`cp` would otherwise distort the tally
# rather than fail. It also declares a floor on the number of assertions that must
# run, so checks cannot silently stop being counted.
lint:gateway-mfa-env:
  stage: lint
  image: python:3-slim
  tags: [hugmesh-x86]
  variables:
    HELM_VERSION: "v3.19.2"
    # sha256 of helm-v3.19.2-linux-amd64.tar.gz — taken from the published
    # https://get.helm.sh/helm-v3.19.2-linux-amd64.tar.gz.sha256sum AND
    # independently recomputed from the downloaded artifact before pinning.
    HELM_SHA256: "2114c9dea2844dce6d0ee2d792a9aae846be8cf53d5b19dc2988b5a0e8fec26e"
    # Assertion (9) is mandatory here: helm missing => FAIL, never SKIP.
    REQUIRE_HELM: "1"
  before_script:
    - pip install --quiet pyyaml
    # Pinned-helm install, FAIL-CLOSED. The sha256 of the WHOLE download is
    # verified before extraction; any mismatch (or short read, or 404) exits
    # nonzero and fails the job rather than falling through to the model-only
    # SKIP path. Only the single member linux-amd64/helm is ever extracted.
    - |
      python3 - <<'PY'
      import hashlib, io, os, sys, tarfile, urllib.request
      ver = os.environ["HELM_VERSION"]
      want = os.environ["HELM_SHA256"].lower()
      url = "https://get.helm.sh/helm-%s-linux-amd64.tar.gz" % ver
      blob = urllib.request.urlopen(url, timeout=120).read()
      got = hashlib.sha256(blob).hexdigest()
      if got != want:
          sys.exit("FAIL-CLOSED: sha256 mismatch for %s\n  pinned %s\n  got    %s\n"
                   "Refusing to extract. This job must go RED here — it must never fall\n"
                   "back to the model-only run (that is the SKIP this job exists to close)."
                   % (url, want, got))
      with tarfile.open(fileobj=io.BytesIO(blob), mode="r:gz") as t:
          f = t.extractfile("linux-amd64/helm")
          if f is None:
              sys.exit("FAIL-CLOSED: linux-amd64/helm missing from the verified tarball")
          with open("/usr/local/bin/helm", "wb") as out:
              out.write(f.read())
      os.chmod("/usr/local/bin/helm", 0o755)
      print("helm %s installed, sha256 %s OK" % (ver, got))
      PY
    - helm version --short
  script:
    - bash tests/stack/test-gateway-mfa-env.sh

# MFA OPERATIONAL FLIP wiring gate (issue #47). The companion of the two jobs
# above: they pin the default-OFF POSTURE, this one pins the SWITCH — MFA=1 must
# reach EVERY consumer of the gateway MFA trio on every lane it claims to drive
# (compose env thread, kind bootstrap helm-parameter patch, per-brand
# {{MFA_ENABLED}} render), because a flag that wires only half its consumers
# ships dark twice (that is how the trio itself first shipped, and how the
# AI-cloak lane shipped). Consumer sets are RE-DERIVED from the artifacts
# (compose file, SSO_APPS array, rendered tenant tree — the tenant lane runs the
# REAL sed renderer, no docker/network), every assertion is mutation-tested on
# staged copies, and the tally carries a MIN_CHECKS floor. Needs only
# python3+PyYAML+bash+coreutils.
lint:mfa-flip-wiring:
  stage: lint
  image: python:3-slim
  tags: [hugmesh-x86]
  before_script:
    - pip install --quiet pyyaml
  script:
    - bash tests/stack/test-mfa-flip-wiring.sh

# WEB-LOCALES wiring gate, and the regression gate for rename phase 3c. Same
# inert-knob shape as the job above, one link further out: the operator's chosen
# translation catalogs cross Studio -> `make stack-up` env -> compose build arg ->
# the login-ui Dockerfile ARG by NAME ALONE. Break any link on one side and the
# chain still builds, still boots, still exits 0 and ships a UI with no
# translations — "no locales requested" is also the legitimate default, so there
# is nothing to log. The rename made that live: producers now emit
# HUG_WEB_LOCALES and mirror the retired SNAP_WEB_LOCALES, because the Studio is
# installed separately from the generator tree it drives and the login-ui build
# context is a pinned-branch checkout, so BOTH directions of version skew are
# real. Lane A evaluates the REAL Makefile (hence `make` in before_script), lane B
# re-derives the build args from the compose YAML, lane C EXECUTES the Studio env
# builder. Lane D composes A+B through `docker compose config`; that CLI is not in
# this image, so it SKIPs and the deliberate opt-out keeps the job green while the
# verdict line still prints INCOMPLETE — never a clean PASS it did not earn.
lint:web-locales-wiring:
  stage: lint
  image: python:3-slim
  tags: [hugmesh-x86]
  variables:
    WEB_LOCALES_ALLOW_INCOMPLETE: "1"
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends make
    - pip install --quiet pyyaml
  script:
    - bash tests/stack/test-web-locales-wiring.sh

# Probe AUTH-SURFACE gate: no kubelet probe may target a path the service itself
# role-gates unless the probe tolerates the 401 that gating produces. The first
# real kind run found NO gateway could ever become Ready on Kubernetes — the
# chart gave the container httpGet probes on /actuator/health/{liveness,readiness}
# while the gateway image role-gates /actuator/** (INFRA_PATHS), so a token-less
# kubelet got 401 forever and liveness then killed a pod that had just logged
# "Started HugMeshGatewayApplication". compose.local.yaml had accepted 401 for
# exactly this reason all along; the workaround was never propagated to
# specs/cluster. This job renders the shared chart for real and holds the two
# halves of the repo together, for the gateway AND for any future service whose
# compose healthcheck has to learn the same lesson. Carries a negative control
# per check — including one that neuters the compose oracle and reverts the chart
# TOGETHER, so the pin cannot go vacuous with the thing it compares against.
# Offline apart from the pinned helm fetch; no cluster, no kubectl, no compose.
lint:probe-auth-surface:
  stage: lint
  image: python:3-slim
  tags: [hugmesh-x86]
  variables:
    # Same pinned helm as lint:gateway-mfa-env above — one version for the whole
    # pipeline, so the two chart renders can never disagree about what Helm does.
    HELM_VERSION: "v3.19.2"
    HELM_SHA256: "2114c9dea2844dce6d0ee2d792a9aae846be8cf53d5b19dc2988b5a0e8fec26e"
  before_script:
    - pip install --quiet pyyaml
    # Pinned-helm install, FAIL-CLOSED: the sha256 of the WHOLE download is
    # verified before extraction, and only linux-amd64/helm is ever extracted.
    # helm is not optional here — the script has no model-only fallback, because
    # a silent SKIP is the hole this class of bug hides in.
    - |
      python3 - <<'PY'
      import hashlib, io, os, sys, tarfile, urllib.request
      ver = os.environ["HELM_VERSION"]
      want = os.environ["HELM_SHA256"].lower()
      url = "https://get.helm.sh/helm-%s-linux-amd64.tar.gz" % ver
      blob = urllib.request.urlopen(url, timeout=120).read()
      got = hashlib.sha256(blob).hexdigest()
      if got != want:
          sys.exit("FAIL-CLOSED: sha256 mismatch for %s\n  pinned %s\n  got    %s"
                   % (url, want, got))
      with tarfile.open(fileobj=io.BytesIO(blob), mode="r:gz") as t:
          f = t.extractfile("linux-amd64/helm")
          if f is None:
              sys.exit("FAIL-CLOSED: linux-amd64/helm missing from the verified tarball")
          with open("/usr/local/bin/helm", "wb") as out:
              out.write(f.read())
      os.chmod("/usr/local/bin/helm", 0o755)
      print("helm %s installed, sha256 %s OK" % (ver, got))
      PY
    - helm version --short
  script:
    - bash tests/stack/test-probe-auth-surface.sh

# Thin-desktop (Sunshine) mesh-fence composition gate. Executes BOTH halves of
# the fence for real (only nft/sunshine/ip/pgrep/logger are PATH stubs) and
# asserts (a) the tailnet admit is DUAL-STACK — an `ip saddr` match inside an
# `inet` table can never match IPv6, so an IPv4-only accept pair silently drops
# every stream Moonlight opens against the host's MagicDNS AAAA record — and
# (b) the renderer/launcher handshake is genuinely fail-CLOSED: Sunshine has no
# bind-to-interface option, so a renderer that exits 0 with no table loaded next
# to a launcher that starts Sunshine anyway publishes 47984/47989/48010 +
# UDP 47998-48002 on every LAN/WAN address. Both halves carry negative controls.
lint:sunshine-fence:
  stage: lint
  image: bash:5
  tags: [hugmesh-x86]
  script:
    - bash tests/scripts/test-sunshine-fence.sh

# Every third-party container image specs/cluster pins must still EXIST in its
# registry. Bitnami's move to Broadcom retired the free `bitnami/*` Docker Hub
# images in favour of `bitnamilegacy/*`; most of this repo was migrated and three
# manifests were missed, still pinning docker.io/bitnami/kubectl:1.31, which is
# now a 404. A running cluster hides that completely — the image is already on
# the node, so the pod starts and keeps starting — and it surfaces only on a
# bring-up from nothing, as an ImagePullBackOff with no visible connection to a
# vendor's registry reorganisation months earlier. No offline check can see a
# retired tag, which is why this gate is one of the few allowed out to the
# network. Unconditional: registries rot on the vendor's schedule, not on ours,
# so this cannot be gated on file changes.
lint:container-image-tags:
  stage: lint
  image: python:3-slim
  tags: [hugmesh-x86]
  before_script:
    - apt-get update -qq && apt-get install -qq -y --no-install-recommends curl >/dev/null
  script:
    - bash tests/scripts/test-container-image-tags.sh

# A curated kind profile must apply the companion Applications its own
# Applications name. KIND_PROFILE=sso listed apps/00-cassandra.yaml (the Bitnami
# Helm chart) but not apps/00b-cassandra-init.yaml, which creates the keyspaces
# and the per-app roles — so the profile stood up a Cassandra with one role and
# no application keyspace, and fe-gateway crash-looped on "Provided username
# fe_gw_cass and/or password are incorrect". That reads like a rotated password
# and is really a role that never existed. apps/00b-cassandra-init.yaml says of
# itself "until this Job runs there is no combination of settings under which a
# gateway can start"; the fact was written down and nothing read it.
lint:kind-profile-app-closure:
  stage: lint
  image: bash:5
  tags: [hugmesh-x86]
  script:
    - bash tests/scripts/test-kind-profile-app-closure.sh

# A curated kind profile must also DEPLOY every in-cluster Service its own applied
# gateway ROUTES point at. KIND_PROFILE=sso applied apps/20-gateway-fe.yaml — route
# table included — but never apps/47-user-ui.yaml, so
#   - id: user-ui / uri: http://hugmesh-user-ui.hugmesh-frontend…:80 / path: /user/**
# was live against a Service nothing created. The API on the same surface
# (/bff/user/**) WAS routed and WAS allowed by the route-access seed, so curl proved
# the profile/password endpoint healthy while a browser got 503 from a route into
# the void. ArgoCD stayed Healthy throughout: a route to nowhere is not a sync error,
# and the sibling app-closure gate cannot see it because a gateway does not "declare"
# its route targets anywhere except the route table.
lint:kind-profile-route-closure:
  stage: lint
  image: python:3-slim
  tags: [hugmesh-x86]
  before_script:
    - pip install --quiet pyyaml
    - apt-get update -qq && apt-get install -y --no-install-recommends bash >/dev/null
  script:
    - bash tests/scripts/test-kind-profile-route-closure.sh

# The e2e route-access ORACLE must be GENERATED from the seed, never hand-copied.
#
# tests/e2e/specs/rbac-route-access.ts carried a hand-maintained mirror of
# gateway_route_access with the instruction "keep in lockstep". Measured by
# execution on 2026-08-26 it held 11 of the seed's 77 hugmesh-fe-gateway rows and
# answered DENY for every /bff/user/** profile and password path the real gateway
# ALLOWs — while six RBAC spec files asserted against it and all six were green.
lint:route-access-oracle:
  stage: lint
  image: python:3-slim
  tags: [hugmesh-x86]
  before_script:
    - apt-get update -qq && apt-get install -y --no-install-recommends bash diffutils >/dev/null
  script:
    - bash tests/scripts/test-route-access-oracle.sh

# The anonymous forgot-password legs must be reachable in EVERY lane that has a
# front door. Four files have to agree and each fails silently alone: the cluster
# route, the compose route, the route-access PUBLIC rows, and (OUT OF REPO, so
# only documented) hugmesh-gateway SecurityConfig.PUBLIC_PATHS. Before this surface
# existed a forgotten password was permanent; a silently-unrouted one restores that.
lint:password-reset-front-door:
  stage: lint
  image: python:3-slim
  tags: [hugmesh-x86]
  before_script:
    - apt-get update -qq && apt-get install -y --no-install-recommends bash diffutils >/dev/null
  script:
    - bash tests/scripts/test-password-reset-front-door.sh

# The docker lane and the cluster lane must run the SAME gateway auth carrier.
#
# HUGMESH_GATEWAY_BFF_EXCHANGE_ENABLED gates BOTH halves of the bff_ cookie ->
# custody-JWT swap (@ConditionalOnProperty on BffCookieToBearerWebFilter and
# BffJwtExchangeConfig). compose.local.yaml has set it since the consequence was
# diagnosed; specs/cluster never did — `grep -rn BFF_EXCHANGE specs/cluster` was
# empty — so kind and every baked device image forwarded the raw opaque bff_ as the
# Bearer and the pure-JWT BFFs (forum/wiki/tube/owncast) answered a bare 401 with
# nothing in any log, in exactly the two lanes nobody exercises locally.
#
# Needs the hugmesh-gateway checkout: the comparison is of EFFECTIVE values, and the
# IMAGE DEFAULTS come from that repo's application.yml (bff-exchange defaults FALSE,
# bff-session defaults TRUE — so "set on one side only" means opposite things for
# the two keys). Without it the suite reports INCOMPLETE and FAILS, never skips.
lint:gateway-auth-flag-parity:
  stage: lint
  image: python:3
  tags: [hugmesh-x86]
  variables:
    GATEWAY_SRC: "${CI_PROJECT_DIR}/.gateway-src"
  before_script:
    - pip install --quiet pyyaml
    - ORG_BASE="$(dirname "${CI_REPOSITORY_URL}")"
    - git clone --depth 1 --filter=blob:none --sparse "${ORG_BASE}/hugmesh-gateway.git" "${GATEWAY_SRC}"
    - git -C "${GATEWAY_SRC}" sparse-checkout set src/main/resources
  script:
    - bash tests/stack/test-gateway-auth-flag-parity.sh

# Per-domain Casdoor lane (issue #47, Domain.idp=own): the casdoor-domains
# ApplicationSet must ship an EMPTY element scaffold, both roots must carry the
# ignoreDifferences+RespectIgnoreDifferences keystone (without it selfHeal
# silently reverts every runtime element write — the exact optional-services
# no-op shape), the template must keep the tokenless-kind repoURL literals AND
# sit in bootstrap-kind.sh's sso curated set, the base PVC must be Prune=false,
# and every kustomize patch target/path must resolve against the base. Includes
# its own negative controls (each corruption must bite).
lint:casdoor-domains-appset:
  stage: lint
  image: python:3-slim
  tags: [hugmesh-x86]
  before_script:
    - pip install --quiet pyyaml
  script:
    - bash tests/scripts/test-casdoor-domains-appset.sh

# Outbound (client-side) mTLS must be given the password to the stores it uses.
# The init containers minted a PKCS12 pair under a generated password and wrote
# only `server.ssl.*` — the INBOUND listener's keys. Outbound calls bind a
# separate prefix, `hugmesh.mtls.client.*`, defaulting to ${SSL_*_PASSWORD:} env
# that nothing sets, so both resolved to "". With the gate off that silently fell
# back to the JDK default truststore (no cluster CA) and POST /bff/login died on
# "PKIX path building failed" against admin-bff while BOTH SIDES HELD THE SAME CA
# — the client just could not open the store containing it. With the gate on
# (forum-bff-api) it is worse: KeyStore.load(new char[0]) throws and the client
# never constructs. This gate ran RED on the commit before the fix.
lint:outbound-mtls-client:
  stage: lint
  image: bash:5
  tags: [hugmesh-x86]
  script:
    - bash tests/scripts/test-outbound-mtls-client.sh

# For a raw-JWT carrier the mfa_satisfied_at claim is a Casdoor USER Property, so it
# enters a token only at MINT time. Whether that matters depends on WHO HOLDS the
# token: a human client that can re-mint (refresh_token / device_code / password)
# completes MFA and refreshes — hugmesh-desktop is seeded for exactly that and says
# so — whereas a pure client_credentials machine token has no user subject, so there
# is nothing to stamp and no factor to enrol. That machine population is what an
# operator must enumerate before the step-6 flip.
# This gate pins docs/MFA-ROLLOUT.md §2.4 to that TAXONOMY (not to arithmetic): it
# classifies each seeded app's grantTypes, requires §2.4 + step 6 to document the
# machine population while client_credentials is seeded, keeps the debunked
# "GEN2 bounds the gap" claim quarantined inside §2.4's refutation blockquote, and
# blocks re-assertion of the RETRACTED absolute that no raw-JWT caller can ever be
# fresh — an earlier draft of this very gate made that error by conflating token
# lifetime with time-to-next-mint, and three reviewers refuted it.
lint:mfa-raw-jwt-posture:
  stage: lint
  image: bash:5
  tags: [hugmesh-x86]
  script:
    - bash tests/scripts/test-mfa-raw-jwt-posture.sh

# The compose lane and the kind lane must seed the SAME e2e personas, and every
# role the authorization rows grant must be a role Casdoor actually creates.
# seed-accounts.sh's SYSTEMS_ROLE_USERS is an OVERRIDE, so a caller wanting one
# extra persona had to restate the whole base list; compose did, the kind
# bootstrap did not, and therefore seeded no extras at all. On a cluster where
# everything else worked, spec 29 answered "native login e2e-fleet -> 401" — a
# persona that had never been created, reading exactly like a broken login.
# Seeding it then exposed the layer beneath: route-access seeds a live authz row
# granting ROLE_FLEET_ADMIN on /bff/admin/phone-fleet/**, while the Casdoor seed
# never declared that role — so no account on any cluster could hold it and the
# fleet-owner phone console was unreachable. Both halves ran RED before the fix.
lint:e2e-persona-catalogue:
  stage: lint
  image: bash:5
  tags: [hugmesh-x86]
  script:
    - bash tests/scripts/test-e2e-persona-catalogue.sh

# Optional-services BUILD-TIME EXCLUSION gate. Sources the REAL gate + helper
# functions from build-rpi5-stage4.sh and runs gate_optional_services against a
# sandbox tree seeded from specs/cluster, proving EVERY user-level service
# (akkoma/tuwunel/phpbb/games/owncast/tube) is build-time excludable: excluded =>
# its Application/manifests/routes/rows OMITTED + installed-services ConfigMap
# "false" + 13a ApplicationSet element "false"; included => present + "true". Also
# covers the EXCLUDE_SERVICES subtractive knob. Cheap; no privileged runner needed.
lint:optional-services-exclude:
  stage: lint
  image: python:3-slim
  tags: [hugmesh-x86]
  before_script:
    - pip install --quiet pyyaml
  script:
    - bash tests/stack/test-optional-services-exclude.sh

# Merge-conflict-marker gate. A WIP checkpoint PR once merged an UNRESOLVED
# conflict hunk into tests/stack/gateway-routes/fe/application-routes.yml — a file
# the fe-gateway parses at STARTUP, so the platform front door crash-looped on
# `<<<<<<< HEAD` until someone read the container log. Nothing else catches this
# class: YAML/shell linters only run on the files they know, and a marker is valid
# text to git. Cheap grep, whole tree, fails on the first marker.
lint:conflict-markers:
  stage: lint
  image: python:3-slim
  tags: [hugmesh-x86]
  script:
    - |
      if grep -rn --binary-files=without-match -E '^(<{7}( |$)|={7}$|>{7}( |$))'            --exclude-dir=.git --exclude-dir=.stack-src --exclude-dir=node_modules .; then
        echo "unresolved merge-conflict markers committed (see matches above)"; exit 1
      fi
      echo "no conflict markers"

# SERVICE ENV-CONTRACT gate. Every service ships an application.yml full of
# `${SOME_ENV:<default>}`, and those defaults still name the PRE-REBRAND org,
# namespaces and hosts. A Deployment that omits an override does not fail — it
# silently adopts a value that is wrong on every real cluster. The first real
# KIND_PROFILE=sso bring-up (2026-08-05) walked through five of these in a row,
# each visible only after fixing the one before it: CASDOOR_ORG unset, so Casdoor
# answered "doesn't exist" about a persona the seed had just verified; the OIDC
# client-id defaulting to `user-bff` against a registered `app-user-bff` ("Invalid
# client_id"); a pre-rebrand redirect-uri; NXDOMAIN namespace defaults; and
# admin-bff unable to START on an unresolved `${SVC_PASSWORD}`. compose.local.yaml
# had overridden every one of them, several with a comment naming the exact error;
# none reached specs/cluster. (The exact error strings live in
# specs/cluster/service-env-contract.yaml, which is not part of the pre-rebrand
# scanner's surface — quoting them here turns lint:image-builder-always-on red.)
#
# THE KEY LIST IS DERIVED, NOT WRITTEN. The first cut of this job checked a
# hand-typed list and was green on a tree that still carried 23 more instances of
# the same defect. It now reads each SERVICE's own application.yml for every
# `${ENV:default}` whose default names a namespace this specs/cluster tree never
# creates or a domain it never serves, and requires the Deployment to override it —
# so a new stale default anywhere fails here with nobody editing a list, and
# `headscale.headscale.svc.cluster.local` (no pre-rebrand string in it at all) is
# caught like any other. It also still checks the things no config file can state:
# agreement with what casdoor-init ACTUALLY registers (derived from init-job.yaml by
# parsing its reconcile.py as Python, so either side moving alone turns it red) and
# which Secret a credential comes from.
#
# THE SIBLING CLONES ARE THE GATE, NOT A CONVENIENCE — same lesson, and the same
# recipe, as lint:reserved-prefixes above: the org mirror derived from
# CI_REPOSITORY_URL (read-only CI job token, no secret committed), and a clone
# failure fails the job on purpose. The checker exits 3 INCOMPLETE, never 0, if a
# checkout is missing. The repo list comes from `--list-repos`, i.e. from the
# manifests themselves, so a new BFF Deployment gets its source cloned without
# anyone editing this file.
#   NB image: `python:3` (not `-slim`) — we need git, exactly as lint:reserved-prefixes
#   already does for the same reason.
# Nineteen negative controls — including a brand-new stale default invented in a
# service repo, a namespace removed from the cluster tree, an unparseable
# casdoor-init (which must ABORT, not pass) and absent checkouts (which must be
# INCOMPLETE, not green) — so a green run cannot be vacuous.
# Offline apart from the clones: no cluster, no kubectl.
lint:service-env-contract:
  stage: lint
  image: python:3
  tags: [hugmesh-x86]
  variables:
    SERVICE_SRC_ROOT: "${CI_PROJECT_DIR}/.service-src"
  before_script:
    - pip install --quiet pyyaml
    - ORG_BASE="$(dirname "${CI_REPOSITORY_URL}")"
    - mkdir -p "${SERVICE_SRC_ROOT}"
    # Blobless + sparse: only src/main/resources is ever materialised, which is all
    # the checker reads. --depth 1 keeps it to the tip of the default branch.
    - |
      for r in $(python3 tests/scripts/service_env_contract.py specs/cluster --list-repos); do
        git clone --depth 1 --filter=blob:none --sparse "${ORG_BASE}/${r}.git" "${SERVICE_SRC_ROOT}/${r}"
        git -C "${SERVICE_SRC_ROOT}/${r}" sparse-checkout set src/main/resources
      done
  script:
    # bash is required: the negative controls stage a copy of specs/cluster AND of
    # the service sources, then re-run the checker against them.
    - bash tests/scripts/test-service-env-contract.sh

# Liquibase GRANT-role gate. Every Postgres role a service's changelogs GRANT to must
# be created by THAT service's own DB bootstrap, and must be a role something actually
# connects as.
#
# WHY. admin-bff-api CrashLoopBackOff'd in kind and could never start: all 97
# GRANT/REVOKE statements in its changelogs named `admin_bff`, a role of the SEPARATE
# route-access/gateway Postgres. Its own bootstrap creates `adminbff_app`
# (manifests/admin-bff-db/initdb/10-roles.sh), which is also the role it connects as.
#   ERROR: role "admin_bff" does not exist
#     [Failed SQL: GRANT SELECT, INSERT, UPDATE ON access_suspension TO admin_bff]
# It shipped because compose and the Testcontainers harnesses each created the missing
# role from the CHANGELOG's name so the GRANT would merely resolve — green everywhere
# except the one place with a real bootstrap. Hence the second leg: the grantee must be
# a role something LOGS IN as, so "just CREATE ROLE admin_bff" (startup passes, 97
# grants land on a role with no sessions) stays red. And hence the third: the checker
# PARSES tests/stack/compose.local.yaml, so a shim role the cluster bootstrap does not
# create is caught in the file that invents it. Reading only the cluster would have left
# that trap armed for the next divergence.
#
# THE SIBLING CLONES ARE THE GATE, NOT A CONVENIENCE — same recipe and same lesson as
# lint:service-env-contract above: the bootstraps are in THIS repo and the changelogs
# are in the SERVICE repos, so with no checkouts there is nothing to compare and the
# checker exits 3 INCOMPLETE, which the suite turns into a FAIL rather than a skip. The
# repo list comes from --list-repos, i.e. from the manifests, so a new BFF Deployment
# gets its source cloned without anyone editing this file.
#   NB image: `python:3` (not `-slim`) — git for the clones, as the siblings document.
# Sixteen negative controls, all pivoting on values DERIVED from the corpus rather than
# hard-coded, so a green run cannot be vacuous: the verbatim regression, the same bug
# planted in a different service, the placebo fix, an initdb the ConfigMap never
# publishes, an initdb scan matching nothing, a corpus with zero GRANTs, no changelog
# files, absent and partial checkouts, an unparseable changelog, a cluster tree with no
# Liquibase datasource at all, the compose shim renamed back to `admin_bff`, a granted
# role the local stack cannot create, and an unreadable compose file.
#   The pivot is taken from --list-repos, NEVER by scanning the source root: a stray
#   sibling sorting before `hugmesh-*` and carrying a GRANT would otherwise become the
#   thing the destructive controls rewrite.
# CONTROL 13 IS THE ONE TO KEEP. The controls delete and rewrite files in a staged copy
# of the corpus, and service checkouts here are routinely SYMLINKS (worktrees). An
# earlier revision staged with `cp -a`, kept the links, and `find -delete` walked
# through one into a real checkout — 64 files. Staging now dereferences, staged trees
# containing any symlink are refused, and every destructive command asserts its target
# resolves inside mktemp -d. Control 13 fires those rails at a canary tree on purpose
# and requires the canary to be byte-identical afterwards.
# Offline apart from the clones: no cluster, no kubectl.
lint:liquibase-grant-roles:
  stage: lint
  image: python:3
  tags: [hugmesh-x86]
  variables:
    SERVICE_SRC_ROOT: "${CI_PROJECT_DIR}/.grant-role-src"
  before_script:
    - pip install --quiet pyyaml
    - ORG_BASE="$(dirname "${CI_REPOSITORY_URL}")"
    - mkdir -p "${SERVICE_SRC_ROOT}"
    # Blobless + sparse: only src/main/resources/db is ever materialised, which is all
    # the checker reads. --depth 1 keeps it to the tip of the default branch.
    - |
      set -e
      for r in $(python3 tests/scripts/liquibase_grant_roles.py specs/cluster --list-repos); do
        git clone --depth 1 --filter=blob:none --sparse "${ORG_BASE}/${r}.git" "${SERVICE_SRC_ROOT}/${r}"
        git -C "${SERVICE_SRC_ROOT}/${r}" sparse-checkout set src/main/resources/db
      done
    # A repo that --list-repos demands but the loop did not materialise must stop the
    # job here, loudly. Silently checking nine of ten is the failure this gate exists
    # to prevent, one layer down.
    - |
      set -e
      for r in $(python3 tests/scripts/liquibase_grant_roles.py specs/cluster --list-repos); do
        test -d "${SERVICE_SRC_ROOT}/${r}/src/main/resources/db" || {
          echo "FATAL: ${r} has no src/main/resources/db after cloning — the gate would be blind to it"
          exit 1
        }
      done
  script:
