        libgl1 libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0
        squashfs-tools git > /dev/null
    # jsonschema is NOT optional here even though the test that needs it guards
    # itself with `pytest.importorskip`. studio/tests/test_worklist.py::
    # test_envelope_conforms_to_frozen_schema is the ONLY thing that validates a real
    # serialized worklist envelope against docs/schemas/worklist.v1.schema.json — the
    # frozen wire contract the Studio, the web admin-ui and the admin-bff envelope
