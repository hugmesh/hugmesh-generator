        - .gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# Desktop-governance consumer suite, until now CI-orphaned: provision_desktop_
# governance()'s ships-dark rendering (Discover Flatpak remote at api.<domain>
# with the domain SUBSTITUTED; flathub-off preset removal; polkit desktop-sudo
# gate with the stock %wheel line commented out; SSSD-OIDC conf 0600 at the
# per-domain issuer; bearer-forward.sh 0755; domain-precedence chain; no
# templates or no domain => NOTHING rendered, no sudo granted) plus the GEN-SSO
# session-start leg (OIDC-token deposit 0600 under XDG_RUNTIME_DIR, never
# exported; ungoverned/no-token => fail-closed no-op; session-install renders the
# autostart pair and refuses sed-metachar domains; templates byte-identical
# between specs/etc/... and keys-template/...). Function bodies are extracted
# from the REAL provision.sh and run against a sandbox /etc — no root, no
# flatpak/sssd binaries, no cluster, no docker. Tool set pinned for the same
# reason as the two jobs above.
desktop-governance-verify:
  stage: verify
  image: alpine:3
  tags: [hugmesh-x86]
  before_script:
    # python3 + openssl are for the sudo-mapper leg below: it generates a real
    # RSA keypair, signs real RS256 JWTs and runs the RENDERED python mapper
    # against a real JWKS. That suite hard-FAILs (not skips) without them, which
    # is the correct shape — a missing tool must never read as "crypto verified".
    - apk add --no-cache bash jq coreutils grep sed gawk findutils diffutils python3 openssl
  script:
    - bash tests/desktop-governance/test-provision-desktop-governance.sh
    - bash tests/desktop-governance/test-gen-sso-session-start.sh
    # PR #530 shipped the desktop-sudo mapper's ONLY test wired into nothing —
    # no CI job, no make target. It is the sole coverage of that mapper's JWKS
    # signature verification, iss/aud/exp checks, subject->identity binding,
    # alg=none rejection and rogue-key rejection, i.e. the entire reason a token
    # cannot mint sudo. Same tool set as the two legs above; 21 assertions.
    - bash tests/desktop-governance/test-desktop-sudo-mapper.sh
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - specs/etc/keys-provision/provision.sh
        - specs/etc/hugmesh/desktop-governance/**/*
        - keys-template/desktop-governance/**/*
        - tests/desktop-governance/**/*
        - .gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# Layer-A headscale SSH-ACL gate — the ALLOW/DENY role matrix that has existed in
# tests/device-registry/ since PR6 and had NEVER been wired into a pipeline, plus
# (2026-07-30) the COMPILE-SIDE RECONCILIATION half.
#
# WHY THIS ONE IS NOT OPTIONAL. Layer-A has two would-be writers of one headscale
# policy: the node-side renderer (specs/usr/sbin/gen-headscale-policy.sh), which is
# LIVE on every control node, and hugmesh-admin-bff-api's HeadscaleAclCompiler +
# reconcile loop, which ships DARK behind app.registry.headscale-acl.enabled=false.
# Nothing made them agree and they did not: the dark compiler addressed nodes by a
# tag no node carries, emitted an empty acls[] that would have blanked the
# 10.244/10.96 data-plane rule fleet-wide, dropped the always-on SUPERADMIN mesh
# rule (superadmin's ONLY reach to core nodes), omitted tagOwners, named
# per-operator groups headscale does not know, defaulted its base-url to a
# namespace this platform does not have, and would have PUT a DB-mode-only policy
# at a headscale running policy mode:file. This job is what keeps them reconciled.
#
# THE SIBLING CLONE IS PART OF THE GATE, NOT A CONVENIENCE — same reasoning as
# lint:reserved-prefixes: the compile-side assertions are the half that matters, so
# the script exits 3 (INCOMPLETE, i.e. the job FAILS) when the checkout is absent
# rather than printing a skip and going green. Same clone recipe: the org mirror
# derived from CI_REPOSITORY_URL, which carries the read-only CI job token — no
# secret committed. A clone failure fails the job, on purpose.
#
# MERGE ORDER: this job reads hugmesh-admin-bff-api's DEFAULT branch, so the BFF
# side of a Layer-A change has to land there before the matching generator change
# lands here. Override with LAYERA_BFF_REF while a cross-repo pair is in flight.
#
# WHAT IT PROVES. Beyond the ALLOW/DENY matrix: full-document parity. The job
# renders tests/device-registry/fixtures/layer-a-parity-export.json through the REAL
# renderer and diffs it against the checked-in golden; hugmesh-admin-bff-api holds
# byte-identical copies of that fixture set and its HeadscaleAclParityTest asserts its
# compiler reproduces the SAME golden. This job asserts the copies have not drifted
# apart and that the BFF-side test still exists — so the two writers are pinned field
# for field, and a BFF that quietly dropped its half fails HERE.
#
# Offline: bash + jq + openssl + git + diffutils. No headscale, no cluster, no docker,
# no JVM (the fp->tag agreement is proven by a pinned vector both sides carry, and
# document parity by the shared golden — neither needs the Java executed here).
layer-a-headscale-acl:
  stage: verify
  image: alpine:3
  tags: [hugmesh-x86]
  variables:
    LAYERA_SIBLING_ROOT: "${CI_PROJECT_DIR}/.layera-siblings"
    LAYERA_BFF_REF: "main"
  before_script:
    - apk add --no-cache bash jq openssl git diffutils grep gawk sed coreutils
    - ORG_BASE="$(dirname "${CI_REPOSITORY_URL}")"
    - mkdir -p "${LAYERA_SIBLING_ROOT}"
    - git clone --depth 1 --branch "${LAYERA_BFF_REF}" "${ORG_BASE}/hugmesh-admin-bff-api.git" "${LAYERA_SIBLING_ROOT}/hugmesh-admin-bff-api"
  script:
    - bash tests/device-registry/test-layer-a-headscale-acl.sh
  rules:
    # BLOCKING gate on either side of the Layer-A contract.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - specs/usr/sbin/gen-headscale-policy.sh
        - specs/usr/sbin/hugmesh-headscale-forcetags
        - specs/etc/headscale/**/*
        - specs/cluster/manifests/headscale/**/*
        - specs/cluster/apps/07-headscale-svc.yaml
        - specs/etc/keys-provision/provision.sh
        - tests/device-registry/**/*
        - .gitlab-ci.yml
    # And on the default branch, so a merged BFF-side change is caught here even
    # when nothing in this repo moved.
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# Build the three Pi role ISOs + the x86 host ISO. Needs root + crossdev + qemu
# on the runner host (the x86_64 node). Tag-select that runner.
build:isos:
  stage: iso
  tags: [hugmesh-x86, privileged]
  script:
    - ./scripts/build-all-roles.sh -j "$(nproc)"          # pki/backend/frontend (aarch64)
    - ./build-x86-host-stage4.sh -j "$(nproc)" -w x86-host-build
    - mkdir -p out && cp rpi5-stage4-build/*.iso x86-host-build/*.iso out/ 2>/dev/null || true
  artifacts:
    paths: [out/*.iso]
    expire_in: 30 days

build:images:
  stage: images
  tags: [hugmesh-x86]
  # Dispatch into the IN-CLUSTER Kaniko image-build pipeline
  # (specs/cluster/manifests/image-builder/) instead of the former echo STUB. The pipeline is
  # ALWAYS-ON: its ArgoCD Application lives in specs/cluster/apps/60-image-builder.yaml, which
  # the root app-of-apps recurses, so the `hugmesh-image-builds` namespace + its NetworkPolicy
  # exist on every reconcile. The former opt-in environment-variable guard is RETIRED — this
  # job now really dispatches a build.
  #
  # GATED to the default branch + release tags (the canonical sibling `build:image` posture
  # in hugmesh-gateway / hugmesh-forum-bff-api): never on a plain feature MR, so a build
  # only ever runs for a mergeable ref.
  #
  # OPERATOR PRECONDITIONS (this job FAILS, loudly, without them — it no longer no-ops):
  #   * KUBECONFIG on the hugmesh-x86 runner, pointing at the cluster, with create/get on
  #     Jobs in ${BUILD_NAMESPACE};
  #   * the image-builder Application synced (namespace + netpol present);
  #   * the `image-builder-registry` dockerconfigjson materialized in ${BUILD_NAMESPACE} by
  #     ESO from Vault secret/<brand>/harbor-robots, i.e. Vault + ESO + the Harbor
  #     provisioning Job have all run;
  #   * ${IMAGE_CONTEXT} reachable from the build pod, and its ref actually existing.
  #
  # allow_failure: NON-BLOCKING, ON PURPOSE — AND NOT A NO-OP. The job really dispatches and
  # its failure is reported; what allow_failure buys is that the failure stays contained to
  # THIS job. `stages:` puts sca and dast AFTER images, and neither sca:dependency-check nor
  # the dast jobs declare `needs:`, so under plain stage ordering a hard-failing build:images
  # would stop the OWASP Dependency-Check SCA and the ZAP DAST stages from running on main at
  # all. Those stages ran before the always-on flip only because the opt-in guard made this
  # job `exit 0`. Silently trading the repo's two security stages for this one build is a far
  # worse deal than a visible amber job, and the preconditions above are NOT met yet: the
  # cluster does not exist (see specs/cluster/apps/60-image-builder.yaml — the x86 netfilter
  # gap still blocks bringing one up).
  # FLIP THIS TO false the moment the cluster is live and a dispatch is expected to succeed —
  # from then on a build regression should be red. lint:image-builder-always-on holds the
  # invariant either way: it FAILS if build:images can block a later-stage job, so removing
  # allow_failure without also giving sca/dast their own `needs:` cannot pass review.
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  variables:
    # The in-cluster build namespace (must match manifests/image-builder/namespace-and-netpol.yaml).
    BUILD_NAMESPACE: "hugmesh-image-builds"
    # The per-app source repo + Dockerfile + destination image. Override per pipeline
    # (CI variables / matrix) to build each first-party app. Destination matches the app
    # kustomizations' newName convention (registry.hugmesh.net/hugmesh/<app>:<tag>).
    # HARBOR MIGRATION: this hostname is now served by Harbor, not GitLab's bundled
    # registry (see specs/cluster/apps/03a-harbor.yaml) — the push credential the
    # build pod mounts (image-builder-registry, see the `script:` comment below) is
    # Harbor's push-scoped robot account, minted by manifests/harbor/
    # harbor-provision-job.yaml. The hostname itself is UNCHANGED on purpose.
    IMAGE_APP: "hugmesh-gateway"
    # IMAGE_REF is the ref INSIDE THE APP REPO, not this repo. It must NOT default to
    # ${CI_COMMIT_SHA}: that is the GENERATOR's commit, which does not exist in the app repo,
    # so Kaniko's git-context clone would fail on every run. A matrix/child pipeline that
    # knows the app's resolved commit passes it here (and as IMAGE_TAG, below).
    IMAGE_REF: "main"
    IMAGE_CONTEXT: "git://github.com/hugmesh/hugmesh-gateway.git#${IMAGE_REF}"
    IMAGE_DOCKERFILE: "Dockerfile"
    # Where the built image lands. <app> is IMAGE_APP; the tags are computed in `script`.
    DEST_REPO: "registry.hugmesh.net/hugmesh/hugmesh-gateway"
  script:
    - |
      # TAG SCHEME — mirrors the canonical sibling `build:image` (gateway / forum-bff-api):
      #   IMMUTABLE = never moves. Prefer IMAGE_TAG (the APP repo's resolved commit/release,
      #               supplied by the dispatching pipeline); fall back to this pipeline's own
      #               tag/short SHA, which identifies the DISPATCH rather than the source.
      #   MOVING    = the app ref being built (IMAGE_REF; `main` by default), which the app
      #               kustomizations track via `newTag: main` for dev. Re-pointed each build.
      # Kaniko pushes BOTH from the ONE build (two --destination flags in the template), so the
      # moving + immutable tags are always byte-identical layers.
      IMMUTABLE_TAG="${IMAGE_TAG:-${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}}"
      MOVING_TAG="${IMAGE_REF}"
      DEST_IMAGE="${DEST_REPO}:${IMMUTABLE_TAG}"
      DEST_IMAGE_MOVING="${DEST_REPO}:${MOVING_TAG}"
      echo "building ${IMAGE_APP}: immutable=${DEST_IMAGE}  moving=${DEST_IMAGE_MOVING}"
      # Render the ships-dark Kaniko Job template with this build's parameters and apply it
      # into the in-cluster build namespace. The template lives in the GitOps repo; the build
      # pod (rootless Kaniko) pushes to registry.hugmesh.net using the ESO-materialized
      # image-builder-registry dockerconfigjson. No secrets are passed from CI.
      BUILD_NAME="${IMAGE_APP}-${CI_COMMIT_SHORT_SHA}"
      # Use | as the sed delimiter (the git-ref CONTEXT contains '#', so '#' must not delimit).
      sed \
        -e "s|\${BUILD_NAME}|${BUILD_NAME}|g" \
        -e "s|\${BUILD_NAMESPACE}|${BUILD_NAMESPACE}|g" \
        -e "s|\${CONTEXT}|${IMAGE_CONTEXT}|g" \
        -e "s|\${DOCKERFILE}|${IMAGE_DOCKERFILE}|g" \
        -e "s|\${DEST_IMAGE_MOVING}|${DEST_IMAGE_MOVING}|g" \
        -e "s|\${DEST_IMAGE}|${DEST_IMAGE}|g" \
        specs/cluster/manifests/image-builder/kaniko-build-job.template.yaml \
        | kubectl -n "${BUILD_NAMESPACE}" apply -f -
      kubectl -n "${BUILD_NAMESPACE}" wait --for=condition=complete \
        "job/image-build-${BUILD_NAME}" --timeout=1800s

# NOTE: there is no longer a bundled `hugmesh-pentest-runner` image stage. The
# pen-test is DEV/CI-pipeline-only: the `sca` + `dast` stages below run the OWASP
# toolchain from PUBLIC images directly (owasp/dependency-check for SCA;
# ghcr.io/zaproxy/zaproxy:stable, pulled by the harness, for DAST), and the reusable
# per-repo stage template (tests/pentest/ci/pentest-stage.gitlab-ci.yml) does the
# same — so no in-cluster CronJob image needs to be built or published.

# Publish each ISO to the generic package registry under a stable "latest" path
# so the admin UI's download links never change.
deliver:isos:
  stage: deliver
  tags: [hugmesh-x86]
  needs: ["build:isos"]
  script:
    - |
      for f in out/*.iso; do
        n="$(basename "$f")"
        curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
             --upload-file "$f" "${ISO_BASE}/${n}"
        echo "delivered ${ISO_BASE}/${n}"
      done
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# =============================================================================
# sca — OWASP Dependency-Check SCA over the org's first-party repos.
#
# A parallel:matrix fans one job out per repo so a single noisy repo's CVEs don't
# mask the others, and so the HTML+SARIF artifacts are per-repo. Each job clones
# the target repo from the GitLab org mirror, runs Dependency-Check with
# --failOnCVSS 7 (a CVSS>=7 finding fails THAT repo's job), and persists the NVD
# feed in a CI cache keyed on the feed month so re-runs don't re-download ~250MB.
#
# hugmesh-games is DELIBERATELY EXCLUDED from this matrix: it is a DISTINCT
# stack with its OWN .gitlab-ci.yml that runs SCA in its own pipeline (incl. its
# Rust bridge) — see hugmesh-pentest-standard "TWO SEPARATE WORKFLOWS" + PR6.
# Likewise the static sites (usidiamond.github.io) + the generator-meta repos that
# carry no dependency manifest are out of scope here.
sca:dependency-check:
  stage: sca
  image:
    name: owasp/dependency-check:latest
    entrypoint: [""]
  tags: [hugmesh-x86]
  parallel:
    matrix:
      # Every name here must be a REAL repo in the org — the before_script clones
      # ${ORG_BASE}/${REPO}.git and a clone failure fails the job. These were all
      # still the PRE-REBRAND repo names, which the org-wide rename retired, so
      # every one of these clones was broken; they are the hugmesh-* names now
      # (canonical list: scripts/clone-all-repos.sh).
      - REPO:
          - hugmesh-gateway
          - hugmesh-fe-gateway
          - hugmesh-be-gateway
          - hugmesh-pki-gateway
          - hugmesh-admin-bff-api
          - hugmesh-mod-bff-api
          - hugmesh-user-bff-api
          - hugmesh-forum-bff-api
          - hugmesh-federation-api
          - hugmesh-admin-ui
          - hugmesh-mod-ui
          - hugmesh-user-ui
          - hugmesh-login-ui
          - hugmesh-forum-ui
          - hugmesh-matrix-ui
          - hugmesh-mastodon-ui
          - hugmesh-remote-fragment
          - hugmesh-actions
          - hugmesh-api-docs
          - hugmesh-generator
        # NOTE: hugmesh-games is intentionally NOT in this list — it owns its
        # own pipeline + SCA stage (the games two-Casdoor stack, incl. its in-tree
        # Rust bridge). Adding it here would double-scan + cross workflows.
  cache:
    # Persist the NVD feed across runs. Keyed on the feed month so the monthly
    # full-feed refresh rotates the cache without an unbounded stale entry.
    key: "nvd-cache-$CI_COMMIT_REF_SLUG-$(date +%Y%m 2>/dev/null || echo feed)"
    paths: [.nvd-cache/]
  variables:
    GIT_STRATEGY: none   # we clone the *target* repo, not check this one out.
  before_script:
    - mkdir -p .nvd-cache reports/${REPO}
    # Clone the matrix repo from the same org mirror this pipeline lives in,
    # using the CI job token (read-only, no secret committed).
    - ORG_BASE="$(dirname "${CI_REPOSITORY_URL}")"
    - git clone --depth 1 "${ORG_BASE}/${REPO}.git" "src/${REPO}" || git clone --depth 1 "${ORG_BASE%/}/${REPO}.git" "src/${REPO}"
  script:
    - >
      /usr/share/dependency-check/bin/dependency-check.sh
      --project "hugmesh-${REPO}"
      --scan "src/${REPO}"
      --out "reports/${REPO}"
      --data ".nvd-cache"
      --failOnCVSS 7
      --enableExperimental
      --format HTML --format SARIF --format JSON
      ${NVD_API_KEY:+--nvdApiKey "$NVD_API_KEY"}
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - reports/${REPO}/dependency-check-report.html
      - reports/${REPO}/dependency-check-report.sarif
      - reports/${REPO}/dependency-check-report.json
    reports:
      # Surface findings in the MR security widget (GitLab reads SARIF here).
      sast: reports/${REPO}/dependency-check-report.sarif
  rules:
    # On every MR + the default branch (gate new High/Critical) and on schedule
    # (the nightly full feed refresh). NEVER on the games-only ref.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

# =============================================================================
# dast — authenticated OWASP ZAP DAST against a spun-up two-brand env-test-build,
# driven by the SHARED harness (tests/pentest/run-pentest.sh). The harness stands
# up the compose env-test-build, seeds the attacker + load personas across
# brandA/brandB (seed-personas.sh, creds from CI variables — NEVER git), scans as
# every persona, and merges ZAP+SCA+probe findings into the scorecard + SARIF.
#
#   dast:main-baseline  runs on every MR + the default branch — fast feedback:
#                       passiveScan + spider + the custom boundary probes.
#   dast:main-full      runs ONLY on a scheduled pipeline (the nightly cadence) —
#                       the above + the ENABLED activeScan.
#
# Needs Docker (the harness spins compose + runs the zaproxy image), so it lands
# on the privileged x86 runner, same tag convention as build:isos.
.dast-base:
  stage: dast
  tags: [hugmesh-x86, privileged]
  variables:
    # The harness reads creds for the throwaway TEST realm from CI variables at
    # runtime (masked/protected in GitLab) and never writes them to git. See
    # tests/pentest/seed-personas.sh + the test-seed-passwords contract.
    PENTEST_REPORTS: "${CI_PROJECT_DIR}/out/pentest"
  artifacts:
    when: always
    expire_in: 30 days
    paths: [out/pentest/]
  # The env-test-build stand-up is inherently flaky (two stacks + empty-Casdoor
  # first boot); a non-blocking retry on the runner-system/stuck classes only.
  retry:
    max: 1
    when: [runner_system_failure, stuck_or_timeout_failure]

dast:main-baseline:
  extends: .dast-base
  script:
    - bash tests/pentest/run-pentest.sh --env compose --scan baseline --pipeline main
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

dast:main-full:
  extends: .dast-base
  timeout: 3h   # active scan over every persona/brand is long.
  script:
    - bash tests/pentest/run-pentest.sh --env compose --scan full --pipeline main
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

# =============================================================================
# load — the OPT-IN k6 LOAD / DoS-resilience stage. DEV / CI-PIPELINE ONLY and
# OFF BY DEFAULT: it is gated on the CI variable PENTEST_LOAD ("1"), set either by
# triggering the manual job or by a GitLab Schedule that defines PENTEST_LOAD=1
# (see docs/PENTEST-SCHEDULES.md). It is slow/heavy (a full ramp + hold + the
# stress past-the-limit run), so it never runs on a plain MR or default-branch
# push — only when PENTEST_LOAD is explicitly set.
#
# It reuses the SAME harness as the dast stage: run-pentest.sh stands up the
# two-brand compose env-test-build, seeds the attacker + LOAD personas across
# brandA/brandB (seed-personas.sh, creds from CI variables — NEVER git), then the
# --load flag drives tests/pentest/load/main-mixed.js AS the real seeded roles
# reading the SAME per-persona tokens.env the ZAP harness mints. The k6 scenarios:
#   realistic-mixed  per-(role x domain) pools at prod-shaped ratios (browse-heavy
#                    reads, login burst, occasional admin write) — ramp 0->target
#                    2m, hold 5m; the SLO gate (p95/p99 latency + <1% 5xx).
#   stress           ramp PAST the nginx limit_req zone rates to force 429s and
#                    verify graceful degradation — a 429 is EXPECTED/PASS, a 5xx is
#                    FAIL (the error budget separates the two).
# load-report.py renders throughput / p50-p99 latency / error-rate HTML in the
# test-standard style with the gated thresholds shown pass/fail.
#
# Needs Docker (compose + the public grafana/k6 image), so it lands on the same
# privileged x86 runner as the dast stage.
.load-base:
  stage: load
  tags: [hugmesh-x86, privileged]
  variables:
    PENTEST_REPORTS: "${CI_PROJECT_DIR}/out/pentest"
    # k6 load intensity — overridable per-schedule (a heavier nightly, a lighter
    # manual smoke). Defaults live in main-mixed.js.
    PENTEST_LOAD_PROFILES: "realistic-mixed stress"
  artifacts:
    when: always
    expire_in: 30 days
    paths: [out/pentest/]
  retry:
    max: 1
    when: [runner_system_failure, stuck_or_timeout_failure]

load:main:
  extends: .load-base
  # The whole staged ramp (realistic-mixed hold + the stress past-limit run) is
  # long; give it room. The soak profile (nightly) extends this further via
  # PENTEST_LOAD_PROFILES + PENTEST_LOAD_SOAK_DURATION (see PENTEST-SCHEDULES.md).
  timeout: 4h
  script:
    - bash tests/pentest/run-pentest.sh --env compose --pipeline main --load
  rules:
    # OFF BY DEFAULT. Only when PENTEST_LOAD is set:
    #   * a SCHEDULED pipeline that defines PENTEST_LOAD=1 (the nightly load run),
    #   * or a manual run with PENTEST_LOAD=1 (a dev kicking it from the UI/API).
    # NEVER on a plain MR or default-branch push (no `merge_request_event` /
    # `$CI_COMMIT_BRANCH` rule here), so it cannot slow normal CI.
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $PENTEST_LOAD == "1"'
    - if: '$PENTEST_LOAD == "1"'
      when: manual
      allow_failure: true

# Cassandra cluster-wiring gate. The first real kind run found that NO GATEWAY
# COULD EVER START against the cluster's own Cassandra: the bitnami image
# defaults to PasswordAuthenticator and the payload passed no credentials to
# anything (AuthenticationException at bean creation -> CrashLoopBackOff), and
# nothing cluster-side created the keyspaces either (InvalidKeyspaceException on
# the gateway's own keyspace) — compose has had a cassandra-init service
# doing that for years, with a comment describing the bug, and the workaround was
# never propagated. Both failure modes are silent in CI and loud only on a live
# cluster, which is why they survived to a first bring-up.
# This job asserts the whole contract statically: every workload that dials
# Cassandra (detected by the VALUE being a cassandra host, not by an env NAME —
# admin-bff's manifest set a CASSANDRA_CONTACT_POINTS that bound to nothing) is
# emitted with a username and a secretKeyRef password; that Secret is really
# materialized in that workload's OWN namespace; every Vault property behind it
# is minted on BOTH delivery paths (online `vault kv put` and the offline USB
# bundle — ESO fails a whole Secret on one missing property); the keyspace and
# the role each consumer names are created by a bootstrap the cluster actually
# auto-syncs, with every CREATE KEYSPACE ordered before the GRANTs that name it
# and the bootstrap pod admitted by the default-deny Cassandra NetworkPolicy; and
# every consumer's local-datacenter matches what the configured snitch really
# advertises (SimpleSnitch always says datacenter1, so `cluster.datacenter` is
# cosmetic — the payload used to name it two different ways). The shared gateway
# chart must also refuse to render a half-wired instance.
# The role half asserts a PERMISSION MATRIX, not the presence of a grant: each
# consumer declares its CQL permission class and the bootstrap's GRANTs are
# checked against it for set equality, per role, per keyspace, with the grant
# GRAMMAR an allowlist so ALL PERMISSIONS / ON ALL KEYSPACES / role-to-role
# inheritance cannot slip past unparsed. The dark overlay this branch deleted had
# a COMPLETE grant matrix that was backwards (the four gateways, which carry the
# CQL migration runner, as SELECT-only readers); a presence check scores that
# green, so a control re-lands it verbatim and requires a failure.
# 43 mutation controls plant each of those regressions on a staged copy every
# run, each asserting its own injection applied, so a green run cannot be
# vacuous — including one that fails when the consumer scan itself comes back
# empty.
# PyYAML + bash only (bash ships in python:3-slim, Debian): no cluster, no
# kubectl, no docker, no network.
lint:cassandra-cluster-wiring:
  stage: lint
  image: python:3-slim
  tags: [hugmesh-x86]
  before_script:
    - pip install --quiet pyyaml
  script:
    - bash tests/scripts/test-cassandra-cluster-wiring.sh

# Casdoor bootstrap honesty gate. The first real cluster run had casdoor-init
# printing all thirteen "added app-<name>" lines while its admin login had FAILED
# — every call went out anonymous, Casdoor logged "result = deny", and nothing
# persisted. Casdoor answers denials with HTTP 200 + {"status":"error"}, so a
# script that only watches for exceptions cannot tell a denied run from a good
# one; underneath that, the mounted init_data.json was never imported (app.conf
# omitted `initDataFile`) and the IdP kept casdoor's default admin password.
# This job holds EVERY embedded Casdoor reconcile script (discovered, not listed)
# to the contract that makes those three un-reshippable, and RUNS the real
# scripts against a stub Casdoor that reproduces each live failure shape —
# denied session, denied writes, writes that answer "ok" while storing nothing,
# and a write whose verification READ is denied — asserting each exits non-zero
# and announces nothing, that a happy path still succeeds and is idempotent, and
# that no password ever reaches stdout/stderr. That behavioural sweep covers the
# three derived-role sync Jobs too, whose update-role IS an authorization
# decision; the envelope check is a control-flow analysis of each call() rather
# than a search for the word "status", because a helper that logs a denial and
# carries on contains every such word. Every static check is re-run against a
# corrupted staged copy, and the write-honesty scenario against a copy regressed
# to the exact bug it exists for, so a check that stopped biting is reported
# rather than passed over.
# It ALSO holds every init_data.json to casdoor's own import preconditions, which
# is a different question from the wiring above and was learned the hard way: the
# first boot that actually imported the systems seed died on
#   panic: The organization: admin should have one application at least
# because casdoor refuses to create a user in an organization that has no
# application (object/user.go:1000-1007, panicked at init_data.go:368) and the
# seed declared six service users, twenty-seven roles and no application — the
# applications being created later, over the API, by the very Job that cannot run
# until casdoor is up. Wiring the import up correctly is what exposed it, so the
# gate now proves each seed can import ITSELF: organization viability, the owner
# the application count actually filters on, InitFromFile()'s hardcoded kind
# order, and the dangling role/permission members casdoor stores without a word.
# The behavioural half additionally runs each init script TWICE against a stub
# that enforces casdoor's immutable user ID, because a reconciler that rebuilds
# an update payload from scratch passes on a fresh cluster and fails on every
# ArgoCD re-sync afterwards — a single-run harness cannot see that class.
# python:3-slim + PyYAML, same as lint:mfa-required-rules; the stub binds
# 127.0.0.1 on an ephemeral port — no cluster, no docker, no network egress.
lint:casdoor-init-honesty:
  stage: lint
  image: python:3-slim
  tags: [hugmesh-x86]
  before_script:
    - pip install --quiet pyyaml
  script:
    - bash tests/scripts/test-casdoor-init-honesty.sh
# ── Guards that nothing ran, now run ─────────────────────────────────────────
# THE ORPHAN SWEEP. Forty-one tests/**/test-*.sh suites existed on main that no
# pipeline job and no make target invoked. They were not drafts: they carry the
# signed-export ACCEPT/REJECT matrices for the device registry, the domain and
# foreign-ingest reconcile FUZZ suites, the keystore/external-CA import gates,
# the managed-services default-off gate, the go-live and cloud-deploy wizard
# refusal matrices, the auto-update opt-in gates, and ~20 builder-invariant
# guards. Two of them (test-calamares-boost-seed, test-python-targets-seed) were
# also permanently RED against main because a pcs_sync_dir refactor moved the
# copy they grep for, which is precisely the drift they exist to catch — nobody
# saw it because nobody ran them.
#
# The list is EXPLICIT, not a glob: a glob would silently absorb a future suite
# that needs a live stack and turn this job red for the wrong reason.
# tests/scripts/test-guard-integrity.sh (lint:guard-integrity below) is what
# stops the list from rotting — a new suite that appears in neither this list
# nor a make target fails there.
#
# The loop ACCUMULATES rc. `for t in …; do bash "$t"; done` would exit with the
# LAST suite's status and forgive every earlier failure — the same "structurally
# incapable of failing" defect this whole job exists to undo.
#
# Rootless, offline, no cluster, no docker: every suite is static analysis or a
# stub harness over the real script bodies. Tool set is the proven alpine recipe
# from node-storage-verify plus git (a few suites shell out to `git ls-files`),
# tar and util-linux (setsid/flock probes).
#
# ── THE IMAGE NEEDS A JDK, AND THAT IS NOT OPTIONAL ─────────────────────────
# Wired on `alpine:3` this job reproduced BOTH halves of the disease it exists
# to cure. Four suites need `keytool`, which no plain alpine carries:
#   * tests/keystores/test-keystores.sh, -external-ca.sh and -multidomain.sh
#     printed "SKIP: need keytool" and exited 0 — three guards wired in and
#     checking nothing, in every pipeline;
#   * tests/scripts/test-headscale-oidc-secret-staging.sh went hard RED, because
#     gen-provision-keys.sh reaches its JKS step and dies "ERROR: need keytool" —
#     a red job for an environmental reason, not a defect.
# eclipse-temurin:21-jdk-alpine is `FROM alpine:3.22` with
# `ENV PATH=$JAVA_HOME/bin:$PATH` (JAVA_HOME=/opt/java/openjdk) — verified
# against the upstream Dockerfile at adoptium/containers 21/jdk/alpine/3.22 — so
# keytool is on PATH and the `apk add` recipe below is unchanged and still valid.
# The preflight line makes a broken image an immediate, named failure instead of
# something discovered forty suites later.
#
# ── ssh-keygen AND make ARE PART OF THAT TOOLCHAIN TOO ──────────────────────
# Supplying keytool was necessary and not sufficient: the headscale suite stayed
# hard RED because it runs the REAL gen-provision-keys.sh, whose own preflight
# (scripts/gen-provision-keys.sh:256) is `for t in openssl ssh-keygen python3`
# and aborts "ERROR: missing tool: ssh-keygen" long before the JKS step. Alpine
# does NOT ship ssh-keygen with `openssl` — upstream, /usr/bin/ssh-keygen comes
# from the separate `openssh-keygen` package (pkgs.alpinelinux.org contents
# search, v3.22/main/x86_64) — so an image that installs openssl looks
# provisioned and is not.
# `make` (alpine main, GNU Make 4.4.1) is here for the same reason on the skip
# side rather than the red side: without it tests/cloud-deploy/test-cloud-deploy-
# driver.sh prints "make absent — OIDC_ISSUER seam proof skipped" and hands back
# four unverified assertions as passes. With it they run.
# Every added binary is also added to the preflight line: a package that is
# renamed or dropped upstream must fail HERE, by name, not forty suites later.
#
# ── WHY test-selinux-policy-install.sh IS NOT IN THIS LIST ──────────────────
# It was, and it was hard RED here: it drives a real GNU-make refpolicy contract
# Makefile AND the m4 -> checkmodule -> semodule_package recipe, and it needs
# BOTH — measured on this job's exact toolchain, one at a time:
#     neither make nor the SELinux tools ......... 109 passed, 17 FAILED
#     + make only ................................ 109 passed, 17 FAILED
#     + m4/checkmodule/semodule_package only ..... 105 passed, 21 FAILED
#     + both ..................................... 126 passed,  0 failed
# So adding `make` here would NOT have rescued it (the lib's own host-toolchain
# assertion returns 1 first), and checkmodule/semodule_package have no Alpine
# package at all — there is no `checkpolicy` aport in v3.22. It moved to
# selinux-policy-verify below, on Debian, which carries the whole set.
orphan-guards-verify:
  stage: verify
  image: eclipse-temurin:21-jdk-alpine
  tags: [hugmesh-x86]
  before_script:
    - apk add --no-cache bash jq openssl python3 py3-yaml coreutils grep sed gawk findutils diffutils git tar util-linux openssh-keygen make
    - for t in bash jq openssl python3 git tar keytool ssh-keygen make; do command -v "$t" >/dev/null || { echo "TOOLCHAIN MISSING:$t — this job's image cannot run its guards"; exit 1; }; done
  script:
    - |
      set -u
      SUITES="
        tests/auto-update/test-builder-opt-in.sh
        tests/auto-update/test-provision-update.sh
        tests/auto-update/test-update-poller.sh
        tests/cloud-deploy/test-cloud-deploy-driver.sh
        tests/device-registry/test-registry-allow-deny.sh
        tests/device-registry/test-self-report.sh
        tests/domain-registry/test-domain-reconcile-fuzz.sh
        tests/domain-registry/test-foreign-ingest-fuzz.sh
        tests/go-live/test-go-live-driver.sh
        tests/go-live/test-go-live-reconcile-verify.sh
        tests/keystores/test-keystores.sh
        tests/keystores/test-keystores-external-ca.sh
        tests/keystores/test-keystores-multidomain.sh
        tests/managed-services/test-managed-services-gate.sh
        tests/node-storage/test-bake-coverage.sh
        tests/scripts/test-anubis-env-gate.sh
        tests/scripts/test-arm-ro-distdir.sh
        tests/scripts/test-binpkg-pool-fingerprint.sh
        tests/scripts/test-builder-log-paths.sh
        tests/scripts/test-calamares-boost-seed.sh
        tests/scripts/test-casdoor-jwt-no-preferred-username.sh
        tests/scripts/test-edge-ai-cuda-host-compiler.sh
        tests/scripts/test-first-run-lib.sh
        tests/scripts/test-headscale-oidc-secret-staging.sh
        tests/scripts/test-host-accept-keywords.sh
        tests/scripts/test-host-bdep-pool.sh
        tests/scripts/test-host-mutation-guard.sh
        tests/scripts/test-host-selinux-tools.sh
        tests/scripts/test-idp-builder-functions.sh
        tests/scripts/test-installer-ui-node-default.sh
        tests/scripts/test-kernel-artifact-cache.sh
        tests/scripts/test-passhash-lib.sh
        tests/scripts/test-platform-key-spelling.sh
        tests/scripts/test-portage-config-sync.sh
        tests/scripts/test-python-targets-seed.sh
        tests/scripts/test-rpi5-per-board-pkgdir.sh
        tests/scripts/test-shared-build-assets.sh
        tests/scripts/test-spec-use-parity.sh
        tests/scripts/test-x86-artifact-integrity.sh
        tests/stack/test-front-door-client-surface.sh
      "
      rc=0
      failed=""
      for t in ${SUITES}; do
        echo "── ${t}"
        if [ ! -f "${t}" ]; then
          echo "   MISSING — the suite list names a file that does not exist"
          rc=1; failed="${failed} ${t}(missing)"; continue
        fi
        bash "${t}" || { rc=1; failed="${failed} ${t}"; }
      done
      if [ "${rc}" -ne 0 ]; then echo; echo "FAILED SUITES:${failed}"; fi
      exit "${rc}"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# SELinux node-policy compile+install gate (tests/scripts/test-selinux-policy-
# install.sh) — the wiring that makes specs/selinux/*.te reach an image, the
# all-or-nothing install, the .fc label-only trap, the conditional k8s exemplars,
# idempotence, and the enforce-gate shipping INERT so a default image still boots
# permissive.
#
# WHY IT IS ITS OWN JOB, ON DEBIAN. It was wired into orphan-guards-verify and
# went hard RED there — an environmental red, which trains everyone to ignore the
# signal exactly as a silent skip does. It is the ONE orphan that executes a real
# GNU-make build: mk_headers() writes refpolicy's support/Makefile.devel variable
# contract (NAME/SHAREDIR/HEADERDIR, `include $(HEADERDIR)/build.conf`, $(error)
# guards, a `%.pp: %.te` pattern rule) and the lib under test invokes `make`
# against it. Alpine ships no `make` in the base image, so 17 assertions failed.
#
# `make` alone is not enough — and, measured, does not help at all on its own:
# the lib re-asserts its host toolchain (`for t in m4 checkmodule
# semodule_package`) at the point of use and returns 1 before make matters, so
# alpine+make scores the SAME 109/17. Section C-real runs the genuine
#     m4 -> $(BINDIR)/checkmodule -> $(BINDIR)/semodule_package
# recipe and produces a real .pp, and C-pin proves the BINDIR/SBINDIR pins beat a
# cross sysroot's own hardcoded tool dirs. Alpine has no `checkpolicy` aport at
# all (pkgs.alpinelinux.org, v3.22 — no matching package), so on any alpine image
# those two sections can only take their `else` branch and score SIX SKIPS AS
# PASSES on top of the 17 reds. Debian carries the lot, verified against upstream
# file lists:
#   checkpolicy    3.8.1-1 -> /usr/bin/checkmodule
#   semodule-utils 3.8.1-1 -> /usr/bin/semodule_package
# and /usr/bin is exactly where the suite asserts BINDIR resolves.
#
# python:3-slim is this file's standard Debian base (25 jobs already use it), so
# no new image enters the pipeline; the suite itself needs no Python.
# gawk is explicit because Debian's default awk is mawk.
#
# THE PREFLIGHT IS THE POINT. The suite's real-toolchain sections degrade to
# `ok "SKIP …"` when the binaries are absent — honest on a workstation, a lie in
# CI, where the image decides. Asserting all four here means the CI path can
# never reach that branch: a dropped or renamed package fails this job by name.
selinux-policy-verify:
  stage: verify
  image: python:3-slim
  tags: [hugmesh-x86]
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends make m4 gawk checkpolicy semodule-utils
    # tar/gzip/sha256sum belong here for the same reason as the rest: D-real reaches
    # its header tree by digest-checking and unpacking the pinned fixture, and if any
    # of the three vanished from the base image the leg would go back to SKIPping —
    # green, and compiling nothing. Assert them by name rather than discover it later.
    - for t in bash make m4 gawk checkmodule semodule_package tar gzip sha256sum; do command -v "$t" >/dev/null || { echo "TOOLCHAIN MISSING:$t — this job's image cannot run the SELinux policy gate"; exit 1; }; done
  script:
    - bash tests/scripts/test-selinux-policy-install.sh
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# Mesh repo-templating rename/PR path (tests/domain-registry/test-templating-
# rename-pr.sh) — the render -> pull-repo-base -> publish-tenant-set chain, its
# provenance stamping, and the create-or-update PR flow's fail-closed cases
# (409-with-no-open-PR, --pr without a base version, render/publish ref drift).
# Split out of the sweep above because it is the ONE orphan needing node: it
# renders real Handlebars. It SKIPs (exit 0) when handlebars is absent, so
# putting it in an alpine job would have wired a permanent silent skip —
# a guard that runs and checks nothing. `npm ci` here makes it actually run.
templating-rename-verify:
  stage: verify
  image: node:20-alpine
  tags: [hugmesh-x86]
  before_script:
    # openssl is NOT optional here: scripts/provenance.sh (which the templating
    # rename PR flow calls) hard-exits "FATAL: openssl not found (build-host
    # tool)". node:20-alpine does not ship it, so without this the job is red on
    # every default-branch pipeline — the same environmental-red this whole
    # change set exists to eliminate.
    # python3 + py3-yaml: case B11 of the suite PARSES this file as YAML to assert
    # template-drift-verify below still exists, still runs the sweep, and still cannot
    # be waved through with allow_failure — the archetype gate's whole original defect
    # was that no CI job ran it. Same recipe as node-storage-verify / egress-vpn-verify.
    - apk add --no-cache bash jq git tar coreutils grep sed gawk findutils openssl python3 py3-yaml
    - (cd scripts/tooling && npm ci --no-audit --no-fund)
  script:
    # Fail-closed on the skip: this job's whole reason to exist is that
    # handlebars IS installed, so a SKIP here means npm ci silently did nothing.
    - test -d scripts/tooling/node_modules/handlebars
    - bash tests/domain-registry/test-templating-rename-pr.sh
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - scripts/tooling/**/*
        - scripts/render-repo-tree.sh
        - scripts/pull-repo-base.sh
        - scripts/publish-tenant-set.sh
        # Cases B8-B11 of test-templating-rename-pr.sh are the ONLY thing that grades
        # the archetype drift gate's own honesty (that a real drift exits non-zero, and
        # that template-drift-verify below is still wired). Without these two paths an
        # MR touching only the sweep skips the suite that guards it.
        - scripts/validate-repo-templates.sh
        - scripts/validate-repo-templates-all.sh
        - tests/domain-registry/**/*
        - .gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# ARCHETYPE TEMPLATE-DRIFT gate, ALL archetypes (scripts/validate-repo-templates-all.sh).
# docs/MESH-TEMPLATING.md asked for this in Phase 2 — "wire it into CI beside the
# reserved-prefix guard" — and nobody ever did: the ONLY automated caller of
# scripts/validate-repo-templates.sh was case B8 of test-templating-rename-pr.sh, which
# grades `--archetype generator` alone. Three of the six overlays (spring-bff,
# angular-host, remote-fragment) were carrying a drift each, undetected, because no
# pipeline had ever looked at them — a repair that took the tree to "0 drift" was scoped
# to `--archetype angular-mfe`. This job grades EVERY archetype and fails the build on
# any drift in any of them.
#
# THE EXEMPLAR CLONES ARE THE GATE, NOT A CONVENIENCE — same lesson as
# lint:reserved-prefixes above. The overlays are asserted against the RUNNING sibling
# repos, so pull-repo-base.sh is pointed at THIS pipeline's own forge (job token, no
# PAT) rather than the public GitHub default. A base it cannot reach exits 2, which the
# sweep reports as ERROR and fails on: an unrunnable gate is the same vacuous green as
# a missing one.
#
# Runs on the default branch as well as on MRs on purpose. Most of this file's drift
# arrives from the OTHER side — a sibling repo edits the anchored region — so a
# changes:-only rule would never fire on the commit that actually causes the drift.
template-drift-verify:
  stage: verify
  image: node:20-alpine
  tags: [hugmesh-x86]
  before_script:
    - apk add --no-cache bash git jq coreutils grep sed gawk findutils
    - (cd scripts/tooling && npm ci --no-audit --no-fund)
    # The clone base for the exemplar members. dirname of CI_REPOSITORY_URL keeps the
    # embedded job-token credential, exactly as lint:reserved-prefixes does it.
    - export GIT_BASE="$(dirname "${CI_REPOSITORY_URL}")"
  script:
    # Fail-closed on a silent no-op install: handlebars absent means the drift oracle
    # cannot render, and the gate would exit 2 for an environmental reason.
    - test -d scripts/tooling/node_modules/handlebars
    - bash scripts/validate-repo-templates-all.sh
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - templates/archetypes/**/*
        - scripts/validate-repo-templates.sh
        - scripts/validate-repo-templates-all.sh
        - scripts/pull-repo-base.sh
        - scripts/tooling/**/*
        - .gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# THE GUARD OVER THE GUARDS (tests/scripts/test-guard-integrity.sh). Three
# distinct "this guard cannot fail" defects shipped on main and each was found by
# hand, after the fact:
#   * tests/node-storage/test-appset.sh ended on `echo "---EXIT $?---"` with no
#     `set -e`, so it printed its failure and exited 0 — node-storage-verify's
#     fourth leg could not fail;
#   * ~41 suites, including the ONLY test of the desktop-sudo mapper's JWKS
#     signature verification, were wired into nothing at all;
#   * a `for t in …; do bash "$t"; done` CI loop exits with the LAST suite's
#     status and forgives every earlier failure.
# This job makes all three mechanical and fail-closed. It carries its own
# negative controls (it re-runs its analyser against a synthesised repo with each
# defect planted and requires a RED, plus a positive control on a clean tree), so
# a green run here cannot be vacuous. Static, offline, python3 stdlib only.
lint:guard-integrity:
  stage: lint
  image: python:3-slim
  tags: [hugmesh-x86]
  script:
    - bash tests/scripts/test-guard-integrity.sh
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - changes:
        - tests/**/*
        - .gitlab-ci.yml
        - Makefile

# ESO PROVIDER REFERENCE gate (tests/scripts/test-eso-provider-refs.sh). Every
# VaultDynamicSecret generator named a `vault-ca` Secret and a `vault-token`
# Secret that NOTHING created on the kind path, so all 26 generator-backed
# ExternalSecrets sat in SecretSyncedError, no *-mtls Secret was ever created,
# and every pod mounting one hung in Init:0/1 — both gateways, every BFF, every
# DB TLS sidecar, harbor and coturn. Not one mTLS certificate had ever been
# issued in a kind cluster.
#
# lint:eso-seed-contract could not see it: that gate checks the KV remoteRefs
# against the seeder and never looks at a provider block. This one asserts the
# other half — that every Secret/ConfigMap a provider names (caProvider AND
# every auth *SecretRef) is created in the generator's OWN namespace, which is
# the only place ESO looks for it, by EACH delivery path independently. The
# per-path part is the point: the USB path DID create both Secrets, so a check
# that merely asked "does the repo create vault-ca anywhere" would have gone
# green on the outage.
#
# Coverage is per delivery path in three senses, because a first draft of this
# gate could be fooled in all three:
#   * REACHABILITY — a provisioner is credited only if it can actually run.
#     Wrapping the seeding block in `if false; then … fi` is bash -n clean and
#     left the draft green; so did the live instance of the same class, where
#     external-secrets/vault-token is created only inside a not-initialized
#     `else` branch. Deliberate conditionality is declared in the source with
#     `# eso-provider-refs: conditional-ok <reason>` and the reason is checked.
#     Modelling only KEYWORD control flow closed that INSTANCE and not the
#     CLASS: five bash -n-clean rewrites of the same block still read as
#     unconditional, including the two most idiomatic spellings of the
#     regression — `[ "${SEED:-0}" = "1" ] && { … }` and `[ … ] || continue` —
#     plus `false && { … }`, an early `return 0` in a function that IS called,
#     and a bare `exit 0` above the block. Short-circuit gating and early-out
#     statements are modelled too, deliberately narrowly: an operator gates only
#     its RIGHT-hand side, and a CONDITIONAL non-zero exit/return stays out
#     because `cmd || die …` is error handling and not a gate. Both sides are
#     controlled — five expect_red for the rewrites, three expect_green for the
#     error-handling shapes.
#   * EXEMPTION INVENTORY — the annotation's automated gate is shape only
#     (length + word count); it cannot know whether a reason is true. So the
#     EXACT set of annotated sites is pinned, keyed by (Secret, file), and
#     adding one fails the suite by name. Keyed by tuple alone it did not: a
#     second exemption for an already-exempted Secret, added to bury a
#     regression in the kind path, passed.
#   * YAML ATTRIBUTION — a manifest counts for a path only if that path applies
#     it (kubectl apply -f/-k, kustomization closure, ArgoCD source paths). The
#     draft credited every *.yaml under specs/ to every path, so a file nothing
#     applies satisfied all 58 references on the broken tree.
#   * PARSE FAILURES — a file PyYAML cannot read is counted and reported, and is
#     fatal when its text declares a generator. The draft returned [] and the
#     dangling references in it simply vanished.
# Carries a positive control, and negative controls for every defect class above
# plus the original six. Offline: no cluster, no kubectl, no vault, no network.
lint:eso-provider-refs:
  stage: lint
  image: python:3-slim
  tags: [hugmesh-x86]
  before_script:
    - pip install --quiet pyyaml
  script:
    - bash tests/scripts/test-eso-provider-refs.sh
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - changes:
        - specs/cluster/**/*
        - specs/etc/keys-provision/**/*
        - tests/scripts/test-eso-provider-refs.sh
        - tests/scripts/eso_provider_refs.py
        - .gitlab-ci.yml
