# Snapdragon CI — runs on the in-cluster GitLab Runner (privileged, x86_64 host).
# Builds every ISO + container image and DELIVERS the ISOs as release assets so
# the admin UI can link to the latest builds. NOTE: ISOs contain NO keys — the
# KEYS material is supplied from the USB stick at first boot, never baked in or
# published.
stages: [lint, iso, images, deliver, sca, dast]

variables:
  # Where delivered ISOs live; the admin BFF reads "latest" links from here.
  ISO_BASE: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/iso/latest"

# Route-federation consistency / reserved-prefix drift guard. Asserts the
# canonical reserved set (specs/cluster/reserved-prefixes.yaml) covers every
# dedicated gateway route prefix + reserved subdomain (apps/20-gateway-*.yaml +
# manifests/route-access/schema.sql) AND that the in-cluster ConfigMap mirror
# matches the source. A newly added route prefix that is not reserved FAILS here,
# catching the drift that would let a vanity username shadow a real route. Cheap,
# so it runs first on every branch (no privileged runner needed).
lint:reserved-prefixes:
  stage: lint
  image: python:3-slim
  tags: [snapdragon-x86]
  script:
    - bash scripts/validate-reserved-prefixes.sh

# Production-hygiene gate. Bakes a PROD copy of the GitOps tree (the same
# transforms gate_env_apps applies: prune 09-lan-dns + the test wave, pin :dev
# first-party tags) and asserts scripts/validate-prod-hygiene.sh PASSES on it, AND
# that it FAILS on an injected vault `-dev` + a test-only peer (so the gate itself
# is proven to bite). A floating :dev tag, a dev-only server, a test-only
# component, or an un-pruned test wave surviving a prod bake FAILS here. Cheap; no
# privileged runner needed.
lint:prod-hygiene:
  stage: lint
  image: python:3-slim
  tags: [snapdragon-x86]
  before_script:
    - pip install --quiet pyyaml
  script:
    # 0) The in-cluster copy (manifests/prod-hygiene/validate-prod-hygiene.sh,
    #    materialized into the prod-hygiene-script ConfigMap the PreSync hook Job
    #    mounts) MUST equal the canonical scripts/ copy byte-for-byte — kustomize
    #    forbids loading a file outside the bundle root, so the copy is the mirror.
    - diff -u scripts/validate-prod-hygiene.sh specs/cluster/manifests/prod-hygiene/validate-prod-hygiene.sh
    # Bake a prod tree.
    - RELEASE_TAG="${CI_COMMIT_SHORT_SHA:-$(date -u +%Y%m%d)}"
    - rm -rf /tmp/prodbake && mkdir -p /tmp/prodbake && cp -r specs/cluster /tmp/prodbake/cluster
    - rm -f /tmp/prodbake/cluster/apps/09-lan-dns.yaml /tmp/prodbake/cluster/apps/99-test-runner.yaml /tmp/prodbake/cluster/apps/00-app-of-apps-waved.yaml
    - rm -rf /tmp/prodbake/cluster/manifests/test-runner
    - >
      find /tmp/prodbake/cluster -type f \( -name '*.yaml' -o -name '*.yml' \) -print0 |
      while IFS= read -r -d '' f; do
        if grep -qE 'image:[[:space:]]*[^[:space:]:]*snapdragon[^[:space:]:]*:dev([[:space:]]|$)' "$f"; then
          sed -i -E "s|(image:[[:space:]]*[^[:space:]:]*snapdragon[^[:space:]:]*):dev|\\1:${RELEASE_TAG}|g" "$f";
        fi;
      done
    # 1) the baked prod tree must PASS.
    - ENV=prod bash scripts/validate-prod-hygiene.sh /tmp/prodbake/cluster
    # 2) the gate must FAIL on an injected vault -dev + a test-only peer.
    - mkdir -p /tmp/prodbake/cluster/manifests/inject
    - |
      cat > /tmp/prodbake/cluster/manifests/inject/bad.yaml <<'EOF'
      apiVersion: apps/v1
      kind: Deployment
      metadata: { name: vault-injected, namespace: snapdragon-pki }
      spec:
        selector: { matchLabels: { app: vault } }
        template:
          metadata: { labels: { app: vault } }
          spec:
            containers:
              - { name: vault, image: hashicorp/vault:1.15, args: ["server","-dev"] }
      EOF
    - if ENV=prod bash scripts/validate-prod-hygiene.sh /tmp/prodbake/cluster >/dev/null 2>&1; then echo "GATE DID NOT BITE on injected vault -dev"; exit 1; else echo "gate correctly failed on injected violation"; fi

# Build the three Pi role ISOs + the x86 host ISO. Needs root + crossdev + qemu
# on the runner host (the x86_64 node). Tag-select that runner.
build:isos:
  stage: iso
  tags: [snapdragon-x86, privileged]
  script:
    - ./scripts/build-all-roles.sh -j "$(nproc)"          # pki/backend/frontend (aarch64)
    - ./build-x86-host-stage4.sh -j "$(nproc)" -w x86-host-build
    - mkdir -p out && cp rpi5-stage4-build/*.iso x86-host-build/*.iso out/ 2>/dev/null || true
  artifacts:
    paths: [out/*.iso]
    expire_in: 30 days

build:images:
  stage: images
  tags: [snapdragon-x86]
  script:
    # App images (gateway, frontends, BFF, …) are built from their own repos
    # in the GitLab org mirror; this job builds what lives here and pushes to
    # the GitLab container registry.
    - echo "build + push container images to ${CI_REGISTRY_IMAGE}"

# NOTE: there is no longer a bundled `snapdragon-pentest-runner` image stage. The
# pen-test is DEV/CI-pipeline-only: the `sca` + `dast` stages below run the OWASP
# toolchain from PUBLIC images directly (owasp/dependency-check for SCA;
# ghcr.io/zaproxy/zaproxy:stable, pulled by the harness, for DAST), and the reusable
# per-repo stage template (tests/pentest/ci/pentest-stage.gitlab-ci.yml) does the
# same — so no in-cluster CronJob image needs to be built or published.

# Publish each ISO to the generic package registry under a stable "latest" path
# so the admin UI's download links never change.
deliver:isos:
  stage: deliver
  tags: [snapdragon-x86]
  needs: ["build:isos"]
  script:
    - |
      for f in out/*.iso; do
        n="$(basename "$f")"
        curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
             --upload-file "$f" "${ISO_BASE}/${n}"
        echo "delivered ${ISO_BASE}/${n}"
      done
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# =============================================================================
# sca — OWASP Dependency-Check SCA over the org's first-party repos.
#
# A parallel:matrix fans one job out per repo so a single noisy repo's CVEs don't
# mask the others, and so the HTML+SARIF artifacts are per-repo. Each job clones
# the target repo from the GitLab org mirror, runs Dependency-Check with
# --failOnCVSS 7 (a CVSS>=7 finding fails THAT repo's job), and persists the NVD
# feed in a CI cache keyed on the feed month so re-runs don't re-download ~250MB.
#
# snapdragon.games is DELIBERATELY EXCLUDED from this matrix: it is a DISTINCT
# stack with its OWN .gitlab-ci.yml that runs SCA in its own pipeline (incl. its
# Rust bridge) — see snapdragon-pentest-standard "TWO SEPARATE WORKFLOWS" + PR6.
# Likewise the static sites (usidiamond.github.io) + the generator-meta repos that
# carry no dependency manifest are out of scope here.
sca:dependency-check:
  stage: sca
  image:
    name: owasp/dependency-check:latest
    entrypoint: [""]
  tags: [snapdragon-x86]
  parallel:
    matrix:
      - REPO:
          - snapdragon-gateway
          - snapdragon-fe-gateway
          - snapdragon-be-gateway
          - snapdragon-pki-gateway
          - snapdragon-admin-bff-api
          - snapdragon-mod-bff-api
          - snapdragon-user-bff-api
          - snapdragon-forum-bff-api
          - snapdragon-federation-api
          - snapdragon-admin-ui
          - snapdragon-mod-ui
          - snapdragon-user-ui
          - snapdragon-login-ui
          - snapdragon-forum-ui
          - snapdragon-matrix-ui
          - snapdragon-mastodon-ui
          - snapdragon-remote-fragment
          - snapdragon-actions
          - snapdragon-api-docs
          - snapdragon-generator
        # NOTE: snapdragon.games is intentionally NOT in this list — it owns its
        # own pipeline + SCA stage (the games two-Casdoor stack, incl. the Rust
        # snapdragon-bridge). Adding it here would double-scan + cross workflows.
  cache:
    # Persist the NVD feed across runs. Keyed on the feed month so the monthly
    # full-feed refresh rotates the cache without an unbounded stale entry.
    key: "nvd-cache-$CI_COMMIT_REF_SLUG-$(date +%Y%m 2>/dev/null || echo feed)"
    paths: [.nvd-cache/]
  variables:
    GIT_STRATEGY: none   # we clone the *target* repo, not check this one out.
  before_script:
    - mkdir -p .nvd-cache reports/${REPO}
    # Clone the matrix repo from the same org mirror this pipeline lives in,
    # using the CI job token (read-only, no secret committed).
    - ORG_BASE="$(dirname "${CI_REPOSITORY_URL}")"
    - git clone --depth 1 "${ORG_BASE}/${REPO}.git" "src/${REPO}" || git clone --depth 1 "${ORG_BASE%/}/${REPO}.git" "src/${REPO}"
  script:
    - >
      /usr/share/dependency-check/bin/dependency-check.sh
      --project "snapdragon-${REPO}"
      --scan "src/${REPO}"
      --out "reports/${REPO}"
      --data ".nvd-cache"
      --failOnCVSS 7
      --enableExperimental
      --format HTML --format SARIF --format JSON
      ${NVD_API_KEY:+--nvdApiKey "$NVD_API_KEY"}
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - reports/${REPO}/dependency-check-report.html
      - reports/${REPO}/dependency-check-report.sarif
      - reports/${REPO}/dependency-check-report.json
    reports:
      # Surface findings in the MR security widget (GitLab reads SARIF here).
      sast: reports/${REPO}/dependency-check-report.sarif
  rules:
    # On every MR + the default branch (gate new High/Critical) and on schedule
    # (the nightly full feed refresh). NEVER on the games-only ref.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

# =============================================================================
# dast — authenticated OWASP ZAP DAST against a spun-up two-brand env-test-build,
# driven by the SHARED harness (tests/pentest/run-pentest.sh). The harness stands
# up the compose env-test-build, seeds the attacker + load personas across
# brandA/brandB (seed-personas.sh, creds from CI variables — NEVER git), scans as
# every persona, and merges ZAP+SCA+probe findings into the scorecard + SARIF.
#
#   dast:main-baseline  runs on every MR + the default branch — fast feedback:
#                       passiveScan + spider + the custom boundary probes.
#   dast:main-full      runs ONLY on a scheduled pipeline (the nightly cadence) —
#                       the above + the ENABLED activeScan.
#
# Needs Docker (the harness spins compose + runs the zaproxy image), so it lands
# on the privileged x86 runner, same tag convention as build:isos.
.dast-base:
  stage: dast
  tags: [snapdragon-x86, privileged]
  variables:
    # The harness reads creds for the throwaway TEST realm from CI variables at
    # runtime (masked/protected in GitLab) and never writes them to git. See
    # tests/pentest/seed-personas.sh + the test-seed-passwords contract.
    PENTEST_REPORTS: "${CI_PROJECT_DIR}/out/pentest"
  artifacts:
    when: always
    expire_in: 30 days
    paths: [out/pentest/]
  # The env-test-build stand-up is inherently flaky (two stacks + empty-Casdoor
  # first boot); a non-blocking retry on the runner-system/stuck classes only.
  retry:
    max: 1
    when: [runner_system_failure, stuck_or_timeout_failure]

dast:main-baseline:
  extends: .dast-base
  script:
    - bash tests/pentest/run-pentest.sh --env compose --scan baseline --pipeline main
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

dast:main-full:
  extends: .dast-base
  timeout: 3h   # active scan over every persona/brand is long.
  script:
    - bash tests/pentest/run-pentest.sh --env compose --scan full --pipeline main
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
