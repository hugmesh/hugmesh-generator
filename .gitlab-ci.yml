    # (infra_services / desktop_user / desktop_user_role) reached the wire against an
    # `additionalProperties: false` schema and stayed there: this job skipped it, and
    # the GitHub job (which does install jsonschema) had the node deselected.
    - pip install --quiet pytest PySide6 jsonschema
  script:
    # NB the deselect node id is ROOTDIR-relative: studio/pytest.ini makes rootdir
    # studio/, so ids are tests/…, NOT studio/tests/… — the studio-prefixed form
    # is silently ignored (proven: --co counts 8 with it, 7 with this one).
    - QT_QPA_PLATFORM=offscreen python -m pytest -q studio/tests -p no:cacheprovider
        --deselect tests/test_e2e_builds_start.py::test_mesh_node_worklist_starts_all_images

# Production-hygiene gate. Bakes a PROD copy of the GitOps tree (the same
# transforms gate_env_apps applies: prune 09-lan-dns + the test wave, pin :dev
# first-party tags) and asserts scripts/validate-prod-hygiene.sh PASSES on it, AND
# that it FAILS on an injected vault `-dev` + a test-only peer (so the gate itself
# is proven to bite). A floating :dev tag, a dev-only server, a test-only
# component, or an un-pruned test wave surviving a prod bake FAILS here. Cheap; no
# privileged runner needed.
lint:prod-hygiene:
  stage: lint
  image: python:3-slim
  tags: [hugmesh-x86]
  before_script:
    - pip install --quiet pyyaml
  script:
    # 0) The in-cluster copy (manifests/prod-hygiene/validate-prod-hygiene.sh,
    #    materialized into the prod-hygiene-script ConfigMap the PreSync hook Job
    #    mounts) MUST equal the canonical scripts/ copy byte-for-byte — kustomize
    #    forbids loading a file outside the bundle root, so the copy is the mirror.
    - diff -u scripts/validate-prod-hygiene.sh specs/cluster/manifests/prod-hygiene/validate-prod-hygiene.sh
    # Bake a prod tree.
    - RELEASE_TAG="${CI_COMMIT_SHORT_SHA:-$(date -u +%Y%m%d)}"
    - rm -rf /tmp/prodbake && mkdir -p /tmp/prodbake && cp -r specs/cluster /tmp/prodbake/cluster
    - rm -f /tmp/prodbake/cluster/apps/09-lan-dns.yaml /tmp/prodbake/cluster/apps/99-test-runner.yaml /tmp/prodbake/cluster/apps/00-app-of-apps-waved.yaml
    - rm -rf /tmp/prodbake/cluster/manifests/test-runner
    - >
      find /tmp/prodbake/cluster -type f \( -name '*.yaml' -o -name '*.yml' \) -print0 |
      while IFS= read -r -d '' f; do
        if grep -qE 'image:[[:space:]]*[^[:space:]:]*hugmesh[^[:space:]:]*:dev([[:space:]]|$)' "$f"; then
          sed -i -E "s|(image:[[:space:]]*[^[:space:]:]*hugmesh[^[:space:]:]*):dev|\\1:${RELEASE_TAG}|g" "$f";
        fi;
      done
    # 1) the baked prod tree must PASS.
    - ENV=prod bash scripts/validate-prod-hygiene.sh /tmp/prodbake/cluster
    # 2) the gate must FAIL on an injected vault -dev + a test-only peer.
    - mkdir -p /tmp/prodbake/cluster/manifests/inject
    - |
      cat > /tmp/prodbake/cluster/manifests/inject/bad.yaml <<'EOF'
      apiVersion: apps/v1
      kind: Deployment
      metadata: { name: vault-injected, namespace: hugmesh-pki }
      spec:
        selector: { matchLabels: { app: vault } }
        template:
          metadata: { labels: { app: vault } }
          spec:
            containers:
              - { name: vault, image: hashicorp/vault:1.15, args: ["server","-dev"] }
      EOF
    - if ENV=prod bash scripts/validate-prod-hygiene.sh /tmp/prodbake/cluster >/dev/null 2>&1; then echo "GATE DID NOT BITE on injected vault -dev"; exit 1; else echo "gate correctly failed on injected violation"; fi

# Nuclei template lint — validates every *.yaml in tests/pentest/nuclei/ against
# the fixture servers (no live platform, loopback only). Proves each template FIRES
# on the deliberately-vulnerable fixture at its expected path AND stays silent on
# the hardened fixture. Requires nuclei (pinned v3.9.0), node, and curl on the runner.
# COVERAGE gate: an unpaired template (no positive+negative case) fails the job
# with "GATE DID NOT BITE", so a new template that ships without fixtures is caught here.
lint:pentest-templates:
  stage: lint
  tags: [hugmesh-x86]
  variables:
    NUCLEI_VERSION: "3.9.0"
  before_script:
    - |
      # Download pinned nuclei if the runner doesn't already have it.
      NEED_INSTALL=true
      if command -v nuclei >/dev/null 2>&1; then
        INSTALLED="$(nuclei -version 2>&1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)"
        [ "${INSTALLED}" = "${NUCLEI_VERSION}" ] && NEED_INSTALL=false
      fi
      if [ "${NEED_INSTALL}" = "true" ]; then
        echo "[nuclei] installing v${NUCLEI_VERSION} to /usr/local/bin/"
        curl -sL \
          "https://github.com/projectdiscovery/nuclei/releases/download/v${NUCLEI_VERSION}/nuclei_${NUCLEI_VERSION}_linux_amd64.zip" \
          -o /tmp/nuclei.zip
        unzip -qo /tmp/nuclei.zip nuclei -d /usr/local/bin/
        chmod +x /usr/local/bin/nuclei
        rm -f /tmp/nuclei.zip
      fi
      nuclei -version
  script:
    - bash tests/pentest/nuclei/test-templates.sh
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# =============================================================================
# verify — the MANDATORY pre-flip gate for the casdoor JWT-Custom token shape.
#
# GEN2 set casdoor tokenFormat=JWT-Custom with an empirically-pinned allow-list
# that (a) closes the default-JWT secret leak — totpSecret / recoveryCodes /
# password / passwordSalt are excluded BY OMISSION — and (b) carries the MFA
# outcome claims (mfa_satisfied + mfa_satisfied_at) the BFF stamps into the user's
# Properties. A WRONG/EMPTY tokenFields set silently strips roles/permissions/
# isAdmin and breaks ALL authz across ~11 repos, OR re-opens the secret leak — and
# NO Java test catches it (it's Casdoor-config-level only). So this gate mints a
# REAL RS256 token against casbin/casdoor:3.80.0 and asserts the 4 secrets ABSENT
# + the authz claims present + the MFA claim shape, BEFORE the config can flip live.
#
# Spins the casdoor + postgres containers via the host docker socket (same idiom as
# build:isos / .dast-base — no `image:`, on the privileged x86 runner). The script
# SKIPs (exit 0) with a reason when no container runtime is present, so it never
# blocks a runner that lacks docker; a runtime-present runner MUST pass. To run
# this against a mirror, set CASDOOR_IMAGE / POSTGRES_IMAGE (e.g. a $CI_REGISTRY
# proxy) — no secret is committed.
casdoor-jwt-custom-gate:
  stage: verify
  tags: [hugmesh-x86, privileged]
  script:
    - bash tests/casdoor/test-jwt-custom-token.sh
  rules:
    # BLOCKING pre-flip gate: always run (and fail the pipeline) when the casdoor
    # config that this guards changes, OR the test/gate itself changes.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - specs/cluster/manifests/casdoor/**/*
        - tests/casdoor/test-jwt-custom-token.sh
        - .gitlab-ci.yml
    # And on the default branch so a merged casdoor change is re-validated before
    # it can ship (the live flip happens off main).
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# Domain-registry -> brand-repo bridge (#4) consumer test: the OFFLINE verify +
# emit matrix for the signed #118 cross-domain export (byte-exact canonical bytes;
# genuine ACCEPT; tampered/unsigned/foreign/rollback REJECT; defaults INERT). Needs
# only bash + jq + openssl + base64 (no docker, no cluster) so it runs on any runner;
# the test itself SKIPs (exit 0) if a tool is absent. Mirrors the node-storage /
# egress-vpn consumer suites (wired as the three jobs directly below) and the
# device-registry allow-deny consumer test (tests/device-registry/
# test-registry-allow-deny.sh — still CI-unwired; layer-a-headscale-acl wires only
# the Layer-A script from that directory).
domain-registry-reconcile-verify:
  stage: verify
  tags: [hugmesh-x86]
  script:
    - bash tests/domain-registry/test-domain-reconcile-verify.sh
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - specs/usr/sbin/hugmesh-domain-reconcile
        - specs/usr/lib/hugmesh/domain-verify.sh
        - tests/domain-registry/test-domain-reconcile-verify.sh
        - .gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# Egress-VPN node agents — the whole tests/egress-vpn/ suite, which was one of the
# "otherwise CI-unwired today" families named above. Wiring it is not cosmetic: the
# suite now carries the PACKET-MARKING guards (nothing set fwmark 0x76, so the
# tunnel came up carrying zero traffic), the fail-closed abort/rollback cases, the
# --egress-vpn ROLE gate, and the config-byte DELIVERY contract (the projector's
# hostPath must equal the reconcile agent's VPN_SECRET_DIR). A guard nothing runs
# is not a guard.
#
# Rootless + cluster-free by construction: every test stubs its tools (recording
# fake `ip` / `nft` / `kubectl`) and evaluates the REAL script bodies. It NEVER
# runs real nft/ip against the runner. Tool set PINNED via the same alpine:3 +
# apk recipe as egress-vpn-verify below (python3+py3-yaml so the projector suite
# cannot silently drop to its SKIP branch; git for the sibling clone).
#
# THE RULES BELOW WERE BROKEN AT MERGE and are corrected here. As shipped the job
# was triggered by neither `tests/egress-vpn/**` (the guards themselves — editing
# a guard could not run it), nor `.gitlab-ci.yml`, nor the default branch, so it
# never ran on main despite its own commit message. It now mirrors
# domain-registry-reconcile-verify / node-storage-verify exactly: MR + a guarded
# path, OR the default branch.
#
# THE SIBLING CLONE IS PART OF THE GATE, NOT A CONVENIENCE — same reasoning as
# lint:reserved-prefixes. tests/egress-vpn/test-secret-contract.sh compares this
# repo's projector/deploy manifests against the admin-bff WRITER source, because
# the two halves merged green while disagreeing about the Secret namespace AND
# the data key. Without the checkout that test exits 3 (INCOMPLETE) and fails the
# job rather than printing a green half-comparison. A clone failure fails the
# job, on purpose.
egress-vpn-node-agents:
  stage: verify
  image: alpine:3
  tags: [hugmesh-x86]
  variables:
    # Where test-secret-contract.sh looks for the writer half.
    EGRESS_VPN_ADMIN_BFF_ROOT: "${CI_PROJECT_DIR}/.egress-vpn-siblings/hugmesh-admin-bff-api"
  before_script:
    - apk add --no-cache bash git jq openssl python3 py3-yaml coreutils grep sed gawk findutils diffutils
    - ORG_BASE="$(dirname "${CI_REPOSITORY_URL}")"
    - mkdir -p "$(dirname "${EGRESS_VPN_ADMIN_BFF_ROOT}")"
    - git clone --depth 1 "${ORG_BASE}/hugmesh-admin-bff-api.git" "${EGRESS_VPN_ADMIN_BFF_ROOT}"
  script:
    - |
      rc=0
      for t in tests/egress-vpn/*.sh; do
        echo "── ${t}"
        bash "${t}" || rc=1
      done
      exit "${rc}"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - specs/usr/sbin/hugmesh-vpn-*
        - specs/usr/lib/hugmesh/vpn-verify.sh
        - specs/etc/keys-provision/provision.sh
        - specs/cluster/manifests/egress-vpn/**/*
        - specs/cluster/manifests/admin-bff-api/deployment.yaml
        - specs/cluster/egress-vpn-secret-contract.env
        - specs/cluster/apps/13e-egress-vpn.yaml
        # The registry carries a COPY of the contract (secretNamespace/
        # secretLabel/secretKey under the egress-vpn slug) and shipped `config`
        # for the data key; test-secret-contract.sh asserts it, so an MR that
        # touches only this file must run this job. It was listed on
        # egress-vpn-verify (the node-gate suite) but not here.
        - specs/cluster/optional-services.yaml
        # The doc carries the contract TABLE, which the same gate asserts.
        - docs/EGRESS-VPN.md
        - tests/egress-vpn/**/*
        - .gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
# Node-storage consumer suite (node-storage PR5-PR8), until now CI-orphaned: the
# signed-export verify matrix for storage-verify.sh (genuine ACCEPT; unsigned /
# tampered / foreign-key / rollback REJECT — same fail-closed gate class as the
# domain-registry job above, throwaway Ed25519 key, no live BFF), the reconcile
# agent's nodePathMap CAS-patch + pool-manifest jq programs (PV-binds-to-correct-
# node), the graceful-degrade detection (unmounted pool => DEGRADED ack, node
# stays up) + PDB/migration-Job safe posture, the provision_storage pool
# invariants (`,nofail` on pool disks ONLY; --pool never touches system disks),
# and the INERT-by-default 13b ApplicationSet (modelled on 13a; selector lever
# replayed in python). Unlike the job above these suites hard-fail (exit 2) on a
# missing tool instead of skipping, so the image + tool set is pinned (alpine:3
# apk, same recipe as layer-a-headscale-acl below; python3+py3-yaml for the
# ApplicationSet leg). No disks, no root, no cluster, no docker.
node-storage-verify:
  stage: verify
  image: alpine:3
  tags: [hugmesh-x86]
  before_script:
    - apk add --no-cache bash jq openssl python3 py3-yaml coreutils grep sed gawk
  script:
    - bash tests/node-storage/test-node-agent.sh
    - bash tests/node-storage/test-degrade.sh
    - bash tests/node-storage/test-provision-pool.sh
    - bash tests/node-storage/test-appset.sh
    # test-bake-coverage.sh shipped with #525 and was wired into NOTHING — not this
    # job, not the Makefile, not any runner. The one regression it was written to make
    # impossible was unguarded for its whole life. It now RUNS the bake helper and the
    # real provision.sh against a sandbox sysroot, so it needs the builders + scripts/
    # in `changes:` below as well. test-pool-entrypoint.sh does the same for
    # `keys-provision --pool` — the command the reconcile agent issues every 60s.
    - bash tests/node-storage/test-bake-coverage.sh
    - bash tests/node-storage/test-pool-entrypoint.sh
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - specs/usr/sbin/hugmesh-node-storage-reconcile
        - specs/usr/lib/hugmesh/storage-verify.sh
        - specs/etc/keys-provision/provision.sh
        - specs/etc/init.d/hugmesh-node-storage-reconcile
        - specs/etc/cron.d/hugmesh-node-storage-reconcile
        - specs/cluster/apps/13b-node-storage.yaml
        - specs/cluster/apps/13a-optional-services.yaml
        - specs/cluster/manifests/node-storage-placement/**/*
        - scripts/_node-storage-bake-lib.sh
        - build-*-stage4.sh
        - tests/node-storage/**/*
        - .gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# Egress-VPN consumer suite (egress-vpn PR1/PR2/PR5/PR6), until now CI-orphaned:
# vpn-verify.sh's signed-export gate (canonical v1-vpn bytes asserted against a
# reference string; ACCEPT/tamper/unsigned/foreign/rollback matrix, same class as
# the two jobs above), provision_vpn's OWN-DOMAIN-ONLY key-USB routing (a config
# staged under another tenant's domain is NEVER installed; 0600 root-owned;
# .conf-over-.ovpn precedence; fail-closed no-op without a domain), the
# split-tunnel routing invariants in hugmesh-vpn-runner (carve-out priorities
# beat the fwmark catch-all; blackhole kill-switch v4+v6; down flushes — all via
# a recording fake `ip`, the real-netns smoke self-skips without root), and the
# builder's DEFAULT-OFF optional-service gate (not selected => NetworkPolicy +
# packages pruned; selected => kept + runlevel link). Tool set pinned for the
# same reason as node-storage-verify (hard exit-2 tool checks; python3+py3-yaml
# for the registry leg, findutils for the runner scan). No root, no netns, no
# cluster, no docker.
egress-vpn-verify:
  stage: verify
  image: alpine:3
  tags: [hugmesh-x86]
  before_script:
    - apk add --no-cache bash jq openssl python3 py3-yaml coreutils grep sed gawk findutils diffutils
  script:
    - bash tests/egress-vpn/test-vpn-reconcile-verify.sh
    - bash tests/egress-vpn/test-provision-vpn.sh
    - bash tests/egress-vpn/test-split-tunnel.sh
    - bash tests/egress-vpn/test-optional-service-gate.sh
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - specs/usr/sbin/hugmesh-vpn-runner
        - specs/usr/lib/hugmesh/vpn-verify.sh
        - specs/etc/keys-provision/provision.sh
