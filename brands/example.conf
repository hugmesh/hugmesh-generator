# brands/example.conf — committed EXAMPLE brand profile (no secrets here).
#
# A brand profile is a plain shell file the image builders `source` (via
# --config FILE / -C FILE, or auto-detected ./brand.conf). It rebrands every
# namespace, hostname, gateway, image org, ingress host and title in the baked
# cluster payload, and selects the brand's OWN isolated mesh.
#
# Order of precedence:  built-in defaults  <  this file  <  explicit CLI flags.
#
# Usage:
#   ./build-x86-host-stage4.sh --config brands/example.conf --role be+gpu
#   make build-all BRAND=example DOMAIN=example.test
#
# Each brand = a separate, isolated mesh: its own CLUSTER_DOMAIN, its own
# HEADSCALE_URL control server, and its own MESH_TAG. Copy this file to
# brands/<yourbrand>.conf and edit. NEVER put real secrets (passwords, tokens,
# VAULT_TOKEN) in a committed brand profile — those belong in the gitignored
# ./brand.conf or the environment.

# ── Branding ────────────────────────────────────────────────────────
BRAND="example"                     # short slug used in names (namespaces, gateways, hosts)
BRAND_TITLE="Example Corp"          # human-readable title shown in UIs/messages
ORG="Example-Inc"                   # GitHub org / container-image namespace
CLUSTER_DOMAIN="example.test"       # base domain (id./matrix./mastodon./api. derived)

# ── Per-brand mesh (the brand's OWN isolated headscale control plane) ─
# These are honored by the mesh setup at provision time. Each brand points at
# its own headscale control server and tags its nodes with a brand-unique tag,
# so brands never share a tailnet.
HEADSCALE_URL="https://headscale.example.test"   # the brand's own headscale control server
MESH_TAG="tag:example"                            # brand-unique ACL tag (e.g. tag:<brand>)

# ── Default accounts (fallback when no USB KEYS stick is present) ────
# Real values belong in the gitignored ./brand.conf, NOT in a committed brand.
DEFAULT_USER="pi"                   # fallback non-root user
DEFAULT_USER_PASS="raspberry"       # CHANGE for real builds (keep real value out of git)
ROOT_PASS="gentoo"                  # CHANGE for real builds (keep real value out of git)
ADMIN_EMAILS="admin@example.test"   # seeded Casdoor admin (BFF allowlist)

# ── System ──────────────────────────────────────────────────────────
TIMEZONE="UTC"
# HOSTNAME=""                       # leave empty to derive as <BRAND>-<role>

# ── Versions ────────────────────────────────────────────────────────
HEADSCALE_VERSION="0.23.0"
TAILSCALE_VERSION="1.78.1"

# ── Vault (cluster secrets) ─────────────────────────────────────────
# An EMPTY VAULT_ADDR = offline / USB-only secret delivery. Set VAULT_ADDR here
# if you like, but keep VAULT_TOKEN in the ENVIRONMENT (never committed).
VAULT_ADDR=""                       # e.g. https://vault.example.test (empty = offline/USB-only)
VAULT_KV_MOUNT="secret"             # KV v2 mount the ClusterSecretStore reads

# ── External CA (optional — use an EXISTING CA as the cert issuer) ──
# Point these at an existing CA cert + key to sign every generated leaf/service
# cert with it (the certs chain to that CA; it is bundled into the truststore
# and never overwritten). Unset = the default fresh self-signed root.
#   CA_CERT path may live in a committed profile; CA_KEY / CA_KEY_PASS are
#   SECRETS — keep them in the gitignored ./brand.conf or the environment.
# CA_CERT=""                        # path to the CA certificate (PEM)
# CA_KEY=""                         # (SECRET — do NOT commit) CA private key path (PEM)
# CA_KEY_PASS=""                    # (SECRET — do NOT commit) passphrase, if the key is encrypted
