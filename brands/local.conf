# brands/local.conf — the LOCAL .test profile (LAN-first, NO public internet).
#
# This is the brand `make local` (ENV=test) uses by default. It keeps the
# hugmesh naming but swaps the domain to the RFC-6761 `.test` TLD
# (hugmesh.test) so NOTHING ever needs a real public domain, Cloudflare,
# OAuth, or SMTP to come up. The whole fleet is testable on a LAN:
#
#   * domain        hugmesh.test   (id./api./matrix./mastodon./scale. derived)
#   * DNS           cluster-served wildcard (apps/09-lan-dns.yaml answers
#                   *.hugmesh.test -> the backend ingress node IP). Point your
#                   router/clients at that node:53 once; see docs/LOCAL-TESTING.md.
#   * mail          none (no SMTP)
#   * OAuth         off (Casdoor NATIVE admin login only — no Google/GitHub)
#   * Cloudflare    off (the go-live cloudflared app is pruned from test images)
#   * certs         internal cluster-CA only (Vault-PKI / self-signed root) — the
#                   SAME offline issuer prod uses; prod merely ADDS ACME on top.
#
# Because CLUSTER_DOMAIN differs from the default hugmesh.systems, the builder's
# rebrand_sysroot() runs and rewrites the baked cluster tree to hugmesh.test.
#
# Usage:
#   make local                                   # ENV=test BRAND=local (this file)
#   ./build-x86-host-stage4.sh --env test --config brands/local.conf --role be+gpu
#
# Order of precedence:  built-in defaults  <  this file  <  explicit CLI flags.

# ── Branding (keep the hugmesh slug; only the domain changes) ─────
BRAND="hugmesh"                  # short slug used in names (namespaces, gateways, hosts)
BRAND_TITLE="HugMesh Systems"    # human-readable title shown in UIs/messages
ORG="hugmesh-net"            # GitHub org / container-image namespace
CLUSTER_DOMAIN="hugmesh.test"    # .test base domain (LAN-only; never routable on the internet)
RELEASE_STATE="internal"            # internal (DEFAULT; matches the .test domain) | public

# ── Mail (none in local/test) ───────────────────────────────────────
# No SMTP in the local profile: nothing sends mail. Documented here so a brand
# author sees the knob; the cluster treats an absent provider as "no mail".
MAIL_PROVIDER="none"                # none | smtp (prod brands set this from the keys USB)

# ── OAuth / external federation (OFF in local/test) ─────────────────
# Casdoor's NATIVE admin login is enough to drive the whole e2e on a LAN. No
# Google/GitHub OAuth, no public callback URLs. Empty = the provider seeding in
# casdoor-init is skipped (it already no-ops when the client secret is absent).
OAUTH_ENABLED="false"

# ── Per-brand mesh — LOCAL-FIRST (no external control server) ───────
# Empty HEADSCALE_URL = local-first: the pki/control node defaults the mesh
# server_url to its own LAN IP (resolve_endpoint). No public headscale needed.
HEADSCALE_URL=""                    # local-first: control node uses its own LAN IP
MESH_TAG="tag:hugmesh"           # ACL tag for the local fleet

# ── Default accounts (fallback when no USB KEYS stick is present) ────
DEFAULT_USER="snap"
DEFAULT_USER_PASS="hugmesh"      # CHANGE for anything beyond throwaway LAN tests
ROOT_PASS="hugmesh"              # CHANGE for anything beyond throwaway LAN tests
ADMIN_EMAILS="admin@hugmesh.test"  # seeded Casdoor admin (BFF allowlist)

# ── System ──────────────────────────────────────────────────────────
TIMEZONE="UTC"
# HOSTNAME=""                       # leave empty to derive as <BRAND>-<role>

# ── Versions ────────────────────────────────────────────────────────
HEADSCALE_VERSION="0.23.0"
TAILSCALE_VERSION="1.78.1"

# ── Vault (offline / USB-only in local) ─────────────────────────────
# EMPTY VAULT_ADDR = offline / USB-only secret delivery (no external Vault).
VAULT_ADDR=""
VAULT_KV_MOUNT="secret"

# ── Cloudflare / external DNS (OFF in local/test) ───────────────────
# The go-live cloudflared / external-dns / ACME scaffold is PRUNED from test
# images at build time (the ENV=test app-gate removes apps/12-cloudflared.yaml).
# These knobs are honored only by prod brands that source creds from the keys USB.
CLOUDFLARE_ENABLED="false"
# CLOUDFLARE_TUNNEL_TOKEN=""        # (SECRET — prod only, from the keys USB; never commit)
