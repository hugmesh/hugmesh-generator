# brands/domains.conf — MULTI-DOMAIN registry for the per-domain CA loop.
#
# This file is the BUILD-TIME source of truth for which domains/brands get a CA
# + mTLS keystores baked in by scripts/gen-keystores.sh (multi-tenancy PR4).
#
# DEFAULT BEHAVIOUR (this committed file): there are NO active rows below, so the
# generator provisions exactly ONE domain — the single ${BRAND}/${CLUSTER_DOMAIN}
# from brand.conf / brands/<BRAND>.conf / the environment (default
# hugmesh/hugmesh.systems). That single-domain run is BYTE-/functionally-
# IDENTICAL to the pre-multi-tenancy output: the loop with N=1 is a no-op. Leave
# every row commented to keep a stock single-brand build unchanged.
#
# To bake in MULTIPLE brands from the start, uncomment / add one row per domain.
# Each non-blank, non-`#` line is whitespace-separated:
#
#     DOMAIN [BRAND] [CA_CERT] [CA_KEY]
#
#   DOMAIN   (required) the brand's base domain (CLUSTER_DOMAIN).
#   BRAND    (optional) short slug used in names; defaults to DOMAIN's first
#            DNS label (e.g. acme.test -> acme).
#   CA_CERT  (optional) absolute path to an EXISTING CA certificate (PEM) to
#            IMPORT as THIS domain's issuer instead of GENERATING an independent
#            root (the multi-tenancy "bring-your-own CA" / drop-in path; reuses
#            the same --ca-cert/--ca-key seam, now per-domain).
#   CA_KEY   (optional, REQUIRED whenever CA_CERT is given) absolute path to the
#            imported CA's private key (PEM).
#
# Per-domain CA model = INDEPENDENT ROOT BY DEFAULT (each generated domain gets
# its own self-signed root). Each domain receives a NARROW truststore (its own
# root ONLY). One WIDE multi-anchor truststore (every domain's root) is built for
# the ARCHITECTURE TIER ONLY (Vault / federation / superadmin) under
# keystores/architecture/, because that tier validates cross-domain mTLS;
# per-brand gateway/BFF/UI instances keep their narrow own-domain truststore.
#
# *** SECURITY: NEVER commit CA private keys (or any secret) to git. ***
# A CA_KEY path here MUST point at an off-git location (the key-USB / a secret
# dir on the build host), NOT a path inside this repo. Only public CA certs and
# generated public truststores are repo-safe; private keys stay on the key-USB.
#
# ── EXAMPLES (commented — uncomment to activate a multi-domain build) ──
# Generate two independent-root domains (brand inferred from the domain label):
#   acme.test
#   beta.test
#
# Two brands with explicit slugs:
#   acme.test          acme
#   beta.example.org   beta
#
# Import (drop in) an externally-obtained CA for one domain, generate for another:
#   acme.test   acme   /run/media/keys/acme/ca.crt   /run/media/keys/acme/ca.key
#   beta.test   beta
#
# (no active rows => single-domain default => byte-identical output)
