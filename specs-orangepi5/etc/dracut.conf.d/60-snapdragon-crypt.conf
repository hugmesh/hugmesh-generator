# Snapdragon: persist LUKS-root unlock support in EVERY future initramfs.
# The builder already passes --add crypt on its dracut command lines, but a later
# in-image kernel rebuild (e.g. `emerge @module-rebuild` + dracut, or a kernel bump
# on the installed system) must also keep the crypt module so a LUKS2-encrypted root
# still unlocks. With no /etc/crypttab present (a plaintext-root image) it is inert —
# it only acts when the installer has laid down an encrypted root + crypttab + the
# rd.luks cmdline. NOTE: the dracut MODULE is "crypt" (it pulls in device-mapper);
# there is NO "dm-crypt" module — adding it makes EVERY dracut run in the sysroot
# FAIL ("Module 'dm-crypt' cannot be found"), which silently kills the live ISO and
# the disk initramfs. dm_crypt is a KERNEL DRIVER (add_drivers) — correct + separate.
# Mirrors specs-x86/etc/dracut.conf.d/60-snapdragon-crypt.conf and
# specs-frite/etc/dracut.conf.d/60-snapdragon-crypt.conf.
add_dracutmodules+=" crypt "
add_drivers+=" dm_crypt "
