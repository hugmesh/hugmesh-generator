# Snapdragon AIDE — file-integrity IDS (opt-in: --with-aide). The DB is initialized at
# FIRST BOOT against the real installed system (not the build sysroot), then a daily cron
# runs `aide --check` and reports drift. Tuned to watch system binaries + config and to
# skip volatile trees so it is low-noise.
database_in=file:/var/lib/aide/aide.db
database_out=file:/var/lib/aide/aide.db.new
database_new=file:/var/lib/aide/aide.db.new
gzip_dbout=yes
report_url=stdout

# ── rule groups ──
Binlib   = p+i+n+u+g+s+b+m+c+sha256
ConfFiles = p+i+n+u+g+s+b+m+c+sha256
Logs     = p+i+n+u+g
Dirs     = p+i+n+u+g

# ── what to watch ──
/boot       Binlib
/bin        Binlib
/sbin       Binlib
/lib        Binlib
/lib64      Binlib
/usr/bin    Binlib
/usr/sbin   Binlib
/usr/lib    Binlib
/usr/lib64  Binlib
/etc        ConfFiles
/usr/libexec Binlib

# ── volatile / self -> exclude to keep it low-noise ──
!/var/log
!/var/lib/aide
!/var/cache
!/var/tmp
!/var/run
!/etc/mtab
!/etc/adjtime
!/etc/.updated
!/etc/ld.so.cache
!/home
!/root/.bash_history
!/proc
!/sys
!/run
!/tmp
!/media
!/mnt
