# Snapdragon: minimal Squid caching forward proxy, bound to localhost only.
# It sits BEHIND Privoxy (Firefox -> Privoxy:8118 -> Squid:3128 -> internet), giving
# the desktop a local HTTP cache. Localhost-only so it is never an open proxy.
http_port 127.0.0.1:3128

acl localnet src 127.0.0.1/32
acl localnet src ::1
acl SSL_ports port 443
acl Safe_ports port 80 21 443 70 210 1025-65535 280 488 591 777
acl CONNECT method CONNECT

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow localhost manager
http_access deny manager
http_access allow localnet
http_access allow localhost
http_access deny all

cache_dir ufs /var/cache/squid 256 16 256
coredump_dir /var/cache/squid
cache_mem 64 MB

refresh_pattern ^ftp:           1440    20%     10080
refresh_pattern ^gopher:        1440    0%      1440
refresh_pattern -i (/cgi-bin/|\?) 0     0%      0
refresh_pattern .               0       20%     4320
