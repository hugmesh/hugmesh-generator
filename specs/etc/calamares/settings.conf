# Calamares (graphical Qt installer) — HugMesh scaffold.
#
# Boot the live ISO's "Install … (graphical installer)" entry and the live session
# autostarts Calamares. This config keeps Calamares as the friendly GUI front
# (welcome + user account + summary) and delegates the actual disk write to our
# tested install-x86.sh (LUKS2 + stage4 extract + manifest-driven home provisioning)
# via the shellprocess module. That reuses one code path for the CLI, ncurses, and
# graphical installers.
#
# SCAFFOLD: the welcome/users pages work out of the box. The 'hugmesh'
# branding component named below ships in NO package — build-x86-host-stage4.sh
# GENERATES it at image-assembly time (WANT_CALAMARES block: branding.desc +
# logo + slideshow from the build identity) for branded images, and rewrites
# the reference to the stock 'default' component for unaffiliated ones. Wiring
# the Calamares partition page's chosen target through to install-x86 (instead
# of install-x86's own whiptail disk picker) is the one piece to finish on a boot test.
modules-search: [ local, /usr/lib/calamares/modules, /usr/lib64/calamares/modules ]

sequence:
  - show:
      - welcome
      - users
      - summary
  - exec:
      - shellprocess-install
  - show:
      - finished

branding: hugmesh
prompt-install: true
dont-chroot: true
oem-setup: false
disable-cancel: false
