# Calamares shellprocess module — runs the Snapdragon installer (install-x86.sh)
# after the GUI collects the user account. Delegates LUKS + stage4 extract + the
# manifest-driven home provisioning to the one tested code path.
---
dontChroot: true
timeout: 7200
script:
  - command: "/usr/libexec/snapdragon-calamares-install"
    timeout: 7200
