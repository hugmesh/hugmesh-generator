# Masks /usr/lib/tmpfiles.d/portage-tmpdir.conf (same name in /etc wins) on the
# shipped image. That file asks systemd-tmpfiles to create /var/tmp/portage and
# /tmp/portage at every boot. A node never runs portage from a tmpfiles-made
# directory: when it does merge anything, portage_t creates its own tmpdir with its
# own transition. Under SELinux enforcing the create was denied
# (systemd_tmpfiles_t { create } portage_tmp_t dir, measured 2026-11-04) and the
# denial made systemd-tmpfiles-setup exit non-zero at every boot. An empty file is
# the documented mask; nothing else in that unit is lost.
