# Headscale control-server configuration (default / fallback).
#
# This is the baseline config baked into the image. Override it at first
# boot by placing your own headscale/config.yaml on the USB KEYS partition
# (see keys-template/headscale/config.yaml).
#
# Tested against headscale 0.23.x. Newer/older releases occasionally rename
# keys — check the upstream example-config if headscale refuses to start.

# The externally reachable URL of this control server.
#
# LOCAL-FIRST: this loopback value is ONLY an ultimate fallback. At first boot
# keys-provision (provision_headscale -> resolve_endpoint) rewrites this single
# line in place to the resolved endpoint BEFORE starting headscale, with
# precedence:
#   1. provision.json .headscale.server_url
#   2. provision.json .mesh.endpoint
#   3. the baked brand var HEADSCALE_URL (/etc/hugmesh/headscale-url)
#   4. DEFAULT: https://<this node's primary LAN IPv4>:8080
# So a node provisioned before any public DNS exists is reachable by LAN peers,
# and a public domain can be published later without re-imaging.
# HTTPS by default because the embedded DERP relay below rides this listener and
# tailscale clients only speak TLS to DERP (docs/HEADSCALE-DERP.md). keys-provision
# (provision_headscale_tls) then issues headscale's serving certificate from the
# mesh CA on the KEYS stick and fills in tls_cert_path/tls_key_path below; an
# explicit http:// URL, or an https:// URL on another port (a TLS front), leaves
# them empty and headscale serves plain HTTP.
server_url: http://127.0.0.1:8080

listen_addr: 0.0.0.0:8080
# Managed by keys-provision (provision_headscale_tls); empty = plain HTTP.
tls_cert_path: ""
tls_key_path: ""
metrics_listen_addr: 127.0.0.1:9090
grpc_listen_addr: 127.0.0.1:50443
grpc_allow_insecure: false

noise:
  private_key_path: /var/lib/headscale/noise_private.key

# ACL policy — fleet full-mesh, file mode.
#
# Loads the shipped /etc/headscale/policy.hujson: a default-deny policy that
# opens fleet-internal traffic (tag:hugmesh <-> tag:hugmesh, all ports)
# plus the cluster pod (10.244.0.0/16) and service (10.96.0.0/12) CIDRs, and
# auto-approves those advertised subnet routes. Nodes self-apply tag:hugmesh
# (+ a per-role tag) and advertise the two CIDRs at `tailscale up`; every node
# runs --accept-routes, so pods/ClusterIPs become reachable cross-node "as one
# LAN". keys-provision also runs `headscale policy set -f` on this file so the
# DB/file stay in sync. No internet-wide grant; fleet-scoped by design.
# keys-provision starts headscale only when headscale's own reading of its config
# is exactly this mode and path (the file it checks); anything else is refused.
policy:
  mode: file
  path: /etc/headscale/policy.hujson

# Tailnet address ranges handed out to nodes.
prefixes:
  v4: 100.64.0.0/10
  v6: fd7a:115c:a1e0::/48
  allocation: sequential

# DERP relay — OFFLINE-FIRST (operator decision 2026-11-10, "Built-in relay on").
# headscale's EMBEDDED DERP server is on and the public Tailscale DERP map is OFF,
# so the mesh starts and relays with no internet, and headscale fetches nothing
# from Tailscale's servers. (With only the public map and no internet, headscale
# 0.23 exits "initial DERPMap is empty".) docs/HEADSCALE-DERP.md explains the whole model.
#   * DERP itself rides headscale's own listener: clients dial /derp on the
#     server_url host:port, so it needs NO new TCP port, but it does need TLS
#     there (clients speak TLS to DERP; see tls_cert_path above). STUN is UDP 3478.
#   * region_id 999 sits in the 900-999 block Tailscale leaves for private
#     regions, so it never collides with a public region if the opt-in below
#     adds the public map. keys-provision (provision_headscale_derp) rewrites
#     region_code/region_name from the brand's cluster domain at first boot, and
#     owns this whole block: it is re-rendered from the provisioning inputs on
#     every run (an older KEYS block is migrated; <config>.derp.bak keeps it).
#   * ipv4/ipv6 are left unset on purpose: clients resolve the server_url host,
#     which is the LAN IP by default and the published facade once there is one.
#   * The DERP server key is generated on first start under headscale's state
#     dir, next to the noise key, and survives reboots.
# OPT-IN public map (meshes that WANT Tailscale's relays as well): builder flag
# --headscale-public-derp, brand/env HEADSCALE_PUBLIC_DERP=true, or KEYS
# provision.json .headscale.public_derp=true. keys-provision then lists the
# public map in `urls:` below and turns auto-update on (and takes both back out
# when the opt-in is off again); the
# embedded region stays in the map either way.
derp:
  server:
    enabled: true
    region_id: 999
    region_code: "hugmesh"
    region_name: "hugmesh embedded relay"
    stun_listen_addr: "0.0.0.0:3478"
    private_key_path: /var/lib/headscale/derp_server_private.key
    automatically_add_embedded_derp_region: true
  urls: []
  paths: []
  auto_update_enabled: false
  update_frequency: 24h

disable_check_updates: true
ephemeral_node_inactivity_timeout: 30m

database:
  type: sqlite
  sqlite:
    path: /var/lib/headscale/db.sqlite

log:
  level: info
  format: text

dns:
  magic_dns: true
  base_domain: headnet.internal
  nameservers:
    global:
      - 1.1.1.1
      - 9.9.9.9

unix_socket: /run/headscale/headscale.sock
unix_socket_permission: "0770"
