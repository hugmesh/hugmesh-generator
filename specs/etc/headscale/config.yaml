# Headscale control-server configuration (default / fallback).
#
# This is the baseline config baked into the image. Override it at first
# boot by placing your own headscale/config.yaml on the USB KEYS partition
# (see keys-template/headscale/config.yaml).
#
# Tested against headscale 0.23.x. Newer/older releases occasionally rename
# keys — check the upstream example-config if headscale refuses to start.

# The externally reachable URL of this control server. CHANGE THIS to the
# DNS name or IP the Pi is reachable at, e.g. https://headscale.example.com
server_url: http://127.0.0.1:8080

listen_addr: 0.0.0.0:8080
metrics_listen_addr: 127.0.0.1:9090
grpc_listen_addr: 127.0.0.1:50443
grpc_allow_insecure: false

noise:
  private_key_path: /var/lib/headscale/noise_private.key

# Tailnet address ranges handed out to nodes.
prefixes:
  v4: 100.64.0.0/10
  v6: fd7a:115c:a1e0::/48
  allocation: sequential

derp:
  server:
    enabled: false
  urls:
    - https://controlplane.tailscale.com/derpmap/default
  auto_update_enabled: true
  update_frequency: 24h

disable_check_updates: true
ephemeral_node_inactivity_timeout: 30m

database:
  type: sqlite
  sqlite:
    path: /var/lib/headscale/db.sqlite

log:
  level: info
  format: text

dns:
  magic_dns: true
  base_domain: headnet.internal
  nameservers:
    global:
      - 1.1.1.1
      - 9.9.9.9

unix_socket: /run/headscale/headscale.sock
unix_socket_permission: "0770"
