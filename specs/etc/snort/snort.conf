# HugMesh: minimal Snort 2.9 IDS config that STARTS without the full Talos ruleset.
# Default-on on every image (disable with --no-snort). Runs in alert mode on HOME_NET;
# drop Talos/community rules into /etc/snort/rules and add `include` lines to extend it.
ipvar HOME_NET any
ipvar EXTERNAL_NET any
var RULE_PATH /etc/snort/rules

# classification.config + reference.config are shipped by net-analyzer/snort.
include classification.config
include reference.config

config logdir: /var/log/snort
config checksum_mode: none

# Packet acquisition. net-analyzer/snort is built --disable-static-daq, so the DAQ
# modules are loaded at runtime from net-libs/daq (the builder adds it to the
# payload explicitly: the ebuild lists daq in BDEPEND only, so a binpkg install
# never pulls it and snort died on a missing libdaq.so.2). pcap, not the stock
# .distrib's afpacket: /etc/conf.d/snort may resolve to the libpcap "any"
# pseudo-device when a node has no uplink yet, and afpacket cannot open "any".
config daq: pcap
config daq_dir: /usr/lib64/daq
config daq_mode: passive

# Minimal stream/frag preprocessors so stateful rules work; kept light for edge nodes.
preprocessor frag3_global: max_frags 65536
preprocessor frag3_engine: policy linux
preprocessor stream5_global: track_tcp yes, track_udp yes
preprocessor stream5_tcp: policy linux
preprocessor stream5_udp

# Fast single-line alerts to /var/log/snort/alert.
output alert_fast: alert

# Local rules (a benign sample ships in local.rules; replace with a real ruleset).
include $RULE_PATH/local.rules
