# /etc/hugmesh/thin-desktop/sunshine.conf — MANAGED Sunshine config for the
# thin-desktop stream host (baked by build-x86-host-stage4.sh --with-sunshine;
# launched in-session by hugmesh-sunshine-session). Sunshine has no native
# bind-to-interface option — NETWORK REACHABILITY IS OWNED BY THE NFTABLES
# FENCE (hugmesh-sunshine-firewall): stream ports tailnet-only, web UI
# loopback-only. This file keeps Sunshine itself quiet and mesh-honest.
#
# Pairing (operator, per headset): Moonlight on the Quest adds this node by
# its tailnet MagicDNS name -> shows a PIN -> enter it at
# https://localhost:47990 on THIS node's console (or an SSH tunnel).
# See docs/MDM.md 'Thin desktop'.

# Never hole-punch the LAN router — the mesh is the only intended path.
upnp = off

# Web UI: only the node itself may originate pairing (the fence enforces the
# same at netfilter; belt and braces).
origin_web_ui_allowed = pc

# Keep the default port base (47989) — the nftables fence and docs/MDM.md
# enumerate exactly this port set; change both together or not at all.
# port = 47989

# Friendly name shown in Moonlight's host list.
sunshine_name = hugmesh-thin-desktop
