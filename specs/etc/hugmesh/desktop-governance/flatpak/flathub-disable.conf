# flathub-disable.conf
#
# Marker/manifest consumed by provision_desktop_governance(). Lists the
# upstream Flatpak remotes that MUST be removed/disabled on a governed client
# desktop so the BFF-registry remote (hugmesh-discover) is the SOLE software
# source. Plasma Discover's Flatpak backend will only ever offer apps from
# remotes that exist + are enabled; with these gone, the store is limited to the
# domain-curated registry (and empty until an admin curates).
#
# One remote name per line. Comments (#) and blank lines ignored. The flatpak
# system installation ships no remotes by default in our image, but distro
# preset files (e.g. /etc/flatpak/remotes.d/flathub.flatpakrepo) or a
# fedora/gnome-software preset may add Flathub — provisioning removes any of
# these names whether they arrived as a `flatpak remote-add` or a preset file.
flathub
flathub-beta
gnome-nightly
kdeapps
fedora
