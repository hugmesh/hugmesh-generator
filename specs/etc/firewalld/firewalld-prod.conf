# firewalld configuration — PRODUCTION (hardened).
# Selected by the image builder based on --env prod.
# All cluster traffic travels over the Tailscale VPN (tailscale0, zone=trusted).
# Every other interface lands in the default 'drop' zone.
DefaultZone=drop
FirewallBackend=nftables
IndividualCalls=no
LogDenied=unicast
AutomaticHelpers=no
AllowZoneDrifting=no
