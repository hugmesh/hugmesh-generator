# firewalld configuration — TEST (permissive).
# Selected by the image builder based on --env test.
# All inbound accepted so CI harnesses and QEMU verify scripts can connect
# without a tailnet.  MUST NOT be used for production images.
DefaultZone=trusted
FirewallBackend=nftables
IndividualCalls=no
LogDenied=off
AutomaticHelpers=no
AllowZoneDrifting=no
