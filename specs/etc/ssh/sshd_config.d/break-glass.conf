# break-glass.conf — NARROWED, default-OFF break-glass for a registry-enforced
# (ADMIN-owned / mesh-extension) node. Ships ALONGSIDE device-registry.conf on
# registry-enforced nodes ONLY (NEVER on SUPERADMIN/core nodes — those keep the
# #66 owner-key path and need no break-glass).
#
# PURPOSE: if the device-license registry is unreachable, mis-signed, rolled back,
# or the signing key was rotated without re-baking the public half (fleet
# lockout), an operator PHYSICALLY AT THE MACHINE must still be able to recover the
# node. This re-enables a SINGLE physically-held key, but ONLY for a
# console/loopback-originated connection — NOT over the tailnet or any public
# interface.
#
# DEFAULT-OFF BY CONSTRUCTION: the referenced /etc/ssh/break-glass.keys file is
# ABSENT (or empty) on a freshly-provisioned node, so the Match yields NO keys =
# NO bypass. The bypass exists only AFTER an operator with physical access drops a
# public key into that file. Removing the file re-seals the node. The break-glass
# key BYPASSES the registry, so its use is auditable and it is OFF by default
# (hugmesh-device-license-registry memory line 149).
#
# WHY LocalAddress 127.0.0.1,::1 (loopback) and NOT a tailnet/public Match: a
# connection whose LOCAL (server-side) address is loopback originated from THIS
# host — i.e. after a local console/serial login the operator runs `ssh
# localhost`, or a console-tunnelled session. Tailnet (100.64.0.0/10) and LAN
# connections have a non-loopback LocalAddress and are therefore NOT matched, so
# the break-glass key can never be presented remotely. This is the narrowed
# console-only break-glass from the verified design (memory lines 99-101).
#
# NOTE: this Match RE-OPENS a file-based key source for the matched scope only.
# Outside the Match, device-registry.conf's `AuthorizedKeysFile none` +
# AuthorizedKeysCommand remain the SOLE source (the registry is still authoritative
# for every non-loopback path).

Match LocalAddress 127.0.0.1,::1
    # Single physically-held break-glass key file (absent/empty by default = no
    # bypass). The AuthorizedKeysCommand is intentionally NOT re-set here, so on a
    # loopback connection the file is the source; drop a key in to recover.
    AuthorizedKeysFile /etc/ssh/break-glass.keys
    AuthorizedKeysCommand none
