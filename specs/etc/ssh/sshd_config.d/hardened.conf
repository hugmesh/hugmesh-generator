PermitRootLogin no
PasswordAuthentication no
PubkeyAuthentication yes
X11Forwarding no
AllowTcpForwarding no
AllowAgentForwarding no
PermitTunnel no
MaxAuthTries 3
ClientAliveInterval 300
ClientAliveCountMax 2
LoginGraceTime 30
Protocol 2
# AEAD-ONLY ciphers (FIPS-aligned; NIST 800-53 SC-8/SC-13, DISA SSH STIG). Drop
# aes256-ctr (CTR + Encrypt-then-MAC is not AEAD) so only authenticated-encryption
# ciphers remain.
Ciphers aes256-gcm@openssh.com,chacha20-poly1305@openssh.com
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com
KexAlgorithms curve25519-sha256,curve25519-sha256@libssh.org
# Ed25519-only host key (FIPS 186-5 approved; NIST 800-53 IA-5, SC-13). Pairs with
# provision.sh ensure_host_keys() which generates an Ed25519-ONLY host key and
# removes any RSA/ECDSA/DSA host keys. Constraining the SERVER HOST-KEY algorithm
# to ssh-ed25519 means a stale RSA host key can never be negotiated. (This scopes
# only the host-key the server PRESENTS — it does NOT restrict the user/client
# pubkey algorithms the device-registry lookup accepts.)
HostKey /etc/ssh/ssh_host_ed25519_key
HostKeyAlgorithms ssh-ed25519
