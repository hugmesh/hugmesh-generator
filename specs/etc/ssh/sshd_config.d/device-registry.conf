# device-registry.conf — Layer-B device-license-registry sshd ENFORCEMENT drop-in.
#
# Installed ONLY on ADMIN-owned / mesh-extension cluster nodes, and ONLY AFTER the
# first successful signed-export sync (the bootstrap gate flip — Option (i),
# mirroring selinux-enforce-gate's marker pattern). provision_device_registry()
# STAGES this file at /etc/hugmesh/registry/device-registry.conf; the
# hugmesh-device-registry-sync agent COPIES it into this directory on the first
# verified sync, then reloads sshd. Before that, the #66-baked admin authorized_keys
# remains the bootstrap key (no first-boot brick). SUPERADMIN-owned / core nodes
# NEVER receive this file — they keep the #66 owner-key authorized_keys and rely on
# Layer-A headscale for tailnet reachability (a core node's export entry does not
# exist by design, so an AuthorizedKeysCommand there would lock the owner out).
#
# It layers BESIDE hardened.conf (pubkey-only, no passwords) WITHOUT modifying it.
# The sibling break-glass.conf (a console/loopback-only Match, default-OFF) is a
# SEPARATE drop-in so it can be toggled independently.
#
# THE CRITICAL HOLE THIS CLOSES [FIX-AUTHKEYSFILE-NONE]: a static baked
# authorized_keys OR'd with the AuthorizedKeysCommand would make a registry DENY a
# no-op. `AuthorizedKeysFile none` makes the command the SOLE key source — there is
# nothing to OR against, so a revoked/absent license is a hard deny.

# The signed device-registry export is the SOLE key source on this node.
AuthorizedKeysFile none

# The lookup verifies the baked-signed export, monotonic-generation, mesh, and
# returns ONLY the offered key iff an active license pins it onto THIS node;
# empty-on-any-error = fail-closed (deny). We pass:
#   %u login user, %f offered-key fingerprint, %t offered-key type, %k offered-key blob
# (%t + %k let the command re-emit the EXACT offered key as the authorized_keys
# line, gated by the %f pin — the export carries fingerprints, not key blobs.)
AuthorizedKeysCommand /usr/sbin/hugmesh-authorized-keys-lookup %u %f %t %k

# Run the command UNPRIVILEGED. It needs only world-readable inputs (the signed
# export cache, the baked public key, node.env) — no private material.
AuthorizedKeysCommandUser nobody
