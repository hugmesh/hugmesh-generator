# =============================================================================
# optional-services.yaml — the SINGLE source-of-truth registry for the OPTIONAL
# (non-architecture) services that an operator may ADD or REMOVE by command on
# ANY generated USB image, regardless of platform (Pi5 arm64 / x86 amd64 / mix).
# =============================================================================
#
# The platform splits into two tiers:
#   * ARCHITECTURE (core, always present): gateways (pki/be/fe), Casdoor/PKI, the
#     federation API + remote-fragment + host shell, admin/user/mod BFFs + UIs.
#   * OPTIONAL services (THIS file): akkoma (Mastodon), tuwunel (Matrix), phpbb
#     (forum), games, owncast (live streaming), tube (LocalTube). Add/remove-by-
#     command; the rest of the stack degrades gracefully (greyed-out, never
#     500/502) when any/all of them are omitted. (Plus the non-user-level slugs
#     egress-vpn / workloadConsole / anubis, gated the same way.)
#
# DEFAULT-INCLUSION POLICY (user 2026-06-17):
#   * DEFAULT-ON  (the built-in default when NO selection is given): akkoma, tuwunel
#     (Matrix), phpbb.
#   * DEFAULT-OFF (must be specifically added): games, owncast, tube,
#     character-studio, character-forge — and any future user-level service. games
#     moved from default-on to DEFAULT-OFF here.
#   * FULL-SET sentinel: OPTIONAL_SERVICES=all (and --all-services) selects EVERY
#     user-level slug (akkoma tuwunel phpbb games owncast tube character-studio
#     character-forge).
# The per-slug `default: on|off` below records THIS policy (akkoma/tuwunel/phpbb on;
# games/owncast/tube off).
#
# BUILD-TIME EXCLUSION (the per-service generation-time enable/disable): the
# builder resolves a positive allow-list OPTIONAL_SERVICES (built-in default
# "akkoma tuwunel phpbb" < brand.conf < --optional-services; OPTIONAL_SERVICES=all
# expands to every user-level slug; + the games opt-in) and then applies the
# SUBTRACTIVE knob EXCLUDE_SERVICES (brand.conf / --exclude-services) LAST. Any
# user-level slug NOT in the final selection is pruned by gate_optional_services
# (its Application + manifests + gateway routes + route-access rows + ESO half) and
# rendered installed:"false" in BOTH the installed-services ConfigMap AND the 13a
# ApplicationSet element, so a deselected service is absent from every path.
#
# This file is the ONE list that names the installed set. Today "presence of a
# YAML in apps/ IS the decision" (app-of-apps recurse:true + prune:true), but
# nothing enumerates the optional set — this registry is that missing list.
#
# WHO READS IT:
#   * BUILD-TIME: gate_optional_services() in build-x86-host-stage4.sh /
#     build-rpi5-stage4.sh prunes everything an unselected slug OWNS from the
#     baked GitOps tree (its apps/*.yaml, gateway host-route entries, ESO half,
#     route-access rows). Driven by OPTIONAL_SERVICES (brand.conf) +
#     --optional-services (CLI). Precedence: built-in default (all on) <
#     brand.conf < CLI flag.
#   * RUNTIME (model): rendered into the installed-services ConfigMap
#     (manifests/policy/installed-services-configmap.yaml) that the
#     13-service-catalog-style optional-services ApplicationSet keys off, so a
#     live add/remove flips ONE list instead of editing baked files the running
#     ArgoCD never re-reads (see docs/OPTIONAL-SERVICES.md, "Runtime add/remove").
#
# EDIT THIS ONE FILE; the generator derives the rest. Keep it in sync with the
# reserved-prefixes.yaml labels (games/forum/phpbb/mastodon/matrix are already
# reserved) and the apps/ tree.
#
# ⚠️ KNOWN CROSS-FILE COUPLINGS the build-time gate must honor (verified):
#   * The homeserver ESO secrets are split per-service
#     (external-secrets/akkoma-externalsecrets.yaml +
#     tuwunel-externalsecrets.yaml) so removing one homeserver does NOT orphan
#     the other's mTLS-proxy + admin-token half.
#   * Gateway host routes live in apps/20-gateway-{be,fe}.yaml and route-access
#     rows in manifests/route-access/initdb/20-schema.sql. A leftover ROUTE to a
#     deleted upstream => 502; a leftover ROLE row => stale 403 grant. Remove
#     BOTH.
#   * The gateway image's baked CanonicalSeed.java floor (hugmesh-GATEWAY
#     repo) must match the pruned route-access rows or the in-image snapshot
#     re-enforces removed rows on datastore fallback. That is a SEPARATE repo /
#     image rebuild — tracked as a TODO for the gateway wave, NOT pruned here.
#   * 45-social-ui.yaml serves BOTH the matrix + mastodon micro-frontends from
#     one app, so it is SHARED — it is NOT owned by akkoma or tuwunel alone and
#     is left in place (the UI greys the absent platform via the federation
#     manifest). Only remove it if BOTH homeservers are deselected (see the
#     sharedApps note on each slug).

apiVersion: snapdragon.systems/v1
kind: OptionalServiceRegistry
metadata:
  name: optional-services
spec:
  services:
    # ── akkoma — fediverse / Mastodon-API homeserver ───────────────────────────
    - slug: akkoma
      displayName: "Akkoma (Mastodon)"
      namespace: hugmesh-backend
      default: on
      # ArgoCD Application YAMLs this slug OWNS (pruned when deselected). The
      # shared social-ui is listed under sharedApps, NOT here.
      apps:
        - apps/30-akkoma.yaml
      # apps shared with another slug (tuwunel) — only prune when ALL owners are
      # deselected. gate_optional_services keeps it unless both akkoma+tuwunel go.
      sharedApps:
        - { path: apps/45-social-ui.yaml, sharedWith: [tuwunel] }
      manifestPath: manifests/akkoma
      # Per-service ExternalSecret file (post-split). Removing akkoma deletes ONLY
      # this; tuwunel's half lives in its own file.
      esoFile: manifests/external-secrets/akkoma-externalsecrets.yaml
      esoKeys: [akkoma-proxy-mtls, akkoma-admin, akkoma-secrets]
      # Public host fronted by the be-gateway (Host predicate routes).
      gatewayHost: mastodon.${CLUSTER_DOMAIN}
      # be-gateway route ids (in apps/20-gateway-be.yaml) to drop on removal.
      gatewayRouteIds: [mastodon-oauth, mastodon-api, mastodon-web]
      # route-access seed rows (manifests/route-access/initdb/20-schema.sql) whose
      # url_pattern this slug owns on the named gateway. Drop on removal so a
      # matched-but-upstream-absent route cannot stale-grant.
      routeAccessRows:
        - { gateway: hugmesh-be-gateway, urlPattern: /api/v1/pleroma/admin/** }
        - { gateway: hugmesh-be-gateway, urlPattern: /api/pleroma/admin/** }
        - { gateway: hugmesh-be-gateway, urlPattern: /pleroma/admin/** }
      # federation_modules registration (federation-api repo — separate wave).
      federationModule: { slug: akkoma, mountAt: /social/mastodon, changeset: "023-register-akkoma-module.xml" }
      casdoorSeed: null

    # ── tuwunel — Matrix homeserver (Conduit fork) ─────────────────────────────
    - slug: tuwunel
      displayName: "tuwunel (Matrix)"
      namespace: hugmesh-backend
      default: on
      apps:
        - apps/30-tuwunel.yaml
      sharedApps:
        - { path: apps/45-social-ui.yaml, sharedWith: [akkoma] }
      manifestPath: manifests/tuwunel
      esoFile: manifests/external-secrets/tuwunel-externalsecrets.yaml
      esoKeys: [tuwunel-proxy-mtls, tuwunel-admin]
      gatewayHost: matrix.${CLUSTER_DOMAIN}
      gatewayRouteIds: [matrix-api, matrix-wellknown, matrix]
      routeAccessRows:
        - { gateway: hugmesh-be-gateway, urlPattern: /_matrix/** }
        - { gateway: hugmesh-be-gateway, urlPattern: /.well-known/matrix/** }
        - { gateway: hugmesh-be-gateway, urlPattern: /_synapse/** }
      federationModule: { slug: tuwunel, mountAt: /social/matrix, changeset: "024-register-tuwunel-module.xml" }
      casdoorSeed: null

    # ── phpbb — forum homeserver (backend-only, isolated namespace) ────────────
    # phpBB has NO gateway HOST and NO public ingress: it is reachable only as
    # forum-bff's in-cluster upstream inside the hugmesh-forum default-deny ns.
    # The browser->phpBB path is the forum-bff (/bff/forum/**) + the forum-ui
    # micro-frontend (/social/forum/**), both on the fe-gateway.
    - slug: phpbb
      displayName: "phpBB (Forum)"
      namespace: hugmesh-forum
      default: on
      apps:
        - apps/30-phpbb.yaml
        - apps/38-forum-bff-db.yaml
        - apps/39-forum-bff-api.yaml
        - apps/49-forum-ui.yaml
      sharedApps: []
      manifestPath: manifests/forum
      esoFile: null
      esoKeys: []
      gatewayHost: null
      # fe-gateway route ids serving the forum UI + BFF (apps/20-gateway-fe.yaml).
      gatewayRouteIds: [forum-ui, hugmesh-forum-bff-api, hugmesh-forum-bff-api-moderation]
      routeAccessRows:
        - { gateway: hugmesh-fe-gateway, urlPattern: /social/forum/** }
        - { gateway: hugmesh-fe-gateway, urlPattern: /bff/forum/admin/** }
        - { gateway: hugmesh-fe-gateway, urlPattern: /bff/forum/moderation/** }
        - { gateway: hugmesh-fe-gateway, urlPattern: /bff/forum/** }
        - { gateway: hugmesh-be-gateway, urlPattern: /api/forum/admin/** }
      federationModule: { slug: forum, mountAt: /social/forum, changeset: "022-register-forum-module.xml" }
      casdoorSeed: null

    # ── games — HugMesh Game Studio (x86 GPU worker) + games-realm Casdoor ──
    # games owns its OWN Casdoor (casdoor-games, two-Casdoor architecture). The
    # public host is GAMES_DOMAIN (default games.${CLUSTER_DOMAIN}); see the
    # gamesDomain block + docs/OPTIONAL-SERVICES.md "Games subdomain".
    - slug: games
      displayName: "HugMesh Game Studio"
      namespace: hugmesh-games
      # DEFAULT-OFF (policy 2026-06-17): games is OPT-IN — add it explicitly
      # (--enable-games / 'games' in --optional-services / OPTIONAL_SERVICES=all).
      default: off
      apps:
        - apps/06-casdoor-games.yaml
        - apps/50-games.yaml
        # GAMES APP-STORE (games-services control plane) rides the games slug: it needs
        # the games namespace up, so it is pruned/installed WITH games (gate_optional_
        # services games) case + _opt_render_installed_services flips 13c's installed flag).
        - apps/13c-games-instances.yaml
      sharedApps: []
      manifestPath: manifests/games
      # casdoor-games has its own manifest dir, also pruned with the slug. The games-
      # services control plane adds the per-instance isolation manifests (games-instances)
      # — pruned with games too.
      extraManifestPaths:
        - manifests/casdoor-games
        - manifests/games-instances
      esoFile: null
      esoKeys: [casdoor-games-db, casdoor-games-app]
      # NOTE: the games host is GAMES_DOMAIN (parameterized below), NOT a
      # hugmesh.systems subdomain literal — see gamesDomain.
      gatewayHost: games.${GAMES_DOMAIN}
      # games = the games portal host route; games-servers-console = the games app-store
      # per-instance HTTP console path-route (both pruned when games is deselected).
      gatewayRouteIds: [games, games-servers-console]
      routeAccessRows:
        - { gateway: hugmesh-be-gateway, urlPattern: /games/api/admin/** }
        - { gateway: hugmesh-be-gateway, urlPattern: /games/** }
        - { gateway: hugmesh-fe-gateway, urlPattern: /games/admin/** }
        # ── games-services control-plane rows (degrade with games) ──
        - { gateway: hugmesh-be-gateway, urlPattern: /bff/superadmin/games-services/** }
        - { gateway: hugmesh-be-gateway, urlPattern: /bff/games-services/instances/** }
        - { gateway: hugmesh-be-gateway, urlPattern: /bff/games-services/catalog/** }
        - { gateway: hugmesh-be-gateway, urlPattern: /games/servers/** }
        - { gateway: hugmesh-fe-gateway, urlPattern: /admin/games-services/** }
      federationModule: { slug: games, mountAt: /games, changeset: "025-register-games-module.xml" }
      casdoorSeed: casdoor-games

    # ── tube — LocalTube (YouTube archive, GPU-gated x86 worker) ──────────────
    # LocalTube archives the user's subscribed YouTube channels via yt-dlp.
    # DEFAULT-OFF: requires an x86 amd64 GPU node for transcoding capacity.
    # The tube-bff-api handles Google OAuth sync + download queue; the Nginx
    # media sidecar serves the signed-URL-gated content (/tube/content/**).
    - slug: tube
      displayName: "LocalTube (YouTube archive)"
      namespace: hugmesh-tube
      default: off
      apps:
        - apps/53-tube.yaml
      sharedApps: []
      manifestPath: manifests/tube
      esoFile: manifests/external-secrets/tube-externalsecrets.yaml
      esoKeys: [tube-media-key, tube-token-dek]
      gatewayHost: null
      gatewayRouteIds: [hugmesh-tube-bff-api, tube-content]
      routeAccessRows:
        - { gateway: hugmesh-fe-gateway, urlPattern: /bff/tube/** }
        - { gateway: hugmesh-be-gateway, urlPattern: /tube/content/** }
      federationModule: { slug: tube, mountAt: /tube, changeset: "033-register-tube-module.xml" }
      casdoorSeed: null

    # ── owncast — Owncast live-streaming (GPU-gated x86 worker) ──────────────
    # Owncast HLS live streaming for domain users. Superadmin enables per-domain;
    # admins may grant users ROLE_OWNCAST to broadcast. DEFAULT-OFF: GPU-gated.
    - slug: owncast
      displayName: "Owncast (live streaming)"
      namespace: hugmesh-owncast
      default: off
      apps:
        - apps/52-owncast.yaml
      sharedApps: []
      manifestPath: manifests/owncast
      esoFile: null
      esoKeys: []
      gatewayHost: null
      gatewayRouteIds: [hugmesh-owncast-bff-api]
      routeAccessRows:
        - { gateway: hugmesh-fe-gateway, urlPattern: /bff/owncast/admin/** }
        - { gateway: hugmesh-fe-gateway, urlPattern: /bff/owncast/** }
      federationModule: { slug: owncast, mountAt: /owncast, changeset: "031-register-owncast-module.xml" }
      casdoorSeed: null

    # ── character-studio — VN character-studio remote (creator + chat surface) ──
    # The VN (visual-novel) furry/anthro character-studio Angular native-federation
    # REMOTE: layered-2D character creator + chat surface, federated into the
    # hugmesh.systems host at /character-studio (ROLE_USER floor). It is a pure
    # FRONTEND micro-frontend served by its own non-root nginx pod in the
    # hugmesh-frontend namespace (no dedicated BFF in this slug yet — it talks to
    # the always-present /bff/** routes), so — like user-ui/forum-ui — it carries NO
    # gateway HOST, NO per-service ESO, and just the one fe-gateway path route +
    # route-access row. DEFAULT-OFF (admin gate): add it explicitly
    # (--with-character-studio / 'character-studio' in --optional-services /
    # OPTIONAL_SERVICES=all). When deselected, gate_optional_services() prunes the
    # Application + manifest dir + the fe-gateway route + the route-access row, and
    # _opt_render_installed_services renders character-studio:"false" so the host
    # greys the entry out instead of 404/502.
    - slug: character-studio
      displayName: "Character Studio (VN)"
      namespace: hugmesh-frontend
      default: off
      apps:
        - apps/49b-character-studio-ui.yaml
      sharedApps: []
      manifestPath: manifests/character-studio
      esoFile: null
      esoKeys: []
      gatewayHost: null
      gatewayRouteIds: [character-studio-ui]
      routeAccessRows:
        - { gateway: hugmesh-fe-gateway, urlPattern: /character-studio/** }
      # federation_modules registration lives in the SEPARATE hugmesh-federation-api
      # repo (Liquibase changelog), NOT in this generator repo. The changeset to add
      # there is 036-register-character-studio-module.xml (next free number after 035),
      # mirroring 025-register-games-module.xml field-for-field with
      # slug=character-studio, kind=remote-shell, exposed_module=./routes,
      # mountAt=/character-studio, requiresRole=ROLE_USER,
      # remote_entry_url=http://hugmesh-character-studio-ui:8080/remoteEntry.json,
      # plus a db.changelog-master.xml <include>. Documented in the generator manifest
      # dir (manifests/character-studio/FEDERATION-REGISTRATION-TODO.md) until that
      # repo's wave lands. mountAt/requiresRole/exposed are recorded inline here so the
      # generator can derive the registration when the federation-api wave runs.
      federationModule:
        slug: character-studio
        mountAt: /character-studio
        requiresRole: ROLE_USER
        exposed: ./routes
        changeset: "036-register-character-studio-module.xml"   # in hugmesh-federation-api (separate repo)
      casdoorSeed: null

    # ── character-forge — Character Forge (3D character maker + XR chat avatars) ──
    # The 3D character generator that maps the VN (character-studio) SVG characters
    # onto parameterized 3D rigs (Char3DConfig), and the avatar source for the
    # "Shadows of the Net" XR chat room (docs/XR-CHAT.md). A MULTI-APP slug shaped
    # like phpbb (BFF db + BFF api + UI remote), combined with the character-studio
    # frontend pattern:
    #   * character-forge-bff-db  (38b) — dedicated Postgres, snapdragon-backend
    #   * character-forge-bff-api (39b) — Spring BFF at /bff/character-forge/**
    #     (ROLE_USER floor; Char3DConfig CRUD + active-config lookup + VN→3D /map)
    #   * snapdragon-character-forge-ui (49c) — Angular native-federation remote at
    #     /character-forge (ROLE_USER floor), nginx-unprivileged :8080, embedding
    #     the Godot WASM maker from its own same-origin assets
    # No gateway HOST; two fe-gateway path routes + two route-access rows. The BFF's
    # ESO secrets ride the SHARED external-secrets files (secretstore.yaml db-auth
    # pair + pki-externalsecrets.yaml mTLS certs, exactly like forum-bff's), so —
    # like phpbb — esoFile is null here and the shared files are NOT pruned with the
    # slug (the unused Secrets are inert without their consumer pods).
    # DEFAULT-OFF (admin gate): add it explicitly (--with-character-forge /
    # 'character-forge' in --optional-services / OPTIONAL_SERVICES=all). When
    # deselected, gate_optional_services() prunes the three Applications + the three
    # manifest dirs + both fe-gateway routes + both route-access rows, and
    # _opt_render_installed_services renders character-forge:"false" so the host
    # greys the entry out instead of 404/502. Soft dependency: character-studio (VN
    # character import); the /map + forge surfaces degrade gracefully without it.
    - slug: character-forge
      displayName: "Character Forge (3D)"
      # Primary namespace = where the BFF + its DB land (the UI remote lands in
      # snapdragon-frontend via its own Application, like phpbb's forum-ui).
      namespace: snapdragon-backend
      default: off
      apps:
        - apps/38b-character-forge-bff-db.yaml
        - apps/39b-character-forge-bff-api.yaml
        - apps/49c-character-forge-ui.yaml
      sharedApps: []
      manifestPath: manifests/character-forge
      extraManifestPaths:
        - manifests/character-forge-bff-api
        - manifests/character-forge-bff-db
      esoFile: null
      esoKeys: []
      gatewayHost: null
      gatewayRouteIds: [character-forge-ui, snapdragon-character-forge-bff-api]
      routeAccessRows:
        - { gateway: snapdragon-fe-gateway, urlPattern: /character-forge/** }
        - { gateway: snapdragon-fe-gateway, urlPattern: /bff/character-forge/** }
      # federation_modules registration lives in the SEPARATE snapdragon-federation-api
      # repo (Liquibase changelog), NOT in this generator repo. 036 is reserved for
      # character-studio, so character-forge takes the next free number, 037. See
      # manifests/character-forge/FEDERATION-REGISTRATION-TODO.md for the exact
      # changeset. mountAt/requiresRole/exposed are recorded inline here so the
      # generator can derive the registration when the federation-api wave runs.
      federationModule:
        slug: character-forge
        mountAt: /character-forge
        requiresRole: ROLE_USER
        exposed: ./routes
        changeset: "037-register-character-forge-module.xml"   # in snapdragon-federation-api (separate repo)
      casdoorSeed: null

    # ── edge-ai — GPU inference node serving an OpenAI-compatible model API ─────
    # Runs Ollama on an NVIDIA GPU worker (the edge_ai role, or be+gpu / omnibus)
    # and serves /v1/chat|embeddings|models on :11434. Other mesh nodes consume it
    # in-cluster (ClusterIP) AND over the tailnet via the be-gateway host route
    # ai.${CLUSTER_DOMAIN}. The model LIBRARY (catalog/preload/runtime/serving knobs)
    # is the edge-ai-models ConfigMap — admin/superadmin editable (Service-Catalog).
    # DEFAULT-OFF: GPU-gated; auto-selected by the edge_ai node role. The
    # nvidia-device-plugin (apps/01d, always-on infra) advertises nvidia.com/gpu so
    # this — and the existing GPU services (owncast/coturn/tube voice+video) — schedule.
    - slug: edge-ai
      displayName: "Edge AI (inference)"
      namespace: hugmesh-inference
      default: off
      apps:
        - apps/54-edge-ai.yaml
      sharedApps: []
      manifestPath: manifests/edge-ai
      esoFile: null
      esoKeys: []
      # Public host fronted by the be-gateway (Host predicate); the OpenAI-compatible
      # /v1 surface is reachable on the tailnet through it, role-gated.
      gatewayHost: ai.${CLUSTER_DOMAIN}
      gatewayRouteIds: [edge-ai]
      routeAccessRows:
        - { gateway: hugmesh-be-gateway, urlPattern: /v1/** }
      federationModule: null
      casdoorSeed: null

    # ── edge-ai-analysis — task analysis API in front of edge-ai (DEFAULT-OFF) ──
    # Stateless wrapper exposing /v1/analyze/* verdicts (image NSFW/abuse classify +
    # perceptual-hash, log/anomaly triage) to the mesh; calls the edge-ai Ollama model
    # server in-cluster. The on-prem hinge Phase-A consumers reach: AIOps (infra logs →
    # @system Matrix DM) and avatar vision moderation (→ mod queue). dependsOn edge-ai
    # (declared in the installed-services services.json so the console greys it when
    # edge-ai is off); it lives in the same hugmesh-inference namespace and is pruned
    # WITH the edge-ai slug (or on its own deselection). The container image is a
    # SEPARATE build artifact (manifests/edge-ai-analysis/image) — keep this slug
    # DESELECTED until the image is built+pushed so no node tries to pull it.
    - slug: edge-ai-analysis
      displayName: "Edge AI — analysis API"
      namespace: hugmesh-inference
      default: off
      apps:
        - apps/55-edge-ai-analysis.yaml
      sharedApps: []
      manifestPath: manifests/edge-ai-analysis
      esoFile: null
      esoKeys: []
      # Shares the edge-ai be-gateway host (ai.${CLUSTER_DOMAIN}); the /v1/analyze/**
      # path route is MORE SPECIFIC than edge-ai's /v1 host-catchall, declared first.
      gatewayHost: ai.${CLUSTER_DOMAIN}
      gatewayRouteIds: [edge-ai-analysis]
      routeAccessRows:
        - { gateway: hugmesh-be-gateway, urlPattern: /v1/analyze/** }
      federationModule: null
      casdoorSeed: null

    # ── edge-ai-tts — Piper text-to-speech + viseme timeline (DEFAULT-OFF) ──────
    # Stateless wrapper exposing POST /v1/synthesize (short-line TTS + an even-split
    # viseme timeline) to the mesh, consumed by matrix-ui's VN voice client (B3).
    # UNLIKE edge-ai-analysis, this slug has NO dependsOn: it is CPU-only and
    # self-contained (the default voice is baked into the image; no upstream call at
    # request time), so it schedules ANYWHERE in the mesh and is wired on BOTH x86
    # AND rpi5 (edge-ai/edge-ai-analysis are x86/GPU-only). It lands in the same
    # hugmesh-inference namespace as edge-ai for organizational locality only —
    # pruned on its OWN deselection, never folded with edge-ai's. The container
    # image is a SEPARATE build artifact (manifests/edge-ai-tts/image) — keep this
    # slug DESELECTED until the image is built+pushed so no node tries to pull it.
    - slug: edge-ai-tts
      displayName: "Edge AI — voice synthesis (TTS)"
      namespace: hugmesh-inference
      default: off
      apps:
        - apps/55b-edge-ai-tts.yaml
      sharedApps: []
      manifestPath: manifests/edge-ai-tts
      esoFile: null
      esoKeys: []
      # Shares the edge-ai be-gateway host (ai.${CLUSTER_DOMAIN}); the
      # /v1/synthesize/** path route is MORE SPECIFIC than edge-ai's /v1
      # host-catchall, declared before it (same pattern as edge-ai-analysis).
      gatewayHost: ai.${CLUSTER_DOMAIN}
      gatewayRouteIds: [edge-ai-tts]
      routeAccessRows:
        - { gateway: hugmesh-be-gateway, urlPattern: /v1/synthesize/** }
      federationModule: null
      casdoorSeed: null

    # ── coturn — TURN/STUN relay for Matrix WebRTC audio/video (DEFAULT-OFF) ───
    # coturn relays peer-to-peer Matrix (tuwunel) voice/video when a direct ICE
    # path fails. It lands in hugmesh-backend ALONGSIDE tuwunel so the
    # long-term-credential shared secret (Secret coturn-shared-secret, ESO-synced
    # from Vault) is reachable by BOTH coturn (validates client creds) and tuwunel
    # (mints them — turn_secret in tuwunel.toml references the SAME secret).
    #
    # RUNTIME-ONLY (anubis pattern): NO hardcoded apps/*.yaml. Unlike akkoma/owncast
    # (which ship a bootstrap-seed Application the build-time gate prunes), coturn is
    # wired ONLY through the runtime optional-services ApplicationSet (apps/13a) with
    # installed:"false". This keeps it genuinely DEFAULT-OFF without a build-time
    # prune branch (the recurse root would otherwise auto-deploy a baked Application),
    # and it is created/pruned at runtime by flipping the `coturn` flag in the
    # installed-services ConfigMap (the documented live add/remove lever) + the 13a
    # element. A DEFAULT build is byte-identical to today's mainline (no pod, Matrix
    # clients keep host-only ICE: iceServers:[]).
    #
    # coturn owns NO gateway HOST and NO gateway routes: it is a direct UDP/TCP relay
    # (3478 STUN/TURN + 5349 TLS + a relay window), discovered by clients via the
    # Matrix voip/turnServer endpoint tuwunel serves — NOT via the be-gateway. PUBLIC
    # reachability of those ports (NodePort/LoadBalancer + external-ip + firewall) is
    # DEFERRED operator/cluster-topology work (docs/COTURN.md).
    - slug: coturn
      displayName: "coturn (TURN/STUN server)"
      namespace: hugmesh-backend
      default: off
      # RUNTIME-ONLY: no bootstrap Application (see header) — gated solely by the
      # 13a ApplicationSet element + the installed-services ConfigMap flag.
      apps: []
      sharedApps: []
      manifestPath: manifests/coturn
      # Per-service ExternalSecret file (the TURN long-term-credential shared
      # secret; ESO/Vault only, never inline). Shared by coturn + tuwunel.
      esoFile: manifests/external-secrets/coturn-externalsecrets.yaml
      esoKeys: [coturn-shared-secret]
      gatewayHost: null           # no public HTTP host; direct UDP/TCP relay
      gatewayRouteIds: []         # no gateway routes
      routeAccessRows: []         # no gateway route-access gating
      federationModule: null      # signalled to clients via Matrix voip/turnServer
      casdoorSeed: null

    # ── meshbridge — Meshtastic LoRa mesh <-> Matrix bridge (DEFAULT-OFF) ──────
    # meshbridge attaches LoRa mesh radios (USB-serial, LoRa-WiFi TCP:4403, or a
    # WAN-linked mesh via Meshtastic's MQTT JSON integration) and bridges their
    # text traffic into tuwunel as a Matrix APPSERVICE (exclusive @mesh-.* user
    # namespace; per-room opt-in via the systems.hugmesh.mesh.bridge state
    # event). See docs/MESHTASTIC-BRIDGE.md. It lands in hugmesh-backend
    # ALONGSIDE tuwunel because the appservice speaks the plain in-namespace CS
    # API (tuwunel:8008) and receives AS transaction pushes on :8009 — neither
    # leg ever transits a gateway.
    #
    # RUNTIME-ONLY (the coturn/anubis pattern): NO hardcoded apps/*.yaml — wired
    # ONLY through the runtime optional-services ApplicationSet (apps/13a) with
    # installed:"false", created/pruned at runtime by flipping the `meshbridge`
    # flag in the installed-services ConfigMap + the 13a element. A DEFAULT
    # build is byte-identical to today's mainline (no pod, no policy, no rooms
    # bridged).
    #
    # dependsOn tuwunel: like coturn, the dependency is declared in the
    # installed-services services.json entry (the admin console greys meshbridge
    # when tuwunel is off) — the bridge is meaningless without the homeserver it
    # posts into. meshbridge owns NO gateway HOST and NO gateway routes: nothing
    # user-facing speaks HTTP to it (rooms opt in via Matrix state events; radio
    # registration is a user-bff surface that user-bff already owns).
    - slug: meshbridge
      displayName: "Mesh radio bridge (Meshtastic ↔ Matrix)"
      namespace: hugmesh-backend
      default: off
      # RUNTIME-ONLY: no bootstrap Application (see header) — gated solely by the
      # 13a ApplicationSet element + the installed-services ConfigMap flag.
      apps: []
      sharedApps: []
      manifestPath: manifests/meshbridge
      # Per-service ExternalSecret file (appservice token pair + Casdoor machine
      # client + optional MQTT broker password; ESO/Vault only, never inline).
      esoFile: manifests/external-secrets/meshbridge-externalsecrets.yaml
      esoKeys: [meshbridge-appservice]
      gatewayHost: null           # no public HTTP host; AS push + CS API are in-namespace
      gatewayRouteIds: []         # no gateway routes
      routeAccessRows: []         # no gateway route-access gating
      federationModule: null      # surfaces ride existing modules (rooms UI / user-bff)
      # casdoorSeed models a per-slug Casdoor INSTANCE (games), not client
      # seeding — the bridge's client-credentials client (ROLE_SERVICE, for
      # user-bff's internal mesh-devices surface) is provisioned MANUALLY at
      # enable time; see the meshbridge-externalsecrets.yaml header.
      casdoorSeed: null

    # ── egress-vpn — node-level split-tunnel egress VPN (DEFAULT-OFF) ──────────
    # UNLIKE the others, egress-vpn is a NODE service (a wg-quick/openvpn OpenRC
    # service + a signed-export reconcile agent on the MESH NODES), NOT a cluster
    # Application — so it owns NO apps[]/gatewayHost/routeAccessRows. Its gate is
    # NODE-LEVEL: when NOT selected, the build prunes net-vpn/wireguard-tools +
    # net-vpn/openvpn from the node packages.list AND does NOT link the
    # hugmesh-vpn-reconcile service / cron (the hugmesh-egress-vpn service
    # itself is always baked but inert). When selected, the reconcile service + cron
    # are linked so the node converges from the signed /export. The control plane
    # (vpn_config/vpn_node_assignment) lives in admin-bff; the K8s Secret carrying a
    # config's bytes is materialised by ESO under the per-config secret_ref. Service
    # opt-in is NODE-PLACEMENT-driven: a DOMAIN/NODE assignment marks the public pods
    # (akkoma/tuwunel/coturn) via the snapdragon.systems/vpn-egress=true label; the
    # NetworkPolicy interaction (manifests/networkpolicy/egress-vpn-interaction.yaml)
    # loosens akkoma/tuwunel egress ONTO the VPN only on an explicit assignment.
    - slug: egress-vpn
      displayName: "Egress VPN (split-tunnel)"
      namespace: hugmesh-backend
      default: off
      scope: node            # NODE service, not a cluster Application
      apps: []
      sharedApps: []
      manifestPath: manifests/networkpolicy   # only the interaction NetworkPolicy
      esoFile: null
      esoKeys: []
      gatewayHost: null
      gatewayRouteIds: []
      routeAccessRows: []
      federationModule: null
      casdoorSeed: null
      # NODE-level gate artefacts (pruned/linked by gate_optional_services):
      nodePackages: [net-vpn/wireguard-tools, net-vpn/openvpn]
      nodeServices: [hugmesh-egress-vpn, hugmesh-vpn-reconcile]
      # The per-service opt-in label the NetworkPolicy interaction keys off.
      vpnEgressLabel: snapdragon.systems/vpn-egress

    # ── tor — node-level v3 Tor onion (hidden) service (DEFAULT-OFF) ──────────
    # LIKE egress-vpn, tor is a NODE service (the DISTRO Tor daemon — net-vpn/tor,
    # /etc/init.d/tor — plus a hugmesh reconcile agent on the MESH NODES), NOT a
    # cluster Application, so it owns NO apps[]/gatewayHost/routeAccessRows. Its gate
    # is NODE-LEVEL: when NOT selected the build omits net-vpn/tor from the node
    # packages AND does NOT link the tor + hugmesh-tor-reconcile services (so the
    # daemon is simply absent). When selected, the reconcile agent (oneshot + 24h cron)
    # writes a managed /etc/tor/torrc, mints + PERSISTS the v3 onion keypair OFF-GIT
    # under /var/lib/tor/hugmesh-onion (tor:tor 0700; never a Secret, never git) on
    # first boot, and exposes the in-cluster fe-gateway as a stable .onion — INBOUND
    # reachability with no public IP / DDNS / Cloudflare. The per-service opt-in label
    # (snapdragon.systems/tor-onion) keys the NetworkPolicy interaction
    # (manifests/networkpolicy/tor-onion-marked.yaml) — a forward-hook for the OPT-IN
    # pod-egress-via-tor capability (inert by default). nodeServices lists the DISTRO
    # `tor` service (baked with the package, linked when selected) + our reconcile agent.
    - slug: tor
      displayName: "Tor (v3 hidden service)"
      namespace: hugmesh-backend
      default: off
      scope: node            # NODE service, not a cluster Application
      apps: []
      sharedApps: []
      manifestPath: manifests/networkpolicy   # only the interaction NetworkPolicy
      esoFile: null
      esoKeys: []
      gatewayHost: null
      gatewayRouteIds: []
      routeAccessRows: []
      federationModule: null
      casdoorSeed: null
      # NODE-level gate artefacts (added/linked by the SVCS/PKGS gates; the
      # NetworkPolicy is pruned by gate_optional_services when NOT selected):
      nodePackages: [net-vpn/tor]
      nodeServices: [tor, hugmesh-tor-reconcile]
      # The per-service opt-in label the NetworkPolicy interaction keys off.
      torOnionLabel: snapdragon.systems/tor-onion
      # The in-cluster upstream the v3 hidden service exposes (host:port). A HOST-level
      # Tor daemon can't resolve cluster DNS, so the node-local fe-gateway ingress is the
      # default; override per node via /etc/hugmesh/tor/upstream.
      torHiddenServiceUpstream: 127.0.0.1:8443

    # ── workloadConsole — podman/OpenShift-equivalent pod console (DEFAULT-OFF) ──
    # UNLIKE the deployed services, the Workload Console is RBAC + route-access ONLY:
    # the BFF endpoints (/bff/{admin,superadmin}/workloads/**) live in the always-present
    # admin-bff, and the federated admin-ui remote is a HIDDEN-tier module the host loads
    # only when the grant guard passes. This slug owns the two-SA RBAC Application
    # (apps/14-workload-console-rbac.yaml + manifests/workload-console-rbac: read app-tier-
    # only + mutate SAs + the superadmin cluster-read SA/ClusterRole + the deploy-provenance
    # Kyverno policy) and the two route-access rows. SHIPS DARK: default off; even when
    # selected the admin-bff is independently dark until app.workload-console.enabled + the
    # DB master flag + an active grant. The DANGEROUS surfaces are tailnet-only by deployment.
    - slug: workloadConsole
      displayName: "Workload Console"
      namespace: hugmesh-backend
      default: off
      apps:
        - apps/14-workload-console-rbac.yaml
      sharedApps: []
      manifestPath: manifests/workload-console-rbac
      esoFile: null
      esoKeys: []
      gatewayHost: null
      gatewayRouteIds: []
      # The console UI remote is a HIDDEN federation tier (registered but never auto-
      # surfaced; the host loads it only when the grant guard passes) — NOT a normal
      # auto-mounted federationModule.
      hiddenModule: { slug: workloadConsole, mountAt: /admin/workloads }
      routeAccessRows:
        - { gateway: hugmesh-be-gateway, urlPattern: /bff/superadmin/workloads/** }
        - { gateway: hugmesh-be-gateway, urlPattern: /bff/admin/workloads/** }
      federationModule: null
      casdoorSeed: null

    # ── headwind — Headwind MDM (Apache-2.0 Android device-owner DPC), devops-only ──
    # Admin-only devops tool (Harbor/superadmin posture, ns hugmesh-pki),
    # TAILNET-ONLY. Rides the EXISTING superadmin-gateway (apps/22-gateway-
    # superadmin.yaml) for its two routes rather than owning a gatewayHost/Ingress
    # of its own — same non-gatewayHost posture as workloadConsole immediately
    # above, and consistent with every other non-be/fe-gateway optional-service
    # (coturn/tube/owncast/meshbridge all set gatewayHost: null too). The
    # superadmin console itself resolves via a LITERAL host
    # (superadmin.hugmesh.systems) + a LAN/VPN /etc/hosts alias, never a
    # public wildcard — the OPTIONAL headwind.<domain> friendly alias, if ever
    # added, is an `ingress.extraHosts` entry on that SAME Application, not a
    # second Ingress/Application.
    - slug: headwind
      displayName: "Headwind MDM (managed phones)"
      namespace: hugmesh-pki
      default: off
      apps:
        - apps/23-headwind.yaml
      sharedApps: []
      manifestPath: manifests/headwind
      esoFile: manifests/external-secrets/headwind-externalsecrets.yaml
      esoKeys: [headwind-db-auth, headwind-admin]
      gatewayHost: null
      gatewayRouteIds: [headwind-console, headwind-checkin]
      routeAccessRows:
        - { gateway: hugmesh-superadmin-gateway, urlPattern: /hmdm/manage/** }  # human console, ROLE_SUPERADMIN
        - { gateway: hugmesh-superadmin-gateway, urlPattern: /hmdm/rest/**   }  # device check-in, PUBLIC (own token; network-locked)
      federationModule: null
      casdoorSeed: null

    # ── attestation-server — GrapheneOS AttestationServer (hardware trust root) ──
    # Verifies GrapheneOS/Auditor hardware-attestation submissions. SQLite-backed
    # (single pod, no cluster DB engine), no Ingress — reachable only through the
    # apps/22-gateway-superadmin.yaml routes below (tailnet-only), same posture as
    # headwind. 3-route split: device/Auditor-app calls (PUBLIC, network-locked)
    # vs. the browser/console (ROLE_SUPERADMIN) — /attest/api/status is
    # device-facing despite the /api/ prefix, so it gets its own PUBLIC row and
    # MUST be evaluated before the /attest/api/** console row.
    - slug: attestation-server
      displayName: "GrapheneOS AttestationServer (Hardware Trust Root)"
      namespace: hugmesh-pki
      default: off
      apps:
        - apps/24-attestation-server.yaml
      sharedApps: []
      manifestPath: manifests/attestation-server
      esoFile: manifests/external-secrets/attestation-server-externalsecrets.yaml
      esoKeys: [attestation-server-smtp]
      gatewayHost: null
      gatewayRouteIds: [attestation-auditor, attestation-status, attestation-console]
      routeAccessRows:
        - { gateway: hugmesh-superadmin-gateway, urlPattern: /attest/auditor/**        }  # device/Auditor-app check-in, PUBLIC (tailnet-locked)
        - { gateway: hugmesh-superadmin-gateway, urlPattern: /attest/api/status        }  # device-facing despite /api/ prefix, PUBLIC — must precede /attest/api/** below
        - { gateway: hugmesh-superadmin-gateway, urlPattern: /attest/api/create-account }  # explicit DENY: CreateAccountHandler has no app-layer auth — must precede /attest/api/** below
        - { gateway: hugmesh-superadmin-gateway, urlPattern: /attest/api/**            }  # human console, ROLE_SUPERADMIN
      federationModule: null
      casdoorSeed: null

    # ── anubis — proof-of-work anti-scraper gate fronting public ingress ──────
    # Anubis (github.com/TecharoHQ, ghcr.io/techarohq/anubis) sits in front of the
    # fe-gateway (TARGET=hugmesh-fe-gateway) on its :8923 PoW gate and exposes a
    # :9090 metrics/health listener that the superadmin admin-bff proxies
    # (/bff/admin/anubis/{status,metrics}; ANUBIS_ENABLED/ANUBIS_MANAGEMENT_URL).
    #
    # ENV-CONDITIONAL DEFAULT (the PUBLIC PoW shield policy — NOT a plain default):
    #   * ENV=prod  => ON  by default ("all shields up": the public front door is
    #                  PoW-gated, and the build reroutes the fe-gateway public
    #                  Ingress THROUGH Anubis :8923 -> fe-gateway).
    #   * ENV=test  => OFF by default (no PoW interstitial on a LAN/test build).
    #   * Explicit operator choice ALWAYS wins: list "anubis" to force ON, or
    #     "-anubis"/"no-anubis" to force OFF (in either ENV).
    # The `default: off` below is the SAFE TEST BASELINE shipped in the ConfigMap;
    # _opt_render_installed_services() in build-rpi5-stage4.sh (via
    # _opt_anubis_installed) FLIPS it to "true" for PROD builds. No gatewayHost/
    # route-access rows (it is an INGRESS-layer gate, not a /bff/** upstream); when
    # OFF the BFF's AnubisClient degrades to "unreachable" (no 503) and the public
    # ingress routes straight to the fe-gateway (direct, unshielded path).
    - slug: anubis
      displayName: "Anubis (anti-scraper PoW gate)"
      namespace: hugmesh-frontend
      # SAFE TEST BASELINE. PROD flips this on at build time (ENV-conditional —
      # see the ENV policy note above); the operator can override either way.
      default: off
      # The public PoW shield obeys the ENV policy (prod-on / test-off) rather than
      # plain presence in OPTIONAL_SERVICES.
      envConditional:
        prod: on
        test: off
      # NO hardcoded apps/*.yaml: unlike akkoma/games (which ship a bootstrap-seed
      # Application that the build-time gate prunes), Anubis is wired ONLY through
      # the runtime optional-services ApplicationSet (apps/13a) with installed:
      # "false". This keeps it genuinely DEFAULT-OFF without a build-time prune
      # branch (the recurse root would otherwise auto-deploy a baked Application),
      # and it is created/pruned by flipping the `anubis` flag in the
      # installed-services ConfigMap — the documented live add/remove lever.
      apps: []
      sharedApps: []
      manifestPath: manifests/anubis
      esoFile: null
      esoKeys: []
      gatewayHost: null
      gatewayRouteIds: []
      routeAccessRows: []
      federationModule: null
      casdoorSeed: null

  # ── games subdomain / TLD configuration ──────────────────────────────────────
  # GAMES_DOMAIN (brand.conf knob, default games.${CLUSTER_DOMAIN}) is the single
  # value that drives every games host / OIDC issuer / redirect URI. The default
  # serves games as a SUBDOMAIN of the primary domain until the real .games TLD
  # is obtained; flip GAMES_DOMAIN=<brand>.games to switch (see the TLD-flip
  # section of docs/OPTIONAL-SERVICES.md). rebrand_sysroot rewrites the baked
  # hugmesh.games literals to ${GAMES_DOMAIN}; these files carry the values:
  gamesDomain:
    knob: GAMES_DOMAIN
    default: "games.${CLUSTER_DOMAIN}"
    parameterizedFiles:
      - manifests/casdoor-games/app-conf-configmap.yaml      # origin (OIDC iss)
      - manifests/casdoor-games/init-data-configmap.yaml     # redirectUris + websiteUrl/homepageUrl
      - manifests/casdoor-games/init-job.yaml                # redirectUris (reconcile.py re-pins on every PostSync)
      - manifests/games/deployment.yaml                      # CASDOOR_ISSUER_URI
    gatewayHostRoute:
      app: apps/20-gateway-be.yaml
      routeId: games
      uri: http://hugmesh-games.hugmesh-games.svc.cluster.local:8080
