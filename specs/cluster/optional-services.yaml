# =============================================================================
# optional-services.yaml — the SINGLE source-of-truth registry for the OPTIONAL
# (non-architecture) services that an operator may ADD or REMOVE by command on
# ANY generated USB image, regardless of platform (Pi5 arm64 / x86 amd64 / mix).
# =============================================================================
#
# The platform splits into two tiers:
#   * ARCHITECTURE (core, always present): gateways (pki/be/fe), Casdoor/PKI, the
#     federation API + remote-fragment + host shell, admin/user/mod BFFs + UIs.
#   * OPTIONAL services (THIS file): akkoma (Mastodon), tuwunel (Matrix), phpbb
#     (forum), games, owncast (live streaming), tube (LocalTube). Add/remove-by-
#     command; the rest of the stack degrades gracefully (greyed-out, never
#     500/502) when any/all of them are omitted. (Plus the non-user-level slugs
#     egress-vpn / workloadConsole / anubis, gated the same way.)
#
# DEFAULT-INCLUSION POLICY (user 2026-06-17):
#   * DEFAULT-ON  (the built-in default when NO selection is given): akkoma, tuwunel
#     (Matrix), phpbb.
#   * DEFAULT-OFF (must be specifically added): games, owncast, tube — and any
#     future user-level service. games moved from default-on to DEFAULT-OFF here.
#   * FULL-SET sentinel: OPTIONAL_SERVICES=all (and --all-services) selects EVERY
#     user-level slug (akkoma tuwunel phpbb games owncast tube).
# The per-slug `default: on|off` below records THIS policy (akkoma/tuwunel/phpbb on;
# games/owncast/tube off).
#
# BUILD-TIME EXCLUSION (the per-service generation-time enable/disable): the
# builder resolves a positive allow-list OPTIONAL_SERVICES (built-in default
# "akkoma tuwunel phpbb" < brand.conf < --optional-services; OPTIONAL_SERVICES=all
# expands to every user-level slug; + the games opt-in) and then applies the
# SUBTRACTIVE knob EXCLUDE_SERVICES (brand.conf / --exclude-services) LAST. Any
# user-level slug NOT in the final selection is pruned by gate_optional_services
# (its Application + manifests + gateway routes + route-access rows + ESO half) and
# rendered installed:"false" in BOTH the installed-services ConfigMap AND the 13a
# ApplicationSet element, so a deselected service is absent from every path.
#
# This file is the ONE list that names the installed set. Today "presence of a
# YAML in apps/ IS the decision" (app-of-apps recurse:true + prune:true), but
# nothing enumerates the optional set — this registry is that missing list.
#
# WHO READS IT:
#   * BUILD-TIME: gate_optional_services() in build-x86-host-stage4.sh /
#     build-rpi5-stage4.sh prunes everything an unselected slug OWNS from the
#     baked GitOps tree (its apps/*.yaml, gateway host-route entries, ESO half,
#     route-access rows). Driven by OPTIONAL_SERVICES (brand.conf) +
#     --optional-services (CLI). Precedence: built-in default (all on) <
#     brand.conf < CLI flag.
#   * RUNTIME (model): rendered into the installed-services ConfigMap
#     (manifests/policy/installed-services-configmap.yaml) that the
#     13-service-catalog-style optional-services ApplicationSet keys off, so a
#     live add/remove flips ONE list instead of editing baked files the running
#     ArgoCD never re-reads (see docs/OPTIONAL-SERVICES.md, "Runtime add/remove").
#
# EDIT THIS ONE FILE; the generator derives the rest. Keep it in sync with the
# reserved-prefixes.yaml labels (games/forum/phpbb/mastodon/matrix are already
# reserved) and the apps/ tree.
#
# ⚠️ KNOWN CROSS-FILE COUPLINGS the build-time gate must honor (verified):
#   * The homeserver ESO secrets are split per-service
#     (external-secrets/akkoma-externalsecrets.yaml +
#     tuwunel-externalsecrets.yaml) so removing one homeserver does NOT orphan
#     the other's mTLS-proxy + admin-token half.
#   * Gateway host routes live in apps/20-gateway-{be,fe}.yaml and route-access
#     rows in manifests/route-access/initdb/20-schema.sql. A leftover ROUTE to a
#     deleted upstream => 502; a leftover ROLE row => stale 403 grant. Remove
#     BOTH.
#   * The gateway image's baked CanonicalSeed.java floor (snapdragon-GATEWAY
#     repo) must match the pruned route-access rows or the in-image snapshot
#     re-enforces removed rows on datastore fallback. That is a SEPARATE repo /
#     image rebuild — tracked as a TODO for the gateway wave, NOT pruned here.
#   * 45-social-ui.yaml serves BOTH the matrix + mastodon micro-frontends from
#     one app, so it is SHARED — it is NOT owned by akkoma or tuwunel alone and
#     is left in place (the UI greys the absent platform via the federation
#     manifest). Only remove it if BOTH homeservers are deselected (see the
#     sharedApps note on each slug).

apiVersion: snapdragon.systems/v1
kind: OptionalServiceRegistry
metadata:
  name: optional-services
spec:
  services:
    # ── akkoma — fediverse / Mastodon-API homeserver ───────────────────────────
    - slug: akkoma
      displayName: "Akkoma (Mastodon)"
      namespace: snapdragon-backend
      default: on
      # ArgoCD Application YAMLs this slug OWNS (pruned when deselected). The
      # shared social-ui is listed under sharedApps, NOT here.
      apps:
        - apps/30-akkoma.yaml
      # apps shared with another slug (tuwunel) — only prune when ALL owners are
      # deselected. gate_optional_services keeps it unless both akkoma+tuwunel go.
      sharedApps:
        - { path: apps/45-social-ui.yaml, sharedWith: [tuwunel] }
      manifestPath: manifests/akkoma
      # Per-service ExternalSecret file (post-split). Removing akkoma deletes ONLY
      # this; tuwunel's half lives in its own file.
      esoFile: manifests/external-secrets/akkoma-externalsecrets.yaml
      esoKeys: [akkoma-proxy-mtls, akkoma-admin]
      # Public host fronted by the be-gateway (Host predicate routes).
      gatewayHost: mastodon.${CLUSTER_DOMAIN}
      # be-gateway route ids (in apps/20-gateway-be.yaml) to drop on removal.
      gatewayRouteIds: [mastodon-oauth, mastodon-api, mastodon-web]
      # route-access seed rows (manifests/route-access/initdb/20-schema.sql) whose
      # url_pattern this slug owns on the named gateway. Drop on removal so a
      # matched-but-upstream-absent route cannot stale-grant.
      routeAccessRows:
        - { gateway: snapdragon-be-gateway, urlPattern: /api/v1/pleroma/admin/** }
        - { gateway: snapdragon-be-gateway, urlPattern: /api/pleroma/admin/** }
        - { gateway: snapdragon-be-gateway, urlPattern: /pleroma/admin/** }
      # federation_modules registration (federation-api repo — separate wave).
      federationModule: { slug: akkoma, mountAt: /social/mastodon, changeset: "023-register-akkoma-module.xml" }
      casdoorSeed: null

    # ── tuwunel — Matrix homeserver (Conduit fork) ─────────────────────────────
    - slug: tuwunel
      displayName: "tuwunel (Matrix)"
      namespace: snapdragon-backend
      default: on
      apps:
        - apps/30-tuwunel.yaml
      sharedApps:
        - { path: apps/45-social-ui.yaml, sharedWith: [akkoma] }
      manifestPath: manifests/tuwunel
      esoFile: manifests/external-secrets/tuwunel-externalsecrets.yaml
      esoKeys: [tuwunel-proxy-mtls, tuwunel-admin]
      gatewayHost: matrix.${CLUSTER_DOMAIN}
      gatewayRouteIds: [matrix-api, matrix-wellknown, matrix]
      routeAccessRows:
        - { gateway: snapdragon-be-gateway, urlPattern: /_matrix/** }
        - { gateway: snapdragon-be-gateway, urlPattern: /.well-known/matrix/** }
        - { gateway: snapdragon-be-gateway, urlPattern: /_synapse/** }
      federationModule: { slug: tuwunel, mountAt: /social/matrix, changeset: "024-register-tuwunel-module.xml" }
      casdoorSeed: null

    # ── phpbb — forum homeserver (backend-only, isolated namespace) ────────────
    # phpBB has NO gateway HOST and NO public ingress: it is reachable only as
    # forum-bff's in-cluster upstream inside the snapdragon-forum default-deny ns.
    # The browser->phpBB path is the forum-bff (/bff/forum/**) + the forum-ui
    # micro-frontend (/social/forum/**), both on the fe-gateway.
    - slug: phpbb
      displayName: "phpBB (Forum)"
      namespace: snapdragon-forum
      default: on
      apps:
        - apps/30-phpbb.yaml
        - apps/38-forum-bff-db.yaml
        - apps/39-forum-bff-api.yaml
        - apps/49-forum-ui.yaml
      sharedApps: []
      manifestPath: manifests/forum
      esoFile: null
      esoKeys: []
      gatewayHost: null
      # fe-gateway route ids serving the forum UI + BFF (apps/20-gateway-fe.yaml).
      gatewayRouteIds: [forum-ui, snapdragon-forum-bff-api, snapdragon-forum-bff-api-moderation]
      routeAccessRows:
        - { gateway: snapdragon-fe-gateway, urlPattern: /social/forum/** }
        - { gateway: snapdragon-fe-gateway, urlPattern: /bff/forum/admin/** }
        - { gateway: snapdragon-fe-gateway, urlPattern: /bff/forum/moderation/** }
        - { gateway: snapdragon-fe-gateway, urlPattern: /bff/forum/** }
        - { gateway: snapdragon-be-gateway, urlPattern: /api/forum/admin/** }
      federationModule: { slug: forum, mountAt: /social/forum, changeset: "022-register-forum-module.xml" }
      casdoorSeed: null

    # ── games — Snapdragon Game Studio (x86 GPU worker) + games-realm Casdoor ──
    # games owns its OWN Casdoor (casdoor-games, two-Casdoor architecture). The
    # public host is GAMES_DOMAIN (default games.${CLUSTER_DOMAIN}); see the
    # gamesDomain block + docs/OPTIONAL-SERVICES.md "Games subdomain".
    - slug: games
      displayName: "Snapdragon Game Studio"
      namespace: snapdragon-games
      # DEFAULT-OFF (policy 2026-06-17): games is OPT-IN — add it explicitly
      # (--enable-games / 'games' in --optional-services / OPTIONAL_SERVICES=all).
      default: off
      apps:
        - apps/06-casdoor-games.yaml
        - apps/50-games.yaml
        # GAMES APP-STORE (games-services control plane) rides the games slug: it needs
        # the games namespace up, so it is pruned/installed WITH games (gate_optional_
        # services games) case + _opt_render_installed_services flips 13c's installed flag).
        - apps/13c-games-instances.yaml
      sharedApps: []
      manifestPath: manifests/games
      # casdoor-games has its own manifest dir, also pruned with the slug. The games-
      # services control plane adds the per-instance isolation manifests (games-instances)
      # — pruned with games too.
      extraManifestPaths:
        - manifests/casdoor-games
        - manifests/games-instances
      esoFile: null
      esoKeys: [casdoor-games-db, casdoor-games-app]
      # NOTE: the games host is GAMES_DOMAIN (parameterized below), NOT a
      # snapdragon.systems subdomain literal — see gamesDomain.
      gatewayHost: games.${GAMES_DOMAIN}
      # games = the games portal host route; games-servers-console = the games app-store
      # per-instance HTTP console path-route (both pruned when games is deselected).
      gatewayRouteIds: [games, games-servers-console]
      routeAccessRows:
        - { gateway: snapdragon-be-gateway, urlPattern: /games/api/admin/** }
        - { gateway: snapdragon-be-gateway, urlPattern: /games/** }
        - { gateway: snapdragon-fe-gateway, urlPattern: /games/admin/** }
        # ── games-services control-plane rows (degrade with games) ──
        - { gateway: snapdragon-be-gateway, urlPattern: /bff/superadmin/games-services/** }
        - { gateway: snapdragon-be-gateway, urlPattern: /bff/games-services/instances/** }
        - { gateway: snapdragon-be-gateway, urlPattern: /bff/games-services/catalog/** }
        - { gateway: snapdragon-be-gateway, urlPattern: /games/servers/** }
        - { gateway: snapdragon-fe-gateway, urlPattern: /admin/games-services/** }
      federationModule: { slug: games, mountAt: /games, changeset: "025-register-games-module.xml" }
      casdoorSeed: casdoor-games

    # ── tube — LocalTube (YouTube archive, GPU-gated x86 worker) ──────────────
    # LocalTube archives the user's subscribed YouTube channels via yt-dlp.
    # DEFAULT-OFF: requires an x86 amd64 GPU node for transcoding capacity.
    # The tube-bff-api handles Google OAuth sync + download queue; the Nginx
    # media sidecar serves the signed-URL-gated content (/tube/content/**).
    - slug: tube
      displayName: "LocalTube (YouTube archive)"
      namespace: snapdragon-tube
      default: off
      apps:
        - apps/53-tube.yaml
      sharedApps: []
      manifestPath: manifests/tube
      esoFile: manifests/external-secrets/tube-externalsecrets.yaml
      esoKeys: [tube-media-key, tube-token-dek]
      gatewayHost: null
      gatewayRouteIds: [snapdragon-tube-bff-api, tube-content]
      routeAccessRows:
        - { gateway: snapdragon-fe-gateway, urlPattern: /bff/tube/** }
        - { gateway: snapdragon-be-gateway, urlPattern: /tube/content/** }
      federationModule: { slug: tube, mountAt: /tube, changeset: "033-register-tube-module.xml" }
      casdoorSeed: null

    # ── owncast — Owncast live-streaming (GPU-gated x86 worker) ──────────────
    # Owncast HLS live streaming for domain users. Superadmin enables per-domain;
    # admins may grant users ROLE_OWNCAST to broadcast. DEFAULT-OFF: GPU-gated.
    - slug: owncast
      displayName: "Owncast (live streaming)"
      namespace: snapdragon-owncast
      default: off
      apps:
        - apps/52-owncast.yaml
      sharedApps: []
      manifestPath: manifests/owncast
      esoFile: null
      esoKeys: []
      gatewayHost: null
      gatewayRouteIds: [snapdragon-owncast-bff-api]
      routeAccessRows:
        - { gateway: snapdragon-fe-gateway, urlPattern: /bff/owncast/admin/** }
        - { gateway: snapdragon-fe-gateway, urlPattern: /bff/owncast/** }
      federationModule: { slug: owncast, mountAt: /owncast, changeset: "031-register-owncast-module.xml" }
      casdoorSeed: null

    # ── egress-vpn — node-level split-tunnel egress VPN (DEFAULT-OFF) ──────────
    # UNLIKE the others, egress-vpn is a NODE service (a wg-quick/openvpn OpenRC
    # service + a signed-export reconcile agent on the MESH NODES), NOT a cluster
    # Application — so it owns NO apps[]/gatewayHost/routeAccessRows. Its gate is
    # NODE-LEVEL: when NOT selected, the build prunes net-vpn/wireguard-tools +
    # net-vpn/openvpn from the node packages.list AND does NOT link the
    # snapdragon-vpn-reconcile service / cron (the snapdragon-egress-vpn service
    # itself is always baked but inert). When selected, the reconcile service + cron
    # are linked so the node converges from the signed /export. The control plane
    # (vpn_config/vpn_node_assignment) lives in admin-bff; the K8s Secret carrying a
    # config's bytes is materialised by ESO under the per-config secret_ref. Service
    # opt-in is NODE-PLACEMENT-driven: a DOMAIN/NODE assignment marks the public pods
    # (akkoma/tuwunel/coturn) via the snapdragon.systems/vpn-egress=true label; the
    # NetworkPolicy interaction (manifests/networkpolicy/egress-vpn-interaction.yaml)
    # loosens akkoma/tuwunel egress ONTO the VPN only on an explicit assignment.
    - slug: egress-vpn
      displayName: "Egress VPN (split-tunnel)"
      namespace: snapdragon-backend
      default: off
      scope: node            # NODE service, not a cluster Application
      apps: []
      sharedApps: []
      manifestPath: manifests/networkpolicy   # only the interaction NetworkPolicy
      esoFile: null
      esoKeys: []
      gatewayHost: null
      gatewayRouteIds: []
      routeAccessRows: []
      federationModule: null
      casdoorSeed: null
      # NODE-level gate artefacts (pruned/linked by gate_optional_services):
      nodePackages: [net-vpn/wireguard-tools, net-vpn/openvpn]
      nodeServices: [snapdragon-egress-vpn, snapdragon-vpn-reconcile]
      # The per-service opt-in label the NetworkPolicy interaction keys off.
      vpnEgressLabel: snapdragon.systems/vpn-egress

    # ── workloadConsole — podman/OpenShift-equivalent pod console (DEFAULT-OFF) ──
    # UNLIKE the deployed services, the Workload Console is RBAC + route-access ONLY:
    # the BFF endpoints (/bff/{admin,superadmin}/workloads/**) live in the always-present
    # admin-bff, and the federated admin-ui remote is a HIDDEN-tier module the host loads
    # only when the grant guard passes. This slug owns the two-SA RBAC Application
    # (apps/14-workload-console-rbac.yaml + manifests/workload-console-rbac: read app-tier-
    # only + mutate SAs + the superadmin cluster-read SA/ClusterRole + the deploy-provenance
    # Kyverno policy) and the two route-access rows. SHIPS DARK: default off; even when
    # selected the admin-bff is independently dark until app.workload-console.enabled + the
    # DB master flag + an active grant. The DANGEROUS surfaces are tailnet-only by deployment.
    - slug: workloadConsole
      displayName: "Workload Console"
      namespace: snapdragon-backend
      default: off
      apps:
        - apps/14-workload-console-rbac.yaml
      sharedApps: []
      manifestPath: manifests/workload-console-rbac
      esoFile: null
      esoKeys: []
      gatewayHost: null
      gatewayRouteIds: []
      # The console UI remote is a HIDDEN federation tier (registered but never auto-
      # surfaced; the host loads it only when the grant guard passes) — NOT a normal
      # auto-mounted federationModule.
      hiddenModule: { slug: workloadConsole, mountAt: /admin/workloads }
      routeAccessRows:
        - { gateway: snapdragon-be-gateway, urlPattern: /bff/superadmin/workloads/** }
        - { gateway: snapdragon-be-gateway, urlPattern: /bff/admin/workloads/** }
      federationModule: null
      casdoorSeed: null

    # ── anubis — proof-of-work anti-scraper gate fronting public ingress ──────
    # Anubis (github.com/TecharoHQ, ghcr.io/techarohq/anubis) sits in front of the
    # fe-gateway (TARGET=snapdragon-fe-gateway) on its :8923 PoW gate and exposes a
    # :9090 metrics/health listener that the superadmin admin-bff proxies
    # (/bff/admin/anubis/{status,metrics}; ANUBIS_ENABLED/ANUBIS_MANAGEMENT_URL).
    #
    # ENV-CONDITIONAL DEFAULT (the PUBLIC PoW shield policy — NOT a plain default):
    #   * ENV=prod  => ON  by default ("all shields up": the public front door is
    #                  PoW-gated, and the build reroutes the fe-gateway public
    #                  Ingress THROUGH Anubis :8923 -> fe-gateway).
    #   * ENV=test  => OFF by default (no PoW interstitial on a LAN/test build).
    #   * Explicit operator choice ALWAYS wins: list "anubis" to force ON, or
    #     "-anubis"/"no-anubis" to force OFF (in either ENV).
    # The `default: off` below is the SAFE TEST BASELINE shipped in the ConfigMap;
    # _opt_render_installed_services() in build-rpi5-stage4.sh (via
    # _opt_anubis_installed) FLIPS it to "true" for PROD builds. No gatewayHost/
    # route-access rows (it is an INGRESS-layer gate, not a /bff/** upstream); when
    # OFF the BFF's AnubisClient degrades to "unreachable" (no 503) and the public
    # ingress routes straight to the fe-gateway (direct, unshielded path).
    - slug: anubis
      displayName: "Anubis (anti-scraper PoW gate)"
      namespace: snapdragon-frontend
      # SAFE TEST BASELINE. PROD flips this on at build time (ENV-conditional —
      # see the ENV policy note above); the operator can override either way.
      default: off
      # The public PoW shield obeys the ENV policy (prod-on / test-off) rather than
      # plain presence in OPTIONAL_SERVICES.
      envConditional:
        prod: on
        test: off
      # NO hardcoded apps/*.yaml: unlike akkoma/games (which ship a bootstrap-seed
      # Application that the build-time gate prunes), Anubis is wired ONLY through
      # the runtime optional-services ApplicationSet (apps/13a) with installed:
      # "false". This keeps it genuinely DEFAULT-OFF without a build-time prune
      # branch (the recurse root would otherwise auto-deploy a baked Application),
      # and it is created/pruned by flipping the `anubis` flag in the
      # installed-services ConfigMap — the documented live add/remove lever.
      apps: []
      sharedApps: []
      manifestPath: manifests/anubis
      esoFile: null
      esoKeys: []
      gatewayHost: null
      gatewayRouteIds: []
      routeAccessRows: []
      federationModule: null
      casdoorSeed: null

  # ── games subdomain / TLD configuration ──────────────────────────────────────
  # GAMES_DOMAIN (brand.conf knob, default games.${CLUSTER_DOMAIN}) is the single
  # value that drives every games host / OIDC issuer / redirect URI. The default
  # serves games as a SUBDOMAIN of the primary domain until the real .games TLD
  # is obtained; flip GAMES_DOMAIN=<brand>.games to switch (see the TLD-flip
  # section of docs/OPTIONAL-SERVICES.md). rebrand_sysroot rewrites the baked
  # snapdragon.games literals to ${GAMES_DOMAIN}; these files carry the values:
  gamesDomain:
    knob: GAMES_DOMAIN
    default: "games.${CLUSTER_DOMAIN}"
    parameterizedFiles:
      - manifests/casdoor-games/app-conf-configmap.yaml      # origin (OIDC iss)
      - manifests/casdoor-games/init-data-configmap.yaml     # redirectUris + websiteUrl/homepageUrl
      - manifests/casdoor-games/init-job.yaml                # redirectUris (reconcile.py re-pins on every PostSync)
      - manifests/games/deployment.yaml                      # CASDOOR_ISSUER_URI
    gatewayHostRoute:
      app: apps/20-gateway-be.yaml
      routeId: games
      uri: http://snapdragon-games.snapdragon-games.svc.cluster.local:8080
