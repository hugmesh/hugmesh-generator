# =============================================================================
# optional-services.yaml — the SINGLE source-of-truth registry for the OPTIONAL
# (non-architecture) services that an operator may ADD or REMOVE by command on
# ANY generated USB image, regardless of platform (Pi5 arm64 / x86 amd64 / mix).
# =============================================================================
#
# The platform splits into two tiers:
#   * ARCHITECTURE (core, always present): gateways (pki/be/fe), Casdoor/PKI, the
#     federation API + remote-fragment + host shell, admin/user/mod BFFs + UIs.
#   * OPTIONAL services (THIS file): akkoma (Mastodon), tuwunel (Matrix), phpbb
#     (forum), games, owncast (live streaming), tube (LocalTube). Add/remove-by-
#     command; the rest of the stack degrades gracefully (greyed-out, never
#     500/502) when any/all of them are omitted. (Plus the non-user-level slugs
#     egress-vpn / workloadConsole / anubis, gated the same way.)
#
# DEFAULT-INCLUSION POLICY (user 2026-06-17):
#   * DEFAULT-ON  (the built-in default when NO selection is given): akkoma, tuwunel
#     (Matrix), phpbb.
#   * DEFAULT-OFF (must be specifically added): games, owncast, tube,
#     character-studio, character-forge — and any future user-level service. games
#     moved from default-on to DEFAULT-OFF here.
#   * FULL-SET sentinel: OPTIONAL_SERVICES=all (and --all-services) selects EVERY
#     user-level slug (akkoma tuwunel phpbb games owncast tube character-studio
#     character-forge).
# The per-slug `default: on|off` below records THIS policy (akkoma/tuwunel/phpbb on;
# games/owncast/tube off).
#
# BUILD-TIME EXCLUSION (the per-service generation-time enable/disable): the
# builder resolves a positive allow-list OPTIONAL_SERVICES (built-in default
# "akkoma tuwunel phpbb" < brand.conf < --optional-services; OPTIONAL_SERVICES=all
# expands to every user-level slug; + the games opt-in) and then applies the
# SUBTRACTIVE knob EXCLUDE_SERVICES (brand.conf / --exclude-services) LAST. Any
# user-level slug NOT in the final selection is pruned by gate_optional_services
# (its Application + manifests + gateway routes + route-access rows + ESO half) and
# rendered installed:"false" in BOTH the installed-services ConfigMap AND the 13a
# ApplicationSet element, so a deselected service is absent from every path.
#
# This file is the ONE list that names the installed set. Today "presence of a
# YAML in apps/ IS the decision" (app-of-apps recurse:true + prune:true), but
# nothing enumerates the optional set — this registry is that missing list.
#
# WHO READS IT:
#   * BUILD-TIME: gate_optional_services() in build-x86-host-stage4.sh /
#     build-rpi5-stage4.sh prunes everything an unselected slug OWNS from the
#     baked GitOps tree (its apps/*.yaml, gateway host-route entries, ESO half,
#     route-access rows). Driven by OPTIONAL_SERVICES (brand.conf) +
#     --optional-services (CLI). Precedence: built-in default (all on) <
#     brand.conf < CLI flag.
#   * BUILD-TIME (federation half): _opt_render_federation_modules() in the SHARED
#     scripts/_optional-services-lib.sh (sourced by both stage4 builders) reads each
#     service's `federationModule.slug` below and renders
#     manifests/federation-modules-gate/sql/gate.sql — one
#     `UPDATE federation_modules SET enabled = <bool> WHERE slug = '<module>';` per
#     gated module, applied on-cluster by a PostSync hook Job. THIS FIELD WAS DEAD
#     UNTIL 2026-08-26: a USB built with `--exclude-services akkoma` pruned every
#     artefact the gate owns AND rendered installed:"false" in both places, and the
#     host shell still showed the Mastodon entry — because the shell resolves its
#     remotes from `federation_modules` (GET /api/federation/capabilities), which the
#     selection never touched. The mapping is NOT 1:1 (phpbb -> forum), which is why
#     it is declared here and never re-derived from the catalogue slug. See
#     docs/OPTIONAL-SERVICES.md §3.1. ⚠ This is the MENU-VISIBILITY half only; the
#     Deployment of a deselected service keeps running.
#   * RUNTIME (model): rendered into the installed-services ConfigMap
#     (manifests/policy/installed-services-configmap.yaml) that the
#     13-service-catalog-style optional-services ApplicationSet keys off, so a
#     live add/remove flips ONE list instead of editing baked files the running
#     ArgoCD never re-reads (see docs/OPTIONAL-SERVICES.md, "Runtime add/remove").
#
# ── `tier:` — USER-LEVEL vs INFRA (added 2026-08-26) ─────────────────────────
# Every row now carries `tier: user-level | infra`. Until this key landed the
# split existed in FOUR hand-maintained copies and NOWHERE in the registry:
#   * build-x86-host-stage4.sh:127   USER_LEVEL_SERVICES="akkoma tuwunel phpbb
#                                    games owncast tube character-studio character-forge"
#   * build-rpi5-stage4.sh:232       (byte-identical line)
#   * studio/hugmesh_studio/core/config.py  OPTIONAL_SERVICES_CHOICES  (the same 8)
#   * studio/hugmesh_studio/core/config.py  INFRA_SERVICES_CHOICES     (4 of the 11)
# The MECHANICAL meaning of the tier — the only one any code acts on — is:
#   user-level = a member of USER_LEVEL_SERVICES, i.e. what the `all` sentinel
#                (OPTIONAL_SERVICES=all / --all-services) expands to.
#   infra      = everything else: NOT expanded by `all`, so it can only be baked
#                by naming the slug (or via a dedicated --with-<x> flag).
# So `tier` is not a taste judgement about who the service is "for" — edge-ai is
# user-facing and still tier: infra, because `all` does not take it. Studio's
# INFRA_SERVICES_CHOICES is a strict SUBSET of tier: infra (the 4 slugs the rpi5
# wizard currently offers), NOT its complement; do not treat the two as equal.
# tests/stack/test-optional-services-exclude.sh DERIVES the user-level set from
# this key and asserts set-equality against both builders' USER_LEVEL_SERVICES
# string, so the copies above can no longer drift apart silently.
#
# ── `gate:` — WHAT ACTUALLY READS THIS ROW, and the vacuity hazard ───────────
# ⚠️ THE FAILURE MODE THIS KEY EXISTS TO STOP: a registry row that NOTHING READS.
# That already happened here. `headwind` sat in BOTH builders' hardcoded
# _opt_render_installed_services() render loops with NO matching key in
# manifests/policy/installed-services-configmap.yaml — so the sed renderer, which
# rewrites an EXISTING `<slug>: "true|false"` line in place, matched nothing,
# changed nothing, and returned 0. It was a silent no-op for weeks. The backfill
# note is still in that ConfigMap above the `headwind: "false"` key it added.
# The lesson: presence in a list proves nothing; only a CONSUMER does.
#
# Every row therefore declares which consumer gates it:
#   gate: build-time  gate_optional_services() in build-{x86-host,rpi5}-stage4.sh
#                     has a `case` arm for this slug that prunes what it owns.
#                     (Most of these ALSO carry a ConfigMap key + 13a element.)
#   gate: runtime     DELIBERATELY no build-time prune arm: the slug ships no
#                     bootstrap Application at all, so there is nothing to prune.
#                     It is created/removed by flipping its `<slug>` key in the
#                     installed-services ConfigMap + the matching element in
#                     apps/13a-optional-services.yaml. (coturn/meshbridge/anubis.)
#   gate: none        NOTHING reads this row yet. REQUIRES a `gateReason:` saying
#                     why, in prose. This is the honest spelling of "registered
#                     but not yet selectable" — and the builders REFUSE such a
#                     slug on --optional-services rather than ignoring it.
#
# tests/stack/test-optional-services-exclude.sh checks this BIDIRECTIONALLY, and
# it DERIVES the consumer set from the shipped files rather than restating a list:
#   * gate: build-time => a `case` arm for the slug really exists in a builder
#   * gate: runtime    => a ConfigMap key AND a 13a element exist, and NO build arm
#   * gate: none       => NO build arm, NO ConfigMap key, NO 13a element, AND a
#                        non-empty gateReason
# Adding a row with no consumer and no `gate: none` turns that suite RED, which
# is the whole point: registry growth now has to prove itself.
#
# ── buildGate: — WHICH BUILDER CAN HONOUR `--optional-services <slug>` ────────
# `gate:` above answers "does ANYTHING read this row, ANYWHERE". That is NOT the
# question `--optional-services` has to answer, and conflating the two is how a
# flag gets accepted and dropped on the floor: `gate: runtime` says in as many
# words that there is NO build-time consumer, so `--optional-services coturn`
# could never bake coturn — yet a validator gating on `gate: != none` accepts it
# and returns an affirmative signal to the operator. The two builders CAN also
# diverge, and did: anubis once had a build-time consumer in build-rpi5-stage4.sh
# (_opt_anubis_installed renders its ConfigMap key + 13a element from the
# selection) and NONE in build-x86-host-stage4.sh, and a union-of-both-builders
# consumer set cannot see that. The gate now lives in ONE sourced library
# (scripts/_optional-services-lib.sh) so that particular divergence is closed —
# but the column stays PER BUILDER, because the constants each builder feeds the
# shared gate (SELECTABLE_OPTIONAL_SERVICES) still differ and a future arm added
# to one builder would re-open it.
#
# So each row also declares, per builder, whether THAT builder reads the slug out
# of the build-time selection:
#   buildGate: [rpi5, x86]  both builders gate it (a gate_optional_services case
#                           arm and/or a render loop driven by _opt_selected)
#   buildGate: [rpi5]       rpi5 only — no row is in this state today (anubis was,
#                           until the shared-gate extraction gave x86 the same
#                           ENV-conditional handling; see its row)
#   buildGate: []           NO builder bakes it. Either runtime-only (coturn,
#                           meshbridge: flip the installed-services ConfigMap key
#                           + the 13a element on a LIVE cluster) or `gate: none`.
# A builder's slug validator gates on ITS OWN buildGate column, so a slug it
# cannot honour is REFUSED with the reason, never accepted-and-ignored. The suite
# derives each builder's real consumer set SEPARATELY (never a union) and asserts
# it set-equals this column, so porting anubis to x86 — or dropping a case arm
# from one builder — is a red test, not a silent divergence.
#
# ── DELIBERATELY NOT REGISTERED (see spec.notRegistered at the foot of this file)
# Three cluster apps an operator might reasonably expect here are excluded ON
# PURPOSE, each for a different reason (always-on / already selectable on another
# axis). They are listed in `spec.notRegistered` with those reasons so the next
# person does not "fix" the omission by adding a second spelling of a service that
# already has one.
#
# EDIT THIS ONE FILE; the generator derives the rest. Keep it in sync with the
# reserved-prefixes.yaml labels (games/forum/phpbb/mastodon/matrix are already
# reserved) and the apps/ tree.
#
# ⚠️ KNOWN CROSS-FILE COUPLINGS the build-time gate must honor (verified):
#   * The homeserver ESO secrets are split per-service
#     (external-secrets/akkoma-externalsecrets.yaml +
#     tuwunel-externalsecrets.yaml) so removing one homeserver does NOT orphan
#     the other's mTLS-proxy + admin-token half.
#   * Gateway host routes live in apps/20-gateway-{be,fe}.yaml and route-access
#     rows in manifests/route-access/initdb/20-schema.sql. A leftover ROUTE to a
#     deleted upstream => 502; a leftover ROLE row => stale 403 grant. Remove
#     BOTH.
#   * The gateway image's baked CanonicalSeed.java floor (hugmesh-GATEWAY
#     repo) must match the pruned route-access rows or the in-image snapshot
#     re-enforces removed rows on datastore fallback. The gateway-wave rebuild
#     landed — CanonicalSeed.java is in sync with the current route-access rows
#     (including games) — but it cannot be GitOps-pruned, so any FUTURE
#     route-access change still needs a matching gateway image rebuild.
#   * 45-social-ui.yaml serves BOTH the matrix + mastodon micro-frontends from
#     one app, so it is SHARED — it is NOT owned by akkoma or tuwunel alone and
#     is left in place (the UI greys the absent platform via the federation
#     manifest). Only remove it if BOTH homeservers are deselected (see the
#     sharedApps note on each slug).

apiVersion: hugmesh.net/v1
kind: OptionalServiceRegistry
metadata:
  name: optional-services
spec:
  services:
    # ── akkoma — fediverse / Mastodon-API homeserver ───────────────────────────
    - slug: akkoma
      displayName: "Akkoma (Mastodon)"
      namespace: hugmesh-backend
      default: on
      tier: user-level
      gate: build-time
      buildGate: [rpi5, x86]
      # ArgoCD Application YAMLs this slug OWNS (pruned when deselected). The
      # shared social-ui is listed under sharedApps, NOT here.
      apps:
        - apps/30-akkoma.yaml
      # apps shared with another slug (tuwunel) — only prune when ALL owners are
      # deselected. gate_optional_services keeps it unless both akkoma+tuwunel go.
      sharedApps:
        - { path: apps/45-social-ui.yaml, sharedWith: [tuwunel] }
      manifestPath: manifests/akkoma
      # Per-service ExternalSecret file (post-split). Removing akkoma deletes ONLY
      # this; tuwunel's half lives in its own file.
      esoFile: manifests/external-secrets/akkoma-externalsecrets.yaml
      esoKeys: [akkoma-proxy-mtls, akkoma-admin, akkoma-secrets]
      # Public host fronted by the be-gateway (Host predicate routes).
      gatewayHost: mastodon.${CLUSTER_DOMAIN}
      # be-gateway route ids (in apps/20-gateway-be.yaml) to drop on removal.
      gatewayRouteIds: [mastodon-oauth, mastodon-api, mastodon-web]
      # route-access seed rows (manifests/route-access/initdb/20-schema.sql) whose
      # url_pattern this slug owns on the named gateway. Drop on removal so a
      # matched-but-upstream-absent route cannot stale-grant.
      routeAccessRows:
        - { gateway: hugmesh-be-gateway, urlPattern: /api/v1/pleroma/admin/** }
        - { gateway: hugmesh-be-gateway, urlPattern: /api/pleroma/admin/** }
        - { gateway: hugmesh-be-gateway, urlPattern: /pleroma/admin/** }
      # federation_modules registration (federation-api repo — separate wave).
      # NOTE the module slug is `mastodon`, NOT the catalogue slug `akkoma`: the row
      # 023-register-akkoma-module.xml actually seeds is `slug=mastodon`, and that is
      # the string the host shell resolves the remote by at runtime and the seeder
      # (tests/stack/seed-e2e.sh leg 4) UPDATEs federation_modules on. `mastodon` is
      # also FROZEN as a feature slug (reserved-prefixes.yaml + 041's header), so the
      # DB side is authoritative and this metadata mirrors it. Asserted per-slug by
      # scripts/validate-federation-module-slugs.sh, which re-derives BOTH sides.
      federationModule: { slug: mastodon, mountAt: /social/mastodon, changeset: "023-register-akkoma-module.xml" }
      casdoorSeed: null

    # ── tuwunel — Matrix homeserver (Conduit fork) ─────────────────────────────
    - slug: tuwunel
      displayName: "tuwunel (Matrix)"
      namespace: hugmesh-backend
      default: on
      tier: user-level
      gate: build-time
      buildGate: [rpi5, x86]
      apps:
        - apps/30-tuwunel.yaml
      sharedApps:
        - { path: apps/45-social-ui.yaml, sharedWith: [akkoma] }
      manifestPath: manifests/tuwunel
      esoFile: manifests/external-secrets/tuwunel-externalsecrets.yaml
      esoKeys: [tuwunel-proxy-mtls, tuwunel-admin]
      gatewayHost: matrix.${CLUSTER_DOMAIN}
      gatewayRouteIds: [matrix-api, matrix-wellknown, matrix]
      routeAccessRows:
        - { gateway: hugmesh-be-gateway, urlPattern: /_matrix/** }
        - { gateway: hugmesh-be-gateway, urlPattern: /.well-known/matrix/** }
        - { gateway: hugmesh-be-gateway, urlPattern: /_synapse/** }
      # federation_modules registration. Module slug is `matrix`, NOT the catalogue
      # slug `tuwunel` — same rule as akkoma/mastodon above: 024 seeds `slug=matrix`,
      # that is what the host shell and the seeder key on, and `matrix` is a frozen
      # feature slug. Re-derived and compared by
      # scripts/validate-federation-module-slugs.sh.
      federationModule: { slug: matrix, mountAt: /social/matrix, changeset: "024-register-tuwunel-module.xml" }
      casdoorSeed: null

    # ── phpbb — forum homeserver (backend-only, isolated namespace) ────────────
    # phpBB has NO gateway HOST and NO public ingress: it is reachable only as
    # forum-bff's in-cluster upstream inside the hugmesh-forum default-deny ns.
    # The browser->phpBB path is the forum-bff (/bff/forum/**) + the forum-ui
    # micro-frontend (/social/forum/**), both on the fe-gateway.
    - slug: phpbb
      displayName: "phpBB (Forum)"
      namespace: hugmesh-forum
      default: on
      tier: user-level
      gate: build-time
      buildGate: [rpi5, x86]
      apps:
        - apps/30-phpbb.yaml
        - apps/38-forum-bff-db.yaml
        - apps/39-forum-bff-api.yaml
        - apps/49-forum-ui.yaml
      sharedApps: []
      manifestPath: manifests/forum
      esoFile: null
      esoKeys: []
      gatewayHost: null
      # fe-gateway route ids serving the forum UI + BFF (apps/20-gateway-fe.yaml).
      gatewayRouteIds: [forum-ui, hugmesh-forum-bff-api, hugmesh-forum-bff-api-moderation]
      routeAccessRows:
        - { gateway: hugmesh-fe-gateway, urlPattern: /social/forum/** }
        - { gateway: hugmesh-fe-gateway, urlPattern: /bff/forum/admin/** }
        - { gateway: hugmesh-fe-gateway, urlPattern: /bff/forum/moderation/** }
        - { gateway: hugmesh-fe-gateway, urlPattern: /bff/forum/** }
        - { gateway: hugmesh-be-gateway, urlPattern: /api/forum/admin/** }
      federationModule: { slug: forum, mountAt: /social/forum, changeset: "022-register-forum-module.xml" }
      casdoorSeed: null

    # ── games — HugMesh Game Studio (x86 GPU worker) + games-realm Casdoor ──
    # games owns its OWN Casdoor (casdoor-games, two-Casdoor architecture). The
    # public host is GAMES_DOMAIN (default games.${CLUSTER_DOMAIN}); see the
    # gamesDomain block + docs/OPTIONAL-SERVICES.md "Games subdomain".
    - slug: games
      displayName: "HugMesh Game Studio"
      namespace: hugmesh-games
      # DEFAULT-OFF (policy 2026-06-17): games is OPT-IN — add it explicitly
      # (--enable-games / 'games' in --optional-services / OPTIONAL_SERVICES=all).
      default: off
      tier: user-level
      gate: build-time
      buildGate: [rpi5, x86]
      apps:
        - apps/06-casdoor-games.yaml
        - apps/50-games.yaml
        # GAMES APP-STORE (games-services control plane) rides the games slug: it needs
        # the games namespace up, so it is pruned/installed WITH games (gate_optional_
        # services games) case + _opt_render_installed_services flips 13c's installed flag).
        - apps/13c-games-instances.yaml
      sharedApps: []
      manifestPath: manifests/games
      # casdoor-games has its own manifest dir, also pruned with the slug. The games-
      # services control plane adds the per-instance isolation manifests (games-instances)
      # — pruned with games too.
      extraManifestPaths:
        - manifests/casdoor-games
        - manifests/games-instances
      esoFile: null
      esoKeys: [casdoor-games-db, casdoor-games-app]
      # NOTE: the games host is GAMES_DOMAIN (parameterized below), NOT a
      # hugmesh.net subdomain literal — see gamesDomain.
      gatewayHost: games.${GAMES_DOMAIN}
      # games = the games portal host route; games-servers-console = the games app-store
      # per-instance HTTP console path-route (both pruned when games is deselected).
      gatewayRouteIds: [games, games-servers-console]
      routeAccessRows:
        - { gateway: hugmesh-be-gateway, urlPattern: /games/api/admin/** }
        - { gateway: hugmesh-be-gateway, urlPattern: /games/** }
        - { gateway: hugmesh-fe-gateway, urlPattern: /games/admin/** }
        # ── games-services control-plane rows (degrade with games) ──
        - { gateway: hugmesh-be-gateway, urlPattern: /bff/superadmin/games-services/** }
        - { gateway: hugmesh-be-gateway, urlPattern: /bff/games-services/instances/** }
        - { gateway: hugmesh-be-gateway, urlPattern: /bff/games-services/catalog/** }
        - { gateway: hugmesh-be-gateway, urlPattern: /games/servers/** }
        - { gateway: hugmesh-fe-gateway, urlPattern: /admin/games-services/** }
      federationModule: { slug: games, mountAt: /games, changeset: "025-register-games-module.xml" }
      casdoorSeed: casdoor-games

    # ── tube — LocalTube (YouTube archive, GPU-gated x86 worker) ──────────────
    # LocalTube archives the user's subscribed YouTube channels via yt-dlp.
    # DEFAULT-OFF: requires an x86 amd64 GPU node for transcoding capacity.
    # The tube-bff-api handles Google OAuth sync + download queue; the Nginx
    # media sidecar serves the signed-URL-gated content (/tube/content/**).
    - slug: tube
      displayName: "LocalTube (YouTube archive)"
      namespace: hugmesh-tube
      default: off
      tier: user-level
      gate: build-time
      buildGate: [rpi5, x86]
      apps:
        - apps/53-tube.yaml
      sharedApps: []
      manifestPath: manifests/tube
      esoFile: manifests/external-secrets/tube-externalsecrets.yaml
      esoKeys: [tube-media-key, tube-token-dek, google-oauth]
      gatewayHost: null
      gatewayRouteIds: [hugmesh-tube-bff-api, tube-content]
      routeAccessRows:
        - { gateway: hugmesh-fe-gateway, urlPattern: /bff/tube/** }
        - { gateway: hugmesh-be-gateway, urlPattern: /tube/content/** }
      federationModule: { slug: tube, mountAt: /tube, changeset: "033-register-tube-module.xml" }
      casdoorSeed: null

    # ── owncast — Owncast live-streaming (GPU-gated x86 worker) ──────────────
    # Owncast HLS live streaming for domain users. Superadmin enables per-domain;
    # admins may grant users ROLE_OWNCAST to broadcast. DEFAULT-OFF: GPU-gated.
    - slug: owncast
      displayName: "Owncast (live streaming)"
      namespace: hugmesh-owncast
      default: off
      tier: user-level
      gate: build-time
      buildGate: [rpi5, x86]
      apps:
        - apps/52-owncast.yaml
      sharedApps: []
      manifestPath: manifests/owncast
      esoFile: null
      esoKeys: []
      gatewayHost: null
      gatewayRouteIds: [hugmesh-owncast-bff-api]
      routeAccessRows:
        - { gateway: hugmesh-fe-gateway, urlPattern: /bff/owncast/admin/** }
        - { gateway: hugmesh-fe-gateway, urlPattern: /bff/owncast/** }
      federationModule: { slug: owncast, mountAt: /owncast, changeset: "031-register-owncast-module.xml" }
      casdoorSeed: null

    # ── character-studio — VN character-studio remote (creator + chat surface) ──
    # The VN (visual-novel) furry/anthro character-studio Angular native-federation
    # REMOTE: layered-2D character creator + chat surface, federated into the
    # hugmesh.net host at /character-studio (ROLE_USER floor). It is a pure
    # FRONTEND micro-frontend served by its own non-root nginx pod in the
    # hugmesh-frontend namespace (no dedicated BFF in this slug yet — it talks to
    # the always-present /bff/** routes), so — like user-ui/forum-ui — it carries NO
    # gateway HOST, NO per-service ESO, and just the one fe-gateway path route +
    # route-access row. DEFAULT-OFF (admin gate): add it explicitly
    # (--with-character-studio / 'character-studio' in --optional-services /
    # OPTIONAL_SERVICES=all). When deselected, gate_optional_services() prunes the
    # Application + manifest dir + the fe-gateway route + the route-access row, and
    # _opt_render_installed_services renders character-studio:"false" so the host
    # greys the entry out instead of 404/502.
    - slug: character-studio
      displayName: "Character Studio (VN)"
      namespace: hugmesh-frontend
      default: off
      tier: user-level
      gate: build-time
      buildGate: [rpi5, x86]
      apps:
        - apps/49b-character-studio-ui.yaml
      sharedApps: []
      manifestPath: manifests/character-studio
      esoFile: null
      esoKeys: []
      gatewayHost: null
      gatewayRouteIds: [character-studio-ui]
      routeAccessRows:
        - { gateway: hugmesh-fe-gateway, urlPattern: /character-studio/** }
      # federation_modules registration lives in the SEPARATE hugmesh-federation-api
      # repo (Liquibase changelog), NOT in this generator repo. That wave HAS LANDED:
      # the changeset is 040-register-character-studio-module.xml (this file predicted
      # "036, the next free number after 035" — 036/037 were taken by the
      # system-findings pair first, so the prediction went stale and pointed at a
      # changeset that does not exist). It mirrors 025-register-games-module.xml
      # field-for-field: slug=character-studio, kind=remote-shell,
      # exposed_module=./routes, mountAt=/character-studio, requiresRole=ROLE_USER.
      # mountAt/requiresRole/exposed are recorded inline here so the generator can
      # derive the registration; scripts/validate-federation-module-slugs.sh re-reads
      # the named changeset and fails if it is absent or disagrees.
      federationModule:
        slug: character-studio
        mountAt: /character-studio
        requiresRole: ROLE_USER
        exposed: ./routes
        changeset: "040-register-character-studio-module.xml"   # in hugmesh-federation-api (separate repo)
      casdoorSeed: null

    # ── character-forge — Character Forge (3D character maker + XR chat avatars) ──
    # The 3D character generator that maps the VN (character-studio) SVG characters
    # onto parameterized 3D rigs (Char3DConfig), and the avatar source for the
    # "Shadows of the Net" XR chat room (docs/XR-CHAT.md). A MULTI-APP slug shaped
    # like phpbb (BFF db + BFF api + UI remote), combined with the character-studio
    # frontend pattern:
    #   * character-forge-bff-db  (38b) — dedicated Postgres, hugmesh-backend
    #   * character-forge-bff-api (39b) — Spring BFF at /bff/character-forge/**
    #     (ROLE_USER floor; Char3DConfig CRUD + active-config lookup + VN→3D /map)
    #   * hugmesh-character-forge-ui (49c) — Angular native-federation remote at
    #     /character-forge (ROLE_USER floor), nginx-unprivileged :8080, embedding
    #     the Godot WASM maker from its own same-origin assets
    # No gateway HOST; two fe-gateway path routes + two route-access rows. The BFF's
    # ESO secrets ride the SHARED external-secrets files (secretstore.yaml db-auth
    # pair + pki-externalsecrets.yaml mTLS certs, exactly like forum-bff's), so —
    # like phpbb — esoFile is null here and the shared files are NOT pruned with the
    # slug (the unused Secrets are inert without their consumer pods).
    # DEFAULT-OFF (admin gate): add it explicitly (--with-character-forge /
    # 'character-forge' in --optional-services / OPTIONAL_SERVICES=all). When
    # deselected, gate_optional_services() prunes the three Applications + the three
    # manifest dirs + both fe-gateway routes + both route-access rows, and
    # _opt_render_installed_services renders character-forge:"false" so the host
    # greys the entry out instead of 404/502. Soft dependency: character-studio (VN
    # character import); the /map + forge surfaces degrade gracefully without it.
    - slug: character-forge
      displayName: "Character Forge (3D)"
      # Primary namespace = where the BFF + its DB land (the UI remote lands in
      # hugmesh-frontend via its own Application, like phpbb's forum-ui).
      namespace: hugmesh-backend
      default: off
      tier: user-level
      gate: build-time
      buildGate: [rpi5, x86]
      apps:
        - apps/38b-character-forge-bff-db.yaml
        - apps/39b-character-forge-bff-api.yaml
        - apps/49c-character-forge-ui.yaml
      sharedApps: []
      manifestPath: manifests/character-forge
      extraManifestPaths:
        - manifests/character-forge-bff-api
        - manifests/character-forge-bff-db
      esoFile: null
      esoKeys: []
      gatewayHost: null
      gatewayRouteIds: [character-forge-ui, hugmesh-character-forge-bff-api]
      routeAccessRows:
        - { gateway: hugmesh-fe-gateway, urlPattern: /character-forge/** }
        - { gateway: hugmesh-fe-gateway, urlPattern: /bff/character-forge/** }
      # federation_modules registration lives in the SEPARATE hugmesh-federation-api
      # repo (Liquibase changelog), NOT in this generator repo. It landed as
      # 038-register-character-forge-module.xml, plus a follow-up
      # 039-rebrand-character-forge-remote-entry.xml repointing remote_entry_url.
      # mountAt/requiresRole/exposed are recorded inline here to match the landed row.
      federationModule:
        slug: character-forge
        mountAt: /character-forge
        requiresRole: ROLE_USER
        exposed: ./routes
        changeset: "038-register-character-forge-module.xml"   # in hugmesh-federation-api (separate repo); see also 039-rebrand-character-forge-remote-entry.xml
      casdoorSeed: null

    # ── edge-ai — GPU inference node serving an OpenAI-compatible model API ─────
    # Runs Ollama on an NVIDIA GPU worker (the edge_ai role, or be+gpu / omnibus)
    # and serves /v1/chat|embeddings|models on :11434. Other mesh nodes consume it
    # in-cluster (ClusterIP) AND over the tailnet via the be-gateway host route
    # ai.${CLUSTER_DOMAIN}. The model LIBRARY (catalog/preload/runtime/serving knobs)
    # is the edge-ai-models ConfigMap — admin/superadmin editable (Service-Catalog).
    # DEFAULT-OFF: GPU-gated; auto-selected by the edge_ai node role. The
    # nvidia-device-plugin (apps/01d, always-on infra) advertises nvidia.com/gpu so
    # this — and the existing GPU services (owncast/coturn/tube voice+video) — schedule.
    - slug: edge-ai
      displayName: "Edge AI (inference)"
      namespace: hugmesh-inference
      default: off
      tier: infra
      gate: build-time
      buildGate: [rpi5, x86]
      apps:
        - apps/54-edge-ai.yaml
      sharedApps: []
      manifestPath: manifests/edge-ai
      esoFile: null
      esoKeys: []
      # Public host fronted by the be-gateway (Host predicate); the OpenAI-compatible
      # /v1 surface is reachable on the tailnet through it, role-gated.
      gatewayHost: ai.${CLUSTER_DOMAIN}
      gatewayRouteIds: [edge-ai]
      routeAccessRows:
        - { gateway: hugmesh-be-gateway, urlPattern: /v1/** }
      federationModule: null
      casdoorSeed: null

