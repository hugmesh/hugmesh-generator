      default: off
      tier: infra
      gate: build-time
      buildGate: [rpi5, x86]
      apps:
        - apps/55-edge-ai-analysis.yaml
      sharedApps: []
      manifestPath: manifests/edge-ai-analysis
      esoFile: null
      esoKeys: []
      # Shares the edge-ai be-gateway host (ai.${CLUSTER_DOMAIN}); the /v1/analyze/**
      # path route is MORE SPECIFIC than edge-ai's /v1 host-catchall, declared first.
