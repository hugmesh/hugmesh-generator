    # ── coturn — TURN/STUN relay for Matrix WebRTC audio/video (DEFAULT-OFF) ───
    # coturn relays peer-to-peer Matrix (tuwunel) voice/video when a direct ICE
    # path fails. It lands in hugmesh-backend ALONGSIDE tuwunel so the
    # long-term-credential shared secret (Secret coturn-shared-secret, ESO-synced
    # from Vault) is reachable by BOTH coturn (validates client creds) and tuwunel
    # (mints them — turn_secret in tuwunel.toml references the SAME secret).
    #
    # RUNTIME-ONLY (anubis pattern): NO hardcoded apps/*.yaml. Unlike akkoma/owncast
    # (which ship a bootstrap-seed Application the build-time gate prunes), coturn is
    # wired ONLY through the runtime optional-services ApplicationSet (apps/13a) with
    # installed:"false". This keeps it genuinely DEFAULT-OFF without a build-time
    # prune branch (the recurse root would otherwise auto-deploy a baked Application),
    # and it is created/pruned at runtime by flipping the `coturn` flag in the
    # installed-services ConfigMap (the documented live add/remove lever) + the 13a
    # element. A DEFAULT build is byte-identical to today's mainline (no pod, Matrix
    # clients keep host-only ICE: iceServers:[]).
    #
    # coturn owns NO gateway HOST and NO gateway routes: it is a direct UDP/TCP relay
    # (3478 STUN/TURN + 5349 TLS + a relay window), discovered by clients via the
    # Matrix voip/turnServer endpoint tuwunel serves — NOT via the be-gateway. PUBLIC
    # reachability of those ports is the OPT-IN manifests/coturn-public overlay
    # (repoint the 13a element's path; hostNetwork + external-ip knob + turns: cert
    # + the /etc/hugmesh/coturn-public node-firewall marker) — docs/COTURN.md §5.
    - slug: coturn
      displayName: "coturn (TURN/STUN server)"
      namespace: hugmesh-backend
      default: off
      tier: infra
      gate: runtime          # no bootstrap Application to prune — 13a element + ConfigMap flag only
      buildGate: []
      # RUNTIME-ONLY: no bootstrap Application (see header) — gated solely by the
      # 13a ApplicationSet element + the installed-services ConfigMap flag.
      apps: []
      sharedApps: []
      manifestPath: manifests/coturn
      # Per-service ExternalSecret file (the TURN long-term-credential shared
      # secret; ESO/Vault only, never inline). Shared by coturn + tuwunel.
      esoFile: manifests/external-secrets/coturn-externalsecrets.yaml
      esoKeys: [coturn-shared-secret]
      gatewayHost: null           # no public HTTP host; direct UDP/TCP relay
      gatewayRouteIds: []         # no gateway routes
      routeAccessRows: []         # no gateway route-access gating
      federationModule: null      # signalled to clients via Matrix voip/turnServer
      casdoorSeed: null

    # ── meshbridge — Meshtastic LoRa mesh <-> Matrix bridge (DEFAULT-OFF) ──────
    # meshbridge attaches LoRa mesh radios (USB-serial, LoRa-WiFi TCP:4403, or a
    # WAN-linked mesh via Meshtastic's MQTT JSON integration) and bridges their
    # text traffic into tuwunel as a Matrix APPSERVICE (exclusive @mesh-.* user
    # namespace; per-room opt-in via the net.hugmesh.mesh.bridge state
    # event). See docs/MESHTASTIC-BRIDGE.md. It lands in hugmesh-backend
    # ALONGSIDE tuwunel because the appservice speaks the plain in-namespace CS
    # API (tuwunel:8008) and receives AS transaction pushes on :8009 — neither
    # leg ever transits a gateway.
    #
    # RUNTIME-ONLY (the coturn/anubis pattern): NO hardcoded apps/*.yaml — wired
    # ONLY through the runtime optional-services ApplicationSet (apps/13a) with
    # installed:"false", created/pruned at runtime by flipping the `meshbridge`
    # flag in the installed-services ConfigMap + the 13a element. A DEFAULT
    # build is byte-identical to today's mainline (no pod, no policy, no rooms
    # bridged).
    #
    # dependsOn tuwunel: like coturn, the dependency is declared in the
    # installed-services services.json entry (the admin console greys meshbridge
    # when tuwunel is off) — the bridge is meaningless without the homeserver it
    # posts into. meshbridge owns NO gateway HOST and NO gateway routes: nothing
    # user-facing speaks HTTP to it (rooms opt in via Matrix state events; radio
    # registration is a user-bff surface that user-bff already owns).
    - slug: meshbridge
      displayName: "Mesh radio bridge (Meshtastic ↔ Matrix)"
      namespace: hugmesh-backend
      default: off
      tier: infra
      gate: runtime          # no bootstrap Application to prune — 13a element + ConfigMap flag only
      buildGate: []
      # RUNTIME-ONLY: no bootstrap Application (see header) — gated solely by the
      # 13a ApplicationSet element + the installed-services ConfigMap flag.
      apps: []
      sharedApps: []
      manifestPath: manifests/meshbridge
      # Per-service ExternalSecret file (appservice token pair + Casdoor machine
      # client + optional MQTT broker password; ESO/Vault only, never inline).
      esoFile: manifests/external-secrets/meshbridge-externalsecrets.yaml
      esoKeys: [meshbridge-appservice]
      gatewayHost: null           # no public HTTP host; AS push + CS API are in-namespace
      gatewayRouteIds: []         # no gateway routes
      routeAccessRows: []         # no gateway route-access gating
      federationModule: null      # surfaces ride existing modules (rooms UI / user-bff)
      # casdoorSeed models a per-slug Casdoor INSTANCE (games), not client
      # seeding — the bridge's client-credentials client (ROLE_SERVICE, for
      # user-bff's internal mesh-devices surface) is provisioned MANUALLY at
      # enable time; see the meshbridge-externalsecrets.yaml header.
      casdoorSeed: null

    # ── egress-vpn — node-level split-tunnel egress VPN (DEFAULT-OFF) ──────────
    # UNLIKE the others, egress-vpn is a NODE service (a wg-quick/openvpn OpenRC
    # service + a signed-export reconcile agent on the MESH NODES), NOT a cluster
    # Application — so it owns NO apps[]/gatewayHost/routeAccessRows. Its gate is
    # NODE-LEVEL: when NOT selected, the build prunes net-vpn/wireguard-tools +
    # net-vpn/openvpn from the node packages.list AND does NOT link the
    # hugmesh-vpn-reconcile service / cron (the hugmesh-egress-vpn service
    # itself is always baked but inert). When selected, the reconcile service + cron
    # are linked so the node converges from the signed /export. The control plane
    # (vpn_config/vpn_node_assignment) lives in admin-bff; the K8s Secret carrying a
    # config's bytes is materialised by ESO under the per-config secret_ref. Service
    # opt-in is NODE-PLACEMENT-driven: a DOMAIN/NODE assignment marks the public pods
    # (akkoma/tuwunel/coturn) via the hugmesh.net/vpn-egress=true label; the
    # NetworkPolicy interaction (manifests/networkpolicy/egress-vpn-interaction.yaml)
    # loosens akkoma/tuwunel egress ONTO the VPN only on an explicit assignment.
    - slug: egress-vpn
      displayName: "Egress VPN (split-tunnel)"
      namespace: hugmesh-backend
      default: off
      tier: infra
      gate: build-time       # NODE-level: packages.list + service links, not an Application
      buildGate: [rpi5, x86]
      scope: node            # NODE service, not a cluster Application
      apps: []
      sharedApps: []
      manifestPath: manifests/networkpolicy   # only the interaction NetworkPolicy
      esoFile: null
      esoKeys: []
      gatewayHost: null
      gatewayRouteIds: []
      routeAccessRows: []
      federationModule: null
      casdoorSeed: null
      # NODE-level gate artefacts (pruned/linked by gate_optional_services):
      nodePackages: [net-vpn/wireguard-tools, net-vpn/openvpn]
      nodeServices: [hugmesh-egress-vpn, hugmesh-vpn-reconcile]
      # The per-service opt-in label the NetworkPolicy interaction keys off.
      vpnEgressLabel: hugmesh.net/vpn-egress
      # ── Runtime config-byte DELIVERY (the ESO Secret -> node hostPath hop) ────
      # The reconcile agent reads the config BYTES from ${VPN_SECRET_DIR}/<secretRef>
      # on the node HOST (hugmesh-vpn-reconcile:52, default /etc/hugmesh/vpn-secret).
      # This second manifest tree + its MANUAL-sync Application are the projector
      # that puts them there. Both SHIP DARK (kustomization resources: [] AND a
      # nodeSelector no node carries) and are pruned WITH the slug alongside the
      # interaction NetworkPolicy.
      deliveryManifestPath: manifests/egress-vpn
      deliveryApp: apps/13e-egress-vpn.yaml
      # ⚠ THE THREE FIELDS BELOW ARE **COPIES**, NOT DECLARATIONS. This registry
      # is the source of truth for WHICH optional services exist and what each
      # one owns; it is NOT the source of truth for the egress-VPN config-Secret
      # contract. That lives in ONE file — specs/cluster/egress-vpn-secret-
      # contract.env — because the contract spans two repositories that never
      # build together (this repo reads the Secrets, hugmesh-admin-bff-api writes
      # them), and the two halves already merged green once while disagreeing.
      # tests/egress-vpn/test-secret-contract.sh asserts these three lines against
      # that file (and against the admin-bff writer source), so editing one here
      # without editing the contract goes red immediately.
      #
      # `secretKey` said `config` from the day this entry was written and was
      # never asserted by anything — the same wrong value the projector manifest
      # shipped, in a fourth copy no test read. admin-bff writes
      # `.addToStringData(secretRef, configBody)`: the data key IS the Secret's
      # own metadata.name. `@name` is the contract's sentinel for that derivation
      # (a Secret data key may only contain alphanumerics, '-', '_' or '.' —
      # core/v1 Secret API reference — so `@name` can never collide with a real
      # key). It MUST stay QUOTED here: `@` is a YAML reserved indicator and
      # cannot start a plain scalar, so bare `@name` is a parse error, not a
      # string.
      #
      # Selection is by LABEL, never by name, so the control plane keeps minting
      # per-(domain, config) names (`egress-vpn-<domain>-<name>`) with no
      # generator change — but the Secret NAME must equal the export's
      # `secretRef`, because that is the filename the reconcile agent opens.
      secretContract: specs/cluster/egress-vpn-secret-contract.env
      secretNamespace: hugmesh-egress-vpn
      secretLabel: hugmesh.net/optional-service=egress-vpn
      secretKey: "@name"
      nodeDeliveryLabel: hugmesh.net/egress-vpn

    # ── tor — node-level v3 Tor onion (hidden) service (DEFAULT-OFF) ──────────
    # LIKE egress-vpn, tor is a NODE service (the DISTRO Tor daemon — net-vpn/tor,
    # /etc/init.d/tor — plus a hugmesh reconcile agent on the MESH NODES), NOT a
    # cluster Application, so it owns NO apps[]/gatewayHost/routeAccessRows. Its gate
    # is NODE-LEVEL: when NOT selected the build omits net-vpn/tor from the node
    # packages AND does NOT link the tor + hugmesh-tor-reconcile services (so the
    # daemon is simply absent). When selected, the reconcile agent (oneshot + 24h cron)
    # writes a managed /etc/tor/torrc, mints + PERSISTS the v3 onion keypair OFF-GIT
    # under /var/lib/tor/hugmesh-onion (tor:tor 0700; never a Secret, never git) on
    # first boot, and exposes the in-cluster fe-gateway as a stable .onion — INBOUND
    # reachability with no public IP / DDNS / Cloudflare. The per-service opt-in label
    # (hugmesh.net/tor-onion) keys the NetworkPolicy interaction
    # (manifests/networkpolicy/tor-onion-marked.yaml) — a forward-hook for the OPT-IN
    # pod-egress-via-tor capability (inert by default). nodeServices lists the DISTRO
    # `tor` service (baked with the package) + our reconcile agent — BOTH are linked
    # into the default runlevel when selected on a cluster-node role (decision 70 = B on
    # hugmesh-generator#347; the reconcile converges an already-running tor with a
    # reload, never a second daemon). nodePackages / nodeServices / the upstream below
    # are CONSUMED: tests/scripts/test-tor-node-contract.sh asserts each equals what
    # both builders' tor gates (TOR_NODE_PACKAGES / TOR_NODE_SERVICES, PLAN_TOR_ONION)
    # and the reconcile agent's default actually do.
    - slug: tor
      displayName: "Tor (v3 hidden service)"
      namespace: hugmesh-backend
      default: off
      tier: infra
      gate: build-time       # NODE-level: packages.list + service links, not an Application
      buildGate: [rpi5, x86]
      scope: node            # NODE service, not a cluster Application
      apps: []
      sharedApps: []
      manifestPath: manifests/networkpolicy   # only the interaction NetworkPolicy
      esoFile: null
      esoKeys: []
      gatewayHost: null
      gatewayRouteIds: []
      routeAccessRows: []
      federationModule: null
      casdoorSeed: null
      # NODE-level gate artefacts (added/linked by the SVCS/PKGS gates; the
      # NetworkPolicy is pruned by gate_optional_services when NOT selected):
      nodePackages: [net-vpn/tor]
      nodeServices: [tor, hugmesh-tor-reconcile]
      # The per-service opt-in label the NetworkPolicy interaction keys off.
      torOnionLabel: hugmesh.net/tor-onion
      # The upstream the v3 hidden service's :443 (HTTPS) exposes (host:port). A
      # HOST-level Tor daemon can't resolve cluster DNS, so the default is the edge that
      # binds on HARDWARE: ingress-nginx hostNetwork :443 on the hugmesh.net/backend node
      # (apps/10-ingress-nginx.yaml). Any other node — or a host tor fronting kind, whose
      # port map is 127.0.0.1:8443 — overrides it via /etc/hugmesh/tor/upstream.
      torHiddenServiceUpstream: 127.0.0.1:443

    # ── workloadConsole — podman/OpenShift-equivalent pod console (DEFAULT-OFF) ──
    # UNLIKE the deployed services, the Workload Console is RBAC + route-access + an
    # admin-bff deployment overlay: the BFF endpoints (/bff/{admin,superadmin}/
    # workloads/**) live in the always-present admin-bff, and the federated admin-ui
    # remote is a HIDDEN-tier module the host loads only when the grant guard passes.
    # This slug owns the two-SA RBAC Application (apps/14-workload-console-rbac.yaml +
    # manifests/workload-console-rbac: read app-tier-only + mutate SAs + their two token
    # Secrets + the superadmin cluster-read SA/ClusterRole + the deploy-provenance
    # Kyverno policy), the admin-bff deployment overlay (manifests/admin-bff-api/
    # workload-console-patch.yaml + its kustomization `- path:` line — WORKLOAD_CONSOLE_*
    # env + both SA token mounts), and the two route-access rows. SHIPS DARK: default
    # off (deselected => everything above is pruned and the admin-bff renders
    # byte-identical dark); even when selected — which lights the generator gate + the
    # k8s seam via the overlay — the console stays dark until the DB master flag + an
    # active TTL'd grant (docs/OPTIONAL-SERVICES.md §7.2). The DANGEROUS surfaces are
    # tailnet-only by deployment.
    - slug: workloadConsole
      displayName: "Workload Console"
      namespace: hugmesh-backend
      default: off
      tier: infra
      gate: build-time
      buildGate: [rpi5, x86]
      apps:
        - apps/14-workload-console-rbac.yaml
      sharedApps: []
      manifestPath: manifests/workload-console-rbac
      esoFile: null
      esoKeys: []
      gatewayHost: null
      gatewayRouteIds: []
      # The console UI remote is a HIDDEN federation tier (registered but never auto-
      # surfaced; the host loads it only when the grant guard passes) — NOT a normal
      # auto-mounted federationModule.
      hiddenModule: { slug: workloadConsole, mountAt: /admin/workloads }
      routeAccessRows:
        - { gateway: hugmesh-be-gateway, urlPattern: /bff/superadmin/workloads/** }
        - { gateway: hugmesh-be-gateway, urlPattern: /bff/admin/workloads/** }
      federationModule: null
      casdoorSeed: null

    # ── headwind — Headwind MDM (Apache-2.0 Android device-owner DPC), devops-only ──
    # Admin-only devops tool (Harbor/superadmin posture, ns hugmesh-pki),
    # TAILNET-ONLY. Rides the EXISTING superadmin-gateway (apps/22-gateway-
    # superadmin.yaml) for its two routes rather than owning a gatewayHost/Ingress
    # of its own — same non-gatewayHost posture as workloadConsole immediately
    # above, and consistent with every other non-be/fe-gateway optional-service
    # (coturn/tube/owncast/meshbridge all set gatewayHost: null too). The
    # superadmin console itself resolves via a LITERAL host
    # (superadmin.hugmesh.net) + a LAN/VPN /etc/hosts alias, never a
    # public wildcard — the OPTIONAL headwind.<domain> friendly alias, if ever
    # added, is an `ingress.extraHosts` entry on that SAME Application, not a
    # second Ingress/Application.
    - slug: headwind
      displayName: "Headwind MDM (managed phones)"
      namespace: hugmesh-pki
      default: off
      tier: infra
      gate: build-time
      buildGate: [rpi5, x86]
      apps:
        - apps/23-headwind.yaml
      sharedApps: []
      manifestPath: manifests/headwind
      esoFile: manifests/external-secrets/headwind-externalsecrets.yaml
      esoKeys: [headwind-db-auth, headwind-admin]
      gatewayHost: null
      gatewayRouteIds: [headwind-console, headwind-checkin]
      routeAccessRows:
        - { gateway: hugmesh-superadmin-gateway, urlPattern: /hmdm/manage/** }  # human console, ROLE_SUPERADMIN
        - { gateway: hugmesh-superadmin-gateway, urlPattern: /hmdm/rest/**   }  # device check-in, PUBLIC (own token; network-locked)
      federationModule: null
      casdoorSeed: null

    # ── attestation-server — GrapheneOS AttestationServer (hardware trust root) ──
    # Verifies GrapheneOS/Auditor hardware-attestation submissions. SQLite-backed
    # (single pod, no cluster DB engine), no Ingress — reachable only through the
    # apps/22-gateway-superadmin.yaml routes below (tailnet-only), same posture as
    # headwind. 3-route split: device/Auditor-app calls (PUBLIC, network-locked)
    # vs. the browser/console (ROLE_SUPERADMIN) — /attest/api/status is
    # device-facing despite the /api/ prefix, so it gets its own PUBLIC row and
    # MUST be evaluated before the /attest/api/** console row.
    - slug: attestation-server
      displayName: "GrapheneOS AttestationServer (Hardware Trust Root)"
      namespace: hugmesh-pki
      default: off
      tier: infra
      gate: build-time
      buildGate: [rpi5, x86]
      apps:
        - apps/24-attestation-server.yaml
      sharedApps: []
      manifestPath: manifests/attestation-server
      esoFile: manifests/external-secrets/attestation-server-externalsecrets.yaml
      esoKeys: [attestation-server-smtp]
      gatewayHost: null
      gatewayRouteIds: [attestation-auditor, attestation-status, attestation-console]
      routeAccessRows:
        - { gateway: hugmesh-superadmin-gateway, urlPattern: /attest/auditor/**        }  # device/Auditor-app check-in, PUBLIC (tailnet-locked)
        - { gateway: hugmesh-superadmin-gateway, urlPattern: /attest/api/status        }  # device-facing despite /api/ prefix, PUBLIC — must precede /attest/api/** below
        - { gateway: hugmesh-superadmin-gateway, urlPattern: /attest/api/create-account }  # explicit DENY: CreateAccountHandler has no app-layer auth — must precede /attest/api/** below
        - { gateway: hugmesh-superadmin-gateway, urlPattern: /attest/api/**            }  # human console, ROLE_SUPERADMIN
      federationModule: null
      casdoorSeed: null

    # ── anubis — proof-of-work anti-scraper gate fronting public ingress ──────
    # Anubis (github.com/TecharoHQ, ghcr.io/techarohq/anubis) sits in front of the
    # fe-gateway (TARGET=hugmesh-fe-gateway) on its :8923 PoW gate and exposes a
    # :9090 metrics/health listener that the superadmin admin-bff proxies
    # (/bff/admin/anubis/{status,metrics}; ANUBIS_ENABLED/ANUBIS_MANAGEMENT_URL).
    #
    # ENV-CONDITIONAL DEFAULT (the PUBLIC PoW shield policy — NOT a plain default):
    #   * ENV=prod  => ON  by default ("all shields up": the public front door is
    #                  PoW-gated, and the build reroutes the fe-gateway public
    #                  Ingress THROUGH Anubis :8923 -> fe-gateway).
    #   * ENV=test  => OFF by default (no PoW interstitial on a LAN/test build).
    #   * Explicit operator choice ALWAYS wins: list "anubis" to force ON, or
    #     "-anubis"/"no-anubis" to force OFF (in either ENV).
    # The `default: off` below is the SAFE TEST BASELINE shipped in the ConfigMap;
    # _opt_render_installed_services() in scripts/_optional-services-lib.sh (via
    # _opt_anubis_installed) FLIPS it to "true" for PROD builds. No gatewayHost/
    # route-access rows (it is an INGRESS-layer gate, not a /bff/** upstream); when
    # OFF the BFF's AnubisClient degrades to "unreachable" (no 503) and the public
    # ingress routes straight to the fe-gateway (direct, unshielded path).
    - slug: anubis
      displayName: "Anubis (anti-scraper PoW gate)"
      namespace: hugmesh-frontend
      # SAFE TEST BASELINE. PROD flips this on at build time (ENV-conditional —
      # see the ENV policy note above); the operator can override either way.
      default: off
      tier: infra
      gate: runtime          # no bootstrap Application to prune — 13a element + ConfigMap flag only
      # buildGate: BOTH builders, since 2026-08-26. This column said [rpi5] while
      # x86 carried NO anubis handling at all — that divergence was defect #2 of
      # the x86 builder drift (an `--env prod` x86 image shipped the PUBLIC PoW
      # shield OFF and the fe-gateway ingress un-rerouted). The fix EXTRACTED the
      # whole gate into scripts/_optional-services-lib.sh, which both builders
      # source, so _opt_anubis_installed / _opt_render_installed_services /
      # _opt_wire_anubis_ingress now resolve identically from x86. The column is
      # the metadata half of that fix: leaving it at [rpi5] made x86's own slug
      # validator REFUSE a slug x86 genuinely bakes.
      buildGate: [rpi5, x86]
      # The public PoW shield obeys the ENV policy (prod-on / test-off) rather than
      # plain presence in OPTIONAL_SERVICES.
      envConditional:
        prod: on
        test: off
      # NO hardcoded apps/*.yaml: unlike akkoma/games (which ship a bootstrap-seed
      # Application that the build-time gate prunes), Anubis is wired ONLY through
      # the runtime optional-services ApplicationSet (apps/13a) with installed:
      # "false". This keeps it genuinely DEFAULT-OFF without a build-time prune
      # branch (the recurse root would otherwise auto-deploy a baked Application),
      # and it is created/pruned by flipping the `anubis` flag in the
      # installed-services ConfigMap — the documented live add/remove lever.
      apps: []
      sharedApps: []
      manifestPath: manifests/anubis
      esoFile: null
      esoKeys: []
      gatewayHost: null
      gatewayRouteIds: []
      routeAccessRows: []
      federationModule: null
      casdoorSeed: null

    # ═════════════════════════════════════════════════════════════════════════
    # INFRA TIER — cluster-platform services (registered 2026-08-26).
    #
    # Until now these were HARDCODED cluster apps: present in apps/ on every
    # image, selectable nowhere — not a slug in this registry, not a key in the
    # installed-services ConfigMap, not a 13a element, not a builder gate arm,
    # not a Studio catalogue entry. The operator asked for them to be first-class
    # SELECTABLE services. This unit does the REGISTRY half ONLY.
    #
    # ⚠️ EVERY ROW BELOW IS `gate: none`, AND THAT IS THE HONEST STATE, NOT AN
    # OVERSIGHT. Nothing reads them yet: there is no gate_optional_services case
    # arm, no ConfigMap key and no 13a element for any of them. Writing
    # `gate: build-time` here would be exactly the headwind lie the `gate:` key
    # was added to prevent — a row that looks wired and prunes nothing.
    # Consequently the builders REFUSE these slugs on --optional-services
    # (validate_optional_services in build-x86-host-stage4.sh) instead of
    # silently ignoring them: a build that asks for something that cannot happen
    # must fail, not succeed while doing nothing.
    #
    # The gate arms are unit A4. They are deliberately NOT implemented here
    # because pruning an infra Application from the BAKED tree is meaningless
    # until the device actually syncs from the pruned tree — the live cluster
    # syncs apps/ from the gitops repo, so a build-time prune only stops the
    # one-time bootstrap seed (see the ⚠ RUNTIME NOTE on gate_optional_services).
    # ═════════════════════════════════════════════════════════════════════════

    # ── metrics-server — the resource-metrics API every v2 HPA reads ──────────
    # Upstream Helm chart (kubernetes-sigs), sync-wave "-1", lands in kube-system.
    # DEFAULT-ON: it is the metric source for every autoscaling/v2 HPA the
    # stateless BFF/UI fleet and the gateway chart ship (manifests/<svc>/hpa.yaml).
    # Deselecting it does NOT delete those HPAs — it strips the API they read, so
    # they degrade to "unknown" targets and stop scaling. That coupling is the
    # first thing unit A4's gate arm has to decide, and it is why this row is
    # registered before any arm exists.
    - slug: metrics-server
      displayName: "metrics-server (resource metrics API)"
      namespace: kube-system
      default: on
      tier: infra
      gate: none
      buildGate: []
      gateReason: >-
        REGISTRY-ONLY (unit A3). No gate_optional_services arm, no
        installed-services ConfigMap key and no 13a element exist for this slug;
        the builders therefore refuse it on --optional-services. Gating is unit
        A4, and it must first answer what happens to the ~dozen autoscaling/v2
        HPAs that read this API when it is absent.
      apps:
        - apps/01-metrics-server.yaml
      sharedApps: []
      # Upstream Helm chart, not an in-repo kustomization — nothing under manifests/.
      manifestPath: null
      esoFile: null
      esoKeys: []
      gatewayHost: null
      gatewayRouteIds: []
      routeAccessRows: []
      federationModule: null
      casdoorSeed: null

    # ── keda — event-driven autoscaling operator (+ the DARK latency pass) ────
    # Upstream Helm chart (kedacore), sync-wave "-1", lands in the `keda` ns.
    # KEDA ships IDLE today: apps/01b-keda.yaml installs the operator only, and the
    # ScaledObjects that would use it live in apps/01c-autoscaling-latency.yaml,
    # which is MANUAL-sync dark (no syncPolicy.automated) pending a Prometheus that
    # does not exist in this cluster. Both are listed here because a gate arm that
    # removed the operator and left the ScaledObjects behind would leave orphaned
    # CRs referencing an absent CRD.
    - slug: keda
      displayName: "KEDA (event-driven autoscaling)"
      namespace: keda
      default: on
      tier: infra
      gate: none
      buildGate: []
      gateReason: >-
        REGISTRY-ONLY (unit A3). No gate_optional_services arm, no
        installed-services ConfigMap key and no 13a element exist for this slug;
        the builders therefore refuse it on --optional-services. Gating is unit
        A4, which must prune 01b and 01c together (operator + its dark
        ScaledObjects) or neither.
      apps:
        - apps/01b-keda.yaml
        - apps/01c-autoscaling-latency.yaml
      sharedApps: []
      manifestPath: manifests/autoscaling-latency
      esoFile: null
      esoKeys: []
      gatewayHost: null
      gatewayRouteIds: []
      routeAccessRows: []
      federationModule: null
      casdoorSeed: null

    # ── kyverno — admission-policy engine (+ the two policy Applications) ─────
    # Upstream Helm chart, lands in the `kyverno` ns. ⚠️ INSTALLING KYVERNO IS NOT
    # NEUTRAL: apps/16-reserved-prefixes-policy.yaml and apps/16a-securitycontext-
    # policy.yaml are ClusterPolicies that ENFORCE over the whole platform the
    # moment the engine is present. That is why the three are one slug and not
    # three: deselecting the engine while leaving the policies behind leaves
    # ClusterPolicy objects whose CRD is gone, and selecting the engine on a
    # cluster that has never run the policies turns enforcement on everywhere at
    # once. Unit A4 owns that decision; nothing here changes today's behaviour.
    - slug: kyverno
      displayName: "Kyverno (admission policy engine)"
      namespace: kyverno
      default: on
      tier: infra
      gate: none
      buildGate: []
      gateReason: >-
        REGISTRY-ONLY (unit A3). No gate_optional_services arm, no
        installed-services ConfigMap key and no 13a element exist for this slug;
        the builders therefore refuse it on --optional-services. Gating is unit
        A4, which must treat the engine and its two ClusterPolicy Applications as
        one unit — the policies Enforce platform-wide as soon as the engine is
        present, and outlive it as orphaned CRs if it is pruned alone.
      apps:
        - apps/15-kyverno.yaml
        - apps/16-reserved-prefixes-policy.yaml
        - apps/16a-securitycontext-policy.yaml
      sharedApps: []
      manifestPath: manifests/securitycontext-policy
      extraManifestPaths:
        - manifests/policy
      esoFile: null
      esoKeys: []
      gatewayHost: null
      gatewayRouteIds: []
      routeAccessRows: []
      federationModule: null
      casdoorSeed: null

    # ── observability — Uptrace + OpenTelemetry Collector (logs/traces) ───────
    # HEAVY amd64 tier, already MANUAL-sync (apps/36-observability.yaml has no
    # syncPolicy.automated: it renders Out-Of-Sync on a Pi-only cluster instead of
    # churning). Uptrace DEPENDS on ClickHouse (apps/35-analytics-clickhouse.yaml,
    # also MANUAL) — a dependsOn a gate arm will have to model, and one the
    # MANAGED-services axis already touches (clickhouse is a tier-1/2 managed id,
    # so a managed ClickHouse endpoint is repointed into this deployment by
    # _mgd rewriting manifests/observability/deployment.yaml). No gateway route:
    # uptrace/grafana/clickhouse are deliberately unreachable from outside
    # (20-schema.sql:152 records that as policy).
    - slug: observability
      displayName: "Observability (Uptrace + OpenTelemetry)"
      namespace: observability
      default: off
      tier: infra
      gate: none
      buildGate: []
      gateReason: >-
        REGISTRY-ONLY (unit A3). No gate_optional_services arm, no
        installed-services ConfigMap key and no 13a element exist for this slug;
        the builders therefore refuse it on --optional-services. Gating is unit
        A4. Note it is ALREADY effectively opt-in by a different mechanism
        (MANUAL-sync, no automated block), and its ClickHouse dependency is also
        reachable from the MANAGED_SERVICES axis — A4 must reconcile all three
        rather than add a fourth switch.
      apps:
        - apps/36-observability.yaml
      sharedApps: []
      manifestPath: manifests/observability
      esoFile: null
      esoKeys: []
      gatewayHost: null
      gatewayRouteIds: []
      routeAccessRows: []
      federationModule: null
      casdoorSeed: null

    # ── service-catalog-builder — the superadmin Kaniko build namespace ───────
    # Syncs ONLY the build namespace + its default-deny NetworkPolicy; the Kaniko
    # Job is a template admin-bff instantiates per build, so it is NOT in the
    # kustomization and ArgoCD never applies it. SHIPS DARK already (inert until a
    # build lands there). Registered so the Service-Catalog "build from a
    # Dockerfile/ZIP" capability can be turned off as a unit rather than by
    # deleting a namespace by hand.
    - slug: service-catalog-builder
      displayName: "Service Catalog builder (Kaniko)"
      namespace: hugmesh-service-catalog-builder
      default: on
      tier: infra
      gate: none
      buildGate: []
      gateReason: >-
        REGISTRY-ONLY (unit A3). No gate_optional_services arm, no
        installed-services ConfigMap key and no 13a element exist for this slug;
        the builders therefore refuse it on --optional-services. Gating is unit
        A4, which must also decide what the admin-bff AddService task does when
        the build namespace is absent (today it would fail at Job-create time).
      apps:
        - apps/54-service-catalog-builder.yaml
      sharedApps: []
      manifestPath: manifests/service-catalog-builder
      esoFile: null
      esoKeys: []
      gatewayHost: null
      gatewayRouteIds: []
      routeAccessRows: []
      federationModule: null
      casdoorSeed: null

    # ── optional-services-operator — the OptionalService CRD + seed CRs ───────
    # ⚠️ SELF-REFERENTIAL, and that shapes the gate: this Application deploys the
    # very machinery (the OptionalService CRD, the operator/BFF RBAC and the seed
    # CRs) that the LIVE add/remove path uses to turn services back on. A RUNTIME
    # toggle for it would be a switch that, once flipped off, removes the switch —
    # the ConfigMap/13a lever would have no controller left to honour a flip back.
    #
    # DECISION (recorded here so A4 does not have to re-derive it): this slug is
    # BUILD-TIME-GATE-ONLY. It gets no installed-services ConfigMap key and no 13a
    # element, ever; the only supported way to omit it is to build an image
    # without it, and re-enabling it means a rebuild or a manual `kubectl apply`
    # of the Application. `gate: none` below is today's TRUE state (unit A3 adds
    # no arm at all); A4 must set it to `build-time`, not `runtime`.
    - slug: optional-services-operator
      displayName: "Optional-services operator (OptionalService CRD)"
      namespace: devops
      default: on
      tier: infra
      gate: none
      buildGate: []
      gateReason: >-
        REGISTRY-ONLY (unit A3). No gate_optional_services arm exists yet, so the
        builders refuse this slug on --optional-services. When unit A4 wires it,
        it must be BUILD-TIME ONLY — never a ConfigMap/13a runtime toggle —
        because this Application ships the CRD and RBAC the runtime toggle path
        itself depends on: turning it off at runtime would delete the machinery
        that turns it back on.
      apps:
        - apps/13d-optional-services-operator.yaml
      sharedApps: []
      manifestPath: manifests/optional-services-operator
      esoFile: null
      esoKeys: []
      gatewayHost: null
      gatewayRouteIds: []
      routeAccessRows: []
      federationModule: null
      casdoorSeed: null

  # ── games subdomain / TLD configuration ──────────────────────────────────────
  # GAMES_DOMAIN (brand.conf knob, default games.${CLUSTER_DOMAIN}) is the single
  # value that drives every games host / OIDC issuer / redirect URI. The default
  # serves games as a SUBDOMAIN of the primary domain until the real .games TLD
  # is obtained; flip GAMES_DOMAIN=<brand>.games to switch (see the TLD-flip
  # section of docs/OPTIONAL-SERVICES.md). rebrand_sysroot rewrites the baked
  # hugmesh.games literals to ${GAMES_DOMAIN}; these files carry the values:
  gamesDomain:
    knob: GAMES_DOMAIN
    default: "games.${CLUSTER_DOMAIN}"
    parameterizedFiles:
      - manifests/casdoor-games/app-conf-configmap.yaml      # origin (OIDC iss)
      - manifests/casdoor-games/init-data-configmap.yaml     # redirectUris + websiteUrl/homepageUrl
      - manifests/casdoor-games/init-job.yaml                # redirectUris (reconcile.py re-pins on every PostSync)
      - manifests/games/deployment.yaml                      # CASDOOR_ISSUER_URI
    gatewayHostRoute:
      app: apps/20-gateway-be.yaml
      routeId: games
      uri: http://hugmesh-games.hugmesh-games.svc.cluster.local:8080

  # ── DELIBERATELY NOT REGISTERED ─────────────────────────────────────────────
  # Cluster apps that look like they belong in spec.services and are excluded ON
  # PURPOSE. This block exists so the omission is a DECISION on the record rather
  # than a gap: the failure mode it guards against is somebody "completing" the
  # infra tier by adding a second, independent on/off spelling of a service that
  # is already selectable on another axis — the one-service-two-spellings bug.
  # tests/stack/test-optional-services-exclude.sh asserts that no slug named here
  # also appears in spec.services, so adding the duplicate row goes RED.
  notRegistered:
    - id: image-builder
      apps: [apps/60-image-builder.yaml]
      reason: >-
        ALWAYS-ON by design and CI-enforced. tests/scripts/test-image-builder-always-on.sh
        (+ image_builder_always_on.py) asserts 60-image-builder.yaml lives in apps/ and is
        NOT excluded from the waved app-of-apps root; moving it to apps-optional/ or adding
        it to the root's exclude list turns that suite RED. Registering it as an optional
        slug would create a knob whose only reachable setting is "on".
    - id: harbor
      apps: [apps/03a-harbor.yaml, apps/03b-harbor-provision.yaml]
      reason: >-
        ALREADY selectable on the MANAGED-vs-SELF-HOSTED axis, not an on/off axis.
        `harbor` is a MANAGED_SERVICES id (studio/hugmesh_studio/core/config.py
        MANAGED_SERVICE_TIER3_IDS; build-*-stage4.sh _MGD_TIER3_IDS), where it is
        currently FAIL-CLOSED REFUSED in v1 with a written blocker (registry host literal
        in ~30 kustomizations + dockerconfigjson + kaniko; the robot-account Job has no
        ECR/ACR analog; 12h ECR tokens break static pull secrets; it loses air-gap).
        Adding an INDEPENDENT `harbor` on/off row here would give one service two
        spellings that can disagree — --managed-service harbor=... refused while
        --optional-services harbor accepted, or both set to contradictory values. Whoever
        wants harbor deselectable must RECONCILE the two axes in one change (decide what
        `harbor` means when it is simultaneously managed and deselected) — not add a row.
    - id: velero
      apps: [apps/55-velero.yaml, apps/56-velero-config.yaml]
      reason: >-
        SAME reason as harbor, one tier up: `velero-objectstore` is a TIER-1/2 MANAGED
        id (_MGD_TIER12_IDS / MANAGED_SERVICE_TIER12_IDS) that gate_backing_services()
        already ACTS on — _mgd_velero() repoints the backup object store at a hosted
        endpoint. So velero today has a live, tested selector on the managed axis. A
        second independent on/off row would mean `--managed-service velero-objectstore=s3://...`
        and `--exclude-services velero` can both be given, with no defined precedence.
        Reconcile the axes first (does deselecting velero also invalidate a managed
        object-store endpoint?), then register — this unit deliberately does neither.
