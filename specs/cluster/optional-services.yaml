    # server in-cluster. The on-prem hinge Phase-A consumers reach: AIOps (infra logs →
    # @system Matrix DM) and avatar vision moderation (→ mod queue). dependsOn edge-ai
    # (declared in the installed-services services.json so the console greys it when
    # edge-ai is off); it lives in the same hugmesh-inference namespace and is pruned
