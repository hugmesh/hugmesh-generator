{{- if .Values.autoscaling.enabled }}
# Plain autoscaling/v2 HorizontalPodAutoscaler for this gateway release. Gated on
# .Values.autoscaling.enabled (DEFAULT false — see values.yaml). Modelled on
# manifests/remote-fragment/hpa.yaml: Resource metrics only, CPU + memory. Reads
# the resources.requests from the Deployment; REQUIRES metrics-server
# (apps/01-metrics-server.yaml) and is inert until the metrics API answers.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "snapdragon-gateway.name" . }}
  labels:
    {{- include "snapdragon-gateway.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "snapdragon-gateway.name" . }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    {{- if .Values.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
    {{- end }}
    {{- if .Values.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetMemoryUtilizationPercentage }}
    {{- end }}
{{- end }}
