apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "hugmesh-gateway.name" . }}-routes
  labels:
    {{- include "hugmesh-gateway.labels" . | nindent 4 }}
data:
  # Loaded via SPRING_CONFIG_ADDITIONAL_LOCATION; merges over the image's
  # baked-in application.yml. Defines this gateway's downstream routes.
  application-routes.yml: |
    spring:
      cloud:
        gateway:
          # SCG 5.0 (Spring Boot 4) moved route config to
          # spring.cloud.gateway.server.webflux.*; the legacy spring.cloud.gateway.routes
          # prefix binds nothing under SCG 5.0, so these downstream routes must live
          # under server.webflux to be honoured.
          server:
            webflux:
              routes:
              {{- range .Values.routes }}
                - id: {{ .id }}
                  uri: {{ .uri }}
                  predicates:
                    {{- if .host }}
                    - Host={{ .host }}
                    {{- end }}
                    {{- if .path }}
                    - Path={{ .path }}
                    {{- end }}
                    {{- /* Optional header predicate. Needed by the SPA deep-link
                           fallback route, which must distinguish a browser
                           NAVIGATION (Accept: text/html -> serve the host shell)
                           from a remote's asset/XHR fetch (-> serve the remote).
                           Purely additive: a route without `header` renders
                           byte-identically to before. */}}
                    {{- if .header }}
                    - Header={{ .header }}
                    {{- end }}
                  {{- with .filters }}
                  filters:
                    {{- toYaml . | nindent 20 }}
                  {{- end }}
              {{- end }}
