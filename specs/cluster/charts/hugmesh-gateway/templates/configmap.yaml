apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "hugmesh-gateway.name" . }}-routes
  labels:
    {{- include "hugmesh-gateway.labels" . | nindent 4 }}
data:
  # Loaded via SPRING_CONFIG_ADDITIONAL_LOCATION; merges over the image's
  # baked-in application.yml. Defines this gateway's downstream routes.
  application-routes.yml: |
    spring:
      cloud:
        gateway:
          # SCG 5.0 (Spring Boot 4) moved route config to
          # spring.cloud.gateway.server.webflux.*; the legacy spring.cloud.gateway.routes
          # prefix binds nothing under SCG 5.0, so these downstream routes must live
          # under server.webflux to be honoured.
          server:
            webflux:
              {{- /* Optional. SCG >=4.1 only honours inbound X-Forwarded-* when
                     the IMMEDIATE peer is a trusted proxy; with this unset
                     NOTHING is trusted, so XForwardedHeadersFilter discards the
                     ingress controller's X-Forwarded-Proto/Host AND anything a
                     route's own SetRequestHeader filter set, then rewrites them
                     from the raw pod-to-pod connection. Downstreams that build
                     absolute URLs from those headers (Mastodon/Rails force_ssl)
                     then emit CLUSTER-INTERNAL Locations no external client can
                     resolve — measured on the compose front door as
                     `301 https://mastodon-web:3000/api/v1/instance`.
                     Purely additive: when `trustedProxies` is unset this renders
                     nothing and the ConfigMap is byte-identical to before, so the
                     be/pki instances that do not set it are untouched. */}}
              {{- with .Values.trustedProxies }}
              trusted-proxies: {{ . | quote }}
              {{- end }}
              routes:
              {{- range .Values.routes }}
                - id: {{ .id }}
                  uri: {{ .uri }}
                  predicates:
                    {{- if .host }}
                    - Host={{ .host }}
                    {{- end }}
                    {{- if .path }}
                    - Path={{ .path }}
                    {{- end }}
                    {{- /* Optional header predicate. Needed by the SPA deep-link
                           fallback route, which must distinguish a browser
                           NAVIGATION (Accept: text/html -> serve the host shell)
                           from a remote's asset/XHR fetch (-> serve the remote).
                           Purely additive: a route without `header` renders
                           byte-identically to before. */}}
                    {{- if .header }}
                    - Header={{ .header }}
                    {{- end }}
                  {{- with .filters }}
                  filters:
                    {{- toYaml . | nindent 20 }}
                  {{- end }}
              {{- end }}
