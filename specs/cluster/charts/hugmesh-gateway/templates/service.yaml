apiVersion: v1
kind: Service
metadata:
  name: {{ include "hugmesh-gateway.name" . }}
  labels:
    {{- include "hugmesh-gateway.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "hugmesh-gateway.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
{{- if .Values.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "hugmesh-gateway.serviceAccountName" . }}
  labels:
    {{- include "hugmesh-gateway.labels" . | nindent 4 }}
{{- end }}
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "hugmesh-gateway.name" . }}
  labels:
    {{- include "hugmesh-gateway.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- /* PoW shield: the public Ingress backend defaults to THIS gateway Service,
         but when an anti-scraper PoW gate (Anubis) is installed the generator sets
         ingress.backendServiceName/Port so the public front door routes THROUGH
         the PoW gate first (it forwards verified traffic to this gateway). */ -}}
  {{- $beName := default (include "hugmesh-gateway.name" .) .Values.ingress.backendServiceName }}
  {{- $bePort := default .Values.service.port .Values.ingress.backendServicePort }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $beName }}
                port:
                  number: {{ $bePort }}
    {{- range .Values.ingress.extraHosts }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $beName }}
                port:
                  number: {{ $bePort }}
    {{- end }}
    {{- /* Vanity subdomains of each extra brand domain (hugmesh-generator#582): the
           Ingress half of .Values.vanityDomains. The route half is the Host predicate
           of every `vanity: true` route (templates/configmap.yaml); without this rule
           ingress-nginx never hands `<username>.<domain>` to the gateway. Same backend
           as `host`. Empty => nothing renders. */}}
    {{- range .Values.vanityDomains }}
    - host: {{ printf "*.%s" . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $beName }}
                port:
                  number: {{ $bePort }}
    {{- end }}
    {{- /* Tor .onion hosts (hugmesh-generator#614): written at runtime by the node's
           hugmesh-tor-ingress-admit as helm parameters, never committed. Without a
           rule for the onion Host, ingress-nginx answers the Tor client from its
           default server (404, fake certificate) and the gateway is never reached.
           Same backend as `host` (Anubis when the PoW shield is up). No TLS entry:
           no onion SAN exists, so the controller's default certificate answers and
           Tor Browser shows one certificate warning — the onion address itself
           authenticates the service. */}}
    {{- range .Values.ingress.onionHosts }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $beName }}
                port:
                  number: {{ $bePort }}
    {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ include "hugmesh-gateway.name" . }}-tls
  {{- end }}
{{- end }}
