# Default values for hugmesh-gateway.
# Each namespace's ArgoCD Application overrides `instance`, `routes` and
# `ingress.host` (see cluster/apps/20-gateway-*.yaml).

# Which logical gateway this release is. Sets SPRING_APPLICATION_NAME, which
# the image uses to differentiate hugmesh-pki/be/fe-gateway behaviour.
instance:
  name: hugmesh-fe-gateway

replicaCount: 1

# PRE-EXISTING BUG, fixed during the Harbor migration: `repository` had NO
# registry-host prefix at all (just "snapdragon-systems/gateway"), so a
# deployment would have resolved this image against Docker Hub, not the
# in-cluster registry — while .gitlab-ci.yml's build:images job has always
# pushed to registry.hugmesh.systems/hugmesh/hugmesh-gateway. Fixed to
# match that same push destination and every other kustomization's `newName`
# convention (registry.hugmesh.systems/hugmesh/<repo>). The registry
# behind this hostname is now Harbor (apps/03a-harbor.yaml), not GitLab's
# bundled one — see that Application's header comment for why the hostname
# itself is unchanged.
image:
  repository: registry.hugmesh.systems/hugmesh/hugmesh-gateway
  tag: dev
  pullPolicy: IfNotPresent

# Harbor's pull-scoped robot-account imagePullSecret (see
# manifests/external-secrets/secretstore.yaml's harbor-registry ExternalSecret,
# renamed from gitlab-registry) — was empty here, which was consistent with the
# Docker-Hub-resolving bug above (a public-image pull needs no secret) but wrong
# once the repository actually points at Harbor.
imagePullSecrets:
  - name: harbor-registry
serviceAccount:
  create: true
  name: ""

service:
  type: ClusterIP
  port: 8080

# Casdoor is the single OAuth2 issuer for the whole cluster. It lives in the
# hugmesh-pki namespace on the control-plane (pki) Pi.
#
# issuerUri MUST equal the `iss` claim Casdoor mints (its configured origin,
# https://id.hugmesh.systems — see manifests/casdoor app-conf `origin`), because
# the gateway sets BOTH spring...jwt.issuer-uri AND jwk-set-uri, so Spring Boot
# fetches keys from jwk-set-uri but ALSO adds a JwtIssuerValidator that enforces
# token.iss == issuer-uri. Pointing issuerUri at the internal casdoor svc URL made
# the validator reject EVERY token (iss mismatch). Because jwk-set-uri is set
# explicitly, issuerUri is used ONLY for the iss string match — no OIDC-discovery
# fetch — so the public URL need not resolve in-cluster. jwksUri stays the INTERNAL
# casdoor svc so key fetch works without leaving the cluster.
casdoor:
  issuerUri: https://id.hugmesh.systems
  jwksUri: http://casdoor.hugmesh-pki.svc.cluster.local:8000/.well-known/jwks

# Cassandra backs the gateway's revocation list + URL registry (shared).
cassandra:
  contactPoints: cassandra.hugmesh-pki.svc.cluster.local:9042
  keyspace: snapdragon_gateway
  # The official Cassandra image's SimpleSnitch default datacenter is
  # "datacenter1" (nodetool status), not "dc1" — confirmed live against a bare
  # `cassandra:5` container with this same env (see compose.local.yaml's
  # identical fix, generator#261). A mismatched local-dc means the driver's
  # NoNodeAvailableException on every boot.
  localDc: datacenter1

# Downstream routes rendered into an application-routes.yml ConfigMap and
# loaded via SPRING_CONFIG_ADDITIONAL_LOCATION. id/uri/path per route.
routes:
  - id: api-default
    uri: http://hugmesh-api.hugmesh-backend.svc.cluster.local:8080
    path: /api/**

# Extra raw environment variables. SPRING_PROFILES_ACTIVE=routes is now set
# unconditionally in deployment.yaml (the routes ConfigMap needs it to load at
# all — see that file's comment); do not re-set it here.
extraEnv: []

# ── MFA ENFORCEMENT (gateway) — SHIPS DARK, EVERY FLAG DEFAULT OFF ───────────
# The gateway is the component that actually ENFORCES MFA at route level: its
# GatewayRouteAccessFilter.decide() honours the per-row
# gateway_route_access.mfa_required gate and the privileged floor. Three
# properties in the gateway image drive it (hugmesh-gateway
# src/main/resources/application.yml, "D8 MFA floor"):
#
#   app.mfa.enabled                 <- APP_MFA_ENABLED                  (false)
#   app.mfa.freshness-window        <- APP_MFA_FRESHNESS_WINDOW        (600000)
#   app.mfa.enforce-privileged-floor<- APP_MFA_ENFORCE_PRIVILEGED_FLOOR (false)
#
# Until this block existed, NO file in this repo set any of the three, so no
# deployment the generator produces could ever turn gateway MFA enforcement on —
# the enforcement leg was unreachable from GitOps. (The admin-bff *step-up* leg,
# APP_CASDOOR_MFA_ENABLED, was already wired; that is a different component.)
#
# Declared ONCE here because all four gateway instances deploy THIS chart
# (apps/20-gateway-be.yaml, 20-gateway-fe.yaml, 20-gateway-pki.yaml,
# 22-gateway-superadmin.yaml all point at specs/cluster/charts/hugmesh-gateway),
# and templates/deployment.yaml renders the three env vars from it. Override per
# instance in that instance's Application `helm.values:` block — Helm deep-merges
# maps, so `mfa: {enabled: true}` there keeps the other two defaults.
#
# THE DEFAULTS BELOW REPRODUCE THE IMAGE DEFAULTS EXACTLY. A cluster that sets
# nothing behaves identically to before this block existed: the MFA_SATISFIED
# authority is never derived, the gateway_route_access.mfa_required column stays
# inert, and the privileged-floor check never runs. The deliverable is that MFA
# becomes SETTABLE, not that it becomes on.
#
# OPERATIONAL CAVEAT — the rows `enabled: true` bites on ARE SEEDED NOW. The
# route-access initdb seed (specs/cluster/manifests/route-access/initdb/
# 20-schema.sql) ends with an UPDATE that flips mfa_required=true on every
# /bff/admin… and /bff/superadmin… ALLOW row — 9 rows across fe/be/superadmin —
# so on a cluster whose route-access-db has applied that seed, flipping `enabled`
# is OBSERVABLE at once for the one NON-privileged principal among those rows: a
# pure ROLE_FLEET_ADMIN on /bff/admin/phone-fleet/** starts 403ing without a fresh
# second factor (docs/MFA-ROLLOUT.md §3.1). SUPERADMIN/ADMIN/GAME-MASTER stay
# UNGATED at this stage — they short-circuit before decide() — which is exactly
# what the floor below is for, and why a quiet cluster after step 6 is NOT
# evidence that admin MFA works. (Runtime writers still default false:
# admin-bff's AddServiceEffector builds rules through RouteRule's 7-arg
# back-compat ctor and the gateway's CanonicalSeed.r() bakes mfaRequired=false —
# that seed UPDATE remains the only thing in the platform that writes true.)
# ⚠ enforcePrivilegedFloor is NOT a sub-flag of `enabled`. GatewayRouteAccessFilter
# reads ONLY app.mfa.enforce-privileged-floor to decide whether to run the floor
# (both the Jwt and the bff_-session branches), and the surface lookup it calls,
# GatewayRouteAccessService.isMfaRequiredSurface(), has no enabled-guard either —
# so setting it true makes the floor LIVE ON ITS OWN, even with `enabled: false`.
# docs/MFA-ROLLOUT.md §2 calls it the single most dangerous flag in the runbook:
# read §2/§3 (enroll BEFORE you enforce) before touching it anywhere. To see what
# it does without risking a cluster, rehearse it on the dev stack instead:
# `make stack-up MFA_FLOOR=1`, proven by tests/e2e/specs/29-mfa-privileged-floor.spec.ts.
mfa:
  # app.mfa.enabled — derive the NON-role MFA_SATISFIED authority from the
  # BFF-written, freshness-validated `mfa_satisfied_at` JWT-Custom claim AND
  # enforce the per-row gateway_route_access.mfa_required gate (fail-closed).
  # The marker is never sourced from roles/permissions (reserved-prefix guard).
  enabled: false
  # app.mfa.freshness-window — millis. A stamp is fresh iff
  # 0 <= now - ts <= window (a FUTURE stamp is rejected). 600000 = 10 min,
  # independent of the session TTL. Same value as the image default.
  freshnessWindow: 600000
  # app.mfa.enforce-privileged-floor — HARD privileged floor, checked ABOVE the
  # SUPERADMIN cross-domain bypass and the ADMIN/GAME-MASTER own-domain bypass,
  # so a privileged principal on an mfa_required surface must carry a FRESH
  # MFA_SATISFIED or be DENIED (SUPERADMIN is NOT exempt). Cold-start
  # (route-access not yet primed) fails closed with 503 for those principals.
  # ⚠ NOT a sub-flag of `enabled`: the filter checks this flag WITHOUT consulting
  # app.mfa.enabled (see the block comment above), so true here is live
  # enforcement on its own. Flip it only per docs/MFA-ROLLOUT.md §3 step 7, after
  # §2's enrollment precondition — enabling it first locks operators out of the
  # privileged plane, SUPERADMIN included. The flip commit must also move
  # tests/stack/test-gateway-mfa-env.sh's EXPECT_APP_MFA_ENFORCE_PRIVILEGED_FLOOR
  # pin in the same change, or that gate goes red (by design — see the runbook).
  enforcePrivilegedFloor: false

# Per-app mTLS keystore, built at startup from the Vault-PKI-issued, ESO-synced
# TLS Secret (manifests/external-secrets/pki-externalsecrets.yaml). When enabled,
# an initContainer assembles keystore.p12 (identity) + truststore.p12 (cluster
# CA) into an in-pod tmpfs and emits application.properties (hugmesh.tls.*
# the app consumes for cross-namespace mTLS). The store password is generated
# in-pod and never leaves it. Default OFF so existing plaintext deployments and
# probes are unaffected; turn on per gateway in apps/20-gateway-*.yaml.
keystore:
  enabled: false
  # ESO-synced kubernetes.io/tls Secret name; defaults to "<instance.name>-mtls".
  secretName: ""
  # Trust-anchor alias in the truststore.
  caAlias: hugmesh-cluster-ca
  # Also enable server.ssl (serve HTTPS). The probes follow this flag on their
  # own (templates/deployment.yaml switches the exec curl to https + -k, which is
  # the same no-server-cert-verification posture a kubelet httpGet with
  # scheme: HTTPS uses for a loopback check), so turning this on no longer breaks
  # readiness. The Service/ingress in front of it are still plaintext-shaped —
  # switch those too before enabling.
  serverTls: false
  # TLS protocol floor for the assembled keystore (crypto agility — see
  # docs/CRYPTO-AUDIT.md). TLSv1.3 only by default: forward-secret, AEAD-only,
  # and the prerequisite for post-quantum hybrid key exchange. The build-keystore
  # initContainer writes server.ssl.enabled-protocols=<this> into
  # application.properties. Set to "TLSv1.3,TLSv1.2" only if a legacy peer
  # cannot negotiate 1.3.
  tlsProtocols: "TLSv1.3"
  # POST-QUANTUM HYBRID KEY EXCHANGE (documented migration path, gated OFF).
  # When the deployed JVM/proxy advertises a hybrid PQC group (e.g.
  # X25519MLKEM768 — ML-KEM-768 + X25519, the IETF/NIST-aligned default landing
  # in JDK 24+/BoringSSL/OpenSSL 3.5+), set pqcGroups to it and the initContainer
  # appends jdk.tls.namedGroups so the handshake negotiates it where BOTH peers
  # support it, falling back to classical X25519/secp384r1 otherwise. Empty =
  # classical groups only (no PQC forced onto a JVM that can't do it).
  pqcGroups: ""
  # TRUST TIER — multi-tenancy PR5 (NARROW/WIDE; default NARROW).
  # Controls which CA certs are imported into the JRE truststore at pod startup.
  #
  # NARROW (default): only this instance's own-domain CA (/pki/ca.crt) — per-brand
  # isolation enforced at the trust anchor.  A peer from another brand cannot even
  # present a trusted cert to this gateway.  Correct for all per-brand gateways.
  #
  # WIDE: all domain CA certs, sourced from /pki/ca-bundle.crt (all roots
  # concatenated as PEM).  Required for the architecture-tier gateway (or any
  # gateway that must accept mTLS peers from multiple brands).  The ESO
  # ExternalSecret for this instance MUST sync a ca-bundle.crt field containing
  # all per-domain CA certs (see scripts/gen-keystores.sh — the WIDE truststore
  # is baked at build time from the same concatenated bundle).
  #
  # The authoritative access control is still the gateway domain-match predicate +
  # BFF @PreAuthorize; trustTier is defense-in-depth at the TLS layer.
  trustTier: "NARROW"

# Internal ingress (Cloudflare terminates the public name later; this is the
# in-cluster host the tunnel / reverse proxy targets).
ingress:
  enabled: false
  className: ""
  host: hugmesh.systems
  # Additional hosts this gateway's Ingress serves (same backend). Used e.g. by
  # the be-gateway to front scale.<domain> (headscale) and forward it to pki.
  extraHosts: []
  annotations: {}
  tls: false
  # PUBLIC POW SHIELD (Anubis). By default the Ingress backend is THIS gateway's
  # own Service (empty => the template falls back to .name / .service.port). When
  # the Anubis PoW gate is installed (PROD default), the generator sets these so
  # the public Ingress routes THROUGH Anubis (:8923), which then forwards verified
  # requests to this fe-gateway (Anubis TARGET=fe-gateway:8080). Leave empty for
  # the direct path (test default / Anubis deselected).
  backendServiceName: ""
  backendServicePort: ""

# Pin a gateway to specific nodes (e.g. fe-gateway onto frontend Pis).
nodeSelector: {}
tolerations: []
affinity: {}

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 768Mi

# HorizontalPodAutoscaler (plain autoscaling/v2, CPU + memory Resource metrics —
# modelled on manifests/remote-fragment/hpa.yaml). DEFAULT OFF: the gateway is the
# single ingress for its tier and several instances (e.g. pki) are pinned 1:1 to a
# control-plane node, so autoscaling is opt-in PER gateway via
# apps/20-gateway-*.yaml. When enabled, templates/hpa.yaml renders an HPA whose
# scaleTargetRef points at THIS release's Deployment; it REQUIRES metrics-server
# (apps/01-metrics-server.yaml, already live) and stays inert until the metrics
# API answers. The targets read the resources.requests above (cpu:100m,
# memory:256Mi). minReplicas does NOT raise replicaCount (the Deployment floor is
# held); it only sets the bottom of the band the HPA may move within.
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# Spring Boot Actuator readiness/liveness (gateway exposes /actuator/health).
# Rendered as 401-TOLERANT exec probes, NOT httpGet — the gateway image gates
# /actuator/** on ROLE_GAME-MASTER/ADMIN/SUPERADMIN, so a token-less kubelet
# always gets 401 and an httpGet probe can never pass. See the block comment in
# templates/deployment.yaml; the shape is pinned by
# tests/stack/test-probe-auth-surface.sh.
probes:
  enabled: true

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  seccompProfile:
    type: RuntimeDefault

# Per-app SELinux identity (set per gateway in apps/20-gateway-*.yaml). Rendered
# as pod seLinuxOptions ONLY when level is set; the MCS level makes this app's
# pods mutually isolated from other apps even within container_t.
seLinux:
  type: container_t
  level: ""
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
