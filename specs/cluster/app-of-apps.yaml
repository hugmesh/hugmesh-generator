# Root "app-of-apps" — the OPT-IN, REPO-DRIVEN topology. NOT applied by default.
#
# ⚠ THIS ROOT IGNORES EVERY BUILD-TIME GATE. Its source is
# `path: specs/cluster/apps` + `directory.recurse: true` against the GitOps REPO,
# so ArgoCD instantiates specs/cluster/apps AS IT EXISTS ON ${REV} — not the
# tree baked into the image at /var/lib/hugmesh/cluster/apps. Applying it was
# bootstrap.sh's only apply step until 2026-08-26, which is why every `rm -f` in
# gate_optional_services()/gate_env_apps() was INERT on a real device: a device
# built with `--optional-services akkoma` still received tuwunel, phpbb, games,
# owncast and tube, straight from the repo.
#
# specs/cluster/bootstrap/bootstrap.sh now applies the BAKED apps/ tree directly
# instead. This file is kept for the cluster that genuinely wants to be driven
# from a git branch (a dev/staging cluster tracking main), and bootstrap.sh
# applies it ONLY under HUGMESH_GITOPS_ROOT_RECURSE=1, printing what that costs.
# Do not re-wire it as the default without re-reading specs/cluster/README.md
# "What the device syncs".
#
# repoURL / targetRevision are patched at bootstrap time from
# /etc/hugmesh/gitops.env (HUGMESH_GITOPS_REPO / _REV), default below.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hugmesh-root
  namespace: devops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/hugmesh/hugmesh-generator.git
    targetRevision: main
    path: specs/cluster/apps
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: devops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      # KEYSTONE for the LIVE optional-services toggle (docs/OPTIONAL-SERVICES.md
      # §7/§10): make selfHeal RESPECT the ignoreDifferences below so it does not
      # revert the admin-bff OptionalServiceReconciler's runtime write of the
      # optional-services ApplicationSet element list. Without this, selfHeal
      # re-applies git's inert `installed:"false"` baseline every sync and the whole
      # CRD+controller mechanism is a no-op.
      - RespectIgnoreDifferences=true
  # The admin-bff OptionalServiceReconciler is the SINGLE writer of the
  # optional-services ApplicationSet's inline list-generator element `installed`
  # flags (reconciled from the OptionalService CRs). Let ONLY that field diverge from
  # git; every other field on the ApplicationSet stays selfHeal-enforced.
  ignoreDifferences:
    - group: argoproj.io
      kind: ApplicationSet
      name: optional-services
      namespace: devops
      jsonPointers:
        - /spec/generators/0/list/elements
    # Same single-writer model for the per-domain Casdoor list (issue #47,
    # apps/05b-casdoor-domains.yaml): the element list is written at build time
    # (KEYS-manifest domains bake) and at runtime by the admin-bff
    # DomainReconciler — git carries the empty scaffold only. Keep IN LOCKSTEP
    # with apps/00-app-of-apps-waved.yaml.
    - group: argoproj.io
      kind: ApplicationSet
      name: casdoor-domains
      namespace: devops
      jsonPointers:
        - /spec/generators/0/list/elements
