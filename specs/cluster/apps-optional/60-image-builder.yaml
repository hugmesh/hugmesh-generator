# image-builder — the GENERIC in-cluster app-image Kaniko build pipeline (OPT-IN).
#
# This Application syncs ONLY the build NAMESPACE + NetworkPolicy
# (manifests/image-builder kustomization). The per-build Kaniko Job is a TEMPLATE a driver
# (the .gitlab-ci.yml build:images job, an ArgoCD sync hook, or an Argo-Workflows step)
# instantiates per build — it is NOT in the kustomization, so ArgoCD never applies it. The
# namespace + policy are inert until a build lands there (ships dark). Models the proven #110
# service-catalog-builder Application (apps/54-service-catalog-builder.yaml) 1:1.
#
# OPT-IN / DEFAULT-OFF — WHY THIS FILE LIVES IN apps-optional/ AND NOT apps/:
#   The root app-of-apps (../app-of-apps.yaml and apps/00-app-of-apps-waved.yaml) syncs
#   `path: specs/cluster/apps` with `directory.recurse: true`. ANY Application yaml under
#   apps/ is therefore auto-synced. This Application is deliberately placed in
#   specs/cluster/apps-optional/ — a sibling directory the root does NOT recurse — so merging
#   this PR changes NOTHING live: ArgoCD never sees it until an operator opts in.
#
#   TO ENABLE (opt-in): copy or move this file into specs/cluster/apps/ (e.g.
#   `cp specs/cluster/apps-optional/60-image-builder.yaml specs/cluster/apps/`) and commit;
#   the root then syncs it on the next reconcile. Even once enabled, only the inert namespace
#   + NetworkPolicy are created — no build runs until a driver dispatches one.
#
# NOTE: live validation of an actual build is PENDING a kernel-fixed x86 image (the x86
# netfilter gap currently blocks bringing up a cluster). This manifest is authored
# correct-by-construction against the #110 Kaniko contract and validated with
# `kubectl kustomize` / yaml parse.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: image-builder
  namespace: devops
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/Snapdragon-Systems/snapdragon-generator.git
    targetRevision: main
    path: specs/cluster/manifests/image-builder
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    # The kustomization creates its own namespace resource; ArgoCD must not also try.
    syncOptions: [CreateNamespace=false]
