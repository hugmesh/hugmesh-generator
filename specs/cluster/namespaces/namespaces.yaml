# HugMesh cluster namespaces. Each carries the hugmesh-*-gateway that
# fronts all of its traffic and validates the internal Casdoor OAuth2 JWT.
#
# Placement is by capability labels (booleans), not a single role, so the
# x86_64 host can carry several. Workloads nodeSelect hugmesh.net/<tier>=true:
#   hugmesh-pki       pki=true        -> pki Pi (control-plane): headscale, Casdoor, auth
#   hugmesh-backend   backend=true    -> backend Pis AND the x86_64 host
#   hugmesh-frontend  frontend=true   -> frontend Pis AND the x86_64 host
#   hugmesh-games     games=true,compute=gpu -> x86_64 host. ALSO hosts the
#                        SEPARATE GAMES-realm Casdoor (casdoor-games, org
#                        "threewizards") + its Postgres (casdoor-games-pg) — an
#                        independent identity provider from the systems Casdoor in
#                        hugmesh-pki.
#   devops               devops=true; ArgoCD additionally kubernetes.io/arch=amd64 (x86 ONLY)
# The x86_64 host is labelled frontend=backend=games=devops=true (+compute=gpu),
# so it runs all of those; the Pis keep only their own tier label.
# Pod Security Admission (PSA) labels are applied in WARN + AUDIT mode ONLY (the
# `restricted` profile) — NEVER `enforce`. warn/audit surface workloads drifting
# from the restricted baseline (a kubectl warning + an audit-log annotation) but
# NEVER block a pod from scheduling, so they carry ZERO runtime risk while the
# per-workload container-hardening rollout proceeds (docs/CLUSTER-HARDENING-PLAN
# .md). Pin the version so a cluster upgrade can't silently tighten the check.
# Controls: CIS K8s 5.2/5.3, NIST 800-190 §4.5, DISA K8s STIG. The enforce flip
# is a deliberate, separate change gated on the drift report being clean.
apiVersion: v1
kind: Namespace
metadata:
  name: hugmesh-pki
  labels:
    app.kubernetes.io/part-of: hugmesh.net
    hugmesh.net/tier: pki
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
---
apiVersion: v1
kind: Namespace
metadata:
  name: hugmesh-backend
  labels:
    app.kubernetes.io/part-of: hugmesh.net
    hugmesh.net/tier: backend
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
---
apiVersion: v1
kind: Namespace
metadata:
  name: hugmesh-frontend
  labels:
    app.kubernetes.io/part-of: hugmesh.net
    hugmesh.net/tier: frontend
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
---
apiVersion: v1
kind: Namespace
metadata:
  name: hugmesh-games
  labels:
    app.kubernetes.io/part-of: hugmesh.net
    hugmesh.net/tier: games
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
---
apiVersion: v1
kind: Namespace
metadata:
  name: devops
  labels:
    app.kubernetes.io/part-of: hugmesh.net
    hugmesh.net/tier: devops
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
---
# hugmesh-policy — holds the cluster admission-policy plumbing: the
# reserved-prefixes ConfigMap (mirror of specs/cluster/reserved-prefixes.yaml)
# read by the Kyverno ClusterPolicy that blocks vanity-shadowing route/host
# collisions. No workloads; just policy data + (cluster-scoped) policy objects.
apiVersion: v1
kind: Namespace
metadata:
  name: hugmesh-policy
  labels: { app.kubernetes.io/part-of: hugmesh.net, hugmesh.net/tier: devops }
---
# velero — the backup engine's namespace. DECLARED HERE, not left to whoever gets
# there first. Three things aim namespaced resources at it: manifests/velero/rbac.yaml
# (the admin-bff backup effector's Role/RoleBinding), the status-sweep CronJob, and
# manifests/admin-bff-platform-capability-rbac (the probe's Deployment read) — and the
# last of those syncs from apps/31a-… with `CreateNamespace=false` and
# `automated: {prune, selfHeal}`, so it applies on EVERY mesh from the first reconcile.
# apps/55-velero.yaml does carry CreateNamespace=true, but it is deliberately
# NON-automated (installing the backup engine is a superadmin act), so on a mesh where
# nobody has synced it the namespace never appears and 31a fails forever with
# `namespaces "velero" not found` — the exact permanent-phantom failure that made the
# probe's ArgoCD half inert. bootstrap/kind-local/bootstrap-kind.sh already creates it
# imperatively (its own ensure-namespaces loop, added after that very error); the
# non-kind bootstrap.sh applies THIS file and nothing else, so the two lanes had
# drifted. Declaring it here makes them agree and costs an empty namespace.
# Guarded by tests/platform-capability-rbac/test-probe-rbac-namespaces.sh.
apiVersion: v1
kind: Namespace
metadata:
  name: velero
  labels:
    app.kubernetes.io/part-of: hugmesh.net
    hugmesh.net/tier: devops
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
