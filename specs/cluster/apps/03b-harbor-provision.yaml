# Harbor provisioning — the PostSync-hook Job that creates the Harbor PROJECT
# + pull/push ROBOT ACCOUNTS and wires Casdoor OIDC, via Harbor's REST API.
# Separate Application (git-path/kustomize) from the Harbor Helm release itself
# (apps/03a-harbor.yaml) because a Helm-chart-sourced Application has no `path:`
# for extra git-managed manifests — same split as
# apps/03-external-secrets.yaml (Helm: the ESO controller) vs.
# apps/04-external-secrets-config.yaml (git path: the ClusterSecretStore/
# ExternalSecret CRs that use it).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: harbor-provision
  namespace: devops
spec:
  project: default
  source:
    repoURL: https://github.com/hugmesh/hugmesh-generator.git
    targetRevision: main
    path: specs/cluster/manifests/harbor
    kustomize:
      # THE MESH VAULT BASE SEGMENT — issue #285, decision 38 = B on #347. See
      # apps/04-external-secrets-config.yaml for the full mechanism note: ArgoCD
      # serves the manifests from git (identical for every mesh), this Application
      # object is applied from the image's BAKED tree, so the brand reaches the
      # cluster through the `value:` below, which rebrand_sysroot() rewrites to
      # <BRAND>. Byte no-op at the default brand.
      patches:
        - target:
            group: batch
            version: v1
            kind: Job
            name: harbor-provision

          patch: |-
            - { op: replace, path: /metadata/annotations/platform.hugmesh.net~1vault-base, value: "hugmesh" }
  destination:
    server: https://kubernetes.default.svc
    namespace: hugmesh-pki
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
