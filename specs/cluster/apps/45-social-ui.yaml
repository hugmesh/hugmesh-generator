# snapdragon-social-ui — Matrix + Mastodon Angular micro-frontends, served at
# /social and federated into the snapdragon.systems host. Frontend Pis.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: snapdragon-social-ui
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Snapdragon-Systems/catalyst-scripts.git
    targetRevision: main
    path: specs/cluster/manifests/social-ui
  destination:
    server: https://kubernetes.default.svc
    namespace: snapdragon-frontend
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
