# hugmesh-social-ui — Matrix + Mastodon Angular micro-frontends, served at
# /social and federated into the hugmesh.systems host. Frontend Pis.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hugmesh-social-ui
  namespace: devops
spec:
  project: default
  source:
    repoURL: https://github.com/hugmesh-net/hugmesh-generator.git
    targetRevision: main
    path: specs/cluster/manifests/social-ui
  destination:
    server: https://kubernetes.default.svc
    namespace: hugmesh-frontend
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
