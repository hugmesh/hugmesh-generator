# ADMIN-BFF PLATFORM-CAPABILITY PROBE RBAC — the least-privilege READ-ONLY grants the
# merged platform-capability probe (admin-bff PlatformCapabilitiesController +
# Fabric8PlatformCapabilityProbe) needs to detect ArgoCD / Velero / x86 build-node
# presence from the in-cluster API. Bound to the admin-bff pod's backups-effector
# ServiceAccount (manifests/admin-bff-api/backups-effector-sa.yaml). A cluster-read
# ClusterRole + ClusterRoleBinding (CRDs get, Nodes list) plus namespaced read Role +
# RoleBinding in devops + velero (Deployments get/list). NOTHING write.
#
# AUTOMATED sync (alongside the admin-bff-api Application) so the grants exist whenever
# the BFF runs — the probe still SHIPS DARK (app.platform-capabilities.k8s.enabled=false
# → NoopPlatformCapabilityProbe) until deliberately enabled, so these tokens are
# unexercised until then; granting them early just means a clean answer the moment the
# probe is switched on. The devops / velero RoleBindings reference namespaces that BOTH
# really exist: `devops` AND `velero` are declared in specs/cluster/namespaces/
# namespaces.yaml, the ONE inventory both bootstraps apply before ArgoCD is installed.
# `velero` used to be created only by the kind-local bootstrap's ensure-namespaces loop,
# which meant the velero half of this Application was a phantom on every non-kind mesh
# (apps/55-velero.yaml does carry CreateNamespace=true but is deliberately
# NON-automated, so it may never have synced). That matters because
# this Application syncs with CreateNamespace=false — a namespaced resource aimed at a
# namespace nothing creates can NEVER apply, it just fails the sync forever with
# `namespaces "<ns>" not found`. This file previously aimed its ArgoCD half at an
# `argocd` namespace that this platform never creates (ArgoCD lives in `devops`), so
# that half was exactly such a permanent phantom. Guarded by
# tests/platform-capability-rbac/test-probe-rbac-namespaces.sh.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: admin-bff-platform-capability-rbac
  namespace: devops
spec:
  project: default
  source:
    repoURL: https://github.com/hugmesh/hugmesh-generator.git
    targetRevision: main
    path: specs/cluster/manifests/admin-bff-platform-capability-rbac
  destination:
    server: https://kubernetes.default.svc
    namespace: hugmesh-backend
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=false]
