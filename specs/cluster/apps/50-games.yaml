# snapdragon.games — runs on the x86_64 GPU worker (vendor-agnostic Mesa/Vulkan).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: snapdragon-games
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Snapdragon-Systems/catalyst-scripts.git
    targetRevision: main
    path: specs/cluster/manifests/games
  destination:
    server: https://kubernetes.default.svc
    namespace: snapdragon-games
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
