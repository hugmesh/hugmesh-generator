# =============================================================================
# 00a-cassandra-hardening — DARK Cassandra TLS (ADR-32). MANUAL-SYNC.
# =============================================================================
# ⚠ THE AUTH HALF OF THIS APP WAS BASED ON A FALSE PREMISE AND HAS SHIPPED.
# This header used to read "Cassandra currently runs with no authenticator
# (effectively AllowAllAuthenticator)". It never did: the bitnami image defaults
# CASSANDRA_AUTHENTICATOR=PasswordAuthenticator, so the cluster always demanded
# credentials and every gateway CrashLoopBackOff'd on
# `requires authentication ... but no authenticator configured`
# (docs/KIND-SSO-E2E-FINDINGS.md #5). There was no cutover to stage — only a
# client side that had never been wired. It is wired now, in the LIVE tree:
# apps/00b-cassandra-init.yaml + manifests/cassandra-init +
# manifests/external-secrets/cassandra-externalsecrets.yaml.
#
# What is left here is TLS, which really is unshipped and really is a coordinated
# flip. It stays wired into GitOps but CANNOT turn on by itself (docs/CLUSTER-
# HARDENING-PLAN.md §H).
#
# DARK — belt-and-braces (the same idiom held PR #132 / 08a-networkpolicy-egress uses):
#   1. NO `automated:` block — ArgoCD NEVER auto-syncs this app's resources; an
#      operator must sync it deliberately.
#   2. Its source is the EMPTY overlay (manifests/cassandra-hardening-empty), which
#      renders ZERO objects — so even a deliberate sync applies nothing.
#
# TO ENABLE (after staging per §H): repoint spec.source.path to
# `specs/cluster/manifests/cassandra-hardening` and sync this app manually (it has
# no automated block, so it will not self-heal/prune until you sync). That renders
# the auth-config record, the cassandra-mtls ExternalSecret and the TLS keystore
# builder. The `tls:` Helm-values flip on apps/00-cassandra.yaml and the
# per-consumer truststore wiring are separate operator steps in §H.
#
# The default root app (../app-of-apps.yaml, directory.recurse:true) WILL create
# THIS Application object, but because there is no automated block AND the source is
# empty, no Cassandra-hardening resource is ever rendered or applied. Inert + fail-
# closed by construction.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cassandra-hardening
  namespace: devops
  labels:
    hugmesh.net/ships: dark
  annotations:
    hugmesh.net/dark: "manual-sync; empty source until operator flips — see docs/CLUSTER-HARDENING-PLAN.md §H"
    # Run after Cassandra itself (apps/00-cassandra.yaml, default wave 0).
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: default
  source:
    repoURL: https://github.com/hugmesh/hugmesh-generator.git
    targetRevision: main
    # EMPTY overlay (renders nothing). Flip to manifests/cassandra-hardening to enable.
    path: specs/cluster/manifests/cassandra-hardening-empty
  destination:
    server: https://kubernetes.default.svc
    namespace: hugmesh-pki
  # NO syncPolicy.automated — MANUAL sync only. Never auto-applies / self-heals /
  # prunes. Operator syncs deliberately at the flip step.
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
