# admin-bff — Backend-For-Frontend for the hugmesh-admin-ui. ClusterIP in
# hugmesh-backend; the ONLY way in is the fe-gateway /bff/** route (same
# origin as hugmesh.net). Writes the gateway_route_access table that the
# gateways read-cache for their external access rules.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: admin-bff-api
  namespace: devops
spec:
  project: default
  source:
    repoURL: https://github.com/hugmesh/hugmesh-generator.git
    targetRevision: main
    path: specs/cluster/manifests/admin-bff-api
  destination:
    server: https://kubernetes.default.svc
    namespace: hugmesh-backend
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
# ── NO ignoreDifferences HERE, AND THAT IS THE DECISION (2026-08-26) ──────────
# The optional-services reconciler's master switch
# (APP_OPTIONAL_SERVICES_RECONCILE_ENABLED -> app.optional-services.reconcile.
# enabled) is now DECLARED in manifests/admin-bff-api/deployment.yaml. It was
# previously settable from nowhere at all, and the obvious repair — "let the
# operator `kubectl set env` it and exempt that from selfHeal" — is refused here
# on purpose. Two reasons, both structural:
#
#   1. ArgoCD ignoreDifferences addresses a container's env by ARRAY INDEX
#      (/spec/template/spec/containers/0/env/N). There is no by-name pointer.
#      That index is correct only until someone inserts an env var above it, at
#      which point the exemption silently starts covering a DIFFERENT variable —
#      and this container's env list carries secretKeyRefs. An exemption that
#      quietly migrates onto a credential is worse than no exemption. The
#      alternative, exempting the whole /env array, un-enforces every variable in
#      the pod to make ONE of them settable.
#
#   2. This flag is not a runtime toggle in the first place. Turning it on is
#      only legal AFTER the hardcoded-app cut-over (docs/OPTIONAL-SERVICES.md
#      §10) because the reconciler becomes authoritative over the entire closed
#      slug set on its first tick — see the long comment at the env var. A change
#      with that precondition wants a reviewed commit and an audit trail, which
#      is exactly what GitOps-only gives it. selfHeal REVERTING an ad-hoc
#      `kubectl set env` of this key is now correct behaviour, not the defect it
#      looks like.
#
# The RUNTIME surface an operator/superadmin actually drives is the per-slug
# OptionalService CRs, and those writes ARE exempted from selfHeal — on their own
# objects, by NAME, not by index: the reserved-prefixes-policy Application
# (apps/16) for the installed-services ConfigMap data keys, and the two app-of-apps
# roots for the 13a ApplicationSet elements.
#
# ⚠ Deliberately NOT spelled as a full `apps/<n>-<name>.yaml` filename above.
# tests/scripts/test-kind-profile-app-closure.sh treats that literal pattern in an
# APPLIED Application as a bootstrap cross-reference and requires the named app to be
# applied too. reserved-prefixes-policy is not in the kind profile, so naming it that
# way here invented an unsatisfied dependency out of a prose citation and took the
# suite from 22/1 to 21/2. Cite it by Application name, not by filename.
