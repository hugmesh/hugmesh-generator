# hugmesh-character-studio-ui — the VN character-studio Angular micro-frontend,
# federated into the hugmesh.systems host at /character-studio (ROLE_USER floor).
# Frontend Pis. OPTIONAL service (DEFAULT-OFF, admin gate): pruned by
# gate_optional_services() when the 'character-studio' slug is not selected, and
# rendered installed:"false" in the optional-services ApplicationSet / ConfigMap.
# See specs/cluster/optional-services.yaml (slug: character-studio).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hugmesh-character-studio-ui
  namespace: devops
spec:
  project: default
  source:
    repoURL: https://github.com/hugmesh-net/hugmesh-generator.git
    targetRevision: main
    path: specs/cluster/manifests/character-studio
  destination:
    server: https://kubernetes.default.svc
    namespace: hugmesh-frontend
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
