# Kyverno — the cluster admission/policy engine. Deployed so the reserved-prefix
# ClusterPolicy (apps/16-reserved-prefixes-policy.yaml -> manifests/policy) can
# enforce the vanity-collision rule at admission/sync time. Synced in an EARLY
# wave (-1, alongside ingress-nginx/calico) so the CRDs exist before the policy
# Application (wave default 0) applies the ClusterPolicy.
#
# Kyverno is the chosen policy engine because the reserved set is a small data
# list the policy can read from a ConfigMap (single source of truth) — no custom
# webhook image to build/maintain. See docs/RESERVED-PREFIXES.md for the
# rationale + the always-on fallbacks (validate script + CI lint + PreSync hook).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: devops
  annotations:
    argocd.argoproj.io/sync-wave: "-1"   # CRDs before the ClusterPolicy
spec:
  project: default
  source:
    repoURL: https://kyverno.github.io/kyverno/
    chart: kyverno
    targetRevision: 3.2.*
    helm:
      releaseName: kyverno
      values: |
        # Single-replica admission controller is plenty for this small cluster;
        # the policy is the only consumer. amd64/arm64 images are multi-arch.
        admissionController:
          replicas: 1
        backgroundController:
          replicas: 1
        cleanupController:
          enabled: false
        reportsController:
          enabled: false
        # ── the chart's cleanup CronJobs pin a RETIRED image ──────────────────
        # MEASURED on a live kind cluster: four kyverno-cleanup-* CronJobs were in
        # ImagePullBackOff, firing every 10 minutes, forever. `cleanupController:
        # enabled: false` above DID take effect -- there is no cleanup-controller
        # Deployment -- but the chart creates these CronJobs INDEPENDENTLY of that
        # flag, and kyverno-3.2.8/values.yaml pins them to bitnami/kubectl:1.28.5.
        # Bitnami's move to Broadcom retired the free bitnami/* Docker Hub images:
        # that exact tag now returns 404 (verified against the Docker Hub API), while
        # bitnamilegacy/kubectl:1.28.5 returns 200.
        #
        # WHY THIS ESCAPED tests/scripts/test-container-image-tags.sh: that gate checks
        # the images specs/cluster PINS. This one was pinned by the CHART we install,
        # not by us -- an entire class the gate cannot see. Overriding it here brings
        # the image back under our own pin, and therefore back under that gate.
        #
        # reportsController is off above, so nothing GENERATES admission/ephemeral
        # reports and their four cleanup jobs have no work: disabled outright rather
        # than repointed, because the cheapest broken thing is the one that does not
        # run. updateRequests is DIFFERENT -- backgroundController is enabled, so it
        # really does produce UpdateRequests -- so that one keeps running, on the
        # image that exists.
        # policyReportsCleanup is a SEPARATE values key from cleanupJobs below, and
        # missing it DEADLOCKED the cluster. It drives templates/hooks/
        # post-upgrade-clean-reports.yaml -- a Helm post-upgrade hook Job -- and it
        # defaults to bitnami/kubectl:1.28.5 too.
        #
        # OBSERVED on kind-hugmesh-local after the cleanupJobs fix was applied: the
        # Application sat OutOfSync for 13 minutes with
        #     phase=Running
        #     msg=waiting for completion of hook batch/Job/kyverno-clean-reports
        # The hook Job cannot start (its image is a 404), so the sync never completes,
        # so the five CronJobs never get updated -- THE RETIRED IMAGE BLOCKS THE VERY
        # SYNC THAT WOULD FIX THE RETIRED IMAGE. A fix that cannot apply itself is not
        # a fix, and no amount of re-merging would have moved it.
        #
        # Disabled rather than repointed: reportsController is off above, so no policy
        # reports are produced and this hook has nothing to clean. That also takes a
        # sync-blocking Job off the critical path permanently, which is worth more here
        # than a working image would be.
        policyReportsCleanup:
          enabled: false
        cleanupJobs:
          admissionReports:
            enabled: false
          clusterAdmissionReports:
            enabled: false
          ephemeralReports:
            enabled: false
          clusterEphemeralReports:
            enabled: false
          updateRequests:
            enabled: true
            image:
              repository: bitnamilegacy/kubectl
              tag: '1.28.5'
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
