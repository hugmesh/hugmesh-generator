# federation-db — dedicated Postgres for snapdragon-federation's OWN tables
# (federation_modules / user_modules / moderation_requests / federation_override).
# snapdragon-backend, ClusterIP. No initdb seed — federation owns its schema via
# Liquibase (applied by the app at startup), so this DB just needs to exist EMPTY.
#
# sync-wave "1": reconcile the DB BEFORE the federation app (wave "2") so Liquibase
# has a target at boot. (If the DB lags, federation fails fast and k8s/ArgoCD
# restart it, so this ordering is helpful, not a hard gate.)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: federation-db
  namespace: devops
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/Snapdragon-Systems/snapdragon-generator.git
    targetRevision: main
    path: specs/cluster/manifests/federation-db
  destination:
    server: https://kubernetes.default.svc
    namespace: snapdragon-backend
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
