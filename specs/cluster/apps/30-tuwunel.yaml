# tuwunel — Matrix homeserver (Rust Conduit fork, replaces Synapse).
# matrix.snapdragon.systems, backend namespace. Matrix-spec compatible, so
# snapdragon-matrix-ui (in snapdragon-social-ui) is unchanged. Raw manifests
# (no Helm chart). See manifests/tuwunel for image/config validation notes.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tuwunel
  namespace: devops
spec:
  project: default
  source:
    repoURL: https://github.com/Snapdragon-Systems/snapdragon-generator.git
    targetRevision: main
    path: specs/cluster/manifests/tuwunel
  destination:
    server: https://kubernetes.default.svc
    namespace: snapdragon-backend
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
