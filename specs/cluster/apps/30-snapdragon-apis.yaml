# Snapdragon Spring APIs (snapdragon-actions / snapdragon-auth). Backend Pis.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: snapdragon-apis
  namespace: devops
spec:
  project: default
  source:
    repoURL: https://github.com/Snapdragon-Systems/snapdragon-generator.git
    targetRevision: main
    path: specs/cluster/manifests/snapdragon-apis
  destination:
    server: https://kubernetes.default.svc
    namespace: snapdragon-backend
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
