# Service catalog (Phase 6) — turns "a deploy descriptor in each repo" into
# deployable ArgoCD Applications. An ApplicationSet scans the in-cluster Forgejo
# org and generates one Application per repo that opts in by carrying a deploy
# descriptor — `hugmesh-deploy.yaml` — plus a `deploy/`
# kustomize dir (see catalog/hugmesh-deploy.example.yaml). Admins spin up / update instances by
# editing the descriptor + deploy/ and pushing — no hand-written Application per
# service. The registered adoption state is catalog/adopters.yaml.
#
# CI SIDE (dev/CI-pipeline only): an onboarded repo also ships the pen-test CI stage
# (catalog/ci/repo.gitlab-ci.yml, which include:s tests/pentest/ci/
# pentest-stage.gitlab-ci.yml) so joining the ArgoCD pipeline gives it the OWASP
# sca+dast stage by default. That is CI-only — NOT a deployed runner here.
#
# ⚠️ PREREQUISITES (scaffold until met): Forgejo seeded with the org repos
# (Phase 5 activation); a read token in Secret forgejo-scm-token (ns devops);
# repos adopting the <descriptor> + deploy/ convention. Confirm the
# ApplicationSet controller is installed with ArgoCD (it is, in recent versions).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: hugmesh-catalog
  namespace: devops
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - scmProvider:
        gitea:
          owner: hugmesh
          api: http://forgejo.hugmesh-pki.svc.cluster.local:3000
          allBranches: false
          tokenRef:
            secretName: forgejo-scm-token
            key: token
        # ONE descriptor name: `hugmesh-deploy.yaml`, the name every emitter in
        # this tree writes and every adopting repo ships. An scmProvider filter
        # that matches nothing is not an error — the ApplicationSet just generates
        # no Application — so the registered adoption state lives in
        # catalog/adopters.yaml and scripts/validate-catalog-discovery.sh FAILS if
        # any registered adopter's descriptor is not matched by an entry here.
        # A future second spelling needs a second entry: `filters` are ORed while
        # the conditions inside one entry (and `pathsExist` itself) are ANDed.
        filters:
          - repositoryMatch: "^hugmesh-"
            pathsExist: ["hugmesh-deploy.yaml", "deploy"]
  template:
    metadata:
      name: "{{ .repository }}"
      labels:
        app.kubernetes.io/part-of: hugmesh.net
        hugmesh.net/catalog: "true"
    spec:
      project: default
      source:
        repoURL: "{{ .url }}"
        targetRevision: "{{ .branch }}"
        path: deploy
      destination:
        server: https://kubernetes.default.svc
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions: [CreateNamespace=true]
