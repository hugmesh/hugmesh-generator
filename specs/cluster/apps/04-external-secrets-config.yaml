# ESO configuration — the ClusterSecretStore "snapdragon-vault" and the
# ExternalSecret per workload Secret (casdoor-google, clickhouse-auth x2,
# uptrace-auth). Synced after the ESO controller/CRDs (03-external-secrets.yaml)
# and Vault (02-vault.yaml) are up.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets-config
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Snapdragon-Systems/snapdragon-generator.git
    targetRevision: main
    path: specs/cluster/manifests/external-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
