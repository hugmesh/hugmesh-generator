# ESO configuration — the ClusterSecretStore "hugmesh-vault" and the
# ExternalSecret per workload Secret (casdoor-google, clickhouse-auth x2,
# uptrace-auth). Synced after the ESO controller/CRDs (03-external-secrets.yaml)
# and Vault (02-vault.yaml) are up.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets-config
  namespace: devops
spec:
  project: default
  source:
    repoURL: https://github.com/hugmesh/hugmesh-generator.git
    targetRevision: main
    path: specs/cluster/manifests/external-secrets
    kustomize:
      # THE MESH VAULT BASE SEGMENT — issue #285, decision 38 = B on #347.
      # This Application is applied from the image's BAKED tree (bootstrap.sh's
      # apply_baked_app / bootstrap-kind.sh's apply_core_app), which is the ONLY
      # brand-aware thing on ArgoCD's serving path: the manifests themselves are
      # fetched from repoURL above and are identical for every mesh. So the brand
      # reaches ESO here — rebrand_sysroot() in every build-*-stage4.sh rewrites the
      # `value:` below to <BRAND>, the ClusterSecretStore annotation carries it, and
      # manifests/external-secrets/kustomization.yaml's `replacements` block copies it
      # into the first segment of all 121 remoteRef keys. Written as a ONE-LINE JSON
      # 6902 op so that value is sed-anchorable; the path's `platform.hugmesh.net`
      # half is already sentinel-protected by the frozen-API-group rule, and `~1` is
      # the JSON-Pointer escape for the `/` in the annotation key.
      # At the default brand this writes "hugmesh" and the render is unchanged.
      # Pinned by tests/scripts/test-eso-remoteref-brand.sh.
      patches:
        - target:
            group: external-secrets.io
            kind: ClusterSecretStore
          patch: |-
            - { op: replace, path: /metadata/annotations/platform.hugmesh.net~1vault-base, value: "hugmesh" }
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
