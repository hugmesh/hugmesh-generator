# External Secrets Operator (ESO) — the controller + CRDs, installed from the
# upstream Helm chart. The ClusterSecretStore + ExternalSecret resources that use
# it live in manifests/external-secrets (apps/04-external-secrets-config.yaml).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 0.10.5
    helm:
      releaseName: external-secrets
      values: |
        installCRDs: true
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
