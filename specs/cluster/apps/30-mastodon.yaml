# Mastodon — mastodon.snapdragon.systems. Backend Pis.
# Uses the official Mastodon Helm chart (lives in the mastodon git repo).
# Sign-in via Casdoor OIDC (OMNIAUTH); see docs/architecture.md.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mastodon
  namespace: devops
spec:
  project: default
  source:
    repoURL: https://github.com/mastodon/mastodon.git
    targetRevision: main
    path: chart
    helm:
      releaseName: mastodon
      values: |
        # Pin the chart fullname so the web Service is "mastodon-web", matching
        # the be-gateway URI
        # http://mastodon-web.snapdragon-backend.svc.cluster.local:3000
        # (the official chart names the web Service <fullname>-web).
        fullnameOverride: mastodon
        mastodon:
          local_domain: snapdragon.systems
          web_domain: mastodon.snapdragon.systems
          singleUserMode: false
          # OIDC via Casdoor; admin accounts are created by an admin.
          extraEnvVars:
            - name: OIDC_ENABLED
              value: "true"
            - name: OIDC_ISSUER
              value: "https://id.snapdragon.systems"
        nodeSelector:
          snapdragon.systems/role: backend
        postgresql:
          enabled: true
        redis:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: snapdragon-backend
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
