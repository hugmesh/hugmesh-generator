# hugmesh-wiki-ui — the platform wiki Angular micro-frontend, federated into the
# hugmesh.systems host. Frontend Pis. Talks to wiki-bff-api via the same-origin
# /bff/wiki/** fe-gateway route.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hugmesh-wiki-ui
  namespace: devops
spec:
  project: default
  source:
    repoURL: https://github.com/hugmesh-net/hugmesh-generator.git
    targetRevision: main
    path: specs/cluster/manifests/wiki-ui
  destination:
    server: https://kubernetes.default.svc
    namespace: hugmesh-frontend
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
