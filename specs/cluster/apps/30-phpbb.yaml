# phpBB forum homeserver — BACKEND-ONLY, ISOLATED in the dedicated hugmesh-forum
# namespace (phpBB + phpbb-db + the hugmesh/forum-api extension). It has NO
# gateway route and NO ingress; the only ingress is forum-bff-api + admin-bff-api +
# the reconcile Job, enforced by the namespace's default-deny NetworkPolicy. Same
# 30-tier as the akkoma/tuwunel homeservers.
#
# DEPLOY ORDERING: this app (phpBB + its DB + the netpol + ESO secrets) lands
# BEFORE forum-bff-api is pointed at it (39-forum-bff-api). forum-bff's phpBB legs
# (PHPBB_ENABLED + EXTERNAL_FORUM_ENABLED) are ON since PR #164 (forum-api extension
# live-proven 2026-06-23); it still degrades gracefully (typed degraded envelopes)
# while phpbb is coming up, so there is no hard ordering dependency at first boot.
# CreateNamespace=true provisions hugmesh-forum.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: phpbb
  namespace: devops
spec:
  project: default
  source:
    repoURL: https://github.com/hugmesh/hugmesh-generator.git
    targetRevision: main
    path: specs/cluster/manifests/forum
    kustomize:
      # THE IDENTITY PROVIDER this service trusts (issue #530). This Application
      # is applied from the image's BAKED tree; the manifests it points at come
      # from git. rewrite_idp_sysroot() in the stage4 builders rewrites the values
      # below to the external IdP when --idp is not casdoor, and the git-served
      # kustomization.yaml copies them from the idp-trust annotations onto the env.
      # ONE-LINE ops so each value stays sed-anchorable. At these casdoor defaults
      # the render is unchanged. Pinned by tests/scripts/test-eso-remoteref-brand.sh.
      patches:
        - target: { version: v1, kind: ConfigMap, name: idp-trust }
          patch: |-
            - { op: replace, path: /metadata/annotations/platform.hugmesh.net~1idp-issuer, value: "https://id.hugmesh.net" }
            - { op: replace, path: /metadata/annotations/platform.hugmesh.net~1idp-jwks, value: "https://id.hugmesh.net/.well-known/jwks" }
  destination:
    server: https://kubernetes.default.svc
    namespace: hugmesh-forum
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
