# Owncast live-streaming — GPU-gated x86 optional service (DEFAULT-OFF).
# Scheduled onto the amd64 GPU worker (nodeSelector in manifests/owncast).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: snapdragon-owncast
  namespace: devops
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/Snapdragon-Systems/snapdragon-generator.git
    targetRevision: main
    path: specs/cluster/manifests/owncast
  destination:
    server: https://kubernetes.default.svc
    namespace: snapdragon-owncast
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
