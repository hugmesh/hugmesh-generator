# Usage-analytics datastores: ClickHouse + Kafka (the usage-event bus the admin BFF
# consumes from). Backend Pis / x86_64 host. No service-discovery registry.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: snapdragon-analytics
  namespace: devops
spec:
  project: default
  source:
    repoURL: https://github.com/Snapdragon-Systems/snapdragon-generator.git
    targetRevision: main
    path: specs/cluster/manifests/analytics
  destination:
    server: https://kubernetes.default.svc
    namespace: snapdragon-backend
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
