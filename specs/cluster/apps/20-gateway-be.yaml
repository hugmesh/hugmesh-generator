# hugmesh-be-gateway — front door for backend APIs + matrix + mastodon.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hugmesh-gateway-be
  namespace: devops
  annotations:
    # Wave 2 = after apps/00b-cassandra-init.yaml (wave 1), which creates the
    # hugmesh_gateway keyspace and this instance's CQL role. Starting before
    # that Job has run is not a slow start, it is a CrashLoopBackOff:
    # InvalidKeyspaceException / AuthenticationException at bean creation
    # (docs/KIND-SSO-E2E-FINDINGS.md #5 + #6).
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/hugmesh/hugmesh-generator.git
    targetRevision: main
    path: specs/cluster/charts/hugmesh-gateway
    helm:
      releaseName: hugmesh-be-gateway
      values: |
        instance:
          name: hugmesh-be-gateway
        # This instance's OWN Cassandra role, scoped to hugmesh_gateway only
        # (SELECT+MODIFY+CREATE+ALTER — the gateway image carries the schema
        # migration runner, so it needs the DDL pair; never DROP, never AUTHORIZE,
        # never the superuser). Created by manifests/cassandra-init; the password
        # comes from the cassandra-app-creds ESO Secret in THIS namespace
        # (hugmesh-backend). Without it the pod cannot open a CqlSession at all —
        # the chart shipped no credentials and every gateway CrashLoopBackOff'd on
        # the live cluster (docs/KIND-SSO-E2E-FINDINGS.md #5).
        cassandra:
          username: be_gw_cass
          passwordSecretKey: be-gateway
          # schema-owner, not dml: the gateway image runs the CQL migration
          # runner, so its role needs CREATE+ALTER on top of SELECT+MODIFY.
          # This is the class manifests/cassandra-init's GRANTs are checked
          # against for set equality — see the chart values.yaml.
          access: schema-owner
        # Cross-namespace mTLS client identity (Vault-PKI/ESO hugmesh-be-gateway-mtls).
        # initContainer assembles keystore/truststore; server.ssl stays off so the
        # http readiness probe and the ingress hand-off are unaffected. The DOWNSTREAM
        # (gateway -> API) leg now PRESENTS this client cert + validates backend server
        # certs — gated on by HUGMESH_GATEWAY_MTLS_ENABLED below (hugmesh-gateway
        # repo, feat/mtls-client-presentation). PUBLIC/upstream callers are unaffected
        # (no client cert required of them).
        keystore:
          enabled: true
        ingress:
          enabled: true
          # Cloudflare Tunnel (manifests/cloudflared) fronts api./matrix./
          # mastodon.hugmesh.net; this nginx Ingress is the in-cluster
          # secondary path for the api host. Host routing for matrix/mastodon is
          # done by the gateway's Host predicates regardless of ingress.
          className: nginx
          host: api.hugmesh.net
          # Also front the headscale endpoint; forwarded to the pki gateway (the
          # headscale-forward route) so external tailscale clients never hit pki direct.
          extraHosts:
            - scale.hugmesh.net
            # games.<GAMES_DOMAIN> — the games portal host. Default GAMES_DOMAIN =
            # games.<CLUSTER_DOMAIN>, so this literal rebrands with the primary
            # domain; a custom GAMES_DOMAIN (e.g. the real .games TLD) is rewritten
            # by parameterize_games_domain() in the stage4 builders. The host route
            # is the `games` route below; the federation manifest greys it out when
            # the games slug is omitted (gate_optional_services prunes the route).
            - games.hugmesh.net
        nodeSelector:
          hugmesh.net/backend: "true"
        seLinux:
          level: "s0:c12"
        # Least-privilege DB identity: this gateway logs in as its OWN read-only
        # role `be_gateway` (SELECT-only on gateway_route_access), NOT the DB owner.
        # Password from its OWN ESO Secret (route-access-be-gateway, key password);
        # k8s interpolates it into the R2DBC URL via $(VAR).
        extraEnv:
          - name: ROUTE_ACCESS_DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: route-access-be-gateway
                key: password
          - name: ROUTE_ACCESS_R2DBC_URL
            value: r2dbc:postgresql://be_gateway:$(ROUTE_ACCESS_DB_PASSWORD)@route-access-db.hugmesh-pki.svc.cluster.local:5432/gateway
          # Activate the DOWNSTREAM client-cert presentation + backend-cert
          # validation in the gateway image (hugmesh-gateway repo). When true the
          # gateway's reactor-netty HttpClient loads /stores/keystore.p12 (this
          # gateway's identity) + /stores/truststore.p12 (cluster CA) and presents
          # the cert to the now-mTLS https:// backends below. Default off in the
          # image so dev/local/tests with plain-http backends are unaffected.
          - name: HUGMESH_GATEWAY_MTLS_ENABLED
            value: "true"
          # ── BFF session bridge: opaque bff_ → Spring SecurityContext ──────────
          # Same stanza as 20-gateway-fe.yaml: BffSessionAuthFilter introspects a
          # bff_ session against admin-bff so cookie-mode browser requests that
          # reach THIS gateway (fe forwards /be/** here with cookies intact)
          # authenticate instead of 503ing on the unresolvable image default.
          # BFF_BASE_URL points to admin-bff (which owns the bff_session DB);
          # INTERNAL_TOKEN authenticates the back-channel (matches admin-bff's
          # InternalTokenWebFilter — BLANK in dev → no-op on both sides).
          - { name: APP_BFF_SESSION_ENABLED, value: "true" }
          # https:// for the same reason as 20-gateway-fe.yaml: admin-bff serves TLS
          # with client-auth=need, so plain HTTP into :8080 dies as "Connection
          # prematurely closed BEFORE response" and the session bridge 503s. Both
          # gateways carried the same stale scheme; fixing only the one the e2e
          # happens to drive would leave the identical defect on the other.
          - name: BFF_BASE_URL
            value: https://hugmesh-admin-bff-api.hugmesh-backend.svc.cluster.local:8080
          - name: INTERNAL_TOKEN
            valueFrom:
              secretKeyRef:
                name: bff-internal-token
                key: token
                optional: true
        routes:
          # headscale forwarding: external tailscale clients hit scale.<domain> on
          # this backend gateway and are forwarded to the pki gateway -> headscale,
          # so the pki gateway never faces the internet (no direct external path).
          - id: headscale-forward
            host: scale.hugmesh.net
            uri: http://hugmesh-pki-gateway.hugmesh-pki.svc.cluster.local:8080
            # Relay with the ORIGINAL Host. Spring Cloud Gateway otherwise sends the
            # upstream URI's host (the pki gateway Service DNS name), so the pki
            # gateway's own `headscale` route (Host=scale.<domain>, apps/20-gateway-pki)
            # and its headscale host gate can never match relayed traffic.
            filters:
              - PreserveHostHeader
          # --- Mastodon (mastodon.hugmesh.net) — specific paths first ---
          # ⚠️ REPOINTED to the akkoma-proxy mTLS sidecar (:4443, https) — the
          # homeservers are network-isolated (manifests/networkpolicy/homeserver-
          # isolation.yaml) and reachable only via the cluster-CA-mTLS proxy. The
          # gateway PRESENTS its client cert here (HUGMESH_GATEWAY_MTLS_ENABLED=true,
          # already set above) and validates the proxy's server cert against the
          # cluster CA. Route-DB gating is now ROLE_MASTODON/ROLE_MOD/ROLE_ADMIN
          # (per-platform access roles, see manifests/route-access/20-schema.sql),
          # not the broad ROLE_USER floor.
          # Mastodon's OAuth endpoints (authorize/token), gated /oauth/** distinctly.
          - id: mastodon-oauth
            host: mastodon.hugmesh.net
            uri: https://akkoma-proxy.hugmesh-backend.svc.cluster.local:4443
            path: /oauth/**
          # Mastodon REST API (statuses, timelines, …) under the mastodon host.
          - id: mastodon-api
            host: mastodon.hugmesh.net
            uri: https://akkoma-proxy.hugmesh-backend.svc.cluster.local:4443
            path: /api/v1/**
          # Everything else on the mastodon host (web UI, streaming, .well-known).
          - id: mastodon-web
            host: mastodon.hugmesh.net
            uri: https://akkoma-proxy.hugmesh-backend.svc.cluster.local:4443
          # --- Matrix (matrix.hugmesh.net) ---
          # ⚠️ REPOINTED to the tuwunel-proxy mTLS sidecar (:4443, https) — same
          # isolation + client-cert presentation as the mastodon routes above.
          # The Matrix client/server API. Present both as a host route and a
          # path route so /_matrix/** resolves whether or not the Host header is
          # the matrix subdomain (federation .well-known hits the apex too).
          - id: matrix-api
            host: matrix.hugmesh.net
            uri: https://tuwunel-proxy.hugmesh-backend.svc.cluster.local:4443
            path: /_matrix/**
          - id: matrix-wellknown
            uri: https://tuwunel-proxy.hugmesh-backend.svc.cluster.local:4443
            path: /_matrix/**
          - id: matrix
            host: matrix.hugmesh.net
            uri: https://tuwunel-proxy.hugmesh-backend.svc.cluster.local:4443
          # --- HugMesh Games (games.<GAMES_DOMAIN>) ---
          # Host route for the games portal. Default GAMES_DOMAIN =
          # games.<CLUSTER_DOMAIN> so this literal rebrands with the primary domain
          # and rides the *.<primary> wildcard (CoreDNS in test, cloudflared in
          # prod) with NO new DNS/cert; a custom GAMES_DOMAIN (the real .games TLD)
          # is rewritten by parameterize_games_domain() in the stage4 builders.
          # ⚠ OPTIONAL slug `games`: gate_optional_services REMOVES this route (and
          # the extraHost above + the games route-access rows) when games is
          # deselected, so a games-less build does not 502 on games.<domain>.
          # TODO(gateway wave): keep CanonicalSeed.java (hugmesh-gateway repo)
          # + cloudflared games hostname in sync — see docs/OPTIONAL-SERVICES.md.
          - id: games
            host: games.hugmesh.net
            uri: http://hugmesh-games.hugmesh-games.svc.cluster.local:8080
          # --- Games app-store per-instance HTTP CONSOLES (PR7) ---
          # /games/servers/<slug>/<name>/** path-routes to the per-instance HTTP console
          # Services in hugmesh-games-instances. Raw L4 game protocols do NOT come here
          # (Spring Cloud Gateway is L7-only) — they are exposed per-instance via the
          # reserved-pool NodePort the admin-bff allocates (31000-31099); RCON/admin ports
          # stay tailnet-only ClusterIP and are never routed. This route is keyed on
          # ROLE_GAMES_SERVICES at the route-access DB (manifests/route-access, PR3); the
          # console dispatcher Service resolves the <slug>/<name> path segment to the
          # matching per-instance Service (rendered by apps/13c from the admin-bff
          # ConfigMaps). MORE SPECIFIC than the games host route above — declared after it
          # but on a distinct path prefix, so no collision.
          # ⚠ OPTIONAL slug `games`: gate_optional_services REMOVES this route + its
          # route-access rows when games is deselected (PR10).
          - id: games-servers-console
            uri: http://games-instances-console.hugmesh-games-instances.svc.cluster.local:8080
            path: /games/servers/**
          # --- hugmesh-federation-api (api.hugmesh.net) — the module-
          # federation registry/manifest/bundles API. MORE SPECIFIC than the
          # /api/** hugmesh-api catch-all below, so it MUST be declared FIRST
          # (Spring Cloud Gateway matches routes in declared order) or the broad
          # /api/** route would swallow /api/federation/**. Fine-grained authz
          # (modules/overrides=ADMIN, moderation=MOD/ADMIN, manifest GET +
          # bundles=authenticated) is enforced inside federation's SecurityConfig;
          # the route DB gates the coarse authenticated floor (ROLE_USER).
          # https:// — federation-api now enforces mTLS (client-auth=need); the
          # gateway presents its client cert on this leg (HUGMESH_GATEWAY_MTLS_ENABLED).
          - id: federation-api
            uri: https://hugmesh-federation-api.hugmesh-backend.svc.cluster.local:8080
            path: /api/federation/**
          # --- HugMesh Spring APIs (api.hugmesh.net) ---
          # https:// — hugmesh-api now enforces mTLS (client-auth=need).
          - id: hugmesh-api
            uri: https://hugmesh-api.hugmesh-backend.svc.cluster.local:8080
            path: /api/**
          # --- edge-AI on ai.<domain> (OpenAI model API + analysis API + TTS API) --
          # /v1/analyze/** -> the analysis API (edge-ai-analysis slug) and
          # /v1/synthesize/** -> the TTS API (edge-ai-tts slug), BOTH MORE SPECIFIC,
          # declared FIRST so they win over the edge-ai host catchall below; everything
          # else on ai.<domain> -> the raw Ollama model server (edge-ai slug). route-access
          # gates /v1/** + /v1/analyze/** + /v1/synthesize/** to the ROLE_USER floor
          # (distinct from /api/**).
          # ⚠ gate_optional_services prunes each by id: edge-ai-analysis with its slug,
          # edge-ai-tts with its slug, edge-ai (the catchall) with the edge-ai slug;
          # the catchall stops the last prune cleanly at `destination:` touching no
          # other route's comments.
          - id: edge-ai-analysis
            host: ai.hugmesh.net
            uri: http://hugmesh-edge-ai-analysis.hugmesh-inference.svc.cluster.local:8080
            path: /v1/analyze/**
          - id: edge-ai-tts
            host: ai.hugmesh.net
            uri: http://hugmesh-edge-ai-tts.hugmesh-inference.svc.cluster.local:8080
            path: /v1/synthesize/**
          - id: edge-ai
            host: ai.hugmesh.net
            uri: http://hugmesh-edge-ai.hugmesh-inference.svc.cluster.local:11434
  destination:
    server: https://kubernetes.default.svc
    namespace: hugmesh-backend
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
