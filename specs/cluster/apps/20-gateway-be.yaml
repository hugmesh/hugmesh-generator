# snapdragon-be-gateway — front door for backend APIs + matrix + mastodon.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: snapdragon-gateway-be
  namespace: devops
spec:
  project: default
  source:
    repoURL: https://github.com/Snapdragon-Systems/snapdragon-generator.git
    targetRevision: main
    path: specs/cluster/charts/snapdragon-gateway
    helm:
      releaseName: snapdragon-be-gateway
      values: |
        instance:
          name: snapdragon-be-gateway
        # Cross-namespace mTLS client identity (Vault-PKI/ESO snapdragon-be-gateway-mtls).
        # initContainer assembles keystore/truststore; server.ssl stays off so the
        # http readiness probe and the ingress hand-off are unaffected. The DOWNSTREAM
        # (gateway -> API) leg now PRESENTS this client cert + validates backend server
        # certs — gated on by SNAPDRAGON_GATEWAY_MTLS_ENABLED below (snapdragon-gateway
        # repo, feat/mtls-client-presentation). PUBLIC/upstream callers are unaffected
        # (no client cert required of them).
        keystore:
          enabled: true
        ingress:
          enabled: true
          # Cloudflare Tunnel (manifests/cloudflared) fronts api./matrix./
          # mastodon.snapdragon.systems; this nginx Ingress is the in-cluster
          # secondary path for the api host. Host routing for matrix/mastodon is
          # done by the gateway's Host predicates regardless of ingress.
          className: nginx
          host: api.snapdragon.systems
          # Also front the headscale endpoint; forwarded to the pki gateway (the
          # headscale-forward route) so external tailscale clients never hit pki direct.
          extraHosts:
            - scale.snapdragon.systems
            # games.<GAMES_DOMAIN> — the games portal host. Default GAMES_DOMAIN =
            # games.<CLUSTER_DOMAIN>, so this literal rebrands with the primary
            # domain; a custom GAMES_DOMAIN (e.g. the real .games TLD) is rewritten
            # by parameterize_games_domain() in the stage4 builders. The host route
            # is the `games` route below; the federation manifest greys it out when
            # the games slug is omitted (gate_optional_services prunes the route).
            - games.snapdragon.systems
        nodeSelector:
          snapdragon.systems/backend: "true"
        seLinux:
          level: "s0:c12"
        # Least-privilege DB identity: this gateway logs in as its OWN read-only
        # role `be_gateway` (SELECT-only on gateway_route_access), NOT the DB owner.
        # Password from its OWN ESO Secret (route-access-be-gateway, key password);
        # k8s interpolates it into the R2DBC URL via $(VAR).
        extraEnv:
          - name: ROUTE_ACCESS_DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: route-access-be-gateway
                key: password
          - name: ROUTE_ACCESS_R2DBC_URL
            value: r2dbc:postgresql://be_gateway:$(ROUTE_ACCESS_DB_PASSWORD)@route-access-db.snapdragon-pki.svc.cluster.local:5432/gateway
          # Activate the DOWNSTREAM client-cert presentation + backend-cert
          # validation in the gateway image (snapdragon-gateway repo). When true the
          # gateway's reactor-netty HttpClient loads /stores/keystore.p12 (this
          # gateway's identity) + /stores/truststore.p12 (cluster CA) and presents
          # the cert to the now-mTLS https:// backends below. Default off in the
          # image so dev/local/tests with plain-http backends are unaffected.
          - name: SNAPDRAGON_GATEWAY_MTLS_ENABLED
            value: "true"
        routes:
          # headscale forwarding: external tailscale clients hit scale.<domain> on
          # this backend gateway and are forwarded to the pki gateway -> headscale,
          # so the pki gateway never faces the internet (no direct external path).
          - id: headscale-forward
            host: scale.snapdragon.systems
            uri: http://snapdragon-pki-gateway.snapdragon-pki.svc.cluster.local:8080
          # --- Mastodon (mastodon.snapdragon.systems) — specific paths first ---
          # ⚠️ REPOINTED to the akkoma-proxy mTLS sidecar (:4443, https) — the
          # homeservers are network-isolated (manifests/networkpolicy/homeserver-
          # isolation.yaml) and reachable only via the cluster-CA-mTLS proxy. The
          # gateway PRESENTS its client cert here (SNAPDRAGON_GATEWAY_MTLS_ENABLED=true,
          # already set above) and validates the proxy's server cert against the
          # cluster CA. Route-DB gating is now ROLE_MASTODON/ROLE_MOD/ROLE_ADMIN
          # (per-platform access roles, see manifests/route-access/20-schema.sql),
          # not the broad ROLE_USER floor.
          # Mastodon's OAuth endpoints (authorize/token), gated /oauth/** distinctly.
          - id: mastodon-oauth
            host: mastodon.snapdragon.systems
            uri: https://akkoma-proxy.snapdragon-backend.svc.cluster.local:4443
            path: /oauth/**
          # Mastodon REST API (statuses, timelines, …) under the mastodon host.
          - id: mastodon-api
            host: mastodon.snapdragon.systems
            uri: https://akkoma-proxy.snapdragon-backend.svc.cluster.local:4443
            path: /api/v1/**
          # Everything else on the mastodon host (web UI, streaming, .well-known).
          - id: mastodon-web
            host: mastodon.snapdragon.systems
            uri: https://akkoma-proxy.snapdragon-backend.svc.cluster.local:4443
          # --- Matrix (matrix.snapdragon.systems) ---
          # ⚠️ REPOINTED to the tuwunel-proxy mTLS sidecar (:4443, https) — same
          # isolation + client-cert presentation as the mastodon routes above.
          # The Matrix client/server API. Present both as a host route and a
          # path route so /_matrix/** resolves whether or not the Host header is
          # the matrix subdomain (federation .well-known hits the apex too).
          - id: matrix-api
            host: matrix.snapdragon.systems
            uri: https://tuwunel-proxy.snapdragon-backend.svc.cluster.local:4443
            path: /_matrix/**
          - id: matrix-wellknown
            uri: https://tuwunel-proxy.snapdragon-backend.svc.cluster.local:4443
            path: /_matrix/**
          - id: matrix
            host: matrix.snapdragon.systems
            uri: https://tuwunel-proxy.snapdragon-backend.svc.cluster.local:4443
          # --- Snapdragon Games (games.<GAMES_DOMAIN>) ---
          # Host route for the games portal. Default GAMES_DOMAIN =
          # games.<CLUSTER_DOMAIN> so this literal rebrands with the primary domain
          # and rides the *.<primary> wildcard (CoreDNS in test, cloudflared in
          # prod) with NO new DNS/cert; a custom GAMES_DOMAIN (the real .games TLD)
          # is rewritten by parameterize_games_domain() in the stage4 builders.
          # ⚠ OPTIONAL slug `games`: gate_optional_services REMOVES this route (and
          # the extraHost above + the games route-access rows) when games is
          # deselected, so a games-less build does not 502 on games.<domain>.
          # TODO(gateway wave): keep CanonicalSeed.java (snapdragon-gateway repo)
          # + cloudflared games hostname in sync — see docs/OPTIONAL-SERVICES.md.
          - id: games
            host: games.snapdragon.systems
            uri: http://snapdragon-games.snapdragon-games.svc.cluster.local:8080
          # --- snapdragon-federation-api (api.snapdragon.systems) — the module-
          # federation registry/manifest/bundles API. MORE SPECIFIC than the
          # /api/** snapdragon-api catch-all below, so it MUST be declared FIRST
          # (Spring Cloud Gateway matches routes in declared order) or the broad
          # /api/** route would swallow /api/federation/**. Fine-grained authz
          # (modules/overrides=ADMIN, moderation=MOD/ADMIN, manifest GET +
          # bundles=authenticated) is enforced inside federation's SecurityConfig;
          # the route DB gates the coarse authenticated floor (ROLE_USER).
          # https:// — federation-api now enforces mTLS (client-auth=need); the
          # gateway presents its client cert on this leg (SNAPDRAGON_GATEWAY_MTLS_ENABLED).
          - id: federation-api
            uri: https://snapdragon-federation-api.snapdragon-backend.svc.cluster.local:8080
            path: /api/federation/**
          # --- Snapdragon Spring APIs (api.snapdragon.systems) ---
          # https:// — snapdragon-api now enforces mTLS (client-auth=need).
          - id: snapdragon-api
            uri: https://snapdragon-api.snapdragon-backend.svc.cluster.local:8080
            path: /api/**
  destination:
    server: https://kubernetes.default.svc
    namespace: snapdragon-backend
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
