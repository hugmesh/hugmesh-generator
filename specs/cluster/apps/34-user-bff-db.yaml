# user-bff-db — dedicated Postgres for hugmesh-user-bff-api's config datastore
# (the user_profile / user_preference / user_block tables). hugmesh-backend,
# ClusterIP. No initdb seed — user-bff owns its schema via Liquibase (applied by
# the app at startup), so this DB just needs to exist EMPTY.
#
# sync-wave "1": reconcile the DB BEFORE the user-bff app (apps/37, wave 0) so
# Liquibase has a target. user-bff retries (k8s restarts the pod until the DB is
# Ready), so this ordering is helpful, not a hard gate — same posture as
# admin-bff-db (wave 1) / federation-db (wave 1).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: user-bff-db
  namespace: devops
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/hugmesh/hugmesh-generator.git
    targetRevision: main
    path: specs/cluster/manifests/user-bff-db
  destination:
    server: https://kubernetes.default.svc
    namespace: hugmesh-backend
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
