# Casdoor — the cluster's single OAuth2 / OIDC identity provider. Google login
# (federated sign-up) + admin-created accounts. Control-plane (pki) node.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: casdoor
  namespace: devops
spec:
  project: default
  source:
    repoURL: https://github.com/Snapdragon-Systems/hugmesh-generator.git
    targetRevision: main
    path: specs/cluster/manifests/casdoor
  destination:
    server: https://kubernetes.default.svc
    namespace: hugmesh-pki
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
