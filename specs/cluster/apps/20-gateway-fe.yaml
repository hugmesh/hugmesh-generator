# snapdragon-fe-gateway — front door for snapdragon.systems (the Angular host
# front page) + the integrated matrix/mastodon social-ui micro-frontends.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: snapdragon-gateway-fe
  namespace: devops
spec:
  project: default
  source:
    repoURL: https://github.com/Snapdragon-Systems/snapdragon-generator.git
    targetRevision: main
    path: specs/cluster/charts/snapdragon-gateway
    helm:
      releaseName: snapdragon-fe-gateway
      values: |
        instance:
          name: snapdragon-fe-gateway
        # Cross-namespace mTLS client identity (Vault-PKI/ESO snapdragon-fe-gateway-mtls).
        # The DOWNSTREAM (gateway -> BFF/federation) leg PRESENTS this client cert +
        # validates backend server certs — gated on by SNAPDRAGON_GATEWAY_MTLS_ENABLED
        # below. PUBLIC/upstream callers (browsers via Cloudflare/ingress) are NOT asked
        # for a client cert; only the downstream leg to the now-mTLS https:// backends.
        keystore:
          enabled: true
        ingress:
          enabled: true
          # Cloudflare Tunnel (manifests/cloudflared) is the primary external
          # edge; this nginx Ingress is the in-cluster alternative/secondary
          # path. Either way only the gateway Service is exposed.
          className: nginx
          host: snapdragon.systems
          # VANITY SUBDOMAINS: admit *.snapdragon.systems so the ingress accepts
          # <username>.snapdragon.systems and hands it to this gateway, where the
          # Host=*.snapdragon.systems route (below) resolves the public profile.
          # The wildcard DNS (manifests/lan-dns in test; Cloudflare wildcard in
          # prod) already points *.snapdragon.systems at the backend ingress; this
          # extraHosts entry makes the fe-gateway ingress admit the vanity hosts.
          # The reserved service hosts (id. api. matrix. mastodon. scale.
          # headscale.) are served by the BE gateway ingress + cloudflared, not
          # this one, so they are unaffected.
          extraHosts:
            - "*.snapdragon.systems"
        nodeSelector:
          snapdragon.systems/frontend: "true"
        seLinux:
          level: "s0:c13"
        # Least-privilege DB identity: this gateway logs in as its OWN read-only
        # role `fe_gateway` (SELECT-only on gateway_route_access), NOT the DB owner.
        # Password from its OWN ESO Secret (route-access-fe-gateway, key password);
        # k8s interpolates it into the R2DBC URL via $(VAR).
        extraEnv:
          - name: ROUTE_ACCESS_DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: route-access-fe-gateway
                key: password
          - name: ROUTE_ACCESS_R2DBC_URL
            value: r2dbc:postgresql://fe_gateway:$(ROUTE_ACCESS_DB_PASSWORD)@route-access-db.snapdragon-pki.svc.cluster.local:5432/gateway
          # Activate downstream client-cert presentation + backend-cert validation
          # for the now-mTLS https:// BFF/federation backends (snapdragon-gateway repo).
          # Default off in the image; the UI remotes (port 80) and be-gateway stay http.
          - name: SNAPDRAGON_GATEWAY_MTLS_ENABLED
            value: "true"
        routes:
          # Each federated micro-frontend on its own nginx remote (specific
          # paths first)…
          - id: matrix-ui
            uri: http://snapdragon-matrix-ui.snapdragon-frontend.svc.cluster.local:80
            path: /social/matrix/**
          - id: mastodon-ui
            uri: http://snapdragon-mastodon-ui.snapdragon-frontend.svc.cluster.local:80
            path: /social/mastodon/**
          # phpBB forum micro-frontend remote, served at the apex PATH
          # /social/forum/** (NOT a forum. subdomain — the *.snapdragon.systems
          # vanity wildcard would swallow forum.<domain>). Congruent with the
          # matrix/mastodon shells. The phpBB pod itself is NEVER routed (backend-
          # only, isolated in snapdragon-forum); only this Angular remote + the
          # /bff/forum BFF below are public. Role floor ROLE_FORUM (route-DB).
          - id: forum-ui
            uri: http://snapdragon-forum-ui.snapdragon-frontend.svc.cluster.local:80
            path: /social/forum/**
          - id: login-ui
            uri: http://snapdragon-login-ui.snapdragon-frontend.svc.cluster.local:80
            path: /login/**
          - id: admin-ui
            uri: http://snapdragon-admin-ui.snapdragon-frontend.svc.cluster.local:80
            path: /admin/**
          # Moderation micro-frontend remote (/mod/** -> snapdragon-mod-ui). Role
          # floor ROLE_MOD (route-DB), declared with the other path-scoped MFE
          # remotes; the host loads its remoteEntry after a moderator logs in.
          - id: mod-ui
            uri: http://snapdragon-mod-ui.snapdragon-frontend.svc.cluster.local:80
            path: /mod/**
          # Self-service user micro-frontend remote (/user/** -> snapdragon-user-ui).
          # Role floor ROLE_USER (route-DB).
          - id: user-ui
            uri: http://snapdragon-user-ui.snapdragon-frontend.svc.cluster.local:80
            path: /user/**
          # API documentation micro-frontend remote (/apidocs/** -> snapdragon-api-docs).
          # Role floor ROLE_ADMIN (route-DB) — the rendered OpenAPI/spec docs are
          # admin-only, matching federation's spec floor.
          - id: api-docs
            uri: http://snapdragon-api-docs.snapdragon-frontend.svc.cluster.local:80
            path: /apidocs/**
          # Same-origin BFFs: the /bff/** family proxies to the role BFFs in the
          # backend namespace, so the UIs' bff.service calls are first-party to
          # snapdragon.systems. Spring Cloud Gateway matches FIRST-IN-DECLARED-ORDER,
          # so the MORE SPECIFIC subpaths are declared BEFORE the /bff/** catch-all:
          #   /bff/mod/**  -> mod-bff-api   (ROLE_MOD,  +ADMIN superset)
          #   /bff/user/** -> user-bff-api  (ROLE_USER)
          #   /bff/**      -> admin-bff-api (the remaining /bff/login, /bff/register,
          #                  /bff/provision, /bff/me, /bff/admin/** — /bff/admin/**
          #                  => ROLE_ADMIN). The fe-gateway enforces the route-DB
          #                  role rules before each proxy.
          # https:// — the three BFFs now enforce mTLS (client-auth=need); the
          # gateway presents its client cert on these legs (SNAPDRAGON_GATEWAY_MTLS_ENABLED).
          - id: snapdragon-mod-bff-api
            uri: https://snapdragon-mod-bff-api.snapdragon-backend.svc.cluster.local:8080
            path: /bff/mod/**
          - id: snapdragon-user-bff-api
            uri: https://snapdragon-user-bff-api.snapdragon-backend.svc.cluster.local:8080
            path: /bff/user/**
          # Forum BFF (/bff/forum/** -> snapdragon-forum-bff-api), the SINGLE
          # browser->phpBB path. SIBLING of /bff/mod/** + /bff/user/** above (each a
          # non-overlapping prefix gated to its own role floor). The moderation
          # subpath is declared FIRST (more specific) so it keeps its ROLE_FORUM_MOD
          # gate; the /bff/forum/** floor (ROLE_FORUM) follows. Both BEFORE the
          # /bff/** admin-bff catch-all. https:// — forum-bff enforces mTLS
          # (client-auth=need); the gateway presents its client cert on this leg.
          - id: snapdragon-forum-bff-api-moderation
            uri: https://snapdragon-forum-bff-api.snapdragon-backend.svc.cluster.local:8080
            path: /bff/forum/moderation/**
          - id: snapdragon-forum-bff-api
            uri: https://snapdragon-forum-bff-api.snapdragon-backend.svc.cluster.local:8080
            path: /bff/forum/**
          # SSO login/session/registration RELOCATED admin-bff -> user-bff-api: login
          # is a user concern, so the user BFF now owns /bff/login, /bff/register,
          # /bff/me, /bff/session, /bff/provision AND the new OIDC token-handler
          # callback (/bff/auth/callback). These are MORE-SPECIFIC than the /bff/**
          # admin-bff catch-all below, so — like the mod/user/forum siblings above —
          # they MUST be declared FIRST to win the route match. (The internal
          # bff_->JWT exchange endpoint /bff/internal/** is NOT routed here: the
          # gateway's BffJwtExchangeWebFilter calls user-bff in-cluster directly.)
          - id: snapdragon-user-bff-api-login
            uri: https://snapdragon-user-bff-api.snapdragon-backend.svc.cluster.local:8080
            path: /bff/login
          - id: snapdragon-user-bff-api-register
            uri: https://snapdragon-user-bff-api.snapdragon-backend.svc.cluster.local:8080
            path: /bff/register/**
          - id: snapdragon-user-bff-api-me
            uri: https://snapdragon-user-bff-api.snapdragon-backend.svc.cluster.local:8080
            path: /bff/me/**
          - id: snapdragon-user-bff-api-session
            uri: https://snapdragon-user-bff-api.snapdragon-backend.svc.cluster.local:8080
            path: /bff/session
          - id: snapdragon-user-bff-api-provision
            uri: https://snapdragon-user-bff-api.snapdragon-backend.svc.cluster.local:8080
            path: /bff/provision/**
          - id: snapdragon-user-bff-api-oidc-callback
            uri: https://snapdragon-user-bff-api.snapdragon-backend.svc.cluster.local:8080
            path: /bff/auth/callback
          - id: snapdragon-admin-bff-api
            uri: https://snapdragon-admin-bff-api.snapdragon-backend.svc.cluster.local:8080
            path: /bff/**
          # DB-hosted module-federation FRAGMENT bundles (user-profile/card +
          # admin "contained pages"). The authenticated host's loadRemoteModule
          # fetches /_fragments/<slug>/<contentHash>/...remoteEntry.json from the
          # remote-fragment static fleet. Content-addressed + immutable; the
          # federation manifest only emits enabled/visible modules, so visibility
          # is enforced upstream and these are content-addressed (non-secret) bytes
          # — gated to the ROLE_USER floor (the host loads them after login).
          - id: remote-fragment
            uri: http://snapdragon-remote-fragment.snapdragon-frontend.svc.cluster.local:80
            path: /_fragments/**
          # Default cross-namespace scope: snapdragon.systems/be/** -> the backend
          # gateway (StripPrefix drops /be so /be/api -> /api at the be-gateway).
          # Ships by default; once DB-driven route definitions land (Phase 2 core,
          # in the gateway/admin-bff repos) an admin can re-point this entry via
          # the routing DB + admin UI without a redeploy.
          - id: be-default
            uri: http://snapdragon-be-gateway.snapdragon-backend.svc.cluster.local:8080
            path: /be/**
            filters:
              - StripPrefix=1
          # --- VANITY SUBDOMAINS: <username>.snapdragon.systems ---
          # A Host=*.snapdragon.systems predicate. Spring Cloud Gateway matches
          # routes FIRST-IN-DECLARED-ORDER, so PRECEDENCE is everything here:
          #
          #   * The Host=*.<domain> wildcard predicate matches ANY single-label
          #     subdomain (alice.<domain>) but NOT the apex <domain> itself (the
          #     `*` requires at least one label), so the apex still falls through
          #     to `frontend-host` below.
          #   * The RESERVED service subdomains (id. api. matrix. mastodon. scale.
          #     headscale.) are fronted by the BE gateway ingress + cloudflared and
          #     never routed to THIS fe-gateway, so they cannot be captured here.
          #     (Defence-in-depth: federation's VanityController also refuses those
          #     reserved first-labels.)
          #   * This route is declared AFTER the apex/path routes above and BEFORE
          #     `frontend-host` (the path=/** catch-all). The earlier routes are
          #     path-scoped and host-agnostic; a vanity host hitting one of those
          #     specific paths (/login, /admin, …) is rare and intentional. The key
          #     ordering guarantee is wildcard-vanity BEFORE the /** frontend-host,
          #     so a vanity host with no special path resolves to the profile
          #     instead of the apex front page.
          #
          # The request is forwarded DIRECTLY to federation-api (NOT via the
          # be-gateway) with the path REWRITTEN to the public vanity-resolve
          # endpoint via SetPath. The Host header is PRESERVED (Spring Cloud
          # Gateway forwards it by default), so federation-api extracts the
          # username from the FIRST DNS LABEL of the Host
          # (VanityController.resolveByHost) — no username needs parsing here.
          # federation returns the public profile-fragment descriptor; the
          # host/remote-fragment then renders the fragment (see the federation-api
          # README "Vanity subdomains" + its honest SERVING note).
          #
          # WHY DIRECT (not via be-gateway): the vanity resolve is a PUBLIC read
          # (no JWT — it IS the public profile). The be-gateway would interpose its
          # own auth and 401 the anonymous request. federation-api's SecurityConfig
          # already permitAll's `GET /api/federation/vanity/**`, so a direct hop is
          # the public path with no extra auth layer to satisfy.
          #
          # HONEST CROSS-SERVICE CAVEAT (deferred — needs a snapdragon-gateway
          # change, a THIRD repo): the shared gateway image's SecurityConfig
          # (snapdragon-gateway repo) ends every chain with
          # `anyExchange().authenticated()` and permits only a hardcoded
          # PUBLIC_PATHS allowlist (/api/auth, /api/registration, /api/login, the
          # login/registration/banned remotes). `/api/federation/vanity/**` is NOT
          # in that list, so THIS fe-gateway pod would itself 401 the anonymous
          # vanity request before proxying. To make the public vanity host actually
          # reachable, add `/api/federation/vanity/**` (or a Host=*.<domain> public
          # rule) to the gateway PUBLIC_PATHS. That edit is out of scope for this
          # two-repo pass and is documented as a deferral in the federation-api
          # README. The generator side (wildcard ingress host + Host predicate
          # route + direct federation target) is complete and renders clean.
          # https:// — federation-api now enforces mTLS; this direct (non-be-gateway)
          # hop presents the fe-gateway client cert. The vanity resolve is still a
          # PUBLIC read at the federation app layer (permitAll GET vanity/**) — mTLS
          # only authenticates the GATEWAY pod to federation, not the end user.
          - id: vanity-subdomain
            host: "*.snapdragon.systems"
            uri: https://snapdragon-federation-api.snapdragon-backend.svc.cluster.local:8080
            filters:
              - SetPath=/api/federation/vanity
          # …then the snapdragon.systems Angular host catches everything else
          # (the apex + any path the routes above did not claim).
          - id: frontend-host
            uri: http://snapdragon-systems-web.snapdragon-frontend.svc.cluster.local:80
            path: /**
  destination:
    server: https://kubernetes.default.svc
    namespace: snapdragon-frontend
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
