# mod-bff — Backend-For-Frontend for the hugmesh-mod-ui. ClusterIP in
# hugmesh-backend; the ONLY way in is the fe-gateway /bff/mod/** route (same
# origin as hugmesh.systems). Owns the mod_action audit table in mod-bff-db and
# calls federation-api (JWT-bearing WebClient) for moderation_requests.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mod-bff-api
  namespace: devops
spec:
  project: default
  source:
    repoURL: https://github.com/Snapdragon-Systems/hugmesh-generator.git
    targetRevision: main
    path: specs/cluster/manifests/mod-bff-api
  destination:
    server: https://kubernetes.default.svc
    namespace: hugmesh-backend
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
