# cloudflared — Cloudflare Tunnel. The cluster's external edge: maps the public
# snapdragon.systems / id. / api. / matrix. / mastodon. hostnames to the three
# gateway Services (ClusterIP). Only the gateways are reachable from outside;
# everything behind them is ClusterIP and role-gated by the gateways.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudflared
  namespace: devops
spec:
  project: default
  source:
    repoURL: https://github.com/Snapdragon-Systems/snapdragon-generator.git
    targetRevision: main
    path: specs/cluster/manifests/cloudflared
  destination:
    server: https://kubernetes.default.svc
    namespace: devops
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
