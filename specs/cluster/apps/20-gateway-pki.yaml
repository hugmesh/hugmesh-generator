# snapdragon-pki-gateway — front door for the identity tier (Casdoor).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: snapdragon-gateway-pki
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Snapdragon-Systems/catalyst-scripts.git
    targetRevision: main
    path: specs/cluster/charts/snapdragon-gateway
    helm:
      releaseName: snapdragon-pki-gateway
      values: |
        instance:
          name: snapdragon-pki-gateway
        ingress:
          enabled: true
          host: id.snapdragon.systems
        nodeSelector:
          snapdragon.systems/role: pki
        routes:
          - id: casdoor-auth
            uri: http://casdoor.snapdragon-pki.svc.cluster.local:8000
            path: /api/auth/**
          - id: casdoor-login
            uri: http://casdoor.snapdragon-pki.svc.cluster.local:8000
            path: /login/**
          - id: casdoor-oidc
            uri: http://casdoor.snapdragon-pki.svc.cluster.local:8000
            path: /.well-known/**
  destination:
    server: https://kubernetes.default.svc
    namespace: snapdragon-pki
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
