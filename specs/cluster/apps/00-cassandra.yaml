# Cassandra — backs every gateway's revocation list + URL registry.
# Lives on the pki control-plane node. Chart pinned to bitnami/cassandra 12.3.11
# (Cassandra 5.0.5); the image is pulled from the bitnamilegacy registry because
# Bitnami moved the free images there (the charts now default to subscription
# images). Bump the pin deliberately, not on every sync.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cassandra
  namespace: devops
spec:
  project: default
  source:
    repoURL: https://charts.bitnami.com/bitnami
    chart: cassandra
    targetRevision: 12.3.11
    helm:
      releaseName: cassandra
      values: |
        # Bitnami's free images live under the bitnamilegacy registry now; the
        # chart otherwise points at subscription images that won't pull. Use the
        # legacy image matching this pinned chart (Cassandra 5.0.5).
        global:
          security:
            allowInsecureImages: true
        image:
          registry: docker.io
          repository: bitnamilegacy/cassandra
        replicaCount: 1
        # SELinux MCS identity (SECURITY.md §3): pin Cassandra to the free
        # category s0:c63 so its category-isolated data volume cannot be read
        # by another workload. The bitnami cassandra 12.3.11 chart renders
        # arbitrary seLinuxOptions under BOTH podSecurityContext (pod-level —
        # governs the volume relabel context) and containerSecurityContext
        # (container-level — the audit precedent in this repo sets it at BOTH
        # levels). We set only seLinuxOptions.level and leave every other
        # securityContext default the chart ships untouched, so this is a clean,
        # supported values override (no fork, no template patch).
        podSecurityContext:
          enabled: true
          seLinuxOptions:
            level: "s0:c63"
        containerSecurityContext:
          enabled: true
          seLinuxOptions:
            level: "s0:c63"
        cluster:
          name: HugMeshGatewayCluster
          datacenter: dc1
        persistence:
          size: 8Gi
        nodeSelector:
          hugmesh.systems/role: pki
        resources:
          requests: { cpu: 250m, memory: 768Mi }
          limits:   { cpu: "1",  memory: 1536Mi }
  destination:
    server: https://kubernetes.default.svc
    namespace: hugmesh-pki
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
