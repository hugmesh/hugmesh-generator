# Cassandra — backs every gateway's revocation list + URL registry.
# Lives on the pki control-plane node. NOTE: verify chart repo/version for
# your environment (Bitnami images now require their legacy registry).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cassandra
  namespace: devops
spec:
  project: default
  source:
    repoURL: https://charts.bitnami.com/bitnami
    chart: cassandra
    targetRevision: 12.x.x
    helm:
      releaseName: cassandra
      values: |
        replicaCount: 1
        cluster:
          name: SnapdragonGatewayCluster
          datacenter: dc1
        persistence:
          size: 8Gi
        nodeSelector:
          snapdragon.systems/role: pki
        resources:
          requests: { cpu: 250m, memory: 768Mi }
          limits:   { cpu: "1",  memory: 1536Mi }
  destination:
    server: https://kubernetes.default.svc
    namespace: snapdragon-pki
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
