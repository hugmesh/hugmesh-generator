# Cassandra — backs every gateway's revocation list + URL registry.
# Lives on the pki control-plane node. Chart pinned to bitnami/cassandra 12.3.11
# (Cassandra 5.0.5); the image is pulled from the bitnamilegacy registry because
# Bitnami moved the free images there (the charts now default to subscription
# images). Bump the pin deliberately, not on every sync.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cassandra
  namespace: devops
spec:
  project: default
  source:
    repoURL: https://charts.bitnami.com/bitnami
    chart: cassandra
    targetRevision: 12.3.11
    helm:
      releaseName: cassandra
      values: |
        # Bitnami's free images live under the bitnamilegacy registry now; the
        # chart otherwise points at subscription images that won't pull. Use the
        # legacy image matching this pinned chart (Cassandra 5.0.5).
        global:
          security:
            allowInsecureImages: true
        image:
          registry: docker.io
          repository: bitnamilegacy/cassandra
          # The tag chart 12.3.11 defaults to, written out so the image-pin gate can
          # judge the ref this override pulls (a repository with no tag inherits a
          # default the gate cannot see). Same render as before; bump with the chart.
          tag: "5.0.5-debian-12-r7"
        replicaCount: 1
        # ── SUPERUSER: ESO-sourced, never chart-generated ────────────────────
        # Leaving dbUser.password empty makes the chart MINT a random password
        # into its own Secret. Under ArgoCD that is not stable: the chart renders
        # with `helm template` (no cluster lookup), so the generated value differs
        # on every re-render while the password Cassandra actually stored is the
        # first one — the cluster would lock itself out of its own datastore.
        # Point it at the ESO Secret instead (external-secrets/cassandra-
        # externalsecrets.yaml, Vault secret/<brand>/cassandra-admin). The chart
        # reads the password from that Secret's `cassandra-password` key, which
        # the ExternalSecret aliases from the same `password` the bootstrap Job
        # reads — one superuser credential, two consumers, no drift.
        #
        # AUTHENTICATION IS NOT OPTIONAL HERE AND NEVER WAS. The bitnami image
        # defaults CASSANDRA_AUTHENTICATOR=PasswordAuthenticator and
        # CASSANDRA_AUTHORIZER=CassandraAuthorizer, so this cluster has always
        # demanded credentials — the clients simply never sent any, and every
        # gateway CrashLoopBackOff'd (docs/KIND-SSO-E2E-FINDINGS.md #5). The
        # nearby manifests/cassandra-hardening overlay still describes the server
        # as "no authenticator"; that premise was wrong and is corrected there.
        # Applications authenticate as the per-app least-privilege roles created
        # by apps/00b-cassandra-init.yaml — NEVER as this superuser.
        dbUser:
          user: cassandra
          existingSecret: cassandra-admin
        cluster:
          name: HugMeshGatewayCluster
          # endpointSnitch is the chart default SimpleSnitch, pinned here because
          # it is load-bearing for every client: SimpleSnitch does NOT read
          # cassandra-rackdc.properties and always advertises datacenter1/rack1,
          # which makes `datacenter` below cosmetic. It used to read `dc1`, so the
          # payload named the datacenter two different ways and any client that
          # believed the manifest (federation-api did) got NoNodeAvailableException.
          # Both now say datacenter1. Switching to GossipingPropertyFileSnitch is
          # what would make `datacenter` real — and it must be done together with
          # every consumer's local-dc, not on its own.
          endpointSnitch: SimpleSnitch
          datacenter: datacenter1
        # SELinux MCS identity (SECURITY.md §3): pin Cassandra to the free
        # category s0:c63 so its category-isolated data volume cannot be read
        # by another workload. The bitnami cassandra 12.3.11 chart renders
        # arbitrary seLinuxOptions under BOTH podSecurityContext (pod-level —
        # governs the volume relabel context) and containerSecurityContext
        # (container-level — the audit precedent in this repo sets it at BOTH
        # levels). We set only seLinuxOptions.level and leave every other
        # securityContext default the chart ships untouched, so this is a clean,
        # supported values override (no fork, no template patch).
        podSecurityContext:
          enabled: true
          seLinuxOptions:
            level: "s0:c63"
        containerSecurityContext:
          enabled: true
          seLinuxOptions:
            level: "s0:c63"
        persistence:
          size: 8Gi
        nodeSelector:
          hugmesh.net/role: pki
        resources:
          requests: { cpu: 250m, memory: 768Mi }
          limits:   { cpu: "1",  memory: 1536Mi }
  destination:
    server: https://kubernetes.default.svc
    namespace: hugmesh-pki
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
