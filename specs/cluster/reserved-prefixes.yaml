# =============================================================================
# CANONICAL RESERVED PREFIX / USERNAME LIST — single auditable source of truth.
# =============================================================================
# These labels are RESERVED: a vanity username / profile handle
# (<label>.snapdragon.systems, snapdragon.systems/<label>, and the equivalent
# *.snapdragon.games surfaces) may NEVER be one of these, because each label is
# (or may become) a DEDICATED app path-prefix or subdomain route on the
# fe/be/pki gateways. If a user could register one of these handles their vanity
# host/path would SHADOW (or be shadowed by) a real platform route — a
# vanity-collision. So this list is the union of:
#
#   * every dedicated fe/be/pki gateway route PREFIX (path first-segment),
#   * every reserved service SUBDOMAIN (first DNS label),
#   * the snapdragon.games app prefixes, and
#   * defensive standard web names (well-known/favicon/robots/health/…).
#
# THE RULE (enforced here + in the app repos):
#   Every dedicated gateway route prefix MUST appear in `reserved`. A newly
#   added route prefix that is NOT in this list is DRIFT and the route-consistency
#   check (scripts/validate-reserved-prefixes.sh) FAILS the build/sync.
#
# WHO ELSE HOLDS A COPY (keep in sync — see docs/RESERVED-PREFIXES.md):
#   federation-api   ReservedNames  (vanity-resolve  VanityController)
#   user-bff-api     ReservedNames  (profile DB / registration)
#   snapdragon-actions             (registration guard)
#   admin-bff-api    ReservedNames  (admin route management)
#   THIS repo (GitOps)             reserved-prefixes.yaml  <-- canonical source
#
# HOW IT IS ENFORCED IN THE CLUSTER:
#   * reserved-prefixes-configmap.yaml mirrors the `reserved` list below into a
#     ConfigMap (snapdragon-policy/reserved-prefixes) — the in-cluster auditable
#     copy the Kyverno policy reads at admission time.
#   * manifests/policy/reserved-prefixes-policy.yaml (Kyverno ClusterPolicy)
#     validates Ingress / Gateway-API HTTPRoute hosts (and, defensively, any
#     user/profile/vanity CRD handle) against that ConfigMap so a reserved label
#     cannot be used where it would create a vanity-shadowing collision.
#   * scripts/validate-reserved-prefixes.sh asserts `reserved` ⊇ every deployed
#     gateway route prefix (drift check), wired into .gitlab-ci.yml.
#
# IMPORTANT: this file is the SOURCE. If you edit the list, ALSO update the
# ConfigMap is unnecessary — the ConfigMap is generated to match; just re-run
# scripts/sync-reserved-configmap.sh (or edit both). The validate script asserts
# the ConfigMap and this file agree.
# -----------------------------------------------------------------------------
apiVersion: v1
kind: ReservedPrefixSpec          # informational kind (not a CRD) — a plain data doc
metadata:
  name: snapdragon-reserved-prefixes
  # Bump when the list changes so app-repo copies can detect a newer source.
  # revision 1 -> 2: added the publicly-routable homeserver surface prefixes
  # (`media`, `_synapse`) that the route-access seed already deploys, plus the
  # PLANNED `forum`/`phpbb` reserves (see the planned subsection below). The four
  # app-repo ReservedNames copies must add the same labels to stay in sync (the
  # validate script's code-copy assertion flags them when the sibling repos are
  # present in CI).
  # revision 2 -> 3: reconcile the canonical YAML with the four app-repo
  # ReservedNames copies (drift). Added the DEPLOYED publicly-routable prefixes the
  # YAML was missing — `tube` (the `/tube/content/**` be-gateway media route,
  # ROLE_TUBE) and `games-instances-console` (the per-instance game-server console
  # dispatcher Service the `/games/servers/**` route targets) — plus the optional
  # video/wiki services `owncast` + `wiki` as FORWARD-RESERVES (sibling of
  # forum/phpbb): real services whose only public surfaces today ride already-
  # reserved prefixes (`/bff/owncast/**`, `/bff/wiki/**`, `/social/wiki/**`), so a
  # vanity `owncast.`/`wiki.` handle is forbidden before any future subdomain ships.
  revision: "3"
spec:
  # The canonical reserved set (70 labels). KEEP SORTED BY CATEGORY (comments) but
  # the validator treats it as an unordered SET. Do not duplicate; the validator
  # also asserts there are no duplicates.
  #
  # SCOPE — what belongs here (and what does NOT):
  #   This is the union of PUBLICLY-ROUTABLE first-segment route prefixes and
  #   reserved service SUBDOMAINS — the labels a vanity username could SHADOW on a
  #   real gateway route. It is NOT a list of every Kubernetes Service. Internal,
  #   non-publicly-routable Services (akkoma-proxy / tuwunel-proxy mTLS sidecars,
  #   *-db / *-pg datastores, kafka / cassandra / clickhouse, lan-dns,
  #   the per-pod helpers) are reached ONLY in-cluster behind an already-reserved
  #   public host (mastodon./matrix./api.) or are isolated by namespace — they are
  #   NEVER a public first-label, so reserving them would only bloat the username
  #   namespace. The validate script enforces this scope: it requires a label here
  #   for every PUBLICLY-ROUTABLE route prefix (gateway route path/host first-seg +
  #   route-access url_pattern first-seg + reserved gateway hosts), and treats the
  #   internal Services as exempt via an allowlist — see
  #   scripts/validate-reserved-prefixes.sh.
  reserved:
    # --- platform / role gateway route prefixes (fe/be/pki) ---
    - admin
    # `superadmin`: the TAILNET superadmin App-Store console remote is served at
    # /superadmin/appstore/** on the superadmin-gateway (gateway_route_access seed,
    # apps/22-gateway-superadmin.yaml) — a DEDICATED first-segment route prefix, so a
    # vanity username equal to it would shadow a live route. The app-repo ReservedNames
    # copies SHOULD add `superadmin` too to stay in sync.
    - superadmin
    - apidocs
    - api-docs
    - be
    - bff
    - _fragments
    - fragments
    - login
    - logout
    - mod
    - user
    - users
    - api
    - docs
    # --- federated social / identity surfaces ---
    - _matrix
    - matrix
    - mastodon
    # `_synapse` + `media`: PUBLICLY-ROUTABLE homeserver client surfaces deployed by
    # the route-access seed (manifests/route-access/initdb/20-schema.sql) on the
    # be-gateway — `/_synapse/**` (Matrix Synapse-compat, host-scoped on the matrix
    # host) and `/media/**` (Mastodon media). They are real first-segment route
    # prefixes, so a vanity username equal to either would shadow a live route. The
    # route-consistency check surfaces them; reserved here for parity. The app-repo
    # ReservedNames copies MUST add `_synapse` + `media` too.
    - _synapse
    - media
    # `pleroma`: akkoma's AdminFE is served at /pleroma/admin/** on the be-gateway
    # (gateway_route_access seed), a DEDICATED first-segment route prefix — so it
    # must be reserved too. Added by the route-consistency check (it is the ONE
    # deployed prefix beyond the original 60-label union). The app-repo
    # ReservedNames copies (federation-api/user-bff-api/snapdragon-actions/
    # admin-bff-api) MUST add `pleroma` as well to stay in sync.
    - pleroma
    - oauth
    - oauth2
    - id
    - auth
    - social
    - gm
    # --- VPN / mesh / identity subdomains ---
    - scale
    - headscale
    # --- reserved service subdomains + defensive web names ---
    - www
    - root
    - static
    - assets
    - public
    - health
    - healthz
    - actuator
    - metrics
    - well-known
    - favicon
    - robots
    - sitemap
    - status
    - support
    - help
    # --- infra / ops names (never a user) ---
    - pki
    - vault
    - argocd
    - gitlab
    - registry
    # --- snapdragon.games app prefixes ---
    - games
    - play
    - wasm
    - producer
    - publisher
    - banned
    - _remotes
    - producer-registration
    - registration
    - wasm-fragment
    - games-dodecahedron
    - games-rpg-maker
    - games-three-wizards
    - games-vn-maker
    # --- optional-service / games-console DEPLOYED route prefixes --------------
    # `tube`: the LocalTube media route `/tube/content/**` is a DEDICATED first-
    # segment route on the be-gateway (gateway_route_access seed, ROLE_TUBE signed-
    # URL content serving) — a real publicly-routable prefix, so a vanity `tube`
    # handle would shadow it. The route-consistency check (stage 3) demands it.
    # `games-instances-console`: the per-instance game-server console dispatcher
    # Service the `/games/servers/**` route uri TARGETS
    # (apps/20-gateway-be.yaml route[games-servers-console]). Its public path first-
    # segment is `games` (already reserved), but the scoped Service-drift check
    # (stage 4) requires the routed Service's first-label be reserved or allowlisted;
    # reserving the label here keeps it the source of truth (the app-repo copies
    # already carry it). Both were added to the four ReservedNames copies in the
    # prior tube/games-instances-console fix; this brings the canonical YAML to match.
    - tube
    - games-instances-console
    # --- planned / not-yet-deployed publicly-routable services -----------------
    # These have NO kind:Service / gateway route in the GitOps tree YET, so the
    # route-consistency drift check will NOT demand them — they are reserved here
    # PROACTIVELY so a user cannot squat the handle before the service ships. The
    # phpBB community forum is referenced as a planned/announced surface in
    # snapdragon.systems/src/app/announcements/announcement.model.ts. When the
    # forum lands (a `forum.snapdragon.systems` subdomain + a be/fe gateway route),
    # move these up into the routable categories above; until then they are a
    # forward-reserve, NOT drift. The app-repo ReservedNames copies should add them
    # too so the handle is forbidden at registration before the route exists.
    #
    # `owncast` (Owncast live-streaming) and `wiki` (the Kiwix/Postgres wiki) are
    # the same shape: REAL optional services (deployed manifests / dedicated repos)
    # whose ONLY public surfaces today ride an already-reserved prefix —
    # `/bff/owncast/**`, `/bff/wiki/**` (first-segment `bff`) and `/social/wiki/**`
    # (first-segment `social`). Neither has its OWN top-level `/owncast/**`,
    # `/wiki/**` route or `owncast.`/`wiki.` subdomain in the GitOps tree yet, so
    # the route-consistency check does not demand them; they are forward-reserved so
    # a vanity `owncast.`/`wiki.` handle can never collide if/when one ships. The
    # federation-api / user-bff-api ReservedNames copies already carried both.
    - forum
    - phpbb
    - owncast
    - wiki
