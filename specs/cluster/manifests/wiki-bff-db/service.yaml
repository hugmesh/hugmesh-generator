# ClusterIP — reached only in-cluster by snapdragon-wiki-bff-api (R2DBC runtime +
# the JDBC handle Liquibase uses at startup). DNS:
#   wiki-bff-db.snapdragon-backend.svc.cluster.local:5432
apiVersion: v1
kind: Service
metadata:
  name: wiki-bff-db
  namespace: snapdragon-backend
  labels: { app: wiki-bff-db }
spec:
  type: ClusterIP
  selector: { app: wiki-bff-db }
  ports:
    - { name: postgres, port: 5432, targetPort: postgres }
