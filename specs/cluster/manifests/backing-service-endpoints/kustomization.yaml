# backing-service-endpoints — the managed-backing-service ENDPOINT INDIRECTION
# bundle, applied by apps/17-backing-service-endpoints.yaml.
#
# Operator DECISION 34a (2026-09-17): ONE ConfigMap PER NAMESPACE, same name and key
# scheme in each — NOT the single hugmesh-backend object that was recommended and
# declined. The axis is SIX namespaces and all six ship. The three listed below are
# the ones that EXIST on every mesh, so they ship from HERE. The other three
# (hugmesh-owncast, hugmesh-tube, hugmesh-forum) are created by their own
# OPTIONAL-service Applications (manifests/<svc>/namespace.yaml, 13a
# `installed:"false"` by default), so a ConfigMap for them applied from HERE would
# leave this Application permanently unable to sync on a default mesh — a red nobody
# can explain. Their identical object + grant therefore ship from their own service's
# directory instead, and appear exactly when their namespace does:
#     specs/cluster/manifests/owncast/backing-service-endpoints.yaml
#     specs/cluster/manifests/tube/backing-service-endpoints.yaml
#     specs/cluster/manifests/forum/backing-service-endpoints.yaml
# DO NOT move them here and DO NOT delete them. All six placements are pinned by
# tests/scripts/test-backing-service-endpoints-closure.sh, which fails on the
# deletion of any one of them and on any of them going unreferenced by its own
# kustomization.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # The only namespace with keys today: the five v1 tier-2 BFF Postgres ids, seeded
  # byte-identically with the literals already in the consumer Deployments.
  - endpoints-hugmesh-backend.yaml
  # Object + grant present, `data` deliberately empty — each file's header records
  # exactly which address it would carry and what is missing.
  - endpoints-hugmesh-pki.yaml
  - endpoints-hugmesh-games.yaml
  # One Role + RoleBinding per namespace, resourceNames-closed.
  - rbac.yaml
