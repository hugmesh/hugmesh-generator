# ════════════════════════════════════════════════════════════════════════════════
# egress-VPN secret-projector RBAC — least privilege, namespaced Role, NEVER a
# ClusterRole (mirrors manifests/velero/rbac.yaml + manifests/workload-console-rbac).
#
# ONE identity: `egress-vpn-secret-projector`, the SA the projector DaemonSet runs
# as. Its ENTIRE authority is `get`+`list` on core Secrets in the
# `hugmesh-egress-vpn` namespace — the namespace that holds ONLY the egress-VPN
# config Secrets (see namespace.yaml for why that namespace exists). No pods, no
# exec, no other namespace, no cluster scope, no write verb anywhere.
#
# WHY NO `resourceNames`: the config Secret names are DYNAMIC — the admin-bff /
# ESO half materialises one per (domain, config) as `egress-vpn-<domain>-<name>`,
# and the node's signed export names it by `secretRef`. RBAC `resourceNames` has
# no prefix or wildcard match, so pinning names would silently break every brand
# but one (the identical reasoning velero/rbac.yaml records for the per-brand
# installed-services ConfigMap). The NAMESPACE is the boundary instead.
#
# WHY `list` AND `get`: the projector lists the labelled Secrets to learn which
# configs exist on this cluster (there is no other node-visible enumeration), then
# reads each one's bytes. `watch` is deliberately NOT granted — the projector
# polls on the same 60s convergence floor as hugmesh-vpn-reconcile, so a watch
# would buy nothing and widen the grant.
#
# SHIPS DARK: nothing here is applied until an operator un-comments the resources
# in kustomization.yaml AND manually syncs apps/13e-egress-vpn.yaml. Until then
# this SA does not exist and grants nothing.
# ════════════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: ServiceAccount
metadata:
  name: egress-vpn-secret-projector
  namespace: hugmesh-egress-vpn
  labels:
    app.kubernetes.io/name: egress-vpn
    app.kubernetes.io/component: secret-projector
    app.kubernetes.io/part-of: hugmesh.net
# The DaemonSet pod spec opts the token in explicitly; nothing else may mount it.
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: egress-vpn-secret-projector
  namespace: hugmesh-egress-vpn
  labels:
    app.kubernetes.io/name: egress-vpn
    app.kubernetes.io/component: secret-projector
    app.kubernetes.io/part-of: hugmesh.net
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: egress-vpn-secret-projector
  namespace: hugmesh-egress-vpn
  labels:
    app.kubernetes.io/name: egress-vpn
    app.kubernetes.io/component: secret-projector
    app.kubernetes.io/part-of: hugmesh.net
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: egress-vpn-secret-projector
subjects:
  - kind: ServiceAccount
    name: egress-vpn-secret-projector
    namespace: hugmesh-egress-vpn
