# ════════════════════════════════════════════════════════════════════════════════
# egress-VPN secret-projector — the RUNTIME config-byte delivery leg.
#
# THE GAP IT CLOSES: hugmesh-vpn-reconcile materialises each assigned config from
# `${VPN_SECRET_DIR}/<secretRef>` — a file on the NODE HOST, default
# /etc/hugmesh/vpn-secret (hugmesh-vpn-reconcile:52, `SECRET_DIR=`). The signed
# per-node export carries only `secretRef` + metadata; the BYTES ride a K8s Secret
# that ESO materialises. Nothing put those bytes on the host, so the runtime
# (UI/BFF) delivery path fell back to the key-USB config every time. This
# DaemonSet is that missing hop: cluster Secret -> node hostPath, and NOTHING
# else.
#
# ── THE CONTRACT (cross-repo) ─────────────────────────────────────────────────
# NOT declared here. The three values below are COPIES of
# specs/cluster/egress-vpn-secret-contract.env, which is the single source of
# truth shared with the admin-bff writer half, and
# tests/egress-vpn/test-secret-contract.sh asserts this manifest against it (and
# against the admin-bff source itself). Editing a value here without editing the
# contract file fails that gate.
#
#   * NAMESPACE: `hugmesh-egress-vpn` — this Secret namespace is the RBAC
#     boundary (see namespace.yaml). admin-bff is pointed at it by the
#     EGRESS_VPN_SECRET_NAMESPACE env on manifests/admin-bff-api/deployment.yaml.
#   * LABEL: `snapdragon.systems/optional-service: egress-vpn` — the SAME label
#     the interaction NetworkPolicy already carries. Selection is by LABEL, never
#     by a baked-in name, so the per-(domain,config) names the control plane mints
#     (`egress-vpn-<domain>-<name>`) need no generator-side change.
#   * DATA KEY: the Secret's OWN metadata.name — `SECRET_KEY: "@name"` is the
#     sentinel for that (`@` is not a legal Secret data-key character, so it can
#     never be mistaken for a literal key). admin-bff writes
#     `.addToStringData(secretRef, configBody)`, i.e. key == name == secretRef.
#     This manifest previously said `config`, which no Secret admin-bff writes
#     has ever carried — the projector read zero bytes on every pass.
#     Which of `.conf`/`.ovpn` the bytes are comes from the export's `kind`, not
#     from the Secret (hugmesh-vpn-reconcile picks the extension), so ONE key is
#     enough.
#   * FILE NAME: the projected file is named EXACTLY the Secret's metadata.name,
#     because the reconcile agent opens `${SECRET_DIR}/<secretRef>`. secretRef in
#     the signed export MUST therefore equal the Secret name.
#
# ── DARK BY DEFAULT (two independent gates) ────────────────────────────────────
#   1. Not in kustomization.yaml's `resources:` (which is `[]`) and reachable only
#      through the MANUAL-sync apps/13e-egress-vpn.yaml — the
#      apps/08a-networkpolicy-egress.yaml pattern. Nothing renders until an
#      operator un-comments AND syncs.
#   2. Even then, `nodeSelector: snapdragon.systems/egress-vpn: "true"` — a label
#      no node carries out of the box (the same shape as the GPU plugin's
#      snapdragon.systems/compute=gpu and local-path's snapdragon.systems/
#      local-path=true). So an accidental sync schedules ZERO pods; the operator
#      labels the nodes that actually hold an assignment.
#
# ── FAIL-CLOSED ────────────────────────────────────────────────────────────────
# A failed list/read NEVER prunes: the last-good projected files stay and the
# node keeps its working tunnel (the same keep-last-good posture the reconcile
# agent takes on a transient BFF failure). Pruning only ever runs after a
# SUCCESSFUL list, so an API-server outage cannot tear a node's egress down. A
# Secret whose contract data key is empty or absent is skipped with a warning
# rather than truncating a good file.
#
# ⚠ SELinux (nodes boot ENFORCING — docs/SECURITY.md §3): writing under /etc on
# an enforcing node needs the super-privileged container type, so the pod requests
# `spc_t` exactly like manifests/nvidia-device-plugin/daemonset.yaml. The target
# dir is labelled `hugmesh_vpn_etc_t` by specs/selinux/hugmesh_vpn.fc so the
# in-domain reader (hugmesh_vpn_reconcile_t) keeps its existing read pattern —
# no new host domain is introduced by this leg. Verify with getenforce + an AVC
# scan on the first live bring-up.
# ════════════════════════════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: egress-vpn-secret-projector
  namespace: hugmesh-egress-vpn
  labels:
    app.kubernetes.io/name: egress-vpn
    app.kubernetes.io/component: secret-projector
    app.kubernetes.io/part-of: hugmesh.systems
    snapdragon.systems/optional-service: egress-vpn
spec:
  selector:
    matchLabels: { app.kubernetes.io/name: egress-vpn, app.kubernetes.io/component: secret-projector }
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: egress-vpn
        app.kubernetes.io/component: secret-projector
        app.kubernetes.io/part-of: hugmesh.systems
    spec:
      # GATE 2: schedules NOWHERE until an operator labels the assigned nodes.
      nodeSelector:
        snapdragon.systems/egress-vpn: "true"
      serviceAccountName: egress-vpn-secret-projector
      automountServiceAccountToken: true
      priorityClassName: system-node-critical
      securityContext:
        # root: the projected files are root-owned 0600 under /etc (the same
        # ownership+mode hugmesh-vpn-reconcile and provision_vpn() enforce for
        # every VPN config byte). Non-root cannot write there, and loosening
        # /etc/hugmesh/vpn-secret to a non-root writer would be strictly worse.
        runAsUser: 0
        runAsGroup: 0
        seccompProfile: { type: RuntimeDefault }
        seLinuxOptions:
          type: spc_t
      containers:
        - name: projector
          # kubectl + a real shell. registry.k8s.io/kubectl is shell-LESS
          # (distroless), so this loop uses the same bitnami image the
          # prod-hygiene gate and the test-runner orchestrator already run.
          image: docker.io/bitnamilegacy/kubectl:1.31
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          env:
            # ── CONTRACT COPIES — keep in lockstep with
            #    specs/cluster/egress-vpn-secret-contract.env. These three lines
            #    are parsed literally by tests/egress-vpn/test-secret-contract.sh
            #    and test-vpn-secret-projector.sh, so keep the one-line
            #    `- { name: X, value: "Y" }` form.
            - { name: SECRET_NS,   value: "hugmesh-egress-vpn" }
            - { name: SECRET_SEL,  value: "snapdragon.systems/optional-service=egress-vpn" }
            # `@name` == "the data key is the Secret's own metadata.name". NOT a
            # literal key: `@` is not a legal Secret data-key character.
            - { name: SECRET_KEY,  value: "@name" }
            - { name: DEST,        value: "/host/vpn-secret" }
            # Matches hugmesh-vpn-reconcile's 60s convergence floor.
            - { name: INTERVAL,    value: "60" }
            - { name: TMPDIR,      value: "/tmp" }
          command: ["/bin/bash", "-c"]
          args:
            - |
              # Project the labelled egress-VPN config Secrets onto this node's
              # ${DEST} as 0600 root-owned files named after the Secret (==
              # secretRef). One pass per ${INTERVAL}s; every failure keeps
              # last-good.
              set -uo pipefail

              log()  { echo "[vpn-secret-projector $(date -u '+%Y-%m-%dT%H:%M:%SZ')] $*"; }
              warn() { log "WARNING: $*"; }

              project_once() {
                  local names
                  names="$(kubectl -n "${SECRET_NS}" get secrets -l "${SECRET_SEL}" \
                             -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' 2>&1)" || {
                      warn "list failed (${names}) — keeping the projected files as-is (fail-closed)"
                      return 1
                  }
                  # The dir is the node's VPN secret store: root-only, like
                  # /etc/hugmesh/vpn (0700) that provision_vpn() creates.
                  chmod 0700 "${DEST}" 2>/dev/null || true

                  local n tmp key kept=""
                  for n in ${names}; do
                      [ -n "${n}" ] || continue
                      # THE DATA KEY. `@name` is the contract sentinel for "the
                      # key is the Secret's own metadata.name" — which is what
                      # admin-bff's .addToStringData(secretRef, configBody)
                      # produces. Any other value is used as a literal key.
                      key="${SECRET_KEY}"
                      [ "${key}" = "@name" ] && key="${n}"
                      tmp="$(mktemp)" || { warn "mktemp failed — skipping ${n}"; continue; }
                      # go-template base64decode: no coreutils base64 needed, and
                      # the bytes go straight to a file (never through a shell
                      # variable, which would eat trailing newlines / NULs).
                      if ! kubectl -n "${SECRET_NS}" get secret "${n}" \
                             -o go-template="{{if index .data \"${key}\"}}{{index .data \"${key}\" | base64decode}}{{end}}" \
                             > "${tmp}" 2>/dev/null; then
                          warn "read of secret ${n} failed — keeping any last-good ${DEST}/${n}"
                          rm -f "${tmp}"; kept="${kept} ${n}"; continue
                      fi
                      if [ ! -s "${tmp}" ]; then
                          # FAIL-CLOSED and LOUD: this is exactly the shape the
                          # cross-repo key mismatch took (every Secret present,
                          # every read empty), so name the key we looked for.
                          warn "secret ${n} has no '${key}' bytes — NOT truncating ${DEST}/${n}"
                          rm -f "${tmp}"; kept="${kept} ${n}"; continue
                      fi
                      # install(1) creates WITH the mode, so a reader never sees a
                      # 0644 or half-written file. Ownership is root:root because
                      # the pod runs runAsUser/runAsGroup 0 — not re-asserted with
                      # -o/-g here, which would only turn a mis-specced pod into a
                      # confusing chown error instead of an obvious one.
                      if install -m 0600 "${tmp}" "${DEST}/${n}"; then
                          kept="${kept} ${n}"
                      else
                          warn "could not write ${DEST}/${n} — keeping last-good"
                          kept="${kept} ${n}"
                      fi
                      rm -f "${tmp}"
                  done

                  # PRUNE — only reached after a SUCCESSFUL list, so an API-server
                  # outage can never strip a node of its config bytes. A config
                  # the operator un-assigned/deleted stops being materialised here;
                  # the reconcile agent then falls back to the key-USB config or
                  # tears the tunnel down on an empty export.
                  local f b
                  for f in "${DEST}"/*; do
                      [ -e "${f}" ] || continue
                      b="${f##*/}"
                      case " ${kept} " in
                          *" ${b} "*) ;;
                          *) rm -f "${f}" && log "pruned ${b} (no longer a labelled Secret)" ;;
                      esac
                  done
                  log "projected:${kept:- none}"
                  return 0
              }

              log "start: ns=${SECRET_NS} selector=${SECRET_SEL} key=${SECRET_KEY} dest=${DEST} interval=${INTERVAL}s"
              while true; do
                  project_once || true
                  sleep "${INTERVAL}"
              done
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits:   { cpu: 100m, memory: 128Mi }
          volumeMounts:
            - { name: vpn-secret, mountPath: /host/vpn-secret }
            - { name: tmp,        mountPath: /tmp }
      volumes:
        # The reconcile agent's VPN_SECRET_DIR on the host. DirectoryOrCreate so a
        # freshly-labelled node needs no pre-seeding; the loop chmods it 0700.
        - name: vpn-secret
          hostPath: { path: /etc/hugmesh/vpn-secret, type: DirectoryOrCreate }
        # tmpfs, not node disk: the decoded private-key bytes are staged here for
        # the length of one install(1) and never touch persistent storage twice.
        - name: tmp
          emptyDir: { medium: Memory, sizeLimit: 8Mi }
