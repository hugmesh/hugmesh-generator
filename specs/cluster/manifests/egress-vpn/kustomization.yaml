apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# ─────────────────────────── GATED / SHIPS DARK ───────────────────────────────
# The egress-VPN runtime config-byte DELIVERY overlay: the secret-projector
# DaemonSet that syncs the labelled config Secrets onto each assigned node's
# /etc/hugmesh/vpn-secret (hugmesh-vpn-reconcile's VPN_SECRET_DIR). It lives in
# its OWN kustomization + its OWN MANUAL-sync ArgoCD app
# (apps/13e-egress-vpn.yaml) so it NEVER auto-applies — the
# apps/08a-networkpolicy-egress.yaml pattern.
#
# resources: is INTENTIONALLY EMPTY by default. With nothing listed this overlay
# renders to ZERO objects — `kubectl apply -k` is a no-op and the 13e app stays
# permanently Synced/empty. That is the inert-until-enabled state, and it is why
# the DaemonSet's node-privileged hostPath write exists in the tree without
# existing on any cluster.
#
# WHY DARK rather than auto-sync (unlike the interaction NetworkPolicy, which IS
# in the auto-sync networkpolicy app): this leg WRITES VPN private-key bytes onto
# node filesystems. It must not appear on a cluster as a side effect of selecting
# the optional service — an operator turns it on deliberately, after the
# admin-bff/ESO half is materialising the Secrets and the target nodes are
# labelled.
#
# TO ENABLE (deliberate, operator-driven):
#   1. Confirm the control-plane half is live: a Secret in `hugmesh-egress-vpn`
#      labelled snapdragon.systems/optional-service=egress-vpn, with the config
#      bytes under the `config` key, NAMED exactly the `secretRef` the signed
#      per-node export carries (see secret-projector-daemonset.yaml, THE CONTRACT).
#   2. Un-comment the three resource lines below.
#   3. Manually sync apps/13e-egress-vpn.yaml (it has NO `automated:` block).
#   4. Label ONLY the nodes that hold an assignment:
#        kubectl label node <node> snapdragon.systems/egress-vpn=true
#      (until a node carries it the DaemonSet schedules nothing there).
#   5. Verify on that node: /etc/hugmesh/vpn-secret/<secretRef> exists, is 0600
#      root-owned, and the next `hugmesh-vpn-reconcile` pass logs
#      "wrote /etc/hugmesh/vpn/<name>.conf from Secret <secretRef> (0600)".
#
# ROLLBACK: re-comment + manual sync (or `kubectl delete ns hugmesh-egress-vpn`).
# The nodes keep whatever key-USB-provisioned config they had — removing this
# overlay is a delivery rollback, not an egress outage.
resources: []
  # - namespace.yaml                    # hugmesh-egress-vpn — the Secret namespace that IS the RBAC boundary
  # - secret-projector-rbac.yaml        # SA + namespaced Role (secrets get/list) + RoleBinding — no ClusterRole
  # - secret-projector-daemonset.yaml   # the projector itself — nodeSelector snapdragon.systems/egress-vpn=true
