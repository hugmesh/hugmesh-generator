# attestation-server ServiceAccount — per-app identity for the GrapheneOS
# AttestationServer. The Deployment names it (attestation-server.yaml
# `serviceAccountName: sa-attestation-server`), but no manifest created it — so
# the pod would never schedule (the SA must exist before a pod referencing it is
# admitted). Same per-application identity pattern as
# manifests/meshbridge/service-account.yaml: the workload runs as its own SA
# carrying its own MCS category (s0:c79 — see the Deployment's seLinuxOptions and
# docs/SECURITY.md §3), so a compromise cannot borrow another workload's RBAC or
# read its category-isolated volumes. AttestationServer needs no Kubernetes API
# (it talks HTTP to devices/the Auditor app and reads/writes its own SQLite DB),
# so no Role/RoleBinding is attached and automountServiceAccountToken is disabled
# defence-in-depth.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sa-attestation-server
  namespace: hugmesh-pki
  labels:
    app.kubernetes.io/name: attestation-server
    app.kubernetes.io/part-of: hugmesh.systems
automountServiceAccountToken: false
