apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: snapdragon-pki
resources:
  - attestation-server.yaml

# Custom build-from-source image pulls from the in-cluster Harbor registry,
# mirroring manifests/headwind/kustomization.yaml exactly (mutable :main tag;
# snapdragon-pki is not in the Kyverno digest-pin enforced-namespace list).
images:
  - name: snapdragon-systems/attestation-server
    newName: registry.snapdragon.systems/snapdragon/snapdragon-attestation-server
    newTag: main
patches:
  - target: { kind: Deployment, name: attestation-server }
    patch: |
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: harbor-registry
