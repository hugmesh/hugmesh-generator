apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: snapdragon-pki
resources:
  - attestation-server.yaml

# Custom build-from-source image pulls from the in-cluster Harbor registry
# (mutable :main tag; snapdragon-pki is not in the Kyverno digest-pin
# enforced-namespace list). NOTE: unlike forum/kustomization.yaml's phpbb.yaml
# base (which uses a short placeholder image for kustomize's images: transform
# to rewrite), attestation-server.yaml's Deployment already hardcodes the FULL
# final image ref directly — an `images:` stanza here would match no
# container (kustomize's images transformer only rewrites resources whose
# image `name:` field matches exactly) and silently no-op on any future
# `newTag:` edit, so it is intentionally omitted (mirrors
# manifests/headwind/kustomization.yaml's identical fix). Bump the tag by
# editing attestation-server.yaml's `image:` field directly.
patches:
  - target: { kind: Deployment, name: attestation-server }
    patch: |
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: harbor-registry
