# hugmesh-wiki-ui — the Angular wiki micro-frontend remote that serves the
# platform wiki (wiki pages, attachments, audit log, access control). Its own nginx
# (own repo + pod) in the hugmesh-frontend namespace, federated into the
# hugmesh.systems host: it serves a remoteEntry.json the host's loadRemoteModule
# consumes. Talks to wiki-bff-api via the same-origin /bff/wiki/** fe-gateway route.
# Repo: github.com/hugmesh-net/hugmesh-wiki-ui
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: hugmesh-wiki-ui, namespace: hugmesh-frontend, labels: { app: hugmesh-wiki-ui, app.kubernetes.io/part-of: hugmesh.systems } }
spec:
  replicas: 1
  selector: { matchLabels: { app: hugmesh-wiki-ui } }
  template:
    metadata: { labels: { app: hugmesh-wiki-ui } }
    spec:
      nodeSelector: { hugmesh.systems/frontend: "true" }
      # POD-level hardening (replicates the frontend/binhost SAFE exemplar):
      # CIS K8s 5.2.6 (runAsNonRoot), 5.7.2 (seccompProfile RuntimeDefault);
      # NIST 800-53 AC-6 (least privilege) / SC-39 (process isolation);
      # NIST 800-190 §4.5.3 (run as non-root). SAFE here because the wiki-ui
      # image is built FROM nginxinc/nginx-unprivileged:1.27-alpine and serves
      # on the unprivileged port 8080 as the baked-in UID 101 (verified in the
      # hugmesh-wiki-ui Dockerfile + nginx.conf), so non-root + drop-ALL is
      # not a privileged-port bind. The existing pod seLinuxOptions are kept.
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
        seLinuxOptions:
          type: container_t
          level: "s0:c71"
      containers:
        - name: web
          image: hugmesh-systems/wiki-ui:dev
          # nginx-unprivileged listens on 8080 (UID 101 cannot bind <1024); the
          # named 'http' port feeds the Service targetPort: http, so it follows.
          # (Also corrects a latent mismatch: the image EXPOSE/listen is 8080 but
          # the manifest previously declared containerPort 80 — the federation
          # registration already targets hugmesh-wiki-ui:8080.)
          ports: [{ name: http, containerPort: 8080 }]
          # CONTAINER-level hardening (audit: pod-only seLinuxOptions had NO
          # container securityContext). CIS K8s 5.2.5 (allowPrivilegeEscalation:
          # false), 5.2.7-5.2.9 (drop ALL caps), 5.2.x (readOnlyRootFilesystem).
          # UID 101 = the `nginx` user baked into the unprivileged image;
          # readOnlyRootFilesystem requires an emptyDir for every path nginx
          # writes (pid/cache/temp).
          securityContext:
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources: { requests: { cpu: 50m, memory: 96Mi }, limits: { cpu: 300m, memory: 192Mi } }
          # readOnlyRootFilesystem:true => every path nginx writes must be a
          # writable emptyDir (tmpfs): worker temp under /var/cache/nginx, the
          # pid under /var/run, request bodies / misc to /tmp.
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: nginx-cache, mountPath: /var/cache/nginx }
            - { name: nginx-run, mountPath: /var/run }
      volumes:
        - name: tmp
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata: { name: hugmesh-wiki-ui, namespace: hugmesh-frontend }
spec: { selector: { app: hugmesh-wiki-ui }, ports: [{ name: http, port: 80, targetPort: http }] }
