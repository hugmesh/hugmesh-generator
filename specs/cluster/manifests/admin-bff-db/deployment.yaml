# admin-bff-db — dedicated Postgres for snapdragon-admin-bff-api's config
# datastore (durable accounts / allowlist / sessions / namespace-grants /
# iso_artifacts / gateway_route_access — the tables its single R2DBC handle backs,
# distinct from the route-access-db handle it also holds). Lives in
# snapdragon-backend next to the BFF it serves. ClusterIP only.
#
# NOTE: the literal hostname `snapdragon-pg` that admin-bff's application.yml
# defaults to does NOT exist anywhere in the cluster; this dedicated `admin-bff-db`
# Service is the real backing store, and the admin-bff Deployment OVERRIDES the
# R2DBC/Liquibase URLs to point here (mirrors how federation-db backs federation).
#
# Schema bootstrap: NO initdb schema.sql — admin-bff owns its schema via Liquibase
# (classpath:db/changelog/db.changelog-master.xml), applied by the app at boot.
# This DB only needs to exist EMPTY (POSTGRES_DB).
#
# Credentials: the OWNER POSTGRES_PASSWORD is sourced from Vault via External
# Secrets (ESO Secret admin-bff-db-auth, key password). The OWNER role is now used
# by the admin-bff app for DDL/Liquibase ONLY. At RUNTIME the app logs in as the
# dedicated NON-OWNER least-privilege role `adminbff_app` (its OWN password, ESO
# Secret admin-bff-db-app-auth, created by initdb/10-roles.sh). See the role/grant
# matrix in docs/POSTGRES-HARDENING.md and docs/HANDOFF.md §3.3.
#
# Sharding (opt-in, default OFF): set SHARDING_CITUS=on AND switch the image to a
# Citus-enabled Postgres (citusdata/citus:12-pg16); the default path is unchanged.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-bff-db
  namespace: snapdragon-backend
  labels: { app: admin-bff-db, app.kubernetes.io/part-of: snapdragon.systems }
spec:
  replicas: 1
  strategy: { type: Recreate }   # single writer over a RWO PVC
  selector: { matchLabels: { app: admin-bff-db } }
  template:
    metadata: { labels: { app: admin-bff-db } }
    spec:
      nodeSelector: { snapdragon.systems/backend: "true" }
      securityContext:
        seLinuxOptions:
          type: container_t
          level: "s0:c26"
      containers:
        - name: postgres
          # DEFAULT (single-node): postgres:16-alpine. To shard, override to a
          # Citus-enabled image (citusdata/citus:12-pg16) AND set SHARDING_CITUS=on.
          image: postgres:16-alpine
          ports: [{ name: postgres, containerPort: 5432 }]
          env:
            - { name: POSTGRES_DB,   value: "adminbff" }
            # OWNER role (DDL/Liquibase). Same ESO Secret the admin-bff app's
            # SPRING_LIQUIBASE_PASSWORD mounts.
            - { name: POSTGRES_USER, value: "adminbff" }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: admin-bff-db-auth
                  key: password
            # Per-machine-user least-privilege role password (consumed by
            # initdb/10-roles.sh to create adminbff_app). PRODUCTION sources this
            # from its OWN ESO Secret admin-bff-db-app-auth (key password); the
            # admin-bff app's RUNTIME SPRING_R2DBC_PASSWORD mounts the SAME Secret.
            - name: ADMINBFF_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: admin-bff-db-app-auth
                  key: password
            # Opt-in Citus sharding (default off => 90-citus.sh is a no-op).
            - { name: SHARDING_CITUS, value: "off" }
            - { name: POSTGRES_INITDB_ARGS, value: "--auth-host=scram-sha-256 --auth-local=scram-sha-256" }
            - { name: PGDATA, value: "/var/lib/postgresql/data/pgdata" }
          # Server-level hardening (every boot): scram, capped connections, logged
          # connections + slow statements. Per-DB timeouts are in 00-hardening.sql.
          args:
            - -c
            - password_encryption=scram-sha-256
            - -c
            - max_connections=60
            - -c
            - log_connections=on
            - -c
            - log_disconnections=on
            - -c
            - log_min_duration_statement=2000
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "adminbff", "-d", "adminbff"] }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec: { command: ["pg_isready", "-U", "adminbff", "-d", "adminbff"] }
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: "1",  memory: 512Mi }
          volumeMounts:
            - { name: data,   mountPath: /var/lib/postgresql/data }
            - { name: initdb, mountPath: /docker-entrypoint-initdb.d, readOnly: true }
            # PR-C1 (SHIPS DARK): the Vault-PKI server cert is mounted READ-ONLY on
            # disk but UNUSED — Postgres is NOT started with `-c ssl=on` (see args:
            # above, deliberately unchanged) and no consumer URL sets sslMode. The
            # default wire path is byte-identical. PR-C2 enablement = add
            # `-c ssl=on -c ssl_cert_file=/etc/postgres-tls/tls.crt
            # -c ssl_key_file=/etc/postgres-tls/tls.key` to args + `?sslMode=require`
            # (R2DBC)/`sslmode=require` (JDBC) on consumers.
            - { name: pg-tls, mountPath: /etc/postgres-tls, readOnly: true }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: admin-bff-db }
        - name: initdb
          configMap: { name: admin-bff-db-initdb }
        # Vault-PKI server cert (kubernetes.io/tls Secret admin-bff-db-mtls, wired in
        # external-secrets/pki-externalsecrets.yaml). Mounted but unused until PR-C2.
        - name: pg-tls
          secret:
            secretName: admin-bff-db-mtls
            optional: true   # SHIPS DARK: pod still starts before ESO materializes it
            defaultMode: 0600
