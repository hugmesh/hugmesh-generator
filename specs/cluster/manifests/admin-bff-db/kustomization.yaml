apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: snapdragon-backend
resources:
  - pvc.yaml
  - deployment.yaml
  - service.yaml

# No configMapGenerator / initdb schema: admin-bff owns its tables via Liquibase
# (applied by the app at startup), so this DB only needs to exist EMPTY. Contrast
# route-access-db, which mounts a schema.sql seed because the gateways do not run
# migrations themselves.
