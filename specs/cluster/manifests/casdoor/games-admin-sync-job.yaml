# games-admin-sync — materializes the DERIVED Casdoor role ROLE_GAMES_ADMIN, whose
# membership is the INTERSECTION that the games-namespace-admin gate requires:
#
#     ROLE_GAMES_ADMIN  =  ROLE_GAMES  INTERSECT  (ROLE_ADMIN UNION ROLE_MOD)
#
# i.e. a user becomes a hugmesh-games namespace admin ONLY if they hold
# ROLE_GAMES AND (ROLE_ADMIN OR ROLE_MOD). Casdoor role nesting is UNION
# (inheritance), never intersection, so the intersection cannot be expressed by a
# nested "roles" array — it must be reconciled here. This Job reads ROLE_GAMES,
# ROLE_ADMIN, ROLE_MOD membership from Casdoor, computes the intersection, and
# writes EXACTLY that verified set into ROLE_GAMES_ADMIN's users[] (idempotent: it
# also REMOVES anyone who no longer qualifies — default-deny). ROLE_GAMES_ADMIN is
# the ONLY role on the games-admin route-access rows (/games/api/admin/** on
# be-gateway, /games/admin/** on fe-gateway — see manifests/route-access/schema.sql),
# so the gateway's OR-of-allow-rows table yields the required AND: ROLE_GAMES alone
# or ROLE_ADMIN alone never reaches the games-admin surface.
#
# Mirrors the casdoor-init / tuwunel-admin-sync / akkoma-admin-sync pattern:
# runAsNonRoot, drop ALL caps, readOnlyRootFilesystem, idempotent, ArgoCD PostSync.
# Uses the SAME Casdoor admin-session transport as casdoor-init (login -> cookie ->
# get-role/update-role) since update-role requires an admin session.
#
# SCOPE: this Job runs ENTIRELY INSIDE the systems Casdoor (org "hugmesh"). It only
# MATERIALIZES the intersection role ROLE_GAMES_ADMIN within systems; it does NOT touch
# the games realm. The games realm is a SEPARATE, INDEPENDENT Casdoor (manifests/
# casdoor-games, org "threewizards") with its OWN native users/roles (GitHub-OAuth
# players, player / uploader / mod / publisher / play-* roles) that need NOT exist in
# systems — and vice versa. The ONE thing auto-synced systems -> games is a DIFFERENT,
# scheduled hugmesh-actions job (manifests/hugmesh-apis): it mirrors EXACTLY this
# role's membership, ROLE_GAMES_ADMIN (systems) -> admin (games). So the pipeline is:
#   (1) THIS Job:  ROLE_GAMES_ADMIN = ROLE_GAMES ∩ (ROLE_ADMIN ∪ ROLE_MOD)   [systems-only]
#   (2) actions:   ROLE_GAMES_ADMIN (systems)            -> admin (games)     [cross-realm]
# Net effect: only admins/mods who hold the games role in systems become games admins.
# Granting a normal user plain ROLE_GAMES does NOT auto-create a games login; that
# on-demand provisioning is a separate admin-UI hugmesh-action (future), not this Job.
#
# !!! The Casdoor REST API shape (login + get-role/update-role) is version-specific.
# !!! This is a working scaffold — validate the endpoints/payloads against the
# !!! deployed casbin/casdoor-all-in-one before relying on it in production.
apiVersion: v1
kind: ConfigMap
metadata:
  name: games-admin-sync-script
  namespace: hugmesh-pki
  labels: { app: casdoor, app.kubernetes.io/part-of: hugmesh.net }
data:
  sync.py: |
    #!/usr/bin/env python3
    """Reconcile ROLE_GAMES_ADMIN = ROLE_GAMES intersect (ROLE_ADMIN union ROLE_MOD).
    Default-deny: writes only the verified intersection and prunes everyone else.
    Pure stdlib (urllib) — no extra packages."""
    import json, os, time, urllib.request, urllib.error, http.cookiejar

    BASE = os.environ.get("CASDOOR_URL", "http://casdoor.hugmesh-pki.svc.cluster.local:8000")
    ORG  = os.environ.get("CASDOOR_ORG", "hugmesh")
    # The derived role we own/materialize, and the three input roles.
    GAMES_ADMIN_ROLE = os.environ.get("GAMES_ADMIN_ROLE", "ROLE_GAMES_ADMIN")
    GAMES_ROLE       = os.environ.get("GAMES_ROLE", "ROLE_GAMES")
    PRIV_ROLES       = ["ROLE_ADMIN", "ROLE_MOD"]   # the (admin OR mod) side of the AND

    # Where the Job mounts the ESO admin Secret. Env-overridable ONLY so the offline
    # guard (tests/scripts/test-casdoor-init-honesty.sh) can point it at a fixture
    # tree — the Job never sets it, so the cluster always uses /secrets.
    SECRETS = os.environ.get("CASDOOR_SECRETS_DIR", "/secrets")
    ADMIN_USER = open(f"{SECRETS}/admin/username").read().strip()
    ADMIN_PASS = open(f"{SECRETS}/admin/password").read().strip()

    cj = http.cookiejar.CookieJar()
    opener = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cj))

    class CasdoorError(RuntimeError):
        """A Casdoor call that did not report success."""

    def call(path, payload=None, method="GET"):
        """The ONE way this script talks to Casdoor. Nothing may bypass it.

        Casdoor answers an authorization denial with HTTP 200 and
        {"status":"error","msg":...} in the body (routers/authz_filter.go
        denyRequest -> responseError), so urllib raises nothing and an unchecked
        caller reads a fully denied run as a successful one — the shape that had
        casdoor-init printing thirteen "added" lines against a database it never
        wrote to. The envelope is checked here, once."""
        data = json.dumps(payload).encode() if payload is not None else None
        headers = {"Content-Type": "application/json"} if data is not None else {}
        req = urllib.request.Request(BASE + path, data=data, method=method,
                                     headers=headers)
        try:
            with opener.open(req, timeout=15) as r:
                body = r.read()
        except urllib.error.HTTPError as e:
            raise CasdoorError(f"{method} {path}: HTTP {e.code}") from None
        except urllib.error.URLError as e:
            raise CasdoorError(f"{method} {path}: {e.reason}") from None
        try:
            resp = json.loads(body or "{}")
        except ValueError:
            raise CasdoorError(f"{method} {path}: response was not JSON") from None
        if not isinstance(resp, dict) or resp.get("status") != "ok":
            msg = resp.get("msg") if isinstance(resp, dict) else None
            raise CasdoorError(f"{method} {path}: {msg or resp}") from None
        return resp

    def wait_ready():
        for _ in range(60):
            try:
                call("/api/health"); return
            except CasdoorError:
                time.sleep(3)
        raise SystemExit("casdoor not reachable")

    def login():
        """Log in AND prove the session, fatally. A 200/ok from /api/login is not
        proof of one: casdoor-init once ran its entire reconcile anonymously behind
        an unchecked login. /api/get-account resolves the cookie we actually hold.
        This must be fatal — with a denied session every role below reads as empty,
        so this Job would report a confident "not seeded" diagnosis for what is an
        authentication failure. The password is never logged."""
        body = {"application": "app-built-in", "organization": "built-in",
                "username": ADMIN_USER, "password": ADMIN_PASS, "type": "login",
                "autoSignin": True}
        try:
            call("/api/login", body, "POST")
            me = call("/api/get-account")
        except CasdoorError as e:
            raise SystemExit(f"casdoor admin login failed: {e}")
        name = (me.get("data") or {}).get("name") or me.get("name")
        if name != ADMIN_USER:
            raise SystemExit("casdoor admin login did not yield an admin session "
                             f"(the session resolves to {name!r})")

    def role_obj(role):
        """Full role object (so update-role can round-trip every field), or {} when
        the role does not exist.

        It does NOT catch CasdoorError, and that is the point. casdoor's GetRole
        answers ResponseOk(role) — status "ok", data null — for a role that is not
        there (controllers/role.go), so ABSENCE is an ok envelope with no data. A
        status "error" from this endpoint is therefore a DENIAL, never an absence.
        Flattening one into "the role has no members" is how the post-write check
        below gets fooled: when the reconcile is a PRUNE the expected set is empty
        too, so an invented empty role compares EQUAL, and the Job announces a
        removal it never made. Let the denial raise."""
        return call(f"/api/get-role?id={ORG}/{role}").get("data") or {}

    def members(role_object):
        """Normalized member ids ("hugmesh/<name>") from a role object."""
        return set((role_object or {}).get("users") or [])

    def main():
        wait_ready()
        login()

        games   = members(role_obj(GAMES_ROLE))
        priv    = set()
        for r in PRIV_ROLES:
            priv |= members(role_obj(r))
        # The AND: games members who ALSO hold admin or mod.
        qualified = sorted(games & priv)

        target = role_obj(GAMES_ADMIN_ROLE)
        if not target:
            raise SystemExit(f"{GAMES_ADMIN_ROLE} not found — seed it in init_data.json")
        current = members(target)

        if set(qualified) == current:
            print(f"games-admin-sync: {GAMES_ADMIN_ROLE} already == {len(qualified)} qualified member(s); no change")
            return
        # Overwrite users[] with EXACTLY the verified intersection. This both ADDs
        # newly-qualified users and PRUNES anyone who lost ROLE_GAMES or admin/mod
        # (default-deny). Preserve all other fields of the role object.
        target["users"] = qualified
        call(f"/api/update-role?id={ORG}/{GAMES_ADMIN_ROLE}", target, "POST")
        # Read it back, THROUGH THE RAISING PATH. A "status":"ok" is not proof a
        # casdoor write persisted — wrapActionResponse() answers ok/"Affected" or
        # ok/"Unaffected" for every write that reached the handler regardless, and
        # update-group is LIVE-VERIFIED to answer "Affected" while storing none of
        # it (see manifests/casdoor/init-job.yaml). This role is an authorization
        # source, so nothing here may be announced on anything weaker than a read
        # that came back and said so.
        verified = role_obj(GAMES_ADMIN_ROLE)
        if not verified:
            raise SystemExit(f"update-role reported success but {GAMES_ADMIN_ROLE} is no "
                             f"longer readable — refusing to report a membership change")
        if members(verified) != set(qualified):
            raise SystemExit(f"update-role reported success but {GAMES_ADMIN_ROLE} membership "
                             f"did not change")
        added   = sorted(set(qualified) - current)
        removed = sorted(current - set(qualified))
        print(f"games-admin-sync: {GAMES_ADMIN_ROLE} -> {len(qualified)} member(s) "
              f"(+{len(added)} added, -{len(removed)} removed)")
        if added:   print("  + " + ", ".join(added))
        if removed: print("  - " + ", ".join(removed))

    # A Casdoor call that did not report success ends the run non-zero with the
    # endpoint that failed — never a partial reconcile reported as a whole one.
    try:
        main()
    except CasdoorError as e:
        raise SystemExit(f"games-admin-sync: FAILED — {e}")
---
apiVersion: batch/v1
kind: Job
metadata:
  name: games-admin-sync
  namespace: hugmesh-pki
  labels: { app: casdoor, app.kubernetes.io/part-of: hugmesh.net }
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    # WAVE 1 — AFTER casdoor-init (wave 0). This Job opens its session with the
    # PROVISIONED admin password and nothing else; on a fresh cluster the built-in
    # admin still holds casdoor's bootstrap default until casdoor-init takes it
    # over, so an unordered run here is a GUARANTEED wrong password against the
    # one account every Job in this directory shares. Three of these starting at
    # once is what tripped casdoor's sign-in throttle on 2026-09-16 and made
    # casdoor-init's CORRECT login fail inside the ban (hugmesh-generator#396).
    # ArgoCD runs a phase's hooks in wave order and waits for each wave, so this
    # annotation is what keeps that from happening again — and if casdoor-init
    # fails, the phase aborts and this Job never attempts a login at all.
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels: { app: games-admin-sync }
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        hugmesh.net/pki: "true"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: sync
          image: python:3.12-alpine
          command: ["python3", "/script/sync.py"]
          env:
            - { name: CASDOOR_URL, value: "http://casdoor.hugmesh-pki.svc.cluster.local:8000" }
            - { name: CASDOOR_ORG, value: "hugmesh" }
            - { name: GAMES_ADMIN_ROLE, value: "ROLE_GAMES_ADMIN" }
            - { name: GAMES_ROLE,       value: "ROLE_GAMES" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: script, mountPath: /script, readOnly: true }
            - { name: admin, mountPath: /secrets/admin, readOnly: true }
      volumes:
        - name: script
          configMap: { name: games-admin-sync-script, defaultMode: 0555 }
        # ESO-materialized from Vault — never committed. casdoor-admin holds the
        # admin username/password used to open the session for update-role.
        - name: admin
          secret: { secretName: casdoor-admin }
