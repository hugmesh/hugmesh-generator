# casdoor-pg — dedicated Postgres backing Casdoor, replacing the all-in-one
# image's bundled DB. Casdoor stores all orgs / roles / users / applications /
# providers here, so state survives restarts and Casdoor is no longer pinned to
# the single-pod all-in-one. Credentials come from the ESO-materialized Secret
# "casdoor-db" (Vault path secret/<brand>/casdoor-db) — never committed.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: casdoor-pg-data
  namespace: hugmesh-pki
  labels: { app: casdoor-pg, app.kubernetes.io/part-of: hugmesh.net }
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: hugmesh-local
  resources: { requests: { storage: 5Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: casdoor-pg
  namespace: hugmesh-pki
  labels: { app: casdoor-pg, app.kubernetes.io/part-of: hugmesh.net }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: casdoor-pg } }
  template:
    metadata: { labels: { app: casdoor-pg } }
    spec:
      nodeSelector: { hugmesh.net/pki: "true" }
      securityContext:
        seLinuxOptions:
          type: container_t
          level: "s0:c14"
      containers:
        - name: pg
          image: postgres:16-alpine
          ports: [{ name: pg, containerPort: 5432 }]
          env:
            - { name: POSTGRES_DB, value: casdoor }
            - { name: POSTGRES_USER,     valueFrom: { secretKeyRef: { name: casdoor-db, key: username } } }
            - { name: POSTGRES_PASSWORD, valueFrom: { secretKeyRef: { name: casdoor-db, key: password } } }
            # Use a subdir so the volume root (lost+found) doesn't upset initdb.
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "casdoor", "-d", "casdoor"] }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: 500m, memory: 512Mi }
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: casdoor-pg-data }
---
apiVersion: v1
kind: Service
metadata: { name: casdoor-pg, namespace: hugmesh-pki }
spec:
  selector: { app: casdoor-pg }
  ports: [{ name: pg, port: 5432, targetPort: pg }]
