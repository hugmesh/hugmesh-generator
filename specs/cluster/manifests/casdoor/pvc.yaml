# Persistent storage for Casdoor's bundled DB. REQUIRED for service-user
# automation: with the previous emptyDir, every seeded org/role/user/application
# was wiped on pod restart. local-path provisioner (manifests/local-path) backs
# it on the pki node's disk.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: casdoor-data
  namespace: snapdragon-pki
  labels: { app: casdoor, app.kubernetes.io/part-of: snapdragon.systems }
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
