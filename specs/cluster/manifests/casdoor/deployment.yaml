# Casdoor identity provider (all-in-one: Casdoor + bundled DB).
# Issues the OAuth2/OIDC JWTs every snapdragon-*-gateway validates.
# Federated registration via Google + admin-created accounts.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: casdoor
  namespace: snapdragon-pki
  labels: { app: casdoor, app.kubernetes.io/part-of: snapdragon.systems }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: casdoor }
  template:
    metadata:
      labels: { app: casdoor }
    spec:
      nodeSelector:
        snapdragon.systems/pki: "true"
      containers:
        - name: casdoor
          image: casbin/casdoor-all-in-one:3.80.0
          ports:
            - { name: http, containerPort: 8000 }
          env:
            - name: RUNNING_IN_DOCKER
              value: "true"
            # Google federation client credentials (created by an admin in
            # Casdoor, or seeded by the casdoor-init Job). Stored in a Secret.
            - name: GOOGLE_CLIENT_ID
              valueFrom: { secretKeyRef: { name: casdoor-google, key: clientId, optional: true } }
            - name: GOOGLE_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: casdoor-google, key: clientSecret, optional: true } }
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - { name: data, mountPath: /var/lib/casdoor }
            # Declarative seed (org / roles / service users). Casdoor imports
            # init_data.json from its working dir on boot. NOTE: the exact mount
            # path depends on the casbin/casdoor-all-in-one workdir — validate/
            # adjust if auto-import doesn't fire; the casdoor-init Job seeds the
            # OAuth2 applications + secrets regardless.
            - { name: init-data, mountPath: /init_data.json, subPath: init_data.json, readOnly: true }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: "1",  memory: 768Mi }
      volumes:
        # Persistent DB so seeded orgs/roles/users/applications survive restarts.
        - name: data
          persistentVolumeClaim:
            claimName: casdoor-data
        - name: init-data
          configMap:
            name: casdoor-init-data
