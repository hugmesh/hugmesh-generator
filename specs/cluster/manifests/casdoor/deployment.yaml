# Casdoor identity provider on an EXTERNAL Postgres (casdoor-pg) — no longer the
# all-in-one bundled DB. Issues the OAuth2/OIDC JWTs every hugmesh-*-gateway
# validates. Federated registration via Google + admin-created accounts.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: casdoor
  namespace: hugmesh-pki
  labels: { app: casdoor, app.kubernetes.io/part-of: hugmesh.net }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: casdoor }
  template:
    metadata:
      labels: { app: casdoor }
    spec:
      nodeSelector:
        hugmesh.net/pki: "true"
      securityContext:
        seLinuxOptions:
          type: container_t
          level: "s0:c21"
      initContainers:
        # Casdoor doesn't expand beego's "${ENV||default}" syntax inside
        # app.conf (confirmed live — see app-conf-configmap.yaml). Render the
        # real conf/app.conf here instead, into an emptyDir the main container
        # mounts read-only. Reuses the casdoor image itself (busybox sh + awk) so
        # no extra image needs pulling. An SMTP password or a DB password from
        # Vault may carry `|`, `&` or `\`, which a sed expression would read as
        # a delimiter or a backreference, so the render is a literal replacement.
        - name: render-app-conf
          image: casbin/casdoor:3.80.0
          command: ["sh", "-c"]
          args:
            - |
              # A literal index()/substr() replacement in awk: nothing in a value is a
              # pattern, a delimiter or a backreference (sed's s|a|b|g broke on `|`, `&`
              # and `\` in a Vault value and rendered a wrong conf silently). The DB user
              # and password go into a postgres:// URL percent-encoded (RFC 3986 userinfo:
              # every byte but A-Za-z0-9-._~), which both xorm's DSN reader and lib/pq
              # decode, so any value Vault holds -- spaces, quotes, `#`, a newline --
              # reaches Postgres as typed. LC_ALL=C keeps awk on bytes.
              LC_ALL=C awk '
                function rep(s, tok, val,   out, i) { out = ""; while ((i = index(s, tok)) > 0) { out = out substr(s, 1, i - 1) val; s = substr(s, i + length(tok)) } return out s }
                function enc(v,   out, i, c) { out = ""; for (i = 1; i <= length(v); i++) { c = substr(v, i, 1); out = out ((c ~ /^[A-Za-z0-9._~-]$/) ? c : sprintf("%%%02X", ord[c])) } return out }
                BEGIN { for (i = 1; i < 256; i++) ord[sprintf("%c", i)] = i }
                { line = $0
                  line = rep(line, "__CASDOOR_DB_USER__", enc(ENVIRON["CASDOOR_DB_USER"]))
                  line = rep(line, "__CASDOOR_DB_PASSWORD__", enc(ENVIRON["CASDOOR_DB_PASSWORD"]))
                  line = rep(line, "__CASDOOR_SMTP_HOST__", ENVIRON["CASDOOR_SMTP_HOST"])
                  line = rep(line, "__CASDOOR_SMTP_PORT__", ENVIRON["CASDOOR_SMTP_PORT"])
                  line = rep(line, "__CASDOOR_SMTP_USER__", ENVIRON["CASDOOR_SMTP_USER"])
                  line = rep(line, "__CASDOOR_SMTP_PASSWORD__", ENVIRON["CASDOOR_SMTP_PASSWORD"])
                  line = rep(line, "__CASDOOR_SMTP_FROM__", ENVIRON["CASDOOR_SMTP_FROM"])
                  print line }
              ' /template/app.conf.template > /rendered/app.conf
          env:
            - name: CASDOOR_DB_USER
              valueFrom: { secretKeyRef: { name: casdoor-db, key: username } }
            - name: CASDOOR_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: casdoor-db, key: password } }
            - name: CASDOOR_SMTP_HOST
              valueFrom: { secretKeyRef: { name: casdoor-smtp, key: CASDOOR_SMTP_HOST, optional: true } }
            - name: CASDOOR_SMTP_PORT
              valueFrom: { secretKeyRef: { name: casdoor-smtp, key: CASDOOR_SMTP_PORT, optional: true } }
            - name: CASDOOR_SMTP_USER
              valueFrom: { secretKeyRef: { name: casdoor-smtp, key: CASDOOR_SMTP_USER, optional: true } }
            - name: CASDOOR_SMTP_PASSWORD
              valueFrom: { secretKeyRef: { name: casdoor-smtp, key: CASDOOR_SMTP_PASSWORD, optional: true } }
            - name: CASDOOR_SMTP_FROM
              valueFrom: { secretKeyRef: { name: casdoor-smtp, key: CASDOOR_SMTP_FROM, optional: true } }
          volumeMounts:
            - { name: app-conf-template, mountPath: /template, readOnly: true }
            - { name: rendered-conf, mountPath: /rendered }
      containers:
        - name: casdoor
          image: casbin/casdoor:3.80.0
          ports:
            - { name: http, containerPort: 8000 }
          env:
            - name: RUNNING_IN_DOCKER
              value: "true"
            # External Postgres credentials — rendered into conf/app.conf by
            # the render-app-conf initContainer above.
            - name: CASDOOR_DB_USER
              valueFrom: { secretKeyRef: { name: casdoor-db, key: username } }
            - name: CASDOOR_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: casdoor-db, key: password } }
            # Google federation client credentials (created by an admin in
            # Casdoor, or seeded by the casdoor-init Job). Stored in a Secret.
            - name: GOOGLE_CLIENT_ID
              valueFrom: { secretKeyRef: { name: casdoor-google, key: clientId, optional: true } }
            - name: GOOGLE_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: casdoor-google, key: clientSecret, optional: true } }
            # SMTP (optional, absent-by-default). Loaded from the OPTIONAL secret
            # casdoor-smtp (ESO <- Vault secret/<brand>/mail). When the secret is
            # absent these env are simply unset, the app.conf SMTP keys default to
            # empty, and Casdoor stays on native user/pass + admin-approval — no
            # mail wired. Interpolated into conf/app.conf (smtp* keys).
            - name: CASDOOR_SMTP_HOST
              valueFrom: { secretKeyRef: { name: casdoor-smtp, key: CASDOOR_SMTP_HOST, optional: true } }
            - name: CASDOOR_SMTP_PORT
              valueFrom: { secretKeyRef: { name: casdoor-smtp, key: CASDOOR_SMTP_PORT, optional: true } }
            - name: CASDOOR_SMTP_USER
              valueFrom: { secretKeyRef: { name: casdoor-smtp, key: CASDOOR_SMTP_USER, optional: true } }
            - name: CASDOOR_SMTP_PASSWORD
              valueFrom: { secretKeyRef: { name: casdoor-smtp, key: CASDOOR_SMTP_PASSWORD, optional: true } }
            - name: CASDOOR_SMTP_FROM
              valueFrom: { secretKeyRef: { name: casdoor-smtp, key: CASDOOR_SMTP_FROM, optional: true } }
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            # app.conf rendered by the render-app-conf initContainer above.
            # NOTE: the conf path is image-version-specific (casbin/casdoor reads
            # conf/app.conf from its workdir) — validate against the deployed image.
            - { name: rendered-conf, mountPath: /conf/app.conf, subPath: app.conf, readOnly: true }
            # Declarative seed (org / roles / service users). Casdoor reads this on
            # boot ONLY because app-conf-configmap.yaml sets `initDataFile` to this
            # exact path — the import is opt-in, not workdir-relative magic, and
            # omitting the key made it a no-op on the first real cluster. The
            # casdoor-init Job re-reads the SAME ConfigMap and creates anything the
            # boot import did not, so a silent import failure can no longer pass.
            - { name: init-data, mountPath: /init_data.json, subPath: init_data.json, readOnly: true }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: "1",  memory: 768Mi }
      volumes:
        # DB state now lives in casdoor-pg (external Postgres); this configMap
        # template (rendered by the initContainer above) just points Casdoor at it.
        - name: app-conf-template
          configMap:
            name: casdoor-app-conf
        - name: rendered-conf
          emptyDir: {}
        - name: init-data
          configMap:
            name: casdoor-init-data
