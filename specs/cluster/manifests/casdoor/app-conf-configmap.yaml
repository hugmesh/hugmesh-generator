# Casdoor app.conf TEMPLATE that points Casdoor at the external Postgres
# (casdoor-pg) instead of the all-in-one image's bundled DB. Rendered into the
# real conf/app.conf by the "render-app-conf" initContainer in deployment.yaml
# (plain sed substitution of the __TOKEN__ placeholders below against env vars
# sourced from the ESO Secrets casdoor-db / casdoor-smtp). NO secrets here.
#
# NOTE: casbin/casdoor does NOT expand beego's documented "${ENV||default}"
# syntax inside app.conf — confirmed live: with that syntax in place, Casdoor
# used the literal string "${CASDOOR_DB_USER||casdoor}" as the Postgres
# username and crashed with "password authentication failed for user
# \"${CASDOOR_DB_USER||casdoor}\"". Hence the initContainer-render approach
# instead of relying on in-app env interpolation.
apiVersion: v1
kind: ConfigMap
metadata:
  name: casdoor-app-conf
  namespace: hugmesh-pki
  labels: { app: casdoor, app.kubernetes.io/part-of: hugmesh.systems }
data:
  app.conf.template: |
    appname = casdoor
    httpport = 8000
    runmode = prod
    copyrequestbody = true
    SessionOn = true
    # External Postgres (casdoor-pg). For the postgres driver Casdoor uses the
    # dataSourceName verbatim (it only appends dbName for MySQL), so dbname= must
    # be set inline here. Credentials rendered in by the initContainer.
    driverName = postgres
    dataSourceName = "user=__CASDOOR_DB_USER__ password=__CASDOOR_DB_PASSWORD__ host=casdoor-pg port=5432 sslmode=disable dbname=casdoor"
    dbName = casdoor
    tableNamePrefix =
    showSql = false
    redisEndpoint =
    isCloudIntranet = false
    authState = "casdoor"
    socks5Proxy = ""
    verificationCodeTimeout = 10
    initScore = 0
    logPostOnly = true
    origin = "https://id.hugmesh.systems"
    enableGzip = true
    # ── Declarative seed (init_data.json) ───────────────────────────────────
    # WITHOUT initDataFile CASDOOR NEVER READS THE MOUNTED SEED. This file
    # REPLACES the image's own conf/app.conf, which ships
    # `initDataFile = "./init_data.json"`; ours omitted it, and
    # object/init_data.go opens with
    #     initDataFile := conf.GetConfigString("initDataFile")
    #     if initDataFile == "" { return }
    # so InitFromFile() returned before ever looking at the file. That is why the
    # first real cluster came up with only the built-in org on a COMPLETELY fresh
    # database, with /init_data.json present and valid. Absolute path, not the
    # upstream "./" spelling, so the import does not silently depend on the image's
    # workdir staying "/" (deployment.yaml mounts it at exactly this path — the two
    # are cross-checked by tests/scripts/test-casdoor-init-honesty.sh).
    initDataFile = "/init_data.json"
    # CREATE-ONLY. With the upstream default (false), initDefinedOrganization /
    # initDefinedRole / initDefinedUser DELETE and re-add every declared object on
    # EVERY Casdoor restart — which would drop the hugmesh organization and reset
    # every role's membership to the seed's `"users": []` (wiping ROLE_SUPERADMIN
    # holders, the materialized ROLE_GAMES_ADMIN / ROLE_*_SERVICES_* sets and every
    # granted ROLE_MATRIX/ROLE_MASTODON). true makes the import skip objects that
    # already exist, which is the "only missing objects are created" behaviour
    # init-data-configmap.yaml has always claimed.
    initDataNewOnly = true
    # ── SMTP (optional, absent-by-default) ──────────────────────────────────
    # Outbound mail for email-verification / password-reset. Sourced from env
    # (CASDOOR_SMTP_*), which the Deployment loads from the OPTIONAL secret
    # casdoor-smtp (ESO <- Vault secret/<brand>/mail, seeded per the brand's
    # MAIL_PROVIDER). When that secret is ABSENT the env vars are unset, the
    # initContainer renders these to empty strings, and Casdoor stays on
    # native user/pass login + admin-approval registration — no email required.
    smtpServer = "__CASDOOR_SMTP_HOST__"
    smtpPort = "__CASDOOR_SMTP_PORT__"
    smtpUsername = "__CASDOOR_SMTP_USER__"
    smtpPassword = "__CASDOOR_SMTP_PASSWORD__"
    smtpFrom = "__CASDOOR_SMTP_FROM__"
