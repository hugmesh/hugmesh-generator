# games-services-runner-sync — materializes the DERIVED Casdoor role
# ROLE_GAMES_SERVICES_RUNNER, whose membership is the INTERSECTION the games app-store
# RUNNER gate requires:
#
#     ROLE_GAMES_SERVICES_RUNNER  =  ROLE_GAMES_SERVICES  INTERSECT  ROLE_MOD
#
# i.e. a user becomes a games app-store RUNNER (mod-delegated run/stop of instances, but
# NOT catalog-enable or create) ONLY if they hold ROLE_GAMES_SERVICES AND ROLE_MOD. The
# runner is the strictly-narrower sibling of ROLE_GAMES_SERVICES_ADMIN (which also lets
# ROLE_ADMIN holders in and grants create/enable). As with the admin Job, Casdoor nesting
# is UNION not intersection, so this must be reconciled here: read ROLE_GAMES_SERVICES +
# ROLE_MOD membership, compute the intersection, write EXACTLY that set into
# ROLE_GAMES_SERVICES_RUNNER (idempotent; prunes lapsed members — default-deny).
# ROLE_GAMES_SERVICES_RUNNER is the ONLY role on the runner route-access rows
# (manifests/route-access/schema.sql), so the gateway's OR-of-allow-rows yields the AND.
#
# A DIRECT CLONE of games-admin-sync-job.yaml, sharing the SAME env-parameterized script
# as games-services-admin-sync (just PRIV_ROLES=ROLE_MOD here). runAsNonRoot, drop ALL
# caps, readOnlyRootFilesystem, idempotent, ArgoCD PostSync; SAME Casdoor admin-session
# transport. Runs ENTIRELY inside the systems Casdoor (org "hugmesh").
#
# !!! The Casdoor REST API shape is version-specific — validate against the deployed
# !!! casbin/casdoor-all-in-one before relying on it in production.
apiVersion: v1
kind: ConfigMap
metadata:
  name: games-services-runner-sync-script
  namespace: hugmesh-pki
  labels: { app: casdoor, app.kubernetes.io/part-of: hugmesh.net }
data:
  sync.py: |
    #!/usr/bin/env python3
    """Reconcile ROLE_GAMES_SERVICES_RUNNER = ROLE_GAMES_SERVICES intersect ROLE_MOD.
    Byte-identical logic to games-services-admin-sync (env-parameterized DERIVED_ROLE/
    BASE_ROLE/PRIV_ROLES); kept as its own ConfigMap so each Job is self-contained and the
    optional-services prune can drop one without affecting the other. Pure stdlib."""
    import json, os, time, urllib.request, urllib.error, http.cookiejar

    BASE = os.environ.get("CASDOOR_URL", "http://casdoor.hugmesh-pki.svc.cluster.local:8000")
    ORG  = os.environ.get("CASDOOR_ORG", "hugmesh")
    DERIVED_ROLE = os.environ.get("DERIVED_ROLE", "ROLE_GAMES_SERVICES_RUNNER")
    BASE_ROLE    = os.environ.get("BASE_ROLE", "ROLE_GAMES_SERVICES")
    PRIV_ROLES   = [r for r in os.environ.get("PRIV_ROLES", "ROLE_MOD").split(",") if r]

    # Where the Job mounts the ESO admin Secret. Env-overridable ONLY so the offline
    # guard (tests/scripts/test-casdoor-init-honesty.sh) can point it at a fixture
    # tree — the Job never sets it, so the cluster always uses /secrets.
    SECRETS = os.environ.get("CASDOOR_SECRETS_DIR", "/secrets")
    ADMIN_USER = open(f"{SECRETS}/admin/username").read().strip()
    ADMIN_PASS = open(f"{SECRETS}/admin/password").read().strip()

    cj = http.cookiejar.CookieJar()
    opener = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cj))

    class CasdoorError(RuntimeError):
        """A Casdoor call that did not report success."""

    def call(path, payload=None, method="GET"):
        """The ONE way this script talks to Casdoor. Nothing may bypass it.

        Casdoor answers an authorization denial with HTTP 200 and
        {"status":"error","msg":...} in the body (routers/authz_filter.go
        denyRequest -> responseError), so urllib raises nothing and an unchecked
        caller reads a fully denied run as a successful one — the shape that had
        casdoor-init printing thirteen "added" lines against a database it never
        wrote to. The envelope is checked here, once."""
        data = json.dumps(payload).encode() if payload is not None else None
        headers = {"Content-Type": "application/json"} if data is not None else {}
        req = urllib.request.Request(BASE + path, data=data, method=method,
                                     headers=headers)
        try:
            with opener.open(req, timeout=15) as r:
                body = r.read()
        except urllib.error.HTTPError as e:
            raise CasdoorError(f"{method} {path}: HTTP {e.code}") from None
        except urllib.error.URLError as e:
            raise CasdoorError(f"{method} {path}: {e.reason}") from None
        try:
            resp = json.loads(body or "{}")
        except ValueError:
            raise CasdoorError(f"{method} {path}: response was not JSON") from None
        if not isinstance(resp, dict) or resp.get("status") != "ok":
            msg = resp.get("msg") if isinstance(resp, dict) else None
            raise CasdoorError(f"{method} {path}: {msg or resp}") from None
        return resp

    def wait_ready():
        for _ in range(60):
            try:
                call("/api/health"); return
            except CasdoorError:
                time.sleep(3)
        raise SystemExit("casdoor not reachable")

    def login():
        """Log in AND prove the session, fatally. A 200/ok from /api/login is not
        proof of one: casdoor-init once ran its entire reconcile anonymously behind
        an unchecked login. /api/get-account resolves the cookie we actually hold.
        This must be fatal — with a denied session every role below reads as empty,
        so this Job would report a confident "not seeded" diagnosis for what is an
        authentication failure. The password is never logged."""
        body = {"application": "app-built-in", "organization": "built-in",
                "username": ADMIN_USER, "password": ADMIN_PASS, "type": "login",
                "autoSignin": True}
        try:
            call("/api/login", body, "POST")
            me = call("/api/get-account")
        except CasdoorError as e:
            raise SystemExit(f"casdoor admin login failed: {e}")
        name = (me.get("data") or {}).get("name") or me.get("name")
        if name != ADMIN_USER:
            raise SystemExit("casdoor admin login did not yield an admin session "
                             f"(the session resolves to {name!r})")

    def role_obj(role):
        """Full role object (so update-role can round-trip every field), or {} when
        the role does not exist.

        It does NOT catch CasdoorError, and that is the point. casdoor's GetRole
        answers ResponseOk(role) — status "ok", data null — for a role that is not
        there (controllers/role.go), so ABSENCE is an ok envelope with no data. A
        status "error" from this endpoint is therefore a DENIAL, never an absence.
        Flattening one into "the role has no members" is how the post-write check
        below gets fooled: when the reconcile is a PRUNE the expected set is empty
        too, so an invented empty role compares EQUAL, and the Job announces a
        removal it never made. Let the denial raise."""
        return call(f"/api/get-role?id={ORG}/{role}").get("data") or {}

    def members(role_object):
        return set((role_object or {}).get("users") or [])

    def main():
        wait_ready()
        login()

        base = members(role_obj(BASE_ROLE))
        priv = set()
        for r in PRIV_ROLES:
            priv |= members(role_obj(r))
        qualified = sorted(base & priv)

        target = role_obj(DERIVED_ROLE)
        if not target:
            raise SystemExit(f"{DERIVED_ROLE} not found — seed it in init_data.json")
        current = members(target)

        if set(qualified) == current:
            print(f"games-services-runner-sync: {DERIVED_ROLE} already == {len(qualified)} member(s); no change")
        else:
            target["users"] = qualified
            call(f"/api/update-role?id={ORG}/{DERIVED_ROLE}", target, "POST")
            # Read it back, THROUGH THE RAISING PATH. A "status":"ok" is not proof a
            # casdoor write persisted — wrapActionResponse() answers ok/"Affected" or
            # ok/"Unaffected" for every write that reached the handler regardless, and
            # update-group is LIVE-VERIFIED to answer "Affected" while storing none of
            # it (see manifests/casdoor/init-job.yaml). This role is an authorization
            # source, so nothing here may be announced on anything weaker than a read
            # that came back and said so.
            verified = role_obj(DERIVED_ROLE)
            if not verified:
                raise SystemExit(f"update-role reported success but {DERIVED_ROLE} is no "
                                 f"longer readable — refusing to report a membership change")
            if members(verified) != set(qualified):
                raise SystemExit(f"update-role reported success but {DERIVED_ROLE} membership "
                                 f"did not change")
            added   = sorted(set(qualified) - current)
            removed = sorted(current - set(qualified))
            print(f"games-services-runner-sync: {DERIVED_ROLE} -> {len(qualified)} member(s) "
                  f"(+{len(added)} added, -{len(removed)} removed)")
            if added:   print("  + " + ", ".join(added))
            if removed: print("  - " + ", ".join(removed))

    # A Casdoor call that did not report success ends the run non-zero with the
    # endpoint that failed — never a partial reconcile reported as a whole one.
    try:
        main()
    except CasdoorError as e:
        raise SystemExit(f"games-services-runner-sync: FAILED — {e}")
---
apiVersion: batch/v1
kind: Job
metadata:
  name: games-services-runner-sync
  namespace: hugmesh-pki
  labels: { app: casdoor, app.kubernetes.io/part-of: hugmesh.net }
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    # WAVE 1 — AFTER casdoor-init (wave 0). This Job opens its session with the
    # PROVISIONED admin password and nothing else; on a fresh cluster the built-in
    # admin still holds casdoor's bootstrap default until casdoor-init takes it
    # over, so an unordered run here is a GUARANTEED wrong password against the
    # one account every Job in this directory shares. Three of these starting at
    # once is what tripped casdoor's sign-in throttle on 2026-09-16 and made
    # casdoor-init's CORRECT login fail inside the ban (hugmesh-generator#396).
    # ArgoCD runs a phase's hooks in wave order and waits for each wave, so this
    # annotation is what keeps that from happening again — and if casdoor-init
    # fails, the phase aborts and this Job never attempts a login at all.
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels: { app: games-services-runner-sync }
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        hugmesh.net/pki: "true"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: sync
          image: python:3.12-alpine
          command: ["python3", "/script/sync.py"]
          env:
            - { name: CASDOOR_URL, value: "http://casdoor.hugmesh-pki.svc.cluster.local:8000" }
            - { name: CASDOOR_ORG, value: "hugmesh" }
            - { name: DERIVED_ROLE, value: "ROLE_GAMES_SERVICES_RUNNER" }
            - { name: BASE_ROLE,    value: "ROLE_GAMES_SERVICES" }
            - { name: PRIV_ROLES,   value: "ROLE_MOD" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: script, mountPath: /script, readOnly: true }
            - { name: admin, mountPath: /secrets/admin, readOnly: true }
      volumes:
        - name: script
          configMap: { name: games-services-runner-sync-script, defaultMode: 0555 }
        # ESO-materialized from Vault — never committed.
        - name: admin
          secret: { secretName: casdoor-admin }
