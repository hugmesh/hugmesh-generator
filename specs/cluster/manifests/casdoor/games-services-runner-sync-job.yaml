# games-services-runner-sync — materializes the DERIVED Casdoor role
# ROLE_GAMES_SERVICES_RUNNER, whose membership is the INTERSECTION the games app-store
# RUNNER gate requires:
#
#     ROLE_GAMES_SERVICES_RUNNER  =  ROLE_GAMES_SERVICES  INTERSECT  ROLE_MOD
#
# i.e. a user becomes a games app-store RUNNER (mod-delegated run/stop of instances, but
# NOT catalog-enable or create) ONLY if they hold ROLE_GAMES_SERVICES AND ROLE_MOD. The
# runner is the strictly-narrower sibling of ROLE_GAMES_SERVICES_ADMIN (which also lets
# ROLE_ADMIN holders in and grants create/enable). As with the admin Job, Casdoor nesting
# is UNION not intersection, so this must be reconciled here: read ROLE_GAMES_SERVICES +
# ROLE_MOD membership, compute the intersection, write EXACTLY that set into
# ROLE_GAMES_SERVICES_RUNNER (idempotent; prunes lapsed members — default-deny).
# ROLE_GAMES_SERVICES_RUNNER is the ONLY role on the runner route-access rows
# (manifests/route-access/schema.sql), so the gateway's OR-of-allow-rows yields the AND.
#
# A DIRECT CLONE of games-admin-sync-job.yaml, sharing the SAME env-parameterized script
# as games-services-admin-sync (just PRIV_ROLES=ROLE_MOD here). runAsNonRoot, drop ALL
# caps, readOnlyRootFilesystem, idempotent, ArgoCD PostSync; SAME Casdoor admin-session
# transport. Runs ENTIRELY inside the systems Casdoor (org "snapdragon").
#
# !!! The Casdoor REST API shape is version-specific — validate against the deployed
# !!! casbin/casdoor-all-in-one before relying on it in production.
apiVersion: v1
kind: ConfigMap
metadata:
  name: games-services-runner-sync-script
  namespace: snapdragon-pki
  labels: { app: casdoor, app.kubernetes.io/part-of: snapdragon.systems }
data:
  sync.py: |
    #!/usr/bin/env python3
    """Reconcile ROLE_GAMES_SERVICES_RUNNER = ROLE_GAMES_SERVICES intersect ROLE_MOD.
    Byte-identical logic to games-services-admin-sync (env-parameterized DERIVED_ROLE/
    BASE_ROLE/PRIV_ROLES); kept as its own ConfigMap so each Job is self-contained and the
    optional-services prune can drop one without affecting the other. Pure stdlib."""
    import json, os, time, urllib.request, urllib.error, http.cookiejar

    BASE = os.environ.get("CASDOOR_URL", "http://casdoor.snapdragon-pki.svc.cluster.local:8000")
    ORG  = os.environ.get("CASDOOR_ORG", "snapdragon")
    DERIVED_ROLE = os.environ.get("DERIVED_ROLE", "ROLE_GAMES_SERVICES_RUNNER")
    BASE_ROLE    = os.environ.get("BASE_ROLE", "ROLE_GAMES_SERVICES")
    PRIV_ROLES   = [r for r in os.environ.get("PRIV_ROLES", "ROLE_MOD").split(",") if r]

    ADMIN_USER = open("/secrets/admin/username").read().strip()
    ADMIN_PASS = open("/secrets/admin/password").read().strip()

    cj = http.cookiejar.CookieJar()
    opener = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cj))

    def call(path, payload=None, method="GET"):
        url = BASE + path
        data = json.dumps(payload).encode() if payload is not None else None
        req = urllib.request.Request(url, data=data, method=method,
                                     headers={"Content-Type": "application/json"})
        with opener.open(req, timeout=15) as r:
            return json.loads(r.read() or "{}")

    def wait_ready():
        for _ in range(60):
            try:
                opener.open(BASE + "/api/health", timeout=5); return
            except Exception:
                time.sleep(3)
        raise SystemExit("casdoor not reachable")

    def login():
        body = {"application": "app-built-in", "organization": "built-in",
                "username": ADMIN_USER, "password": ADMIN_PASS, "type": "login",
                "autoSignin": True}
        return call("/api/login", body, "POST")

    def role_obj(role):
        data = call(f"/api/get-role?id={ORG}/{role}")
        return (data or {}).get("data") or {}

    def members(role_object):
        return set((role_object or {}).get("users") or [])

    wait_ready()
    login()

    base = members(role_obj(BASE_ROLE))
    priv = set()
    for r in PRIV_ROLES:
        priv |= members(role_obj(r))
    qualified = sorted(base & priv)

    target = role_obj(DERIVED_ROLE)
    if not target:
        raise SystemExit(f"{DERIVED_ROLE} not found — seed it in init_data.json")
    current = members(target)

    if set(qualified) == current:
        print(f"games-services-runner-sync: {DERIVED_ROLE} already == {len(qualified)} member(s); no change")
    else:
        target["users"] = qualified
        call(f"/api/update-role?id={ORG}/{DERIVED_ROLE}", target, "POST")
        added   = sorted(set(qualified) - current)
        removed = sorted(current - set(qualified))
        print(f"games-services-runner-sync: {DERIVED_ROLE} -> {len(qualified)} member(s) "
              f"(+{len(added)} added, -{len(removed)} removed)")
        if added:   print("  + " + ", ".join(added))
        if removed: print("  - " + ", ".join(removed))
---
apiVersion: batch/v1
kind: Job
metadata:
  name: games-services-runner-sync
  namespace: snapdragon-pki
  labels: { app: casdoor, app.kubernetes.io/part-of: snapdragon.systems }
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels: { app: games-services-runner-sync }
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        snapdragon.systems/pki: "true"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: sync
          image: python:3.12-alpine
          command: ["python3", "/script/sync.py"]
          env:
            - { name: CASDOOR_URL, value: "http://casdoor.snapdragon-pki.svc.cluster.local:8000" }
            - { name: CASDOOR_ORG, value: "snapdragon" }
            - { name: DERIVED_ROLE, value: "ROLE_GAMES_SERVICES_RUNNER" }
            - { name: BASE_ROLE,    value: "ROLE_GAMES_SERVICES" }
            - { name: PRIV_ROLES,   value: "ROLE_MOD" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: script, mountPath: /script, readOnly: true }
            - { name: admin, mountPath: /secrets/admin, readOnly: true }
      volumes:
        - name: script
          configMap: { name: games-services-runner-sync-script, defaultMode: 0555 }
        # ESO-materialized from Vault — never committed.
        - name: admin
          secret: { secretName: casdoor-admin }
