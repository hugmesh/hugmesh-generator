# casdoor-init — reconciles the per-app OAuth2 APPLICATIONS in Casdoor and
# injects their client-secrets from Vault (via the ESO Secret casdoor-app-secrets),
# so no secret is ever committed. It ALSO owns two things it used to assume:
#   * the built-in admin's PASSWORD (set to the Vault/ESO value, idempotently —
#     until this landed the IdP kept casdoor's well-known default wherever it was
#     reachable, and the provisioned password was never applied anywhere);
#   * the org/roles/service-users the declarative init_data.json seed declares —
#     Casdoor imports those at boot (see app-conf-configmap.yaml's initDataFile
#     note), and this Job re-reads the SAME ConfigMap and creates whatever the
#     boot import did not, so an inert import cannot pass unnoticed again.
# Idempotent; ArgoCD re-runs it on each sync (PostSync hook).
#
# THIS JOB'S "done" MEANS DONE. Every Casdoor API answer is checked, because
# Casdoor reports errors as HTTP 200 with {"status":"error"} in the body
# (routers/authz_filter.go denyRequest -> responseError): the version of this
# script that only looked at the HTTP status printed all 13 "added app-<name>"
# lines during a run whose admin login had FAILED, so every call went out
# anonymous, Casdoor logged "result = deny" and NOTHING persisted. A failed run
# was indistinguishable from a successful one — which is exactly why the missing
# seed and the default admin password went unnoticed for so long. So: the login
# is verified by reading the session back, every write is verified by re-reading
# the object, nothing prints "added" it did not confirm, and any failed step
# makes the Job exit non-zero.
# Reads admin creds from Secret casdoor-admin (username/password) and per-app
# client-secrets from Secret casdoor-app-secrets — both materialized by ESO from
# Vault (manifests/external-secrets). Keys never touch git or any web interface.
apiVersion: v1
kind: ConfigMap
metadata:
  name: casdoor-init-script
  namespace: hugmesh-pki
  labels: { app: casdoor, app.kubernetes.io/part-of: hugmesh.net }
data:
  reconcile.py: |
    #!/usr/bin/env python3
    """Ensure each app's Casdoor OAuth2 application exists with its Vault secret.
    Pure stdlib (urllib) so the image needs no extra packages / network installs."""
    import json, os, time, urllib.request, urllib.parse, urllib.error, http.cookiejar

    BASE = os.environ.get("CASDOOR_URL", "http://casdoor.hugmesh-pki.svc.cluster.local:8000")
    ORG  = os.environ.get("CASDOOR_ORG", "hugmesh")
    # Where the Job mounts the ESO Secrets, and the declarative seed it cross-checks
    # (the SAME ConfigMap the casdoor Deployment mounts at /init_data.json). Both are
    # env-overridable ONLY so the offline guard can point them at a fixture tree —
    # the Job never sets either, so the cluster always uses the paths below.
    SECRETS   = os.environ.get("CASDOOR_SECRETS_DIR", "/secrets")
    SEED_FILE = os.environ.get("CASDOOR_INIT_DATA", "/init-data/init_data.json")
    ADMIN_USER = open(f"{SECRETS}/admin/username").read().strip()
    ADMIN_PASS = open(f"{SECRETS}/admin/password").read().strip()
    # The password casbin/casdoor gives the built-in admin when it bootstraps an
    # empty database. Public knowledge, so a bootstrap value and not a secret:
    # reconcile_admin_password() uses it to take the account over exactly once on a
    # fresh cluster, and then PROVES it no longer logs in.
    CASDOOR_BOOTSTRAP_PASSWORD = "123"

    # ── casdoor's OWN sign-in throttle ───────────────────────────────────────
    # After a handful of wrong passwords casdoor BANS the account for a fixed
    # window and then refuses EVERY login — the correct password included —
    # answering with this text (i18n/locales/*/data.json, key check."You have
    # entered the wrong password or code too many times, please wait for %d
    # minutes and try again"; the ban state is the user columns
    # signin_wrong_times / last_signin_wrong_time). The refusal has exactly the
    # SHAPE of a wrong password: HTTP 200 + {"status":"error"}. A caller that
    # only reads try_login()'s True/False therefore reports "your password is
    # wrong" about an account whose password is perfectly right.
    #
    # THAT COST A WHOLE BRING-UP, 2026-09-16 (hugmesh-generator#396). Four
    # PostSync hook Jobs in manifests/casdoor raced on a fresh cluster with no
    # sync-wave between them; the three that only ever know the PROVISIONED
    # password cannot be right until THIS Job has taken the account over from
    # casdoor's bootstrap default, so they burned the wrong-password budget at
    # 17:13:49Z and banned the account for fifteen minutes. This Job's CORRECT
    # "123" login was refused inside that window, and the message below told the
    # operator to "reconcile secret/<brand>/casdoor with the account's real
    # password" about a secret that was byte-for-byte correct. `make kind-up`
    # exited 1 at 17:21:55Z on a cluster that converged by itself at 17:29:32Z.
    #
    # The %d makes the whole sentence unmatchable, and it is translated, so
    # match the invariant fragment of the English text only — and treat the
    # classification as a HINT that adds honesty, never as a gate: an
    # unrecognised refusal still fails the Job exactly as before.
    LOCKOUT_MARKER = "too many times"
    # casdoor's message, once the throttle has refused a login. Its presence also
    # LATCHES: every further login attempt in this process is both pointless (no
    # password logs in while the ban holds) and harmful (it keeps the operator's
    # own account hot and muddies the next reader's log), so try_login() makes
    # none. This is the per-run attempt budget — not a comment claiming one.
    LOCKED_OUT = []
    # A DISTINCT exit status for "locked out", so the Job can be failed WITHOUT
    # the pod-backoff replaying the attempts. init-job.yaml's Job spec turns this
    # exact number into a podFailurePolicy FailJob rule; tests/scripts/
    # test-casdoor-login-budget.sh asserts the two still agree. Without it,
    # backoffLimit 6 x 2 logins = 14 wrong attempts from THIS Job alone, which
    # re-locks the account faster than any ban can expire.
    LOCKOUT_EXIT = 75

    # Steps that failed, collected instead of raised so one broken leg does not hide
    # the state of the others. A non-empty list makes the Job exit non-zero at the
    # end — "casdoor-init: done" is only ever printed when this is empty.
    FAILURES = []

    def fail(msg):
        print(f"  FAIL {msg}")
        FAILURES.append(msg)

    # app name -> (redirectUris, role). Mirrors init_data.json + SECURITY.md.
    APPS = {
        "pki-gateway": "ROLE_GATEWAY", "be-gateway": "ROLE_GATEWAY",
        "fe-gateway": "ROLE_GATEWAY",
        "api": "ROLE_API", "admin-bff": "ROLE_ADMIN_API",
        # user-bff is the SSO TOKEN-HANDLER confidential client: login-ui renders a
        # NATIVE username/password form that POSTs to user-bff, which generates
        # PKCE+state server-side, calls Casdoor's internal /api/login directly (no
        # browser redirect to Casdoor at all) and does the code->token exchange +
        # refresh, custody-holding the JWT keyed to the opaque bff_ session (the
        # browser never sees the JWT, the code, the verifier, or any Casdoor URL).
        # reconcile_app() gives it the OIDC-specific overrides (refresh_token grant
        # + the internal PKCE-match redirect_uri, below).
        "user-bff": "ROLE_API",
        "matrix": "ROLE_USER", "mastodon": "ROLE_USER",
        # client-credentials machine app for the remote-fragment sync sidecar: it
        # mints a SERVICE JWT to read the federation manifest/bundles. ROLE_USER is
        # the floor (manifest/bundles only need authenticated()); the minted token
        # then sees the PUBLIC fragments. Bind it to a ROLE_INTERNAL/ROLE_ADMIN-
        # mapping role here + in init_data.json IF internal fragments must sync.
        "fragment-sync": "ROLE_USER",
        # client-credentials machine app for the signup-gate proxy: it mints a
        # SERVICE JWT to call the INTERNAL/ROLE_SERVICE federation username
        # availability endpoint (GET /api/federation/username/{candidate}/
        # availability) BEFORE a self-signup username is accepted, rejecting a
        # confusable/look-alike collision Casdoor's exact-only forbidden-list misses.
        # See manifests/signup-gate/. Bound to ROLE_SERVICE in init_data.json so the
        # minted token satisfies the endpoint's INTERNAL/ROLE_SERVICE gate.
        "signup-gate": "ROLE_SERVICE",
        # Harbor registry web UI/API login — reuses ROLE_ADMIN rather than a
        # narrow ROLE_REGISTRY: Harbor is an internal devops tool (same posture
        # as GitLab, which is also admin-only/no-public-signup), and once a
        # user is IN Harbor its OWN project-level RBAC (not a Casdoor claim)
        # governs what they can do there. The clientId/clientSecret this
        # produces is consumed by manifests/harbor/harbor-provision-job.yaml
        # (via the harbor-casdoor ExternalSecret) to configure Harbor's OIDC
        # auth_mode directly through its REST API — Harbor's Helm chart has no
        # secret-safe way to set this via values (see that Job's comments).
        "harbor": "ROLE_ADMIN",
        # headscale mesh-node OIDC login (keys-template/headscale/config.yaml
        # oidc.client_id="app-headscale", oidc.client_secret_path on the pki
        # node). GAP FOUND 2026-07-09 auditing PR #280 (superadmin mesh-join):
        # nothing previously created this Application at all, so headscale's
        # OIDC login had NO registered client to authenticate against —
        # independent of and prior to the /headscale group-membership question
        # PR #280 fixed. reconcile_app() gives it the headscale-specific
        # redirectUris override below (its OIDC callback path is FIXED by the
        # headscale binary at "<server_url>/oidc/callback", not the generic
        # "https://<name>.hugmesh.net/callback" other apps use).
        "headscale": "ROLE_USER",
    }

    cj = http.cookiejar.CookieJar()
    opener = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cj))

    class CasdoorError(RuntimeError):
        """A Casdoor call that did not report success.

        `msg` is casdoor's OWN envelope message, kept alongside the rendered
        string so a caller can CLASSIFY a refusal instead of re-parsing prose
        this script composed itself. The sign-in throttle is why that matters:
        it is indistinguishable from a wrong password unless the message is
        read. Defaults to "" so the transport-level raises below stay one-liners
        and no caller has to guard for a missing attribute."""

        def __init__(self, rendered, msg=""):
            super().__init__(rendered)
            self.msg = msg

    def call(path, payload=None, method="GET", form=None):
        """The ONE way this script talks to Casdoor. Nothing may bypass it.

        Casdoor answers an authorization denial, a validation error and a bad login
        alike with HTTP 200 and {"status":"error","msg":...} — urllib raises nothing,
        so a caller that only sees exceptions sees success. Every response envelope
        is therefore checked here, once, and a non-"ok" status raises.
        `form` sends application/x-www-form-urlencoded (the shape /api/set-password
        reads its parameters from); `payload` sends JSON (everything else)."""
        headers = {}
        if form is not None:
            data = urllib.parse.urlencode(form).encode()
            headers["Content-Type"] = "application/x-www-form-urlencoded"
        elif payload is not None:
            data = json.dumps(payload).encode()
            headers["Content-Type"] = "application/json"
        else:
            data = None
        req = urllib.request.Request(BASE + path, data=data, method=method,
                                     headers=headers)
        try:
            with opener.open(req, timeout=15) as r:
                body = r.read()
        except urllib.error.HTTPError as e:
            raise CasdoorError(f"{method} {path}: HTTP {e.code}") from None
        except urllib.error.URLError as e:
            raise CasdoorError(f"{method} {path}: {e.reason}") from None
        try:
            resp = json.loads(body or "{}")
        except ValueError:
            raise CasdoorError(f"{method} {path}: response was not JSON") from None
        if not isinstance(resp, dict):
            raise CasdoorError(f"{method} {path}: unexpected response shape") from None
        if resp.get("status") != "ok":
            raise CasdoorError(f"{method} {path}: {resp.get('msg') or resp}",
                               msg=str(resp.get("msg") or "")) from None
        return resp

    def probe(path):
        """GET an object, or None when it does not exist.

        Casdoor is inconsistent about a missing object (some endpoints answer
        {"status":"ok","data":null}, others {"status":"error","msg":"... does not
        exist"}), so an error here reads as absent. That is only safe because
        require_admin_session() has already proved the session is a real admin — a
        DENIED read can therefore not masquerade as an absent object for long: the
        add that follows goes through call(), which raises, and every write is
        re-read before anything is reported as done."""
        try:
            return call(path).get("data")
        except CasdoorError:
            return None

    def wait_ready():
        for _ in range(60):
            try:
                call("/api/health"); return
            except CasdoorError:
                time.sleep(3)
        raise SystemExit("casdoor not reachable")

    def require_admin_session():
        """Read the session back. A 200/ok from /api/login is NOT proof of an admin
        session: the run that printed 13 "added" lines had a login it never checked,
        and every later call went out anonymous. /api/get-account resolves the cookie
        we actually hold, so this is the one check that catches that."""
        try:
            me = call("/api/get-account")
        except CasdoorError:
            return False
        name = (me.get("data") or {}).get("name") or me.get("name")
        return name == ADMIN_USER

    def try_login(password):
        """Attempt an admin login with `password`; True only with a usable session.
        Built-in app/org host the admin. Never logs or returns the password.

        TWO THINGS BEYOND THE LOGIN. It CLASSIFIES the refusal: casdoor's
        sign-in throttle refuses a correct password with the same HTTP 200 +
        {"status":"error"} a wrong one gets, so the envelope message is the only
        thing that tells them apart, and it is recorded in LOCKED_OUT. And once
        that has happened it makes NO further attempt at all — while the ban
        holds no password logs in, so another attempt cannot learn anything and
        can only keep the operator's own account hot. That is this script's
        wrong-attempt budget, and it is enforced here rather than asserted in a
        comment."""
        if LOCKED_OUT:
            return False
        cj.clear()
        body = {"application": "app-built-in", "organization": "built-in",
                "username": ADMIN_USER, "password": password, "type": "login",
                "autoSignin": True}
        try:
            call("/api/login", body, "POST")
        except CasdoorError as e:
            if LOCKOUT_MARKER in getattr(e, "msg", ""):
                LOCKED_OUT.append(e.msg)
            return False
        return require_admin_session()

    def reconcile_admin_password():
        """Put the Vault/ESO password on the built-in admin, and PROVE the casdoor
        default no longer works. Returns False when no admin session could be had.

        Nothing else does this. init_data.json declares no built-in/admin user, and
        even if it did, initDefinedUser() skips an account that already exists — so
        Casdoor's own bootstrap password survives every restart. /api/update-user
        does NOT change a password (confirmed live); /api/set-password does, and
        takes form parameters, not JSON.

        The desired password is tried FIRST so a converged cluster performs exactly
        one login and never touches set-password. THIS FUNCTION makes at most two
        wrong-password attempts per run, and stops dead at the first one casdoor
        answers with its sign-in throttle. That is a property of this function, and
        it used to be mistaken for a property of the deployment: the budget is
        spent against ONE account shared by every Job in manifests/casdoor and by
        the pod backoff, so the sync-wave ordering on those Jobs and the
        podFailurePolicy on this one are load-bearing, not decoration
        (hugmesh-generator#396). No password value is printed on any path."""
        if ADMIN_PASS == CASDOOR_BOOTSTRAP_PASSWORD:
            fail("the provisioned admin password IS the casdoor bootstrap default — "
                 "rotate secret/<brand>/casdoor in Vault; refusing to leave the IdP "
                 "on a publicly known credential")
            return False
        if try_login(ADMIN_PASS):
            print("  admin password: already the provisioned value (no change)")
        elif not LOCKED_OUT and try_login(CASDOOR_BOOTSTRAP_PASSWORD):
            print("  admin password: still the casdoor bootstrap default — applying "
                  "the provisioned value")
            try:
                call("/api/set-password", method="POST",
                     form={"userOwner": "built-in", "userName": ADMIN_USER,
                           "oldPassword": CASDOOR_BOOTSTRAP_PASSWORD,
                           "newPassword": ADMIN_PASS})
            except CasdoorError as e:
                fail(f"set-password failed: {e}")
                return False
            if not try_login(ADMIN_PASS):
                fail("set-password reported success but the provisioned password "
                     "does not log in — the admin credential is NOT what Vault holds")
                return False
            print("  admin password: applied and verified by re-login")
        elif LOCKED_OUT:
            # NOT a wrong password. While the ban holds casdoor refuses the CORRECT
            # password too, so nothing observable from here can tell you whether
            # secret/<brand>/casdoor is right — and the old message confidently said
            # it was wrong. Say what casdoor actually said, and name the thing that
            # spends this budget.
            fail("casdoor is refusing EVERY admin login: its sign-in throttle has "
                 f"banned the account ({LOCKED_OUT[0]!r}). This is NOT evidence of "
                 "a wrong password — the correct one is refused too while the ban "
                 "holds, so do NOT rotate secret/<brand>/casdoor on the strength of "
                 "this line. Something spent the account's wrong-password budget "
                 "before this Job got a turn; on a fresh cluster that is a sibling "
                 "Job in manifests/casdoor logging in with the provisioned password "
                 "while the admin still holds casdoor's bootstrap default. Let the "
                 "ban expire and let this Job run FIRST (the hooks are ordered by "
                 "argocd.argoproj.io/sync-wave: casdoor-init is wave 0, the "
                 "derived-role syncs are wave 1)")
            return False
        else:
            fail("admin login failed with BOTH the provisioned password and the "
                 "casdoor bootstrap default — reconcile secret/<brand>/casdoor with "
                 "the account's real password (nothing below can run)")
            return False
        # The exposure is the DEFAULT still working, so assert it does not. This is
        # the check that would have caught POST /api/login admin/123 -> {"status":"ok"}
        # on a cluster whose Vault password had been "provisioned" for months.
        if try_login(CASDOOR_BOOTSTRAP_PASSWORD):
            fail("the casdoor bootstrap default password STILL logs in as the admin")
            return False
        if not try_login(ADMIN_PASS):
            if LOCKED_OUT:
                fail("casdoor's sign-in throttle banned the admin account between "
                     "applying the provisioned password and proving the bootstrap "
                     f"default no longer works ({LOCKED_OUT[0]!r}). The password "
                     "itself WAS applied and verified by re-login above — re-run "
                     "once the ban expires; nothing needs rotating")
                return False
            fail("lost the admin session after the default-password check")
            return False
        return True

    # object/check_password_complexity.go:104-124 — casdoor REFUSES a set-password
    # whose new value already hashes to what is stored
    # (credManager.IsPasswordCorrect(newPassword, user.Password, salt)), answering
    # with this message (controllers/user.go:629-633; the English text is
    # i18n/locales/en/data.json, key user."The new password must be different from
    # your current password"). That refusal is the ONLY read-back a password has:
    # /api/get-user masks it as "***" (object/user.go:678) and casdoor exposes no
    # endpoint that returns the stored hash. It is a real comparison against
    # persisted state, not a response envelope, which is what makes it usable here.
    PASSWORD_ALREADY_SET = "must be different from your current password"

    def apply_password(owner, name, password):
        """Make <owner>/<name>'s password the value Vault holds, and PROVE it.
        Returns "rotated" or "already the provisioned value". Never prints, logs or
        returns the password itself.

        WHY IT IS SHAPED LIKE THIS. Two calls, always:
          1. set-password with the desired value. "ok" means the stored hash did
             NOT match and now does; the PASSWORD_ALREADY_SET refusal means it
             already did; anything else is a real failure and is raised.
          2. the same call again, purely as verification. It must be refused with
             PASSWORD_ALREADY_SET — i.e. casdoor itself, comparing against the
             stored hash, says the credential IS what Vault holds. A second "ok"
             means the first write did not persist (the setpw-noop shape: casdoor's
             wrapActionResponse answers ok for a write that changed nothing), and
             that is a hard failure rather than a "rotated" line nobody can check.

        NO LOGIN IS ATTEMPTED. This runs in the built-in admin's session, and
        SetPassword checks oldPassword only when one is supplied on the isAdmin
        branch (controllers/user.go:597-606), so no previous password is needed.
        That matters: a rotation loop that verified by logging in as the target
        would burn a failed sign-in on every ArgoCD sync whenever Vault and the IdP
        disagreed, and casdoor locks an account out after five. This path can never
        produce a failed sign-in at all."""
        def attempt():
            try:
                call("/api/set-password", method="POST",
                     form={"userOwner": owner, "userName": name,
                           "oldPassword": "", "newPassword": password})
                return None
            except CasdoorError as e:
                return str(e)
        first = attempt()
        if first is None:
            verb = "rotated"
        elif PASSWORD_ALREADY_SET in first:
            verb = "already the provisioned value"
        else:
            raise CasdoorError(f"set-password for {owner}/{name} failed: {first}")
        confirm = attempt()
        if confirm is None or PASSWORD_ALREADY_SET not in confirm:
            raise CasdoorError(
                f"set-password for {owner}/{name} reported success but casdoor does "
                f"not recognise the Vault value as that account's password "
                f"({confirm or 'the identical write was accepted a second time'}) — "
                f"the credential is NOT what Vault holds")
        return verb

    def ensure_seed():
        """Create anything init_data.json declares that Casdoor's boot import did not.

        The boot import is opt-in on app.conf's initDataFile key (see
        app-conf-configmap.yaml) and reports nothing when it does not run, so the
        first real cluster came up with no hugmesh organization, no roles and no
        service users while every manifest claimed otherwise. This reads the SAME
        ConfigMap the Deployment mounts and reconciles it through the API, verifying
        each object by re-reading it. Create-only, exactly like the boot import with
        initDataNewOnly: an object that already exists is left alone (its runtime
        role membership must survive)."""
        try:
            with open(SEED_FILE) as fh:
                seed = json.load(fh)
        except (OSError, ValueError) as e:
            fail(f"seed: cannot read {SEED_FILE}: {e}")
            return
        # init_data.json key -> the Casdoor API noun that reads/creates it, in the
        # order object/init_data.go's InitFromFile() applies them (organizations
        # before the things that reference them). A key this list does not cover is
        # a FAILURE, not a skip — an unverified seed kind is how the whole file came
        # to be inert in the first place.
        kinds = [("organizations", "organization"), ("providers", "provider"),
                 ("applications", "application"),   ("users", "user"),
                 ("roles", "role"),                 ("webhooks", "webhook"),
                 ("groups", "group"),               ("permissions", "permission")]
        unknown = sorted(set(seed) - {k for k, _ in kinds})
        if unknown:
            fail(f"seed: {SEED_FILE} declares object kinds this Job cannot verify: "
                 f"{', '.join(unknown)}")
        for key, noun in kinds:
            created = present = 0
            declared = seed.get(key) or []
            if not declared:
                continue
            for obj in declared:
                # Every casdoor object is addressed "<owner>/<name>", including
                # organizations (owner "admin") and applications.
                oid = f"{obj['owner']}/{obj['name']}"
                if probe(f"/api/get-{noun}?id={oid}"):
                    present += 1
                    continue
                try:
                    call(f"/api/add-{noun}", obj, "POST")
                except CasdoorError as e:
                    fail(f"seed: could not create {noun} {oid}: {e}")
                    continue
                if not probe(f"/api/get-{noun}?id={oid}"):
                    fail(f"seed: add-{noun} {oid} reported success but the object "
                         f"is not readable")
                    continue
                created += 1
            print(f"  seed: {len(declared)} {key} declared, {present} already "
                  f"present, {created} created by this Job")

    # --- D6+D8 JWT-Custom token shape (LYNCHPIN-VALIDATED against casbin/casdoor:3.80.0) ---
    # The DEFAULT tokenFormat=JWT serializes the FULL user object as flat claims, leaking
    # totpSecret / recoveryCodes / password / passwordSalt into every minted token (a real
    # secret-leak that exists TODAY, independent of MFA — any place a casdoor JWT is
    # stored/logged/XSS-reachable, or written to a device file by GEN-SSO #135, exposes them).
    # tokenFormat=JWT-Custom is an ALLOW-LIST: ONLY the listed tokenFields/tokenAttributes are
    # emitted, so the secrets are excluded BY OMISSION. This SAME config also carries the MFA
    # outcome the BFF stamps into the user's Properties (flat snake_case top-level claims
    # `mfa_satisfied` + `mfa_satisfied_at`, emitted as STRINGS — casdoor properties are
    # map[string]string, so the gateway must Long.parseLong the *_at value).
    # ⚠ An EMPTY/WRONG tokenFields set strips roles/permissions/isAdmin and breaks ALL authz
    # across 11 repos — the curated set below is empirically pinned and guarded by the
    # held-until-live token-mint regression test (tests/casdoor/test-jwt-custom-token.sh).
    JWT_CUSTOM_TOKEN_FIELDS = [
        "Id", "Name", "Email", "IsAdmin",
        "Properties.mfa_satisfied", "Properties.mfa_satisfied_at",
    ]
    # "groups" added 2026-07-09 (same Existing-Field mechanism as roles/permissions
    # above — mirrors, not guesses: this is the one other relation-shaped User field
    # in this list). headscale's OIDC config (keys-template/headscale/config.yaml
    # allowed_groups: [hugmesh/headscale]) gates node-join on a literal "groups"
    # ID-token claim (confirmed against the headscale binary's own compiled string
    # table — "groups" appears alongside its oidc.allowed_groups config key).
    # Casdoor's User.Groups is what reconcile_superadmin() below writes
    # hugmesh/headscale into (PR #280); without this attribute that membership
    # was written but NEVER reached any token, so the mesh-join gate could never
    # pass for anyone. LIVE-VERIFIED (tests/casdoor/test-jwt-custom-token.sh) that
    # this tokenAttribute emits the group's "<owner>/<name>" id string exactly —
    # PR #280's original comments assumed a bare "/headscale" path, which this
    # test proved was never actually minted; allowed_groups is corrected to match
    # the real claim shape. Additive to every app's token (shared allow-list) — no
    # app relied on groups' ABSENCE, so nothing downstream should notice besides
    # gaining the claim.
    JWT_CUSTOM_TOKEN_ATTRIBUTES = [
        {"name": "roles",       "category": "Existing Field", "value": "Roles",       "type": "Array"},
        {"name": "permissions", "category": "Existing Field", "value": "Permissions", "type": "Array"},
        {"name": "groups",      "category": "Existing Field", "value": "Groups",      "type": "Array"},
    ]
    # NOTE: EXCLUDED by omission (allow-list) — totpSecret, recoveryCodes, password,
    # passwordSalt, passwordType, preferredMfaType, mfaEmailEnabled, mfaPhoneEnabled,
    # webauthnCredentials, accessKey/accessSecret, AND the bare "Properties" map (we emit
    # ONLY the two named Properties.* keys, never the whole map).

    def reconcile_app(name, role):
        secret = open(f"{SECRETS}/apps/{name}").read().strip()
        appname = f"app-{name}"
        app = {
            "owner": "admin", "name": appname, "displayName": f"hugmesh {name}",
            "organization": ORG, "clientId": appname, "clientSecret": secret,
            "redirectUris": [f"https://{name}.hugmesh.net/callback"],
            # password grant kept (custom BFF login uses it) + authorization_code +
            # client_credentials (existing machine apps).
            "grantTypes": ["authorization_code", "client_credentials", "password"],
            "expireInHours": 168, "enablePassword": True, "enableSignUp": False,
            # D6+D8: JWT-Custom allow-list — fixes the secret-leak AND emits the MFA claim.
            "tokenFormat": "JWT-Custom",
            "tokenSigningMethod": "RS256",
            "tokenFields": JWT_CUSTOM_TOKEN_FIELDS,
            "tokenAttributes": JWT_CUSTOM_TOKEN_ATTRIBUTES,
        }
        # SSO token-handler overrides for the user-bff confidential client. user-bff
        # itself calls Casdoor's internal /api/login (never a browser-facing
        # /login/oauth/authorize redirect) and does the server-side
        # authorization_code -> token exchange, so it needs the refresh_token grant
        # + a redirect_uri that is purely an INTERNAL PKCE-match string (must
        # byte-match APP_BFF_OIDC_REDIRECT_URI on the user-bff side; no browser ever
        # dereferences it) + a shorter access-token lifetime (refresh_token covers
        # longevity). ⚠ 4h does NOT bring a raw JWT inside the gateway's
        # app.mfa.freshness-window (600000 ms = 10 min) — it is 24x that window, and
        # 168h below is 1008x. No seeded expiry makes the raw-JWT MFA leg satisfiable;
        # see docs/MFA-ROLLOUT.md §2.4 before assuming otherwise. Single-domain
        # seed (…hugmesh.net) matching the confidential apps' convention;
        # per-brand hosts layer via the rebrand/handlebars path, not here.
        if name == "user-bff":
            app["grantTypes"] = app["grantTypes"] + ["refresh_token"]
            app["redirectUris"] = ["https://hugmesh.net/login/callback"]
            app["expireInHours"] = 4
        # headscale's OIDC callback path is FIXED by the headscale binary itself
        # at "<server_url>/oidc/callback" (confirmed in its compiled string
        # table) — not the generic "https://<name>.hugmesh.net/callback"
        # every other app gets. server_url defaults to the baked
        # https://scale.hugmesh.net (keys-template/headscale/config.yaml),
        # so that is what we register here.
        # !!! CAVEAT: like user-bff's callback, this is a single-domain bootstrap
        # !!! seed. keys-provision CAN rewrite server_url at first boot (LAN-IP
        # !!! fallback, or an operator-supplied endpoint via provision.json/brand
        # !!! var — see that file's header comment) — if it does, THIS redirectUri
        # !!! no longer matches what headscale sends and Casdoor will reject the
        # !!! callback (invalid_redirect_uri). Re-running this reconcile after any
        # !!! server_url change (with the new value substituted here) is a
        # !!! follow-up, not yet automated.
        if name == "headscale":
            app["redirectUris"] = ["https://scale.hugmesh.net/oidc/callback"]
        verb = write_application(appname, app)
        print(f"  {verb} {appname} (role {role})")

    def write_application(appname, app):
        """add-or-update an OAuth2 application, verified by re-reading it. Returns
        the verb to report. Raises rather than let a caller announce a write that
        did not land — a {"status":"ok"} that persists nothing is a shape this
        platform has already been bitten by (see the update-group note below)."""
        path = f"/api/get-application?id=admin/{appname}"
        if probe(path):
            call(f"/api/update-application?id=admin/{appname}", app, "POST")
            verb = "updated"
        else:
            call("/api/add-application", app, "POST")
            verb = "added  "
        if not probe(path):
            raise CasdoorError(f"{appname}: {verb.strip()} reported success but the "
                               f"application is not readable")
        return verb

    def reconcile_desktop_client():
        """D6+D8 / GEN-SSO #135 — seed the hugmesh-desktop PKCE PUBLIC client.

        The OIDC client the GOVERNED desktop images log into. The desktop-governance
        templates reference client id hugmesh-desktop (PKCE public client), but the
        client was NEVER seeded in Casdoor. Without this client the desktop SSO login
        can obtain NO token, so the `desktop-sudo` sudo claim is never issuable AND the
        bearer forwarded to the BFF app-store registry never exists — i.e. the whole
        desktop-governance feature is inert (RESIDUAL #9a; see
        specs/etc/hugmesh/desktop-governance/README.md). The `desktop-sudo`
        claim/role is what the admin-bff sudo-grant places on the user at the IdP; the
        on-device desktop-sudo mapper verifies the deposited token against this
        issuer's JWKS and maps that `roles` claim into the local `desktop-sudo` group,
        and polkit gates sudo on it (default-deny). The `desktop-sudo`
        Casdoor role itself is seeded declaratively in init_data.json
        (init-data-configmap.yaml).

        GEN-SSO #135 deposits the minted token to a device file (${XDG_RUNTIME_DIR}/
        hugmesh/oidc-token); under casdoor's DEFAULT tokenFormat=JWT that file would
        contain totpSecret/recoveryCodes/password/passwordSalt. We seed it here with the
        SAME JWT-Custom allow-list as the systems apps so the on-device token is clean
        and carries the MFA claim AND the `roles` claim (incl. desktop-sudo) the
        desktop-sudo mapper reads.

        PUBLIC client: clientSecret is EMPTY (PKCE, no secret baked into the image),
        isPublic=True marks it as a public client; redirectUris are the native loopback
        + OOB URIs the desktop OIDC flow uses. Idempotent (update-if-exists).
        Single-domain seed today, matching the confidential apps' `…hugmesh.net`
        convention — per-brand domains are layered by the rebrand path, not by this
        bootstrap seed.

        !!! The PKCE-public-client object shape (isPublic vs empty clientSecret,
        !!! tokenFormat key, native-redirect handling) is Casdoor-version-specific —
        !!! validate against the deployed Casdoor. Failing this reconcile leaves the
        !!! feature ships-dark (no token => empty store + no sudo), not broken.
        """
        appname = "hugmesh-desktop"
        app = {
            "owner": "admin", "name": appname,
            "displayName": "HugMesh Desktop (PKCE)",
            "organization": ORG, "clientId": appname,
            # PUBLIC client — NO secret (PKCE). Empty string, never read from Vault.
            "clientSecret": "",
            "isPublic": True,
            # Native loopback (RFC 8252) + OOB redirects for the desktop SSO flow.
            "redirectUris": [
                "http://127.0.0.1/callback", "http://localhost/callback",
                "urn:ietf:wg:oauth:2.0:oob",
            ],
            # PKCE authorization_code (+ device_code for a headless/seat enrolment);
            # refresh_token so the device can refresh after the BFF stamps the MFA
            # Property. NO password / client_credentials for a public client.
            "grantTypes": [
                "authorization_code",
                "refresh_token",
                "urn:ietf:params:oauth:grant-type:device_code",
            ],
            "expireInHours": 168, "enablePassword": False, "enableSignUp": False,
            # D6+D8: SAME JWT-Custom allow-list as the systems apps — leak-fix + MFA claim.
            # JWT-Custom still carries the `roles` claim (incl. desktop-sudo) via
            # tokenAttributes, which the desktop-sudo mapper maps to the local desktop-sudo group.
            "tokenFormat": "JWT-Custom",
            "tokenSigningMethod": "RS256",
            "tokenFields": JWT_CUSTOM_TOKEN_FIELDS,
            "tokenAttributes": JWT_CUSTOM_TOKEN_ATTRIBUTES,
        }
        verb = write_application(appname, app)
        print(f"  {verb} {appname} (PKCE public client, JWT-Custom; desktop-sudo claim source)")

    MFA_ITEMS = [
        {"name": "WebAuthn", "rule": "Optional"},
        {"name": "TOTP",     "rule": "Optional"},
    ]

    def reconcile_org_mfa():
        """D8 — make the org MFA CAPABILITY available (WebAuthn + TOTP) and set the
        remember window. SHIPS DARK: MFA is AVAILABLE but not required — `rule:
        "Optional"` offers it without forcing it; enforcement is a later, operator-
        flipped step. GET-then-merge so we never clobber org fields seeded by
        init_data.json (passwordType, languages, ...).

        ⚠️ THERE IS NO `enableMfa` ON THIS CASDOOR. This step used to set it and then
        assert it came back true, which casbin/casdoor:3.80.0 can NEVER satisfy: the
        Organization struct carries only MfaItems + MfaRememberInHours (object/
        organization.go), there is no EnableMfa field, and the live casdoor-pg
        `organization` table has no enable_mfa column — an unknown JSON key is
        dropped by the Go decoder, update-organization answers {"status":"ok"} and
        the read-back is false forever. The step therefore failed on every run that
        got far enough to make the call, which no run ever did until the seed was
        fixed and casdoor could boot. mfaItems IS the capability list on this
        version, so that is what is written and what is verified."""
        org_id = f"admin/{ORG}"
        org = probe(f"/api/get-organization?id={org_id}") or {}
        if not org:
            # ensure_seed() runs first and fails loudly when the organization cannot
            # be created, so reaching here means it vanished between the two calls.
            raise CasdoorError(f"organization {ORG} does not exist")
        org["mfaItems"] = MFA_ITEMS
        # WebAuthn relying-party + TOTP issuer scope the platform brand.
        org["mfaRememberInHours"] = 0
        org["websiteUrl"] = org.get("websiteUrl") or "https://hugmesh.net"
        call(f"/api/update-organization?id={org_id}", org, "POST")
        # Read the capability list back — this is the field the whole step exists to
        # set, and an ok envelope is not evidence it persisted.
        stored = (probe(f"/api/get-organization?id={org_id}") or {}).get("mfaItems") or []
        want = {i["name"] for i in MFA_ITEMS}
        got = {(i or {}).get("name") for i in stored}
        if not want <= got:
            raise CasdoorError(f"update-organization reported success but {ORG}'s "
                               f"mfaItems came back as {sorted(got)} — the MFA types "
                               f"{sorted(want - got)} are not available on the org")
        print(f"  org-mfa: MFA capability available on {ORG} "
              f"({', '.join(sorted(want))}, Optional — NOT required)")

    def write_provider(name, provider):
        """add-or-update a federation provider, verified by re-reading it."""
        path = f"/api/get-provider?id=admin/{name}"
        if probe(path):
            call(f"/api/update-provider?id=admin/{name}", provider, "POST")
            verb = "updated"
        else:
            call("/api/add-provider", provider, "POST")
            verb = "added  "
        if not probe(path):
            raise CasdoorError(f"{name} provider: {verb.strip()} reported success but "
                               f"the provider is not readable")
        return verb

    def reconcile_google_provider():
        """Seed the Google OAuth federation provider (clientId/secret from Vault).
        Skipped when the casdoor-google secret is absent (provider is optional)."""
        try:
            cid  = open(f"{SECRETS}/google/clientId").read().strip()
            csec = open(f"{SECRETS}/google/clientSecret").read().strip()
        except FileNotFoundError:
            print("  google provider: casdoor-google secret absent — skipping")
            return
        # gen-cluster-secrets seeds a REPLACE_WITH_* placeholder when no real creds
        # are supplied; treat an empty/placeholder clientId as "absent" so we never
        # seed a broken provider (keeps native login + admin-approval).
        if not cid or cid.startswith("REPLACE_WITH_"):
            print("  google provider: clientId is placeholder/empty — skipping")
            return
        provider = {
            "owner": "admin", "name": "google", "displayName": "Google",
            "category": "OAuth", "type": "Google",
            "clientId": cid, "clientSecret": csec,
            "scopes": "profile email", "enableSignUp": True,
        }
        print(f"  {write_provider('google', provider)} google provider")

