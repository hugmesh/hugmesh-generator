    def reconcile_signup_webhook():
        """Register the POST-signup reconcile webhook so Casdoor notifies the
        signup-gate proxy AFTER a user signup/update. This is the BACKSTOP to the
        pre-signup proxy gate (manifests/signup-gate): the proxy re-checks the new
        username against the federation availability endpoint and disables
        (setForbidden) any confusable that slipped past the pre-gate (race /
        backfill / ICU skeleton shift). The PRIMARY gate is the proxy in front of
        the signup endpoint — Casdoor webhooks fire AFTER the fact, so they cannot
        veto a signup, only reconcile it. Optional shared-secret from
        signup-gate-webhook (header X-Signup-Gate-Secret).

        !!! Casdoor's webhook object schema (events[], headers[], isEnabled) is
        !!! version-specific — validate against the deployed casbin/casdoor before
        !!! relying on auto-import; the pre-signup proxy gate works regardless."""
        try:
            secret = open(f"{SECRETS}/webhook/secret").read().strip()
        except FileNotFoundError:
            secret = ""
        url = ("http://signup-gate.hugmesh-pki.svc.cluster.local:8000"
               "/casdoor/webhook")
        webhook = {
            "owner": "admin", "name": "signup-gate-reconcile",
            "organization": ORG, "url": url, "method": "POST",
            "contentType": "application/json",
            # signup + user mutations — the events that can introduce a confusable.
            "events": ["signup", "add-user", "update-user"],
            "isUserExtended": True, "isEnabled": True,
            "headers": ([{"name": "X-Signup-Gate-Secret", "value": secret}]
                        if secret else []),
        }
        path = "/api/get-webhook?id=admin/signup-gate-reconcile"
        if probe(path):
            call("/api/update-webhook?id=admin/signup-gate-reconcile", webhook, "POST")
            verb = "updated"
        else:
            call("/api/add-webhook", webhook, "POST")
            verb = "added  "
        if not probe(path):
            raise CasdoorError(f"signup-gate-reconcile webhook: {verb.strip()} reported "
                               f"success but the webhook is not readable")
        print(f"  {verb} signup-gate-reconcile webhook")

    def reconcile_superadmin():
        """Create the platform SUPERADMIN bootstrap user and assign ROLE_SUPERADMIN.
        Reads credentials from /secrets/superadmin/{username,password}, materialised
        from Vault via ESO as Secret casdoor-superadmin (optional: true). Skips
        gracefully when the Secret is absent so deployments without a pre-provisioned
        superadmin still work — the operator adds the user manually in that case."""
        try:
            username = open(f"{SECRETS}/superadmin/username").read().strip()
            password = open(f"{SECRETS}/superadmin/password").read().strip()
        except FileNotFoundError:
            print(f"  superadmin: {SECRETS}/superadmin absent (optional Secret not synced) — skipping bootstrap user")
            return
        if not username or not password:
            print("  superadmin: username/password empty — skipping")
            return

        user_id = f"{ORG}/{username}"
        user_path = f"/api/get-user?id={user_id}"
        existing = probe(user_path)
        if existing:
            # RE-FETCH-THEN-MUTATE, never a payload built from scratch — the same
            # discipline the group/user blocks below already use, and here it is not
            # a nicety: casdoor gives every organization the DEFAULT account items
            # (object/init_data.go:309-311 -> object/init.go:53), in which "ID" has
            # ModifyRule "Immutable". A hand-built payload carries no "id", so
            # CheckUpdateUser sees the user's real UUID changing to "" (object/
            # user_util.go:553-559), CheckAccountItemModifyRule rejects it (object/
            # organization.go:325-336) and update-user answers "The ID is
            # immutable." — i.e. this leg could only ever succeed on the FIRST run
            # against a given cluster, and ArgoCD re-runs this Job on every sync.
            # The password is deliberately NOT sent HERE: casdoor masks it as "***"
            # on read (object/user.go:678) and treats that value as "unchanged"
            # (object/user.go:822/841), and /api/update-user cannot set a password
            # at all (see reconcile_admin_password). apply_password() below does it
            # through /api/set-password, which can — so a password rotated in Vault
            # reaches an EXISTING superadmin, not only a freshly created one.
            user = dict(existing)
            user["displayName"] = "Platform Superadmin"
            user["type"] = "normal-user"
            user["isForbidden"] = False
            user["isDeleted"] = False
            call(f"/api/update-user?id={user_id}", user, "POST")
            verb = "updated"
        else:
            call("/api/add-user", {
                "owner": ORG, "name": username,
                "displayName": "Platform Superadmin",
                "type": "normal-user", "password": password,
                "isAdmin": False, "isForbidden": False, "isDeleted": False,
            }, "POST")
            verb = "created"
        if not probe(user_path):
            raise CasdoorError(f"superadmin: {verb} user {username} but it is not readable")
        print(f"  superadmin: {verb} user {username} in org {ORG}")

        # THE CREDENTIAL ITSELF, on both branches. On the create branch add-user
        # already carried it, so this normally reports "already the provisioned
        # value" — but it is run there too, because that is the only thing that
        # PROVES what add-user stored. On the update branch it is the whole point:
        # without it a password rotated in Vault never reached the IdP, the ESO
        # Secret and the account silently diverged, and the operator's evidence
        # that anything was wrong was a superadmin login that stopped working.
        print(f"  superadmin: password {apply_password(ORG, username, password)}")

        # Assign ROLE_SUPERADMIN: GET current role, add the user, PUT back, then
        # re-read — the role is the authorization source, so an unpersisted write
        # here means the bootstrap superadmin holds nothing.
        role_id = f"{ORG}/ROLE_SUPERADMIN"
        role = probe(f"/api/get-role?id={role_id}") or {}
        if not role:
            raise CasdoorError(f"ROLE_SUPERADMIN does not exist in org {ORG}")
        users = role.get("users") or []
        full_name = f"{ORG}/{username}"
        if full_name not in users:
            users.append(full_name)
        role["owner"] = ORG
        role["name"] = "ROLE_SUPERADMIN"
        role["users"] = users
        call(f"/api/update-role?id={role_id}", role, "POST")
        if full_name not in ((probe(f"/api/get-role?id={role_id}") or {}).get("users") or []):
            raise CasdoorError(f"update-role reported success but {username} is not a "
                               f"member of ROLE_SUPERADMIN")
        print(f"  superadmin: assigned ROLE_SUPERADMIN to {username}")

        # --- Mesh-join: grant /headscale Casdoor group membership -----------------
        # headscale OIDC node-join GATES enrolment on allowed_groups:
        # [hugmesh/headscale] (keys-template/headscale/config.yaml — this is the
        # group's real "<owner>/<name>" claim shape, LIVE-VERIFIED below, not a bare
        # "/headscale" path). ROLE_SUPERADMIN alone does NOT put
        # the user in that group, so without this a superadmin CANNOT join the mesh
        # via OIDC. Nothing else seeds the group (the headscale config only asserts it
        # "must exist"), so ENSURE it first, then mirror the ROLE_SUPERADMIN block
        # above: GET the group, append the user, POST update-group. We ALSO stamp the
        # membership onto the USER object (user.groups) because Casdoor emits the OIDC
        # `groups` claim headscale matches on from User.Groups — belt-and-suspenders so
        # the claim is carried regardless of which representation the deployed Casdoor
        # treats as canonical. This grants MESH DATA-PLANE reach only; SSH reach
        # (tag:superadmin) is a separate, deliberately-manual control — see
        # docs/SUPERADMIN-MESH-CLIENT.md.
        # LIVE-VERIFIED 2026-07-09 (tests/casdoor/test-jwt-custom-token.sh) against
        # casbin/casdoor:3.80.0: user.groups persists via the GET-then-mutate-
        # same-object-then-POST pattern used below (a hand-built update-user
        # payload that doesn't round-trip the real "id" field is REJECTED with
        # "The ID is immutable" — this code avoids that by never constructing the
        # payload from scratch). group.users needs the SAME re-fetch-before-update
        # discipline: the first version of this code built the group dict LOCALLY
        # after add-group (no re-fetch) and update-group returned {"status":"ok"}
        # while SILENTLY not persisting membership — caught live by the same test.
        # The token's `groups` claim (via the JWT-Custom "Existing Field: Groups"
        # tokenAttribute) emits the group's internal "<owner>/<name>" id string —
        # "hugmesh/headscale" — NOT a bare "/headscale" path
        # (keys-template/headscale/config.yaml allowed_groups is set to match this
        # exactly). Re-validate this claim shape against any future Casdoor
        # version bump. NOTE: the claim itself is sourced from user.groups, not
        # group.users — group.users is Casdoor-console-visibility only, but it
        # must still be correct (an admin reading the group membership page
        # should see the truth), hence still fixing it below rather than treating
        # it as cosmetic.
        group_name = "headscale"
        group_id = f"{ORG}/{group_name}"
        member = f"{ORG}/{username}"
        group = probe(f"/api/get-group?id={group_id}") or {}
        if not group:
            # Seed the group — nothing else creates it. Virtual so it never collides
            # with a user's single physical group; top-level org group. The token
            # claim value this produces is "hugmesh/headscale" (owner/name), not
            # a bare "/headscale" path — see the LIVE-VERIFIED note above.
            new_group = {
                "owner": ORG, "name": group_name,
                "displayName": "Headscale mesh operators",
                "type": "Virtual", "parentId": ORG,
                "isTopGroup": True, "isEnabled": True, "users": [],
            }
            call("/api/add-group", new_group, "POST")
            # RE-FETCH rather than reusing new_group for the update below —
            # Casdoor may populate server-side fields (createdTime, an
            # internal id, ...) that a blind local-dict POST won't round-trip,
            # which is exactly what silently dropped the membership before
            # this fix (update-group reported "Affected" but users stayed []).
            # The re-fetch doubles as the did-it-persist check.
            group = probe(f"/api/get-group?id={group_id}") or {}
            if not group:
                raise CasdoorError(f"add-group /{group_name} reported success but the "
                                   f"group is not readable")
            print(f"  superadmin: created Casdoor group /{group_name}")
        members = group.get("users") or []
        if member not in members:
            members.append(member)
        group["owner"] = ORG
        group["name"] = group_name
        group["users"] = members
        # BEST-EFFORT, KNOWN-UNRELIABLE on casbin/casdoor:3.80.0: LIVE-VERIFIED
        # (tests/casdoor/test-jwt-custom-token.sh) that /api/update-group's
        # "users" field is a no-op on an EXISTING group — it returns
        # {"status":"ok","data":"Affected"} while NOT persisting membership,
        # with or without a re-fetched payload or a ?columns=users hint. Only
        # /api/add-group honors "users", and only at creation. This call is kept
        # (harmless, and may start working on a future Casdoor version) but we
        # VERIFY by re-reading rather than trusting the HTTP status, because that
        # status is misleading here. This does NOT affect the actual OIDC gate —
        # the `groups` token claim is sourced from user.groups (verified working
        # below), not group.users; this is Casdoor-admin-console visibility only.
        call(f"/api/update-group?id={group_id}", group, "POST")
        if member in ((probe(f"/api/get-group?id={group_id}") or {}).get("users") or []):
            print(f"  superadmin: added {username} to Casdoor group /{group_name}")
        else:
            print(f"  NOTE superadmin: update-group reported success but did not persist "
                  f"group.users on /{group_name} (known casdoor:3.80.0 limitation — the "
                  f"OIDC gate is unaffected, it reads user.groups, set below)")
        # Reflect membership on the user record too — this is what Casdoor emits as
        # the OIDC `groups` claim headscale gates on. GET the user, merge the group
        # id, PUT it back (never clobber any groups already present). This one IS the
        # gate, so unlike group.users above it is verified and must persist.
        u = probe(user_path) or {}
        if not u:
            raise CasdoorError(f"superadmin: user {username} disappeared before the "
                               f"user.groups update")
        u_groups = u.get("groups") or []
        if group_id not in u_groups:
            u_groups.append(group_id)
            u["groups"] = u_groups
            call(f"/api/update-user?id={user_id}", u, "POST")
            if group_id not in ((probe(user_path) or {}).get("groups") or []):
                raise CasdoorError(f"update-user reported success but user.groups does "
                                   f"not carry {group_id} — the headscale OIDC mesh-join "
                                   f"gate would deny this superadmin")
            print(f"  superadmin: set user.groups={u_groups} on {username}")

    # ── run ──────────────────────────────────────────────────────────────────
    # Every leg is a named step. A step that raises is RECORDED, not swallowed:
    # the remaining steps still run (so one broken leg does not hide the state of
    # the others) and the Job exits non-zero at the end. `optional` marks the legs
    # whose ABSENCE is a legitimate deployment choice — but only a missing Secret
    # skips them; an API failure inside one is a failure like any other.
    def step(label, fn, optional=False):
        try:
            fn()
        except CasdoorError as e:
            fail(f"{label}: {e}")
        except FileNotFoundError as e:
            if optional:
                print(f"  {label}: optional input absent ({e.filename}) — skipping")
            else:
                fail(f"{label}: required input missing: {e.filename}")
        except Exception as e:  # noqa: BLE001 — an unexpected fault is still a failure
            fail(f"{label}: unexpected error: {type(e).__name__}: {e}")

    wait_ready()
    # Nothing below can work without a real admin session, and the login is also
    # where the provisioned password gets applied — so this one is fatal on the spot
    # rather than recorded and pressed on with (that is precisely how a whole run
    # went out anonymous while printing success).
    if not reconcile_admin_password():
        for f in FAILURES:
            print(f"  - {f}")
        if LOCKED_OUT:
            # A DISTINCT exit status, because this failure must NOT be retried.
            # restartPolicy Never + the podFailurePolicy FailJob rule on this exact
            # number (see the Job below) end the Job here instead of replaying the
            # login six more times into a ban that only time can clear. Everything
            # else still gets the ordinary backoff.
            print("casdoor-init: FAILED — casdoor's sign-in throttle is refusing "
                  "every admin login; retrying now would only keep the account "
                  f"banned (exit {LOCKOUT_EXIT})")
            raise SystemExit(LOCKOUT_EXIT)
        raise SystemExit("casdoor-init: FAILED — no usable Casdoor admin session")
    # The org/roles/service-users the declarative seed declares must exist before
    # anything references them (org-mfa, the app organization field, ROLE_SUPERADMIN).
    step("seed", ensure_seed)
    # D8: enable the org MFA capability (dark — available, not required) BEFORE the
    # apps so the WebAuthn RP / TOTP issuer scope exists when clients are reconciled.
    step("org-mfa", reconcile_org_mfa)
    for name, role in APPS.items():
        step(name, lambda n=name, r=role: reconcile_app(n, r))
    # D6+D8 / GEN-SSO #135 / RESIDUAL #9a: seed the hugmesh-desktop PKCE public
    # client (JWT-Custom). Its absence leaves the desktop feature ships-dark (no
    # token => empty store, no sudo claim) — which is still a failure to report.
    step("hugmesh-desktop client", reconcile_desktop_client)
    step("google provider",  reconcile_google_provider,  optional=True)
    step("github provider",  reconcile_github_provider,  optional=True)
    step("discord provider", reconcile_discord_provider, optional=True)
    step("signup-gate webhook", reconcile_signup_webhook, optional=True)
    step("superadmin bootstrap", reconcile_superadmin, optional=True)

    if FAILURES:
        print(f"casdoor-init: FAILED — {len(FAILURES)} step(s) did not complete:")
        for f in FAILURES:
            print(f"  - {f}")
        raise SystemExit(1)
    print("casdoor-init: done")
---
apiVersion: batch/v1
kind: Job
metadata:
  name: casdoor-init
  namespace: hugmesh-pki
  labels: { app: casdoor, app.kubernetes.io/part-of: hugmesh.net }
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    # ORDERING, AND WHY IT IS NOT DECORATION (hugmesh-generator#396).
    # manifests/casdoor ships FOUR PostSync hook Jobs, and every one of them logs
    # in as the SAME built-in/admin account. This Job is the only one that knows
    # casdoor's bootstrap default and the only one that can take the account over
    # from it; the three derived-role syncs know ONLY the provisioned password, so
    # on a fresh cluster their login is GUARANTEED wrong until this Job has run.
    # With no wave between them ArgoCD started all four at once, the three wrong
    # logins tripped casdoor's sign-in throttle, and this Job's correct login was
    # refused inside the ban — `make kind-up` exited 1 on a cluster that then
    # converged by itself seven and a half minutes later. ArgoCD runs the hooks of
    # one phase in wave order and waits for each wave to finish, so wave 0 here and
    # wave 1 there is what makes "this Job goes first" true of the DEPLOYMENT.
    # A failure here also aborts the phase, so wave 1 never even attempts a login.
    argocd.argoproj.io/sync-wave: "0"
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 600
  # THE POD BACKOFF IS ALSO A LOGIN BUDGET. reconcile.py makes at most two
  # wrong-password attempts per run, but 1 + backoffLimit runs of it is up to
  # fourteen — more than enough to re-ban the account on every single retry, so a
  # lockout that would clear on its own becomes permanent. reconcile.py exits 75
  # and ONLY 75 for "casdoor's throttle is refusing every login"; this rule ends
  # the Job on that status instead of replaying it. Everything else keeps the
  # ordinary backoff. podFailurePolicy requires restartPolicy: Never (the two are
  # validated together by the apiserver), which is why the pod template below no
  # longer says OnFailure; it is GA since Kubernetes 1.31.
  # tests/scripts/test-casdoor-login-budget.sh asserts this number and the one in
  # reconcile.py are still the same number.
  podFailurePolicy:
    rules:
      - action: FailJob
        onExitCodes:
          containerName: reconcile
          operator: In
          values: [75]
  template:
    metadata:
      labels: { app: casdoor-init }
    spec:
      restartPolicy: Never
      nodeSelector:
        hugmesh.net/pki: "true"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: reconcile
          image: python:3.12-alpine
          command: ["python3", "/script/reconcile.py"]
          env:
            - name: CASDOOR_URL
              value: "http://casdoor.hugmesh-pki.svc.cluster.local:8000"
            - name: CASDOOR_ORG
              value: "hugmesh"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: script, mountPath: /script, readOnly: true }
            # The SAME declarative seed the casdoor Deployment mounts. ensure_seed()
            # reconciles it through the API so a boot-time import that did not run
            # (the shape that shipped an empty IdP) cannot go unnoticed.
            - { name: init-data, mountPath: /init-data, readOnly: true }
            - { name: admin, mountPath: /secrets/admin, readOnly: true }
            - { name: apps, mountPath: /secrets/apps, readOnly: true }
            - { name: google, mountPath: /secrets/google, readOnly: true }
            - { name: github, mountPath: /secrets/github, readOnly: true }
            - { name: discord, mountPath: /secrets/discord, readOnly: true }
            - { name: webhook, mountPath: /secrets/webhook, readOnly: true }
            - { name: superadmin, mountPath: /secrets/superadmin, readOnly: true }
      volumes:
        - name: script
          configMap: { name: casdoor-init-script, defaultMode: 0555 }
        # Declarative org/roles/service-users seed (init-data-configmap.yaml) — the
        # same ConfigMap casdoor itself mounts at /init_data.json.
        - name: init-data
          configMap: { name: casdoor-init-data }
        # ESO-materialized from Vault — never committed.
        - name: admin
          secret: { secretName: casdoor-admin }
        - name: apps
          secret: { secretName: casdoor-app-secrets }
        # Google federation client — optional; provider seeding is skipped if absent.
        - name: google
          secret: { secretName: casdoor-google, optional: true }
        # GitHub federation client — optional; provider seeding is skipped if absent.
        - name: github
          secret: { secretName: casdoor-github, optional: true }
        # Discord federation client — optional; provider seeding is skipped if absent.
        - name: discord
          secret: { secretName: casdoor-discord, optional: true }
        # signup-gate reconcile-webhook shared-secret — optional; the webhook is
        # registered without a secret header if absent (pre-signup proxy gate is
        # the primary enforcement regardless).
        - name: webhook
          secret: { secretName: signup-gate-webhook, optional: true }
        # Platform SUPERADMIN bootstrap user — optional: absent when no superadmin
        # was generated by gen-cluster-secrets.sh (no Vault path written yet); the
        # reconcile_superadmin() function skips gracefully in that case.
        - name: superadmin
          secret: { secretName: casdoor-superadmin, optional: true }
