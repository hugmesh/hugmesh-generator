apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: snapdragon-pki
resources:
  - deployment.yaml
  - service.yaml
# The "casdoor-google" Secret (clientId / clientSecret) is now materialized by
# External Secrets Operator from Vault (ClusterSecretStore "snapdragon-vault",
# remote path secret/snapdragon/casdoor) — see manifests/external-secrets.
# The offline/USB path (KEYS/vault/secrets.json) is created by keys-provision.
# The casdoor Deployment keeps its existing secretKeyRef usage unchanged.
