apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: snapdragon-pki
resources:
  - pg.yaml                    # external Postgres backing Casdoor (casdoor-pg)
  - app-conf-configmap.yaml    # Casdoor app.conf pointing at casdoor-pg
  - deployment.yaml
  - service.yaml
  - init-data-configmap.yaml   # declarative org/roles/service-users seed
  - init-job.yaml              # per-app OAuth2 apps + google provider + secrets
  - games-admin-sync-job.yaml  # materializes ROLE_GAMES_ADMIN = ROLE_GAMES ∩ (ROLE_ADMIN ∪ ROLE_MOD)
# The "casdoor-google" Secret (clientId / clientSecret) is now materialized by
# External Secrets Operator from Vault (ClusterSecretStore "snapdragon-vault",
# remote path secret/snapdragon/casdoor) — see manifests/external-secrets.
# The offline/USB path (KEYS/vault/secrets.json) is created by keys-provision.
# The casdoor Deployment keeps its existing secretKeyRef usage unchanged.
