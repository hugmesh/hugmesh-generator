# HashiCorp Vault — the cluster's secret store. External Secrets Operator (ESO)
# reads from this Vault (KV v2, mount "secret/", base path "hugmesh/") via the
# ClusterSecretStore "hugmesh-vault" and materializes the k8s Secrets the
# workloads consume. The mTLS PKI (pki_int, see manifests/vault-pki) and the
# planned etcd Transit-KMS both depend on this Vault, so it MUST survive restarts.
#
# PERSISTENT + AUTO-UNSEALING (no longer `server -dev`):
#   * Storage   : Raft integrated storage on a PVC carved from the cluster-default
#                 StorageClass "hugmesh-local" → the Raft data dir lands under
#                 the LUKS2 /mnt/data on the pki node, so Vault's at-rest store is
#                 encrypted by INHERITANCE (docs/ENCRYPTION-AT-REST.md layer 1/5).
#   * Config    : a real (non-dev) HCL server config (config.hcl ConfigMap) — Raft
#                 storage stanza + a TLS listener.
#   * TLS       : the listener serves HTTPS. An init container mints the server
#                 cert from the cluster CA (the `cluster-ca` Secret keys-provision
#                 seeds in this namespace from the USB KEYS stick), so it chains to
#                 the SAME anchor as the offline gen-keystores.sh truststore. If no
#                 cluster-ca Secret is mounted it self-signs a bootstrap cert (DEV).
#   * Unseal    : Raft uses Shamir seal. The unseal key + the bootstrap root token
#                 live ONLY on the offline USB-KEYS bundle (KEYS/vault/unseal-key +
#                 KEYS/vault/token), mirroring the cluster-CA / luks.key custody.
#                 keys-provision materializes them into the `vault-unseal` Secret;
#                 the `vault-unseal` SIDECAR runs `vault operator unseal` from the
#                 mounted key on every (re)start, so Vault comes back UNATTENDED
#                 after a restart. The one-time `vault operator init` is a documented
#                 operator step (keys-template/vault/README.md + docs/ENCRYPTION-AT-REST.md).
#
# Single control-plane cluster: multi-replica Raft HA has limited value (the pki
# Pi is the availability floor). Persistent + auto-unseal is the real fix (Vault
# now survives restart); multi-replica Raft HA is a DOCUMENTED follow-up.
# !!! Keep the unseal key + root token OFF git — only placeholders ship in the repo.
apiVersion: v1
kind: Namespace
metadata:
  name: vault
  labels: { app.kubernetes.io/part-of: hugmesh.net, hugmesh.net/tier: secrets }
---
# Real (non-dev) Vault server config: Raft integrated storage + a TLS listener.
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-config
  namespace: vault
  labels: { app: vault, app.kubernetes.io/part-of: hugmesh.net }
data:
  config.hcl: |
    ui = true

    # Raft integrated storage — persisted on the mounted PVC (/vault/data), which
    # the hugmesh-local StorageClass places under the LUKS2 /mnt/data on the
    # pki node (encrypted at rest by inheritance). node_id is stable so a restart
    # rejoins its own single-node Raft cluster from the on-disk state.
    storage "raft" {
      path    = "/vault/data"
      node_id = "vault-0"
    }

    # HTTPS listener. The init container writes tls.crt/tls.key (cluster-CA-signed,
    # else self-signed bootstrap) into the shared tmpfs /vault/tls before Vault
    # starts. Clients (ESO, vault-pki-init) trust it via the cluster CA bundle.
    listener "tcp" {
      address       = "0.0.0.0:8200"
      tls_cert_file = "/vault/tls/tls.crt"
      tls_key_file  = "/vault/tls/tls.key"
      tls_min_version = "tls12"
    }

    # api_addr/cluster_addr are required for Raft. Use the in-cluster Service DNS.
    api_addr     = "https://vault.vault.svc.cluster.local:8200"
    cluster_addr = "https://vault.vault.svc.cluster.local:8201"

    # disable_mlock: found during the first real bring-up of this tree that
    # `false` here never actually worked — CAP_IPC_LOCK, added via this
    # container's `capabilities.add`, does NOT reliably survive Kubernetes'
    # non-root + exec chain (Kubernetes only sets the Bounding/Effective/
    # Permitted/Inheritable capability sets, not Ambient — a documented K8s
    # limitation — so the capability is lost the moment docker-entrypoint.sh
    # execve()s the actual `vault` binary; a UID transition, e.g. the su-exec
    # step this manifest works around above, clears it even earlier). Vault
    # then hard-failed at startup with "Error initializing core: Failed to
    # lock memory: cannot allocate memory" — mlock() hitting the container's
    # default (tiny) RLIMIT_MEMLOCK with no capability to bypass it. Disabling
    # mlock here is HashiCorp's own documented/endorsed practice for exactly
    # this class of containerized, non-privileged deployment (see Vault's
    # docker-compose reference config and the official Helm chart, both of
    # which also plumb the same disable_mlock knob). Trade-off: Vault's
    # secret-holding memory pages are no longer guaranteed non-swappable.
    # Documented, not silently accepted — see the PR that introduced this
    # comment for the follow-up (grant the capability for real, e.g. via a
    # runtime/CRI configuration that sets Ambient capabilities, or accept the
    # swap-page exposure given this pki node already has no swap enabled by
    # keys-provision's own defaults).
    disable_mlock = true
---
# Bootstrap TLS material generator. Prefers the cluster CA (the `cluster-ca`
# Secret keys-provision seeds from the USB stick) so the Vault server cert chains
# to the existing truststore; falls back to a self-signed bootstrap cert when no
# cluster CA is mounted (DEV). Writes into the shared /vault/tls emptyDir (tmpfs).
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-tls-init
  namespace: vault
  labels: { app: vault, app.kubernetes.io/part-of: hugmesh.net }
data:
  gen-tls.sh: |
    #!/bin/sh
    set -eu
    SAN="DNS:vault,DNS:vault.vault,DNS:vault.vault.svc,DNS:vault.vault.svc.cluster.local,IP:127.0.0.1"
    CN="vault.vault.svc.cluster.local"
    umask 077
    EXT=/tmp/vault-ext.cnf
    printf 'subjectAltName=%s\nextendedKeyUsage=serverAuth\n' "${SAN}" > "${EXT}"
    if [ -s /ca/tls.crt ] && [ -s /ca/tls.key ]; then
      echo "==> signing Vault server cert with the cluster CA (chains to truststore)"
      openssl req -new -newkey rsa:4096 -nodes \
        -keyout /vault/tls/tls.key -subj "/CN=${CN}" \
        -addext "subjectAltName=${SAN}" -out /tmp/vault.csr
      # serial file goes to writable /tmp (the /ca mount is read-only).
      openssl x509 -req -in /tmp/vault.csr -CA /ca/tls.crt -CAkey /ca/tls.key \
        -CAserial /tmp/ca.srl -CAcreateserial -days 825 -sha384 \
        -extfile "${EXT}" -out /vault/tls/tls.crt
      # Publish the issuing CA next to the leaf so clients can build the chain.
      cp /ca/tls.crt /vault/tls/ca.crt
      rm -f /tmp/vault.csr
    else
      echo "WARN: no cluster-ca Secret mounted — self-signing a DEV bootstrap cert" >&2
      openssl req -x509 -newkey rsa:4096 -nodes -days 825 -sha384 \
        -keyout /vault/tls/tls.key -out /vault/tls/tls.crt \
        -subj "/CN=${CN}" -addext "subjectAltName=${SAN}"
      cp /vault/tls/tls.crt /vault/tls/ca.crt
    fi
    rm -f "${EXT}"
    chmod 0644 /vault/tls/tls.crt /vault/tls/ca.crt
    chmod 0600 /vault/tls/tls.key
    echo "==> Vault TLS material ready in /vault/tls"
---
# Auto-unseal sidecar. Watches the seal status and runs `vault operator unseal`
# with the Shamir key from the mounted `vault-unseal` Secret, so an unattended
# restart comes back unsealed. It NEVER initializes Vault (that is the documented
# one-time operator step) — it only unseals an already-initialized Vault.
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-unseal
  namespace: vault
  labels: { app: vault, app.kubernetes.io/part-of: hugmesh.net }
data:
  auto-unseal.sh: |
    #!/bin/sh
    # Loop: while Vault is sealed AND initialized, submit the unseal key. Tolerates
    # Vault not being up yet (rc!=0) and the not-yet-initialized window (init is the
    # one-time operator step). Idempotent — submitting the key when already unsealed
    # is a no-op.
    set -u
    export VAULT_ADDR="${VAULT_ADDR:-https://127.0.0.1:8200}"
    export VAULT_CACERT="${VAULT_CACERT:-/vault/tls/ca.crt}"
    KEY_FILE="/unseal/unseal-key"
    while true; do
      if [ ! -s "${KEY_FILE}" ]; then
        echo "[auto-unseal] no unseal key mounted yet ($KEY_FILE) — waiting"; sleep 5; continue
      fi
      status="$(vault status -format=json 2>/dev/null || true)"
      if [ -z "${status}" ]; then sleep 3; continue; fi
      initialized="$(printf '%s' "${status}" | grep -o '"initialized": *[a-z]*' | awk '{print $2}')"
      sealed="$(printf '%s' "${status}" | grep -o '"sealed": *[a-z]*' | awk '{print $2}')"
      if [ "${initialized}" = "false" ]; then
        echo "[auto-unseal] Vault not initialized — run the one-time 'vault operator init' (see README); waiting"
        sleep 10; continue
      fi
      if [ "${sealed}" = "true" ]; then
        echo "[auto-unseal] Vault sealed — submitting unseal key"
        vault operator unseal "$(cat "${KEY_FILE}")" >/dev/null 2>&1 \
          && echo "[auto-unseal] unseal submitted" || echo "[auto-unseal] unseal attempt failed (will retry)"
        sleep 3
      else
        sleep 15
      fi
    done
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vault
  namespace: vault
  labels: { app: vault, app.kubernetes.io/part-of: hugmesh.net }
spec:
  serviceName: vault
  replicas: 1   # single-node Raft; multi-replica HA is a documented follow-up
  selector:
    matchLabels: { app: vault }
  template:
    metadata:
      labels: { app: vault }
    spec:
      # Vault lives on the pki/control-plane node (the identity tier). Pin it
      # there and tolerate the control-plane taint so it schedules on it; every
      # other node reaches it via the cluster Service vault.vault.svc:8200 (ESO)
      # or the mesh name vault.<domain> (devices / online sync).
      nodeSelector:
        hugmesh.net/pki: "true"
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      securityContext:
        seLinuxOptions:
          type: container_t
          level: "s0:c70"
        fsGroup: 1000
      initContainers:
        # Generate the listener TLS material (cluster-CA-signed, else self-signed)
        # into the shared /vault/tls tmpfs BEFORE Vault starts.
        #
        # Image: NOT hashicorp/vault (found during the first real kind bring-up
        # of this tree) — that image ships only the `vault` binary, no shell
        # utilities beyond a minimal busybox `sh`, and critically NO `openssl`
        # binary at all. gen-tls.sh calls `openssl` in BOTH branches (the
        # cluster-CA-signed path and the DEV self-signed fallback), so every
        # run of this init container failed identically with "openssl: not
        # found" regardless of whether /ca was mounted. alpine/openssl is a
        # small (~14MB), actively published image whose only job is bundling a
        # real openssl(1) CLI on Alpine — verified present (`openssl version`
        # succeeds) before pinning here. Pinned by digest: the repo publishes
        # no versioned tags, only a rolling `latest`.
        - name: vault-tls-init
          image: alpine/openssl@sha256:a31e47e338dac84c48788c23bb003be27ed325b7a2185d359f22e3ba4e78bcab
          command: ["/bin/sh", "/scripts/gen-tls.sh"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
            # Match the `vault` container's uid/gid (below) so the tls.key
            # gen-tls.sh writes with `chmod 0600` (owner-only, deliberately —
            # least privilege beats loosening it to group-readable) is
            # actually READABLE by the process that needs it. Found during
            # the first real bring-up of this tree: once the vault container
            # stopped running as root (see its runAsUser comment), it got
            # "error loading TLS cert: open /vault/tls/tls.key: permission
            # denied" against a key this init container had left owned by
            # its own (different) default uid.
            runAsUser: 100
            runAsGroup: 1000
          volumeMounts:
            - { name: tls-init, mountPath: /scripts, readOnly: true }
            - { name: ca,       mountPath: /ca,      readOnly: true }
            - { name: tls,      mountPath: /vault/tls }
            - { name: tmp,      mountPath: /tmp }
      containers:
        - name: vault
          image: hashicorp/vault:1.21.4   # pinned to latest stable 1.x; evaluate the 2.x major separately
          # Real server (NOT -dev): in-memory storage + auto-unseal + the dev root
          # token are gone. Vault reads the Raft + TLS config from /vault/config.
          #
          # args is just ["server"] — NOT ["server", "-config=/vault/config/config.hcl"]
          # (found live on the kind bring-up: the latter CrashLoopBackOff'd every
          # single restart, including a freshly-recreated pod with a clean network
          # namespace, with "Error initializing listener of type tcp: listen tcp4
          # 0.0.0.0:8200: bind: address already in use" — deterministic, not a
          # restart race). Root cause: the official image's docker-entrypoint.sh
          # ALWAYS rewrites a bare `server` arg into
          #   vault server -config="$VAULT_CONFIG_DIR" -dev-root-token-id=... \
          #     -dev-listen-address=0.0.0.0:8200 "$@"
          # where VAULT_CONFIG_DIR=/vault/config and "$@" is whatever args this
          # manifest passed after `server`. Passing an explicit
          # -config=/vault/config/config.hcl here made Vault receive TWO -config
          # flags pointing at the same config.hcl (once via the auto-added
          # directory scan, once via the explicit file path), so the single
          # `listener "tcp"` stanza got registered twice in one process — the
          # second bind() on :8200 collided with the first. The ConfigMap mount
          # already puts config.hcl directly in /vault/config, so the
          # entrypoint's own auto-appended `-config=/vault/config` is sufficient;
          # passing it a second time is redundant and, per the above, actively
          # broken. Live-verified: with args trimmed to ["server"] alone, vault-0
          # starts clean with a single listener and reaches the readiness probe.
          args: ["server"]
          env:
            - name: VAULT_ADDR
              value: "https://127.0.0.1:8200"
            - name: VAULT_CACERT
              value: "/vault/tls/ca.crt"
            # Raft cluster address (advertised to itself; single node).
            - name: VAULT_API_ADDR
              value: "https://vault.vault.svc.cluster.local:8200"
            # The image's docker-entrypoint.sh setcap's the vault binary with
            # cap_ipc_lock=+ep on every start. That setcap SYSCALL itself
            # needs CAP_SETFCAP, which `capabilities: drop: [ALL]` below
            # deliberately doesn't grant — so, unfixed, every start hard-
            # failed with "unable to set CAP_SETFCAP effective capability:
            # Operation not permitted" and the pod CrashLoopBackOff'd before
            # Vault ever ran (found during the first real bring-up of this
            # tree). SKIP_SETCAP disables that step (moot anyway now that
            # config.hcl's disable_mlock=true no longer needs CAP_IPC_LOCK at
            # all — see that comment). SKIP_CHOWN silences the companion
            # (non-fatal) "Could not chown /vault/config" warning — that
            # ConfigMap-backed mount can never usefully be chowned anyway.
            - name: SKIP_SETCAP
              value: "true"
            - name: SKIP_CHOWN
              value: "true"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add: ["IPC_LOCK"]
              drop: ["ALL"]
            # Run AS the image's own `vault` user (uid 100/gid 1000 — gid
            # matches this pod's fsGroup above) directly, rather than as root.
            # docker-entrypoint.sh's LAST step (after the SKIP_CHOWN/
            # SKIP_SETCAP-gated ones above) is `if [ "$(id -u)" = '0' ]; then
            # set -- su-exec vault "$@"; fi` — with `capabilities: drop: [ALL]`
            # that su-exec's own setgroups()/setuid() calls need (CAP_SETGID/
            # CAP_SETUID) aren't available, so it failed with "su-exec:
            # setgroups: Operation not permitted" and the container exited
            # (found during the first real bring-up of this tree, immediately
            # after fixing the SKIP_SETCAP/SKIP_CHOWN issue above). Running as
            # uid 100 from the start makes that `id -u = 0` check false, so
            # entrypoint.sh skips su-exec entirely and just execs vault
            # directly — no privilege-drop capability needed at all.
            runAsUser: 100
            runAsGroup: 1000
          ports:
            - { name: https,   containerPort: 8200 }
            - { name: cluster, containerPort: 8201 }
          readinessProbe:
            # 200=unsealed+active, 429=unsealed+standby, 472/473=DR, 501=not-init,
            # 503=sealed. Treat unsealed-active as ready.
            httpGet: { path: /v1/sys/health, port: https, scheme: HTTPS }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            # Liveness only checks the process is serving; sealed is NOT unhealthy
            # (the sidecar unseals it), so accept any Vault HTTP response.
            httpGet:
              path: /v1/sys/health?standbyok=true&sealedcode=200&uninitcode=200
              port: https
              scheme: HTTPS
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: 500m, memory: 512Mi }
          volumeMounts:
            - { name: config, mountPath: /vault/config, readOnly: true }
            - { name: tls,    mountPath: /vault/tls,    readOnly: true }
            - { name: data,   mountPath: /vault/data }
        # Sidecar: auto-unseal from the USB-KEYS-seeded `vault-unseal` Secret.
        - name: vault-unseal
          image: hashicorp/vault:1.21.4
          command: ["/bin/sh", "/scripts/auto-unseal.sh"]
          env:
            - name: VAULT_ADDR
              value: "https://127.0.0.1:8200"
            - name: VAULT_CACERT
              value: "/vault/tls/ca.crt"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: unseal-script, mountPath: /scripts, readOnly: true }
            - { name: tls,           mountPath: /vault/tls, readOnly: true }
            # Shamir unseal key (key "unseal-key") from the offline USB bundle.
            # optional so the pod still starts pre-init; the sidecar waits.
            - { name: unseal,        mountPath: /unseal, readOnly: true }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits:   { cpu: 100m, memory: 64Mi }
      volumes:
        - name: config
          configMap: { name: vault-config }
        - name: tls-init
          configMap: { name: vault-tls-init, defaultMode: 0555 }
        - name: unseal-script
          configMap: { name: vault-unseal, defaultMode: 0555 }
        # cluster CA cert+key — provisioned OFFLINE by keys-provision from the USB
        # stick (certs/cluster-ca.*). optional so a dev stack can self-sign.
        - name: ca
          secret: { secretName: cluster-ca, optional: true }
        # Shamir unseal key — provisioned OFFLINE by keys-provision from the USB
        # stick (vault/unseal-key). optional so the pod starts before init.
        - name: unseal
          secret: { secretName: vault-unseal, optional: true }
        # tmpfs for the generated listener TLS material (never persisted to disk).
        - name: tls
          emptyDir:
            medium: Memory
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    # Raft integrated storage. hugmesh-local places it under the LUKS2
    # /mnt/data on the pki node → encrypted at rest by inheritance.
    - metadata:
        name: data
        labels: { app: vault }
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: hugmesh-local
        resources: { requests: { storage: 2Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: vault
  namespace: vault
  labels: { app: vault }
spec:
  selector: { app: vault }
  ports:
    # The API port is HTTPS now (clients use https:// + the cluster CA bundle).
    # 8201 is the Raft cluster port (intra-Vault; single node today).
    - { name: https,   port: 8200, targetPort: https }
    - { name: cluster, port: 8201, targetPort: cluster }
