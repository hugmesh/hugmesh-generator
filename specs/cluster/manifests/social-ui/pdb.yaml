# PodDisruptionBudgets for the social-ui federated remotes — ONE per remote
# Deployment (matrix-ui, mastodon-ui, login-ui, admin-ui), mirroring the way
# hpa.yaml carries one HPA per remote in a single file. Each remote runs an HPA
# with minReplicas: 2 (an HA pair), so a voluntary disruption (node drain /
# cluster upgrade) must never evict both pods of a remote at once. minAvailable: 1
# lets a drain take at most one pod while the second keeps serving.
#
# Shape mirrors the only other PDB in the repo (node-storage-placement/pdb.yaml):
# policy/v1, a single app-label selector, namespace inherited from this dir's
# kustomization (hugmesh-frontend). Purely additive — a PDB constrains only
# voluntary eviction, never scheduling or scale — so it cannot crash-loop or change
# steady-state behaviour.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: hugmesh-matrix-ui
  labels:
    app: hugmesh-matrix-ui
    app.kubernetes.io/part-of: hugmesh.systems
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: hugmesh-matrix-ui
---
