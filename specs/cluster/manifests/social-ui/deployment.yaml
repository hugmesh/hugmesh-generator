# Federated micro-frontend remotes — EACH on its own nginx (own repo + pod) in
# the hugmesh-frontend namespace, federated into the hugmesh.net host:
#   hugmesh-matrix-ui   (/social/matrix, /social/matrix/call)
#   hugmesh-mastodon-ui (/social/mastodon)
#   hugmesh-login-ui    (/login)
#   hugmesh-admin-ui    (/admin, /admin/usage, /admin/namespaces — admin role)
# Repos: github.com/hugmesh/hugmesh-{matrix,mastodon,login,admin}-ui
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: hugmesh-matrix-ui, namespace: hugmesh-frontend, labels: { app: hugmesh-matrix-ui, app.kubernetes.io/part-of: hugmesh.net } }
spec:
  # replicas is deliberately UNSET: the HorizontalPodAutoscaler below owns it.
  # Pinning it here made ArgoCD and the HPA fight forever — the HPA scaled to
  # minReplicas, ArgoCD saw drift and wrote it back, round and round. Measured
  # 2026-08-22 on kind: seven Deployments at generation ~950-964 after 38h,
  # one rewrite every ~2.4 minutes, and the Applications never left OutOfSync.
  selector: { matchLabels: { app: hugmesh-matrix-ui } }
  template:
    metadata: { labels: { app: hugmesh-matrix-ui } }
    spec:
      nodeSelector: { hugmesh.net/frontend: "true" }
      securityContext:
        seLinuxOptions:
          type: container_t
          level: "s0:c41"
      containers:
        - name: web
          image: hugmesh/matrix-ui:dev
          ports: [{ name: http, containerPort: 80 }]
          # Games origin for the chat3d (Shadows of the Net) iframe — the value
          # chat3d-bridge.ts's GAMES_BASE_URL reads as `__HUG_GAMES_URL__`, stated
          # HERE so the choice is explicit in the manifest instead of left to the
          # app's built-in default (hugmesh-generator#470). It must equal the
          # `games` host route of apps/20-gateway-be.yaml; tests/scripts/
          # cluster_manifest_integrity.py [games-origin] fails when it is absent
          # or differs while apps/50-games.yaml is present. A custom GAMES_DOMAIN
          # is rewritten by parameterize_games_domain() in the stage4 builders,
          # the same way as that route's host.
          # NOT YET READ: the matrix-ui image does not turn this env into the
          # window global (its only entrypoint hook is 50-hug-theme.sh), and the
          # global is read from the host page, so the app still uses its default
          # (the same host) until an image-side consumer exists.
          env:
            - { name: HUG_GAMES_URL, value: "https://games.hugmesh.net" }
          resources: { requests: { cpu: 50m, memory: 96Mi }, limits: { cpu: 300m, memory: 192Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: hugmesh-matrix-ui, namespace: hugmesh-frontend }
spec: { selector: { app: hugmesh-matrix-ui }, ports: [{ name: http, port: 80, targetPort: http }] }
