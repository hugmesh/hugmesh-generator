spec:
  replicas: 1
  selector: { matchLabels: { app: snapdragon-mastodon-ui } }
  template:
    metadata: { labels: { app: snapdragon-mastodon-ui } }
    spec:
      nodeSelector: { snapdragon.systems/frontend: "true" }
      securityContext:
        seLinuxOptions:
          type: container_t
          level: "s0:c42"
      containers:
        - name: web
          image: snapdragon-systems/mastodon-ui:dev
          ports: [{ name: http, containerPort: 80 }]
          resources: { requests: { cpu: 50m, memory: 96Mi }, limits: { cpu: 300m, memory: 192Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: snapdragon-mastodon-ui, namespace: snapdragon-frontend }
spec: { selector: { app: snapdragon-mastodon-ui }, ports: [{ name: http, port: 80, targetPort: http }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: snapdragon-login-ui, namespace: snapdragon-frontend, labels: { app: snapdragon-login-ui, app.kubernetes.io/part-of: snapdragon.systems } }
spec:
  replicas: 1
  selector: { matchLabels: { app: snapdragon-login-ui } }
  template:
    metadata: { labels: { app: snapdragon-login-ui } }
    spec:
      nodeSelector: { snapdragon.systems/frontend: "true" }
      securityContext:
        seLinuxOptions:
          type: container_t
          level: "s0:c43"
      containers:
        - name: web
          image: snapdragon-systems/login-ui:dev
          ports: [{ name: http, containerPort: 80 }]
          # Without this, the login-ui nginx entrypoint (40-snap-config.sh)
          # defaults window.__SNAP_OIDC_ENABLED__ to false, so session.service.ts's
          # post-login hydrate() (the GET /bff/session re-read that syncs real
          # Casdoor roles into the visible session) never fires — the exact
          # "nav bar broken for every role" bug found+fixed on the compose stack
          # (auth-core#29/admin-bff-api#197/login-ui#51; compose.local.yaml sets
          # this same var). Never independently verified against a real cluster.
          env:
            - { name: SNAP_OIDC_ENABLED, value: "true" }
            # Runtime login theme: already-derived --sd-* css text the entrypoint
            # (50-snap-theme.sh) writes to snap-theme.css at container start.
            # OPTIONAL by design — no `login-theme` ConfigMap (the unbranded
            # default) means the env is simply absent and the image's compiled
            # :root fallback renders the shipped brand. Produce the ConfigMap with
            #   scripts/tooling/derive-theme.py --brand-yaml brands/<b>.yaml --configmap
            # then apply + restart to rebrand; delete + restart to revert. Never a
            # rebuild: rebrand-without-rebuild is the point of the env channel.
            - name: SNAP_THEME_CSS
              valueFrom:
                configMapKeyRef:
                  name: login-theme
                  key: SNAP_THEME_CSS
                  optional: true
          resources: { requests: { cpu: 50m, memory: 96Mi }, limits: { cpu: 300m, memory: 192Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: snapdragon-login-ui, namespace: snapdragon-frontend }
spec: { selector: { app: snapdragon-login-ui }, ports: [{ name: http, port: 80, targetPort: http }] }
