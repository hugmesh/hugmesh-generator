apiVersion: apps/v1
kind: Deployment
metadata: { name: hugmesh-login-ui, namespace: hugmesh-frontend, labels: { app: hugmesh-login-ui, app.kubernetes.io/part-of: hugmesh.net } }
spec:
  # replicas is deliberately UNSET: the HorizontalPodAutoscaler below owns it.
  # Pinning it here made ArgoCD and the HPA fight forever — the HPA scaled to
  # minReplicas, ArgoCD saw drift and wrote it back, round and round. Measured
  # 2026-08-22 on kind: seven Deployments at generation ~950-964 after 38h,
  # one rewrite every ~2.4 minutes, and the Applications never left OutOfSync.
  selector: { matchLabels: { app: hugmesh-login-ui } }
  template:
    metadata: { labels: { app: hugmesh-login-ui } }
    spec:
      nodeSelector: { hugmesh.net/frontend: "true" }
      securityContext:
        seLinuxOptions:
          type: container_t
          level: "s0:c43"
      containers:
        - name: web
          image: hugmesh/login-ui:dev
          ports: [{ name: http, containerPort: 80 }]
          # Without this, the login-ui nginx entrypoint (40-snap-config.sh)
          # defaults window.__SNAP_OIDC_ENABLED__ to false, so session.service.ts's
          # post-login hydrate() (the GET /bff/session re-read that syncs real
          # Casdoor roles into the visible session) never fires — the exact
          # "nav bar broken for every role" bug found+fixed on the compose stack
          # (auth-core#29/admin-bff-api#197/login-ui#51; compose.local.yaml sets
          # this same var). Never independently verified against a real cluster.
          env:
            - { name: SNAP_OIDC_ENABLED, value: "true" }
            # Runtime login theme: already-derived css text the entrypoint
            # (50-snap-theme.sh) writes to snap-theme.css at container start.
            # OPTIONAL by design — no `login-theme` ConfigMap (the unbranded
            # default) means the env is simply absent and the image's compiled
            # :root fallback renders the shipped brand. Produce the ConfigMap with
            #   scripts/tooling/derive-theme.py --brand-yaml brands/<b>.yaml --configmap
            # then apply + restart to rebrand; delete + restart to revert. Never a
            # rebuild: rebrand-without-rebuild is the point of the env channel.
            #
            # TWO refs, one value. derive-theme.py now emits the data key
            # HUG_THEME_CSS; a ConfigMap produced before that rename carries
            # SNAP_THEME_CSS. `optional: true` means a MISSING KEY is skipped, not
            # an error — so a stale ConfigMap would otherwise resolve NEITHER ref,
            # the pod would start clean, and the hook would write a zero-byte
            # stylesheet: themed yesterday, unthemed today, no event, no log. Both
            # refs together make either vintage work. The hook prefers
            # $HUG_THEME_CSS and falls back to $SNAP_THEME_CSS, so when a
            # hand-made ConfigMap somehow carries both, the new key wins.
            # DELETE the legacy ref once no pre-rename login-theme ConfigMap can
            # still be applied anywhere.
            - name: HUG_THEME_CSS
              valueFrom:
                configMapKeyRef:
                  name: login-theme
                  key: HUG_THEME_CSS
                  optional: true
            - name: SNAP_THEME_CSS
              valueFrom:
                configMapKeyRef:
                  name: login-theme
                  key: SNAP_THEME_CSS
                  optional: true
          resources: { requests: { cpu: 50m, memory: 96Mi }, limits: { cpu: 300m, memory: 192Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: hugmesh-login-ui, namespace: hugmesh-frontend }
spec: { selector: { app: hugmesh-login-ui }, ports: [{ name: http, port: 80, targetPort: http }] }
