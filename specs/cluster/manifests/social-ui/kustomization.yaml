apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: snapdragon-frontend
resources:
  - deployment.yaml
  - hpa.yaml
  - pdb.yaml

# First-party images now pull from the in-cluster Harbor container registry
# (registry.snapdragon.systems = inherited from GitLab's chart hosts.domain default, kept as-is; now served by Harbor (apps/03a-harbor.yaml), project
# path = <group>/<repo>). The CI in each repo pushes :<branch> + :<sha>; we track
# the moving :main here for dev. Pulls need the harbor-registry imagePullSecret
# (ESO-materialized, see manifests/external-secrets).
images:
  - { name: snapdragon-systems/matrix-ui,    newName: registry.snapdragon.systems/snapdragon/snapdragon-matrix-ui,    newTag: main }
  - { name: snapdragon-systems/mastodon-ui,  newName: registry.snapdragon.systems/snapdragon/snapdragon-mastodon-ui,  newTag: main }
  - { name: snapdragon-systems/login-ui,     newName: registry.snapdragon.systems/snapdragon/snapdragon-login-ui,     newTag: main }
  - { name: snapdragon-systems/admin-ui,     newName: registry.snapdragon.systems/snapdragon/snapdragon-admin-ui,     newTag: main }
patches:
  - target: { kind: Deployment }
    patch: |
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: harbor-registry
