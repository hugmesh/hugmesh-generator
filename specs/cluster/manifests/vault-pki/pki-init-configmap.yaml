# Vault PKI bootstrap script. Run by the vault-pki-init Job (hashicorp/vault
# image → the `vault` CLI is on PATH). Idempotent: safe to re-run / re-sync under
# ArgoCD. Enables an intermediate PKI engine chained to the SAME cluster CA that
# gen-keystores.sh produced (certs/cluster-ca.{crt,key}) — so certs Vault issues
# validate against the existing truststore (kube-system/hugmesh-truststore +
# the per-service truststores), and creates one issuing role per Java app.
#
# The cluster CA cert+key are mounted at /ca (tls.crt/tls.key) from the k8s
# Secret "cluster-ca" in the vault namespace, provisioned OFFLINE by
# keys-provision from the USB KEYS stick (certs/cluster-ca.*). The CA key NEVER
# lives in git — only on the pki USB and inside Vault after this import.
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-pki-init
  namespace: vault
  labels: { app.kubernetes.io/part-of: hugmesh.systems, snapdragon.systems/tier: secrets }
data:
  init-pki.sh: |
    #!/bin/sh
    set -eu
    # Vault serves HTTPS (persistent + TLS). VAULT_CACERT (the cluster CA) is set
    # by the Job env so `vault` validates the listener cert. VAULT_TOKEN comes from
    # the vault-bootstrap Secret (the init/root or a scoped token); the persistent
    # Vault has NO static dev "root" token, so there is no insecure default here.
    export VAULT_ADDR="${VAULT_ADDR:-https://vault.vault.svc.cluster.local:8200}"
    export VAULT_TOKEN="${VAULT_TOKEN:-}"
    DOMAIN="${CLUSTER_DOMAIN:-hugmesh.systems}"
    PKI="pki_int"

    # ── Crypto agility knobs (override via the Job env) ────────────────
    # Centralised so the brand/operator tunes the issued-cert strength in one
    # place; kept in lockstep with scripts/gen-keystores.sh (see
    # docs/CRYPTO-AUDIT.md). Defaults are the strongest Vault + the JVM/openssl
    # truststore validate interoperably TODAY:
    #   PKI_KEY_TYPE  rsa | ec   — leaf/role key family.
    #   PKI_KEY_BITS  RSA modulus (rsa) 4096 [was 2048], or curve size (ec) 384.
    #   PKI_SIG_BITS  X.509 signature digest size: 384 => SHA-384 (sha384With…
    #                 RSA / ecdsa-with-SHA384). SHA-3 cert signatures are not yet
    #                 portable to the SunRsaSign JCA provider, so they remain a
    #                 documented migration path, not the default.
    PKI_KEY_TYPE="${PKI_KEY_TYPE:-rsa}"
    PKI_KEY_BITS="${PKI_KEY_BITS:-4096}"
    PKI_SIG_BITS="${PKI_SIG_BITS:-384}"

    echo "==> waiting for Vault at ${VAULT_ADDR}"
    i=0
    until vault status >/dev/null 2>&1 || [ $? -eq 2 ]; do   # rc 2 = sealed-but-up
      i=$((i+1)); [ "$i" -gt 60 ] && { echo "vault not reachable"; exit 1; }
      sleep 3
    done

    # 1) Enable the intermediate PKI engine (idempotent).
    if ! vault secrets list -format=json | grep -q "\"${PKI}/\""; then
      echo "==> enabling ${PKI} (max-lease-ttl 5y)"
      vault secrets enable -path="${PKI}" -max-lease-ttl=43800h pki
    else
      echo "==> ${PKI} already enabled"
    fi

    # 2) Configure ${PKI}'s signing CA (idempotent — skip if already set).
    #    PROD: import the cluster CA (cert+key) so issued certs chain to the
    #    trust anchor already in the truststores. DEV: if no cluster CA Secret is
    #    mounted, self-generate an internal root so issuance works out of the box
    #    (ESO publishes ca.crt from issuing_ca, so peers still trust each other).
    if vault read "${PKI}/cert/ca" >/dev/null 2>&1 \
       && [ -n "$(vault read -field=certificate "${PKI}/cert/ca" 2>/dev/null)" ]; then
      echo "==> ${PKI} CA already configured"
    elif [ -s /ca/tls.crt ] && [ -s /ca/tls.key ]; then
      echo "==> importing cluster CA into ${PKI} (chains to the existing truststore)"
      cat /ca/tls.key /ca/tls.crt > /tmp/ca-bundle.pem
      vault write "${PKI}/config/ca" pem_bundle=@/tmp/ca-bundle.pem
      rm -f /tmp/ca-bundle.pem
    else
      echo "WARN: no 'cluster-ca' Secret mounted — self-generating an internal ${PKI} root (DEV)." >&2
      echo "      For production, provision the cluster CA from the USB KEYS stick so issued" >&2
      echo "      certs chain to the same anchor as the offline gen-keystores.sh truststore." >&2
      vault write "${PKI}/root/generate/internal" \
        common_name="${BRAND:-hugmesh} Vault Intermediate CA" ttl=43800h \
        key_type="${PKI_KEY_TYPE}" key_bits="${PKI_KEY_BITS}" signature_bits="${PKI_SIG_BITS}" >/dev/null
    fi

    vault write "${PKI}/config/urls" \
      issuing_certificates="${VAULT_ADDR}/v1/${PKI}/ca" \
      crl_distribution_points="${VAULT_ADDR}/v1/${PKI}/crl"

    # 3) One issuing role per machine-user (matches gen-keystores.sh SERVICES +
    #    docs/SECURITY.md identity matrix). serverAuth+clientAuth for
    #    cross-namespace mTLS.
    #
    #    ── WHAT A ROLE MUST ALLOW, AND WHY IT IS SPELLED OUT PER ENTRY ──────
    #    Vault validates the common_name AND every DNS SAN against
    #    allowed_domains (builtin/logical/pki/issuing.ValidateNames):
    #      allow_bare_domains  -> EqualFold(name, entry)          exact match
    #      allow_subdomains    -> HasSuffix(name, "."+entry)      ANY prefix depth
    #      allow_glob_domains  -> only when the entry CONTAINS '*'
    #    Every ESO generator in manifests/external-secrets asks for the SAME
    #    three-name shape as the workload's Kubernetes Service DNS:
    #      <service>            <service>.<namespace>            <service>.<namespace>.svc.cluster.local
    #    The middle, TWO-LABEL form matched NOTHING under the old flat
    #    "${app},${app}.svc.cluster.local,svc.cluster.local,${DOMAIN}" list —
    #    `svc.cluster.local` + allow_subdomains covers *.svc.cluster.local only —
    #    so EVERY generic-loop app 400'd on issuance:
    #      "subject alternate name hugmesh-user-bff-api.hugmesh-backend not
    #       allowed by this role"
    #    and no keystore initContainer ever received material. Each entry below
    #    therefore carries the workload's real <service>.<namespace> identity and
    #    the role allows exactly those three names — nothing else.
    #
    #    TIGHTNESS TRADEOFF. The obvious repair (leave the blanket entries and
    #    bolt on a wildcard) is what created the bug's blast radius in the first
    #    place: `svc.cluster.local` + allow_subdomains let ANY app role mint a
    #    cert for ANY Service in the cluster — hugmesh-user-bff-api's role could
    #    issue `hugmesh-be-gateway.hugmesh-backend.svc.cluster.local` or
    #    `vault.vault.svc.cluster.local` and walk straight through the mesh's
    #    peer verification; `${DOMAIN}` + allow_subdomains did the same for every
    #    public *.hugmesh.systems host including registry.hugmesh.systems. Both
    #    blankets are gone. Named entries + allow_bare_domains give exact-match
    #    semantics, so subdomains/globs/wildcards/IP-SANs are all switched OFF
    #    explicitly (they are Vault's defaults for the first three, but a PKI role
    #    should not depend on a default staying put). Cost: adding a new SAN
    #    means adding it here — which is the point, and
    #    tests/scripts/test-pki-role-san-coverage.sh fails the pipeline naming
    #    the exact (role, SAN) pair the day the two sides drift apart.
    #
    #    Entry format is "<role>:<service>.<namespace>". The role name is the
    #    path the ExternalSecret calls (pki_int/issue/<role>); the service+
    #    namespace pair is the workload's real cluster identity. They are NOT
    #    always the same word — media-poisoner's role is `media-poisoner` while
    #    its Service is `hugmesh-media-poisoner` — and assuming they were is why
    #    that role used to need a hand-patched copy of this block outside the
    #    loop. Carrying both explicitly folds it back in.
    #
    #    akkoma-proxy / tuwunel-proxy = the homeserver mTLS PROXY sidecars
    #    (manifests/akkoma|tuwunel) — SERVER certs (the be-gateway/mod-bff/
    #    admin-bff present THEIR existing client certs to these). They are NOT
    #    hugmesh-* prefixed: they front the non-JVM homeservers.
    #    *-db = the per-DB Postgres SERVER certs (DB-hardening PR-C1, SHIPS DARK).
    #    Same server_flag+client_flag role shape so the issued cert supports EITHER
    #    server-only TLS or full mutual TLS when enablement (PR-C2) lands; the cert
    #    is only mounted on disk today (Deployment volume) — Postgres is NOT started
    #    with ssl=on yet. See docs/POSTGRES-HARDENING.md:138-145.
    #    media-poisoner = the worker's OWN in-process mTLS identity
    #    (manifests/media-poisoner; app/serve.py terminates TLS itself, no sidecar).
    #    server_flag+client_flag so the same cert can serve AND (future) present a
    #    client identity; the worker enforces ssl.CERT_REQUIRED against ca.crt.
    for entry in hugmesh-pki-gateway:hugmesh-pki-gateway.hugmesh-pki \
                 hugmesh-superadmin-gateway:hugmesh-superadmin-gateway.hugmesh-pki \
                 hugmesh-be-gateway:hugmesh-be-gateway.hugmesh-backend \
                 hugmesh-fe-gateway:hugmesh-fe-gateway.hugmesh-frontend \
                 hugmesh-api:hugmesh-api.hugmesh-backend \
                 hugmesh-admin-bff-api:hugmesh-admin-bff-api.hugmesh-backend \
                 hugmesh-mod-bff-api:hugmesh-mod-bff-api.hugmesh-backend \
                 hugmesh-user-bff-api:hugmesh-user-bff-api.hugmesh-backend \
                 hugmesh-forum-bff-api:hugmesh-forum-bff-api.hugmesh-backend \
                 hugmesh-wiki-bff-api:hugmesh-wiki-bff-api.hugmesh-backend \
                 hugmesh-mesh-bff-api:hugmesh-mesh-bff-api.hugmesh-backend \
                 hugmesh-character-forge-bff-api:hugmesh-character-forge-bff-api.hugmesh-backend \
                 hugmesh-federation-api:hugmesh-federation-api.hugmesh-backend \
                 route-access-db:route-access-db.hugmesh-pki \
                 admin-bff-db:admin-bff-db.hugmesh-backend \
                 mod-bff-db:mod-bff-db.hugmesh-backend \
                 user-bff-db:user-bff-db.hugmesh-backend \
                 federation-db:federation-db.hugmesh-backend \
                 forum-bff-db:forum-bff-db.hugmesh-backend \
                 wiki-bff-db:wiki-bff-db.hugmesh-backend \
                 mesh-bff-db:mesh-bff-db.hugmesh-backend \
                 character-forge-bff-db:character-forge-bff-db.hugmesh-backend \
                 akkoma-proxy:akkoma-proxy.hugmesh-backend \
                 tuwunel-proxy:tuwunel-proxy.hugmesh-backend \
                 media-poisoner:hugmesh-media-poisoner.hugmesh-backend; do
      role="${entry%%:*}"          # Vault role name  (pki_int/issue/<role>)
      svc_ns="${entry#*:}"         # <service>.<namespace>
      svc="${svc_ns%%.*}"          # bare Service name
      echo "==> role ${PKI}/roles/${role}"
      vault write "${PKI}/roles/${role}" \
        allowed_domains="${svc},${svc_ns},${svc_ns}.svc.cluster.local" \
        allow_bare_domains=true allow_subdomains=false allow_glob_domains=false \
        allow_any_name=false allow_localhost=false allow_ip_sans=false \
        allow_wildcard_certificates=false enforce_hostnames=true \
        server_flag=true client_flag=true \
        key_type="${PKI_KEY_TYPE}" key_bits="${PKI_KEY_BITS}" signature_bits="${PKI_SIG_BITS}" \
        max_ttl=2160h ttl=720h
    done

    # harbor = the Harbor registry's expose.tls server cert (manifests/harbor via
    # apps/03a-harbor.yaml) — the chart's bundled nginx front-end terminates TLS
    # with it. This is the ONE role that genuinely cannot fold into the loop
    # above: it is not one <service>.<namespace> identity but THREE names of
    # different kinds — the placeholder Service `harbor`, the Helm chart's real
    # Service `harbor-core`, and the PUBLIC ingress host registry.${DOMAIN}
    # (apps/03a-harbor.yaml expose.ingress.hosts.core + externalURL). Squeezing
    # that into the entry format would mean re-introducing a wildcard, which is
    # exactly the widening this change removes — so it stays explicit here, and
    # the SAN-coverage gate checks it identically to every looped role.
    echo "==> role ${PKI}/roles/harbor"
    vault write "${PKI}/roles/harbor" \
      allowed_domains="harbor,harbor.hugmesh-pki,harbor.hugmesh-pki.svc.cluster.local,harbor-core,harbor-core.hugmesh-pki,harbor-core.hugmesh-pki.svc.cluster.local,registry.${DOMAIN}" \
      allow_bare_domains=true allow_subdomains=false allow_glob_domains=false \
      allow_any_name=false allow_localhost=false allow_ip_sans=false \
      allow_wildcard_certificates=false enforce_hostnames=true \
      server_flag=true client_flag=true \
      key_type="${PKI_KEY_TYPE}" key_bits="${PKI_KEY_BITS}" signature_bits="${PKI_SIG_BITS}" \
      max_ttl=2160h ttl=720h

    echo "==> Vault PKI bootstrap complete"
