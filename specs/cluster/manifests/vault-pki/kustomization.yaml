apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: vault
resources:
  - pki-init-configmap.yaml
  - pki-init-job.yaml
# Bootstraps the Vault intermediate PKI engine + per-app issuing roles. The
# cluster CA (cert+key) is delivered as the "cluster-ca" Secret in the vault
# namespace by keys-provision (from the USB KEYS stick) — never committed here.
# The per-app TLS Secrets that consumers mount are then materialized by ESO from
# pki_int/issue/<app> (manifests/external-secrets/pki-externalsecrets.yaml).
