# lan-dns — CoreDNS bound to the backend ingress node's :53 (udp+tcp) on the LAN.
#
# Mirrors the public ingress (apps/10-ingress-nginx.yaml) for placement: it runs
# hostNetwork pinned to the SAME backend node the home router points clients/80/443
# at, so *.<domain> resolves to exactly the node where ingress-nginx listens. The
# hardened securityContext mirrors the siblings (route-access/deployment.yaml):
# seLinuxOptions + runAsNonRoot + drop ALL caps; it ADDS only NET_BIND_SERVICE so
# CoreDNS may bind the privileged port 53.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lan-dns
  namespace: kube-system
  labels:
    app.kubernetes.io/name: lan-dns
    app.kubernetes.io/part-of: hugmesh.systems
spec:
  replicas: 1
  strategy: { type: Recreate }   # single host-port binder per node
  selector:
    matchLabels: { app.kubernetes.io/name: lan-dns }
  template:
    metadata:
      labels: { app.kubernetes.io/name: lan-dns }
    spec:
      # Land on the backend node — the router's 80/443 target, so the IP this
      # resolver hands out is the IP where ingress-nginx already listens.
      nodeSelector:
        hugmesh.systems/backend: "true"
      # Bind the node's :53 directly and resolve upstream via the host resolver.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seLinuxOptions:
          # c20 collided with analytics/kafka; lan-dns->c57 (free).
          type: container_t
          level: "s0:c57"
      containers:
        - name: coredns
          image: registry.k8s.io/coredns/coredns:v1.11.3
          args: ["-conf", "/etc/coredns/Corefile"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]   # required to bind port 53 (<1024)
          ports:
            - { name: dns,     containerPort: 53, hostPort: 53, protocol: UDP }
            - { name: dns-tcp, containerPort: 53, hostPort: 53, protocol: TCP }
            - { name: metrics, containerPort: 9153, protocol: TCP }
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /ready, port: 8181 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 200m, memory: 128Mi }
          volumeMounts:
            - { name: config, mountPath: /etc/coredns, readOnly: true }
      volumes:
        - name: config
          configMap:
            name: lan-dns-corefile
            items:
              - { key: Corefile, path: Corefile }
