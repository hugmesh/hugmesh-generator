apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# lan-dns — the in-cluster wildcard DNS resolver that closes the LAN-resolution
# gap. NODES already get /etc/hosts (provision_hosts); this serves LAN CLIENTS
# (browsers, the e2e runner) so they can resolve id./api./matrix./mastodon./apex
# of the brand domain to the backend ingress node IP. Runs hostNetwork on the
# backend node (the router's 80/443 target) and binds host :53 (udp+tcp).
#
# Authoritative ONLY for the brand domain; everything else is forwarded upstream.
# Deployed only in ENV=test images (the build prunes apps/09-lan-dns.yaml in prod,
# where public DNS is authoritative instead).
namespace: kube-system
resources:
  - configmap.yaml
  - deployment.yaml
  - service.yaml
