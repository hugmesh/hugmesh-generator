apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# ─────────────────────────── GATED / SHIPS DARK ───────────────────────────────
# Isolated overlay for the tier-wide default-deny EGRESS policy (tier-egress.yaml,
# CLUSTER-HARDENING-PLAN §B). It lives in its OWN kustomization + its OWN MANUAL-sync
# ArgoCD app (apps/08a-networkpolicy-egress.yaml) so it NEVER shares resource ownership
# with the auto-sync ingress app (apps/08-networkpolicy.yaml) and NEVER auto-applies.
#
# resources: is INTENTIONALLY EMPTY by default. With nothing listed, this overlay
# renders to ZERO objects — `kubectl apply -k` is a no-op and the 08a ArgoCD app stays
# permanently Synced/empty. This is the inert-until-enabled state.
#
# TO ENABLE (only after LIVE on-cluster validation, ONE namespace at a time):
#   ⚠ DO NOT uncomment a `../networkpolicy/tier-egress.yaml` line here. This header used
#   to say to, and it cannot render: kustomize's default load restrictor refuses a FILE
#   outside this directory ("security; file '.../networkpolicy/tier-egress.yaml' is not
#   in or below '.../networkpolicy-egress'"), so the manual-sync app would sit in a
#   ComparisonError at the moment the step was followed. The file also carries all five
#   tiers, which is the opposite of one-at-a-time. tests/scripts/test-netpol-egress-scope.sh
#   reproduces the error with the real kubectl and pins the replacement below.
#   1. Carve ONE namespace into a file INSIDE this directory:
#        scripts/netpol-egress-scope.py <namespace> [--with-db-egress]
#      (--list prints the namespaces; backend and pki also take the per-DB-pod DNS locks
#      from db-egress.yaml with --with-db-egress.) Order, preconditions, smoke tests and
#      rollback per namespace, `devops` LAST: docs/DB-HARDENING-RUNBOOK.md part C.
#   2. List the generated file(s) under `resources:` below, commit, merge.
#   3. Manually sync apps/08a-networkpolicy-egress.yaml (it has NO `automated:` block).
#   4. Smoke-test that namespace's egress (DNS, DB, Vault, ArgoCD reconcile) before
#      proceeding to the next namespace. ROLLBACK = remove the line + manual sync (egress
#      policies pruned -> egress fully open again).
resources: []
