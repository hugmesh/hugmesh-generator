# casdoor-domain ExternalSecrets — ESO materialization of the per-domain
# Casdoor's credentials from Vault (ClusterSecretStore "hugmesh-vault").
#
# VAULT PATH CONVENTION (docs/PHASE5-DECISIONS.md decision #3: base segment ==
# brand slug): a domain's IdP credentials live under secret/<slug>/casdoor —
# ONE KV document with three properties (db_password_plain / admin_password /
# app_client_secret), mirroring the secret/hugmesh/casdoor-games exemplar. The
# remoteRef keys below carry the PLACEHOLDER hugmesh/casdoor-domain and are
# ALWAYS patched to <slug>/casdoor by the casdoor-domains ApplicationSet
# (specs/cluster/apps: 05b-casdoor-domains.yaml).
#
# DELIBERATELY NOT SEEDED by scripts/gen-cluster-secrets.sh: a per-domain path
# cannot exist before the domain does. It is minted at DOMAIN-CREATION time —
# by the operator, or by the DomainReconciler runtime lane once it lands
# (docs/DOMAIN-IDP.md) — which is why tests/scripts/eso_seed_contract.py
# classifies hugmesh/casdoor-domain under OPERATOR_SEEDED_PATHS. Until the path
# is written, these ExternalSecrets sit unsynced and the casdoor-domain pods
# stay pending on their Secret mounts — fail-closed, loud, and per-domain.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: casdoor-domain-db
  labels: { app: casdoor-domain, app.kubernetes.io/part-of: hugmesh.net }
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: hugmesh-vault
    kind: ClusterSecretStore
  target:
    name: casdoor-domain-db
    creationPolicy: Owner
    template:
      data:
        # Fixed DB role name (matches pg.yaml's POSTGRES_DB/probe user); only
        # the password is per-domain material.
        username: "casdoor"
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: hugmesh/casdoor-domain
        property: db_password_plain
---
# Admin login the casdoor-domain-init Job uses to drive the per-domain Casdoor
# API (and the value it SETS as the built-in admin's password, replacing the
# publicly known casdoor bootstrap default — see init-job.yaml).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: casdoor-domain-admin
  labels: { app: casdoor-domain, app.kubernetes.io/part-of: hugmesh.net }
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: hugmesh-vault
    kind: ClusterSecretStore
  target:
    name: casdoor-domain-admin
    creationPolicy: Owner
    template:
      data:
        username: "admin"
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: hugmesh/casdoor-domain
        property: admin_password
---
# The domain OAuth2 application's client secret (the confidential half of
# CASDOOR_CLIENT_ID in casdoor-domain-params) — injected into the application
# object by the init Job, never committed, never a ConfigMap literal.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: casdoor-domain-app
  labels: { app: casdoor-domain, app.kubernetes.io/part-of: hugmesh.net }
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: hugmesh-vault
    kind: ClusterSecretStore
  target:
    name: casdoor-domain-app
    creationPolicy: Owner
    template:
      data:
        clientSecret: "{{ .clientSecret }}"
  data:
    - secretKey: clientSecret
      remoteRef:
        key: hugmesh/casdoor-domain
        property: app_client_secret
