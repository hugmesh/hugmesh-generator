# casdoor-domain app.conf TEMPLATE — points a domain's own Casdoor (issue #47,
# Domain.idp=own) at its dedicated Postgres (casdoor-domain-pg) and carries the
# per-domain issuer. Rendered into the real conf/app.conf by the "render-app-conf"
# initContainer in deployment.yaml (a literal awk replacement of the __TOKEN__
# placeholders below; the DB user and password are percent-encoded into the
# postgres:// URL by the renderer): DB user/password from the ESO Secret casdoor-domain-db, the
# issuer from CASDOOR_ORIGIN (<- the casdoor-domain-params ConfigMap, patched per
# domain by the casdoor-domains ApplicationSet). NO secrets here.
#
# NOTE: casbin/casdoor does NOT expand beego's "${ENV||default}" syntax inside a
# value (beego expands it only when the WHOLE value is one such expression), so the
# earlier `user=${CASDOOR_DB_USER||casdoor} ...` dataSourceName could never connect:
# both pinned images exit 2 with `pq: password authentication failed for user
# "${CASDOOR_DB_USER||...}"` (measured on casdoor-games 2026-11-05; the systems Casdoor
# had the same fix in #263). `origin` is rendered the same way rather than relying on
# the whole-value expansion, so no app.conf key here depends on in-app interpolation.
# tests/scripts/test-games-two-realms.sh refuses a `${` in any Casdoor dataSourceName.
apiVersion: v1
kind: ConfigMap
metadata:
  name: casdoor-domain-app-conf
  labels: { app: casdoor-domain, app.kubernetes.io/part-of: hugmesh.net }
data:
  app.conf.template: |
    appname = casdoor
    httpport = 8000
    runmode = prod
    copyrequestbody = true
    SessionOn = true
    # Dedicated Postgres (casdoor-domain-pg, db "casdoor"). For the postgres
    # driver Casdoor uses the dataSourceName verbatim (it only appends dbName for
    # MySQL), so dbname= must be set inline here. Credentials rendered in by the
    # initContainer (ESO Secret casdoor-domain-db).
    driverName = postgres
    dataSourceName = "postgres://__CASDOOR_DB_USER__:__CASDOOR_DB_PASSWORD__@casdoor-domain-pg:5432/casdoor?sslmode=disable"
    dbName = casdoor
    tableNamePrefix =
    showSql = false
    redisEndpoint =
    isCloudIntranet = false
    authState = "casdoor"
    socks5Proxy = ""
    verificationCodeTimeout = 10
    initScore = 0
    logPostOnly = true
    # Public issuer (OIDC `iss` origin) of THIS domain's realm — rendered by the
    # initContainer from CASDOOR_ORIGIN (<- casdoor-domain-params, patched to
    # https://id.<clusterDomain> per domain). The compose.brand-b.yaml contract:
    # issuer = the PUBLISHED URL; in-network consumers fetch JWKS from the
    # Service URL. The placeholder params-configmap value is https://id.hugmesh.net.
    origin = "__CASDOOR_ORIGIN__"
    enableGzip = true
    # ── NO declarative seed — DELIBERATE (differs from casdoor/casdoor-games) ─
    # A static init_data.json would be per-domain CONTENT baked into this shared
    # base. initDataFile is left EMPTY so object/init_data.go's InitFromFile()
    # returns immediately (the documented opt-in: an empty key = no import), and
    # the env-driven casdoor-domain-init Job (init-job.yaml) is the ONLY seeder —
    # it creates the org/application from CASDOOR_ORG/CASDOOR_APP_NAME env and
    # verifies every write by re-reading it.
    initDataFile =
