# Persistent storage for the hugmesh-forum-bff-api Postgres data directory
# (the forum_user_role / forum_action tables).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: forum-bff-db
  namespace: hugmesh-backend
  labels: { app: forum-bff-db }
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: hugmesh-local
  resources: { requests: { storage: 2Gi } }
