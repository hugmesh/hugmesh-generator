# namespace-and-netpol.yaml — the GENERIC in-cluster app-image Kaniko build namespace +
# its default-deny ingress NetworkPolicy. Modeled 1:1 on the proven #110 service-catalog
# builder (manifests/service-catalog-builder/namespace-and-netpol.yaml).
#
# This is the IN-CLUSTER replacement for the `.gitlab-ci.yml` `build:images` ECHO STUB:
# app images (gateway, frontends, BFFs, …) historically built only in the GitLab org
# mirror; this namespace is where the generic Kaniko build Job (kaniko-build-job.template.yaml)
# runs to build a first-party app image from its repo and push it to the in-cluster Harbor
# registry (registry.snapdragon.systems; see apps/03a-harbor.yaml).
#
# ArgoCD-managed (listed in kustomization.yaml) ONLY when the opt-in
# apps-optional/60-image-builder.yaml Application is enabled. The per-build Job is a TEMPLATE
# (not in the kustomization) — it ships dark, exactly like #110.
---
apiVersion: v1
kind: Namespace
metadata:
  name: snapdragon-image-builds
  labels:
    kubernetes.io/metadata.name: snapdragon-image-builds
    app.kubernetes.io/part-of: snapdragon.systems
    # Pod Security Standards: restricted — rootless Kaniko complies (no privileged,
    # runAsNonRoot, drop ALL caps), so the namespace enforces the strictest tier.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
# Build pods serve NOTHING — no other workload should reach them. Default-deny INGRESS
# (egress to the in-cluster registry + DNS + the source git remote is left open, matching
# the #110 builder and the other tier policies in networkpolicy/tier-ingress.yaml). Only
# Ingress is constrained; an empty ingress: [] denies all.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: image-builds-deny-ingress
  namespace: snapdragon-image-builds
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress: []
