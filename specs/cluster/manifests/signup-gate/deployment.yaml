# signup-gate — the Casdoor PRE-SIGNUP confusable/uniqueness gate (thin
# reverse-proxy). See proxy-configmap.yaml for the full rationale + flow. Runs in
# hugmesh-pki next to Casdoor; the gateways route self-signup POSTs here, it
# checks the federation username-availability endpoint, rejects collisions, and
# transparently forwards everything else to casdoor:8000.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: signup-gate
  namespace: hugmesh-pki
  labels: { app: signup-gate, app.kubernetes.io/part-of: hugmesh.net }
spec:
  replicas: 2
  selector: { matchLabels: { app: signup-gate } }
  template:
    metadata: { labels: { app: signup-gate } }
    spec:
      nodeSelector: { hugmesh.net/pki: "true" }
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
        seLinuxOptions:
          # Fresh MCS level in the pki range (casdoor c21, headscale c34/c35,
          # vault c14/c70 are taken) — signup-gate takes c36.
          type: container_t
          level: "s0:c36"
      containers:
        - name: proxy
          image: python:3.12-alpine
          command: ["python3", "/app/proxy.py"]
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - { name: LISTEN_PORT, value: "8080" }
            - name: CASDOOR_URL
              value: "http://casdoor.hugmesh-pki.svc.cluster.local:8000"
            # federation availability endpoint (INTERNAL/ROLE_SERVICE). Called
            # cross-namespace pki->backend; the homeserver-isolation/tier policies
            # must admit signup-gate to federation-api:8080 (see README).
            - name: FEDERATION_URL
              value: "https://hugmesh-federation-api.hugmesh-backend.svc.cluster.local:8080"
            - { name: CASDOOR_ORG, value: "hugmesh" }
            # client-credentials SERVICE identity (app-signup-gate / ROLE_SERVICE).
            - name: CASDOOR_CLIENT_ID
              valueFrom: { secretKeyRef: { name: signup-gate-casdoor, key: clientId } }
            - name: CASDOOR_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: signup-gate-casdoor, key: clientSecret } }
            # webhook shared-secret (optional; the post-signup reconcile backstop).
            - name: WEBHOOK_SHARED_SECRET
              valueFrom: { secretKeyRef: { name: signup-gate-webhook, key: secret, optional: true } }
            # FAIL-CLOSED confusable gate (reject when the check is unreachable).
            - { name: AVAILABILITY_FAIL_OPEN, value: "false" }
            - { name: AVAILABILITY_TIMEOUT_SECONDS, value: "3" }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 500m, memory: 192Mi }
          volumeMounts:
            - { name: app, mountPath: /app, readOnly: true }
      volumes:
        - name: app
          configMap: { name: signup-gate-proxy, defaultMode: 0555 }
---
apiVersion: v1
kind: Service
metadata:
  name: signup-gate
  namespace: hugmesh-pki
  labels: { app: signup-gate, app.kubernetes.io/part-of: hugmesh.net }
spec:
  selector: { app: signup-gate }
  ports:
    - { name: http, port: 8000, targetPort: http }
