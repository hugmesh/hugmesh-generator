apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: snapdragon-pki
resources:
  - proxy-configmap.yaml   # the stdlib reverse-proxy + webhook backstop (proxy.py)
  - deployment.yaml        # Deployment + Service (signup-gate:8000 -> casdoor)
# The "signup-gate-casdoor" Secret (clientId/clientSecret for app-signup-gate) is
# materialized by External Secrets Operator from Vault (ClusterSecretStore
# "snapdragon-vault", remote path secret/snapdragon/casdoor-apps property
# signup-gate) — see manifests/external-secrets/secretstore.yaml. The optional
# "signup-gate-webhook" Secret (post-signup reconcile shared-secret) likewise.
