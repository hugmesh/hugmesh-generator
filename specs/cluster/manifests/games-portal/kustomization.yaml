apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hugmesh-games
# Reached from manifests/games/kustomization.yaml, so it deploys and prunes with the
# games slug. Harbor path = <group>/<repo>/<image>, the names hugmesh-games' release
# workflow publishes on GHCR.
resources:
  - deployment.yaml
  - service.yaml
  - ingress.yaml
images:
  - { name: hugmesh/games-portal, newName: registry.hugmesh.net/hugmesh/hugmesh-games/frontend, newTag: main }
