# Services for hugmesh-games-portal.
#
# THE NAMES BELOW ARE THE PORTAL'S OWN UPSTREAMS. frontend/nginx.conf in hugmesh-games
# hard-codes `proxy_pass http://<name>:8080`, and nginx resolves every upstream at
# startup: one unresolvable name and it exits with `host not found in upstream`
# (measured: the portal's nginx.conf fails `nginx -t` without them and boots with
# them). Keeping the names resolvable lets the image run its own nginx.conf, with its
# security headers and rate limits, instead of a copy of it in a ConfigMap that would
# drift.
#
# `api` is the games BFF. Every other Service selects a workload that does not exist
# yet, so it has no endpoints and that location answers 502 or 503 rather than taking
# the portal down. Adding the Deployment later, with the label already named here,
# needs no change to this file.
apiVersion: v1
kind: Service
metadata:
  name: hugmesh-games-portal
  namespace: hugmesh-games
  labels: { app: hugmesh-games-portal, app.kubernetes.io/part-of: hugmesh.games }
spec:
  selector: { app: hugmesh-games-portal }
  ports: [{ name: http, port: 8080, targetPort: http }]
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: hugmesh-games
  labels: { app.kubernetes.io/component: games-portal-upstream, app.kubernetes.io/part-of: hugmesh.games }
spec:
  selector: { app: hugmesh-games }
  ports: [{ name: http, port: 8080, targetPort: http }]
