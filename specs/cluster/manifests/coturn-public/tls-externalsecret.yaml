# coturn-tls — Vault-PKI-issued SERVER cert for the turns: (5349) listener,
# CN turn.hugmesh.systems (rebrand_sysroot rewrites the domain). Same
# VaultDynamicSecret -> ExternalSecret -> kubernetes.io/tls pattern as
# tuwunel-proxy-mtls (external-secrets/tuwunel-externalsecrets.yaml); requires
# the `coturn` issuing role in the Vault PKI loop
# (manifests/vault-pki/pki-init-configmap.yaml — allow_subdomains on the brand
# domain covers turn.<domain>).
#
# Ships ONLY with the coturn-public overlay, so certs are minted only when the
# operator has opted in. The base Deployment mounts the target Secret
# optional:true and appends cert=/pkey= only when the files exist — absent
# Secret = no TLS listener config, byte-equivalent dark behaviour.
#
# TRUST: this cert chains to the per-domain cluster CA (Vault PKI), which the
# fleet's own images/truststores trust. Arbitrary public browsers do NOT — for
# an internet-facing turns: endpoint the operator replaces Secret coturn-tls
# with an ACME/public cert (ADDITIVE, never replacing the offline CA — the
# platform's standing ACME stance, specs/cluster/README.md).
#
# mtls-issuance: not-delivered coturn is a DEFAULT-OFF runtime-only optional service (optional-services.yaml slug `coturn`; apps/13a-optional-services.yaml lists it as installed:"false" with path specs/cluster/manifests/coturn — the BASE, which does not contain this file). PUBLIC reachability is a separate opt-in that repoints that element at manifests/coturn-public, and only then is this generator rendered at all — docs/COTURN.md §5. The `coturn` pki_int role DOES exist, so this issues the moment the operator repoints; until then no ExternalSecret for it is expected in the cluster.
apiVersion: generators.external-secrets.io/v1alpha1
kind: VaultDynamicSecret
metadata:
  name: coturn-tls
  namespace: hugmesh-backend
  labels:
    app.kubernetes.io/name: coturn
    app.kubernetes.io/part-of: hugmesh.systems
    snapdragon.systems/optional-service: coturn
spec:
  path: pki_int/issue/coturn
  method: POST
  parameters:
    common_name: turn.hugmesh.systems
    alt_names: coturn,coturn.hugmesh-backend.svc.cluster.local
    ttl: "720h"
  resultType: Data
  provider:
    server: https://vault.vault.svc.cluster.local:8200
    caProvider: { type: Secret, name: vault-ca, key: ca.crt }
    auth:
      tokenSecretRef: { name: vault-token, key: token }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: coturn-tls
  namespace: hugmesh-backend
  labels:
    app.kubernetes.io/name: coturn
    app.kubernetes.io/part-of: hugmesh.systems
    snapdragon.systems/optional-service: coturn
spec:
  refreshInterval: 168h
  target:
    name: coturn-tls
    creationPolicy: Owner
    template:
      type: kubernetes.io/tls
      data:
        tls.crt: "{{ .certificate }}"
        tls.key: "{{ .private_key }}"
        ca.crt: "{{ .issuing_ca }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: VaultDynamicSecret
          name: coturn-tls
