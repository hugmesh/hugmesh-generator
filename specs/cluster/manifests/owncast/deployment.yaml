# Owncast + owncast-bff-api + owncast-ui — GPU-gated x86 optional service.
# All three containers share one Deployment so the BFF and UI co-locate with
# the Owncast process on the GPU node (amd64 + hugmesh.net/compute=gpu).
# owncast data directory is emptyDir for dev; swap to a PV for persistent state.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hugmesh-owncast
  namespace: hugmesh-owncast
  labels:
    app: hugmesh-owncast
    app.kubernetes.io/part-of: hugmesh.net
spec:
  replicas: 1
  selector: { matchLabels: { app: hugmesh-owncast } }
  template:
    metadata: { labels: { app: hugmesh-owncast } }
    spec:
      # GPU-gated: require the x86_64 GPU worker (labelled by keys-provision).
      nodeSelector:
        kubernetes.io/arch: amd64
        hugmesh.net/compute: gpu
      securityContext:
        seLinuxOptions:
          # c34 was a 3-way collision (casdoor-games-pg keeps c34); owncast->c39.
          type: container_t
          level: "s0:c39"
      containers:
        # ── owncast — HLS live-streaming server ──────────────────────────────────
        - name: owncast
          image: owncast/owncast
          ports:
            - { name: http,  containerPort: 8080, protocol: TCP }
            - { name: rtmp,  containerPort: 1935, protocol: TCP }
          env:
            - { name: DATA_DIRECTORY, value: /app/data }
          resources:
            requests: { cpu: 500m,  memory: 512Mi }
            limits:   { cpu: "2",   memory: 2Gi }
          volumeMounts:
            - { name: owncast-data, mountPath: /app/data }
          securityContext:
            seccompProfile: { type: RuntimeDefault }

        # ── owncast-bff-api — Spring Boot resource server (JWT validation) ───────
        - name: owncast-bff-api
          image: hugmesh/owncast-bff-api
          ports:
            - { name: bff-http, containerPort: 8080, protocol: TCP }
          env:
            # Systems-realm Casdoor (NOT casdoor-games): the signing keys come from
            # CASDOOR_JWKS_URI below; this value is the `iss` claim only.
            # WAS http://casdoor.hugmesh-casdoor.svc.cluster.local:8000, which is
            # wrong twice over: there has never been a `hugmesh-casdoor` namespace
            # (casdoor runs in hugmesh-pki), and issuer-uri is not just a discovery
            # address — Spring Security "configure[s] the validation strategy to
            # validate each JWTs iss claim against" it, and casdoor's app.conf sets
            # `origin = "https://id.hugmesh.net"`, so that IS the iss every token
            # carries. Same value every other first-party BFF uses.
            - { name: CASDOOR_ISSUER_URI, value: "https://id.hugmesh.net" }
            # Key fetch stays IN-CLUSTER: the public issuer host need not resolve
            # here (on kind it does not: hugmesh-generator#693). Same value as the
            # gateway chart's casdoor.jwksUri. This pod lives OUTSIDE hugmesh-backend,
            # so networkpolicy/casdoor-jwks-ingress.yaml admits it to casdoor:8000;
            # pinned by tests/scripts/test-bff-jwks-in-cluster.sh.
            - { name: CASDOOR_JWKS_URI, value: "http://casdoor.hugmesh-pki.svc.cluster.local:8000/.well-known/jwks" }
            - { name: SPRING_R2DBC_URL,
                value: "r2dbc:postgresql://hugmesh-owncast-db.hugmesh-owncast.svc.cluster.local:5432/owncast_bff" }
            # Liquibase's JDBC handle, used once at startup. Its packaged default is
            # owncast-bff-db in the DELETED hugmesh-backend namespace; only the
            # R2DBC half had ever been overridden here.
            - { name: SPRING_LIQUIBASE_URL,
                value: "jdbc:postgresql://hugmesh-owncast-db.hugmesh-owncast.svc.cluster.local:5432/owncast_bff" }
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits:   { cpu: "1",  memory: 512Mi }
          securityContext:
            seccompProfile: { type: RuntimeDefault }

        # ── owncast-ui — Angular remote micro-frontend ────────────────────────────
        - name: owncast-ui
          image: hugmesh/owncast-ui
          ports:
            - { name: ui-http, containerPort: 8080, protocol: TCP }
          resources:
            requests: { cpu: 50m,  memory: 64Mi }
            limits:   { cpu: 200m, memory: 128Mi }
          securityContext:
            seccompProfile: { type: RuntimeDefault }

      volumes:
        - name: owncast-data
          emptyDir: {}   # dev default; replace with a PVC for persistent streams

---
# ── Services ─────────────────────────────────────────────────────────────────
# Three ClusterIP Services: owncast-bff (BFF on 8080), owncast-ui (UI on 8080),
# and owncast itself (HTTP 8080 + RTMP 1935 for the ingest endpoint).

apiVersion: v1
kind: Service
metadata:
  name: hugmesh-owncast-bff-api
  namespace: hugmesh-owncast
spec:
  selector: { app: hugmesh-owncast }
  ports:
    - { name: http, port: 8080, targetPort: bff-http }
---
apiVersion: v1
kind: Service
metadata:
  name: hugmesh-owncast-ui
  namespace: hugmesh-owncast
spec:
  selector: { app: hugmesh-owncast }
  ports:
    - { name: http, port: 8080, targetPort: ui-http }
---
apiVersion: v1
kind: Service
metadata:
  name: hugmesh-owncast
  namespace: hugmesh-owncast
spec:
  selector: { app: hugmesh-owncast }
  ports:
    - { name: http, port: 8080, targetPort: http }
    - { name: rtmp, port: 1935, targetPort: rtmp }
