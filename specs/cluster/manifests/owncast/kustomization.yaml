apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: snapdragon-owncast
resources:
  - namespace.yaml
  - deployment.yaml

images:
  - { name: owncast/owncast, newName: owncast/owncast, newTag: latest }
  - { name: snapdragon-systems/owncast-bff-api, newName: registry.snapdragon.systems/snapdragon/snapdragon-owncast-bff-api, newTag: main }
  - { name: snapdragon-systems/owncast-ui, newName: registry.snapdragon.systems/snapdragon/snapdragon-owncast-ui, newTag: main }
