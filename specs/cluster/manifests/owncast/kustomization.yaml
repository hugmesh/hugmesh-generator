apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hugmesh-owncast
resources:
  - namespace.yaml
  - deployment.yaml
  # Operator DECISION 34a (2026-09-17): one backing-service-endpoints ConfigMap
  # PER NAMESPACE + the fan-out writer's resourceNames-closed grant. It ships from
  # HERE, not from the always-on manifests/backing-service-endpoints/, because
  # hugmesh-owncast only exists when this optional service is installed.
  - backing-service-endpoints.yaml

images:
  # Upstream image: a release tag AND its index digest, never :latest. The tag is the readable
  # name, the digest is what the runtime resolves (kustomize renders name:tag@sha256:...).
  # Re-pin by resolving the new tag's index digest from the registry, changing both together;
  # tests/scripts/cluster_manifest_integrity.py [image-pin] refuses latest, a floating tag or
  # a missing/malformed digest on a third-party image.
  - { name: owncast/owncast, newName: owncast/owncast, newTag: 0.3.0, digest: sha256:0f35b568b1098d2badbde2dbf3c73a902009c95eb687c647edea04d6da079a78 }
  - { name: hugmesh/owncast-bff-api, newName: registry.hugmesh.net/hugmesh/hugmesh-owncast-bff-api, newTag: main }
  - { name: hugmesh/owncast-ui, newName: registry.hugmesh.net/hugmesh/hugmesh-owncast-ui, newTag: main }

# ── THE IDENTITY PROVIDER THIS SERVICE TRUSTS (issue #530) ──────────────────────
# ArgoCD serves this directory from GIT, never from the device's baked tree, so
# rewrite_idp_sysroot()'s sed over the baked manifests/ copy cannot reach it. The
# issuer/JWKS move HERE, at render time, the way the Vault base does (#285). The
# idp-trust ConfigMap is local-config: kustomize never emits it, it is only the
# value surface. Its platform.hugmesh.net/idp-* annotations are set by a one-line
# JSON-6902 op in apps/52-owncast.yaml, which IS baked, so
# rewrite_idp_sysroot() re-points that op at the external IdP for --idp != casdoor,
# and `replacements` copies it onto the env below. At the casdoor defaults this
# block is a byte no-op. Pinned by tests/scripts/test-eso-remoteref-brand.sh (7).
configMapGenerator:
  - name: idp-trust
    options:
      disableNameSuffixHash: true
      annotations:
        config.kubernetes.io/local-config: "true"
        platform.hugmesh.net/idp-issuer: "https://id.hugmesh.net"
        platform.hugmesh.net/idp-jwks: "http://casdoor.hugmesh-pki.svc.cluster.local:8000/.well-known/jwks"
replacements:
  - source: { version: v1, kind: ConfigMap, name: idp-trust, fieldPath: "metadata.annotations.[platform.hugmesh.net/idp-issuer]" }
    targets:
      - select: { group: apps, kind: Deployment, name: hugmesh-owncast }
        fieldPaths:
          - spec.template.spec.containers.[name=owncast-bff-api].env.[name=CASDOOR_ISSUER_URI].value
  - source: { version: v1, kind: ConfigMap, name: idp-trust, fieldPath: "metadata.annotations.[platform.hugmesh.net/idp-jwks]" }
    targets:
      - select: { group: apps, kind: Deployment, name: hugmesh-owncast }
        fieldPaths:
          - spec.template.spec.containers.[name=owncast-bff-api].env.[name=CASDOOR_JWKS_URI].value
