# hugmesh-api-docs — the API documentation Angular micro-frontend remote. Its
# own nginx (own repo + pod) in the hugmesh-frontend namespace, federated into
# the hugmesh.net host: it serves a remoteEntry.json the host's
# loadRemoteModule consumes, mounted at /apidocs (admin role — the rendered
# OpenAPI/spec docs are gated to ROLE_ADMIN, matching federation's spec floor).
# Repo: github.com/hugmesh/hugmesh-api-docs
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: hugmesh-api-docs, namespace: hugmesh-frontend, labels: { app: hugmesh-api-docs, app.kubernetes.io/part-of: hugmesh.net } }
spec:
  # replicas is deliberately UNSET: the HorizontalPodAutoscaler below owns it.
  # Pinning it here made ArgoCD and the HPA fight forever — the HPA scaled to
  # minReplicas, ArgoCD saw drift and wrote it back, round and round. Measured
  # 2026-08-22 on kind: seven Deployments at generation ~950-964 after 38h,
  # one rewrite every ~2.4 minutes, and the Applications never left OutOfSync.
  selector: { matchLabels: { app: hugmesh-api-docs } }
  template:
    metadata: { labels: { app: hugmesh-api-docs } }
    spec:
      nodeSelector: { hugmesh.net/frontend: "true" }
      securityContext:
        seLinuxOptions:
          type: container_t
          level: "s0:c48"
      containers:
        - name: web
          image: hugmesh/api-docs:dev
          ports: [{ name: http, containerPort: 80 }]
          resources: { requests: { cpu: 50m, memory: 96Mi }, limits: { cpu: 300m, memory: 192Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: hugmesh-api-docs, namespace: hugmesh-frontend }
spec: { selector: { app: hugmesh-api-docs }, ports: [{ name: http, port: 80, targetPort: http }] }
