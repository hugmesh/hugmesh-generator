# hugmesh-edge-ai-analysis — the TASK-ORIENTED analysis API in front of the raw
# edge-AI model server. A small stateless FastAPI wrapper that turns Ollama's
# OpenAI-compatible model API into structured "analysis" verdicts the mesh consumes:
#   POST /v1/analyze/image/classify   — NSFW/abuse/policy classification (llava vision)
#   POST /v1/analyze/image/hash       — perceptual hash (pHash/aHash/dHash; CPU, no GPU)
#   POST /v1/analyze/content/moderate — classify + hash + policy → allow|flag|reject (fail-closed)
#   POST /v1/analyze/log/summarize    — log/anomaly triage (llama reasoning)
# It calls the edge-ai Ollama ClusterIP upstream in-cluster; it does NOT need the GPU
# itself (pHash is CPU; inference is delegated upstream), so it has no nodeSelector/
# runtimeClass and schedules anywhere. ON-PREM: nothing leaves the mesh.
#
# DEFAULT-OFF optional slug `edge-ai-analysis` (dependsOn: edge-ai) — deployed only
# when explicitly selected, so a default edge-ai node never schedules this (its image
# is a separate build artifact; see image/). Source lives in image/ (FastAPI app).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hugmesh-edge-ai-analysis
  namespace: hugmesh-inference
  labels:
    app: hugmesh-edge-ai-analysis
    app.kubernetes.io/part-of: hugmesh.net
spec:
  replicas: 1
  selector: { matchLabels: { app: hugmesh-edge-ai-analysis } }
  template:
    metadata: { labels: { app: hugmesh-edge-ai-analysis } }
    spec:
      securityContext:
        seLinuxOptions:
          # Unique MCS level (edge-ai=c73); edge-ai-analysis -> c87.
          #
          # WAS c49 — CORRECTED 2026-08-26. c49 was NOT free: docs/SECURITY.md §3 had
          # RESERVED it (with SA `sa-service-catalog-ui`) for the superadmin
          # service-catalog-ui, whose Deployment had not been written yet, and the
          # matrix row said so in words — "*(reserved)*" — rather than by any
          # mechanical marker. This file's "next free" scan read the LIVE manifests,
          # where nothing carried c49, and took it. The [mcs] uniqueness gate could
          # not see the clash either, because a reservation with no Deployment is not
          # a workload. It surfaced the instant that Deployment was added
          # (manifests/superadmin-service-catalog-ui/deployment.yaml) and the gate
          # reported c49 claimed by two workloads.
          #
          # THIS workload moved rather than the console, for two reasons: the console's
          # category is the one docs/SECURITY.md pins by name, and this one is a
          # DEFAULT-OFF stateless pod with emptyDir volumes only — no category-labelled
          # PV to relabel, so the move costs a pod restart and nothing else. The matrix
          # in docs/SECURITY.md now carries a row for this service, which is the actual
          # fix: it was absent from the table, which is why the reservation was
          # invisible to whoever picked c49 here.
          type: container_t
          level: "s0:c87"
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: analysis
          # Built from image/ (FastAPI + httpx + Pillow + imagehash). Remapped to the
          # registry by kustomization.yaml. Until the image is built + pushed, keep this
          # slug deselected (DEFAULT-OFF) so no node tries to pull it.
          image: hugmesh/edge-ai-analysis
          ports:
            - { name: http, containerPort: 8080, protocol: TCP }
          env:
            # The raw edge-AI model server (Ollama, same namespace).
            - { name: EDGE_AI_UPSTREAM, value: "http://hugmesh-edge-ai.hugmesh-inference.svc.cluster.local:11434" }
            # task->model map + policy thresholds (the analysis config surface).
            - { name: ANALYSIS_VISION_MODEL,  valueFrom: { configMapKeyRef: { name: edge-ai-analysis, key: vision-model } } }
            - { name: ANALYSIS_REASON_MODEL,  valueFrom: { configMapKeyRef: { name: edge-ai-analysis, key: reason-model } } }
            - { name: ANALYSIS_NSFW_THRESHOLD,  valueFrom: { configMapKeyRef: { name: edge-ai-analysis, key: nsfw-threshold } } }
            - { name: ANALYSIS_ABUSE_THRESHOLD, valueFrom: { configMapKeyRef: { name: edge-ai-analysis, key: abuse-threshold } } }
            # fail-closed: a policy hit on moderate -> "reject" (block); set "flag" to
            # only queue for human review without auto-blocking.
            - { name: ANALYSIS_MODERATE_ACTION, valueFrom: { configMapKeyRef: { name: edge-ai-analysis, key: moderate-action } } }
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits:   { cpu: "1",  memory: 512Mi }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 15
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        # writable scratch for uvicorn/Pillow under the read-only rootfs
        - name: tmp
          emptyDir: {}
