# node-storage-migrate — the EXPLICIT, operator-confirmed rebalance/migration Job STUB.
#
# Rebalancing a RUNNING stateful service off one node-pinned pool onto another is NEVER
# silent auto-migration: the mesh only RECOMMENDS a move (capacity pressure / a degraded
# pool); the operator confirms, and THIS Job performs the safe sequence with EXPLICIT
# downtime:
#
#   1. scale the service to 0 (quiesce writes — the PVC is RWO, so the new PV cannot bind
#      while the old pod holds it);
#   2. rsync the old PV's data -> the new node-pinned PV (both mounted into this Job, which
#      is itself pinned to the relevant node(s));
#   3. re-point: the operator flips the assignment in the admin UI (revoke old pool + assign
#      the new pool), which the 13b ApplicationSet realises as the new nodeAffinity + PVC;
#   4. scale the service back up on the new node.
#
# This is a STUB: the concrete source/target PVC names + node pins + the service to scale are
# templated per migration by the operator/BFF render. It ships INERT (suspend: true, zero
# parallelism) and is NEVER created automatically — an operator applies a rendered copy. It
# scopes node-pinned storage to REPLACEABLE data; for un-backed primary databases the UI
# already WARNS at assign time (admin-ui PR3).
apiVersion: batch/v1
kind: Job
metadata:
  name: PLACEHOLDER_SERVICE_NAME-storage-migrate   # <- rendered per migration
  labels:
    app.kubernetes.io/part-of: snapdragon.systems
    snapdragon.systems/node-storage-migrate: "true"
  annotations:
    snapdragon.systems/node-storage-note: >-
      EXPLICIT downtime migration. Scale the service to 0 BEFORE applying (the RWO PVC
      cannot rebind otherwise). The mesh only RECOMMENDS; the operator confirms + applies.
spec:
  # Ships INERT: suspended + never auto-run. The operator un-suspends a rendered copy.
  suspend: true
  backoffLimit: 0
  template:
    metadata:
      labels: { app.kubernetes.io/part-of: snapdragon.systems }
    spec:
      restartPolicy: Never
      # Pin the migrate Job to the SOURCE pool's node so the source PV is local (the target
      # PV's node is reached over the rsync if cross-node, or both are local for a same-node
      # pool swap). Rendered per migration.
      nodeSelector:
        snapdragon.systems/local-path: "true"
        kubernetes.io/hostname: PLACEHOLDER_SOURCE_NODE   # <- rendered
      securityContext:
        seLinuxOptions:
          type: spc_t
      containers:
        - name: migrate
          image: alpine:3.20            # rsync available via `apk add rsync` at run, or a baked image
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              echo "node-storage-migrate STUB: scale-0 must already be done (RWO PVC)."
              echo "rsync -aHAX --numeric-ids /src/ /dst/   # both PVs mounted below"
              # The real migration un-comments the rsync; the operator confirms data parity,
              # then re-points the assignment (revoke old pool + assign new) in the admin UI,
              # which the 13b ApplicationSet realises, then scales the service back up.
              echo "STUB no-op (suspend:true). See docs/NODE-STORAGE.md 'Rebalancing'."
          volumeMounts:
            - { name: src, mountPath: /src }
            - { name: dst, mountPath: /dst }
      volumes:
        # Source = the current node-pinned PVC; dest = the new pool's PVC. Rendered per
        # migration (the operator creates the dest PVC first via the new assignment).
        - name: src
          persistentVolumeClaim: { claimName: PLACEHOLDER_SOURCE_PVC }   # <- rendered
        - name: dst
          persistentVolumeClaim: { claimName: PLACEHOLDER_DEST_PVC }     # <- rendered
