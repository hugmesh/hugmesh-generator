# node-storage-placement — the generic Kustomize overlay each ACTIVE storage_service_assignment
# Application (apps/13b-node-storage.yaml) sources. Per-assignment values arrive as
# commonAnnotations from the ApplicationSet template (storage-assignment-id, storage-service,
# storage-pvc, storage-node, storage-requested-gi).
#
# It produces TWO things for the assigned service:
#   1. a PVC (pvc.yaml) bound to the node-pinned local-path StorageClass (hugmesh-local) —
#      WaitForFirstConsumer + the per-node nodePathMap entry (node-agent PR6) bind it on the
#      pool's node, so the PV lands where the disk physically is (PV-BINDS-TO-CORRECT-NODE);
#   2. a nodeAffinity patch (placement-patch.yaml) pinning the service's pod to that node, so
#      the pod schedules where the disk + PV are.
#
# A revoke drops the assignment from the 13b list -> ArgoCD prunes THIS Application -> the PVC
# + the nodeAffinity patch are reverted (the operator must scale a stateful service to zero
# first; PR8 provides the rsync migration Job + PDB for the safe path).
#
# NOTE: the patch target (the Deployment/StatefulSet name + the PVC name) is resolved at
# render time from the assignment's service/pvc annotations. This overlay ships the generic
# scaffolding; the BFF reconcile renders the concrete per-assignment kustomization into the
# node-storage-assignments ConfigMap that mirrors into apps/13b. With ZERO active assignments
# nothing references this overlay (inert).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - pvc.yaml
# The nodeAffinity strategic-merge patch is applied to the assignment's target workload. The
# target name comes from the storage-service annotation (rendered per assignment); listed here
# as documentation of the patch the per-assignment render injects.
# patches:
#   - path: placement-patch.yaml
#     target:
#       kind: Deployment
#       annotationSelector: snapdragon.systems/storage-service=<service>
