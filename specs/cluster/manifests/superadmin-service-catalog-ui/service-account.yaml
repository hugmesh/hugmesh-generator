# sa-service-catalog-ui — the per-app identity docs/SECURITY.md §3 RESERVED for this
# component. The reservation is verbatim: ServiceAccount `sa-service-catalog-ui`,
# SELinux MCS level `s0:c49`, Service DNS
# `hugmesh-superadmin-service-catalog-ui.hugmesh-frontend.svc`. The Deployment below
# names this SA, so it MUST exist before the pod is admitted — the AttestationServer
# shipped the mirror-image of that defect (a Deployment naming an SA no manifest
# created, so the pod never scheduled; see manifests/attestation-server/service-account.yaml).
#
# The console needs NO Kubernetes API access: it is a static nginx serving an Angular
# native-federation remote, and every mutation it drives goes over HTTP to the admin-bff
# /bff/superadmin/** control plane (which holds the fabric8 client and the RBAC).
# So no Role/RoleBinding is attached and automountServiceAccountToken is disabled
# defence-in-depth.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sa-service-catalog-ui
  namespace: hugmesh-frontend
  labels:
    app.kubernetes.io/name: superadmin-service-catalog-ui
    app.kubernetes.io/part-of: hugmesh.net
automountServiceAccountToken: false
