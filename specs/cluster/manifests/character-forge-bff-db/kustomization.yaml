apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: snapdragon-backend
resources:
  - pvc.yaml
  - deployment.yaml
  - service.yaml

# character-forge-bff owns its TABLES via Liquibase (applied by the app at startup), so no
# table DDL is seeded here. The initdb/ ConfigMap below is hardening + role setup
# only (runs once on an empty data dir, in alphabetical order):
#   00-hardening.sql  REVOKE PUBLIC + per-DB timeouts + scram password_encryption
#   10-roles.sh       the NON-OWNER least-privilege app login role (charforgebff_app)
#                     from CHARFORGEBFF_APP_PASSWORD env — never committed
#   90-citus.sh       OPT-IN Citus extension (no-op unless SHARDING_CITUS=on)
# entrypoint/pg-tls-entrypoint.sh is a SEPARATE ConfigMap (NOT in the initdb dir,
# or docker-entrypoint would run it as an init script). It is the GATED in-cluster
# TLS wrapper: PG_TLS_ENABLED (default "false") selects ssl-off (default, byte-
# identical wire path) vs ssl=on. Ships dark — see deployment.yaml + docs/POSTGRES-
# HARDENING.md §B.
configMapGenerator:
  - name: character-forge-bff-db-initdb
    files:
      - initdb/00-hardening.sql
      - initdb/10-roles.sh
      - initdb/90-citus.sh
  - name: character-forge-bff-db-entrypoint
    files:
      - entrypoint/pg-tls-entrypoint.sh

generatorOptions:
  disableNameSuffixHash: true
