# cloudflared-tunnel-token — the read-if-present cred hook (PROD only).
#
# Mirrors the External-Secrets idiom used across the cluster (manifests/external-
# secrets): a token sourced from Vault, which keys-provision populates from the
# keys USB at provision time (KEYS/cloudflared/credentials.json -> Vault path
# secret/<brand>/cloudflared). If the Vault key is ABSENT (no creds on the USB),
# ESO simply never materializes the Secret and the cloudflared Deployment stays
# down — harmless. Nothing here is consumed in ENV=test (the app is pruned).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cloudflared-tunnel-token
  namespace: devops
  annotations:
    # The mesh Vault base segment (issue #285, decision 38 = B) — the same
    # convention manifests/external-secrets uses, self-sourced here because this
    # directory is served by its OWN Application (apps/12-cloudflared.yaml) and so
    # has no ClusterSecretStore of its own to hang it on. kustomization.yaml's
    # `replacements` block copies it into the remoteRef key below; apps/12 patches
    # it; rebrand_sysroot() rewrites THAT patch to <BRAND>.
    platform.hugmesh.net/vault-base: "hugmesh"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: hugmesh-vault
    kind: ClusterSecretStore
  target:
    name: cloudflared-tunnel-token
    creationPolicy: Owner
    # deletionPolicy Retain: if the source key disappears, keep the last Secret
    # rather than tearing the tunnel down on a transient Vault miss.
    deletionPolicy: Retain
  data:
    - secretKey: token
      remoteRef:
        key: hugmesh/cloudflared
        property: tunnel_token
