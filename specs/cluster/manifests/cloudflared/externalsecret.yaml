# cloudflared-credentials (namespace devops) <- secret/snapdragon/cloudflared
#
# Secrets are never committed. The Named Tunnel credential JSON lives in Vault
# under secret/snapdragon/cloudflared (property credentials_json); the External
# Secrets Operator materializes it into the "cloudflared-credentials" Secret the
# Deployment mounts. Offline fallback: KEYS/vault/secrets.json (keys-provision),
# exactly like the other cluster secrets.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cloudflared-credentials
  namespace: devops
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: snapdragon-vault
    kind: ClusterSecretStore
  target:
    name: cloudflared-credentials
    creationPolicy: Owner
  data:
    - secretKey: credentials.json
      remoteRef:
        key: snapdragon/cloudflared
        property: credentials_json
