apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# cloudflared — the PROD-ONLY go-live edge. A Cloudflare Tunnel that maps the
# REAL public domain (api./matrix./mastodon./apex) to the in-cluster ingress,
# the dir the gateway comments (apps/20-gateway-*) already promise. It is the
# OPT-IN external path: in ENV=test images apps/12-cloudflared.yaml is pruned, so
# none of this is deployed. The internal cluster-CA TLS (Vault-PKI) stays the
# default issuer in BOTH envs; this only ADDS the public edge.
#
# Credentials are read-if-present from the keys USB via External Secrets (the
# cloudflared-tunnel-token Secret). If the creds are absent, the Deployment stays
# down harmlessly (no token -> no tunnel) — nothing else is affected.
namespace: devops
resources:
  - externalsecret.yaml
  - configmap.yaml
  - deployment.yaml

# THE MESH VAULT BASE SEGMENT (issue #285, decision 38 = B on #347). ArgoCD serves
# this directory from git, not from the device's baked tree, so the base segment
# moves at render time: the ExternalSecret's own platform.hugmesh.net/vault-base
# annotation is the value surface, apps/12-cloudflared.yaml patches it, and
# rebrand_sysroot() rewrites that patch to <BRAND>. Byte no-op at the default brand.
replacements:
  - source:
      group: external-secrets.io
      kind: ExternalSecret
      name: cloudflared-tunnel-token
      fieldPath: metadata.annotations.[platform.hugmesh.net/vault-base]
    targets:
      - select:
          group: external-secrets.io
          kind: ExternalSecret
          name: cloudflared-tunnel-token
        fieldPaths:
          - spec.data.*.remoteRef.key
        options:
          delimiter: "/"
          index: 0
