# cloudflared — Cloudflare Tunnel connector. Runs in devops (the cluster edge),
# dials out to Cloudflare (no inbound ports on the cluster) and forwards the
# public snapdragon.systems hostnames to the three gateway Services per the
# ConfigMap ingress rules. This is the external exposure for the gateways: the
# gateways are ClusterIP, and ONLY this tunnel (or an nginx Ingress, see the
# gateway apps' ingress.className) reaches them from outside.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: devops
  labels: { app: cloudflared, app.kubernetes.io/part-of: snapdragon.systems }
spec:
  replicas: 2   # two connectors for HA; Cloudflare load-balances across them
  selector: { matchLabels: { app: cloudflared } }
  template:
    metadata: { labels: { app: cloudflared } }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:latest
          args:
            - tunnel
            - --config
            - /etc/cloudflared/config/config.yaml
            - --no-autoupdate
            - run
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          livenessProbe:
            httpGet: { path: /ready, port: 2000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 50m,  memory: 64Mi }
            limits:   { cpu: 300m, memory: 256Mi }
          volumeMounts:
            - { name: config, mountPath: /etc/cloudflared/config, readOnly: true }
            - { name: creds,  mountPath: /etc/cloudflared/creds,  readOnly: true }
      volumes:
        - name: config
          configMap: { name: cloudflared }
        - name: creds
          secret:
            secretName: cloudflared-credentials
            optional: true   # provisioned from Vault/KEYS; absent in dry-run
