# cloudflared ingress rules — the ONLY external surface of the cluster. Every
# public hostname terminates here and is forwarded to exactly one gateway
# Service (ClusterIP). No service other than the three gateways is reachable
# from the tunnel, so the per-namespace Spring Cloud Gateways (which validate
# the Casdoor JWT and apply the gateway_route_access role rules) are the single
# choke point for all external traffic.
#
#   snapdragon.systems          -> fe-gateway  (Angular host + MFEs + /bff)
#   id.snapdragon.systems       -> pki-gateway (Casdoor)
#   api.snapdragon.systems      -> be-gateway  (snapdragon Spring APIs)
#   matrix.snapdragon.systems   -> be-gateway  (Matrix Synapse, by Host)
#   mastodon.snapdragon.systems -> be-gateway  (Mastodon, by Host)
#
# The tunnel credential (a Named Tunnel JSON) is the "cloudflared-credentials"
# Secret (key credentials.json) + TUNNEL_ID below; provision it from Vault via
# External Secrets, or from the KEYS stick offline (never commit it).
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared
  namespace: devops
  labels: { app: cloudflared, app.kubernetes.io/part-of: snapdragon.systems }
data:
  config.yaml: |
    # tunnel/credentials-file are also passed on the CLI; kept here for clarity.
    tunnel: snapdragon-systems
    credentials-file: /etc/cloudflared/creds/credentials.json
    metrics: 0.0.0.0:2000
    no-autoupdate: true
    ingress:
      - hostname: snapdragon.systems
        service: http://snapdragon-fe-gateway.snapdragon-frontend.svc.cluster.local:8080
      - hostname: id.snapdragon.systems
        service: http://snapdragon-pki-gateway.snapdragon-pki.svc.cluster.local:8080
      - hostname: api.snapdragon.systems
        service: http://snapdragon-be-gateway.snapdragon-backend.svc.cluster.local:8080
      - hostname: matrix.snapdragon.systems
        service: http://snapdragon-be-gateway.snapdragon-backend.svc.cluster.local:8080
      - hostname: mastodon.snapdragon.systems
        service: http://snapdragon-be-gateway.snapdragon-backend.svc.cluster.local:8080
      # Anything else is rejected at the edge.
      - service: http_status:404
