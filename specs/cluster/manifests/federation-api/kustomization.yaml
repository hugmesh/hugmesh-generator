apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hugmesh-backend
resources:
  - pvc.yaml
  - deployment.yaml
  - service.yaml
# First-party images pull from the in-cluster Harbor container registry
# (registry.hugmesh.net = inherited from GitLab's chart hosts.domain default, kept as-is; now served by Harbor (apps/03a-harbor.yaml), project
# path = <group>/<repo>). The federation CI (hugmesh-federation-api/.gitlab-ci.yml)
# pushes $CI_REGISTRY_IMAGE:<branch> + :<sha>; $CI_REGISTRY_IMAGE =
# registry.hugmesh.net/hugmesh/hugmesh-federation-api. We track the moving
# :main here for dev. Pulls need the harbor-registry imagePullSecret (ESO-
# materialized; the hugmesh-backend ExternalSecret already exists).
images:
  - { name: hugmesh/hugmesh-federation-api, newName: registry.hugmesh.net/hugmesh/hugmesh-federation-api, newTag: main }
patches:
  - target: { kind: Deployment }
    patch: |
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: harbor-registry

# ── THE IDENTITY PROVIDER THIS SERVICE TRUSTS (issue #530) ──────────────────────
# ArgoCD serves this directory from GIT, never from the device's baked tree, so
# rewrite_idp_sysroot()'s sed over the baked manifests/ copy cannot reach it. The
# issuer/JWKS move HERE, at render time, the way the Vault base does (#285). The
# idp-trust ConfigMap is local-config: kustomize never emits it, it is only the
# value surface. Its platform.hugmesh.net/idp-* annotations are set by a one-line
# JSON-6902 op in apps/29-federation-api.yaml, which IS baked, so
# rewrite_idp_sysroot() re-points that op at the external IdP for --idp != casdoor,
# and `replacements` copies it onto the env below. At the casdoor defaults this
# block is a byte no-op. Pinned by tests/scripts/test-eso-remoteref-brand.sh (7).
configMapGenerator:
  - name: idp-trust
    options:
      disableNameSuffixHash: true
      annotations:
        config.kubernetes.io/local-config: "true"
        platform.hugmesh.net/idp-issuer: "https://id.hugmesh.net"
        platform.hugmesh.net/idp-jwks: "http://casdoor.hugmesh-pki.svc.cluster.local:8000/.well-known/jwks"
replacements:
  - source: { version: v1, kind: ConfigMap, name: idp-trust, fieldPath: "metadata.annotations.[platform.hugmesh.net/idp-issuer]" }
    targets:
      - select: { group: apps, kind: Deployment, name: hugmesh-federation-api }
        fieldPaths:
          - spec.template.spec.containers.[name=hugmesh-federation-api].env.[name=CASDOOR_ISSUER_URI].value
  - source: { version: v1, kind: ConfigMap, name: idp-trust, fieldPath: "metadata.annotations.[platform.hugmesh.net/idp-jwks]" }
    targets:
      - select: { group: apps, kind: Deployment, name: hugmesh-federation-api }
        fieldPaths:
          - spec.template.spec.containers.[name=hugmesh-federation-api].env.[name=CASDOOR_JWKS_URI].value
