apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: snapdragon-backend
resources:
  - pvc.yaml
  - deployment.yaml
  - service.yaml
# First-party images pull from the in-cluster Harbor container registry
# (registry.snapdragon.systems = inherited from GitLab's chart hosts.domain default, kept as-is; now served by Harbor (apps/03a-harbor.yaml), project
# path = <group>/<repo>). The federation CI (snapdragon-federation-api/.gitlab-ci.yml)
# pushes $CI_REGISTRY_IMAGE:<branch> + :<sha>; $CI_REGISTRY_IMAGE =
# registry.snapdragon.systems/snapdragon/snapdragon-federation-api. We track the moving
# :main here for dev. Pulls need the harbor-registry imagePullSecret (ESO-
# materialized; the snapdragon-backend ExternalSecret already exists).
images:
  - { name: snapdragon-systems/snapdragon-federation-api, newName: registry.snapdragon.systems/snapdragon/snapdragon-federation-api, newTag: main }
patches:
  - target: { kind: Deployment }
    patch: |
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: harbor-registry
