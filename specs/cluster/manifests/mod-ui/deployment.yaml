# hugmesh-mod-ui — the moderation Angular micro-frontend remote. Its own nginx
# (own repo + pod) in the hugmesh-frontend namespace, federated into the
# hugmesh.net host: it serves a remoteEntry.json the host's loadRemoteModule
# consumes, mounted at /mod (mod role). Talks to mod-bff-api via the same-origin
# /bff/mod/** fe-gateway route.
# Repo: github.com/hugmesh/hugmesh-mod-ui
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: hugmesh-mod-ui, namespace: hugmesh-frontend, labels: { app: hugmesh-mod-ui, app.kubernetes.io/part-of: hugmesh.net } }
spec:
  # replicas is deliberately UNSET: the HorizontalPodAutoscaler below owns it.
  # Pinning it here made ArgoCD and the HPA fight forever — the HPA scaled to
  # minReplicas, ArgoCD saw drift and wrote it back, round and round. Measured
  # 2026-08-22 on kind: seven Deployments at generation ~950-964 after 38h,
  # one rewrite every ~2.4 minutes, and the Applications never left OutOfSync.
  selector: { matchLabels: { app: hugmesh-mod-ui } }
  template:
    metadata: { labels: { app: hugmesh-mod-ui } }
    spec:
      nodeSelector: { hugmesh.net/frontend: "true" }
      securityContext:
        seLinuxOptions:
          type: container_t
          level: "s0:c46"
      containers:
        - name: web
          image: hugmesh/mod-ui:dev
          ports: [{ name: http, containerPort: 80 }]
          resources: { requests: { cpu: 50m, memory: 96Mi }, limits: { cpu: 300m, memory: 192Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: hugmesh-mod-ui, namespace: hugmesh-frontend }
spec: { selector: { app: hugmesh-mod-ui }, ports: [{ name: http, port: 80, targetPort: http }] }
