# HTTPRoute (Gateway API) for the character-forge remote at the /character-forge
# mountAt.
#
# ⚠ ROUTING-MODEL NOTE: the LIVE hugmesh mesh routes through Spring Cloud Gateway
# (apps/20-gateway-{be,fe}.yaml helm values + the route-access DB), NOT the Gateway
# API. The ACTIVE route for this remote is the `character-forge-ui` SCG route added
# to apps/20-gateway-fe.yaml (path /character-forge/** -> this Service on :8080) +
# its gateway_route_access row (/character-forge/** = ROLE_USER). This HTTPRoute is
# provided per the optional-service manifest contract and lets a cluster that ADOPTS
# the Gateway API (ingress-nginx Gateway / Envoy Gateway) attach the same path with
# no manifest change. It is INERT until a gateway.networking.k8s.io controller +
# parent Gateway exist (kustomize renders it without the CRD installed; ArgoCD holds
# it Progressing-less until a controller adopts it). Kept here so the slug owns its
# route definition in one place and the build-time gate prunes it WITH the manifest
# dir.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hugmesh-character-forge-ui
  namespace: hugmesh-frontend
  labels:
    app: hugmesh-character-forge-ui
    app.kubernetes.io/part-of: hugmesh.net
spec:
  # parentRefs MUST be set to the cluster's frontend Gateway when the Gateway API is
  # adopted (placeholder name below; matches the ingress-nginx/Envoy Gateway naming).
  parentRefs:
    - name: hugmesh-fe-gateway
      namespace: hugmesh-frontend
  rules:
    - matches:
        - path: { type: PathPrefix, value: /character-forge }
      backendRefs:
        - name: hugmesh-character-forge-ui
          port: 8080
