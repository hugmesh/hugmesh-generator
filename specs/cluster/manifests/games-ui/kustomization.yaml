apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hugmesh-frontend
resources:
  - deployment.yaml
  - service.yaml

# First-party images pull from the in-cluster Harbor container registry
# (registry.hugmesh.net, served by Harbor — apps/03a-harbor.yaml), the same
# <group>/<repo>/<image> path as the games BFF. NOT PUBLISHED YET: hugmesh-games'
# release workflow must add games-ui/ to its image set as
# ghcr.io/hugmesh/hugmesh-games/games-ui, and scripts/release/repos.tsv with it. Until
# then this pod is ImagePullBackOff unless the image is pushed by hand. Pulls need the
# harbor-registry imagePullSecret (ESO-materialized, see manifests/external-secrets).
images:
  - name: hugmesh/games-ui
    newName: registry.hugmesh.net/hugmesh/hugmesh-games/games-ui
    newTag: main
patches:
  - target: { kind: Deployment }
    patch: |
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: harbor-registry
