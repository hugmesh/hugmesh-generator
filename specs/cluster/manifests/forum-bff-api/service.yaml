# ClusterIP only — reachable solely through the fe-gateway's /bff/forum/** route, so
# /bff is same-origin with hugmesh.systems and is role-checked at the gateway.
apiVersion: v1
kind: Service
metadata:
  name: hugmesh-forum-bff-api
  namespace: hugmesh-backend
  labels: { app: hugmesh-forum-bff-api }
spec:
  type: ClusterIP
  selector: { app: hugmesh-forum-bff-api }
  ports:
    - { name: http, port: 8080, targetPort: http }
