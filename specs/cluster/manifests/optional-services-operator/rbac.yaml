# ════════════════════════════════════════════════════════════════════════════════
# OPTIONAL-SERVICES OPERATOR RBAC — least privilege, NAMESPACE-SCOPED.
#
# GROUNDS the admin-bff OptionalServiceReconciler (Lease-gated single writer) + the
# natural follow-on admin-bff PUT /bff/superadmin/optional-services/{slug} endpoint.
# Both run as the admin-bff pod's in-cluster ServiceAccount (backups-effector, ns
# hugmesh-backend — the SAME SA the platform-capability probe + Velero effector
# use; created in manifests/admin-bff-api/backups-effector-sa.yaml and named on the
# admin-bff Deployment's serviceAccountName). No new SA; we only bind grants to it.
#
# The reconcile does EXACTLY these fabric8 calls (see the optionalservices package):
#   • genericKubernetesResources(platform.hugmesh.systems/v1alpha1 OptionalService)
#       .inNamespace("devops").list()                         -> optionalservices: get/list/watch
#   • ...resource(cr).updateStatus()                          -> optionalservices/status: update/patch
#   • genericKubernetesResources(argoproj.io/v1alpha1 ApplicationSet)
#       .inNamespace("devops").withName("optional-services").get()/.update()
#                                                             -> applicationsets: get/patch/update (that ONE name)
#   • configMaps().inNamespace("hugmesh-policy").withName("installed-services")
#       .patch(...)                                            -> configmaps: get/patch/update (that ONE name)
# The follow-on BFF mutation endpoint additionally create/update/patches the CR spec
# (same SA, same pod) — included below so no second grant is needed for that wave.
#
# SHIPS DARK: the reconciler leaves app.optional-services.reconcile.enabled=false
# (NoopOptionalServiceClient / Noop writers), so these grants are UNEXERCISED until
# a live cluster deliberately enables it AFTER the hardcoded-app cut-over (see
# docs/OPTIONAL-SERVICES.md §10 — enabling pre-cut-over double-manages akkoma/etc.).
#
# LEASE: the reconciler REUSES the shared LeaderElection bean (app.access-suspension.
# lease) the node-storage / games / suspension loops already use — so NO new Lease
# (coordination.k8s.io) grant is added here; the existing suspension-lease RBAC
# covers it. Single-replica / dev / test fall back to AlwaysLeader (no Lease at all).
#
# HUMAN kubectl (break-glass): the platform has NO human-OIDC Group subjects — the
# cluster is mutated THROUGH admin-bff SAs, and a cluster operator on the pki node
# already holds cluster-admin via the kubeconfig. So there is deliberately NO Group-
# bound Role here (binding to a nonexistent group would be a fiction). The intended
# runtime mutators are (1) the admin-bff BFF endpoint (SA-bound below) and (2) a
# break-glass `kubectl -n devops patch optionalservice <slug> ...` by cluster-admin.
# ════════════════════════════════════════════════════════════════════════════════
#
# ── The desired-state CRs + their /status (ns devops, co-located with 13a) ───────
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: optional-services-operator
  namespace: devops
  labels:
    app.kubernetes.io/name: optional-services-operator
    app.kubernetes.io/component: operator-rbac
    app.kubernetes.io/part-of: hugmesh.systems
rules:
  # Reconcile READ of the desired-state objects. create/update/patch/delete are the
  # follow-on BFF mutation endpoint's grants (same SA); the reconcile loop itself
  # only exercises get/list/watch.
  - apiGroups: ["platform.hugmesh.systems"]
    resources: ["optionalservices"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Status subresource writes (observedGeneration / installed / phase / conditions).
  - apiGroups: ["platform.hugmesh.systems"]
    resources: ["optionalservices/status"]
    verbs: ["get", "update", "patch"]
  # The ONE ApplicationSet the controller is the single writer of. resourceNames
  # pins it to `optional-services` so the grant cannot touch any other ApplicationSet
  # (get + the read-modify-write PUT/patch of /spec/generators/0/list/elements).
  # NB: RBAC resourceNames cannot gate list/watch, and the controller reads by
  # .withName().get() (never list), so no list/watch verb is granted here.
  - apiGroups: ["argoproj.io"]
    resources: ["applicationsets"]
    resourceNames: ["optional-services"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: optional-services-operator
  namespace: devops
  labels:
    app.kubernetes.io/name: optional-services-operator
    app.kubernetes.io/component: operator-rbac
    app.kubernetes.io/part-of: hugmesh.systems
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: optional-services-operator
subjects:
  - kind: ServiceAccount
    name: backups-effector
    namespace: hugmesh-backend
---
# ── The greying/capability ConfigMap mirror (ns hugmesh-policy) ───────────────
# Pinned to the single `installed-services` ConfigMap. get + patch only (the
# controller does a targeted merge-patch of the 12 controller-owned boolean keys;
# it never replaces the whole object, so services.json / workloadConsole / the
# reserved-prefixes ConfigMap stay ArgoCD-managed and untouched).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: optional-services-configmap-writer
  namespace: hugmesh-policy
  labels:
    app.kubernetes.io/name: optional-services-operator
    app.kubernetes.io/component: operator-rbac
    app.kubernetes.io/part-of: hugmesh.systems
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["installed-services"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: optional-services-configmap-writer
  namespace: hugmesh-policy
  labels:
    app.kubernetes.io/name: optional-services-operator
    app.kubernetes.io/component: operator-rbac
    app.kubernetes.io/part-of: hugmesh.systems
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: optional-services-configmap-writer
subjects:
  - kind: ServiceAccount
    name: backups-effector
    namespace: hugmesh-backend
