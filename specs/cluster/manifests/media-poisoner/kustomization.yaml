apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hugmesh-backend
resources:
  - pvc.yaml
  - deployment.yaml
  - service.yaml

# First-party image from the in-cluster Harbor container registry (CI pushes
# :<branch> + :<sha>; we track the moving :main here for dev). Pulls need the
# harbor-registry imagePullSecret (ESO-materialized, see manifests/external-secrets),
# patched in below — same pattern as manifests/games.
images:
  - { name: snapdragon-systems/hugmesh-media-poisoner, newName: registry.hugmesh.systems/hugmesh/hugmesh-media-poisoner, newTag: main }
patches:
  - target: { kind: Deployment }
    patch: |
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: harbor-registry
