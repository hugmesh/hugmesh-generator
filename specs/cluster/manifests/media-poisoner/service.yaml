# ClusterIP — reached ONLY in-cluster by hugmesh-user-bff-api's media-proxy over
# stable DNS:
#   hugmesh-media-poisoner.hugmesh-backend.svc.cluster.local:8080
# The BFF hard-codes this FQDN (MEDIA_POISONING_WORKER_URL on the user-bff-api
# Deployment) for both POST /poison and the GET /health capability probe. On a
# Pi5-only cluster the backing pod is Pending, so this Service has NO Ready
# endpoints and the BFF's probe times out / 503s -> heavy tier absent -> lean
# fallback (warn-before-post). Keep the name in sync with that env.
apiVersion: v1
kind: Service
metadata:
  name: hugmesh-media-poisoner
  namespace: hugmesh-backend
  labels: { app: hugmesh-media-poisoner }
spec:
  type: ClusterIP
  selector: { app: hugmesh-media-poisoner }
  ports:
    - { name: http, port: 8080, targetPort: http }
