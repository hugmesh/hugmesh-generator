# wiki-bff — the Backend-For-Frontend the hugmesh-wiki-ui talks to for the
# wiki surfaces (/bff/wiki/**): wiki pages, attachments, audit log, and access
# control. It is a ClusterIP-only service in hugmesh-backend: nothing reaches
# it from outside except via the fe-gateway, which routes same-origin /bff/wiki/**
# to it AND enforces the Casdoor role rules from the route DB first.
# Defence-in-depth: wiki-bff re-checks role + ownership.
#
# Security model: wiki-bff is an OAuth2 RESOURCE SERVER — it VALIDATES the cluster
# Casdoor JWT itself (CASDOOR_ISSUER_URI, JWKS auto-discovered). It has NO external
# service calls (no phpBB, no homeserver dial): JWT resource server + R2DBC + mTLS
# only. The wiki content lives entirely in wiki-bff-db.
#
# wiki-bff owns the wiki_page / wiki_attachment / wiki_audit_log tables in its OWN
# dedicated Postgres (wiki-bff-db), validated via Liquibase at boot.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hugmesh-wiki-bff-api
  namespace: hugmesh-backend
  labels: { app: hugmesh-wiki-bff-api, app.kubernetes.io/part-of: hugmesh.net }
spec:
  # replicas is deliberately UNSET: the HorizontalPodAutoscaler below owns it.
  # Pinning it here made ArgoCD and the HPA fight forever — the HPA scaled to
  # minReplicas, ArgoCD saw drift and wrote it back, round and round. Measured
  # 2026-08-22 on kind: seven Deployments at generation ~950-964 after 38h,
  # one rewrite every ~2.4 minutes, and the Applications never left OutOfSync.
  selector: { matchLabels: { app: hugmesh-wiki-bff-api } }
  template:
    metadata: { labels: { app: hugmesh-wiki-bff-api } }
    spec:
      nodeSelector: { hugmesh.net/backend: "true" }
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
        seLinuxOptions:
          type: container_t
          level: "s0:c69"
      # ── API-to-API mTLS identity (build-keystore) ───────────────────────────
      # Mirrors the forum-bff-api/user-bff-api/gateway build-keystore initContainer:
      # turns the Vault-PKI-issued, ESO-synced TLS Secret
      # (hugmesh-wiki-bff-api-mtls: tls.crt/tls.key/ca.crt) into keystore.p12
      # (identity) + truststore.p12 (cluster CA) for server.ssl.* to REQUIRE a
      # client cert chaining to the cluster CA. Store password generated in-pod,
      # kept only in the tmpfs /stores emptyDir, emitted into
      # application.properties via SPRING_CONFIG_ADDITIONAL_LOCATION — never
      # in git / a Secret / the pod spec.
      initContainers:
        - name: build-keystore
          image: hugmesh/wiki-bff-api:dev
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          command: ["/bin/sh", "-ec"]
          args:
            - |
              P="$(openssl rand -base64 24 | tr -d '/+=' | cut -c1-24)"
              openssl pkcs12 -export -inkey /pki/tls.key -in /pki/tls.crt \
                -certfile /pki/ca.crt -name hugmesh-wiki-bff-api \
                -out /stores/keystore.p12 -passout "pass:${P}"
              keytool -importcert -noprompt -alias hugmesh-cluster-ca \
                -file /pki/ca.crt -keystore /stores/truststore.p12 \
                -storetype PKCS12 -storepass "${P}"
              # FILENAME IS LOAD-BEARING — do NOT rename this back to
              # application-tls.properties (or any application-<name>.properties).
              # SPRING_CONFIG_ADDITIONAL_LOCATION only adds a SEARCH DIRECTORY; Spring
              # auto-loads a profile-named doc (application-<name>.properties) from it ONLY
              # when a profile literally named <name> is active. No manifest activates a
              # `tls` profile, so the old application-tls.properties was silently never
              # loaded and the store passwords fell back to the packaged application.yml's
              # ${SSL_KEY_STORE_PASSWORD:} -> "" (empty), which cannot open the PKCS12
              # keystore. Plain application.properties loads UNCONDITIONALLY from the
              # additional location, with no profile needed.
              umask 077
              cat > /stores/application.properties <<EOF
              server.ssl.key-store-password=${P}
              server.ssl.trust-store-password=${P}
              EOF
              echo "keystore + truststore + application.properties built"
          volumeMounts:
            - { name: pki,    mountPath: /pki, readOnly: true }
            - { name: stores, mountPath: /stores }
      containers:
        - name: hugmesh-wiki-bff-api
          image: hugmesh/wiki-bff-api:dev
          ports: [{ name: http, containerPort: 8080 }]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          env:
            # ── API-to-API mTLS (server side) ─────────────────────────────────
            # Require a client cert chaining to the cluster CA. Store passwords come
            # from /stores/application.properties (in-pod generated, loaded via
            # SPRING_CONFIG_ADDITIONAL_LOCATION) so they never enter the pod spec.
            # DEPLOY-ORDER: deploy with the gateway/BFF client-cert wave.
            - { name: SSL_ENABLED,          value: "true" }
            - { name: SSL_CLIENT_AUTH,      value: "need" }
            - { name: SSL_KEY_STORE,        value: "/stores/keystore.p12" }
            - { name: SSL_KEY_STORE_TYPE,   value: "PKCS12" }
            - { name: SSL_TRUST_STORE,      value: "/stores/truststore.p12" }
            - { name: SSL_TRUST_STORE_TYPE, value: "PKCS12" }
            - { name: SPRING_CONFIG_ADDITIONAL_LOCATION, value: "file:/stores/" }
            # OAuth2 resource server: validate the cluster Casdoor JWT itself.
            - { name: CASDOOR_ISSUER_URI, value: "https://id.hugmesh.net" }
            # APP_TENANCY_ISSUERS is deliberately NOT set here — RATIFIED, not an
            # oversight to "finish" (DECISION 30, operator, 2026-09-17,
            # hugmesh-generator#347: app.tenancy.issuers stays opt-in, never
            # defaulted). Do not "fix" this by adding it alone — see below.
            # Unset, commons' DomainRegistry seeds the back-compat single-issuer entry
            # {CASDOOR_ISSUER_URI -> "default"}, so domainOf() == "default" — which is
            # exactly what the existing rows are stamped with (wiki_page /
            # wiki_attachment / wiki_audit_log / wiki_access each declare
            # `domain varchar(64) defaultValue="default"`).
            # Setting it to the gateway archetype's pattern
            # ("https://id.hugmesh.net=<brand>") makes domainOf() return "<brand>",
            # so every `WHERE domain = ...` read stops matching those "default" rows.
            # A single pair also leaves isMultiIssuer() false, so the fail-closed
            # multi-issuer decoder never activates: no 401, no error — the rows just
            # vanish. Later writes then stamp NEW rows "<brand>", so rolling back leaves
            # split-brain data.
            #
            # Multi-brand for wiki is a CONFIG-ONLY cut-over — setting
            # APP_TENANCY_ISSUERS to a single pair performs it by itself.
            # RestampTargetEnvironmentPostProcessor (hugmesh-wiki-bff-api#19) derives
            # the 007 Liquibase re-stamp target from this same variable and publishes
            # it before Liquibase binds parameters, so every existing domain='default'
            # row is re-stamped during the SAME boot that sets the variable — before
            # the app serves its first request under the new brand. There is no
            # window and nothing else to sequence. Pre-flight first (see that repo's
            # 007 changelog header):
            #   SELECT domain, count(*) FROM wiki_page GROUP BY domain;
            # exactly one row reading "default" is the safe state to cut over from.
            #
            # ⚠️ ONE-WAY DOOR, undocumented until now: once that armed boot has run,
            # APP_TENANCY_ISSUERS becomes load-bearing for STARTUP, not just for
            # domainOf(). Liquibase substitutes the changelog parameter into the 007
            # <sql> BEFORE checksumming, so the armed run's recorded checksum embeds
            # the brand. A later boot that publishes no parameter — the variable
            # removed, or grown to a second brand; exactly what an ArgoCD revert of
            # THIS file, or `selfHeal` undoing a manual `kubectl set env`, does — computes
            # a different checksum and the boot REFUSES with ValidationFailedException
            # on the 007 changelog. Nothing is migrated and nothing is lost, but
            # nothing starts either (measured directly against Liquibase in
            # DerivedTargetRerunTest; no pod has been booted through this, so treat
            # "refuses to start" as the fact and any particular kubectl-visible
            # symptom as unverified).
            #
            # THE PERMANENT FIX (DECISION 31, operator, 2026-09-17,
            # hugmesh-generator#347 — CONFIRMED and PERMANENT, not a workaround):
            # once the armed boot has succeeded, ALSO set
            # SPRING_LIQUIBASE_PARAMETERS_WIKI_RESTAMP_TARGET_DOMAIN=<brand> here and
            # NEVER remove it. The pin is an OVERRIDE, not a cross-check —
            # RestampTargetEnvironmentPostProcessor early-returns on any non-blank
            # explicit value — so if the two variables ever disagree (both arrive
            # together from this one file under ArgoCD), the boot does NOT refuse:
            # it silently re-stamps every "default" row to whichever brand the PIN
            # names, with only an INFO line naming the mismatch. Keep both variables
            # in lockstep, always as a pair, in the same change.
            # ── Content datastore (wiki_page / wiki_attachment / wiki_audit_log) ─
            # The app's application.yml defaults spring.r2dbc + spring.liquibase to
            # a literal `hugmesh-pg` host that does NOT exist; OVERRIDE both here
            # to the dedicated wiki-bff-db. R2DBC is the runtime handle; the JDBC
            # handle is used by Liquibase ONCE at startup.
            # RUNTIME handle: log in as the dedicated NON-OWNER least-privilege role
            # `wikibff_app` (DML only), created by wiki-bff-db's initdb/10-roles.sh.
            # Password from its OWN ESO Secret wiki-bff-db-app-auth (the SAME the DB
            # pod's WIKIBFF_APP_PASSWORD mounts).
            # R2DBC POOL SIZE (hugmesh-generator: kind sign-in answered 500, measured
            # 2026-09-30). The app role above is created with CONNECTION LIMIT 20
            # (initdb/10-roles.sh) and the database runs with max_connections=60. With
            # NO pool setting, r2dbc-pool's Spring Boot default of 10 connections per
            # replica applies, so the HorizontalPodAutoscaler's maxReplicas of 6 asked
            # for 6 x 10 = 60 connections against a limit of 20: two pods held the whole
            # budget and the other four failed every query with "Failed to obtain R2DBC
            # Connection" (FATAL: too many connections for role). Sized so that
            # maxReplicas x max-size fits the role limit with margin: 6 x 3 = 18 <= 20.
            # initial-size must not exceed max-size (r2dbc-pool refuses to build).
            # tests/scripts/test-db-connection-budget.sh pins this inequality for every
            # Deployment that has both a database role and an autoscaler.
            - name: SPRING_R2DBC_POOL_INITIAL_SIZE
              value: "1"
            - name: SPRING_R2DBC_POOL_MAX_SIZE
              value: "3"
            - name: SPRING_R2DBC_URL
              value: "r2dbc:postgresql://wiki-bff-db.hugmesh-backend.svc.cluster.local:5432/wikibff"
            - name: SPRING_R2DBC_USERNAME
              value: "wikibff_app"
            - name: SPRING_R2DBC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wiki-bff-db-app-auth
                  key: password
            # JDBC handle used ONLY by Liquibase at startup. DDL needs the OWNER, so
            # Liquibase keeps the owner role `wikibff` + the owner ESO Secret
            # wiki-bff-db-auth (the SAME the DB pod's POSTGRES_PASSWORD mounts).
            - name: SPRING_LIQUIBASE_URL
              value: "jdbc:postgresql://wiki-bff-db.hugmesh-backend.svc.cluster.local:5432/wikibff"
            - name: SPRING_LIQUIBASE_USER
              value: "wikibff"
            - name: SPRING_LIQUIBASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wiki-bff-db-auth
                  key: password
          # HTTPS exec probe: client-auth=need rejects a cert-less kubelet httpGet,
          # so curl PRESENTS this pod's client cert and validates the server cert
          # against the cluster CA (--resolve maps the SAN to loopback).
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - >-
                  curl -sf --cert /pki/tls.crt --key /pki/tls.key --cacert /pki/ca.crt
                  --resolve hugmesh-wiki-bff-api:8080:127.0.0.1
                  https://hugmesh-wiki-bff-api:8080/actuator/health/readiness
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - >-
                  curl -sf --cert /pki/tls.crt --key /pki/tls.key --cacert /pki/ca.crt
                  --resolve hugmesh-wiki-bff-api:8080:127.0.0.1
                  https://hugmesh-wiki-bff-api:8080/actuator/health/liveness
            initialDelaySeconds: 45
            periodSeconds: 15
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: "1",  memory: 768Mi }
          volumeMounts:
            - { name: tmp,    mountPath: /tmp }
            - { name: stores, mountPath: /stores, readOnly: true }
            - { name: pki,    mountPath: /pki,    readOnly: true }
      volumes:
        - name: tmp
          emptyDir: {}
        # Vault-PKI-issued mTLS material, synced by ESO (kubernetes.io/tls).
        - name: pki
          secret:
            secretName: hugmesh-wiki-bff-api-mtls
        # tmpfs for the assembled PKCS12 stores + the in-pod SSL properties.
        - name: stores
          emptyDir:
            medium: Memory
