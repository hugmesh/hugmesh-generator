apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hugmesh-pki
resources:
  - harbor-provision-job.yaml

# THE MESH VAULT BASE SEGMENT (issue #285, decision 38 = B on #347) — the WRITER
# half. Copies the Job's platform.hugmesh.net/vault-base annotation onto the
# VAULT_KV_BASE env var the reconcile script writes Vault with, so this writer and
# the ESO readers in manifests/external-secrets move together. apps/03b-harbor-
# provision.yaml patches the annotation; rebrand_sysroot() rewrites that patch to
# <BRAND>. Byte no-op at the default brand.
replacements:
  - source:
      group: batch
      version: v1
      kind: Job
      name: harbor-provision
      fieldPath: metadata.annotations.[platform.hugmesh.net/vault-base]
    targets:
      - select:
          group: batch
          version: v1
          kind: Job
          name: harbor-provision
        fieldPaths:
          - spec.template.spec.containers.[name=reconcile].env.[name=VAULT_KV_BASE].value
  # issue #530: CASDOOR_OIDC_ENDPOINT follows the idp-trust annotation (block below).
  - source: { version: v1, kind: ConfigMap, name: idp-trust, fieldPath: "metadata.annotations.[platform.hugmesh.net/idp-issuer]" }
    targets:
      - select: { group: batch, kind: Job, name: harbor-provision }
        fieldPaths:
          - spec.template.spec.containers.[name=reconcile].env.[name=CASDOOR_OIDC_ENDPOINT].value

# ── THE IDENTITY PROVIDER THIS SERVICE TRUSTS (issue #530) ──────────────────────
# ArgoCD serves this directory from GIT, never from the device's baked tree, so
# rewrite_idp_sysroot()'s sed over the baked manifests/ copy cannot reach it. The
# issuer/JWKS move HERE, at render time, the way the Vault base does (#285). The
# idp-trust ConfigMap (below) is local-config: kustomize never emits it,
# it is only the value surface. Its platform.hugmesh.net/idp-* annotations are set
# by a one-line JSON-6902 op in apps/03b-harbor-provision.yaml, which IS baked, so
# rewrite_idp_sysroot() re-points that op at the external IdP for --idp != casdoor,
# and `replacements` copies it onto the env below. At the casdoor defaults this
# block is a byte no-op. Pinned by tests/scripts/test-eso-remoteref-brand.sh (7).
configMapGenerator:
  - name: idp-trust
    options:
      disableNameSuffixHash: true
      annotations:
        config.kubernetes.io/local-config: "true"
        platform.hugmesh.net/idp-issuer: "https://id.hugmesh.net"
