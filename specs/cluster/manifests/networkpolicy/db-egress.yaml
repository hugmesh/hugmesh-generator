# Per-DB-pod EGRESS locks — DNS only (closes the ADR-32 companion gap).
#
# THE GAP THIS CLOSES. db-ingress.yaml is Ingress-ONLY, and tier-egress.yaml
# deliberately EXCLUDES six Postgres pods from its namespace-wide egress cutover
# on the identical "a server pod initiates nothing outbound" rationale:
#   hugmesh-backend  `app NotIn [admin-bff-db, mod-bff-db, user-bff-db,
#                    federation-db, forum-bff-db, egress-proxy]`
#   hugmesh-pki      `app NotIn [route-access-db]`
# Between the two files, NOTHING selected those pods on the Egress axis, so their
# egress was DEFAULT-ALLOW: a compromised Postgres pod could open a socket to
# anywhere, in-cluster or on the internet. tier-egress.yaml carried that as a
# written TODO; this file is the follow-up it named, and it covers ALL SIX.
#
# ⚠ ONE POD IN THAT EXCLUSION SET IS STILL NOT COVERED HERE, AND DELIBERATELY SO:
# CASSANDRA (hugmesh-pki, `app.kubernetes.io/name NotIn [cassandra]` in
# tier-egress.yaml). It is excluded on a DIFFERENT rationale — it gossips, so it
# is the one workload here that genuinely does initiate outbound traffic — and its
# pod spec is NOT IN THIS TREE: it is rendered by the pinned bitnami/cassandra
# 12.3.11 Helm chart (apps/00-cassandra.yaml). Its real allow-set (7000/7001
# gossip + internode TLS, 7199 JMX, the ESO/metrics sidecars the chart may add at
# a version bump) cannot be derived from anything committed here, and a guessed
# allow-set on a gossip database is exactly the "missed allow black-holes the
# workload" failure the egress overlay's own warning is about. So: Cassandra's
# egress REMAINS DEFAULT-ALLOW, it is a NAMED open gap and not an oversight, and
# closing it needs the rendered StatefulSet read off a live cluster first. Do not
# claim "the DB tier is egress-locked" without this sentence attached.
#
# WHY DNS-ONLY IS THE COMPLETE ALLOW-SET FOR THE SIX, measured not assumed. Each
# of the six Deployments is a SINGLE `postgres:16-alpine` container — no
# initContainers, no sidecars, no exporters (verified in manifests/{admin-bff-db,
# mod-bff-db,user-bff-db,federation-db,forum-bff-db}/deployment.yaml and
# manifests/route-access/deployment.yaml). A Postgres pod is a SERVER: it accepts
# connections and initiates none. Its initdb/ scripts and the pg-tls entrypoint
# run locally in the container; Liquibase and every schema migration run in the
# consuming *-api pod and arrive as INGRESS. Its credentials arrive as MOUNTED
# ESO Secrets, so it never dials Vault itself. Citus (the one thing here that
# would talk pod-to-pod) is opt-in and off by default in BOTH federation-db and
# route-access-db — `SHARDING_CITUS=on` plus the citusdata image; TURNING IT ON
# MEANS ADDING A WORKER RULE HERE, because a coordinator does dial its workers.
#
# PRECEDENT, same shape: homeserver-egress.yaml's `homeserver-egress-akkoma-db` is
# exactly this policy for akkoma-db, and it ships through the auto-sync app
# (apps/08-networkpolicy.yaml). THIS file originally joined it there on the same
# argument (a per-pod lock on a server pod with a one-line allow-set is a different
# risk class from tier-wide egress) and shipped for one commit (PR #325) as a
# six-pod, self-healing default-deny with no live validation. It was moved on
# 2026-09-09 and is NOT in networkpolicy/kustomization.yaml now: it belongs to the
# dark, manual-sync overlay manifests/networkpolicy-egress (apps/08a), enabled per
# namespace with scripts/netpol-egress-scope.py --with-db-egress. See
# docs/DB-HARDENING-RUNBOOK.md part C.
#
# ROLLBACK, if a DB pod ever does turn out to need outbound: remove the carved
# db-egress-<namespace>.yaml from the overlay's kustomization.yaml and manual-sync
# apps/08a (the pods return to default-allow egress) or add the missing allow rule.
# Ingress isolation is untouched either way — Ingress and Egress are independent
# axes and db-ingress.yaml owns the other one.
#
# NOT the same set as tier-ingress.yaml's NotIn list, and that is CORRECT:
# wiki-bff-db / mesh-bff-db / character-forge-bff-db are NOT in tier-egress's
# NotIn, so tier-egress already selects them and locks their egress to the
# backend tier allow-set once that cutover happens. casdoor-pg (hugmesh-pki) and
# casdoor-games-pg (hugmesh-games) are likewise selected by their own tier-egress
# policies and need no per-pod lock here. The six below are the ones tier-egress
# excludes on the server-pod rationale and therefore the only ones it leaves
# uncovered — plus Cassandra, called out above.
---
# ── admin-bff-db (Postgres, hugmesh-backend) ────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: db-egress-admin-bff-db
  namespace: hugmesh-backend
  labels: { app: admin-bff-db, app.kubernetes.io/part-of: hugmesh.net }
spec:
  podSelector:
    matchLabels: { app: admin-bff-db }
  policyTypes: [Egress]
  egress:
    # DNS (CoreDNS/kube-dns in kube-system). The ONLY thing a Postgres server
    # pod resolves; without it even in-pod name lookups (and pg_isready by
    # hostname) fail.
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
