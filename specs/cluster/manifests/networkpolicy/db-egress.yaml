        - { protocol: TCP, port: 53 }
---
# ── federation-db (Postgres, hugmesh-backend) ───────────────────────────────
# ⚠ CITUS: if SHARDING_CITUS is ever flipped on (manifests/federation-db/
# deployment.yaml + the citusdata image), the coordinator DIALS its workers on
# 5432 and this allow-set becomes incomplete. Add the worker rule in the same
# change that flips the flag.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: db-egress-federation-db
  namespace: hugmesh-backend
  labels: { app: federation-db, app.kubernetes.io/part-of: hugmesh.net }
spec:
  podSelector:
    matchLabels: { app: federation-db }
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
# ── forum-bff-db (Postgres, hugmesh-backend) ────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
