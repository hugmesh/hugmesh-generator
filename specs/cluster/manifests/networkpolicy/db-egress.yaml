# ── route-access-db (Postgres, hugmesh-pki) ─────────────────────────────────
# The SIXTH pod tier-egress.yaml excludes on the server-pod rationale, and the
# one whose default-allow egress mattered most: this is the source of truth for
# the gateway `route_access` table — the rows every gateway reads to decide
# whether a role may reach a URL. Losing or tampering with that store is the
# failure mode where RBAC silently stops enforcing, so it is the last pod in the
# mesh that should have been able to dial arbitrary destinations.
#
# Same shape and same evidence as the five backend DBs above: manifests/
# route-access/deployment.yaml is a single `postgres:16-alpine` container with no
# initContainers and no sidecars; its five role passwords arrive as MOUNTED ESO
# Secret keys (route-access-db-roles), not by dialling Vault; its initdb/ scripts
# (00-hardening.sql, 10-roles.sh, 20-schema.sql, 90-citus.sh) and the
# pg-tls-entrypoint.sh wrapper run entirely in-container — grepped for
# curl|wget|nc|psql -h|pg_dump|http and they make no outbound call.
#
# ⚠ CITUS, same caveat as federation-db: SHARDING_CITUS is "off" and the image is
# stock postgres:16-alpine. Flipping it on (citusdata/citus:12-pg16) makes the
# coordinator DIAL its workers on 5432 — add the worker rule in the same change
# that flips the flag.
#
# ⚠ PG_TLS_ENABLED is "false" today and flipping it to "true" changes NOTHING
# here: TLS is served on the INGRESS side (Postgres accepts a TLS handshake), and
# the cert arrives as a mounted Secret. No egress rule is implied by that flip.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: db-egress-route-access-db
  namespace: hugmesh-pki
  labels: { app: route-access-db, app.kubernetes.io/part-of: hugmesh.net }
spec:
  podSelector:
    matchLabels: { app: route-access-db }
  policyTypes: [Egress]
  egress:
    # DNS (CoreDNS/kube-dns in kube-system). The ONLY thing a Postgres server
    # pod resolves; without it even in-pod name lookups (and pg_isready by
    # hostname) fail.
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
