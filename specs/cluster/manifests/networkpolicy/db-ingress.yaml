---
# ── federation-db (Postgres, hugmesh-backend) ───────────────────────────────
# Consumers: federation-api (federation datasource) + admin-bff-api (the admin-bff
# cross-DB federation handle — see admin-bff-api deployment JDBC/R2DBC to
# federation-db).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: db-ingress-federation-db
  namespace: hugmesh-backend
  labels: { app: federation-db, app.kubernetes.io/part-of: hugmesh.systems }
spec:
  podSelector:
    matchLabels: { app: federation-db }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: hugmesh-federation-api }
        - podSelector:
            matchLabels: { app: hugmesh-admin-bff-api }
      ports:
        - { protocol: TCP, port: 5432 }
---
# ── forum-bff-db (Postgres, hugmesh-backend) ────────────────────────────────
# Consumer: forum-bff-api only (forumbff datasource).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
