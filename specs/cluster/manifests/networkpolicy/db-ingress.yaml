# Per-DB-pod Ingress NetworkPolicies (ADR-32 DB-hardening — network backstop).
#
# tier-ingress.yaml admits the WHOLE owning namespace (+ frontend / ingress) to
# every pod it selects via podSelector:{}. Under tier-ingress ALONE, any pod in
# hugmesh-backend could open a Postgres socket directly to admin-bff-db /
# mod-bff-db / user-bff-db / federation-db / forum-bff-db / wiki-bff-db, and any
# pod in hugmesh-pki (plus the cross-namespace from-set) could reach route-access-db
# and Cassandra — bypassing the BFF / route-access authz that those stores back.
#
# This file is the per-pod backstop that closes that lateral path: each DB pod
# becomes default-deny for Ingress and is reachable ONLY from its real consumers,
# matched by the EXACT pod labels those consumers carry (verified against the
# deployment manifests): the *-bff-api / federation-api pods (app: hugmesh-*)
# and, for route-access-db + Cassandra, the four gateways
# (app.kubernetes.io/instance: hugmesh-*-gateway — same convention used by
# homeserver-isolation.yaml).
#
# IMPORTANT — k8s NetworkPolicy is ADDITIVE (union of all selecting policies); it
# has NO deny/exclude. So this isolation only holds once the BROAD tier-ingress
# policies STOP selecting these DB pods. tier-ingress.yaml (hugmesh-backend +
# hugmesh-pki) was therefore narrowed with a podSelector matchExpressions that
# EXCLUDES the DB pods (app NotIn the set) — mirroring the homeserver NotIn trick.
# This file and tier-ingress.yaml are a PAIR — keep the exclude lists in sync.
#
# CROSS-NAMESPACE: route-access-db + Cassandra live in hugmesh-pki but are
# consumed by gateways/APIs in hugmesh-backend and hugmesh-frontend. A
# NetworkPolicy podSelector only matches pods in the policy's OWN namespace, so
# those cross-namespace consumers are admitted by a combined
# namespaceSelector + podSelector peer (AND within one from-entry) that pins both
# the source namespace AND the source pod label. Same-namespace consumers
# (pki/superadmin gateways) use a plain podSelector.
#
# DEPLOY: ships behind the same MANUAL-sync ArgoCD app as tier-ingress
# (apps/08-networkpolicy) and needs LIVE on-cluster connectivity validation
# (real pod labels + Citus/initdb cross-DB role bootstrap traffic) BEFORE it is
# relied upon. Ships DARK until then.
---
# ── route-access-db (Postgres, hugmesh-pki) ─────────────────────────────────
# Consumers: all four gateways (route-access lookups) + admin-bff-api (route-access
# admin writes via the `admin_bff` role / ROUTE_ACCESS_DB url). be-gateway lives in
# hugmesh-backend, fe-gateway in hugmesh-frontend, pki-gateway +
# superadmin-gateway in hugmesh-pki (self).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: db-ingress-route-access-db
  namespace: hugmesh-pki
  labels: { app: route-access-db, app.kubernetes.io/part-of: hugmesh.systems }
spec:
  podSelector:
    matchLabels: { app: route-access-db }
  policyTypes: [Ingress]
  ingress:
    - from:
        # be-gateway (hugmesh-backend) — route-access lookups.
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: hugmesh-backend } }
          podSelector:
            matchLabels: { app.kubernetes.io/instance: hugmesh-be-gateway }
        # admin-bff-api (hugmesh-backend) — route-access admin writes.
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: hugmesh-backend } }
          podSelector:
            matchLabels: { app: hugmesh-admin-bff-api }
        # fe-gateway (hugmesh-frontend) — route-access lookups.
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: hugmesh-frontend } }
          podSelector:
            matchLabels: { app.kubernetes.io/instance: hugmesh-fe-gateway }
        # pki-gateway (hugmesh-pki, self) — route-access lookups.
        - podSelector:
            matchLabels: { app.kubernetes.io/instance: hugmesh-pki-gateway }
        # superadmin-gateway (hugmesh-pki, self) — route-access lookups.
        - podSelector:
            matchLabels: { app.kubernetes.io/instance: hugmesh-superadmin-gateway }
      ports:
        - { protocol: TCP, port: 5432 }
---
# ── admin-bff-db (Postgres, hugmesh-backend) ────────────────────────────────
# Consumer: admin-bff-api only (adminbff datasource).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: db-ingress-admin-bff-db
  namespace: hugmesh-backend
  labels: { app: admin-bff-db, app.kubernetes.io/part-of: hugmesh.systems }
spec:
  podSelector:
    matchLabels: { app: admin-bff-db }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: hugmesh-admin-bff-api }
      ports:
        - { protocol: TCP, port: 5432 }
---
# ── mod-bff-db (Postgres, hugmesh-backend) ──────────────────────────────────
# Consumer: mod-bff-api only (modbff datasource).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: db-ingress-mod-bff-db
