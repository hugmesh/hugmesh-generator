  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: hugmesh-forum-bff-api }
      ports:
        - { protocol: TCP, port: 5432 }
---
# ── character-forge-bff-db (Postgres, hugmesh-backend) ─────────────────────────
