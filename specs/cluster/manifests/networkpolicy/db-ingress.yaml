  ingress:
    - from:
        - podSelector:
            matchLabels: { app: hugmesh-character-forge-bff-api }
      ports:
        - { protocol: TCP, port: 5432 }
---
# ── wiki-bff-db (Postgres, hugmesh-backend) ─────────────────────────────────
# Consumer: wiki-bff-api only (wikibff datasource).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: db-ingress-wiki-bff-db
  namespace: hugmesh-backend
  labels: { app: wiki-bff-db, app.kubernetes.io/part-of: hugmesh.systems }
