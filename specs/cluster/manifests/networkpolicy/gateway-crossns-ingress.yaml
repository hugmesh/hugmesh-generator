# gateway-crossns-ingress — the CROSS-NAMESPACE gateway hops the tier/per-pod
# policies do not cover.
#
# ── WHY (found 2026-08-26 by the new [gateway-netpol] check, not by reading) ──
# k8s NetworkPolicy is ADDITIVE and has no deny: the moment ANY Ingress policy
# selects a pod, that pod is default-deny and only the union of the selecting
# policies' from-sets can reach it. Three gateway routes were written against pods
# in that state by gateways whose namespace no from-set names, so the route exists,
# the Service resolves, the pod is Ready — and the request dies in the CNI with no
# event, no restart and no pod-side log. A gateway timeout is the only symptom.
#
# Each rule below is the NARROWEST thing that opens exactly one route: one source
# POD label, ANDed with one source NAMESPACE, on ONE port. Deliberately NOT lines in
# tier-ingress.yaml — adding `hugmesh-pki` to the hugmesh-backend tier from-set would
# admit every pki pod (casdoor, route-access-db, headwind, attestation-server,
# harbor…) to every backend pod, which is a far wider grant than any of these routes
# needs. Same shape and same reasoning as superadmin-ui-ingress.yaml.
#
# ⚠ NOT LIVE-VERIFIED. Nothing here has been observed admitting a real connection;
# these are static-derived from the route table + the existing policy set.
---
# ── superadmin-gateway (hugmesh-pki) -> admin-bff-api (hugmesh-backend) ───────
# apps/22-gateway-superadmin.yaml route `superadmin-bff` forwards /bff/superadmin/**
# to https://hugmesh-admin-bff-api.hugmesh-backend:8080. tier-ingress.yaml's
# hugmesh-backend policy selects that pod (so it is default-deny) and its from-set is
# hugmesh-backend / hugmesh-frontend / devops / ingress-nginx — hugmesh-pki is not in
# it, because until the superadmin gateway existed no pki workload called a BFF.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: superadmin-gateway-to-admin-bff
  namespace: hugmesh-backend
  labels: { app: hugmesh-admin-bff-api, app.kubernetes.io/part-of: hugmesh.net }
spec:
  podSelector:
    matchLabels: { app: hugmesh-admin-bff-api }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: hugmesh-pki } }
          podSelector:
            matchLabels: { app.kubernetes.io/instance: hugmesh-superadmin-gateway }
      ports:
        - { protocol: TCP, port: 8080 }
---
# ── superadmin-gateway (hugmesh-pki) -> federation-api (hugmesh-backend) ──────
# apps/22's `superadmin-federation` route forwards /api/federation/** to
# https://hugmesh-federation-api.hugmesh-backend:8080 — the manifest/bundle list the
# superadmin shell reads to mount the service-catalog remote. Same tier-ingress gap.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: superadmin-gateway-to-federation-api
  namespace: hugmesh-backend
  labels: { app: hugmesh-federation-api, app.kubernetes.io/part-of: hugmesh.net }
spec:
  podSelector:
    matchLabels: { app: hugmesh-federation-api }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: hugmesh-pki } }
          podSelector:
            matchLabels: { app.kubernetes.io/instance: hugmesh-superadmin-gateway }
      ports:
        - { protocol: TCP, port: 8080 }
---
# ── fe-gateway (hugmesh-frontend) -> the homeserver mTLS proxies :4443 ────────
# apps/20-gateway-fe.yaml carries four routes onto the homeserver proxies —
# `matrix-cs-api` and `matrix-wellknown` to tuwunel-proxy:4443, `mastodon-client-api`
# and `mastodon-oauth` to akkoma-proxy:4443 — and its own comment there asserts the
# homeservers are "network-isolated (manifests/networkpolicy/homeserver-isolation.yaml)
# and reachable ONLY through the cluster-CA mTLS sidecars, so these target
# tuwunel-proxy:4443 / akkoma-proxy:4443". The mTLS half of that assertion is true
# (HUGMESH_GATEWAY_MTLS_ENABLED=true on this gateway). THE FROM-SET HALF WAS NEVER
# CHECKED: homeserver-isolation.yaml admits be-gateway, mod-bff-api, admin-bff-api,
# user-bff-api and the two admin-sync Jobs, all by SAME-NAMESPACE podSelector — and
# the fe-gateway is in hugmesh-frontend. All four routes were dead.
#
# WHY ADMITTING IS THE RIGHT DIRECTION, and not deleting the routes:
# homeserver-isolation.yaml states its purpose as reaching the homeservers "ONLY from
# the legitimate callers — the be-gateway (user/mod traffic, route-access-gated)…".
# The fe-gateway is that same class of caller: it holds its OWN least-privilege
# route-access role and 20-schema.sql gates every one of these paths under
# `hugmesh-fe-gateway` (/_matrix/** ROLE_MATRIX, /.well-known/matrix/** ROLE_MATRIX,
# /api/v1/** + /api/v2/** + /oauth/** ROLE_MASTODON, each with the MOD/ADMIN
# supersets). Admitting one gateway POD on the proxy port alone does not weaken the
# ban backstop the file exists for: the rest of hugmesh-frontend stays denied, and
# the homeservers' own http ports (akkoma :4000, tuwunel :8008) are NOT opened here
# — only the mTLS sidecar :4443, which still demands a cluster-CA client cert.
#
# ⚠ IF THE OPPOSITE READING IS THE INTENDED ONE — that the fe-gateway must NOT reach
# the homeservers at all — then the fix is to DELETE those four routes from
# apps/20-gateway-fe.yaml and this document, not to keep both. The two artefacts
# contradict each other today; this file picks the reading the route table and the
# route-access seed have both already committed to, and says so out loud so the
# choice can be reversed deliberately rather than discovered again.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fe-gateway-to-homeserver-proxies
  namespace: hugmesh-backend
  labels: { app.kubernetes.io/part-of: hugmesh.net }
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [akkoma, tuwunel]
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: hugmesh-frontend } }
          podSelector:
            matchLabels: { app.kubernetes.io/instance: hugmesh-fe-gateway }
      ports:
        # The mTLS proxy sidecar ONLY. Not :4000 / :8008 — those are the homeservers'
        # own plaintext http ports and stay reachable exactly as before.
        - { protocol: TCP, port: 4443 }
