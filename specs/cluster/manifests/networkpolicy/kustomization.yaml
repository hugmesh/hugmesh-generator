apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - tier-ingress.yaml
  - db-ingress.yaml   # ADR-32 DB-hardening: per-DB-pod (Postgres :5432) + Cassandra (:9042) Ingress policies; paired with tier-ingress NotIn excludes (ships dark, MANUAL-sync, live-validate-only)
  - harbor-ingress.yaml   # Harbor registry per-pod Ingress backstop (be-gateway + hugmesh-image-builds only); paired with the tier-ingress `app: harbor` NotIn exclude
  - superadmin-ui-ingress.yaml   # cross-namespace: the tailnet superadmin-gateway (hugmesh-pki) -> the Service Catalog console pod in hugmesh-frontend, which the hugmesh-frontend tier from-set does not cover
  - homeserver-isolation.yaml
  - gateway-crossns-ingress.yaml   # cross-namespace gateway hops the tier/per-pod policies miss: superadmin-gateway (hugmesh-pki) -> admin-bff-api + federation-api, and fe-gateway -> the homeserver mTLS proxies :4443 (found by [gateway-netpol])
  - casdoor-jwks-ingress.yaml   # JWT validators outside hugmesh-backend -> casdoor :8000 for the in-cluster JWKS fetch: fe-gateway (hugmesh-frontend), owncast-bff, tube-bff (hugmesh-generator#693; pinned by test-bff-jwks-in-cluster.sh)
  - homeserver-egress.yaml   # default-deny egress on akkoma/tuwunel: DNS + akkoma-db + egress-proxy only (domain-lock/no-federation backstop)
  - egress-vpn-interaction.yaml   # per-service opt-in (hugmesh.net/vpn-egress=true) direct egress for the node split-tunnel; PRUNED when egress-vpn is not selected (default-off)
  # tor-onion-marked.yaml is NOT here (hugmesh-generator#617). This app auto-syncs git
  # main with prune+selfHeal, so a file listed here ships on EVERY tracking cluster
  # whatever the image selected — the bake-time prune edits a tree this app never
  # reads. It lives in manifests/networkpolicy-tor behind apps/08b-networkpolicy-tor.yaml
  # (MANUAL sync; the Application file itself is pruned from a build without tor).
  # tests/scripts/test-optional-netpol-autosync.sh fails if an optional-service policy
  # comes back into this list.
  # SHIPS DARK — tier-egress.yaml (tier-wide default-deny EGRESS, CLUSTER-HARDENING-PLAN §B)
  # is INTENTIONALLY NOT listed here. This auto-sync app (apps/08-networkpolicy.yaml) stays
  # INGRESS plus ONE narrow per-pod egress backstop (homeserver-egress.yaml, akkoma/tuwunel/akkoma-db, since 2026-06-11). Everything WIDER than that — tier-egress.yaml AND db-egress.yaml — ships dark below. Default-deny egress is HIGH blast radius (a missed allow black-holes a
  # whole namespace; a wrong devops rule wedges ArgoCD's own reconcile), so it ships dark
  # behind the SEPARATE MANUAL-sync overlay + app:
  #   manifests/networkpolicy-egress/  (its own kustomization, resources: [] by default)
  #   apps/08a-networkpolicy-egress.yaml  (NO `automated:` block — manual sync)
  # ENABLE per-namespace, one at a time, only after LIVE on-cluster validation. DO NOT
  # add tier-egress.yaml to THIS resources: list — keep ingress (auto-sync) and egress
  # (manual, gated) on separate ArgoCD apps so the egress cutover can never auto-apply.
