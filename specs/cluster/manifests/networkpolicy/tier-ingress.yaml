# Tier-level network segmentation (Phase 3). Each app namespace becomes
# default-deny for INGRESS except from the namespaces it actually serves. This
# blocks lateral movement (e.g. snapdragon-games or observability -> snapdragon-pki
# Casdoor/Cassandra). Only Ingress is constrained — egress (incl. DNS) is left
# open so nothing breaks on that axis.
#
# Matched by the auto-applied `kubernetes.io/metadata.name` namespace label.
# NOTE: tier-level (namespace) granularity. Per-app / per-port tightening (e.g.
# only the gateways+admin-bff -> route-access-db:5432) is a follow-up that needs
# the live pod labels + on-cluster connectivity validation — which is also why
# this set ships behind a MANUAL-sync ArgoCD app (apps/08-networkpolicy.yaml).
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tier-ingress
  namespace: snapdragon-pki
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    # casdoor / cassandra / route-access-db / pki-gateway consumers:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: snapdragon-pki } }       # self (pki-gateway -> casdoor/cassandra/headscale)
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: snapdragon-backend } }    # be-gateway + admin-bff -> route-access-db/cassandra/casdoor; headscale-forward -> pki-gateway
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: devops } }                # ArgoCD reconcile
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: ingress-nginx-internal } }# internal facade -> pki-gateway (LAN/VPN)
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tier-ingress
  namespace: snapdragon-backend
spec:
  # EXCLUDES the homeserver (akkoma/tuwunel), their proxy sidecars, and akkoma-db
  # from this BROAD namespace+frontend admittance — they are isolated per-pod by
  # homeserver-isolation.yaml (reachable only from be-gateway + mod-bff + admin-bff
  # + the sync jobs). k8s NetworkPolicy is additive with no exclude, so the broad
  # from-set below MUST NOT select the homeserver pods or it would re-admit the
  # whole namespace + frontend to them. The two app pods carry their proxy sidecar,
  # so excluding app.kubernetes.io/name {akkoma,tuwunel,akkoma-db} covers the proxy
  # ports too. Keep this list in sync with homeserver-isolation.yaml.
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: NotIn
        values: [akkoma, tuwunel, akkoma-db]
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: snapdragon-backend } }    # self (be-gateway -> mastodon/matrix/api; admin-bff -> clickhouse/kafka)
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: snapdragon-frontend } }   # fe-gateway -> be-gateway (/be) + admin-bff (/bff)
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: devops } }                # ArgoCD reconcile
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: ingress-nginx } }         # public facade -> be-gateway
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tier-ingress
  namespace: snapdragon-frontend
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: snapdragon-frontend } }   # self (fe-gateway -> UIs)
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: devops } }                # ArgoCD reconcile
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: ingress-nginx } }         # public facade -> fe-gateway
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tier-ingress
  namespace: snapdragon-games
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    # snapdragon-games also hosts the GAMES-realm Casdoor (casdoor-games) + its
    # Postgres (casdoor-games-pg). The self rule covers the games BFF -> casdoor-games
    # (JWT validation) and casdoor-games -> casdoor-games-pg (intra-namespace DB);
    # the snapdragon-backend rule additionally covers the snapdragon-actions
    # ROLE_GAMES_ADMIN -> admin sync job -> casdoor-games. Egress is left open
    # (see header), so casdoor-games reaching its Postgres needs no egress rule.
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: snapdragon-games } }      # self (games BFF -> casdoor-games; casdoor-games -> casdoor-games-pg)
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: snapdragon-backend } }    # be-gateway -> games workloads; snapdragon-actions sync -> casdoor-games
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: snapdragon-frontend } }   # fe-gateway -> games UI
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: devops } }                # ArgoCD reconcile
