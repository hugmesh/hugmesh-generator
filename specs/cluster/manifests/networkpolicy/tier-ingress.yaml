# Tier-level network segmentation (Phase 3). Each app namespace becomes
# default-deny for INGRESS except from the namespaces it actually serves. This
# blocks lateral movement (e.g. snapdragon-games or observability -> snapdragon-pki
# Casdoor/Cassandra). Only Ingress is constrained — egress (incl. DNS) is left
# open so nothing breaks on that axis.
#
# Matched by the auto-applied `kubernetes.io/metadata.name` namespace label.
# NOTE: tier-level (namespace) granularity. Per-app / per-port tightening (e.g.
# only the gateways+admin-bff -> route-access-db:5432) is a follow-up that needs
# the live pod labels + on-cluster connectivity validation — which is also why
# this set ships behind a MANUAL-sync ArgoCD app (apps/08-networkpolicy.yaml).
#
# ── SSO BFF-JWT-custody internal back-channel (no new policy needed here) ──────
# The relocated SSO login adds an in-cluster HTTP path: user-bff -> admin-bff
# `/bff/internal/**` (account/session + custody/stamp), and gateway -> admin-bff
# `/bff/internal/session/exchange` (the bff_ -> custody-JWT swap). admin-bff-api,
# user-bff-api and be-gateway all live in snapdragon-backend, and admin-bff-api is
# NOT a *-db pod, so it is already admitted by the `snapdragon-backend` self rule
# below — no ingress change is required for this path. (fe-gateway -> admin-bff is
# already covered by the snapdragon-frontend rule.) The app layer still gates the
# surface in depth via admin-bff's InternalTokenWebFilter (mTLS + X-Internal-Token);
# the admin-bff-db / user-bff-db mutual denial is unaffected (db-ingress.yaml pins
# each BFF DB to its own api only — user-bff never reaches admin-bff-DB).
#
# ⚠ EGRESS FOLLOW-UP (for the tier-egress default-deny lane, generator #132 — HELD):
# egress is OPEN today so this path works, but once tier-egress default-deny lands,
# user-bff-api's egress allow-list MUST include admin-bff-api:8080 (and gateway's
# must include admin-bff-api:8080) or the SSO internal call fails closed at that
# flip. Do NOT add a standalone egress policy for it here: selecting a pod with
# policyTypes:[Egress] flips it to default-deny-egress, which would also cut its
# DNS / own-DB / Casdoor egress unless ALL of those are re-allowed — that belongs
# in the #132 egress set, not a one-off file.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tier-ingress
  namespace: snapdragon-pki
spec:
  # EXCLUDES route-access-db + Cassandra from this BROAD namespace admittance —
  # they are isolated per-pod by db-ingress.yaml (reachable only from the gateways
  # + admin-bff-api/federation-api). k8s NetworkPolicy is additive with no exclude,
  # so the broad from-set below MUST NOT select these DB pods or it would re-admit
  # the whole from-set to them (ADR-32 DB-hardening). Keep this NotIn list in sync
  # with db-ingress.yaml. (route-access-db carries `app: route-access-db`;
  # Cassandra carries `app.kubernetes.io/name: cassandra` — two different label
  # keys, so each needs its own NotIn term.)
  podSelector:
    matchExpressions:
      - key: app
        operator: NotIn
        values: [route-access-db]
      - key: app.kubernetes.io/name
        operator: NotIn
        values: [cassandra]
  policyTypes: [Ingress]
  ingress:
    # casdoor / cassandra / route-access-db / pki-gateway / superadmin-gateway consumers.
    # NOTE: the TAILNET superadmin-gateway (apps/22-gateway-superadmin.yaml) deploys
    # into THIS (snapdragon-pki) namespace, so it inherits this default-deny-except
    # policy: it is admitted from ingress-nginx-INTERNAL (the LAN/VPN facade) but NOT
    # from the public ingress-nginx (which is absent from this from-set) — exactly the
    # tailnet-only network lock the App-Store design requires (no public path, no
    # be-gateway forward of the superadmin host).
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: snapdragon-pki } }       # self (pki/superadmin-gateway -> casdoor/cassandra/headscale)
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: snapdragon-backend } }    # be-gateway + admin-bff -> route-access-db/cassandra/casdoor; headscale-forward -> pki-gateway
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: devops } }                # ArgoCD reconcile
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: ingress-nginx-internal } }# internal facade -> pki/superadmin-gateway (LAN/VPN)
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tier-ingress
  namespace: snapdragon-backend
spec:
  # EXCLUDES the homeserver (akkoma/tuwunel), their proxy sidecars, and akkoma-db
  # from this BROAD namespace+frontend admittance — they are isolated per-pod by
  # homeserver-isolation.yaml (reachable only from be-gateway + mod-bff + admin-bff
  # + the sync jobs). k8s NetworkPolicy is additive with no exclude, so the broad
  # from-set below MUST NOT select the homeserver pods or it would re-admit the
  # whole namespace + frontend to them. The two app pods carry their proxy sidecar,
  # so excluding app.kubernetes.io/name {akkoma,tuwunel,akkoma-db} covers the proxy
  # ports too. Keep this list in sync with homeserver-isolation.yaml.
  #
  # ALSO EXCLUDES the five backend BFF/federation Postgres pods (ADR-32 DB-hardening)
  # so the broad namespace+frontend from-set no longer re-admits them — they are
  # isolated per-pod by db-ingress.yaml (each reachable only from its real *-api
  # consumer). The DB pods carry the `app` label (e.g. app: admin-bff-db), distinct
  # from the homeservers' `app.kubernetes.io/name`, so they need their own NotIn
  # term. Keep this list in sync with db-ingress.yaml.
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: NotIn
        values: [akkoma, tuwunel, akkoma-db]
      - key: app
        operator: NotIn
        values: [admin-bff-db, mod-bff-db, user-bff-db, federation-db, forum-bff-db]
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: snapdragon-backend } }    # self (be-gateway -> mastodon/matrix/api; admin-bff -> clickhouse/kafka; user-bff -> admin-bff /bff/internal SSO custody back-channel; gateway -> admin-bff /bff/internal/session/exchange)
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: snapdragon-frontend } }   # fe-gateway -> be-gateway (/be) + admin-bff (/bff)
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: devops } }                # ArgoCD reconcile
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: ingress-nginx } }         # public facade -> be-gateway
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tier-ingress
  namespace: snapdragon-frontend
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: snapdragon-frontend } }   # self (fe-gateway -> UIs)
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: devops } }                # ArgoCD reconcile
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: ingress-nginx } }         # public facade -> fe-gateway
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tier-ingress
  namespace: snapdragon-games
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    # snapdragon-games also hosts the GAMES-realm Casdoor (casdoor-games) + its
    # Postgres (casdoor-games-pg). The self rule covers the games BFF -> casdoor-games
    # (JWT validation) and casdoor-games -> casdoor-games-pg (intra-namespace DB);
    # the snapdragon-backend rule additionally covers the snapdragon-actions
    # ROLE_GAMES_ADMIN -> admin sync job -> casdoor-games. Egress is left open
    # (see header), so casdoor-games reaching its Postgres needs no egress rule.
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: snapdragon-games } }      # self (games BFF -> casdoor-games; casdoor-games -> casdoor-games-pg)
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: snapdragon-backend } }    # be-gateway -> games workloads; snapdragon-actions sync -> casdoor-games
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: snapdragon-frontend } }   # fe-gateway -> games UI
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: devops } }                # ArgoCD reconcile
