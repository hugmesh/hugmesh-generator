# local-path-provisioner — backs cluster PVCs with the x86_64 host's local disks:
# the device disk (/mnt/data) and the attached USB (/mnt/usb). Pinned to the
# amd64 host (the disks live there). StorageClass "snapdragon-local" is the
# cluster default, so ArgoCD (devops) and the stateful apps (postgres, redis,
# cassandra, clickhouse, etcd backups) provision onto these disks.
apiVersion: v1
kind: ServiceAccount
metadata: { name: local-path-provisioner, namespace: devops }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: local-path-provisioner }
rules:
  - apiGroups: [""]
    resources: [nodes, persistentvolumeclaims, configmaps, pods, pods/log]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [persistentvolumes]
    verbs: [get, list, watch, create, patch, update, delete]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  - apiGroups: ["storage.k8s.io"]
    resources: [storageclasses]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: local-path-provisioner }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: local-path-provisioner }
subjects:
  - { kind: ServiceAccount, name: local-path-provisioner, namespace: devops }
---
# NODE-STORAGE: a DaemonSet (not a single Deployment) gated on the node label
# snapdragon.systems/local-path=true. The control-plane (x86 host) ALWAYS carries
# that label (keys-provision _label_control_plane), so the provisioner runs there
# exactly as the old Deployment did — FULL BACK-COMPAT, since the nodePathMap below
# still carries only the DEFAULT_PATH entry. When an operator attaches + registers a
# storage pool on ANOTHER node, the node-agent reconcile (PR6) labels THAT node
# local-path=true and CAS-patches a per-node nodePathMap entry, so a provisioner
# instance comes up there and serves PVs from the attached disk. local-path is a
# per-node provisioner keyed on the PV's selected node, so one instance per
# local-path node is correct (each only ever provisions its own node's PVs under
# WaitForFirstConsumer + the PV's nodeAffinity).
apiVersion: apps/v1
kind: DaemonSet
metadata: { name: local-path-provisioner, namespace: devops }
spec:
  selector: { matchLabels: { app: local-path-provisioner } }
  template:
    metadata: { labels: { app: local-path-provisioner } }
    spec:
      serviceAccountName: local-path-provisioner
      nodeSelector: { snapdragon.systems/local-path: "true" }   # the x86 host + any node-storage node
      securityContext:
        seLinuxOptions:
          type: spc_t
      containers:
        - name: local-path-provisioner
          image: rancher/local-path-provisioner:v0.0.30
          command: [local-path-provisioner, --debug, start, --config, /etc/config/config.json]
          env:
            - { name: POD_NAMESPACE, valueFrom: { fieldRef: { fieldPath: metadata.namespace } } }
          volumeMounts: [{ name: config-volume, mountPath: /etc/config/ }]
      volumes:
        - name: config-volume
          configMap: { name: local-path-config }
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: snapdragon-local
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
    # ── Encryption at rest ────────────────────────────────────────
    # local-path is NOT a CSI driver: it has no encryption parameter of its own.
    # It just creates per-PV directories under /mnt/data (+ /mnt/usb) on the x86
    # host. keys-provision (provision_storage) wraps those data partitions in
    # LUKS2 (aes-xts-plain64, argon2id) BEFORE mounting them, so EVERY PV/PVC
    # carved from this class is encrypted at rest by INHERITANCE from the node
    # disk — the same disk that holds etcd + Vault state. See
    # docs/ENCRYPTION-AT-REST.md.
    snapdragon.systems/encryption-at-rest: "luks2-node-inherited"
provisioner: rancher.io/local-path
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
---
apiVersion: v1
kind: ConfigMap
metadata: { name: local-path-config, namespace: devops }
data:
  # Both the device disk and the attached USB are offered; the provisioner
  # places each PV on one of these paths on the x86 host.
  config.json: |
    {
      "nodePathMap": [
        { "node": "DEFAULT_PATH_FOR_NON_LISTED_NODES", "paths": ["/mnt/data/local-path", "/mnt/usb/local-path"] }
      ]
    }
  setup: |
    #!/bin/sh
    set -eu
    mkdir -m 0777 -p "$VOL_DIR"
  teardown: |
    #!/bin/sh
    set -eu
    rm -rf "$VOL_DIR"
