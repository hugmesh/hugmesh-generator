# HugMesh Spring APIs. Resource servers behind the be-gateway; they trust
# the Casdoor JWT and the External-* identity headers the gateway appends.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hugmesh-api
  namespace: hugmesh-backend
  labels: { app: hugmesh-api, app.kubernetes.io/part-of: hugmesh.net }
spec:
  replicas: 1
  selector: { matchLabels: { app: hugmesh-api } }
  template:
    metadata: { labels: { app: hugmesh-api } }
    spec:
      nodeSelector: { hugmesh.net/backend: "true" }
      # POD-level hardening (replicates the media-poisoner exemplar): CIS K8s
      # 5.2.6 (runAsNonRoot) + 5.7.2 (seccompProfile RuntimeDefault). NIST 800-53
      # AC-6/SC-39, 800-190 §4.5.3. UID 1000 = the unprivileged app user the
      # hugmesh-actions JRE image runs as (same UID the exemplar pins).
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
        seLinuxOptions:
          type: container_t
          level: "s0:c22"
      # ── API-to-API mTLS identity (build-keystore) ───────────────────────────
      # Mirrors the hugmesh-gateway chart's build-keystore initContainer: turns
      # the Vault-PKI-issued, ESO-synced TLS Secret (hugmesh-api-mtls:
      # tls.crt/tls.key/ca.crt — this image is deployed in-cluster as "hugmesh-api")
      # into keystore.p12 (identity) + truststore.p12 (cluster CA) for the
      # server.ssl.* config to REQUIRE a client cert chaining to the cluster CA.
      # Store password generated in-pod, kept only in the tmpfs /stores emptyDir,
      # emitted into application.properties loaded via
      # SPRING_CONFIG_ADDITIONAL_LOCATION — never in git / a Secret / the pod spec.
      initContainers:
        - name: build-keystore
          image: hugmesh/actions:dev
          # CONTAINER-level hardening (audit: pod-only seLinux, no container ctx).
          # CIS K8s 5.2.5 / 5.2.7-5.2.9. The store password is generated here and
          # written ONLY to the /stores tmpfs (already a Memory emptyDir, RW);
          # readOnlyRootFilesystem keeps the rest of the rootfs immutable.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          command: ["/bin/sh", "-ec"]
          args:
            - |
              P="$(openssl rand -base64 24 | tr -d '/+=' | cut -c1-24)"
              openssl pkcs12 -export -inkey /pki/tls.key -in /pki/tls.crt \
                -certfile /pki/ca.crt -name hugmesh-api \
                -out /stores/keystore.p12 -passout "pass:${P}"
              keytool -importcert -noprompt -alias hugmesh-cluster-ca \
                -file /pki/ca.crt -keystore /stores/truststore.p12 \
                -storetype PKCS12 -storepass "${P}"
              # FILENAME IS LOAD-BEARING — do NOT rename this back to
              # application-tls.properties (or any application-<name>.properties).
              # SPRING_CONFIG_ADDITIONAL_LOCATION only adds a SEARCH DIRECTORY; Spring
              # auto-loads a profile-named doc (application-<name>.properties) from it ONLY
              # when a profile literally named <name> is active. No manifest activates a
              # `tls` profile, so the old application-tls.properties was silently never
              # loaded and the store passwords fell back to the packaged application.yml's
              # ${SSL_KEY_STORE_PASSWORD:} -> "" (empty), which cannot open the PKCS12
              # keystore. Plain application.properties loads UNCONDITIONALLY from the
              # additional location, with no profile needed.
              umask 077
              cat > /stores/application.properties <<EOF
              server.ssl.key-store-password=${P}
              server.ssl.trust-store-password=${P}
              EOF
              echo "keystore + truststore + application.properties built"
          volumeMounts:
            - { name: pki,    mountPath: /pki, readOnly: true }
            - { name: stores, mountPath: /stores }
            # keytool/openssl scratch under readOnlyRootFilesystem.
            - { name: tmp,    mountPath: /tmp }
      containers:
        - name: api
          # hugmesh-actions — "Spring Actions for hugmesh hybrid architecture"
          image: hugmesh/actions:dev
          # hugmesh-actions' Dockerfile EXPOSEs 8090 (unlike every other Spring
          # service here, which defaults to 8080) — see application.yml's
          # `server.port: ${PORT:8090}`. The Service below stays on the stable
          # :8080 other manifests reference (apps/20-gateway-be.yaml,
          # charts/hugmesh-gateway/values.yaml) via the named "http" targetPort;
          # only the container-internal port + readinessProbe below need to match
          # where the app actually binds. Identical fix already live in
          # tests/stack/compose.local.yaml (generator#253's review flagged this
          # exact mismatch here too, never actioned until now).
          ports: [{ name: http, containerPort: 8090 }]
          # CONTAINER-level hardening. CIS K8s 5.2.5 / 5.2.7-5.2.9. The JVM needs a
          # writable /tmp (perfdata, JIT scratch) and the RW /stores tmpfs the init
          # container built; everything else is read-only.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          env:
            - { name: SPRING_PROFILES_ACTIVE, value: "casdoor" }
            # ── API-to-API mTLS (server side) ─────────────────────────────────
            # Require a client cert chaining to the cluster CA. Store passwords come
            # from /stores/application.properties (in-pod generated, loaded via
            # SPRING_CONFIG_ADDITIONAL_LOCATION) so they never enter the pod spec.
            # DEPLOY-ORDER: deploy with the gateway/BFF client-cert wave (see PR body).
            - { name: SSL_ENABLED,          value: "true" }
            - { name: SSL_CLIENT_AUTH,      value: "need" }
            - { name: SSL_KEY_STORE,        value: "/stores/keystore.p12" }
            - { name: SSL_KEY_STORE_TYPE,   value: "PKCS12" }
            - { name: SSL_TRUST_STORE,      value: "/stores/truststore.p12" }
            - { name: SSL_TRUST_STORE_TYPE, value: "PKCS12" }
            - { name: SPRING_CONFIG_ADDITIONAL_LOCATION, value: "file:/stores/" }
            # ── Systems Casdoor (org "hugmesh") ───────────────────────────────────
            # The in-cluster systems Casdoor. Its JWKS also backs the actions resource
            # server (application.yml issuer-uri defaults to ${CASDOOR_PLATFORM_URL}).
            - { name: CASDOOR_PLATFORM_URL, value: "http://casdoor.hugmesh-pki.svc.cluster.local:8000" }
            - { name: CASDOOR_PLATFORM_ORG, value: "hugmesh" }
            - { name: CASDOOR_PLATFORM_CLIENT_ID,     valueFrom: { secretKeyRef: { name: casdoor-sync-systems, key: clientId } } }
            - { name: CASDOOR_PLATFORM_CLIENT_SECRET, valueFrom: { secretKeyRef: { name: casdoor-sync-systems, key: clientSecret } } }
            # ── Two-Casdoor sync (GameMasterAdminSyncAction): OFF ─────────────────
            # hugmesh-actions carries a scheduled job that mirrors one systems role into
            # one games role by REPLACING that games role's whole member list every tick.
            # Before hugmesh-actions#21 (merged 2026-11-04) the job had no enable flag, it
            # mapped members by USERNAME, and its update-role body was three fields, which
            # on Casdoor 3.80.0 also sets isEnabled=false and blanks the role's
            # displayName and description (measured 2026-11-04). Pointed at
            # threewizards/admin that strips the games realm's own admins and disables
            # the role. The design (operator, 2026-10-30) has a mesh games admin
            # administer games with the MESH token instead, through the fe-gateway's
            # /games/api/admin/** route, so the mirror is not needed for that path.
            #
            # How it is off, on every image: #21 added GM_SYNC_ENABLED (default false),
            # set explicitly below; an image from before #21 has no such flag, so the
            # other two knobs the job reads are held too. The first tick is scheduled
            # 100 years out, so it never fires in a pod's lifetime, and the games-side
            # client (CASDOOR_GAMES_URL/ORG/CLIENT_ID/CLIENT_SECRET, the casdoor-sync-games
            # Secret) is not handed to the pod at all, so a tick that somehow ran could
            # not reach the games realm. The interval is left alone: a huge interval
            # would still let the first tick run after the initial delay. Do not "fix"
            # the delay with a failing games URL instead: a tick that fails every time
            # trips the shared `casdoor` circuit breaker, which also guards the OIDC
            # default-role probe. hugmesh-backend's tier-egress carries no path to
            # hugmesh-games for the same reason.
            #
            # Turning it on is a deliberate step, on an image that carries #21
            # (reciprocal link, owned `mesh-` role, read-modify-write): set
            # GM_SYNC_ENABLED=true, restore the CASDOOR_GAMES_* block from git history
            # and the backend -> hugmesh-games:8000 egress rule, drop
            # GM_SYNC_INITIAL_DELAY_MS, and set GM_SYNC_SYSTEMS_ROLE to ROLE_GAMES_ADMIN.
            # GM_SYNC_GAMES_ROLE stays unset (#21 refuses a role the realm owns, such as
            # `admin`). The casdoor-sync-games ExternalSecret is kept for that day; no
            # container reads it now.
            - { name: GM_SYNC_ENABLED, value: "false" }
            - { name: GM_SYNC_INITIAL_DELAY_MS, value: "3153600000000" }
          # HTTPS exec probe: client-auth=need rejects a cert-less kubelet httpGet,
          # so curl PRESENTS this pod's client cert and validates the server cert
          # against the cluster CA (--resolve maps the SAN to loopback).
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - >-
                  curl -sf --cert /pki/tls.crt --key /pki/tls.key --cacert /pki/ca.crt
                  --resolve hugmesh-api:8090:127.0.0.1
                  https://hugmesh-api:8090/actuator/health/readiness
            initialDelaySeconds: 20
          resources: { requests: { cpu: 100m, memory: 384Mi }, limits: { cpu: "1", memory: 1Gi } }
          volumeMounts:
            - { name: stores, mountPath: /stores, readOnly: true }
            - { name: pki,    mountPath: /pki,    readOnly: true }
            # readOnlyRootFilesystem:true => the JVM needs a writable /tmp.
            - { name: tmp,    mountPath: /tmp }
      volumes:
        # Vault-PKI-issued mTLS material, synced by ESO (kubernetes.io/tls).
        - name: pki
          secret:
            secretName: hugmesh-api-mtls
        # tmpfs for the assembled PKCS12 stores + the in-pod SSL properties.
        - name: stores
          emptyDir:
            medium: Memory
        # JVM/keytool scratch space under readOnlyRootFilesystem.
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: hugmesh-api
  namespace: hugmesh-backend
spec:
  selector: { app: hugmesh-api }
  ports: [{ name: http, port: 8080, targetPort: http }]
