# ════════════════════════════════════════════════════════════════════════════════
# WORKLOAD CONSOLE — the two console SA token Secrets the admin-bff mounts.
#
# The SAs (serviceaccounts.yaml) set automountServiceAccountToken:false, and a projected
# serviceAccountToken volume can only mint a token for the POD'S OWN ServiceAccount
# (the admin-bff pod runs as backups-effector) — so the ONLY declarative way to hand the
# admin-bff these two identities is a kubernetes.io/service-account-token Secret per SA:
# the control plane's token controller populates `token` + `ca.crt` + `namespace`, and
# the admin-bff deployment overlay (manifests/admin-bff-api/workload-console-patch.yaml)
# mounts them read-only at the CROSS-REPO CONTRACT paths the admin-bff's dual clients
# read (hugmesh-admin-bff-api WorkloadConsoleClientConfig):
#
#   workload-console-read-token    -> /var/run/secrets/workload-console-read/token
#   workload-console-mutate-token  -> /var/run/secrets/workload-console-mutate/token
#
# The superadmin cluster-read SA (clusterread.yaml) deliberately gets NO token Secret
# yet — no shipped client consumes it (the superadmin reads iterate the allowlist via
# the read SA), and an unmounted long-lived token would be pure standing risk.
#
# These live in the SAME pruned-with-the-slug manifest dir as the SAs: deselecting
# workloadConsole removes this file with the rest, so the tokens are never minted.
# ════════════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: Secret
metadata:
  name: workload-console-read-token
  namespace: hugmesh-backend
  labels:
    app.kubernetes.io/name: workload-console
    app.kubernetes.io/component: rbac-read
    app.kubernetes.io/part-of: hugmesh.net
  annotations:
    kubernetes.io/service-account.name: workload-console-read
type: kubernetes.io/service-account-token
---
apiVersion: v1
kind: Secret
metadata:
  name: workload-console-mutate-token
  namespace: hugmesh-backend
  labels:
    app.kubernetes.io/name: workload-console
    app.kubernetes.io/component: rbac-mutate
    app.kubernetes.io/part-of: hugmesh.net
  annotations:
    kubernetes.io/service-account.name: workload-console-mutate
type: kubernetes.io/service-account-token
