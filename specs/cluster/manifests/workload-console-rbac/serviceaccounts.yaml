# ════════════════════════════════════════════════════════════════════════════════
# WORKLOAD CONSOLE — the two least-privilege ServiceAccounts the admin-bff mounts.
#
#   workload-console-read    — the ADMIN/SUPERADMIN READ surface. App-tier ONLY.
#   workload-console-mutate  — the SUPERADMIN RUNTIME_MUTATE/exec surface. App-tier ONLY.
#
# Both live in hugmesh-backend (the admin-bff's namespace) and are bound ONLY in the
# APP-TIER namespaces below — NEVER in hugmesh-pki / hugmesh-policy / vault / devops
# / observability (the infra tiers). The cluster-wide superadmin READ uses a SEPARATE SA
# + ClusterRole in clusterread.yaml.
#
# automountServiceAccountToken:false — the admin-bff mounts the tokens via explicit
# Secret volumes (token-secrets.yaml, mounted by the deployment overlay
# manifests/admin-bff-api/workload-console-patch.yaml), not the default auto-mount, so a
# stray pod in the namespace never silently inherits these tokens. (NOT projected
# serviceAccountToken volumes: those can only mint the POD'S OWN SA's token, and the
# admin-bff pod runs as backups-effector.)
# ════════════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: ServiceAccount
metadata:
  name: workload-console-read
  namespace: hugmesh-backend
  labels:
    app.kubernetes.io/name: workload-console
    app.kubernetes.io/component: rbac-read
    app.kubernetes.io/part-of: hugmesh.net
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: workload-console-mutate
  namespace: hugmesh-backend
  labels:
    app.kubernetes.io/name: workload-console
    app.kubernetes.io/component: rbac-mutate
    app.kubernetes.io/part-of: hugmesh.net
automountServiceAccountToken: false
