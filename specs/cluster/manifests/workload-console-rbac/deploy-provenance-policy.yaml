# ════════════════════════════════════════════════════════════════════════════════
# WORKLOAD CONSOLE — deploy provenance Kyverno policy (DECISION 7).
#
# A console DEPLOY intent (catalog -> GitOps PR) may only land a DIGEST-PINNED image from
# the platform's OWN registry. The admin-bff rejects a tag-only ref at PR-gen time AND the
# 110 changelog has a DB CHECK; this ClusterPolicy is the cluster-admission backstop: any
# Pod/Deployment in an app-tier namespace whose container image is NOT pinned to
# `@sha256:<64 hex>` is REJECTED. Games / App-Store deploys inherit the same gate.
#
# Enforce mode + Fail failurePolicy so a mis-provenanced image is admission-rejected, not
# merely audited. Mirrors the prod-hygiene clusterpolicy.yaml shape.
# ════════════════════════════════════════════════════════════════════════════════
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: workload-console-deploy-digest-pinned
  labels:
    app.kubernetes.io/name: workload-console
    app.kubernetes.io/component: policy
    app.kubernetes.io/part-of: hugmesh.net
spec:
  validationFailureAction: Enforce
  background: true
  failurePolicy: Fail
  rules:
    - name: app-tier-images-digest-pinned
      match:
        any:
          - resources:
              kinds: ["Pod", "Deployment", "StatefulSet", "DaemonSet"]
              namespaces:
                # RUNTIME/CONSOLE DESTINATIONS ONLY — measured, not assumed.
                #
                # This list used to name all seven app tiers, which made the rule
                # far broader than the provenance intent above and, once Kyverno
                # was actually installed (2026-08-22), un-syncable: ArgoCD could
                # no longer apply admin-bff-api, user-bff-api, hugmesh-host-shell
                # or hugmesh-social-ui, because every one of the 53 repo-managed
                # workloads in those tiers is tag-based (0 digest-pinned). The
                # admission webhook denied ArgoCD's own patch.
                #
                # Those tiers are NOT console deploys. They are platform
                # infrastructure defined in specs/cluster/manifests and reviewed
                # as a PR before ArgoCD ever applies them. A console deploy is
                # created at RUNTIME — GameInstanceReconciler writes into
                # hugmesh-games-instances, and the catalog effector points a
                # generated ArgoCD Application at a Kaniko-built digest — which
                # is precisely the input this policy exists to constrain, because
                # it is the only one that never passes through review.
                #
                # Narrowing by namespace rather than by a label is deliberate: the
                # console holds NO create RBAC (its mutate Role grants pods
                # get/list/delete + exec + portforward, nothing more), so console
                # deploys reach the cluster through ArgoCD exactly as platform
                # ones do. There is no in-cluster marker distinguishing them and
                # nothing currently sets one, so a label selector would match
                # NOTHING and report enforcement while enforcing nothing.
                #
                # tests/workload-console/test-workload-console.sh pins the
                # invariant that makes this safe to Enforce: every repo-managed
                # workload in a matched namespace must ITSELF be digest-pinned.
                # Widening this list back to a tier full of tag-based platform
                # workloads fails that check by name.
                - hugmesh-games-instances
      validate:
        message: >-
          App-tier container images must be digest-pinned to the own registry
          (repo@sha256:<64 hex>). A tag-only or foreign-registry image is rejected
          (workload-console deploy provenance — DECISION 7).
        foreach:
          - list: >-
              request.object.spec.containers ||
              request.object.spec.template.spec.containers || `[]`
            deny:
              conditions:
                any:
                  - key: "{{ regex_match('^.+@sha256:[a-f0-9]{64}$', '{{ element.image }}') }}"
                    operator: Equals
                    value: false
