# snapdragon-user-ui — the self-service user Angular micro-frontend remote. Its
# own nginx (own repo + pod) in the snapdragon-frontend namespace, federated into
# the snapdragon.systems host: it serves a remoteEntry.json the host's
# loadRemoteModule consumes, mounted at /user (user role). Talks to user-bff-api
# via the same-origin /bff/user/** fe-gateway route.
# Repo: github.com/Snapdragon-Systems/snapdragon-user-ui
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: snapdragon-user-ui, namespace: snapdragon-frontend, labels: { app: snapdragon-user-ui, app.kubernetes.io/part-of: snapdragon.systems } }
spec:
  replicas: 1
  selector: { matchLabels: { app: snapdragon-user-ui } }
  template:
    metadata: { labels: { app: snapdragon-user-ui } }
    spec:
      nodeSelector: { snapdragon.systems/frontend: "true" }
      securityContext:
        seLinuxOptions:
          type: container_t
          level: "s0:c47"
      containers:
        - name: web
          image: snapdragon-systems/user-ui:dev
          ports: [{ name: http, containerPort: 80 }]
          resources: { requests: { cpu: 50m, memory: 96Mi }, limits: { cpu: 300m, memory: 192Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: snapdragon-user-ui, namespace: snapdragon-frontend }
spec: { selector: { app: snapdragon-user-ui }, ports: [{ name: http, port: 80, targetPort: http }] }
