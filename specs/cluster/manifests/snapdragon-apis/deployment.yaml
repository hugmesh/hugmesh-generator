# Snapdragon Spring APIs. Resource servers behind the be-gateway; they trust
# the Casdoor JWT and the External-* identity headers the gateway appends.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: snapdragon-api
  namespace: snapdragon-backend
  labels: { app: snapdragon-api, app.kubernetes.io/part-of: snapdragon.systems }
spec:
  replicas: 1
  selector: { matchLabels: { app: snapdragon-api } }
  template:
    metadata: { labels: { app: snapdragon-api } }
    spec:
      nodeSelector: { snapdragon.systems/backend: "true" }
      securityContext:
        seLinuxOptions:
          type: container_t
          level: "s0:c22"
      # ── API-to-API mTLS identity (build-keystore) ───────────────────────────
      # Mirrors the snapdragon-gateway chart's build-keystore initContainer: turns
      # the Vault-PKI-issued, ESO-synced TLS Secret (snapdragon-api-mtls:
      # tls.crt/tls.key/ca.crt — this image is deployed in-cluster as "snapdragon-api")
      # into keystore.p12 (identity) + truststore.p12 (cluster CA) for the
      # server.ssl.* config to REQUIRE a client cert chaining to the cluster CA.
      # Store password generated in-pod, kept only in the tmpfs /stores emptyDir,
      # emitted into application-tls.properties loaded via
      # SPRING_CONFIG_ADDITIONAL_LOCATION — never in git / a Secret / the pod spec.
      initContainers:
        - name: build-keystore
          image: snapdragon-systems/actions:dev
          command: ["/bin/sh", "-ec"]
          args:
            - |
              P="$(openssl rand -base64 24 | tr -d '/+=' | cut -c1-24)"
              openssl pkcs12 -export -inkey /pki/tls.key -in /pki/tls.crt \
                -certfile /pki/ca.crt -name snapdragon-api \
                -out /stores/keystore.p12 -passout "pass:${P}"
              keytool -importcert -noprompt -alias snapdragon-cluster-ca \
                -file /pki/ca.crt -keystore /stores/truststore.p12 \
                -storetype PKCS12 -storepass "${P}"
              umask 077
              cat > /stores/application-tls.properties <<EOF
              server.ssl.key-store-password=${P}
              server.ssl.trust-store-password=${P}
              EOF
              echo "keystore + truststore + application-tls.properties built"
          volumeMounts:
            - { name: pki,    mountPath: /pki, readOnly: true }
            - { name: stores, mountPath: /stores }
      containers:
        - name: api
          # snapdragon-actions — "Spring Actions for snapdragon hybrid architecture"
          image: snapdragon-systems/actions:dev
          ports: [{ name: http, containerPort: 8080 }]
          env:
            - { name: SPRING_PROFILES_ACTIVE, value: "casdoor" }
            # ── API-to-API mTLS (server side) ─────────────────────────────────
            # Require a client cert chaining to the cluster CA. Store passwords come
            # from /stores/application-tls.properties (in-pod generated, loaded via
            # SPRING_CONFIG_ADDITIONAL_LOCATION) so they never enter the pod spec.
            # DEPLOY-ORDER: deploy with the gateway/BFF client-cert wave (see PR body).
            - { name: SSL_ENABLED,          value: "true" }
            - { name: SSL_CLIENT_AUTH,      value: "need" }
            - { name: SSL_KEY_STORE,        value: "/stores/keystore.p12" }
            - { name: SSL_KEY_STORE_TYPE,   value: "PKCS12" }
            - { name: SSL_TRUST_STORE,      value: "/stores/truststore.p12" }
            - { name: SSL_TRUST_STORE_TYPE, value: "PKCS12" }
            - { name: SPRING_CONFIG_ADDITIONAL_LOCATION, value: "file:/stores/" }
            # ── Two-Casdoor sync (GameMasterAdminSyncAction) ──────────────────────
            # snapdragon-actions polls TWO independent Casdoor instances and mirrors
            # ONE systems role into ONE games role, one-way (systems -> games), pruning
            # stale members. The ONLY automatic sync is:
            #     ROLE_GAMES_ADMIN (systems)  ->  admin (games)
            # i.e. only systems admins/mods who ALSO hold ROLE_GAMES (= the materialized
            # ROLE_GAMES_ADMIN intersection) become games admins. Granting a user plain
            # ROLE_GAMES does NOT auto-create a games login here; that on-demand
            # provisioning is a separate admin-UI action, not this scheduled job.
            #
            # SYSTEMS side — the in-cluster systems Casdoor (org "snapdragon"). Its
            # JWKS also backs the actions resource server (application.yml issuer-uri
            # defaults to ${CASDOOR_SYSTEMS_URL}).
            - { name: CASDOOR_SYSTEMS_URL, value: "http://casdoor.snapdragon-pki.svc.cluster.local:8000" }
            - { name: CASDOOR_SYSTEMS_ORG, value: "snapdragon" }
            - { name: CASDOOR_SYSTEMS_CLIENT_ID,     valueFrom: { secretKeyRef: { name: casdoor-sync-systems, key: clientId } } }
            - { name: CASDOOR_SYSTEMS_CLIENT_SECRET, valueFrom: { secretKeyRef: { name: casdoor-sync-systems, key: clientSecret } } }
            # GAMES side — the SEPARATE in-cluster games Casdoor (org "threewizards").
            - { name: CASDOOR_GAMES_URL, value: "http://casdoor-games.snapdragon-games.svc.cluster.local:8000" }
            - { name: CASDOOR_GAMES_ORG, value: "threewizards" }
            - { name: CASDOOR_GAMES_CLIENT_ID,     valueFrom: { secretKeyRef: { name: casdoor-sync-games, key: clientId } } }
            - { name: CASDOOR_GAMES_CLIENT_SECRET, valueFrom: { secretKeyRef: { name: casdoor-sync-games, key: clientSecret } } }
            # The single automatic mirror: ROLE_GAMES_ADMIN(systems) -> admin(games).
            - { name: GM_SYNC_SYSTEMS_ROLE, value: "ROLE_GAMES_ADMIN" }
            - { name: GM_SYNC_GAMES_ROLE,   value: "admin" }
          # HTTPS exec probe: client-auth=need rejects a cert-less kubelet httpGet,
          # so curl PRESENTS this pod's client cert and validates the server cert
          # against the cluster CA (--resolve maps the SAN to loopback).
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - >-
                  curl -sf --cert /pki/tls.crt --key /pki/tls.key --cacert /pki/ca.crt
                  --resolve snapdragon-api:8080:127.0.0.1
                  https://snapdragon-api:8080/actuator/health/readiness
            initialDelaySeconds: 20
          resources: { requests: { cpu: 100m, memory: 384Mi }, limits: { cpu: "1", memory: 1Gi } }
          volumeMounts:
            - { name: stores, mountPath: /stores, readOnly: true }
            - { name: pki,    mountPath: /pki,    readOnly: true }
      volumes:
        # Vault-PKI-issued mTLS material, synced by ESO (kubernetes.io/tls).
        - name: pki
          secret:
            secretName: snapdragon-api-mtls
        # tmpfs for the assembled PKCS12 stores + the in-pod SSL properties.
        - name: stores
          emptyDir:
            medium: Memory
---
apiVersion: v1
kind: Service
metadata:
  name: snapdragon-api
  namespace: snapdragon-backend
spec:
  selector: { app: snapdragon-api }
  ports: [{ name: http, port: 8080, targetPort: http }]
