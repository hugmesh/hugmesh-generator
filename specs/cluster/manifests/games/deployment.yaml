# hugmesh.games — scheduled onto the x86_64 GPU worker. Vendor-agnostic
# Mesa/Vulkan: the container gets the host DRI render nodes (/dev/dri) rather
# than a vendor device plugin, so it runs on any amdgpu/i915/nouveau card.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hugmesh-games
  namespace: hugmesh-games
  labels: { app: hugmesh-games, app.kubernetes.io/part-of: hugmesh.net }
spec:
  replicas: 1
  selector: { matchLabels: { app: hugmesh-games } }
  template:
    metadata: { labels: { app: hugmesh-games } }
    spec:
      # Require the x86_64 GPU node (labelled by keys-provision on that image).
      nodeSelector:
        kubernetes.io/arch: amd64
        hugmesh.net/compute: gpu
      securityContext:
        seLinuxOptions:
          type: container_t
          level: "s0:c33"
      containers:
        - name: games
          image: hugmesh/hugmesh.games-backend:dev
          ports: [{ name: http, containerPort: 8080 }]
          env:
            # TWO REALMS, ONE BFF (operator decision 2026-10-30). A games player signs
            # in with a games-realm account (casdoor-games, org "threewizards") and need
            # not be a mesh user; a mesh user with ROLE_GAMES / ROLE_GAMES_ADMIN arrives
            # through the mesh shell carrying the SYSTEMS custody JWT the fe-gateway
            # forwards (iss https://id.hugmesh.net). Both must validate here, and a token
            # from any other issuer must not.
            #
            # These three variables are read by hugmesh-games AFTER its two-realm change
            # (app.tenancy.issuers exists today; app.tenancy.jwks-uris and
            # app.security.games-realm-issuers land with that change). Do not run them
            # on an older image: it would look keys up through OIDC discovery on the
            # public host, and would treat a mesh ROLE_ADMIN as a games admin.
            #
            # APP_TENANCY_ISSUERS: issuer=domain. Both map to ONE domain, so the domain
            # stamp on an upload and the per-domain role check do not depend on which
            # realm the caller signed in through. On a multi-brand cluster map both to
            # that brand's domain. APP_TENANCY_DOMAIN stays unset: the domain comes from
            # the validated `iss`.
            - { name: APP_TENANCY_ISSUERS, value: "https://id.hugmesh.games=default,https://id.hugmesh.net=default" }
            # APP_TENANCY_JWKS_URIS: issuer=in-cluster JWKS. The public issuer hosts need
            # not resolve in the cluster, so nothing here may fall back to discovery.
            # The systems half needs networkpolicy/casdoor-jwks-ingress.yaml
            # (games-bff-to-casdoor-jwks); tests/scripts/test-bff-jwks-in-cluster.sh
            # judges every entry.
            - { name: APP_TENANCY_JWKS_URIS, value: "https://id.hugmesh.games=http://casdoor-games.hugmesh-games.svc.cluster.local:8000/.well-known/jwks,https://id.hugmesh.net=http://casdoor.hugmesh-pki.svc.cluster.local:8000/.well-known/jwks" }
            # Only THIS issuer's `admin` role makes a games admin. A mesh ROLE_ADMIN is
            # not a games admin; a mesh user needs ROLE_GAMES_ADMIN.
            - { name: APP_SECURITY_GAMES_REALM_ISSUERS, value: "https://id.hugmesh.games" }
            # The games-realm Casdoor back-channel: password grant and user directory.
            # The BFF reads these exact names (hugmesh-games backend application.yml).
            - { name: CASDOOR_ENDPOINT, value: "http://casdoor-games.hugmesh-games.svc.cluster.local:8000" }
            - { name: CASDOOR_ORGANIZATION, value: "threewizards" }
            # threewizards-app OAuth2 client — clientId/clientSecret from the ESO-
            # materialized casdoor-games-app Secret (Vault secret/<brand>/casdoor-games).
            - { name: CASDOOR_CLIENT_ID,     valueFrom: { secretKeyRef: { name: casdoor-games-app, key: clientId } } }
            - { name: CASDOOR_CLIENT_SECRET, valueFrom: { secretKeyRef: { name: casdoor-games-app, key: clientSecret } } }
            # Public issuer of the games realm. Every https://id.hugmesh.games on this
            # page is rewritten in lockstep by parameterize_games_domain() in the stage4
            # builders; it MUST match casdoor-games' origin (app-conf-configmap.yaml) or
            # every games-realm token is rejected on its `iss`.
            - { name: CASDOOR_ISSUER_URI, value: "https://id.hugmesh.games" }
            # Mesa picks the best installed driver; force SW only if no GPU.
            - { name: LIBGL_ALWAYS_SOFTWARE, value: "0" }
          resources:
            requests: { cpu: 500m, memory: 1Gi }
            limits:   { cpu: "4",  memory: 4Gi }
          volumeMounts:
            - { name: dri, mountPath: /dev/dri }
          securityContext:
            # /dev/dri render node access for unprivileged GPU use.
            seccompProfile: { type: RuntimeDefault }
      volumes:
        - name: dri
          hostPath: { path: /dev/dri, type: Directory }
---
apiVersion: v1
kind: Service
metadata:
  name: hugmesh-games
  namespace: hugmesh-games
spec:
  selector: { app: hugmesh-games }
  ports: [{ name: http, port: 8080, targetPort: http }]
