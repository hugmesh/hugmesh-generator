apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: snapdragon-pki
resources:
  - pvc.yaml
  - deployment.yaml
  - service.yaml

# The initdb/ directory is materialized into a ConfigMap and mounted into the
# Postgres initdb directory (/docker-entrypoint-initdb.d). The Postgres entrypoint
# runs the files in ALPHABETICAL order on first start (empty data dir):
#   00-hardening.sql  REVOKE PUBLIC + per-DB timeouts + scram password_encryption
#   10-roles.sh       create the per-machine-user LEAST-PRIVILEGE login roles
#                     (admin-bff writer; pki/be/fe-gateway readers) from per-user
#                     Secret passwords in env — never committed
#   20-schema.sql     the gateway_route_access table + canonical seed + the
#                     per-role table GRANTs
#   90-citus.sh       OPT-IN Citus sharding (no-op unless SHARDING_CITUS=on)
configMapGenerator:
  - name: route-access-schema
    files:
      - initdb/00-hardening.sql
      - initdb/10-roles.sh
      - initdb/20-schema.sql
      - initdb/90-citus.sh

# The Deployment references the ConfigMap by its fixed name; keep it stable so
# ArgoCD self-heal does not churn the pod on every apply.
generatorOptions:
  disableNameSuffixHash: true
