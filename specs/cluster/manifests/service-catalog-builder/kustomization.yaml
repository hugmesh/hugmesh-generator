apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Only the namespace + its default-deny NetworkPolicy are ArgoCD-managed. The Kaniko
# build Job is a TEMPLATE (kaniko-build-job.template.yaml) the admin-bff AddService task
# instantiates per build — it is deliberately NOT a resource here (ships dark; nothing runs
# until the effector is enabled and a DOCKERFILE/ZIP deployment is provisioned).
resources:
  - namespace-and-netpol.yaml
