# meshbridge ServiceAccount — per-app identity for the Meshtastic <-> Matrix bridge.
# Part of the per-application identity matrix (docs/SECURITY.md §3): the meshbridge
# Deployment runs as THIS SA and carries the unique MCS level s0:c76, so a
# compromised bridge cannot read another workload's category-isolated volumes nor
# borrow another pod's RBAC. meshbridge needs NO Kubernetes API access (it talks
# only to tuwunel/user-bff/Casdoor over HTTP and to the radios), so no
# Role/RoleBinding is attached — automountServiceAccountToken is disabled
# defence-in-depth.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sa-meshbridge
  namespace: snapdragon-backend
  labels:
    app.kubernetes.io/name: meshbridge
    app.kubernetes.io/part-of: snapdragon.systems
    snapdragon.systems/optional-service: meshbridge
automountServiceAccountToken: false
