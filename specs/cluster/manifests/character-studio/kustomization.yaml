apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: snapdragon-frontend
resources:
  - deployment.yaml
  # HTTPRoute (Gateway API) — INERT until a gateway.networking.k8s.io controller +
  # parent Gateway exist (the live mesh routes via Spring Cloud Gateway; see
  # httproute.yaml). Included so the slug owns its route in one place and the
  # build-time gate prunes it with this dir. kustomize build does NOT require the CRD
  # to be installed, so this renders cleanly today.
  - httproute.yaml

# First-party images pull from the in-cluster GitLab container registry
# (registry.snapdragon.systems = the GitLab chart's hosts.domain default; project
# path = <group>/<repo>). The CI in each repo pushes :<branch> + :<sha>; we track
# the moving :main here for dev. Pulls need the gitlab-registry imagePullSecret
# (ESO-materialized, see manifests/external-secrets). Mirrors user-ui/wiki-ui.
images:
  - name: snapdragon-systems/character-studio-ui
    newName: registry.snapdragon.systems/snapdragon/snapdragon-character-studio-ui
    newTag: main
patches:
  - target: { kind: Deployment }
    patch: |
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: gitlab-registry
