# tuwunel — Matrix homeserver (Rust Conduit/conduwuit fork), replaces Synapse.
# Single binary + embedded RocksDB → far lighter than Synapse on a Pi. Serves the
# Matrix client/server API on :8008 (the be-gateway already routes /_matrix/** and
# the matrix.snapdragon.systems host here). Matrix-spec compatible, so the existing
# snapdragon-matrix-ui keeps working.
#
# ⚠️ VALIDATE ON CLUSTER: confirm the image tag + the exact config keys/env-prefix
# against the tuwunel docs (github.com/matrix-construct/tuwunel) — Conduit-family
# config has churned (CONDUIT_* / CONDUWUIT_* / TUWUNEL_*). This ships a config.toml
# via env to avoid prefix ambiguity. OIDC/Casdoor + Synapse→tuwunel migration are
# follow-ups (Conduit-family OIDC support must be confirmed).
apiVersion: v1
kind: ConfigMap
metadata:
  name: tuwunel-config
  namespace: snapdragon-backend
data:
  tuwunel.toml: |
    [global]
    server_name = "snapdragon.systems"
    address = "0.0.0.0"
    port = 8008
    database_path = "/var/lib/tuwunel"
    database_backend = "rocksdb"
    allow_registration = false
    allow_federation = true
    # The client/server .well-known is served by the gateway host
    # matrix.snapdragon.systems (be-gateway route matrix-wellknown).
    well_known_client = "https://matrix.snapdragon.systems"
    well_known_server = "matrix.snapdragon.systems:443"
    trusted_servers = ["matrix.org"]
    # --- Matrix authority: ROLE_ADMIN = server-admin / ROLE_MOD = room-moderator ---
    # Conduit-family (tuwunel) has NO Synapse-style /_synapse/admin REST API, no
    # OIDC-group->admin auto-promotion, and NO homeserver moderator tier: server
    # admin == membership of the auto-created admin room (#admins:snapdragon.systems).
    # The tuwunel admin bot honours ban/redact/room-management commands from members
    # of that room.
    #   ROLE_ADMIN is mapped to Matrix SERVER admin by reconciling members INTO
    #     #admins (network-wide ban/redact/rooms).
    #   ROLE_MOD is mapped to room-level MODERATOR (power level 50: ban/redact/kick)
    #     in the managed community/public rooms via the admin bot's set-power-level
    #     command — NOT admin-room membership, NOT server admin, NOT PL100. (Since
    #     Conduit-family has no homeserver moderator tier, room PL50 is how mod is
    #     expressed.)
    # See the PostSync Job below (tuwunel-admin-sync). Neither mapping exposes any
    # extra HTTP surface at the be-gateway (so the route-access boundary is unchanged).
    #
    # emergency_password is the break-glass promotion of the @conduit server user.
    # It is NEVER committed: sourced from Vault/ESO into the Secret tuwunel-admin
    # and injected at runtime (TUWUNEL_EMERGENCY_PASSWORD), so this manifest holds
    # intent only. Leave it unset here.
    # emergency_password = "<from Vault/ESO via Secret tuwunel-admin>"
    admin_room_default = "#admins:snapdragon.systems"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tuwunel
  namespace: snapdragon-backend
  labels:
    app.kubernetes.io/name: tuwunel
spec:
  replicas: 1
  strategy: { type: Recreate }   # single RocksDB writer
  selector:
    matchLabels: { app.kubernetes.io/name: tuwunel }
  template:
    metadata:
      labels: { app.kubernetes.io/name: tuwunel }
    spec:
      nodeSelector:
        snapdragon.systems/backend: "true"
      securityContext:
        seLinuxOptions:
          type: container_t
          level: "s0:c32"
      containers:
        - name: tuwunel
          image: ghcr.io/matrix-construct/tuwunel:v1.7.0
          ports:
            - { name: http, containerPort: 8008 }
          env:
            - { name: TUWUNEL_CONFIG, value: /etc/tuwunel/tuwunel.toml }
          volumeMounts:
            - { name: config, mountPath: /etc/tuwunel }
            - { name: data,   mountPath: /var/lib/tuwunel }
          readinessProbe:
            httpGet: { path: /_matrix/client/versions, port: http }
            initialDelaySeconds: 15
            periodSeconds: 15
      volumes:
        - name: config
          configMap: { name: tuwunel-config }
        - name: data
          persistentVolumeClaim: { claimName: tuwunel-data }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tuwunel-data
  namespace: snapdragon-backend
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: tuwunel
  namespace: snapdragon-backend
  labels:
    app.kubernetes.io/name: tuwunel
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: tuwunel
  ports:
    - { name: http, port: 8008, targetPort: http }
