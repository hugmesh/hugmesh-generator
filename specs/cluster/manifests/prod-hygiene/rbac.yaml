# RBAC for the prod-hygiene PreSync hook Job. It needs to READ live signals
# cluster-wide (pods + their specs/labels/images/annotations, across all ns) and
# to exec into the Vault pod for the seal-status probe + run the ephemeral
# seam-probe pods. Least-privilege: read-mostly cluster-wide; pods/exec + create
# scoped to the namespaces it probes (vault for the Vault exec, hugmesh-policy
# for the ephemeral seam-probe curl pods).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prod-hygiene-gate
  namespace: hugmesh-policy
  labels:
    app.kubernetes.io/part-of: hugmesh.systems
    app.kubernetes.io/component: policy
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prod-hygiene-gate-read
  labels:
    app.kubernetes.io/part-of: hugmesh.systems
    app.kubernetes.io/component: policy
rules:
  # Read every pod spec (images, args, labels, the seam-probe annotation) in all
  # namespaces — the runtime signals the gate reasons over.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prod-hygiene-gate-read
  labels:
    app.kubernetes.io/part-of: hugmesh.systems
    app.kubernetes.io/component: policy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prod-hygiene-gate-read
subjects:
  - kind: ServiceAccount
    name: prod-hygiene-gate
    namespace: hugmesh-policy
---
# Vault exec (seal-status probe) — scoped to the vault namespace only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prod-hygiene-gate-vault-exec
  namespace: vault
  labels:
    app.kubernetes.io/part-of: hugmesh.systems
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prod-hygiene-gate-vault-exec
  namespace: vault
  labels:
    app.kubernetes.io/part-of: hugmesh.systems
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prod-hygiene-gate-vault-exec
subjects:
  - kind: ServiceAccount
    name: prod-hygiene-gate
    namespace: hugmesh-policy
---
# Ephemeral seam-probe pods (the `kubectl run --rm` curl) — scoped to
# hugmesh-policy (the gate's own namespace; the probe pods run here).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prod-hygiene-gate-probe
  namespace: hugmesh-policy
  labels:
    app.kubernetes.io/part-of: hugmesh.systems
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "create", "delete", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prod-hygiene-gate-probe
  namespace: hugmesh-policy
  labels:
    app.kubernetes.io/part-of: hugmesh.systems
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prod-hygiene-gate-probe
subjects:
  - kind: ServiceAccount
    name: prod-hygiene-gate
    namespace: hugmesh-policy
