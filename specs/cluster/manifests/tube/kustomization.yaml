apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hugmesh-tube
resources:
  - namespace.yaml
  - deployment.yaml

images:
  - { name: nginx, newName: nginx, newTag: "1.27-alpine" }
  - { name: hugmesh-systems/tube-bff-api, newName: registry.hugmesh.systems/hugmesh/hugmesh-tube-bff-api, newTag: main }
  - { name: hugmesh-systems/tube-ui, newName: registry.hugmesh.systems/hugmesh/hugmesh-tube-ui, newTag: main }
