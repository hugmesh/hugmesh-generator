# LocalTube — tube-bff-api + tube-ui + tube-media Nginx sidecar.
# GPU-gated x86 optional service (DEFAULT-OFF). All containers share one
# Deployment so they co-locate on the amd64 GPU worker (yt-dlp transcoding
# benefits from GPU headroom). tube-media and tube-bff share /var/tube-content
# (emptyDir for dev; swap for a node-pinned PV for persistence).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hugmesh-tube
  namespace: hugmesh-tube
  labels:
    app: hugmesh-tube
    app.kubernetes.io/part-of: hugmesh.net
spec:
  replicas: 1
  selector: { matchLabels: { app: hugmesh-tube } }
  template:
    metadata: { labels: { app: hugmesh-tube } }
    spec:
      # GPU-gated: require the x86_64 GPU worker (labelled by keys-provision).
      nodeSelector:
        kubernetes.io/arch: amd64
        hugmesh.net/compute: gpu
      securityContext:
        seLinuxOptions:
          # c35 collided with casdoor-games; tube->c55 (free).
          type: container_t
          level: "s0:c55"
      containers:
        # ── tube-bff-api — Spring Boot BFF (Google OAuth sync + download queue) ──
        - name: tube-bff-api
          image: hugmesh/tube-bff-api
          ports:
            - { name: bff-http, containerPort: 8080, protocol: TCP }
          env:
            # Systems-realm Casdoor: the signing keys come from CASDOOR_JWKS_URI
            # below; this value is the `iss` claim only.
            # WAS http://casdoor.hugmesh-casdoor.svc.cluster.local:8000 — a namespace
            # that has never existed (casdoor runs in hugmesh-pki) AND the wrong iss:
            # Spring Security validates each JWT's iss claim against this exact value,
            # and casdoor's app.conf sets origin = "https://id.hugmesh.net".
            - { name: CASDOOR_ISSUER_URI, value: "https://id.hugmesh.net" }
            # Key fetch stays IN-CLUSTER: the public issuer host need not resolve
            # here (on kind it does not: hugmesh-generator#693). Same value as the
            # gateway chart's casdoor.jwksUri. This pod lives OUTSIDE hugmesh-backend,
            # so networkpolicy/casdoor-jwks-ingress.yaml admits it to casdoor:8000;
            # pinned by tests/scripts/test-bff-jwks-in-cluster.sh.
            - { name: CASDOOR_JWKS_URI, value: "http://casdoor.hugmesh-pki.svc.cluster.local:8000/.well-known/jwks" }
            - { name: SPRING_R2DBC_URL,
                value: "r2dbc:postgresql://hugmesh-tube-db.hugmesh-tube.svc.cluster.local:5432/tube_bff" }
            # Liquibase's JDBC handle, used once at startup. Its packaged default is
            # tube-bff-db in the DELETED hugmesh-backend namespace; only the R2DBC
            # half had ever been overridden here.
            - { name: SPRING_LIQUIBASE_URL,
                value: "jdbc:postgresql://hugmesh-tube-db.hugmesh-tube.svc.cluster.local:5432/tube_bff" }
            # HMAC key for tube-media signed URLs (ESO -> tube-media-key Secret).
            - { name: TUBE_MEDIA_KEY,
                valueFrom: { secretKeyRef: { name: tube-media-key, key: mediaKey } } }
            # DEK for tube access-token encryption (ESO -> tube-token-dek Secret).
            - { name: TUBE_TOKEN_DEK,
                valueFrom: { secretKeyRef: { name: tube-token-dek, key: dek } } }
            # Google OAuth2 client for YouTube subscription sync.
            - { name: GOOGLE_OAUTH_CLIENT_ID,
                valueFrom: { secretKeyRef: { name: google-oauth, key: clientId } } }
            - { name: GOOGLE_OAUTH_CLIENT_SECRET,
                valueFrom: { secretKeyRef: { name: google-oauth, key: clientSecret } } }
          resources:
            requests: { cpu: 300m, memory: 384Mi }
            limits:   { cpu: "2",  memory: 1Gi }
          volumeMounts:
            - { name: tube-content, mountPath: /var/tube-content }
          securityContext:
            seccompProfile: { type: RuntimeDefault }

        # ── tube-ui — Angular remote micro-frontend ───────────────────────────────
        - name: tube-ui
          image: hugmesh/tube-ui
          ports:
            - { name: ui-http, containerPort: 8080, protocol: TCP }
          resources:
            requests: { cpu: 50m,  memory: 64Mi }
            limits:   { cpu: 200m, memory: 128Mi }
          securityContext:
            seccompProfile: { type: RuntimeDefault }

        # ── tube-media — Nginx sidecar serving signed-URL-gated content ──────────
        # Serves /tube/content/** from /var/tube-content. Every request is decided by
        # an auth_request subrequest to tube-bff-api's GET /bff/tube/media/verify
        # (same pod, 127.0.0.1:8080), which performs the real constant-time HMAC-SHA256
        # + expiry check over (sub, domain, path, exp). nginx holds NO key and makes no
        # authorisation decision of its own. The gateway additionally requires
        # ROLE_TUBE, and the owner two-wall is enforced at SIGN time in tube-bff-api.
        - name: tube-media
          image: nginx
          ports:
            - { name: media-http, containerPort: 8081, protocol: TCP }
          resources:
            requests: { cpu: 50m,  memory: 64Mi }
            limits:   { cpu: 500m, memory: 256Mi }
          volumeMounts:
            - { name: tube-content,    mountPath: /var/tube-content, readOnly: true }
            - { name: tube-media-conf, mountPath: /etc/nginx/conf.d, readOnly: true }
          securityContext:
            seccompProfile: { type: RuntimeDefault }

      volumes:
        - name: tube-content
          emptyDir: {}   # dev default; replace with a node-pinned PVC
        - name: tube-media-conf
          configMap:
            name: tube-media-nginx-conf

---
# tube-media nginx configuration — signed-URL gate, ENFORCED via auth_request.
#
# WAS a stub that only checked `if ($arg_sig = "")`. That is not a signature check:
# it accepts ANY non-empty value, so `?sig=x` served any user's bytes. The HMAC
# verifier already existed and was already permitAll for exactly this purpose
# (tube-bff-api TubeMediaController#verify, GET /bff/tube/media/verify) — nginx just
# never called it. It does now: every request for /tube/content/** is decided by an
# auth_request subrequest to that endpoint, which returns 200 only for an authentic,
# unexpired HMAC over the exact (sub, domain, path, exp) tuple, and an empty-bodied
# 403 for every other case (blank param, unparseable exp, expired, forged).
#
# No HMAC is reimplemented here — nginx has no key and must not have one. The three
# containers share one pod (one network namespace), so the sidecar reaches the BFF on
# 127.0.0.1:8080 without leaving the pod.
apiVersion: v1
kind: ConfigMap
metadata:
  name: tube-media-nginx-conf
  namespace: hugmesh-tube
data:
  default.conf: |
    # tube-bff-api, same pod, same network namespace.
    # Declared as an upstream because proxy_pass below interpolates variables: with a
    # variable in the URL nginx resolves the host at request time and would demand a
    # `resolver`, UNLESS the host names a declared upstream. It does.
    upstream tube_bff_verify {
      server 127.0.0.1:8080;
    }

    server {
      listen 8081;
      server_name _;

      # This sidecar serves exactly one thing. Without this, an unmatched URI would
      # fall through to nginx's compiled-in default root.
      location / {
        return 404;
      }

      # The signed-media gate.
      #
      # The named capture is the SIGNED path — byte-for-byte the `path` the BFF minted
      # the MAC over (TubeMediaTokenService signs "${sub}|${domain}|${path}|${exp}"),
      # i.e. the request URI minus the /tube/content prefix. nginx has already
      # normalised $uri (so ../ cannot survive into the capture), and the character
      # class matches TubeMediaController's PATH_PATTERN allowlist, so no percent-
      # decoding skew can open a gap between what is verified and what is served.
      location ~ ^/tube/content(?<media_path>/[A-Za-z0-9._/-]+)$ {

        # Copy the four signed query parameters into plain variables HERE, in the
        # parent request's rewrite phase (which runs before the access phase that
        # auth_request lives in). $arg_* is read from the request it is evaluated
        # against, and the auth_request subrequest is created with an EMPTY argument
        # string — reading $arg_sig for the first time inside the subrequest would
        # yield "" and hand the verifier a blank signature to reject. The subrequest
        # shares the parent's variable array, so these resolved values do reach it.
        set $media_sig    $arg_sig;
        set $media_exp    $arg_exp;
        set $media_sub    $arg_sub;
        set $media_domain $arg_domain;

        # THE gate. 2xx from the verifier allows; anything else denies. There is no
        # second, weaker path to the bytes below — the alias is only reached after
        # this subrequest returns 200.
        auth_request /__tube_media_verify;

        alias /var/tube-content$media_path;
      }

      # auth_request target. `internal` makes it unreachable from outside nginx, so it
      # cannot be probed as an HMAC oracle directly.
      location = /__tube_media_verify {
        internal;

        # The values are forwarded still percent-encoded exactly as they arrived
        # ($arg_* is NOT decoded by nginx), so the base64url signature survives
        # unchanged and Spring decodes it once, symmetrically with sign().
        proxy_pass http://tube_bff_verify/bff/tube/media/verify?path=$media_path&sig=$media_sig&exp=$media_exp&sub=$media_sub&domain=$media_domain;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        # The subrequest carries no user credential by design: the short-TTL HMAC IS
        # the credential. Strip anything the client sent so a stolen bearer cannot
        # influence the verdict.
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
      }
    }

---
# ── Services ─────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: hugmesh-tube-bff-api
  namespace: hugmesh-tube
spec:
  selector: { app: hugmesh-tube }
  ports:
    - { name: http, port: 8080, targetPort: bff-http }
---
apiVersion: v1
kind: Service
metadata:
  name: hugmesh-tube-ui
  namespace: hugmesh-tube
spec:
  selector: { app: hugmesh-tube }
  ports:
    - { name: http, port: 8080, targetPort: ui-http }
---
apiVersion: v1
kind: Service
metadata:
  name: hugmesh-tube-media
  namespace: hugmesh-tube
spec:
  selector: { app: hugmesh-tube }
  ports:
    - { name: http, port: 8081, targetPort: media-http }
