# Cassandra credentials — ESO/Vault ONLY. NOT dark: the cluster Cassandra has
# ALWAYS required a password.
#
# The bitnami cassandra image (apps/00-cassandra.yaml, chart 12.3.11) defaults
# CASSANDRA_AUTHENTICATOR=PasswordAuthenticator and
# CASSANDRA_AUTHORIZER=CassandraAuthorizer. The first real cluster run proved it:
# every gateway died with "requires authentication
# (org.apache.cassandra.auth.PasswordAuthenticator), but no authenticator
# configured" (docs/KIND-SSO-E2E-FINDINGS.md #5). These Secrets are what makes
# the platform able to speak to its own datastore, so they live in the auto-synced
# ESO config (apps/04-external-secrets-config.yaml) like every other credential —
# NOT in the dark manifests/cassandra-hardening overlay, which now carries only
# the still-unshipped TLS stage.
#
# TWO Vault documents, seeded by scripts/gen-cluster-secrets.sh (online Vault write
# AND the offline USB bundle — both paths, so neither delivery mode is short a key):
#
#   secret/<brand>/cassandra-admin      user, password
#       The superuser. Consumed by the chart itself (dbUser.existingSecret) and by
#       the cassandra-init bootstrap Job. NO application uses it.
#   secret/<brand>/cassandra-app-creds  one password per least-privilege app role
#       admin-bff, pki-gateway, be-gateway, fe-gateway, superadmin-gateway,
#       federation.
#
# NAMESPACE SPLIT IS THE LEAST-PRIVILEGE BOUNDARY. cassandra-app-creds is
# materialized THREE times, and each copy carries ONLY the keys the workloads in
# that namespace legitimately hold:
#   hugmesh-pki        all six  — the bootstrap Job creates all six roles; the pki
#                                 and superadmin gateways also live here.
#   hugmesh-backend    be-gateway, admin-bff, federation.
#   hugmesh-frontend   fe-gateway.
# A copy with every key in every namespace would hand the fe-gateway pod the
# admin-bff WRITE role's password, which is exactly the grant separation
# manifests/cassandra-init/bootstrap-configmap.yaml exists to create.
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cassandra-admin
  namespace: hugmesh-pki
  labels:
    app.kubernetes.io/name: cassandra
    app.kubernetes.io/part-of: hugmesh.net
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: hugmesh-vault
    kind: ClusterSecretStore
  target:
    name: cassandra-admin
    creationPolicy: Owner
  data:
    - secretKey: user
      remoteRef: { key: hugmesh/cassandra-admin, property: user }
    - secretKey: password
      remoteRef: { key: hugmesh/cassandra-admin, property: password }
    # The bitnami chart's dbUser.existingSecret reads the password from the key
    # `cassandra-password` (chart default; the alternative is a keyMapping). Alias
    # it here so ONE Secret satisfies BOTH the chart and the bootstrap Job, which
    # reads `user`/`password`.
    - secretKey: cassandra-password
      remoteRef: { key: hugmesh/cassandra-admin, property: password }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cassandra-app-creds
  namespace: hugmesh-pki
  labels:
    app.kubernetes.io/name: cassandra
    app.kubernetes.io/part-of: hugmesh.net
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: hugmesh-vault
    kind: ClusterSecretStore
  target:
    name: cassandra-app-creds
    creationPolicy: Owner
  data:
    # All six: the bootstrap Job in this namespace CREATES all six roles, so it
    # needs every password. The pki + superadmin gateways read their own key.
    - secretKey: admin-bff
      remoteRef: { key: hugmesh/cassandra-app-creds, property: admin-bff }
    - secretKey: pki-gateway
      remoteRef: { key: hugmesh/cassandra-app-creds, property: pki-gateway }
    - secretKey: be-gateway
      remoteRef: { key: hugmesh/cassandra-app-creds, property: be-gateway }
    - secretKey: fe-gateway
      remoteRef: { key: hugmesh/cassandra-app-creds, property: fe-gateway }
    - secretKey: superadmin-gateway
      remoteRef: { key: hugmesh/cassandra-app-creds, property: superadmin-gateway }
    - secretKey: federation
      remoteRef: { key: hugmesh/cassandra-app-creds, property: federation }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cassandra-app-creds
  namespace: hugmesh-backend
  labels:
    app.kubernetes.io/name: cassandra
    app.kubernetes.io/part-of: hugmesh.net
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: hugmesh-vault
    kind: ClusterSecretStore
  target:
    name: cassandra-app-creds
    creationPolicy: Owner
  data:
    # be-gateway (SELECT), admin-bff-api (SELECT+MODIFY, the registry writer),
    # federation-api (SELECT+MODIFY on its own keyspace) — the three Cassandra
    # consumers in hugmesh-backend. No other key is synced here.
    - secretKey: be-gateway
      remoteRef: { key: hugmesh/cassandra-app-creds, property: be-gateway }
    - secretKey: admin-bff
      remoteRef: { key: hugmesh/cassandra-app-creds, property: admin-bff }
    - secretKey: federation
      remoteRef: { key: hugmesh/cassandra-app-creds, property: federation }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cassandra-app-creds
  namespace: hugmesh-frontend
  labels:
    app.kubernetes.io/name: cassandra
    app.kubernetes.io/part-of: hugmesh.net
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: hugmesh-vault
    kind: ClusterSecretStore
  target:
    name: cassandra-app-creds
    creationPolicy: Owner
  data:
    # fe-gateway only.
    - secretKey: fe-gateway
      remoteRef: { key: hugmesh/cassandra-app-creds, property: fe-gateway }
