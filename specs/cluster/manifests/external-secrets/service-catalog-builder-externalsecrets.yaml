# service-catalog-registry-credentials — the SUPERADMIN Service Catalog Kaniko builder's
# PUSH credential.
#
# ── WHICH NAME, AND WHY (reconciled 2026-10-14) ───────────────────────────────
# Two Kaniko Job templates exist and they used to disagree:
#     this repo : manifests/service-catalog-builder/kaniko-build-job.template.yaml
#     runtime   : hugmesh-admin-bff-api src/main/resources/kaniko/
#                 service-catalog-build-job.template.yaml
# The generator copy is documentation: it is never applied. The RUNTIME copy is the
# one KanikoBuildLauncher loads from the admin-BFF jar and creates a Job from, and it
# mounts
#     volumes:
#       - name: registry-credentials
#         secret:
#           secretName: service-catalog-registry-credentials
#           items: [{ key: config.json, path: config.json }]
# This file used to create `service-catalog-builder-registry` with key
# `.dockerconfigjson`, which the runtime Job never mounts: every name and the
# namespace looked right and a real build would still have wedged. The runtime name
# is the one that must exist, so this ExternalSecret now produces exactly it, and the
# generator template was moved to the same name and key so the two cannot drift
# silently (tests/scripts/test-appstore-effector-flags.sh requires both contracts, and
# requires them to be equal when the admin-BFF checkout is readable).
#
# WHY Opaque + `config.json`, NOT kubernetes.io/dockerconfigjson: Kubernetes
# validates a dockerconfigjson Secret to carry the key `.dockerconfigjson` and
# nothing else; it cannot also carry `config.json`. The runtime Job projects the key
# `config.json` to /kaniko/.docker/config.json, so the Secret is Opaque and its one
# key is the docker config document itself. Kaniko reads the file, not the Secret
# type.
#
# ── WHY THIS FILE EXISTS (observed 2026-08-26) ────────────────────────────────
# The Job mounts that Secret NON-optionally. A `secret:` volume with no
# `optional: true` is a HARD precondition: kubelet will not start the pod until the
# Secret exists. The effector's Job would be CREATED successfully (the API server does
# not validate that a referenced Secret exists), the Job controller would report a
# pod, and that pod would sit in ContainerCreating with FailedMount forever - up to
# its activeDeadlineSeconds: 1800. Not a 4xx the AddService task could surface, not a
# CrashLoopBackOff anyone would notice: a thirty-minute silent hang.
#
# Same Vault path and PUSH-scoped Harbor robot as image-builder-externalsecrets.yaml.
# Only the target namespace, Secret name, Secret type and key differ:
#     image-builder            -> hugmesh-image-builds           / image-builder-registry (dockerconfigjson)
#     service-catalog-builder  -> hugmesh-service-catalog-builds / service-catalog-registry-credentials (Opaque config.json)
#
# WHY THE PUSH ROBOT AND NOT harbor-registry: the per-namespace `harbor-registry`
# imagePullSecret is built from Harbor's PROJECT-scoped PULL robot - it can only PULL.
# Kaniko must PUSH the image it just built, so it needs Harbor's distinct PUSH-scoped
# robot account. manifests/harbor/harbor-provision-job.yaml mints that robot in-cluster
# and writes push_name/push_secret to Vault secret/<brand>/harbor-robots (Harbor reveals
# a robot secret exactly once); ESO here only ever READS them back.
#
# TARGET NAMESPACE: hugmesh-service-catalog-builds, created by the always-on
# apps/54-service-catalog-builder.yaml Application (manifests/service-catalog-builder/
# namespace-and-netpol.yaml), and the value of APPSTORE_BUILDER_NAMESPACE in the
# admin-bff deployment. A pod can only mount a Secret from its own namespace, so
# copying image-builder-externalsecrets.yaml with its `namespace: hugmesh-image-builds`
# reproduces the wedge with every name correct. ESO cannot materialize into a
# namespace that does not exist, so that Application is this credential's precondition.
#
# MATERIALIZING IT STARTS NO BUILD, and does NOT arm the builder.
# APPSTORE_BUILDER_ENABLED stays "false" in admin-bff-api/deployment.yaml. ESO only
# SOURCES the push token; a Kaniko Job runs only when the AddService effector renders
# one, and that path is separately dark.
#
# NOT YET PROVEN, and not provable offline: that the runtime Job's pod is admitted
# (see manifests/service-catalog-builder/README.md "Known gaps before the builder
# flag may flip").
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: service-catalog-registry-credentials
  namespace: hugmesh-service-catalog-builds
  labels:
    app.kubernetes.io/name: service-catalog-builder
    app.kubernetes.io/part-of: hugmesh.net
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: hugmesh-vault
    kind: ClusterSecretStore
  target:
    name: service-catalog-registry-credentials
    creationPolicy: Owner
    template:
      # Opaque, key `config.json`: see the header. The type AND the key name are both
      # load-bearing - the runtime Job's `items` selects exactly this key.
      type: Opaque
      data:
        config.json: |
          {"auths":{"registry.hugmesh.net":{"username":"{{ .username }}","password":"{{ .token }}","auth":"{{ printf "%s:%s" .username .token | b64enc }}"}}}
  data:
    - secretKey: username
      remoteRef: { key: hugmesh/harbor-robots, property: push_name }
    - secretKey: token
      remoteRef: { key: hugmesh/harbor-robots, property: push_secret }
