# service-catalog-builder-registry — the SUPERADMIN Service Catalog Kaniko builder's
# PUSH credential.
#
# ── WHY THIS FILE EXISTS (observed 2026-08-26) ────────────────────────────────
# manifests/service-catalog-builder/kaniko-build-job.template.yaml mounts this Secret
# NON-OPTIONALLY:
#     volumes:
#       - name: docker-config
#         secret:
#           secretName: service-catalog-builder-registry
#           items: [{ key: .dockerconfigjson, path: config.json }]
# A `secret:` volume with no `optional: true` is a HARD precondition: kubelet will not
# start the pod until the Secret exists. Nothing in the tree created it. That is the
# worst failure mode available here, and it is worth being precise about why: the
# effector's Job would be CREATED successfully (the API server does not validate that a
# referenced Secret exists), the Job controller would report a pod, and that pod would
# sit in ContainerCreating with FailedMount forever — up to its
# activeDeadlineSeconds: 1800. Not a 4xx the AddService task could surface to the
# superadmin, not a CrashLoopBackOff anyone would notice: a thirty-minute silent hang
# ending in a deadline. The manifest README already said "ESO-materialized into the
# build namespace — never in git" as though the ExternalSecret existed; it did not.
#
# MIRRORS image-builder-externalsecrets.yaml FIELD FOR FIELD, and deliberately so —
# that file's own header names this one as the matching #110 contract. Same Vault
# path, same PUSH-scoped Harbor robot, same dockerconfigjson template. Only the
# target namespace + Secret name differ, because the two builders run in two
# namespaces:
#     image-builder            -> hugmesh-image-builds          / image-builder-registry
#     service-catalog-builder  -> hugmesh-service-catalog-builds / service-catalog-builder-registry
#
# WHY THE PUSH ROBOT AND NOT harbor-registry: the per-namespace `harbor-registry`
# imagePullSecret is built from Harbor's PROJECT-scoped PULL robot — it can only PULL.
# Kaniko must PUSH the image it just built, so it needs Harbor's distinct PUSH-scoped
# robot account. manifests/harbor/harbor-provision-job.yaml mints that robot in-cluster
# and writes push_name/push_secret to Vault secret/<brand>/harbor-robots (Harbor reveals
# a robot secret exactly once); ESO here only ever READS them back.
#
# TARGET NAMESPACE: hugmesh-service-catalog-builds, created by the always-on
# apps/54-service-catalog-builder.yaml Application (manifests/service-catalog-builder/
# namespace-and-netpol.yaml). ESO cannot materialize into a namespace that does not
# exist, so that Application is this credential's precondition — the identical ordering
# apps/60-image-builder.yaml documents for hugmesh-image-builds.
#
# MATERIALIZING IT STARTS NO BUILD. ESO only SOURCES the push token. A Kaniko Job runs
# only when the admin-bff AddService effector renders + creates one from the template,
# and that effector is itself default-off. This closes a mount precondition; it does not
# lift the feature's dark switch.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: service-catalog-builder-registry
  namespace: hugmesh-service-catalog-builds
  labels:
    app.kubernetes.io/name: service-catalog-builder
    app.kubernetes.io/part-of: hugmesh.net
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: hugmesh-vault
    kind: ClusterSecretStore
  target:
    name: service-catalog-builder-registry
    creationPolicy: Owner
    template:
      # The Job template mounts key `.dockerconfigjson` at /kaniko/.docker/config.json,
      # so the type AND the key name are both load-bearing — Kaniko's DOCKER_CONFIG
      # resolver reads exactly that file.
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"registry.hugmesh.net":{"username":"{{ .username }}","password":"{{ .token }}","auth":"{{ printf "%s:%s" .username .token | b64enc }}"}}}
  data:
    - secretKey: username
      remoteRef: { key: hugmesh/harbor-robots, property: push_name }
    - secretKey: token
      remoteRef: { key: hugmesh/harbor-robots, property: push_secret }
