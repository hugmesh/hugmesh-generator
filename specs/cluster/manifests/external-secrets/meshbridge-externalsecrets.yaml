# meshbridge (Meshtastic <-> Matrix bridge) ExternalSecret — the appservice
# token pair + the Casdoor machine-client credentials (+ optional MQTT broker
# password) in ONE Secret.
#
# SAFE-BY-DEFAULT: this file carries NO literal secret. Everything is
# materialised at runtime by ESO from Vault (secret/hugmesh/meshbridge-appservice).
# The admin/DevOps MUST provision that Vault path at enable time; until then ESO
# leaves the Secret unmaterialised and the meshbridge pod (an OPTIONAL,
# DEFAULT-OFF, RUNTIME-ONLY service) is not deployed anyway — so a default build
# is byte-identical to today's mainline.
#
# THE TOKEN-PAIR CONTRACT: as_token/hs_token are the appservice registration
# pair (generate two long random strings at provision time — they are opaque
# bearer credentials, not derived from anything). The SAME k8s Secret is mounted
# by BOTH the registration Job (meshbridge-register, which posts them to tuwunel
# inside the registration YAML) AND the bridge Deployment (which presents
# as_token on the CS API and verifies hs_token on inbound AS transactions), so
# there is exactly one source of truth (Vault) and no drift between what tuwunel
# knows and what the bridge presents.
#
# THE OIDC-CLIENT CONTRACT: oidc_client_id/oidc_client_secret are a Casdoor
# CLIENT-CREDENTIALS client (the app-signup-gate / app-fragment-sync machine-
# client pattern) authorized for user-bff's ROLE_SERVICE internal surface — the
# bridge mints a SERVICE JWT from them to poll /bff/user/internal/mesh-devices.
# PROVISIONING IS MANUAL: the optional-services registry's casdoorSeed field
# models a per-slug Casdoor INSTANCE (games/casdoor-games), not client seeding,
# and the always-on casdoor-init Job must not carry meshbridge content (the
# service is DEFAULT-OFF). At enable time, create a Casdoor application (e.g.
# app-meshbridge, grantTypes [client_credentials]) bound to ROLE_SERVICE
# (casdoor/init-data-configmap.yaml documents that role's purpose), then write
# its id/secret to the Vault properties below.
#
# mqtt_password is OPTIONAL in spirit (only "mqtt" devices on AUTHENTICATED
# brokers read it — devices.json points at it via passwordFile), but ESO
# materialises the Secret ALL-OR-NOTHING: provision the property as an EMPTY
# string when unused so the Secret still syncs.
#
# NOTE: pattern mirrors coturn-shared-secret / tuwunel-admin (ClusterSecretStore
# hugmesh-vault). Validate against the deployed ESO (apps/03 pins 0.10.5).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: meshbridge-appservice
  namespace: hugmesh-backend
  labels:
    app.kubernetes.io/name: meshbridge
    app.kubernetes.io/part-of: hugmesh.systems
    snapdragon.systems/optional-service: meshbridge
spec:
  # Appservice tokens + the machine-client secret are STATIC long-lived
  # credentials; annual refresh is sufficient (rotate in Vault to roll them —
  # rotating as_token/hs_token also requires re-running the register Job, which
  # every ArgoCD sync does anyway).
  refreshInterval: 8760h
  secretStoreRef:
    name: hugmesh-vault
    kind: ClusterSecretStore
  target:
    name: meshbridge-appservice
    creationPolicy: Owner
  data:
    # The appservice registration pair (bridge <-> tuwunel).
    - secretKey: as_token
      remoteRef:
        key: hugmesh/meshbridge-appservice
        property: as_token
    - secretKey: hs_token
      remoteRef:
        key: hugmesh/meshbridge-appservice
        property: hs_token
    # The Casdoor client-credentials client (SERVICE JWT for user-bff's
    # ROLE_SERVICE internal mesh-devices surface) — manually provisioned, see header.
    - secretKey: oidc_client_id
      remoteRef:
        key: hugmesh/meshbridge-appservice
        property: oidc_client_id
    - secretKey: oidc_client_secret
      remoteRef:
        key: hugmesh/meshbridge-appservice
        property: oidc_client_secret
    # OPTIONAL (authenticated MQTT brokers only; empty string when unused — see
    # header). Surfaced to the pod as /run/secrets/meshbridge/mqtt_password.
    - secretKey: mqtt_password
      remoteRef:
        key: hugmesh/meshbridge-appservice
        property: mqtt_password
---
# ── meshbridge-client-mtls (ns hugmesh-backend) ← Vault-PKI ────────────────
# CLIENT cert the bridge presents to user-bff's internal surface
# (SSL_CLIENT_AUTH=need on :8080) alongside its ROLE_SERVICE bearer — the same
# Vault-PKI → ESO → kubernetes.io/tls pattern as tuwunel-proxy-mtls, but as a
# CLIENT identity. Requires a `meshbridge-client` issuing role in the Vault PKI
# loop (manifests/vault-pki/pki-init-configmap.yaml — provision alongside the
# meshbridge Vault path; until then the Secret never materializes and the pod
# mounts it `optional:` — the user-bff leg degrades to anonymous attribution).
# NOTE when provisioning it: the role name and the Service name DIFFER here
# (role `meshbridge-client`, Service `meshbridge`), so the loop entry is
# `meshbridge-client:meshbridge.hugmesh-backend` — the entry format exists
# precisely for this case. Deriving allowed_domains from the ROLE name would
# allow `meshbridge-client*` and reject every SAN below.
apiVersion: generators.external-secrets.io/v1alpha1
kind: VaultDynamicSecret
metadata: { name: meshbridge-client-mtls, namespace: hugmesh-backend }
spec:
  path: pki_int/issue/meshbridge-client
  method: POST
  parameters:
    common_name: meshbridge.hugmesh-backend.svc.cluster.local
    alt_names: meshbridge,meshbridge.hugmesh-backend
    ttl: "720h"
  resultType: Data
  provider:
    server: https://vault.vault.svc.cluster.local:8200
    caProvider: { type: Secret, name: vault-ca, key: ca.crt }
    auth:
      tokenSecretRef: { name: vault-token, key: token }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata: { name: meshbridge-client-mtls, namespace: hugmesh-backend }
spec:
  refreshInterval: 168h
  target:
    name: meshbridge-client-mtls
    creationPolicy: Owner
    template:
      type: kubernetes.io/tls
      data:
        tls.crt: "{{ .certificate }}"
        tls.key: "{{ .private_key }}"
        ca.crt: "{{ .issuing_ca }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: VaultDynamicSecret
          name: meshbridge-client-mtls
