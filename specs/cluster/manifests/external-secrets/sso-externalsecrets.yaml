# SSO OIDC secrets — user-bff OIDC client credential + custody key +
# the shared BFF internal-token (used for user-bff→admin-bff + gateway→admin-bff
# back-channel authentication via InternalTokenWebFilter / BffSessionAuthFilter).
#
# Vault KV paths seeded by gen-cluster-secrets.sh (create via vault kv put if seeding
# manually):
#   vault kv put secret/<brand>/casdoor-apps          user-bff=<casdoor-client-secret>
#   vault kv put secret/<brand>/user-bff-custody-key  key=<base64-32-byte-aes-key>
#   vault kv put secret/<brand>/bff-internal-token    token=<random-256bit-hex>
#
# NOTE the two different spellings. The `vault kv put` CLI argument INCLUDES the
# KV mount ("secret/"); a `remoteRef.key` below does NOT — ESO prepends the
# ClusterSecretStore's own `provider.vault.path: "secret"` (secretstore.yaml) and
# the KV-v2 `/data/` segment itself. Writing `key: secret/<brand>/x` here made ESO
# look up secret/data/secret/<brand>/x, a path nothing seeds, so all three of these
# ExternalSecrets failed to resolve against a live Vault. Every remoteRef.key in
# this tree is mount-RELATIVE: `<brand>/<doc>`.
#
# The brand-scoped Vault paths match the convention in the Vault PKI init
# configmap and the existing akkoma-admin ExternalSecret pattern. The `<brand>`
# segment is the cluster's canonical brand identifier (e.g. "hugmesh").
#
# For the shared bff-internal-token: the SAME value is mounted in BOTH
# hugmesh-backend (user-bff) and hugmesh-frontend (fe-gateway).
# Two ExternalSecret resources are needed (one per namespace) but they share the
# SAME Vault path so a single `vault kv put` seeds both.
---
# ── user-bff-oidc (ns hugmesh-backend) ──────────────────────────────────────
# The Casdoor OIDC client secret for the user-bff login leg
# (APP_BFF_OIDC_CLIENT_SECRET). Pulled from the same shared casdoor-apps KV
# entry that admin-bff and other apps use — no new Vault path needed.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: user-bff-oidc
  namespace: hugmesh-backend
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: hugmesh-vault
    kind: ClusterSecretStore
  target:
    name: user-bff-oidc
    creationPolicy: Owner
  data:
    - secretKey: client-secret
      remoteRef:
        key: hugmesh/casdoor-apps
        property: user-bff
---
# ── user-bff-custody-key (ns hugmesh-backend) ───────────────────────────────
# The AES-256-GCM data key the BffCustodyCipher uses to encrypt the exchanged
# access + refresh tokens at rest (APP_BFF_CUSTODY_KEY).
# Generate: python3 -c "import os,base64; print(base64.b64encode(os.urandom(32)).decode())"
# Vault: vault kv put secret/hugmesh/user-bff-custody-key key=<base64-32-bytes>
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: user-bff-custody-key
  namespace: hugmesh-backend
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: hugmesh-vault
    kind: ClusterSecretStore
  target:
    name: user-bff-custody-key
    creationPolicy: Owner
  data:
    - secretKey: key
      remoteRef:
        key: hugmesh/user-bff-custody-key
        property: key
---
# ── bff-internal-token (ns hugmesh-backend) ─────────────────────────────────
# Shared internal token for the user-bff→admin-bff back-channel
# (X-Internal-Token, matches admin-bff's InternalTokenWebFilter).
# Generate: python3 -c "import os; print(os.urandom(32).hex())"
# Vault: vault kv put secret/hugmesh/bff-internal-token token=<hex-256bits>
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: bff-internal-token
  namespace: hugmesh-backend
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: hugmesh-vault
    kind: ClusterSecretStore
  target:
    name: bff-internal-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: hugmesh/bff-internal-token
        property: token
---
# ── bff-internal-token (ns hugmesh-frontend) ────────────────────────────────
# The fe-gateway also needs the shared internal token for the
# gateway→admin-bff BffSessionAuthFilter introspection back-channel.
# Same Vault path — one vault kv put seeds both namespaces.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: bff-internal-token
  namespace: hugmesh-frontend
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: hugmesh-vault
    kind: ClusterSecretStore
  target:
    name: bff-internal-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: hugmesh/bff-internal-token
        property: token
