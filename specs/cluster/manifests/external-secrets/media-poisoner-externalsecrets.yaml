# media-poisoner worker mTLS server cert — Vault-PKI -> ESO -> kubernetes.io/tls
# Secret, SAME shape as the homeserver proxy certs (akkoma-externalsecrets.yaml /
# tuwunel-externalsecrets.yaml): a VaultDynamicSecret calls pki_int/issue/
# media-poisoner (role created by vault-pki-init, see
# manifests/vault-pki/pki-init-configmap.yaml) and an ExternalSecret materializes
# the kubernetes.io/tls Secret "media-poisoner-mtls" (tls.crt/tls.key/ca.crt) in
# the worker's namespace.
#
# UNLIKE the akkoma/tuwunel proxy certs (consumed by an nginx SIDECAR), this one
# is mounted straight into the media-poisoner container itself: the worker
# terminates TLS in-process (app/serve.py, POISON_TLS_CERT/POISON_TLS_KEY/
# POISON_TLS_CLIENT_CA env -> PEM paths under the mounted volume) — no sidecar,
# no keystore/truststore build step, just the raw PEMs from this Secret. See
# manifests/media-poisoner/deployment.yaml + manifests/media-poisoner/worker/
# README.md ("mTLS (worker-terminated, optional)").
#
# NOTE: ESO generator CRDs are version-sensitive (generators.external-secrets.io
# /v1alpha1, ESO >=0.9). Validate against the deployed ESO (apps/03 pins 0.10.5).

# ── media-poisoner worker server+client-verify cert (ns snapdragon-backend) ────
apiVersion: generators.external-secrets.io/v1alpha1
kind: VaultDynamicSecret
metadata: { name: media-poisoner-mtls, namespace: snapdragon-backend }
spec:
  path: pki_int/issue/media-poisoner
  method: POST
  parameters:
    common_name: snapdragon-media-poisoner.snapdragon-backend.svc.cluster.local
    alt_names: snapdragon-media-poisoner,snapdragon-media-poisoner.snapdragon-backend
    ttl: "720h"
  resultType: Data
  provider:
    server: https://vault.vault.svc.cluster.local:8200
    auth:
      tokenSecretRef: { name: vault-token, key: token }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata: { name: media-poisoner-mtls, namespace: snapdragon-backend }
spec:
  refreshInterval: 168h
  target:
    name: media-poisoner-mtls
    creationPolicy: Owner
    template:
      type: kubernetes.io/tls
      data:
        tls.crt: "{{ .certificate }}"
        tls.key: "{{ .private_key }}"
        ca.crt: "{{ .issuing_ca }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: VaultDynamicSecret
          name: media-poisoner-mtls
