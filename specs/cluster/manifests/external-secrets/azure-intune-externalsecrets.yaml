# azure-intune-phone-lock — Microsoft Intune (Graph) remote-lock credential for the
# admin-bff phone-lock enforcer. DEFAULT-OFF: Azure Intune is a CO-EQUAL, OPT-IN
# second MDM provider alongside the sovereign self-hosted Headwind DPC. Headwind is
# the DEFAULT; a deployment only reaches this leg when it explicitly sets
# `app.phone-lock.azure-intune.enabled=true` AND enrolls devices with
# `--mdm-provider azure-intune`.
#
# ⚠ SOVEREIGNTY: enabling this ExternalSecret + the azure-intune leg routes device
# management through Microsoft Graph/Intune — a THIRD-PARTY SaaS control plane. That
# FORFEITS the platform's sovereign posture for the affected fleet (a hard Microsoft
# dependency for lock traffic). It ships dark and stays dark unless an operator opts
# in per deployment. The default posture is Headwind (sovereign, no external control
# plane). See docs/MDM.md "MDM providers".
#
# Materialized into the admin-bff env (ns hugmesh-backend). The secretKeys are the
# Spring relaxed-binding ENV form of the admin-bff config keys
# (app.phone-lock.azure-intune.{tenant-id,client-id,client-secret}) so the admin-bff
# Deployment consumes this Secret via `envFrom` (mirrors how the other BFF secrets
# in sso-externalsecrets.yaml feed APP_* env vars). The `enabled` toggle is a
# NON-secret config value (default false, @ConditionalOnProperty) set in the
# Deployment env, NOT sourced from Vault — so a populated Vault path alone never
# silently activates the SaaS leg.
#
# ONE Vault doc, hugmesh/azure-intune (this is a CONFIDENTIAL client-credentials
# Graph app registration — DISJOINT from any Entra OIDC *login* app; different app
# registration, different secret, no shared key):
#   TENANT_ID      — the Entra tenant (directory) GUID
#   CLIENT_ID      — the confidential app registration (client) GUID
#   CLIENT_SECRET  — the app registration's client secret (Graph .default scope,
#                    DeviceManagementManagedDevices.PrivilegedOperations.All for
#                    remoteLock). NEVER on argv, never logged (admin-bff
#                    AzureIntuneLockClient reads it from env only).
#
# Blank-safe: until the Vault path is populated the templated values render empty,
# and with `enabled=false` the admin-bff wires the NoopAzureIntuneLockClient — so a
# default build mounts nothing live. Seed manually with:
#   vault kv put secret/hugmesh/azure-intune \
#     TENANT_ID=<tenant-guid> CLIENT_ID=<app-guid> CLIENT_SECRET=<client-secret>
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: azure-intune-phone-lock
  namespace: hugmesh-backend
  labels:
    app.kubernetes.io/name: admin-bff
    app.kubernetes.io/part-of: hugmesh.net
    hugmesh.net/optional-service: azure-intune
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: hugmesh-vault
    kind: ClusterSecretStore
  target:
    name: azure-intune-phone-lock
    creationPolicy: Owner
    # Env-var-shaped keys (Spring relaxed binding): APP_PHONELOCK_AZUREINTUNE_* map
    # to app.phone-lock.azure-intune.* in the admin-bff PhoneLockProperties.
    template:
      data:
        APP_PHONELOCK_AZUREINTUNE_TENANTID: "{{ .TENANT_ID }}"
        APP_PHONELOCK_AZUREINTUNE_CLIENTID: "{{ .CLIENT_ID }}"
        APP_PHONELOCK_AZUREINTUNE_CLIENTSECRET: "{{ .CLIENT_SECRET }}"
  data:
    - secretKey: TENANT_ID
      remoteRef:
        key: hugmesh/azure-intune
        property: TENANT_ID
    - secretKey: CLIENT_ID
      remoteRef:
        key: hugmesh/azure-intune
        property: CLIENT_ID
    - secretKey: CLIENT_SECRET
      remoteRef:
        key: hugmesh/azure-intune
        property: CLIENT_SECRET
