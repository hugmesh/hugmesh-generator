# Velero object-store credentials — materialized in namespace `velero` from Vault,
# NEVER inline in git. Consumed by:
#   * the Velero server (apps/55-velero.yaml: credentials.existingSecret=
#     velero-cloud-credentials), and
#   * every BackupStorageLocation (manifests/velero/backupstoragelocation.yaml:
#     spec.credential.name=velero-cloud-credentials, key `cloud`).
#
# The AWS/S3 plugin reads an INI credentials FILE from the `cloud` key, so this
# ExternalSecret TEMPLATES that file from two Vault properties (the access key id +
# secret access key) under secret/<brand>/velero. The credential BYTES live ONLY in
# Vault; ESO renders them into the in-cluster Secret at runtime. No key/secret value
# appears in this file or anywhere in the git tree.
#
# Uses ClusterSecretStore hugmesh-vault (Vault KV-v2, token auth) — the SAME
# store every other workload secret uses (see secretstore.yaml). The Vault path
# secret/hugmesh/velero is seeded offline (KEYS/vault/secrets.json) or via the
# superadmin's object-store onboarding; it is NOT created by this manifest.
#
# SHIPS DARK: this ExternalSecret only materializes when the velero namespace
# exists + this file is wired into kustomization.yaml AND the hugmesh/velero
# Vault path is populated. Until a superadmin enables backups (installs Velero +
# provisions the object store + flips the effector flag) it is inert.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: velero-cloud-credentials
  namespace: velero
  labels:
    app.kubernetes.io/part-of: hugmesh.systems
    app.kubernetes.io/managed-by: hugmesh-generator
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: hugmesh-vault
    kind: ClusterSecretStore
  target:
    name: velero-cloud-credentials
    creationPolicy: Owner
    # Render the AWS/S3 INI credentials file under the `cloud` key from the two
    # Vault-sourced properties below. The plugin reads this file; the bytes are
    # never in git, only assembled in-cluster by ESO from Vault.
    template:
      engineVersion: v2
      data:
        cloud: |
          [default]
          aws_access_key_id={{ .accessKeyId }}
          aws_secret_access_key={{ .secretAccessKey }}
  data:
    - secretKey: accessKeyId
      remoteRef: { key: hugmesh/velero, property: access_key_id }
    - secretKey: secretAccessKey
      remoteRef: { key: hugmesh/velero, property: secret_access_key }
