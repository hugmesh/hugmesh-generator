# Velero secrets — materialized in namespace `velero` from Vault, NEVER inline in
# git. TWO ExternalSecrets, one Vault path (secret/hugmesh/velero):
#   1. velero-cloud-credentials — the OBJECT-STORE credential. Consumed by:
#      * the Velero server (apps/55-velero.yaml: credentials.existingSecret=
#        velero-cloud-credentials), and
#      * every BackupStorageLocation (manifests/velero/backupstoragelocation.yaml:
#        spec.credential.name=velero-cloud-credentials, key `cloud`).
#   2. velero-repo-credentials — the kopia repository ENCRYPTION password
#      (second document below). Without it every kopia repo is keyed by
#      upstream's WELL-KNOWN static default.
#
# The AWS/S3 plugin reads an INI credentials FILE from the `cloud` key, so this
# ExternalSecret TEMPLATES that file from two Vault properties (the access key id +
# secret access key) under secret/<brand>/velero. The credential BYTES live ONLY in
# Vault; ESO renders them into the in-cluster Secret at runtime. No key/secret value
# appears in this file or anywhere in the git tree.
#
# Uses ClusterSecretStore hugmesh-vault (Vault KV-v2, token auth) — the SAME
# store every other workload secret uses (see secretstore.yaml). The Vault path
# secret/hugmesh/velero is seeded offline (KEYS/vault/secrets.json) or via the
# superadmin's object-store onboarding; it is NOT created by this manifest.
#
# SHIPS DARK: this ExternalSecret only materializes when the velero namespace
# exists + this file is wired into kustomization.yaml AND the hugmesh/velero
# Vault path is populated. Until a superadmin enables backups (installs Velero +
# provisions the object store + flips the effector flag) it is inert.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: velero-cloud-credentials
  namespace: velero
  labels:
    app.kubernetes.io/part-of: hugmesh.systems
    app.kubernetes.io/managed-by: hugmesh-generator
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: hugmesh-vault
    kind: ClusterSecretStore
  target:
    name: velero-cloud-credentials
    creationPolicy: Owner
    # Render the AWS/S3 INI credentials file under the `cloud` key from the two
    # Vault-sourced properties below. The plugin reads this file; the bytes are
    # never in git, only assembled in-cluster by ESO from Vault.
    template:
      engineVersion: v2
      data:
        cloud: |
          [default]
          aws_access_key_id={{ .accessKeyId }}
          aws_secret_access_key={{ .secretAccessKey }}
  data:
    - secretKey: accessKeyId
      remoteRef: { key: hugmesh/velero, property: access_key_id }
    - secretKey: secretAccessKey
      remoteRef: { key: hugmesh/velero, property: secret_access_key }
---
# Kopia repository ENCRYPTION password — what actually keys the "encrypted
# versioned backups". UPSTREAM CONTRACT (Velero 1.18, verified against
# docs/v1.18/file-system-backup + pkg/repository/keys/keys.go): the server reads
# Secret `velero-repo-credentials`, key `repository-password`, in its install
# namespace. If that Secret does NOT exist when the first BackupRepository is
# initialized, Velero CREATES it itself with the WELL-KNOWN static default
# "static-passw0rd" published in upstream's source — i.e. without this
# ExternalSecret every kopia repo is "encrypted" with a password anyone can read.
# This ES ships with the same dark gates as the rest of the feature (velero ns +
# Vault path populated), and no backup can run before the effector flag flips,
# so materialization always precedes the first repo — the ordering upstream
# requires ("update the secret ... prior to the first backup").
#
# ROTATION CAVEAT (verified upstream): changing this password does NOT re-key or
# re-encrypt existing kopia repositories — "Velero will not be able to connect
# with the older backups". Rotation therefore means a NEW repo (fresh
# bucket/prefix), not an in-place change; see docs/CLOUD-BACKUPS.md.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: velero-repo-credentials
  namespace: velero
  labels:
    app.kubernetes.io/part-of: hugmesh.systems
    app.kubernetes.io/managed-by: hugmesh-generator
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: hugmesh-vault
    kind: ClusterSecretStore
  target:
    name: velero-repo-credentials
    creationPolicy: Owner
  data:
    # `repository-password` is Velero's fixed key name — DO NOT RENAME. Seeded at
    # the same Vault path as the object-store creds (property repo_password) by
    # scripts/gen-cluster-secrets.sh or the manual `vault kv put` step in
    # docs/CLOUD-BACKUPS.md "Turning backups ON".
    - secretKey: repository-password
      remoteRef: { key: hugmesh/velero, property: repo_password }
# ════════════════════════════════════════════════════════════════════════════════
# PER-BRAND OBJECT-STORE CREDENTIALS TEMPLATE (DOMAIN destinations w/ own keys)
# --------------------------------------------------------------------------------
# Mirrors the per-brand BSL template at the bottom of
# manifests/velero/backupstoragelocation.yaml. A superadmin provisions one of
# these per brand whose per-brand BSL uses a DEDICATED bucket/credential instead
# of the shared velero-cloud-credentials (a brand on the shared credential needs
# nothing here). The target Secret name MUST equal the `spec.credential.name`
# the brand's BSL sets — the suggested convention on both sides is
# `velero-cloud-credentials-<BRAND-DESTINATION-REF>`.
#
# Vault path convention: hugmesh/velero-<BRAND-DESTINATION-REF> (the mesh's own
# subtree — per-brand paths like secret/<brand>/velero go nowhere ESO reads).
# Seed access_key_id + secret_access_key there in the same change that sets the
# brand's backup_destination.destination_ref; see docs/CLOUD-BACKUPS.md
# "Per-brand destinations". The kopia repo password stays GLOBAL: Velero 1.18
# keys every repo from the single velero-repo-credentials Secret above — there
# is no per-BSL repo password to template.
