apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# ESO config: the ClusterSecretStore "snapdragon-vault" + one ExternalSecret per
# k8s Secret materialized from Vault. The ESO controller + CRDs themselves are
# installed via Helm (apps/03-external-secrets.yaml).
resources:
  - secretstore.yaml
  # Per-app mTLS certs issued by Vault PKI (pki_int/issue/<app>) and synced into
  # kubernetes.io/tls Secrets <app>-mtls. Requires the Vault PKI engine (set up
  # by apps/06-vault-pki.yaml) + a per-namespace vault-token Secret.
  #
  # ALSO holds the per-DB Postgres server certs (<db>-mtls for route-access-db /
  # admin-bff-db / mod-bff-db / user-bff-db / federation-db / forum-bff-db) added
  # by DB-hardening PR-C1. Those SHIP DARK: the cert is mounted on each PG pod but
  # Postgres is NOT started with ssl=on and no consumer URL sets sslMode yet —
  # flipping ssl=on + sslMode=require is the deferred PR-C2 enablement step.
  - pki-externalsecrets.yaml
  # Homeserver mTLS proxy SERVER certs + homeserver ADMIN tokens backing the gated
  # admin-effect seam. SPLIT PER-SERVICE (was homeserver-proxy-externalsecrets.yaml)
  # so gate_optional_services can remove ONE homeserver's ESO half without orphaning
  # the other's — driven by optional-services.yaml {akkoma,tuwunel}.esoFile. When a
  # slug is deselected the build prunes BOTH its app(s) AND its line here.
  - akkoma-externalsecrets.yaml    # akkoma-proxy-mtls + akkoma-admin
  - tuwunel-externalsecrets.yaml   # tuwunel-proxy-mtls + tuwunel-admin
  # coturn TURN/STUN long-term-credential SHARED SECRET (key `secret`), ESO/Vault
  # only (secret/snapdragon/coturn-shared-secret) — NEVER inline. Materializes only
  # once that Vault path is populated; coturn is DEFAULT-OFF so a default build never
  # mounts it. The SAME Secret is consumed by both coturn (validates client creds)
  # and tuwunel (mints them) so there is one source of truth and no drift.
  - coturn-externalsecrets.yaml    # coturn-shared-secret
  # Velero object-store credentials (ns velero, key `cloud`) — the Velero server +
  # BSL credential, templated from Vault secret/<brand>/velero. ESO/Vault only,
  # never inline. Materializes only once the velero namespace exists + the Vault
  # path is populated (ships dark with the rest of the cloud-backups feature).
  - velero-externalsecrets.yaml    # velero-cloud-credentials
  # image-builder PUSH credential (ns snapdragon-image-builds, dockerconfigjson) —
  # the WRITE_REGISTRY deploy token the in-cluster Kaniko build pipeline uses to push
  # the images it builds (distinct from the gitlab-registry READ_REGISTRY pull secret).
  # ESO/Vault only (secret/<brand>/image-builder-registry); inert until the opt-in
  # apps-optional/60-image-builder.yaml Application creates the namespace (ships dark).
  - image-builder-externalsecrets.yaml   # image-builder-registry
