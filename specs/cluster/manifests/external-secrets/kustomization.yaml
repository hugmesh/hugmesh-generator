apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# ESO config: the ClusterSecretStore "hugmesh-vault" + one ExternalSecret per
# k8s Secret materialized from Vault. The ESO controller + CRDs themselves are
# installed via Helm (apps/03-external-secrets.yaml).
resources:
  - secretstore.yaml
  # Per-app mTLS certs issued by Vault PKI (pki_int/issue/<app>) and synced into
  # kubernetes.io/tls Secrets <app>-mtls. Requires the Vault PKI engine (set up
  # by apps/06-vault-pki.yaml) + a per-namespace vault-token Secret.
  #
  # ALSO holds the per-DB Postgres server certs (<db>-mtls for route-access-db /
  # admin-bff-db / mod-bff-db / user-bff-db / federation-db / forum-bff-db) added
  # by DB-hardening PR-C1. Those SHIP DARK: the cert is mounted on each PG pod but
  # Postgres is NOT started with ssl=on and no consumer URL sets sslMode yet —
  # flipping ssl=on + sslMode=require is the deferred PR-C2 enablement step.
  - pki-externalsecrets.yaml
  # Homeserver mTLS proxy SERVER certs + homeserver ADMIN tokens backing the gated
  # admin-effect seam. SPLIT PER-SERVICE (was homeserver-proxy-externalsecrets.yaml)
  # so gate_optional_services can remove ONE homeserver's ESO half without orphaning
  # the other's — driven by optional-services.yaml {akkoma,tuwunel}.esoFile. When a
  # slug is deselected the build prunes BOTH its app(s) AND its line here.
  - akkoma-externalsecrets.yaml    # akkoma-proxy-mtls + akkoma-admin
  - tuwunel-externalsecrets.yaml   # tuwunel-proxy-mtls + tuwunel-admin
  # media-poisoner worker mTLS server+client-verify cert (media-poisoner-mtls).
  # SAME Vault-PKI -> ESO -> kubernetes.io/tls shape as the homeserver proxy
  # certs above, but mounted straight into the worker container itself (no
  # sidecar) — see manifests/media-poisoner/deployment.yaml.
  - media-poisoner-externalsecrets.yaml   # media-poisoner-mtls
  # Harbor registry server cert (harbor-mtls) — SAME Vault-PKI -> ESO shape as
  # media-poisoner above, consumed by apps/03a-harbor.yaml's expose.tls.
  - harbor-externalsecrets.yaml   # harbor-mtls
  # Headwind MDM (managed phones) — DEFAULT-OFF optional-service (slug
  # headwind, optional-services.yaml). TWO ExternalSecrets (headwind-db-auth /
  # headwind-admin) from ONE Vault path (secret/<brand>/headwind) — OWNER role
  # only, VERIFIED not separable from runtime (hmdm shares one datasource for
  # migrate+runtime; see headwind-db.yaml). Deselecting headwind prunes THIS
  # line + the file via gate_optional_services(), same mechanism as
  # akkoma/tuwunel above.
  - headwind-externalsecrets.yaml   # headwind-db-auth, headwind-admin
  # AttestationServer (GrapheneOS Hardware Trust Root) — DEFAULT-OFF optional-
  # service (slug attestation-server, optional-services.yaml). ONE ExternalSecret
  # (attestation-server-smtp) reusing the EXISTING shared outbound-mail Vault doc
  # (secret/<brand>/mail) — same document casdoor-smtp/akkoma-smtp already
  # read; no new Vault path. Deselecting attestation-server prunes THIS line +
  # the file via gate_optional_services(), same mechanism as headwind above.
  - attestation-server-externalsecrets.yaml   # attestation-server-smtp
  # coturn TURN/STUN long-term-credential SHARED SECRET (key `secret`), ESO/Vault
  # only (secret/<brand>/coturn-shared-secret) — NEVER inline. Materializes only
  # once that Vault path is populated; coturn is DEFAULT-OFF so a default build never
  # mounts it. The SAME Secret is consumed by both coturn (validates client creds)
  # and tuwunel (mints them) so there is one source of truth and no drift.
  - coturn-externalsecrets.yaml    # coturn-shared-secret
  # Velero object-store credentials (ns velero, key `cloud`) — the Velero server +
  # BSL credential — PLUS the kopia repository ENCRYPTION password
  # (velero-repo-credentials, key `repository-password`; absent = upstream's
  # well-known static default keys every repo). Both templated from Vault
  # secret/<brand>/velero. ESO/Vault only, never inline. Materializes only once
  # the velero namespace exists + the Vault path is populated (ships dark with
  # the rest of the cloud-backups feature).
  - velero-externalsecrets.yaml    # velero-cloud-credentials, velero-repo-credentials
  # image-builder PUSH credential (ns hugmesh-image-builds, dockerconfigjson) —
  # now sourced from the Harbor PUSH-scoped robot account (distinct from the
  # harbor-registry pull-scoped robot secret above) that
  # manifests/harbor/harbor-provision-job.yaml mints and writes to
  # secret/<brand>/harbor-robots (push_name/push_secret). ESO/Vault only;
  # materializes once the always-on apps/60-image-builder.yaml Application
  # has created the namespace.
  - image-builder-externalsecrets.yaml   # image-builder-registry
  # SUPERADMIN Service Catalog Kaniko builder PUSH credential (ns
  # hugmesh-service-catalog-builds, Opaque config.json - the runtime Job's mount) — the SAME Harbor push robot as
  # the line above, in the OTHER build namespace. Its Job template
  # (manifests/service-catalog-builder/kaniko-build-job.template.yaml) mounts the
  # Secret NON-optionally, so without this the build pod hangs in ContainerCreating
  # until activeDeadlineSeconds rather than failing. Materializes once
  # apps/54-service-catalog-builder.yaml has created the namespace.
  - service-catalog-builder-externalsecrets.yaml   # service-catalog-registry-credentials
  # admin-bff APP-STORE effector bearer tokens (ns hugmesh-backend, key
  # argocd-auth-token + federation-auth-token) - OPERATOR-SEEDED from
  # secret/<brand>/appstore-effector-tokens; consumed as optional secretKeyRefs, so the
  # path being unseeded leaves the BFF exactly as it is today (empty Bearer).
  - appstore-effector-externalsecrets.yaml   # appstore-effector-tokens
  # Azure Intune (Graph) phone-lock credential — DEFAULT-OFF, OPT-IN. Intune is a
  # CO-EQUAL second MDM provider alongside the sovereign self-hosted Headwind DPC;
  # Headwind is the DEFAULT. This leg routes lock traffic through Microsoft
  # Graph/Intune (a third-party SaaS control plane) — enabling it FORFEITS the
  # sovereign posture for the affected fleet. Left COMMENTED OUT so a default build
  # never renders it: an operator uncomments this line AND sets
  # app.phone-lock.azure-intune.enabled=true on admin-bff to opt in. See
  # docs/MDM.md "MDM providers" + azure-intune-externalsecrets.yaml's header.
  # - azure-intune-externalsecrets.yaml   # azure-intune-phone-lock (ns hugmesh-backend)
  # SSO OIDC secrets — user-bff OIDC client credential (user-bff-oidc, ns
  # hugmesh-backend) + token custody key (user-bff-custody-key, ns
  # hugmesh-backend) + shared BFF back-channel token (bff-internal-token,
  # in BOTH hugmesh-backend AND hugmesh-frontend for gateway→admin-bff
  # BffSessionAuthFilter). Vault paths: secret/<brand>/user-bff-oidc,
  # secret/<brand>/user-bff-custody-key, secret/<brand>/bff-internal-token.
  - sso-externalsecrets.yaml
  # Cassandra superuser (cassandra-admin, ns hugmesh-pki — also consumed by the
  # chart's dbUser.existingSecret) + the per-app least-privilege role passwords
  # (cassandra-app-creds, materialized separately into hugmesh-pki /
  # hugmesh-backend / hugmesh-frontend with only that namespace's keys). Vault
  # paths: secret/<brand>/cassandra-admin, secret/<brand>/cassandra-app-creds.
  # NOT optional: the cluster Cassandra runs PasswordAuthenticator by image
  # default, so without these nothing can open a CqlSession at all.
  - cassandra-externalsecrets.yaml

# ── THE VAULT BASE SEGMENT (issue #285, decision 38 = B on #347) ──────────────
# Every remoteRef key here is `<base>/<doc>`, and <base> must equal the segment the
# WRITER uses — scripts/gen-cluster-secrets.sh writes under BASE="${BRAND:-hugmesh}".
# ArgoCD serves this directory from GIT (apps/04-external-secrets-config.yaml), never
# from the device's baked tree, so the base cannot be moved by a builder sed over
# /var/lib/hugmesh/cluster/manifests — nothing reads that copy. It moves HERE, at
# render time: the ClusterSecretStore's platform.hugmesh.net/vault-base annotation is
# the single value surface, apps/04 patches it, and rebrand_sysroot() rewrites that
# patch to <BRAND>. With the default annotation ("hugmesh") this block is a byte
# no-op — measured, and pinned by tests/scripts/test-eso-remoteref-brand.sh.
#
# WHY THE `reject` LIST: kustomize ERRORS ("unable to find field") when a selected
# resource has no spec.data at all, so the 28 ExternalSecrets that use `dataFrom`
# must be named out. That is FAIL-CLOSED on purpose — a new dataFrom-only
# ExternalSecret breaks the render loudly in CI instead of silently keeping the
# literal `hugmesh/` base while the writer moves. Add it to this list (and, if it
# carries a `dataFrom[].extract.key`, to a target below like casdoor-app-secrets).
replacements:
  - source:
      group: external-secrets.io
      kind: ClusterSecretStore
      name: hugmesh-vault
      fieldPath: metadata.annotations.[platform.hugmesh.net/vault-base]
    targets:
      # (a) every ExternalSecret that carries spec.data[].remoteRef.key — 121 of the
      #     124 base-bearing fields in the default render.
      - select:
          group: external-secrets.io
          kind: ExternalSecret
        reject:
          - name: admin-bff-db-mtls
          - name: akkoma-proxy-mtls
          - name: casdoor-app-secrets
          - name: character-forge-bff-db-mtls
          - name: federation-db-mtls
          - name: forum-bff-db-mtls
          - name: harbor-mtls
          - name: hugmesh-admin-bff-api-mtls
          - name: hugmesh-api-mtls
          - name: hugmesh-be-gateway-mtls
          - name: hugmesh-character-forge-bff-api-mtls
          - name: hugmesh-fe-gateway-mtls
          - name: hugmesh-federation-api-mtls
          - name: hugmesh-forum-bff-api-mtls
          - name: hugmesh-mesh-bff-api-mtls
          - name: hugmesh-mod-bff-api-mtls
          - name: hugmesh-pki-gateway-mtls
          - name: hugmesh-superadmin-gateway-mtls
          - name: hugmesh-user-bff-api-mtls
          - name: hugmesh-wiki-bff-api-mtls
          - name: media-poisoner-mtls
          - name: mesh-bff-db-mtls
          - name: mod-bff-db-mtls
          - name: phpbb-secrets
          - name: route-access-db-mtls
          - name: tuwunel-proxy-mtls
          - name: user-bff-db-mtls
          - name: wiki-bff-db-mtls
        fieldPaths:
          - spec.data.*.remoteRef.key
        options:
          delimiter: "/"
          index: 0
      # (b) the two `dataFrom[].extract.key` shapes (3 fields). The other 26
      #     dataFrom users are VaultDynamicSecret generatorRefs and carry no KV path.
      - select:
          group: external-secrets.io
          kind: ExternalSecret
          name: casdoor-app-secrets
        fieldPaths:
          - spec.dataFrom.*.extract.key
        options:
          delimiter: "/"
          index: 0
      - select:
          group: external-secrets.io
          kind: ExternalSecret
          name: phpbb-secrets
        fieldPaths:
          - spec.dataFrom.*.extract.key
        options:
          delimiter: "/"
          index: 0
