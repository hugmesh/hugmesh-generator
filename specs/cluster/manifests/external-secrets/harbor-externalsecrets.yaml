# Harbor mTLS server cert — Vault-PKI -> ESO -> kubernetes.io/tls Secret, SAME
# shape as media-poisoner-externalsecrets.yaml: a VaultDynamicSecret calls
# pki_int/issue/harbor (role added by vault-pki-init, see
# manifests/vault-pki/pki-init-configmap.yaml) and an ExternalSecret
# materializes the kubernetes.io/tls Secret "harbor-mtls" (tls.crt/tls.key/
# ca.crt) in the hugmesh-pki namespace.
#
# Consumed by apps/03a-harbor.yaml's Helm values (expose.tls.secret.secretName:
# harbor-mtls) — the chart's bundled nginx front-end terminates TLS with it.
#
# NOTE: ESO generator CRDs are version-sensitive (generators.external-secrets.io
# /v1alpha1, ESO >=0.9). Validate against the deployed ESO (apps/03 pins 0.10.5).

# ── Harbor server cert (ns hugmesh-pki) ──────────────────────────────────
apiVersion: generators.external-secrets.io/v1alpha1
kind: VaultDynamicSecret
metadata: { name: harbor-mtls, namespace: hugmesh-pki }
spec:
  path: pki_int/issue/harbor
  method: POST
  parameters:
    common_name: harbor.hugmesh-pki.svc.cluster.local
    alt_names: harbor,harbor-core,harbor-core.hugmesh-pki,harbor-core.hugmesh-pki.svc.cluster.local,registry.hugmesh.net
    ttl: "720h"
  resultType: Data
  provider:
    server: https://vault.vault.svc.cluster.local:8200
    caProvider: { type: Secret, name: vault-ca, key: ca.crt }
    auth:
      tokenSecretRef: { name: vault-token, key: token }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata: { name: harbor-mtls, namespace: hugmesh-pki }
spec:
  refreshInterval: 168h
  target:
    name: harbor-mtls
    creationPolicy: Owner
    template:
      type: kubernetes.io/tls
      data:
        tls.crt: "{{ .certificate }}"
        tls.key: "{{ .private_key }}"
        ca.crt: "{{ .issuing_ca }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: VaultDynamicSecret
          name: harbor-mtls
