# coturn (TURN/STUN server) ExternalSecret — the long-term-credential SHARED
# SECRET that authenticates Matrix WebRTC clients to the relay.
#
# SAFE-BY-DEFAULT: this file carries NO literal secret. The static-auth-secret is
# materialised at runtime by ESO from Vault (secret/hugmesh/coturn-shared-secret,
# property "secret"). The admin/DevOps MUST provision that Vault path at bootstrap;
# until then ESO leaves the Secret unmaterialised and the coturn pod (an OPTIONAL,
# DEFAULT-OFF service) is not deployed anyway — so a default build is byte-identical
# to today's mainline.
#
# THE SHARED-SECRET CONTRACT: coturn runs in REST long-term-credential mode
# (use-auth-secret=true + static-auth-secret=<this>). tuwunel (the Matrix
# homeserver, same namespace hugmesh-backend) is handed the SAME secret as its
# `turn_secret` so the time-limited username:password it mints for clients
# (advertised via GET /_matrix/client/v3/voip/turnServer) validate against coturn.
# BOTH services therefore mount THIS ONE k8s Secret (coturn-shared-secret, key
# `secret`); there is exactly one source of truth (Vault) and no drift.
#
# NOTE: pattern mirrors akkoma-admin / tuwunel-admin (ClusterSecretStore
# hugmesh-vault). Validate against the deployed ESO (apps/03 pins 0.10.5).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: coturn-shared-secret
  namespace: hugmesh-backend
  labels:
    app.kubernetes.io/name: coturn
    app.kubernetes.io/part-of: hugmesh.systems
    hugmesh.systems/optional-service: coturn
spec:
  # The TURN long-term-credential shared secret is a STATIC long-lived secret;
  # annual refresh is sufficient (rotate in Vault to roll it).
  refreshInterval: 8760h
  secretStoreRef:
    name: hugmesh-vault
    kind: ClusterSecretStore
  target:
    name: coturn-shared-secret
    creationPolicy: Owner
  data:
    - secretKey: secret
      remoteRef:
        key: hugmesh/coturn-shared-secret
        property: secret
