# Akkoma (Mastodon) homeserver ExternalSecrets — SPLIT OUT of the former shared
# homeserver-proxy-externalsecrets.yaml so removing akkoma (gate_optional_services)
# deletes ONLY this file and never orphans tuwunel's half (which lives in
# tuwunel-externalsecrets.yaml). See specs/cluster/optional-services.yaml
# (akkoma.esoFile) + docs/OPTIONAL-SERVICES.md.
#
# Three secrets:
#  (A) akkoma-proxy-mtls — SERVER cert for the akkoma-proxy nginx mTLS sidecar
#      (manifests/akkoma). Same Vault-PKI -> ESO -> kubernetes.io/tls pattern as
#      pki-externalsecrets.yaml. Requires the akkoma-proxy issuing role in the
#      Vault PKI loop (manifests/vault-pki/pki-init-configmap.yaml).
#  (B) akkoma-admin — privileged akkoma/Pleroma admin bearer for the suspend/
#      unsuspend admin EFFECT (mod-bff doBlock + admin-bff reconcile). GATED
#      STUB-SEAM: not presented until the exact verb is confirmed; materialized
#      now so enabling it is config-only.
#  (C) akkoma-secrets — the akkoma/Pleroma runtime app secrets: SECRET_KEY_BASE +
#      SIGNING_SALT (Phoenix endpoint signing) + DB_PASSWORD (the akkoma-db
#      Postgres owner). Consumed by the akkoma Deployment (envFrom secretRef) +
#      akkoma-db (secretKeyRef DB_PASSWORD). REPLACES the former raw kind:Secret
#      with REPLACE_* placeholders that shipped in manifests/akkoma/akkoma.yaml —
#      now ESO-sourced from Vault, so NOTHING is committed plaintext (matching the
#      phpbb-secrets / per-DB POSTGRES-HARDENING posture). Vault: secret/<brand>/
#      akkoma, seeded by gen-cluster-secrets.sh (openssl rand for the salts + pw).
#
# NOTE: ESO generator CRDs are version-sensitive (generators.external-secrets.io
# /v1alpha1, ESO >=0.9). Validate against the deployed ESO (apps/03 pins 0.10.5).

# ── (A) akkoma-proxy server cert (ns hugmesh-backend) ───────────────────────
apiVersion: generators.external-secrets.io/v1alpha1
kind: VaultDynamicSecret
metadata: { name: akkoma-proxy-mtls, namespace: hugmesh-backend }
spec:
  path: pki_int/issue/akkoma-proxy
  method: POST
  parameters:
    common_name: akkoma-proxy.hugmesh-backend.svc.cluster.local
    alt_names: akkoma-proxy,akkoma-proxy.hugmesh-backend
    ttl: "720h"
  resultType: Data
  provider:
    server: https://vault.vault.svc.cluster.local:8200
    caProvider: { type: Secret, name: vault-ca, key: ca.crt }
    auth:
      tokenSecretRef: { name: vault-token, key: token }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata: { name: akkoma-proxy-mtls, namespace: hugmesh-backend }
spec:
  refreshInterval: 168h
  target:
    name: akkoma-proxy-mtls
    creationPolicy: Owner
    template:
      type: kubernetes.io/tls
      data:
        tls.crt: "{{ .certificate }}"
        tls.key: "{{ .private_key }}"
        ca.crt: "{{ .issuing_ca }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: VaultDynamicSecret
          name: akkoma-proxy-mtls
---
# ── (B) akkoma-admin (ns hugmesh-backend) <- secret/hugmesh/akkoma-admin ──
# Privileged akkoma/Pleroma admin bearer for the suspend/unsuspend admin EFFECT
# (mod-bff doBlock + admin-bff reconcile). GATED STUB-SEAM: not presented until the
# exact verb is confirmed; materialized now so enabling it is config-only.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: akkoma-admin
  namespace: hugmesh-backend
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: hugmesh-vault
    kind: ClusterSecretStore
  target:
    name: akkoma-admin
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef: { key: hugmesh/akkoma-admin, property: token }
---
# ── (C) akkoma-secrets (ns hugmesh-backend) <- secret/hugmesh/akkoma ──────
# Akkoma/Pleroma RUNTIME app secrets. REPLACES the former raw kind:Secret with
# REPLACE_* placeholders that used to ship inline in manifests/akkoma/akkoma.yaml —
# now ESO-sourced from Vault so nothing is committed plaintext. Three keys, mirroring
# the akkoma-admin single-key idiom above + the sso-externalsecrets multi-key shape:
#   SECRET_KEY_BASE / SIGNING_SALT — Phoenix endpoint signing (akkoma envFrom).
#   DB_PASSWORD                     — akkoma-db Postgres owner pw (akkoma-db
#                                     secretKeyRef + akkoma Pleroma.Repo password).
# Seeded by gen-cluster-secrets.sh (openssl rand) at secret/<brand>/akkoma.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: akkoma-secrets
  namespace: hugmesh-backend
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: hugmesh-vault
    kind: ClusterSecretStore
  target:
    name: akkoma-secrets
    creationPolicy: Owner
  data:
    - secretKey: SECRET_KEY_BASE
      remoteRef: { key: hugmesh/akkoma, property: SECRET_KEY_BASE }
    - secretKey: SIGNING_SALT
      remoteRef: { key: hugmesh/akkoma, property: SIGNING_SALT }
    - secretKey: DB_PASSWORD
      remoteRef: { key: hugmesh/akkoma, property: DB_PASSWORD }
