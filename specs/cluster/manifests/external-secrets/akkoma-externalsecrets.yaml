# Akkoma (Mastodon) homeserver ExternalSecrets — SPLIT OUT of the former shared
# homeserver-proxy-externalsecrets.yaml so removing akkoma (gate_optional_services)
# deletes ONLY this file and never orphans tuwunel's half (which lives in
# tuwunel-externalsecrets.yaml). See specs/cluster/optional-services.yaml
# (akkoma.esoFile) + docs/OPTIONAL-SERVICES.md.
#
# Two secrets:
#  (A) akkoma-proxy-mtls — SERVER cert for the akkoma-proxy nginx mTLS sidecar
#      (manifests/akkoma). Same Vault-PKI -> ESO -> kubernetes.io/tls pattern as
#      pki-externalsecrets.yaml. Requires the akkoma-proxy issuing role in the
#      Vault PKI loop (manifests/vault-pki/pki-init-configmap.yaml).
#  (B) akkoma-admin — privileged akkoma/Pleroma admin bearer for the suspend/
#      unsuspend admin EFFECT (mod-bff doBlock + admin-bff reconcile). GATED
#      STUB-SEAM: not presented until the exact verb is confirmed; materialized
#      now so enabling it is config-only.
#
# NOTE: ESO generator CRDs are version-sensitive (generators.external-secrets.io
# /v1alpha1, ESO >=0.9). Validate against the deployed ESO (apps/03 pins 0.10.5).

# ── (A) akkoma-proxy server cert (ns snapdragon-backend) ───────────────────────
apiVersion: generators.external-secrets.io/v1alpha1
kind: VaultDynamicSecret
metadata: { name: akkoma-proxy-mtls, namespace: snapdragon-backend }
spec:
  path: pki_int/issue/akkoma-proxy
  method: POST
  parameters:
    common_name: akkoma-proxy.snapdragon-backend.svc.cluster.local
    alt_names: akkoma-proxy,akkoma-proxy.snapdragon-backend
    ttl: "720h"
  resultType: Data
  provider:
    server: http://vault.vault.svc.cluster.local:8200
    auth:
      tokenSecretRef: { name: vault-token, key: token }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata: { name: akkoma-proxy-mtls, namespace: snapdragon-backend }
spec:
  refreshInterval: 168h
  target:
    name: akkoma-proxy-mtls
    creationPolicy: Owner
    template:
      type: kubernetes.io/tls
      data:
        tls.crt: "{{ .certificate }}"
        tls.key: "{{ .private_key }}"
        ca.crt: "{{ .issuing_ca }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: VaultDynamicSecret
          name: akkoma-proxy-mtls
---
# ── (B) akkoma-admin (ns snapdragon-backend) <- secret/snapdragon/akkoma-admin ──
# Privileged akkoma/Pleroma admin bearer for the suspend/unsuspend admin EFFECT
# (mod-bff doBlock + admin-bff reconcile). GATED STUB-SEAM: not presented until the
# exact verb is confirmed; materialized now so enabling it is config-only.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: akkoma-admin
  namespace: snapdragon-backend
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: snapdragon-vault
    kind: ClusterSecretStore
  target:
    name: akkoma-admin
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef: { key: snapdragon/akkoma-admin, property: token }
