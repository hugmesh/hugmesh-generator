# Vault PKI -> ESO -> per-app mTLS TLS Secret.
#
# For each Java machine-user, an ESO VaultDynamicSecret generator calls
# pki_int/issue/<app> (the role created by vault-pki-init) and an ExternalSecret
# materializes a kubernetes.io/tls Secret "<app>-mtls" (tls.crt / tls.key /
# ca.crt) in the app's namespace. The gateway chart's keystore initContainer
# (and the equivalent on the Spring APIs) turns that PEM into the JKS keystore +
# JRE truststore the app uses for cross-namespace mTLS. Certs chain to the
# cluster CA, so the existing truststore validates them; ESO re-issues before
# the 720h ttl expires (refreshInterval 168h) — automatic rotation.
#
# Auth: each generator reads a "vault-token" Secret (key "token") in ITS OWN
# namespace — published per-namespace by keys-provision from the USB KEYS stick
# (the same offline token used by the ESO ClusterSecretStore). Production should
# switch these generators to Vault Kubernetes auth bound to each app's
# ServiceAccount (no static token); see docs/SECURITY.md.
#
# TLS: Vault serves HTTPS (manifests/vault is persistent + TLS, cluster-CA-signed
# listener). Each generator trusts it via caProvider -> the per-namespace
# "vault-ca" Secret (key ca.crt = the PUBLIC cluster CA cert), seeded offline by
# keys-provision from KEYS/certs/cluster-ca.crt alongside the vault-token Secret.
#
# NOTE: ESO generator CRDs are version-sensitive (generators.external-secrets.io
# /v1alpha1, ESO >=0.9). Validate against the deployed ESO (apps/03 pins 0.10.5).

# ── snapdragon-pki-gateway (ns snapdragon-pki) ─────────────────────
apiVersion: generators.external-secrets.io/v1alpha1
kind: VaultDynamicSecret
metadata: { name: snapdragon-pki-gateway-mtls, namespace: snapdragon-pki }
spec:
  path: pki_int/issue/snapdragon-pki-gateway
  method: POST
  parameters:
    common_name: snapdragon-pki-gateway.snapdragon-pki.svc.cluster.local
    alt_names: snapdragon-pki-gateway,snapdragon-pki-gateway.snapdragon-pki
    ttl: "720h"
  resultType: Data
  provider:
    server: https://vault.vault.svc.cluster.local:8200
    # Vault serves HTTPS (cluster-CA-signed listener cert). Trust it via the
    # PUBLIC cluster CA cert in the per-namespace `vault-ca` Secret (key ca.crt),
    # seeded offline by keys-provision from KEYS/certs/cluster-ca.crt — the SAME
    # anchor pki_int chains to. (Cert only; no CA key leaves the USB stick.)
    caProvider: { type: Secret, name: vault-ca, key: ca.crt }
    auth:
      tokenSecretRef: { name: vault-token, key: token }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata: { name: snapdragon-pki-gateway-mtls, namespace: snapdragon-pki }
spec:
  refreshInterval: 168h
  target:
    name: snapdragon-pki-gateway-mtls
    creationPolicy: Owner
    template:
      type: kubernetes.io/tls
      data:
        tls.crt: "{{ .certificate }}"
        tls.key: "{{ .private_key }}"
        ca.crt: "{{ .issuing_ca }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: VaultDynamicSecret
          name: snapdragon-pki-gateway-mtls
---
