# ════════════════════════════════════════════════════════════════════════
# Per-DB Postgres server certs (DB-hardening PR-C1 — SHIPS DARK, ssl=off)
# ════════════════════════════════════════════════════════════════════════
# Each dedicated Postgres DB gets its own Vault-PKI cert materialized into a
# kubernetes.io/tls Secret "<db>-mtls" (tls.crt/tls.key/ca.crt), SAME shape +
# cluster-CA chain + auth/caProvider as the Java mTLS certs above. The roles are
# created with server_flag=true AND client_flag=true (pki-init for-app loop) so
# the SAME cert supports EITHER server-only TLS or full mutual TLS when enablement
# lands. See docs/POSTGRES-HARDENING.md:138-145.
#
# SHIPS DARK: PR-C1 only PUTS THE CERT ON DISK (the Deployment mounts this Secret
# as a volume). It does NOT start Postgres with `-c ssl=on` and does NOT touch any
# consumer R2DBC/JDBC URL, so the default wire path is BYTE-IDENTICAL (ssl off,
# cert unused). Flipping `-c ssl=on -c ssl_cert_file/-c ssl_key_file` + the
# consumer `?sslMode=require`/`sslmode=require` URLs is the DEFERRED PR-C2 step.
#
# CN/SANs mirror the DB Service DNS (<db>.<ns>.svc.cluster.local) so a server-TLS
# client (PR-C2) can verify the hostname. The role's allowed_domains
# (svc.cluster.local) covers these — see manifests/vault-pki/pki-init-configmap.yaml.

