    # Trust Vault's cluster-CA-signed listener via the PUBLIC cluster CA cert in the
    # per-namespace `vault-ca` Secret (key ca.crt), seeded offline by keys-provision.
    caProvider: { type: Secret, name: vault-ca, key: ca.crt }
    auth:
      tokenSecretRef: { name: vault-token, key: token }
