# Per-device in-UI SSH-terminal key material — TEMPLATE (NOT applied as-is).
#
# This file is a TEMPLATE the image-gen Job RENDERS + APPLIES once per device:
# replace every <deviceId> below with the device's stable id (the same id used as
# the Vault path / ingest segment by scripts/gen-provision-keys.sh — DEVICE_ID),
# then `kubectl apply` the result. It is NOT wired into kustomization.yaml (it has
# placeholders + there is one ExternalSecret PER device, created dynamically).
#
# Materializes the k8s Secret `device-ssh-<deviceId>` in namespace
# `snapdragon-backend` from Vault path secret/snapdragon/device/<deviceId>/ssh.
# That Secret is what the BFF mounts to dial THIS device's in-UI SSH terminal:
#   * host_key_pub     — the device sshd HOST public key the BFF PINS (the
#                        host_key_fp below is the SHA256 fingerprint of THIS key).
#   * host_key_fp       — SHA256:... fingerprint pinned by the BFF (closes TOFU).
#   * dial_private_key  — the BFF DIAL PRIVATE key (Vault-only; the matching PUBLIC
#                        half was baked into the device's <dial_user> authorized_keys
#                        by gen-provision-keys.sh — NEVER baked, see that script).
#   * dial_user         — the unprivileged login the BFF dials in AS.
#
# The Vault path secret/snapdragon/device/<deviceId>/ssh is SEEDED out-of-band from
# keys-out/vault-seed/device/<deviceId>/ (gen-provision-keys.sh) — the DIAL PRIVATE
# key BYTES live ONLY in Vault; ESO renders them into the in-cluster Secret at
# runtime. No private material appears in this file or anywhere in the git tree.
#
# Uses ClusterSecretStore snapdragon-vault (Vault KV-v2, token auth) — the SAME
# store every other workload secret uses (see secretstore.yaml).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: device-ssh-<deviceId>
  namespace: snapdragon-backend
  labels:
    app.kubernetes.io/part-of: snapdragon.systems
    app.kubernetes.io/managed-by: snapdragon-generator
    app.kubernetes.io/component: device-ssh-terminal
    snapdragon.systems/device-id: <deviceId>
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: snapdragon-vault
    kind: ClusterSecretStore
  target:
    name: device-ssh-<deviceId>
    creationPolicy: Owner
  data:
    - secretKey: host_key_pub
      remoteRef: { key: snapdragon/device/<deviceId>/ssh, property: host_key_pub }
    - secretKey: host_key_fp
      remoteRef: { key: snapdragon/device/<deviceId>/ssh, property: host_key_fp }
    - secretKey: dial_private_key
      remoteRef: { key: snapdragon/device/<deviceId>/ssh, property: dial_private_key }
    - secretKey: dial_user
      remoteRef: { key: snapdragon/device/<deviceId>/ssh, property: dial_user }
