# LocalTube ExternalSecrets — materialized in namespace hugmesh-tube.
# Owned by the tube slug (optional-services.yaml: tube.esoFile). Removing tube
# deletes ONLY this file and does not affect other service secrets.
#
# Three static secrets pulled from Vault secret/<brand>/tube:
#  (A) tube-media-key — HMAC-SHA256 key for signing/verifying media URLs
#      (/tube/content/** signed-URL gate in tube-bff-api + tube-media nginx).
#  (B) tube-token-dek — Data-Encryption Key for tube access-token encryption
#      (tube-bff-api encrypts opaque tokens before persisting download grants).
#  (C) google-oauth — the Google OAuth2 client for YouTube subscription sync.
#      Issued by Google, so gen-cluster-secrets.sh seeds PLACEHOLDERS the
#      operator replaces in Vault (same contract as casdoor-google). THE GAP
#      THIS CLOSES: the tube Deployment has always mounted Secret google-oauth
#      through NON-optional secretKeyRefs, but nothing anywhere declared or
#      seeded it — enabling the tube slug parked tube-bff-api in
#      CreateContainerConfigError with zero pointers. Found by the
#      [secret-key] manifest-integrity check counting out-of-band refs.
#
# Uses ClusterSecretStore hugmesh-vault (Vault KV-v2, token auth).
# See manifests/external-secrets/secretstore.yaml for the store definition.

# ── (A) tube-media-key (ns hugmesh-tube) <- secret/<brand>/tube.media_key ──
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: tube-media-key
  namespace: hugmesh-tube
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: hugmesh-vault
    kind: ClusterSecretStore
  target:
    name: tube-media-key
    creationPolicy: Owner
  data:
    - secretKey: mediaKey
      remoteRef: { key: hugmesh/tube, property: media_key }
---
# ── (B) tube-token-dek (ns hugmesh-tube) <- secret/<brand>/tube.token_dek ──
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: tube-token-dek
  namespace: hugmesh-tube
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: hugmesh-vault
    kind: ClusterSecretStore
  target:
    name: tube-token-dek
    creationPolicy: Owner
  data:
    - secretKey: dek
      remoteRef: { key: hugmesh/tube, property: token_dek }

# ── (C) google-oauth (ns hugmesh-tube) <- secret/<brand>/tube.google_client_* ──
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: google-oauth
  namespace: hugmesh-tube
spec:
  refreshInterval: 1h
  secretStoreRef: { name: hugmesh-vault, kind: ClusterSecretStore }
  target:
    name: google-oauth
    creationPolicy: Owner
  data:
    - secretKey: clientId
      remoteRef: { key: hugmesh/tube, property: google_client_id }
    - secretKey: clientSecret
      remoteRef: { key: hugmesh/tube, property: google_client_secret }
