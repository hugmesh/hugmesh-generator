# Homeserver mTLS PROXY server certs + homeserver ADMIN tokens (ban/congruence
# foundation). Two groups:
#
#  (A) SERVER certs for the akkoma-proxy / tuwunel-proxy nginx mTLS sidecars
#      (manifests/akkoma|tuwunel). Same Vault-PKI -> ESO -> kubernetes.io/tls
#      pattern as pki-externalsecrets.yaml, but these are the homeserver PROXY
#      identities the be-gateway/mod-bff/admin-bff connect TO (those callers
#      already have their OWN client certs from pki-externalsecrets.yaml — no new
#      client-cert secrets are needed here; the merged mTLS wave issues them).
#      Requires the akkoma-proxy / tuwunel-proxy issuing roles added to the Vault
#      PKI loop (manifests/vault-pki/pki-init-configmap.yaml).
#
#  (B) Homeserver ADMIN tokens (akkoma admin bearer + tuwunel admin Matrix token)
#      from Vault KV. These back the GATED, DOCUMENTED admin EFFECT STUB-SEAM: the
#      mod-bff MastodonAdminClient.doBlock / the admin-bff reconcile loop will
#      present them to the proxy to suspend/deactivate an account once the exact
#      verbs are CONFIRMED (tuwunel=Conduit admin-room commands; akkoma suspend).
#      They are materialized NOW so flipping the seam on later is config-only.
#      tuwunel-admin (key "token") is ALSO consumed by the existing
#      tuwunel-admin-sync Job; this is its authoritative ESO definition.
#
# NOTE: ESO generator CRDs are version-sensitive (generators.external-secrets.io
# /v1alpha1, ESO >=0.9). Validate against the deployed ESO (apps/03 pins 0.10.5).

# ── (A) akkoma-proxy server cert (ns snapdragon-backend) ───────────────────────
apiVersion: generators.external-secrets.io/v1alpha1
kind: VaultDynamicSecret
metadata: { name: akkoma-proxy-mtls, namespace: snapdragon-backend }
spec:
  path: pki_int/issue/akkoma-proxy
  method: POST
  parameters:
    common_name: akkoma-proxy.snapdragon-backend.svc.cluster.local
    alt_names: akkoma-proxy,akkoma-proxy.snapdragon-backend
    ttl: "720h"
  resultType: Data
  provider:
    server: http://vault.vault.svc.cluster.local:8200
    auth:
      tokenSecretRef: { name: vault-token, key: token }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata: { name: akkoma-proxy-mtls, namespace: snapdragon-backend }
spec:
  refreshInterval: 168h
  target:
    name: akkoma-proxy-mtls
    creationPolicy: Owner
    template:
      type: kubernetes.io/tls
      data:
        tls.crt: "{{ .certificate }}"
        tls.key: "{{ .private_key }}"
        ca.crt: "{{ .issuing_ca }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: VaultDynamicSecret
          name: akkoma-proxy-mtls
---
# ── (A) tuwunel-proxy server cert (ns snapdragon-backend) ──────────────────────
apiVersion: generators.external-secrets.io/v1alpha1
kind: VaultDynamicSecret
metadata: { name: tuwunel-proxy-mtls, namespace: snapdragon-backend }
spec:
  path: pki_int/issue/tuwunel-proxy
  method: POST
  parameters:
    common_name: tuwunel-proxy.snapdragon-backend.svc.cluster.local
    alt_names: tuwunel-proxy,tuwunel-proxy.snapdragon-backend
    ttl: "720h"
  resultType: Data
  provider:
    server: http://vault.vault.svc.cluster.local:8200
    auth:
      tokenSecretRef: { name: vault-token, key: token }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata: { name: tuwunel-proxy-mtls, namespace: snapdragon-backend }
spec:
  refreshInterval: 168h
  target:
    name: tuwunel-proxy-mtls
    creationPolicy: Owner
    template:
      type: kubernetes.io/tls
      data:
        tls.crt: "{{ .certificate }}"
        tls.key: "{{ .private_key }}"
        ca.crt: "{{ .issuing_ca }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: VaultDynamicSecret
          name: tuwunel-proxy-mtls
---
# ── (B) akkoma-admin (ns snapdragon-backend) <- secret/snapdragon/akkoma-admin ──
# Privileged akkoma/Pleroma admin bearer for the suspend/unsuspend admin EFFECT
# (mod-bff doBlock + admin-bff reconcile). GATED STUB-SEAM: not presented until the
# exact verb is confirmed; materialized now so enabling it is config-only.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: akkoma-admin
  namespace: snapdragon-backend
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: snapdragon-vault
    kind: ClusterSecretStore
  target:
    name: akkoma-admin
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef: { key: snapdragon/akkoma-admin, property: token }
---
# ── (B) tuwunel-admin (ns snapdragon-backend) <- secret/snapdragon/tuwunel-admin ─
# Privileged Matrix access token (key "token") for the tuwunel admin-room deactivate
# admin EFFECT (mod-bff doBlock + admin-bff reconcile) AND the existing
# tuwunel-admin-sync Job (manifests/tuwunel/admin-sync-job.yaml mounts secret
# tuwunel-admin). This is its authoritative ESO definition. GATED STUB-SEAM for the
# deactivate verb until the Conduit-family admin-room command is confirmed.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: tuwunel-admin
  namespace: snapdragon-backend
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: snapdragon-vault
    kind: ClusterSecretStore
  target:
    name: tuwunel-admin
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef: { key: snapdragon/tuwunel-admin, property: token }
