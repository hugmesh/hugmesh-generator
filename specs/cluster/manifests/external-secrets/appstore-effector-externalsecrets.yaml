# appstore-effector-tokens — the two bearer tokens the admin-BFF's APP-STORE /
# Service-Catalog effector presents to the legs APPSTORE_EFFECTOR_ENABLED and
# APPSTORE_FEDERATION_ENABLED switched on (manifests/admin-bff-api/deployment.yaml).
#
#   argocd-auth-token      -> APPSTORE_ARGOCD_AUTH_TOKEN
#                             (app.appstore.argocd.auth-token, RestArgoCdClient Bearer)
#   federation-auth-token  -> APPSTORE_FEDERATION_AUTH_TOKEN
#                             (app.appstore.federation.auth-token; must be a Casdoor JWT
#                             carrying ROLE_SUPERADMIN, federation-api's admin API)
#
# BEFORE THIS FILE neither token had a source anywhere in the tree: both defaulted
# empty in the BFF's application.yml and nothing could ever supply them.
#
# OPERATOR-SEEDED, AND DELIBERATELY SO. scripts/gen-cluster-secrets.sh cannot mint
# either value: the ArgoCD one is created BY ArgoCD (an account with the apiKey
# capability + `argocd account generate-token`; nothing in this tree defines such an
# account), and the federation one is a JWT signed by Casdoor for a superadmin. Until
# an operator writes secret/<brand>/appstore-effector-tokens
# (`vault kv put secret/<brand>/appstore-effector-tokens argocd_auth_token=... federation_auth_token=...`)
# this ExternalSecret reports SecretSyncedError and the Secret does not exist, exactly
# like akkoma-admin / tuwunel-admin / coturn-shared-secret. It is classified in
# tests/scripts/eso_seed_contract.py OPERATOR_SEEDED_PATHS so that red is NAMED, not
# anonymous noise. A federation JWT is short-lived: a static token seeded here will
# EXPIRE and the leg returns to failing until it is re-seeded or the BFF mints its own.
#
# THE ADMIN-BFF CONSUMES THESE AS `optional: true` secretKeyRefs. Not optional would
# wedge the BFF pod itself in CreateContainerConfigError whenever the Secret is
# absent - which is the state of every cluster until an operator seeds the path. With
# `optional: true` an absent Secret yields an unset env var, which is byte-for-byte
# today's behaviour (empty Bearer). tests/scripts/test-appstore-effector-flags.sh
# fails if either ref loses `optional: true` or points at a Secret no applied
# manifest creates in the BFF's own namespace.
#
# WHAT THIS DOES NOT FIX: neither leg reaches the point of sending the token today.
# Both fail earlier, at the TLS handshake (ArgoCD self-signed leaf, hugmesh-admin-bff-api#62;
# federation cluster-CA leaf with no client cert presented, #82) - see the 2026-09-17
# CORRECTION in the deployment. The token is the SECOND wall.
#
# Namespace hugmesh-backend: a secretKeyRef can only read a Secret from the pod's own
# namespace. Uses spec.data (not dataFrom) so the vault-base replacement in
# kustomization.yaml rewrites the remoteRef keys with the rest.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: appstore-effector-tokens
  namespace: hugmesh-backend
  labels:
    app.kubernetes.io/name: admin-bff-api
    app.kubernetes.io/part-of: hugmesh.net
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: hugmesh-vault
    kind: ClusterSecretStore
  target:
    name: appstore-effector-tokens
    creationPolicy: Owner
  data:
    - secretKey: argocd-auth-token
      remoteRef: { key: hugmesh/appstore-effector-tokens, property: argocd_auth_token }
    - secretKey: federation-auth-token
      remoteRef: { key: hugmesh/appstore-effector-tokens, property: federation_auth_token }
