# tuwunel (Matrix) homeserver ExternalSecrets — SPLIT OUT of the former shared
# homeserver-proxy-externalsecrets.yaml so removing tuwunel (gate_optional_services)
# deletes ONLY this file and never orphans akkoma's half (which lives in
# akkoma-externalsecrets.yaml). See specs/cluster/optional-services.yaml
# (tuwunel.esoFile) + docs/OPTIONAL-SERVICES.md.
#
# Two secrets:
#  (A) tuwunel-proxy-mtls — SERVER cert for the tuwunel-proxy nginx mTLS sidecar
#      (manifests/tuwunel). Same Vault-PKI -> ESO -> kubernetes.io/tls pattern as
#      pki-externalsecrets.yaml. Requires the tuwunel-proxy issuing role in the
#      Vault PKI loop (manifests/vault-pki/pki-init-configmap.yaml).
#  (B) tuwunel-admin — privileged Matrix access token (key "token") for the
#      tuwunel admin-room deactivate admin EFFECT (mod-bff doBlock + admin-bff
#      reconcile) AND the existing tuwunel-admin-sync Job
#      (manifests/tuwunel/admin-sync-job.yaml mounts secret tuwunel-admin). This
#      is its authoritative ESO definition. GATED STUB-SEAM for the deactivate
#      verb until the Conduit-family admin-room command is confirmed.
#
# NOTE: ESO generator CRDs are version-sensitive (generators.external-secrets.io
# /v1alpha1, ESO >=0.9). Validate against the deployed ESO (apps/03 pins 0.10.5).

# ── (A) tuwunel-proxy server cert (ns hugmesh-backend) ──────────────────────
apiVersion: generators.external-secrets.io/v1alpha1
kind: VaultDynamicSecret
metadata: { name: tuwunel-proxy-mtls, namespace: hugmesh-backend }
spec:
  path: pki_int/issue/tuwunel-proxy
  method: POST
  parameters:
    common_name: tuwunel-proxy.hugmesh-backend.svc.cluster.local
    alt_names: tuwunel-proxy,tuwunel-proxy.hugmesh-backend
    ttl: "720h"
  resultType: Data
  provider:
    server: https://vault.vault.svc.cluster.local:8200
    caProvider: { type: Secret, name: vault-ca, key: ca.crt }
    auth:
      tokenSecretRef: { name: vault-token, key: token }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata: { name: tuwunel-proxy-mtls, namespace: hugmesh-backend }
spec:
  refreshInterval: 168h
  target:
    name: tuwunel-proxy-mtls
    creationPolicy: Owner
    template:
      type: kubernetes.io/tls
      data:
        tls.crt: "{{ .certificate }}"
        tls.key: "{{ .private_key }}"
        ca.crt: "{{ .issuing_ca }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: VaultDynamicSecret
          name: tuwunel-proxy-mtls
---
# ── (B) tuwunel-admin (ns hugmesh-backend) <- secret/<brand>/tuwunel-admin ─
# Privileged Matrix access token (key "token") for the tuwunel admin-room deactivate
# admin EFFECT (mod-bff doBlock + admin-bff reconcile) AND the existing
# tuwunel-admin-sync Job (manifests/tuwunel/admin-sync-job.yaml mounts secret
# tuwunel-admin). This is its authoritative ESO definition. GATED STUB-SEAM for the
# deactivate verb until the Conduit-family admin-room command is confirmed.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: tuwunel-admin
  namespace: hugmesh-backend
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: hugmesh-vault
    kind: ClusterSecretStore
  target:
    name: tuwunel-admin
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef: { key: hugmesh/tuwunel-admin, property: token }
