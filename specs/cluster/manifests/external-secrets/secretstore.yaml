# gitlab-registry — imagePullSecret (dockerconfigjson) for pulling first-party
# images from the in-cluster GitLab container registry (registry.snapdragon.systems).
# One per namespace that runs first-party images. Provision the real value with a
# GitLab GROUP DEPLOY TOKEN (scope: read_registry); gen-cluster-secrets seeds a
# placeholder. Only needed once GitLab + its registry are up (a Vault-online
# scenario), so it is not part of the offline USB bundle.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: gitlab-registry
  namespace: snapdragon-backend
spec:
  refreshInterval: 1h
  secretStoreRef: { name: snapdragon-vault, kind: ClusterSecretStore }
  target:
    name: gitlab-registry
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"registry.snapdragon.systems":{"username":"{{ .username }}","password":"{{ .token }}","auth":"{{ printf "%s:%s" .username .token | b64enc }}"}}}
  data:
    - secretKey: username
      remoteRef: { key: snapdragon/gitlab-registry, property: username }
    - secretKey: token
      remoteRef: { key: snapdragon/gitlab-registry, property: token }
---
