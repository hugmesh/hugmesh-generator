    creationPolicy: Owner
  data:
    - secretKey: clientId
      remoteRef:
        key: snapdragon/casdoor
        property: github_client_id
    - secretKey: clientSecret
      remoteRef:
        key: snapdragon/casdoor
        property: github_client_secret
---
# casdoor-discord (namespace snapdragon-pki) <- secret/snapdragon/casdoor — the
