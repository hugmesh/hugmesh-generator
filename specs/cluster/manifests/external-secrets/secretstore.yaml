---
# user-bff-hs-token (ns hugmesh-backend) <- secret/hugmesh/user-bff-hs-token
# The D6 user-bff HOMESERVER-TOKEN custody encryption key (app.hs-token.key /
# APP_HS_TOKEN_KEY). Homeservers REJECT the Casdoor JWT for the general API (tuwunel
# has no jwt_config; Akkoma OIDC is interactive-login-only), so user-bff mints the
# homeserver-NATIVE token, AES-256-GCM-encrypts it at rest with this 256-bit data
# key, and custody-holds it in its OWN Postgres — then injects the decrypted token
# when proxying the user's /bff/user/** self-service calls through tuwunel-proxy /
# akkoma-proxy (:4443). The cipher mirrors admin-bff MfaSecretCipher: it prefers a
# base64-decoded 32-byte key, SHA-256-folds an arbitrary passphrase as a fallback,
# and has NO plaintext fallback (inert + fail-closed when unconfigured). The
# hugmesh-user-bff-api Deployment mounts the `key` key via secretKeyRef
# (optional). Seeded by gen-cluster-secrets.sh (openssl rand -base64 32) under
# Vault property key. SHIPS DARK: the whole hs-token mint/custody/proxy surface
# stays off behind app.hs-token.enabled (default false) and the cipher is INERT
# until a key is present, so materializing this Secret only SOURCES the key — it
# does NOT enable the feature. Mirrors the admin-bff-mfa single-key pattern.
# NOTHING is committed plaintext — the value is ESO-sourced from Vault.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: user-bff-hs-token
  namespace: hugmesh-backend
spec:
  refreshInterval: 1h
  secretStoreRef: { name: hugmesh-vault, kind: ClusterSecretStore }
  target:
    name: user-bff-hs-token
    creationPolicy: Owner
  data:
    - secretKey: key
      remoteRef: { key: hugmesh/user-bff-hs-token, property: key }
    # svc-password — the homeserver service-account password the ServiceTokenBroker
    # mints with (APP_HS_TOKEN_SVC_PASSWORD). Mounted optional by the Deployment; the
    # broker carries an EMPTY default and fails closed (mint → 503) when blank, so this
    # only SOURCES the password — it does not enable the feature (the flag ships true).
    - secretKey: svc-password
      remoteRef: { key: hugmesh/user-bff-hs-token, property: svc-password }
---
# route-access-db-roles (ns hugmesh-pki) — consumed by the route-access-db POD
