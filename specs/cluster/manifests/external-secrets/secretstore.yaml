# External Secrets Operator (ESO) configuration.
#
# A ClusterSecretStore "snapdragon-vault" points ESO at the cluster Vault
# (KV v2, mount "secret/", base path "snapdragon/" — the base segment equals the
# brand slug, default "snapdragon"). Each ExternalSecret below materializes one
# of the k8s Secrets the existing workloads already consume via secretKeyRef.
# The workload manifests are unchanged; ESO just creates/refreshes the Secrets.
#
# Auth: a Vault token read from the k8s Secret "vault-token" (key "token") in the
# external-secrets namespace. That Secret is provisioned offline from
# KEYS/vault/token by keys-provision (online sync), or the materialized Secrets
# themselves are created offline from KEYS/vault/secrets.json.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: snapdragon-vault
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: v2
      auth:
        tokenSecretRef:
          name: vault-token
          key: token
          namespace: external-secrets
---
# casdoor-google (namespace snapdragon-pki) <- secret/snapdragon/casdoor
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: casdoor-google
  namespace: snapdragon-pki
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: snapdragon-vault
    kind: ClusterSecretStore
  target:
    name: casdoor-google
    creationPolicy: Owner
  data:
    - secretKey: clientId
      remoteRef:
        key: snapdragon/casdoor
        property: google_client_id
    - secretKey: clientSecret
      remoteRef:
        key: snapdragon/casdoor
        property: google_client_secret
---
# casdoor-admin (ns snapdragon-pki) <- secret/snapdragon/casdoor — admin login
# the casdoor-init Job uses to call the Casdoor API. username is fixed ("admin");
# the password is the PLAINTEXT minted by gen-cluster-secrets.sh.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: casdoor-admin
  namespace: snapdragon-pki
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: snapdragon-vault
    kind: ClusterSecretStore
  target:
    name: casdoor-admin
    creationPolicy: Owner
    template:
      data:
        username: "admin"
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: snapdragon/casdoor
        property: admin_password_plain
---
# casdoor-app-secrets (ns snapdragon-pki) <- secret/snapdragon/casdoor-apps
# One Secret key per app (pki-gateway, be-gateway, ...), each the app's OAuth2
# client-secret. extract pulls every key from the Vault path. Consumed by the
# casdoor-init Job to set each application's clientSecret.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: casdoor-app-secrets
  namespace: snapdragon-pki
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: snapdragon-vault
    kind: ClusterSecretStore
  target:
    name: casdoor-app-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: snapdragon/casdoor-apps
---
