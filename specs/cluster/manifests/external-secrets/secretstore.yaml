# ─────────────────────────────────────────────────────────────────────────────
# hugmesh-actions cross-Casdoor sync credentials (ns hugmesh-backend). The
# scheduled GameMasterAdminSyncAction reads ROLE_GAMES_ADMIN from the SYSTEMS Casdoor
# and writes the "admin" role membership in the GAMES Casdoor, so it needs an admin
# client on BOTH sides. Two Secrets, one per side; each carries clientId/clientSecret.
# ─────────────────────────────────────────────────────────────────────────────
# casdoor-sync-systems (ns hugmesh-backend) <- secret/hugmesh/casdoor (systems
# side admin client for the sync job — app.casdoor.platform.client-id/secret).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: casdoor-sync-systems
  namespace: hugmesh-backend
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: hugmesh-vault
    kind: ClusterSecretStore
  target:
    name: casdoor-sync-systems
    creationPolicy: Owner
  data:
    - secretKey: clientId
      remoteRef:
        key: hugmesh/casdoor
        property: client_id
    - secretKey: clientSecret
      remoteRef:
        key: hugmesh/casdoor
        property: client_secret
---
# casdoor-sync-games (ns hugmesh-backend) <- secret/hugmesh/casdoor-games (games
# side admin client for the sync job — app.casdoor.games.client-id/secret). Same
# threewizards-app client the games BFF uses; client_credentials grant lets the sync
# job write role membership in the games realm.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: casdoor-sync-games
  namespace: hugmesh-backend
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: hugmesh-vault
    kind: ClusterSecretStore
  target:
    name: casdoor-sync-games
    creationPolicy: Owner
    template:
      data:
        clientId: "twclient001"
        clientSecret: "{{ .clientSecret }}"
  data:
    - secretKey: clientSecret
      remoteRef:
        key: hugmesh/casdoor-games
        property: client_secret
---
# fragment-sync-casdoor (ns hugmesh-frontend) <- secret/hugmesh/casdoor-apps
# The Casdoor client-credentials MACHINE account (OAuth2 application
# app-fragment-sync) the remote-fragment sync sidecar uses to mint a SERVICE JWT
# for the federation manifest/bundles calls (those routes only require the
# authenticated/ROLE_USER floor a client-credentials token carries, so the sidecar
# sees the PUBLIC fragments). clientId is the FIXED application name
# app-fragment-sync; the clientSecret is the per-app key in the central casdoor-apps
# Vault path (same path casdoor-app-secrets / casdoor-init use to set each app's
# secret). Mirrors the casdoor-games-app template block (pin clientId, pull secret).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: fragment-sync-casdoor
  namespace: hugmesh-frontend
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: hugmesh-vault
    kind: ClusterSecretStore
  target:
    name: fragment-sync-casdoor
    creationPolicy: Owner
    template:
      data:
        clientId: "app-fragment-sync"
        clientSecret: "{{ .clientSecret }}"
  data:
    - secretKey: clientSecret
      remoteRef:
        key: hugmesh/casdoor-apps
        property: fragment-sync
---
# signup-gate-casdoor (ns hugmesh-pki) <- secret/hugmesh/casdoor-apps
# The Casdoor client-credentials MACHINE account (OAuth2 application
# app-signup-gate, ROLE_SERVICE) the signup-gate proxy uses to mint a SERVICE JWT
# for the INTERNAL/ROLE_SERVICE federation username-availability endpoint, so it
# can reject a confusable/look-alike self-signup BEFORE Casdoor mints the login.
# clientId is the FIXED application name app-signup-gate; clientSecret is the
# per-app key in the central casdoor-apps Vault path (same path casdoor-init uses
# to set each app's secret). Mirrors the fragment-sync-casdoor block.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: signup-gate-casdoor
  namespace: hugmesh-pki
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: hugmesh-vault
    kind: ClusterSecretStore
  target:
    name: signup-gate-casdoor
    creationPolicy: Owner
    template:
      data:
        clientId: "app-signup-gate"
        clientSecret: "{{ .clientSecret }}"
  data:
    - secretKey: clientSecret
      remoteRef:
        key: hugmesh/casdoor-apps
        property: signup-gate
---
# harbor-casdoor (ns hugmesh-pki) <- secret/hugmesh/casdoor-apps
# The Casdoor OAuth2 application (app-harbor, ROLE_ADMIN — Harbor's web UI/API
# login is an admin-only internal tool, same posture as GitLab) harbor-provision
# (manifests/harbor/harbor-provision-job.yaml) reads to configure Harbor's own
# OIDC auth_mode via its REST API. A SCOPED Secret (clientId/clientSecret only)
# rather than mounting the whole casdoor-app-secrets bag — mirrors the
# fragment-sync-casdoor / signup-gate-casdoor blocks above. clientId is the
# FIXED application name app-harbor; clientSecret is the per-app key in the
# central casdoor-apps Vault path (same path casdoor-init uses to set each
# app's secret).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: harbor-casdoor
  namespace: hugmesh-pki
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: hugmesh-vault
    kind: ClusterSecretStore
  target:
    name: harbor-casdoor
    creationPolicy: Owner
    template:
      data:
        clientId: "app-harbor"
        clientSecret: "{{ .clientSecret }}"
  data:
    - secretKey: clientSecret
      remoteRef:
        key: hugmesh/casdoor-apps
        property: harbor
---
# harbor-admin (ns hugmesh-pki) <- secret/hugmesh/harbor — admin login
# BOTH the Harbor Helm chart itself (existingSecretAdminPassword, so the chart
# never bakes a default/plaintext password) and harbor-provision
# (manifests/harbor/harbor-provision-job.yaml, to call Harbor's REST API) use
# this Secret. username is fixed ("admin", Harbor's built-in superuser);
# HARBOR_ADMIN_PASSWORD is the key name the chart's existingSecretAdminPasswordKey
# expects; password is the same value under the plain key the reconcile Job
# reads. Both keys are minted together by gen-cluster-secrets.sh. Mirrors the
# casdoor-admin block above.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: harbor-admin
  namespace: hugmesh-pki
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: hugmesh-vault
    kind: ClusterSecretStore
  target:
    name: harbor-admin
    creationPolicy: Owner
    template:
      data:
        username: "admin"
        password: "{{ .admin_password_plain }}"
        HARBOR_ADMIN_PASSWORD: "{{ .admin_password_plain }}"
  data:
    - secretKey: admin_password_plain
      remoteRef:
        key: hugmesh/harbor
        property: admin_password_plain
---
# signup-gate-webhook (ns hugmesh-pki) <- secret/hugmesh/casdoor-apps
# OPTIONAL shared-secret for the post-signup reconcile webhook (Casdoor POSTs the
# signup event to signup-gate /casdoor/webhook with the X-Signup-Gate-Secret
# header; the proxy verifies it before running the backstop disable). When the
# Vault property is absent ESO never creates the Secret, the Deployment marks the
# env optional, and the webhook handler skips the shared-secret check (the
# pre-signup gate is the primary enforcement regardless). Seeded by
# gen-cluster-secrets under casdoor-apps property "signup-gate-webhook".
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: signup-gate-webhook
  namespace: hugmesh-pki
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: hugmesh-vault
    kind: ClusterSecretStore
  target:
    name: signup-gate-webhook
    creationPolicy: Owner
  data:
    - secretKey: secret
      remoteRef:
        key: hugmesh/casdoor-apps
        property: signup-gate-webhook
---
# ─────────────────────────────────────────────────────────────────────────────
# PLUGGABLE MAIL (default protonmail) — optional, absent-by-default. Both Secrets
# source from secret/<brand>/mail (props provider/host/port/tls/user/password/from/
# dkim_key, seeded by gen-cluster-secrets.sh from the keys USB / prompt, or left
# empty => mail disabled). When the Vault path is absent ESO simply never creates
# the Secret; the casdoor/akkoma Deployments mark it optional, so no SMTP is wired
# and registration stays admin-approval (no email needed).
# ─────────────────────────────────────────────────────────────────────────────
# casdoor-smtp (ns hugmesh-pki) <- secret/hugmesh/mail. Materializes the
# CASDOOR_SMTP_* env the casdoor Deployment loads (optional secretRef) and the
# app.conf SMTP block interpolates.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: casdoor-smtp
  namespace: hugmesh-pki
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: hugmesh-vault
    kind: ClusterSecretStore
  target:
    name: casdoor-smtp
    creationPolicy: Owner
    template:
      data:
        CASDOOR_SMTP_HOST: "{{ .host }}"
        CASDOOR_SMTP_PORT: "{{ .port }}"
        CASDOOR_SMTP_USER: "{{ .user }}"
        CASDOOR_SMTP_PASSWORD: "{{ .password }}"
        CASDOOR_SMTP_FROM: "{{ .from }}"
  data:
    - secretKey: host
      remoteRef: { key: hugmesh/mail, property: host }
    - secretKey: port
      remoteRef: { key: hugmesh/mail, property: port }
    - secretKey: user
      remoteRef: { key: hugmesh/mail, property: user }
    - secretKey: password
      remoteRef: { key: hugmesh/mail, property: password }
    - secretKey: from
      remoteRef: { key: hugmesh/mail, property: from }
---
# akkoma-smtp (ns hugmesh-backend) <- secret/hugmesh/mail. Materializes the
# AKKOMA_SMTP_* env the akkoma Deployment loads (optional secretRef) and the
# Pleroma.Mailer Swoosh SMTP adapter reads. relay/port/user/pass/tls/from(+dkim).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: akkoma-smtp
