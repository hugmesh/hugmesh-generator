# harbor-registry (hugmesh-forum)
# Found by tests/scripts/test-eso-target-collisions.sh check (C) while fixing the
# hugmesh-pki collision below — the SAME defect class, one namespace over:
# manifests/forum/kustomization.yaml patches
# `imagePullSecrets: [harbor-registry]` onto the phpbb Deployment and rewrites
# its image to registry.hugmesh.net/hugmesh/hugmesh-phpbb:main (a private
# Harbor project), but NO ExternalSecret ever materialized that Secret in
# hugmesh-forum — so the kubelet had no credential and the pull was anonymous.
# hugmesh-forum has no Helm release of its own, so the name `harbor-registry` is
# uncontested here and this is a straight mirror of the three blocks above.
# (The python sync Job in that overlay pulls public python:3.12-alpine and is
# deliberately NOT patched, hence a Deployment-scoped patch.)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: harbor-registry
  namespace: hugmesh-forum
spec:
  refreshInterval: 1h
  secretStoreRef: { name: hugmesh-vault, kind: ClusterSecretStore }
  target:
    name: harbor-registry
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"registry.hugmesh.net":{"username":"{{ .username }}","password":"{{ .token }}","auth":"{{ printf "%s:%s" .username .token | b64enc }}"}}}
  data:
    - secretKey: username
      remoteRef: { key: hugmesh/harbor-robots, property: pull_name }
    - secretKey: token
      remoteRef: { key: hugmesh/harbor-robots, property: pull_secret }
---
# hugmesh-registry-pull (hugmesh-pki)  — the SAME pull cred as the three
# `harbor-registry` blocks above, under a DIFFERENT k8s Secret name. Read the
# next paragraph before "fixing" the inconsistency.
#
# WHY NOT `harbor-registry` HERE. hugmesh-pki is the namespace the Harbor Helm
# chart itself is released into (apps/03a-harbor.yaml, releaseName `harbor`),
# and that chart ALREADY OWNS a Secret called `harbor-registry`:
#
#     harbor/templates/registry/registry-secret.yaml
#       metadata.name: "{{ template "harbor.registry" . }}"   type: Opaque
#     harbor/templates/_helpers.tpl
#       {{- define "harbor.registry" -}}
#         {{- printf "%s-registry" (include "harbor.fullname" .) -}}
#       {{- end -}}
#     …and harbor.fullname collapses to the release name `harbor` (the release
#     name already contains the chart name), so the rendered name is exactly
#     `harbor-registry`.
#
# That Secret is NOT a pull secret. It carries REGISTRY_HTTP_SECRET (the
# docker/distribution HTTP shared secret) + REGISTRY_REDIS_PASSWORD, and both
# containers of the harbor-registry Deployment `envFrom` it
# (registry-dpl.yaml). Clobber it and the registry itself stops working.
#
# Pointing an ExternalSecret at that name did three things, all of them bad:
#   1. It could never converge — a Secret's `type` is immutable, and ESO was
#      trying to turn the chart's Opaque Secret into a dockerconfigjson one:
#        Secret "harbor-registry" is invalid: type: Invalid value:
#        "kubernetes.io/dockerconfigjson": field is immutable
#      so the stated purpose below was never actually delivered.
#   2. Worse, `creationPolicy: Owner` means ESO was trying to TAKE OWNERSHIP of
#      a Helm-managed object. The only thing that stopped it overwriting
#      Harbor's own registry credentials was the type-immutability rule in (1) —
#      a coincidence, not a design. Had the types matched, ESO would have
#      clobbered the chart's Secret and ESO's deletionPolicy would have governed
#      an object Helm believes it owns.
#   3. It left one permanently-failing ExternalSecret in the namespace, which is
#      exactly the noise that hides a real one.
# `creationPolicy: Owner` is KEPT (and is correct): ESO must CREATE this Secret
# — nothing else does — and it should garbage-collect it with the
# ExternalSecret. Owner was never the defect; aiming Owner at a name somebody
# else already owns was. tests/scripts/test-eso-target-collisions.sh now renders
# every third-party chart into its destination namespace and fails the build if
# any ExternalSecret target lands on a name that chart creates.
#
# The three blocks above keep the name `harbor-registry` because no chart is
# released into hugmesh-backend / hugmesh-frontend / hugmesh-games, so nothing
# there can collide; they sync fine today and are deliberately left alone.
#
# WHAT IT IS FOR (unchanged). The MDM optional-services (headwind,
# attestation-server) and the two hugmesh-pki gateway releases (apps/
# 20-gateway-pki.yaml, apps/22-gateway-superadmin.yaml) all run first-party
# build-from-source images out of the private Harbor project, and each patches
# `imagePullSecrets: [hugmesh-registry-pull]` onto its pod spec. hugmesh-pki is
# a base namespace (Harbor/Vault/Casdoor live here; harbor-mtls already targets
# it unconditionally), so this is safe to apply even when the MDM services are
# left at their default `off`.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: hugmesh-registry-pull
  namespace: hugmesh-pki
spec:
  refreshInterval: 1h
  secretStoreRef: { name: hugmesh-vault, kind: ClusterSecretStore }
  target:
    name: hugmesh-registry-pull
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"registry.hugmesh.net":{"username":"{{ .username }}","password":"{{ .token }}","auth":"{{ printf "%s:%s" .username .token | b64enc }}"}}}
  data:
    - secretKey: username
      remoteRef: { key: hugmesh/harbor-robots, property: pull_name }
    - secretKey: token
      remoteRef: { key: hugmesh/harbor-robots, property: pull_secret }
---
# ═════════════════════════════════════════════════════════════════════════════
# phpBB FORUM secrets (the backend-only forum stack).
#
# forum-bff-db lives in hugmesh-backend with the other BFF dbs (owner +
# least-privilege app role, mirroring user-bff-db). phpBB + phpbb-db are ISOLATED
# in the dedicated hugmesh-forum namespace, so their Secrets are materialized
# THERE. All use the ClusterSecretStore "hugmesh-vault" (cluster-scoped), so an
# ExternalSecret in hugmesh-forum resolves without a per-namespace generator.
# Vault paths: secret/<brand>/forum (phpbb-secrets multi-key) +
# secret/<brand>/forum-db (phpbb_app) + secret/<brand>/forum-bff-db.
# NOTE: unlike akkoma's plaintext-in-git akkoma-secrets placeholder, NOTHING here
# is committed plaintext — every value is ESO-sourced from Vault.
# ═════════════════════════════════════════════════════════════════════════════
---
# forum-bff-db-auth (ns hugmesh-backend) <- secret/hugmesh/forum-bff-db
# OWNER Postgres password for forum-bff-db; the DB pod (POSTGRES_PASSWORD) + its
# only consumer (hugmesh-forum-bff-api, Liquibase/DDL) both mount key password.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: forum-bff-db-auth
  namespace: hugmesh-backend
spec:
  refreshInterval: 1h
