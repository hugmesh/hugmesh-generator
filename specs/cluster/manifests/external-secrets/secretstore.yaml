# ═════════════════════════════════════════════════════════════════════════════
# phpBB FORUM secrets (the backend-only forum stack).
#
# forum-bff-db lives in snapdragon-backend with the other BFF dbs (owner +
# least-privilege app role, mirroring user-bff-db). phpBB + phpbb-db are ISOLATED
# in the dedicated snapdragon-forum namespace, so their Secrets are materialized
# THERE. All use the ClusterSecretStore "snapdragon-vault" (cluster-scoped), so an
# ExternalSecret in snapdragon-forum resolves without a per-namespace generator.
# Vault paths: secret/<brand>/forum (phpbb-secrets multi-key) +
# secret/<brand>/forum-db (phpbb_app) + secret/<brand>/forum-bff-db.
# NOTE: unlike akkoma's plaintext-in-git akkoma-secrets placeholder, NOTHING here
# is committed plaintext — every value is ESO-sourced from Vault.
# ═════════════════════════════════════════════════════════════════════════════
---
# forum-bff-db-auth (ns snapdragon-backend) <- secret/snapdragon/forum-bff-db
# OWNER Postgres password for forum-bff-db; the DB pod (POSTGRES_PASSWORD) + its
# only consumer (snapdragon-forum-bff-api, Liquibase/DDL) both mount key password.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: forum-bff-db-auth
  namespace: snapdragon-backend
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: snapdragon-vault
    kind: ClusterSecretStore
  target:
    name: forum-bff-db-auth
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: snapdragon/forum-bff-db
        property: password
---
# forum-bff-db-app-auth (ns snapdragon-backend) — RUNTIME password for the
# non-owner forumbff_app role (DB pod FORUMBFF_APP_PASSWORD + app SPRING_R2DBC).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: forum-bff-db-app-auth
  namespace: snapdragon-backend
spec:
  refreshInterval: 1h
  secretStoreRef: { name: snapdragon-vault, kind: ClusterSecretStore }
  target:
    name: forum-bff-db-app-auth
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef: { key: snapdragon/forum-bff-db, property: app_password }
---
# phpbb-secrets (ns snapdragon-forum) <- secret/snapdragon/forum
# Multi-key: DB_PASSWORD (phpbb-db OWNER, install/migrate) + ADMIN_PASSWORD (the
# phpBB first-install admin). The phpbb pod + phpbb-db pod mount the keys they
# need (secretKeyRef). extract pulls every key from the Vault path.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: phpbb-secrets
  namespace: snapdragon-forum
spec:
  refreshInterval: 1h
  secretStoreRef: { name: snapdragon-vault, kind: ClusterSecretStore }
  target:
    name: phpbb-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: snapdragon/forum
---
# phpbb-db-app-auth (ns snapdragon-forum) — RUNTIME password for the non-owner
# phpbb_app role (phpbb-db PHPBB_APP_PASSWORD + phpBB config.php runtime login).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: phpbb-db-app-auth
  namespace: snapdragon-forum
spec:
  refreshInterval: 1h
  secretStoreRef: { name: snapdragon-vault, kind: ClusterSecretStore }
  target:
    name: phpbb-db-app-auth
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef: { key: snapdragon/forum-db, property: app_password }
---
# casdoor-app-secrets (ns snapdragon-forum) <- secret/snapdragon/casdoor-apps
# The forum-admin-sync Job (in snapdragon-forum) reads Casdoor ROLE_ADMIN/
# ROLE_FORUM_MOD/ROLE_FORUM membership via the OAuth2 client-credentials in this
# Secret. Same Vault path the casdoor-init Job uses; materialized here so the Job's
# mount resolves inside the isolated namespace (the akkoma/tuwunel sync jobs mount
# the SAME casdoor-app-secrets Secret, by name, in their namespace).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: casdoor-app-secrets
  namespace: snapdragon-forum
spec:
  refreshInterval: 1h
  secretStoreRef: { name: snapdragon-vault, kind: ClusterSecretStore }
  target:
    name: casdoor-app-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: snapdragon/casdoor-apps
