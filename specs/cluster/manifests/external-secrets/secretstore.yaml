# mod-bff-db-auth (namespace hugmesh-backend) <- secret/hugmesh/mod-bff-db
# Dedicated Postgres password for mod-bff-db; the mod-bff-db pod and its only
# consumer (hugmesh-mod-bff-api) both mount this Secret (key password) via
# secretKeyRef so they stay in sync. Mirrors the admin-bff-db-auth pattern.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mod-bff-db-auth
  namespace: hugmesh-backend
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: hugmesh-vault
    kind: ClusterSecretStore
  target:
    name: mod-bff-db-auth
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: hugmesh/mod-bff-db
        property: password
---
