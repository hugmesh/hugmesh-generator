# External Secrets Operator (ESO) configuration.
#
# A ClusterSecretStore "snapdragon-vault" points ESO at the cluster Vault
# (KV v2, mount "secret/", base path "snapdragon/" — the base segment equals the
# brand slug, default "snapdragon"). Each ExternalSecret below materializes one
# of the k8s Secrets the existing workloads already consume via secretKeyRef.
# The workload manifests are unchanged; ESO just creates/refreshes the Secrets.
#
# Auth: a Vault token read from the k8s Secret "vault-token" (key "token") in the
# external-secrets namespace. That Secret is provisioned offline from
# KEYS/vault/token by keys-provision (online sync), or the materialized Secrets
# themselves are created offline from KEYS/vault/secrets.json.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: snapdragon-vault
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: v2
      auth:
        tokenSecretRef:
          name: vault-token
          key: token
          namespace: external-secrets
---
# casdoor-google (namespace snapdragon-pki) <- secret/snapdragon/casdoor
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: casdoor-google
  namespace: snapdragon-pki
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: snapdragon-vault
    kind: ClusterSecretStore
  target:
    name: casdoor-google
    creationPolicy: Owner
  data:
    - secretKey: clientId
      remoteRef:
        key: snapdragon/casdoor
        property: google_client_id
    - secretKey: clientSecret
      remoteRef:
        key: snapdragon/casdoor
        property: google_client_secret
---
# clickhouse-auth (namespace snapdragon-backend) <- secret/snapdragon/clickhouse
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: clickhouse-auth
  namespace: snapdragon-backend
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: snapdragon-vault
    kind: ClusterSecretStore
  target:
    name: clickhouse-auth
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: snapdragon/clickhouse
        property: password
---
# clickhouse-auth (namespace observability) <- secret/snapdragon/clickhouse
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: clickhouse-auth
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: snapdragon-vault
    kind: ClusterSecretStore
  target:
    name: clickhouse-auth
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: snapdragon/clickhouse
        property: password
---
# uptrace-auth (namespace observability) <- secret/snapdragon/uptrace
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: uptrace-auth
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: snapdragon-vault
    kind: ClusterSecretStore
  target:
    name: uptrace-auth
    creationPolicy: Owner
  data:
    - secretKey: pg-password
      remoteRef:
        key: snapdragon/uptrace
        property: pg_password
    - secretKey: project-token
      remoteRef:
        key: snapdragon/uptrace
        property: project_token
