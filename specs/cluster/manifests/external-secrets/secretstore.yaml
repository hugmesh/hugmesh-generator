# casdoor-admin (ns snapdragon-pki) <- secret/snapdragon/casdoor — admin login
# the casdoor-init Job uses to call the Casdoor API. username is fixed ("admin");
# the password is the PLAINTEXT minted by gen-cluster-secrets.sh.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: casdoor-admin
  namespace: snapdragon-pki
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: snapdragon-vault
    kind: ClusterSecretStore
  target:
    name: casdoor-admin
    creationPolicy: Owner
    template:
      data:
        username: "admin"
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: snapdragon/casdoor
        property: admin_password_plain
---
# casdoor-db (ns snapdragon-pki) <- secret/snapdragon/casdoor (db_password_plain)
# DB creds for the external casdoor-pg Postgres. Username is the fixed "casdoor"
# (template constant); only the password comes from Vault. Consumed by the
# casdoor-pg Deployment (POSTGRES_USER/PASSWORD) AND the casdoor Deployment
# (CASDOOR_DB_USER/PASSWORD, interpolated into conf/app.conf).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: casdoor-db
  namespace: snapdragon-pki
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: snapdragon-vault
    kind: ClusterSecretStore
  target:
    name: casdoor-db
    creationPolicy: Owner
    template:
      data:
        username: "casdoor"
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: snapdragon/casdoor
        property: db_password_plain
---
# casdoor-app-secrets (ns snapdragon-pki) <- secret/snapdragon/casdoor-apps
# One Secret key per app (pki-gateway, be-gateway, ...), each the app's OAuth2
# client-secret. extract pulls every key from the Vault path. Consumed by the
# casdoor-init Job to set each application's clientSecret.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: casdoor-app-secrets
  namespace: snapdragon-pki
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: snapdragon-vault
    kind: ClusterSecretStore
  target:
    name: casdoor-app-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: snapdragon/casdoor-apps
---
# ─────────────────────────────────────────────────────────────────────────────
# GAMES-realm Casdoor (casdoor-games, ns snapdragon-games) — the SEPARATE,
