# mesh-bff-casdoor-client (ns hugmesh-backend) <- secret/hugmesh/mesh-bff-casdoor-client
# The Casdoor client-credentials pair mesh-bff mints its OWN outbound
# ROLE_SERVICE bearer from (calling user-bff's internal mesh-devices surface).
# Provisioned MANUALLY in Casdoor (a client-credentials application bound to
# ROLE_SERVICE — the meshbridge-appservice OIDC client precedent), then written
# to the Vault path; no literal ever in git. Absent Vault path => Secret never
# materializes => the pod's env stays unset and the user-bff leg ships dark
# (app default APP_MESH_USER_BFF_ENABLED=false semantics degrade to an empty
# registration mapping — see the app's application.yml).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mesh-bff-casdoor-client
  namespace: hugmesh-backend
spec:
  refreshInterval: 1h
  secretStoreRef: { name: hugmesh-vault, kind: ClusterSecretStore }
  target:
    name: mesh-bff-casdoor-client
    creationPolicy: Owner
  data:
    - secretKey: client_id
      remoteRef: { key: hugmesh/mesh-bff-casdoor-client, property: client_id }
    - secretKey: client_secret
      remoteRef: { key: hugmesh/mesh-bff-casdoor-client, property: client_secret }
