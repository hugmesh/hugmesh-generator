# client on BOTH sides. Two Secrets, one per side; each carries clientId/clientSecret.
# ─────────────────────────────────────────────────────────────────────────────
# casdoor-sync-systems (ns snapdragon-backend) <- secret/snapdragon/casdoor (systems
# side admin client for the sync job — app.casdoor.systems.client-id/secret).
