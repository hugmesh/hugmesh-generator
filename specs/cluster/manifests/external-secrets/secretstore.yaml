  data:
    - secretKey: clientSecret
      remoteRef:
        key: snapdragon/casdoor-games
        property: client_secret
---
# ─────────────────────────────────────────────────────────────────────────────
# PLUGGABLE MAIL (default protonmail) — optional, absent-by-default. Both Secrets
# source from secret/<brand>/mail (props provider/host/port/tls/user/password/from/
# dkim_key, seeded by gen-cluster-secrets.sh from the keys USB / prompt, or left
# empty => mail disabled). When the Vault path is absent ESO simply never creates
# the Secret; the casdoor/akkoma Deployments mark it optional, so no SMTP is wired
# and registration stays admin-approval (no email needed).
# ─────────────────────────────────────────────────────────────────────────────
# casdoor-smtp (ns snapdragon-pki) <- secret/snapdragon/mail. Materializes the
# CASDOOR_SMTP_* env the casdoor Deployment loads (optional secretRef) and the
# app.conf SMTP block interpolates.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: casdoor-smtp
  namespace: snapdragon-pki
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: snapdragon-vault
    kind: ClusterSecretStore
  target:
    name: casdoor-smtp
    creationPolicy: Owner
    template:
      data:
        CASDOOR_SMTP_HOST: "{{ .host }}"
        CASDOOR_SMTP_PORT: "{{ .port }}"
        CASDOOR_SMTP_USER: "{{ .user }}"
        CASDOOR_SMTP_PASSWORD: "{{ .password }}"
        CASDOOR_SMTP_FROM: "{{ .from }}"
  data:
    - secretKey: host
      remoteRef: { key: snapdragon/mail, property: host }
    - secretKey: port
      remoteRef: { key: snapdragon/mail, property: port }
    - secretKey: user
      remoteRef: { key: snapdragon/mail, property: user }
    - secretKey: password
      remoteRef: { key: snapdragon/mail, property: password }
    - secretKey: from
      remoteRef: { key: snapdragon/mail, property: from }
---
# akkoma-smtp (ns snapdragon-backend) <- secret/snapdragon/mail. Materializes the
# AKKOMA_SMTP_* env the akkoma Deployment loads (optional secretRef) and the
# Pleroma.Mailer Swoosh SMTP adapter reads. relay/port/user/pass/tls/from(+dkim).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: akkoma-smtp
  namespace: snapdragon-backend
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: snapdragon-vault
    kind: ClusterSecretStore
  target:
    name: akkoma-smtp
    creationPolicy: Owner
    template:
      data:
        AKKOMA_SMTP_RELAY: "{{ .host }}"
        AKKOMA_SMTP_PORT: "{{ .port }}"
        AKKOMA_SMTP_USER: "{{ .user }}"
        AKKOMA_SMTP_PASSWORD: "{{ .password }}"
        AKKOMA_SMTP_TLS: "{{ .tls }}"
        AKKOMA_SMTP_FROM: "{{ .from }}"
  data:
    - secretKey: host
      remoteRef: { key: snapdragon/mail, property: host }
    - secretKey: port
      remoteRef: { key: snapdragon/mail, property: port }
    - secretKey: user
      remoteRef: { key: snapdragon/mail, property: user }
    - secretKey: password
      remoteRef: { key: snapdragon/mail, property: password }
    - secretKey: tls
      remoteRef: { key: snapdragon/mail, property: tls }
    - secretKey: from
      remoteRef: { key: snapdragon/mail, property: from }
