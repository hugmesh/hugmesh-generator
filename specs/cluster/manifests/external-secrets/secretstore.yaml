# ─────────────────────────────────────────────────────────────────────────────
# snapdragon-actions cross-Casdoor sync credentials (ns snapdragon-backend). The
# scheduled GameMasterAdminSyncAction reads ROLE_GAMES_ADMIN from the SYSTEMS Casdoor
# and writes the "admin" role membership in the GAMES Casdoor, so it needs an admin
# client on BOTH sides. Two Secrets, one per side; each carries clientId/clientSecret.
# ─────────────────────────────────────────────────────────────────────────────
# casdoor-sync-systems (ns snapdragon-backend) <- secret/snapdragon/casdoor (systems
# side admin client for the sync job — app.casdoor.systems.client-id/secret).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: casdoor-sync-systems
  namespace: snapdragon-backend
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: snapdragon-vault
    kind: ClusterSecretStore
  target:
    name: casdoor-sync-systems
    creationPolicy: Owner
  data:
    - secretKey: clientId
      remoteRef:
        key: snapdragon/casdoor
        property: client_id
    - secretKey: clientSecret
      remoteRef:
        key: snapdragon/casdoor
        property: client_secret
---
# casdoor-sync-games (ns snapdragon-backend) <- secret/snapdragon/casdoor-games (games
# side admin client for the sync job — app.casdoor.games.client-id/secret). Same
# threewizards-app client the games BFF uses; client_credentials grant lets the sync
# job write role membership in the games realm.
apiVersion: external-secrets.io/v1beta1
