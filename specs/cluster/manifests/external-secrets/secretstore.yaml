# ═════════════════════════════════════════════════════════════════════════════
# PER-MACHINE-USER LEAST-PRIVILEGE DB CREDENTIALS (hardening).
#
# Each DB now has, BESIDES the owner password above (DDL/Liquibase only), a
# SEPARATE password per consuming machine-user. The single-consumer dbs get one
# non-owner app role (federation_app / adminbff_app / modbff_app / userbff_app);
# route-access-db gets four (admin_bff writer; pki/be/fe-gateway readers). The DB
# pod and the consumer reference the SAME Vault property so role + cred stay in
# sync. New Vault keys (alongside the existing `password` owner key):
#   secret/hugmesh/federation-db   : app_password
#   secret/hugmesh/admin-bff-db    : app_password
#   secret/hugmesh/mod-bff-db      : app_password
#   secret/hugmesh/user-bff-db     : app_password
#   secret/hugmesh/route-access-db : owner_password, admin_bff_password,
#                                       pki_gateway_password, be_gateway_password,
#                                       fe_gateway_password
# ═════════════════════════════════════════════════════════════════════════════
# federation-db-app-auth (ns hugmesh-backend) — RUNTIME password for the
# non-owner federation_app role. The federation-db pod (FEDERATION_APP_PASSWORD)
# and hugmesh-federation-api (SPRING_R2DBC_PASSWORD) both mount this.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: federation-db-app-auth
  namespace: hugmesh-backend
spec:
  refreshInterval: 1h
  secretStoreRef: { name: hugmesh-vault, kind: ClusterSecretStore }
  target:
    name: federation-db-app-auth
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef: { key: hugmesh/federation-db, property: app_password }
---
# admin-bff-db-app-auth (ns hugmesh-backend) — RUNTIME password for the
# non-owner adminbff_app role (DB pod ADMINBFF_APP_PASSWORD + app SPRING_R2DBC).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
