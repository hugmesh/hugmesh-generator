    - secretKey: clientSecret
      remoteRef:
        key: hugmesh/casdoor
        property: discord_client_secret
---
# casdoor-admin (ns hugmesh-pki) <- secret/hugmesh/casdoor — admin login
# the casdoor-init Job uses to call the Casdoor API. username is fixed ("admin");
# the password is the PLAINTEXT minted by gen-cluster-secrets.sh.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: casdoor-admin
  namespace: hugmesh-pki
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: hugmesh-vault
    kind: ClusterSecretStore
  target:
    name: casdoor-admin
    creationPolicy: Owner
    template:
      data:
        username: "admin"
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: hugmesh/casdoor
        property: admin_password_plain
---
# casdoor-db (ns hugmesh-pki) <- secret/hugmesh/casdoor (db_password_plain)
# DB creds for the external casdoor-pg Postgres. Username is the fixed "casdoor"
# (template constant); only the password comes from Vault. Consumed by the
# casdoor-pg Deployment (POSTGRES_USER/PASSWORD) AND the casdoor Deployment
# (CASDOOR_DB_USER/PASSWORD, interpolated into conf/app.conf).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: casdoor-db
  namespace: hugmesh-pki
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: hugmesh-vault
    kind: ClusterSecretStore
  target:
    name: casdoor-db
    creationPolicy: Owner
    template:
      data:
        username: "casdoor"
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: hugmesh/casdoor
        property: db_password_plain
---
# casdoor-app-secrets (ns hugmesh-pki) <- secret/hugmesh/casdoor-apps
# One Secret key per app (pki-gateway, be-gateway, ...), each the app's OAuth2
# client-secret. extract pulls every key from the Vault path. Consumed by the
# casdoor-init Job to set each application's clientSecret.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: casdoor-app-secrets
  namespace: hugmesh-pki
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: hugmesh-vault
    kind: ClusterSecretStore
  target:
    name: casdoor-app-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: hugmesh/casdoor-apps
---
# casdoor-superadmin (ns hugmesh-pki) <- secret/hugmesh/casdoor-superadmin
# Platform SUPERADMIN bootstrap user credentials. username and password are
# generated by gen-cluster-secrets.sh, written to Vault, and NEVER committed.
# Mounted read-only into the casdoor-init Job (optional: true) which creates
# the user in the hugmesh org and assigns ROLE_SUPERADMIN. Absent => the
# Job skips superadmin bootstrap gracefully (no brick; operator adds manually).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: casdoor-superadmin
  namespace: hugmesh-pki
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: hugmesh-vault
    kind: ClusterSecretStore
  target:
    name: casdoor-superadmin
    creationPolicy: Owner
    template:
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: hugmesh/casdoor-superadmin
        property: username
    - secretKey: password
      remoteRef:
        key: hugmesh/casdoor-superadmin
        property: password
---
# ─────────────────────────────────────────────────────────────────────────────
# GAMES-realm Casdoor (casdoor-games, ns hugmesh-games) — the SEPARATE,
# INDEPENDENT games identity provider (org "threewizards"). Its secrets live under
# the Vault path secret/<brand>/casdoor-games, distinct from the systems casdoor
# path above. Mirrors the systems casdoor-db / casdoor-admin / casdoor-app-secrets /
# casdoor-google blocks.
# ─────────────────────────────────────────────────────────────────────────────
# casdoor-games-db (ns hugmesh-games) <- secret/hugmesh/casdoor-games
# (db_password_plain). DB creds for the games casdoor-games-pg Postgres. Username is
# the fixed "threewizards" (matches hugmesh.games' POSTGRES_USER); only the
# password comes from Vault. Consumed by the casdoor-games-pg Deployment
# (POSTGRES_USER/PASSWORD) AND the casdoor-games Deployment (CASDOOR_DB_USER/PASSWORD,
# interpolated into conf/app.conf).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: casdoor-games-db
  namespace: hugmesh-games
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: hugmesh-vault
    kind: ClusterSecretStore
  target:
    name: casdoor-games-db
    creationPolicy: Owner
    template:
      data:
        username: "threewizards"
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: hugmesh/casdoor-games
        property: db_password_plain
---
# casdoor-games-admin (ns hugmesh-games) <- secret/hugmesh/casdoor-games — admin
# login the casdoor-games-init Job uses to call the games Casdoor API. username is
