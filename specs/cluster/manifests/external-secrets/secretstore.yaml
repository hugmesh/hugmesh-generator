---
# admin-bff-mfa (ns hugmesh-backend) <- secret/hugmesh/admin-bff-mfa
# The admin-bff MFA TOTP-secret encryption key (app.mfa.factor-key /
# APP_MFA_FACTOR_KEY). MfaSecretCipher AES-256-GCM-encrypts each enrolled TOTP
# secret at rest with this 256-bit data key (it prefers a base64-decoded 32-byte
# key; an arbitrary passphrase is SHA-256-folded as a fallback). The
# hugmesh-admin-bff-api Deployment mounts the `factor-key` key via secretKeyRef.
# Seeded by gen-cluster-secrets.sh (openssl rand -base64 32) under Vault property
# factor_key. LOAD-BEARING: the admin-bff Deployment arms APP_CASDOOR_MFA_ENABLED
# "true" and mounts this key through a REQUIRED secretKeyRef (no `optional:` —
# pinned by tests/scripts/cluster_manifest_integrity.py [mfa-factor-key]), so a
# Secret that fails to materialize BLOCKS admin-bff pod start with a
# CreateContainerConfigError naming admin-bff-mfa, rather than booting a pod
# whose MFA cipher is silently inert. Materializing the Secret sources the key;
# actual MFA *enforcement* at the gateways remains a separate operator flip
# (docs/MFA-ROLLOUT.md). Mirrors the clickhouse-auth / admin-bff-db-auth
# single-key pattern. NOTHING is committed plaintext — the value is ESO-sourced
# from Vault.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: admin-bff-mfa
  namespace: hugmesh-backend
spec:
  refreshInterval: 1h
  secretStoreRef: { name: hugmesh-vault, kind: ClusterSecretStore }
  target:
    name: admin-bff-mfa
    creationPolicy: Owner
  data:
    - secretKey: factor-key
      remoteRef: { key: hugmesh/admin-bff-mfa, property: factor_key }
---
# mod-bff-db-app-auth (ns hugmesh-backend) — RUNTIME password for the
# non-owner modbff_app role (DB pod MODBFF_APP_PASSWORD + app SPRING_R2DBC).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
