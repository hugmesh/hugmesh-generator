# harbor-registry — imagePullSecret (dockerconfigjson) for pulling first-party
# images from the in-cluster Harbor container registry. Hostname is UNCHANGED
# (registry.hugmesh.net) even though the backend is now Harbor, not
# GitLab's bundled registry — see apps/03a-harbor.yaml's header comment; the
# public hostname cutover is deliberately decoupled from this credential swap.
# One per namespace that runs first-party images. Sourced from the PULL-scoped
# Harbor robot account (project-level, action=pull) that
# manifests/harbor/harbor-provision-job.yaml creates and writes to
# secret/hugmesh/harbor-robots (pull_name/pull_secret) — see that Job for
# why this is now fully automated instead of an operator-pasted deploy token.
# Formerly named gitlab-registry; renamed for honesty now that Harbor serves it.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: harbor-registry
  namespace: hugmesh-backend
spec:
  refreshInterval: 1h
  secretStoreRef: { name: hugmesh-vault, kind: ClusterSecretStore }
  target:
    name: harbor-registry
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"registry.hugmesh.net":{"username":"{{ .username }}","password":"{{ .token }}","auth":"{{ printf "%s:%s" .username .token | b64enc }}"}}}
  data:
    - secretKey: username
      remoteRef: { key: hugmesh/harbor-robots, property: pull_name }
    - secretKey: token
      remoteRef: { key: hugmesh/harbor-robots, property: pull_secret }
---
