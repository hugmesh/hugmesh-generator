# External Secrets Operator (ESO) configuration.
#
# A ClusterSecretStore "hugmesh-vault" points ESO at the cluster Vault
# (KV v2, mount "secret/", base path "hugmesh/" — the base segment equals the
# brand slug, default "hugmesh"). Each ExternalSecret below materializes one
# of the k8s Secrets the existing workloads already consume via secretKeyRef.
#
# THE `hugmesh/` PREFIX IN EVERY remoteRef BELOW IS THE DEFAULT RENDER, NOT A
# CONSTANT. Issue #285, decision 38 = B on #347: the base segment tracks BRAND,
# because scripts/gen-cluster-secrets.sh (the WRITER) writes under
# BASE="${BRAND:-hugmesh}". The literal here is what the DEFAULT brand reads;
# rebrand_sysroot() in every build-*-stage4.sh rewrites that first path segment to
# <BRAND> in the baked tree at /var/lib/hugmesh/cluster, which is what a device
# actually serves to ArgoCD. Spell a new remoteRef exactly like its neighbours and
# it is carried automatically; spell it some other way and
# tests/scripts/test-eso-remoteref-brand.sh goes RED rather than letting a
# non-default brand read a path nothing ever wrote.
# The workload manifests are unchanged; ESO just creates/refreshes the Secrets.
#
# Auth: a Vault token read from the k8s Secret "vault-token" (key "token") in the
# external-secrets namespace. That Secret is provisioned offline from
# KEYS/vault/token by keys-provision (online sync), or the materialized Secrets
# themselves are created offline from KEYS/vault/secrets.json.
#
# TLS: Vault now serves HTTPS (manifests/vault is persistent + TLS). The server
# cert is signed by the cluster CA, so ESO validates it with a caProvider that
# reads the PUBLIC cluster CA cert (tls.crt) from the `cluster-ca` Secret in the
# vault namespace — the SAME anchor keys-provision seeds from the USB stick and
# that vault-pki imports into pki_int. (No CA key is referenced — only the cert.)
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: hugmesh-vault
spec:
  provider:
    vault:
      server: "https://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: v2
      # Trust the cluster CA that signed the Vault listener cert.
      caProvider:
        type: Secret
        name: cluster-ca
        namespace: vault
        key: tls.crt
      auth:
        tokenSecretRef:
          name: vault-token
          key: token
          namespace: external-secrets
---
# casdoor-google (namespace hugmesh-pki) <- secret/hugmesh/casdoor
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: casdoor-google
  namespace: hugmesh-pki
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: hugmesh-vault
    kind: ClusterSecretStore
  target:
    name: casdoor-google
    creationPolicy: Owner
  data:
    - secretKey: clientId
      remoteRef:
        key: hugmesh/casdoor
        property: google_client_id
    - secretKey: clientSecret
      remoteRef:
        key: hugmesh/casdoor
        property: google_client_secret
---
# casdoor-github (namespace hugmesh-pki) <- secret/hugmesh/casdoor — the
# GitHub OAuth federation provider client (lets anyone sign up; registration ->
# admin-approval assigns the role). Optional; the casdoor-init Job skips provider
# seeding when absent, so Casdoor falls back to native user/pass + admin-approval.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: casdoor-github
  namespace: hugmesh-pki
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: hugmesh-vault
    kind: ClusterSecretStore
  target:
    name: casdoor-github
    creationPolicy: Owner
  data:
    - secretKey: clientId
      remoteRef:
        key: hugmesh/casdoor
        property: github_client_id
    - secretKey: clientSecret
      remoteRef:
        key: hugmesh/casdoor
        property: github_client_secret
---
# casdoor-discord (namespace hugmesh-pki) <- secret/hugmesh/casdoor — the
# Discord OAuth federation provider client (Custom-category provider in Casdoor;
# lets anyone sign up; registration -> admin-approval assigns the role). Optional;
# the casdoor-init Job skips provider seeding when absent.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: casdoor-discord
  namespace: hugmesh-pki
