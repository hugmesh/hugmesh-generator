# attestation-server-smtp — DEFAULT-OFF optional-service (slug: attestation-server, ns
# hugmesh-pki). Own file (NOT inlined into secretstore.yaml, matches the
# akkoma/harbor/tube/headwind per-slug-file convention) so gate_optional_services can
# remove ONLY this file on deselect.
#
# Reuses the platform's EXISTING shared outbound-mail Vault doc (secret/hugmesh/mail) —
# the same document casdoor-smtp and akkoma-smtp already read
# (manifests/external-secrets/secretstore.yaml casdoor-smtp block, property names
# host/port/user/password/from) — rather than minting a new Vault path/credential. No new
# `vault kv put` is needed anywhere for this file.
#
# When mail is globally disabled (MAIL_ENABLED != "1"), this Secret renders with blank
# values, exactly mirroring casdoor-smtp/akkoma-smtp's documented "no SMTP" fallback
# behavior.
#
# CRITICAL CAVEAT (see attestation-server.yaml's smtp-config-seeder sidecar): unlike
# casdoor/akkoma, AttestationServer does NOT read these as process env vars itself —
# source-confirmed, it only reads SMTP settings from its own SQLite `Configuration` table
# (README.md:65-82 shows the manual `sqlite3 ... INSERT INTO Configuration` seeding
# method; AlertDispatcher.java:45-124 reads that table and simply logs+skips per-account
# if unset — no crash, attestation verification has zero dependency on email). This
# Secret's keys are consumed by the smtp-config-seeder sidecar, NOT by the
# attestation-server container directly. The ATTESTATION_SMTP_* property names below are
# OUR OWN naming choice for that sidecar (not app-defined config keys) — free to rename.
#
# NO admin-credential secret is included here. Unlike headwind's headwind-admin (LocalAuth
# env-var-injectable admin), AttestationServer has NO confirmed mechanism to pre-seed an
# operator account — source-confirmed CreateAccountHandler.handlePost
# (AttestationServer.java:1212-1239) does no auth/session check at all. Do not invent an
# admin secret with no confirmed consumer.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: attestation-server-smtp
  namespace: hugmesh-pki
  labels:
    app.kubernetes.io/name: attestation-server
    app.kubernetes.io/part-of: hugmesh.systems
    hugmesh.systems/optional-service: attestation-server
spec:
  refreshInterval: 1h
  secretStoreRef: { name: hugmesh-vault, kind: ClusterSecretStore }
  target: { name: attestation-server-smtp, creationPolicy: Owner }
  data:
    - secretKey: ATTESTATION_SMTP_HOST
      remoteRef: { key: hugmesh/mail, property: host }
    - secretKey: ATTESTATION_SMTP_PORT
      remoteRef: { key: hugmesh/mail, property: port }
    - secretKey: ATTESTATION_SMTP_USER
      remoteRef: { key: hugmesh/mail, property: user }
    - secretKey: ATTESTATION_SMTP_PASSWORD
      remoteRef: { key: hugmesh/mail, property: password }
    - secretKey: ATTESTATION_SMTP_FROM
      remoteRef: { key: hugmesh/mail, property: from }
