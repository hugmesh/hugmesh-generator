# image-builder-registry — the in-cluster Kaniko build pipeline's PUSH credential.
#
# WHY A SEPARATE SECRET (not the existing gitlab-registry pull secret): the
# per-namespace `gitlab-registry` imagePullSecret (secretstore.yaml) is built from a
# GROUP DEPLOY TOKEN with scope READ_REGISTRY — it can only PULL first-party images.
# The Kaniko build Job (manifests/image-builder/kaniko-build-job.template.yaml) must
# PUSH the image it builds, so it needs a distinct WRITE_REGISTRY credential. This
# ExternalSecret materializes that push credential as the `image-builder-registry`
# dockerconfigjson the build pod mounts read-only at /kaniko/.docker — exactly the
# secretName + key the Job template references. NEVER in git: the value is ESO-sourced
# from Vault (secret/<brand>/image-builder-registry), seeded by gen-cluster-secrets.sh
# with a placeholder the operator replaces with a real write_registry deploy token.
#
# DOCKERCONFIGJSON SHAPE: identical to the gitlab-registry pull secret (one auths
# entry for registry.snapdragon.systems, username+password+b64 auth) so Kaniko's
# DOCKER_CONFIG resolver authenticates the push the same way the runtime pull resolves.
#
# SHIPS DARK / OPT-IN: this ExternalSecret targets the snapdragon-image-builds
# namespace, which only exists once the opt-in apps-optional/60-image-builder.yaml
# Application is enabled (the root app-of-apps does NOT recurse apps-optional/). Until
# then ESO has no namespace to materialize into and this is inert; even after the
# namespace exists, ESO only SOURCES the push token — no build runs until a driver (the
# .gitlab-ci.yml build:images job / an ArgoCD hook) dispatches a Kaniko Job. Mirrors the
# gitlab-registry dockerconfigjson contract 1:1; the matching #110 service-catalog
# builder push secret follows the same shape (service-catalog-builder-registry).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: image-builder-registry
  namespace: snapdragon-image-builds
  labels:
    app.kubernetes.io/name: image-builder
    app.kubernetes.io/part-of: snapdragon.systems
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: snapdragon-vault
    kind: ClusterSecretStore
  target:
    name: image-builder-registry
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"registry.snapdragon.systems":{"username":"{{ .username }}","password":"{{ .token }}","auth":"{{ printf "%s:%s" .username .token | b64enc }}"}}}
  data:
    - secretKey: username
      remoteRef: { key: snapdragon/image-builder-registry, property: username }
    - secretKey: token
      remoteRef: { key: snapdragon/image-builder-registry, property: token }
