# image-builder-registry — the in-cluster Kaniko build pipeline's PUSH credential.
#
# WHY A SEPARATE SECRET (not harbor-registry, the pull secret): the per-namespace
# `harbor-registry` imagePullSecret (secretstore.yaml) is built from Harbor's
# PROJECT-scoped PULL robot account — it can only PULL first-party images. The
# Kaniko build Job (manifests/image-builder/kaniko-build-job.template.yaml) must
# PUSH the image it builds, so it needs Harbor's distinct PUSH-scoped robot
# account. This ExternalSecret materializes that push credential as the
# `image-builder-registry` dockerconfigjson the build pod mounts read-only at
# /kaniko/.docker — exactly the secretName + key the Job template references.
#
# NOW AUTOMATED (was a manual placeholder): the value is ESO-sourced from Vault
# (secret/hugmesh/harbor-robots, keys push_name/push_secret) — written there
# by manifests/harbor/harbor-provision-job.yaml the moment it mints Harbor's
# push-scoped robot account (Harbor reveals a robot secret exactly once, so that
# Job captures and stores it; ESO here only ever READS it back out of Vault).
# gen-cluster-secrets.sh's IMAGE_BUILDER_REGISTRY_TOKEN env var remains as a
# manual-override escape hatch for local/offline testing only.
#
# DOCKERCONFIGJSON SHAPE: identical to the harbor-registry pull secret (one auths
# entry for registry.hugmesh.net, username+password+b64 auth) so Kaniko's
# DOCKER_CONFIG resolver authenticates the push the same way the runtime pull resolves.
#
# TARGET NAMESPACE: this ExternalSecret targets the hugmesh-image-builds namespace,
# created by the ALWAYS-ON apps/60-image-builder.yaml Application (in the root
# app-of-apps' recursed apps/ set). Once that namespace exists ESO materializes the push
# secret here — so this credential now really lands in-cluster, and Vault
# secret/<brand>/harbor-robots MUST carry push_name/push_secret or the ExternalSecret
# reports SecretSyncedError. Materializing it starts NO build: ESO only SOURCES the push
# token — a build runs only when a driver (the .gitlab-ci.yml build:images job / an
# ArgoCD hook) dispatches a Kaniko Job. Mirrors the
# harbor-registry dockerconfigjson contract 1:1; the matching #110 service-catalog
# builder push secret follows the same shape (service-catalog-builder-registry).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: image-builder-registry
  namespace: hugmesh-image-builds
  labels:
    app.kubernetes.io/name: image-builder
    app.kubernetes.io/part-of: hugmesh.net
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: hugmesh-vault
    kind: ClusterSecretStore
  target:
    name: image-builder-registry
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"registry.hugmesh.net":{"username":"{{ .username }}","password":"{{ .token }}","auth":"{{ printf "%s:%s" .username .token | b64enc }}"}}}
  data:
    - secretKey: username
      remoteRef: { key: hugmesh/harbor-robots, property: push_name }
    - secretKey: token
      remoteRef: { key: hugmesh/harbor-robots, property: push_secret }
