# Headwind MDM ExternalSecrets — DEFAULT-OFF optional-service (slug: headwind, ns
# hugmesh-pki). CE only (no OIDC/SAML upstream — h-mdm/hmdm-server LocalAuth.java
# is the only identity path). Own file (NOT inlined into secretstore.yaml, unlike
# phpbb's legacy shape) so gate_optional_services can remove ONLY this file on
# deselect — matches the akkoma/harbor/tube per-slug-file convention.
#
# ONE Vault doc, secret/<brand>/headwind, holds:
#   DB_PASSWORD     — Postgres OWNER role `headwind`, used for BOTH
#                     install/Liquibase-migrate AND runtime queries — VERIFIED
#                     there is no separable runtime-only role (hmdm-server shares
#                     one datasource across migrate+runtime; see headwind-db.yaml)
#   ADMIN_PASSWORD  — NOT read by hmdm-docker's entrypoint (VERIFIED dead — see
#                     headwind.yaml's ADMIN CREDENTIALS comment: the real
#                     first-install admin is a HARDCODED admin/admin seeded by
#                     Liquibase). Kept here unused/harmless rather than ripping
#                     out the Vault plumbing; do not wire it to a container env.
# materialized into TWO k8s Secrets (matches optional-services.yaml's headwind
# esoKeys: [headwind-db-auth, headwind-admin]). headwind-admin's `email` key
# (below) is a literal, non-secret value — templated here (not sourced from
# Vault) purely so the Deployment's ADMIN_EMAIL env var has a secretKeyRef to
# point at, matching the ONE env var docker-entrypoint.sh actually honors for
# admin provisioning (see headwind.yaml).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: headwind-db-auth
  namespace: hugmesh-pki
  labels:
    app.kubernetes.io/name: headwind
    app.kubernetes.io/part-of: hugmesh.net
    hugmesh.net/optional-service: headwind
spec:
  refreshInterval: 1h
  secretStoreRef: { name: hugmesh-vault, kind: ClusterSecretStore }
  target: { name: headwind-db-auth, creationPolicy: Owner }
  data:
    - secretKey: password
      remoteRef: { key: hugmesh/headwind, property: DB_PASSWORD }
---
# Fixed-username admin login (mirrors harbor-admin's template shape exactly).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: headwind-admin
  namespace: hugmesh-pki
  labels:
    app.kubernetes.io/name: headwind
    app.kubernetes.io/part-of: hugmesh.net
    hugmesh.net/optional-service: headwind
spec:
  refreshInterval: 1h
  secretStoreRef: { name: hugmesh-vault, kind: ClusterSecretStore }
  target:
    name: headwind-admin
    creationPolicy: Owner
    template:
      data:
        username: "admin"
        password: "{{ .ADMIN_PASSWORD }}"
        # VERIFIED: the ONLY admin-provisioning env var docker-entrypoint.sh reads
        # (ADMIN_EMAIL) — sets the seeded admin's email + forces passwordReset=true.
        # Literal, non-secret value (matches phpbb.yaml's ADMIN_EMAIL convention).
        email: "admin@hugmesh.net"
  data:
    - secretKey: ADMIN_PASSWORD
      remoteRef: { key: hugmesh/headwind, property: ADMIN_PASSWORD }
