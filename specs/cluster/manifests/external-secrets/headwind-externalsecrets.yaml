# Headwind MDM ExternalSecrets — DEFAULT-OFF optional-service (slug: headwind, ns
# snapdragon-pki). CE only (no OIDC/SAML upstream — h-mdm/hmdm-server LocalAuth.java
# is the only identity path). Own file (NOT inlined into secretstore.yaml, unlike
# phpbb's legacy shape) so gate_optional_services can remove ONLY this file on
# deselect — matches the akkoma/harbor/tube per-slug-file convention.
#
# ONE Vault doc, secret/<brand>/headwind, holds:
#   DB_PASSWORD     — Postgres OWNER role `headwind`, used for BOTH
#                     install/Liquibase-migrate AND runtime queries — VERIFIED
#                     there is no separable runtime-only role (hmdm-server shares
#                     one datasource across migrate+runtime; see headwind-db.yaml)
#   ADMIN_PASSWORD  — Headwind local first-install admin (LocalAuth.java)
# materialized into TWO k8s Secrets (matches optional-services.yaml's headwind
# esoKeys: [headwind-db-auth, headwind-admin]).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: headwind-db-auth
  namespace: snapdragon-pki
  labels:
    app.kubernetes.io/name: headwind
    app.kubernetes.io/part-of: snapdragon.systems
    snapdragon.systems/optional-service: headwind
spec:
  refreshInterval: 1h
  secretStoreRef: { name: snapdragon-vault, kind: ClusterSecretStore }
  target: { name: headwind-db-auth, creationPolicy: Owner }
  data:
    - secretKey: password
      remoteRef: { key: snapdragon/headwind, property: DB_PASSWORD }
---
# Fixed-username admin login (mirrors harbor-admin's template shape exactly).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: headwind-admin
  namespace: snapdragon-pki
  labels:
    app.kubernetes.io/name: headwind
    app.kubernetes.io/part-of: snapdragon.systems
    snapdragon.systems/optional-service: headwind
spec:
  refreshInterval: 1h
  secretStoreRef: { name: snapdragon-vault, kind: ClusterSecretStore }
  target:
    name: headwind-admin
    creationPolicy: Owner
    template:
      data:
        username: "admin"
        password: "{{ .ADMIN_PASSWORD }}"
  data:
    - secretKey: ADMIN_PASSWORD
      remoteRef: { key: snapdragon/headwind, property: ADMIN_PASSWORD }
