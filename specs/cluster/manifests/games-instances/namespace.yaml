# hugmesh-games-instances — DEDICATED namespace for the per-domain FOSS game-server
# INSTANCES of the games app-store (distinct from hugmesh-games, which hosts the games
# REALM + its Casdoor + the GPU games backend). Game-server instances run arbitrary
# superadmin-curated FOSS container images, so they get the STRICTEST posture: a dedicated
# namespace whose ONLY NetworkPolicy is default-deny (network-policy.yaml) + the enforced
# (not audit) restricted PodSecurity standard (podsecurity.yaml).
#
# WHY A DEDICATED NAMESPACE (the forum precedent, intensified): k8s NetworkPolicy is
# additive-allow within a namespace, so a per-pod policy cannot SUBTRACT a namespace-wide
# tier allow. hugmesh-games carries a tier-ingress podSelector:{} allow (for the games
# realm + casdoor-games), which would let any of those reach an instance pod. Carving
# instances into their OWN fresh namespace whose only policy is default-deny gives a REAL
# isolation boundary — the instance pods admit ingress ONLY from be-gateway (HTTP console
# path-routing) + the per-instance NodePort (raw game protocol), nothing else.
#
# Arbitrary-container exec is the core risk of an app-store of game servers; this namespace
# is the blast-radius container. cosign/CVE-scan of the curated images + gVisor/Kata runtime
# isolation are documented residuals (see docs/GAMES-APPSTORE.md), layered on top of this.
apiVersion: v1
kind: Namespace
metadata:
  name: hugmesh-games-instances
  labels:
    app.kubernetes.io/part-of: hugmesh.systems
    # Selectable by NetworkPolicy namespaceSelector (the be-gateway ingress allow keys
    # on this label).
    kubernetes.io/metadata.name: hugmesh-games-instances
    hugmesh.systems/tier: games-instances
    # ENFORCE the restricted Pod Security Standard at admission (not audit) — a curated
    # image that tries to run privileged / as root / with caps is REJECTED at the API
    # server, defence-in-depth alongside podsecurity.yaml's per-pod securityContext.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
