# Cassandra bootstrap Job — runs bootstrap.sh (keyspaces -> roles -> grants).
#
# ArgoCD PostSync HOOK, the same idiom as manifests/harbor/harbor-provision-job.yaml
# and manifests/casdoor/init-job.yaml: it runs after this Application's own
# resources are applied, re-runs on every sync (BeforeHookCreation replaces the
# previous Job), and a FAILURE fails the sync instead of being swallowed. That
# matters here — a bootstrap that quietly does nothing is precisely how
# `Invalid keyspace hugmesh_gateway` reached a live cluster.
#
# ORDERING. This app carries sync-wave "1": after apps/00-cassandra.yaml (wave 0,
# the StatefulSet) and before the four gateway Applications, which were moved to
# wave "2" for this reason. The script ALSO waits for CQL itself, because under
# the default recurse root (../../app-of-apps.yaml) every child app reconciles
# continuously and wave ordering is best-effort; the wait plus idempotency is what
# makes convergence not depend on it.
#
# Image: the SAME pinned Cassandra image as apps/00-cassandra.yaml so `cqlsh` is
# the exact client version of the server.
#
# SELinux: shares the cassandra MCS category s0:c63 (docs/SECURITY.md §3) — it is
# a Cassandra-tier admin client, not a new node service, so no new .te module.
apiVersion: batch/v1
kind: Job
metadata:
  name: cassandra-bootstrap
  namespace: hugmesh-pki
  labels:
    app: cassandra-bootstrap
    app.kubernetes.io/name: cassandra
    app.kubernetes.io/part-of: hugmesh.net
    hugmesh.net/tier: db-bootstrap
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 4
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        # MUST match manifests/networkpolicy/db-ingress.yaml's
        # db-ingress-cassandra allow-list — that policy is default-deny-except, so
        # a Job pod without this label cannot reach :9042 at all.
        app: cassandra-bootstrap
        app.kubernetes.io/part-of: hugmesh.net
    spec:
      restartPolicy: Never
      # No nodeSelector on purpose: this is a short-lived CQL client that only
      # needs to reach the cassandra Service, not the node holding its data
      # volume. Pinning it would add a scheduling failure mode for no benefit.
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
        # Cassandra MCS category (docs/SECURITY.md §3 — shares cassandra s0:c63).
        seLinuxOptions: { level: "s0:c63" }
      containers:
        - name: cqlsh
          image: docker.io/bitnamilegacy/cassandra:5.0.5
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "/scripts/bootstrap.sh"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: { drop: ["ALL"] }
          env:
            - { name: CASSANDRA_HOST, value: "cassandra.hugmesh-pki.svc.cluster.local" }
            - { name: CASSANDRA_PORT, value: "9042" }
            # cqlsh writes its history under $HOME/.cassandra; the root filesystem
            # is read-only, so point HOME at the tmp emptyDir below.
            - { name: HOME, value: "/tmp" }
            # TLS flip toggle — set true together with the (still dark) client
            # encryption leg in manifests/cassandra-hardening.
            - { name: CASSANDRA_TLS_ENABLED, value: "false" }
            # Bootstrap superuser — the ESO cassandra-admin Secret, which is ALSO
            # what apps/00-cassandra.yaml hands the chart as dbUser.existingSecret,
            # so there is exactly one superuser password in the cluster.
            - name: CASSANDRA_ADMIN_USER
              valueFrom: { secretKeyRef: { name: cassandra-admin, key: user } }
            - name: CASSANDRA_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: cassandra-admin, key: password } }
            # Per-app role passwords — one ESO Secret, one key per role. The
            # hugmesh-pki copy carries all six because this Job creates all six.
            - name: ADMIN_BFF_CASS_PASSWORD
              valueFrom: { secretKeyRef: { name: cassandra-app-creds, key: admin-bff } }
            - name: PKI_GW_CASS_PASSWORD
              valueFrom: { secretKeyRef: { name: cassandra-app-creds, key: pki-gateway } }
            - name: BE_GW_CASS_PASSWORD
              valueFrom: { secretKeyRef: { name: cassandra-app-creds, key: be-gateway } }
            - name: FE_GW_CASS_PASSWORD
              valueFrom: { secretKeyRef: { name: cassandra-app-creds, key: fe-gateway } }
            - name: SA_GW_CASS_PASSWORD
              valueFrom: { secretKeyRef: { name: cassandra-app-creds, key: superadmin-gateway } }
            - name: FEDERATION_CASS_PASSWORD
              valueFrom: { secretKeyRef: { name: cassandra-app-creds, key: federation } }
          volumeMounts:
            - { name: scripts, mountPath: /scripts, readOnly: true }
            - { name: tmp, mountPath: /tmp }
            # cluster-CA truststore for cqlsh --ssl (only read once TLS is flipped).
            - { name: cassandra-tls, mountPath: /etc/cassandra-tls, readOnly: true }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits:   { cpu: 250m, memory: 256Mi }
      volumes:
        - name: scripts
          configMap:
            name: cassandra-bootstrap
            defaultMode: 0555
        - name: tmp
          emptyDir: {}
        # The cluster-CA cert (ca.crt) for cqlsh's --ssl truststore. Reuses the
        # per-namespace vault-ca Secret seeded by keys-provision. optional:true so
        # the Job still schedules while the TLS leg is off (the default).
        - name: cassandra-tls
          secret:
            secretName: vault-ca
            optional: true
            items:
              - { key: ca.crt, path: ca.crt }
