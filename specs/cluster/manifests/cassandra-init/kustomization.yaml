apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hugmesh-pki

# Cassandra cluster bootstrap — LIVE, auto-synced (apps/00b-cassandra-init.yaml).
# ============================================================================
# This is the cluster-side counterpart of compose's `cassandra-init` service. It
# is NOT dark and must not become dark: without it a fresh cluster has no
# keyspaces and no application roles, so every gateway CrashLoopBackOffs
# (docs/KIND-SSO-E2E-FINDINGS.md #5 + #6).
#
# The credentials it consumes (cassandra-admin, cassandra-app-creds) are
# ExternalSecrets in manifests/external-secrets/cassandra-externalsecrets.yaml —
# kept with every other ESO Secret rather than here, so the seed-contract
# checks see them in the one place they look.
#
# The still-unshipped Cassandra TLS work lives in the DARK sibling overlay
# manifests/cassandra-hardening.
resources:
  - bootstrap-configmap.yaml   # keyspaces + roles + grants CQL
  - bootstrap-job.yaml         # PostSync hook that runs it
