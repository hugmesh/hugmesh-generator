apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - akkoma.yaml
  - admin-sync-job.yaml   # maps Casdoor ROLE_MOD -> akkoma --moderator, ROLE_ADMIN -> --admin
  # DOMAIN-LOCK (homeserver.domainlock.enabled) — SHIPS DARK, NOT wired by default.
  # domainlock-sync-job.yaml materializes ROLE_MASTODON_DOMAINLOCKED -> the
  # ForceLocalForUsers MRF force-local set. hugmesh-akkoma (images/akkoma/) compiles
  # the module in; it also needs the :mrf policies block enabled in akkoma.yaml and a
  # PUBLISHED image digest pinned (images/akkoma/README.md, "Pinning"). Uncomment the
  # line below ONLY after both. See docs/DOMAIN-LOCK.md.
  # - domainlock-sync-job.yaml
