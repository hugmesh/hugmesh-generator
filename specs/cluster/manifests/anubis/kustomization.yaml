apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hugmesh-frontend
resources:
  - deployment.yaml

# Anubis is an UPSTREAM (third-party) image, pinned to an explicit tag for
# supply-chain reasons. Unlike the first-party apps it is NOT rewritten to the
# in-cluster Harbor registry; it is pulled from ghcr.io. Pin bumps happen here.
images:
  - { name: ghcr.io/techarohq/anubis, newName: ghcr.io/techarohq/anubis, newTag: v1.25.0 }
