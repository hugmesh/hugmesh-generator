# Cassandra node/client server cert via Vault-PKI -> ESO (ADR-32 — DARK, Stage 2).
#
# SAME shape + cluster-CA chain + auth/caProvider as the per-DB Postgres server
# certs in manifests/external-secrets/pki-externalsecrets.yaml (PR-C1). Requires
# the `cassandra` Vault-PKI issuing role (see cassandra-pki-role.patch.txt) to
# exist first. Materializes the kubernetes.io/tls Secret `cassandra-mtls`
# (tls.crt/tls.key/ca.crt) in hugmesh-pki; the keystore-builder Job converts
# that PEM into the JKS keystore/truststore the bitnami chart's tls.existingSecret
# expects.
#
# DARK: lives in the cassandra-hardening overlay (NOT auto-synced) and is applied
# only at the TLS-flip step. CN/SANs mirror the Cassandra Service DNS so a TLS
# client can verify the hostname.
---
# mtls-issuance: not-delivered apps/00a-cassandra-hardening.yaml points at the EMPTY overlay manifests/cassandra-hardening-empty and carries NO syncPolicy.automated, so ArgoCD renders zero objects from this directory until an operator repoints the path and syncs by hand
# (labels hugmesh.net/ships=dark; ADR-32 / docs/CLUSTER-HARDENING-PLAN.md
# §H). The `cassandra` pki_int issuing role is absent from
# manifests/vault-pki/pki-init-configmap.yaml too, so nothing could issue this
# certificate today even if the overlay were applied. DELETE this marker at the
# TLS-flip step — the post-condition fails on a marker whose generator is live,
# so it cannot be left behind.
apiVersion: generators.external-secrets.io/v1alpha1
kind: VaultDynamicSecret
metadata:
  name: cassandra-mtls
  namespace: hugmesh-pki
  labels: { app.kubernetes.io/part-of: hugmesh.net, hugmesh.net/ships: dark }
spec:
  path: pki_int/issue/cassandra
  method: POST
  parameters:
    common_name: cassandra.hugmesh-pki.svc.cluster.local
    alt_names: cassandra,cassandra.hugmesh-pki,cassandra-headless,cassandra-headless.hugmesh-pki
    ttl: "720h"
  resultType: Data
  provider:
    server: https://vault.vault.svc.cluster.local:8200
    # Trust Vault's cluster-CA-signed listener via the PUBLIC cluster CA cert in
    # the per-namespace `vault-ca` Secret (key ca.crt), seeded offline by
    # keys-provision — the SAME anchor pki_int chains to. (Cert only.)
    caProvider: { type: Secret, name: vault-ca, key: ca.crt }
    auth:
      tokenSecretRef: { name: vault-token, key: token }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cassandra-mtls
  namespace: hugmesh-pki
  labels: { app.kubernetes.io/part-of: hugmesh.net, hugmesh.net/ships: dark }
spec:
  refreshInterval: 168h
  target:
    name: cassandra-mtls
    creationPolicy: Owner
    template:
      type: kubernetes.io/tls
      data:
        tls.crt: "{{ .certificate }}"
        tls.key: "{{ .private_key }}"
        ca.crt: "{{ .issuing_ca }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: VaultDynamicSecret
          name: cassandra-mtls
