# Cassandra per-app LEAST-PRIVILEGE role bootstrap (DB-hardening, ADR-32 — DARK).
#
# Mirrors the Postgres per-machine-user role idiom (route-access initdb/10-roles.sh):
# each consumer gets its OWN login role with only the GRANTs it needs on the
# keyspace it touches — NOT the Cassandra superuser. Passwords are injected from
# per-app ESO Secrets via env (never committed); a missing/empty password is a
# HARD ERROR so we never create a passwordless or shared-password role.
#
# This is a CQL script run by bootstrap-roles-job.yaml AFTER the operator has
# enabled PasswordAuthenticator + CassandraAuthorizer on the cluster (see the
# values overlay in cassandra-values-overlay.yaml + docs/CLUSTER-HARDENING-PLAN.md
# §H). It is IDEMPOTENT (CREATE ROLE IF NOT EXISTS / GRANT is replayable) and runs
# as the BOOTSTRAP superuser (the rotated `cassandra` admin) ONLY at flip time.
#
# Keyspaces (the two Cassandra stores in this platform):
#   snapdragon_gateway     — gateway revocation list + URL registry (shared).
#                            Writers: admin-bff-api (registry writes).
#                            Readers: the four gateways (revocation + registry reads).
#   snapdragon_federation  — federation-api manifest write-through cache.
#                            Reader+writer: federation-api ONLY.
#
# Role/grant matrix (least-privilege; see docs/CLUSTER-HARDENING-PLAN.md §H):
#   admin_bff_cass   -> MODIFY+SELECT on snapdragon_gateway      (registry writer)
#   pki_gw_cass      -> SELECT        on snapdragon_gateway      (reader)
#   be_gw_cass       -> SELECT        on snapdragon_gateway      (reader)
#   fe_gw_cass       -> SELECT        on snapdragon_gateway      (reader)
#   sa_gw_cass       -> SELECT        on snapdragon_gateway      (reader)
#   federation_cass  -> MODIFY+SELECT on snapdragon_federation   (cache r/w)
#
# CassandraAuthorizer is DENY-by-default: a role with no GRANT can authenticate
# but read/write NOTHING — so this fails CLOSED. The default `cassandra`
# superuser MUST be rotated to a strong ESO-sourced password (the chart's
# dbUser.password) and is NOT used by any app.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cassandra-bootstrap-roles
  namespace: hugmesh-pki
  labels:
    app.kubernetes.io/part-of: hugmesh.systems
    snapdragon.systems/tier: db-hardening
    snapdragon.systems/ships: dark
data:
  bootstrap-roles.sh: |
    #!/usr/bin/env bash
    # Bootstrap per-app least-privilege Cassandra roles. Runs ONCE at auth flip.
    # Refuses to run with an empty per-app password (no passwordless/shared roles).
    set -euo pipefail

    : "${CASSANDRA_HOST:?CASSANDRA_HOST required (e.g. cassandra.hugmesh-pki.svc.cluster.local)}"
    : "${CASSANDRA_PORT:=9042}"
    : "${CASSANDRA_ADMIN_USER:?bootstrap superuser (rotated 'cassandra') required}"
    : "${CASSANDRA_ADMIN_PASSWORD:?bootstrap superuser password required}"

    require() { # require VAR human-name
      local v="${!1:-}"
      if [ -z "$v" ]; then
        echo "FATAL: $2 password ($1) empty — refusing passwordless/shared role" >&2
        exit 1
      fi
    }
    require ADMIN_BFF_CASS_PASSWORD   "admin-bff"
    require PKI_GW_CASS_PASSWORD      "pki-gateway"
    require BE_GW_CASS_PASSWORD       "be-gateway"
    require FE_GW_CASS_PASSWORD       "fe-gateway"
    require SA_GW_CASS_PASSWORD       "superadmin-gateway"
    require FEDERATION_CASS_PASSWORD  "federation-api"

    # TLS to the node when client_encryption is on (the TLS leg, also dark). The
    # SSL flags are no-ops over a plaintext listener, so this works in BOTH the
    # auth-only and auth+TLS rollout stages. --cqlversion omitted (server default).
    SSL_ARGS=()
    if [ "${CASSANDRA_TLS_ENABLED:-false}" = "true" ]; then
      # cqlsh reads the truststore via env (SSL_CERTFILE = cluster CA PEM).
      export SSL_CERTFILE="${SSL_CERTFILE:-/etc/cassandra-tls/ca.crt}"
      SSL_ARGS=(--ssl)
    fi

    cql() {
      cqlsh "$CASSANDRA_HOST" "$CASSANDRA_PORT" \
        -u "$CASSANDRA_ADMIN_USER" -p "$CASSANDRA_ADMIN_PASSWORD" \
        "${SSL_ARGS[@]}" -e "$1"
    }

    echo "==> creating per-app least-privilege roles (idempotent)"
    # Roles: LOGIN=true, SUPERUSER=false. Passwords from env (quoted by cqlsh).
    create_role() { # create_role <role> <password-var>
      local role="$1" pw="${!2}"
      cql "CREATE ROLE IF NOT EXISTS ${role} WITH LOGIN = true AND SUPERUSER = false AND PASSWORD = '${pw//\'/\'\'}';"
    }
    create_role admin_bff_cass  ADMIN_BFF_CASS_PASSWORD
    create_role pki_gw_cass     PKI_GW_CASS_PASSWORD
    create_role be_gw_cass      BE_GW_CASS_PASSWORD
    create_role fe_gw_cass      FE_GW_CASS_PASSWORD
    create_role sa_gw_cass      SA_GW_CASS_PASSWORD
    create_role federation_cass FEDERATION_CASS_PASSWORD

    echo "==> granting least-privilege keyspace permissions (deny-by-default authorizer)"
    # snapdragon_gateway: admin-bff writes the URL registry; gateways read.
    cql "GRANT MODIFY ON KEYSPACE snapdragon_gateway TO admin_bff_cass;"
    cql "GRANT SELECT ON KEYSPACE snapdragon_gateway TO admin_bff_cass;"
    for r in pki_gw_cass be_gw_cass fe_gw_cass sa_gw_cass; do
      cql "GRANT SELECT ON KEYSPACE snapdragon_gateway TO ${r};"
    done
    # snapdragon_federation: federation-api owns its manifest cache (r/w).
    cql "GRANT MODIFY ON KEYSPACE snapdragon_federation TO federation_cass;"
    cql "GRANT SELECT ON KEYSPACE snapdragon_federation TO federation_cass;"

    echo "==> Cassandra role bootstrap complete (deny-by-default; superuser untouched-by-apps)"
