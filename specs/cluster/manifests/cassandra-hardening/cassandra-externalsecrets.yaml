# Cassandra auth credentials — ESO/Vault ONLY (DB-hardening, ADR-32 — DARK).
#
# Two ExternalSecrets, both sourced from the cluster Vault via the existing
# ClusterSecretStore "hugmesh-vault" (manifests/external-secrets/secretstore.yaml):
#
#   cassandra-admin       <- secret/hugmesh/cassandra-admin
#       The ROTATED bootstrap superuser (replaces the chart's default `cassandra`
#       /`cassandra`). Consumed by the chart (dbUser.existingSecret) AND the
#       role-bootstrap Job. Keys: user, password.
#
#   cassandra-app-creds   <- secret/hugmesh/cassandra-app-creds
#       One password per least-privilege app role. Keys: admin-bff, pki-gateway,
#       be-gateway, fe-gateway, superadmin-gateway, federation.
#
# NO secret material here — only Vault `remoteRef` pointers. These materialize
# ONLY once the operator populates those Vault paths (gen-cluster-secrets mints
# `openssl rand -base64 24` per key). Until then ESO leaves the target Secret
# absent and nothing references it (the apps consume these creds only after the
# operator flips auth on — see docs/CLUSTER-HARDENING-PLAN.md §H). Mirrors the
# coturn / velero "materialize only once the Vault path is populated" idiom.
#
# DARK: these objects live in the cassandra-hardening overlay, which is NOT in the
# auto-synced ArgoCD tree. They are applied deliberately at flip time. Even if
# applied early they are inert — an ExternalSecret whose Vault path is empty just
# fails to sync its own target Secret; it touches no running workload.
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cassandra-admin
  namespace: hugmesh-pki
  labels:
    app.kubernetes.io/part-of: hugmesh.systems
    hugmesh.systems/ships: dark
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: hugmesh-vault
    kind: ClusterSecretStore
  target:
    name: cassandra-admin
    creationPolicy: Owner
  data:
    - secretKey: user
      remoteRef: { key: hugmesh/cassandra-admin, property: user }
    - secretKey: password
      remoteRef: { key: hugmesh/cassandra-admin, property: password }
    # Alias the superuser password under the key the bitnami chart reads from
    # dbUser.existingSecret (it defaults to `cassandra-password`) so the SAME
    # Secret satisfies BOTH the chart and the bootstrap Job (which reads `password`).
    - secretKey: cassandra-password
      remoteRef: { key: hugmesh/cassandra-admin, property: password }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cassandra-app-creds
  namespace: hugmesh-pki
  labels:
    app.kubernetes.io/part-of: hugmesh.systems
    hugmesh.systems/ships: dark
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: hugmesh-vault
    kind: ClusterSecretStore
  target:
    name: cassandra-app-creds
    creationPolicy: Owner
  data:
    - secretKey: admin-bff
      remoteRef: { key: hugmesh/cassandra-app-creds, property: admin-bff }
    - secretKey: pki-gateway
      remoteRef: { key: hugmesh/cassandra-app-creds, property: pki-gateway }
    - secretKey: be-gateway
      remoteRef: { key: hugmesh/cassandra-app-creds, property: be-gateway }
    - secretKey: fe-gateway
      remoteRef: { key: hugmesh/cassandra-app-creds, property: fe-gateway }
    - secretKey: superadmin-gateway
      remoteRef: { key: hugmesh/cassandra-app-creds, property: superadmin-gateway }
    - secretKey: federation
      remoteRef: { key: hugmesh/cassandra-app-creds, property: federation }
