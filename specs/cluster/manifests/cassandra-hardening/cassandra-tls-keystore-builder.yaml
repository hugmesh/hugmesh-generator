# Cassandra TLS keystore builder (DB-hardening, ADR-32 — DARK, Stage 2).
#
# The bitnami cassandra chart's tls.existingSecret expects a Secret whose DATA
# contains files named `keystore` and `truststore` (JKS), with their passwords in
# tls.passwordsSecret (keys keystore-password / truststore-password). The platform
# PKI emits PEM (Vault-PKI -> cassandra-mtls: tls.crt/tls.key/ca.crt), so this Job
# converts PEM -> JKS — mirroring the gateway chart's build-keystore initContainer
# (PEM -> keystore.p12 + truststore.p12). It writes:
#   * Secret cassandra-tls-stores      (files keystore, truststore)  -> tls.existingSecret
#   * Secret cassandra-tls-passwords   (keystore-password, truststore-password) -> tls.passwordsSecret
#
# The JKS store password is generated IN-JOB (openssl rand) and persisted ONLY in
# cassandra-tls-passwords — it never appears in git. Re-running rotates both stores
# together (chart picks up the new password Secret on the next roll).
#
# DARK: in the cassandra-hardening overlay (NOT auto-synced); run only at the
# TLS-flip step AFTER cassandra-mtls has materialized. A ServiceAccount with a
# tight Role (get/create/patch only these two Secrets) keeps it least-privilege.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cassandra-tls-builder
  namespace: hugmesh-pki
  labels: { app.kubernetes.io/part-of: hugmesh.systems, hugmesh.systems/ships: dark }
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cassandra-tls-builder
  namespace: hugmesh-pki
  labels: { app.kubernetes.io/part-of: hugmesh.systems, hugmesh.systems/ships: dark }
rules:
  # Read the source PEM Secret.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
    resourceNames: ["cassandra-mtls"]
  # Create/update ONLY the two derived store Secrets.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch"]
    resourceNames: ["cassandra-tls-stores", "cassandra-tls-passwords"]
  # `create` needs unconditional create on the collection (resourceNames cannot
  # gate create on absent objects); kept to secrets in THIS namespace only.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cassandra-tls-builder
  namespace: hugmesh-pki
  labels: { app.kubernetes.io/part-of: hugmesh.systems, hugmesh.systems/ships: dark }
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cassandra-tls-builder
subjects:
  - kind: ServiceAccount
    name: cassandra-tls-builder
    namespace: hugmesh-pki
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cassandra-tls-builder
  namespace: hugmesh-pki
  labels: { app.kubernetes.io/part-of: hugmesh.systems, hugmesh.systems/ships: dark }
data:
  build-stores.sh: |
    #!/usr/bin/env bash
    # PEM (cassandra-mtls) -> JKS keystore + truststore -> two k8s Secrets.
    set -euo pipefail
    NS=hugmesh-pki
    WORK="$(mktemp -d)"; trap 'rm -rf "$WORK"' EXIT
    cd "$WORK"

    echo "==> reading cassandra-mtls PEM"
    kubectl -n "$NS" get secret cassandra-mtls \
      -o jsonpath='{.data.tls\.crt}' | base64 -d > tls.crt
    kubectl -n "$NS" get secret cassandra-mtls \
      -o jsonpath='{.data.tls\.key}' | base64 -d > tls.key
    kubectl -n "$NS" get secret cassandra-mtls \
      -o jsonpath='{.data.ca\.crt}'  | base64 -d > ca.crt

    PW="$(openssl rand -base64 24)"

    echo "==> building keystore.jks (node identity)"
    openssl pkcs12 -export -name cassandra \
      -in tls.crt -inkey tls.key -certfile ca.crt \
      -out keystore.p12 -passout "pass:${PW}"
    keytool -importkeystore -noprompt \
      -srckeystore keystore.p12 -srcstoretype PKCS12 -srcstorepass "${PW}" \
      -destkeystore keystore -deststoretype JKS -deststorepass "${PW}"

    echo "==> building truststore.jks (cluster CA anchor)"
    keytool -importcert -noprompt -alias hugmesh-cluster-ca \
      -file ca.crt -keystore truststore -storetype JKS -storepass "${PW}"

    echo "==> writing Secret cassandra-tls-stores (files keystore, truststore)"
    kubectl -n "$NS" create secret generic cassandra-tls-stores \
      --from-file=keystore=keystore --from-file=truststore=truststore \
      --dry-run=client -o yaml | kubectl apply -f -

    echo "==> writing Secret cassandra-tls-passwords (keystore-password, truststore-password)"
    kubectl -n "$NS" create secret generic cassandra-tls-passwords \
      --from-literal=keystore-password="${PW}" \
      --from-literal=truststore-password="${PW}" \
      --dry-run=client -o yaml | kubectl apply -f -

    echo "==> cassandra TLS stores built (password held ONLY in cassandra-tls-passwords)"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: cassandra-tls-keystore-builder
  namespace: hugmesh-pki
  labels: { app.kubernetes.io/part-of: hugmesh.systems, hugmesh.systems/tier: db-hardening, hugmesh.systems/ships: dark }
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels: { app: cassandra-tls-keystore-builder, app.kubernetes.io/part-of: hugmesh.systems }
    spec:
      restartPolicy: Never
      serviceAccountName: cassandra-tls-builder
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
        # Shares the cassandra MCS category (docs/SECURITY.md §3 — cassandra s0:c63).
        seLinuxOptions: { level: "s0:c63" }
      containers:
        - name: builder
          # The bitnami cassandra image carries the JRE keytool + openssl + bash.
          # It does NOT ship kubectl, so a static kubectl is vendored into a shared
          # emptyDir by the fetch-kubectl initContainer below and mounted on PATH.
          image: docker.io/bitnamilegacy/cassandra:5.0.5
          command: ["/bin/bash", "/scripts/build-stores.sh"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: { drop: ["ALL"] }
          env:
            - { name: HOME, value: /tmp }
          volumeMounts:
            - { name: scripts, mountPath: /scripts, readOnly: true }
            - { name: kubectl, mountPath: /usr/local/bin/kubectl, subPath: kubectl, readOnly: true }
            - { name: tmp, mountPath: /tmp }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: 500m, memory: 512Mi }
      initContainers:
        # Vendor a static kubectl into a shared emptyDir so the builder can talk to
        # the API with its tightly-scoped ServiceAccount (no kubectl in the cassandra
        # image). bitnami/kubectl is runAsNonRoot-friendly.
        - name: fetch-kubectl
          image: docker.io/bitnamilegacy/kubectl:1.30
          command: ["/bin/sh", "-c", "cp \"$(command -v kubectl)\" /shared/kubectl"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: kubectl, mountPath: /shared }
      volumes:
        - name: scripts
          configMap: { name: cassandra-tls-builder, defaultMode: 0555 }
        - name: kubectl
          emptyDir: {}
        - name: tmp
          emptyDir: {}
