apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: snapdragon-backend
resources:
  - deployment.yaml
  - pvc.yaml
# The "clickhouse-auth" Secret (password) is now materialized by External Secrets
# Operator from Vault (ClusterSecretStore "snapdragon-vault", remote path
# secret/snapdragon/clickhouse) — see manifests/external-secrets.
# The offline/USB path (KEYS/vault/secrets.json) is created by keys-provision.
# The workloads keep their existing secretKeyRef usage unchanged.
