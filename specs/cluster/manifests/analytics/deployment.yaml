# Usage-analytics pipeline (backend namespace). Admin-only.
#   UI/gateways/services emit usage events -> Kafka -> consumer -> ClickHouse.
#   The Spring admin BFF (Eureka-registered, Spring Cloud) aggregates from
#   ClickHouse (+ Postgres for config, Cassandra for the gateway cache) and
#   serves /bff/admin/usage to the admin micro-frontend. Role-locked at BOTH
#   the be-gateway (ROLE_ADMIN) and inside the BFF (method security).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clickhouse
  namespace: snapdragon-backend
  labels: { app: clickhouse, app.kubernetes.io/part-of: snapdragon.systems }
spec:
  replicas: 1
  selector: { matchLabels: { app: clickhouse } }
  template:
    metadata: { labels: { app: clickhouse } }
    spec:
      nodeSelector: { snapdragon.systems/backend: "true" }
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:25.3-alpine
          # Conservative baselines — tune to the backend node's headroom.
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits:   { cpu: "1",  memory: 2Gi }
          ports: [{ name: http, containerPort: 8123 }, { name: native, containerPort: 9000 }]
          env:
            - { name: CLICKHOUSE_DB, value: snapdragon }
            - { name: CLICKHOUSE_USER, value: snap }
            - { name: CLICKHOUSE_PASSWORD, valueFrom: { secretKeyRef: { name: clickhouse-auth, key: password } } }
          volumeMounts: [{ name: data, mountPath: /var/lib/clickhouse }]
      volumes: [{ name: data, persistentVolumeClaim: { claimName: clickhouse-data } }]
---
apiVersion: v1
kind: Service
metadata: { name: clickhouse, namespace: snapdragon-backend }
spec:
  selector: { app: clickhouse }
  ports: [{ name: http, port: 8123, targetPort: http }, { name: native, port: 9000, targetPort: native }]
---
# Kafka (KRaft mode — no Zookeeper) as the usage-event bus.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: snapdragon-backend
  labels: { app: kafka, app.kubernetes.io/part-of: snapdragon.systems }
spec:
  replicas: 1
  selector: { matchLabels: { app: kafka } }
  template:
    metadata: { labels: { app: kafka } }
    spec:
      nodeSelector: { snapdragon.systems/backend: "true" }
      containers:
        - name: kafka
          image: bitnamilegacy/kafka:3.7.1-debian-12-r9
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits:   { cpu: 500m, memory: 1Gi }
          ports: [{ name: kafka, containerPort: 9092 }]
          env:
            - { name: KAFKA_CFG_NODE_ID, value: "0" }
            - { name: KAFKA_CFG_PROCESS_ROLES, value: "controller,broker" }
            - { name: KAFKA_CFG_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093" }
            - { name: KAFKA_CFG_CONTROLLER_QUORUM_VOTERS, value: "0@kafka:9093" }
            - { name: KAFKA_CFG_CONTROLLER_LISTENER_NAMES, value: "CONTROLLER" }
            - { name: KAFKA_CFG_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka:9092" }
          volumeMounts: [{ name: data, mountPath: /bitnami/kafka }]
      volumes: [{ name: data, persistentVolumeClaim: { claimName: kafka-data } }]
---
apiVersion: v1
kind: Service
metadata: { name: kafka, namespace: snapdragon-backend }
spec:
  selector: { app: kafka }
  ports: [{ name: kafka, port: 9092, targetPort: kafka }]
---
# Spring Cloud Netflix Eureka — service discovery for the Spring tier
# (admin-bff, gateways, APIs register here).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eureka
  namespace: snapdragon-backend
  labels: { app: eureka, app.kubernetes.io/part-of: snapdragon.systems }
spec:
  replicas: 1
  selector: { matchLabels: { app: eureka } }
  template:
    metadata: { labels: { app: eureka } }
    spec:
      nodeSelector: { snapdragon.systems/backend: "true" }
      containers:
        - name: eureka
          image: snapdragon-systems/eureka:dev
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: 250m, memory: 512Mi }
          ports: [{ name: http, containerPort: 8761 }]
---
apiVersion: v1
kind: Service
metadata: { name: eureka, namespace: snapdragon-backend }
spec:
  selector: { app: eureka }
  ports: [{ name: http, port: 8761, targetPort: http }]
