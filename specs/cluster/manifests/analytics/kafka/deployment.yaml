# Kafka (KRaft mode — no Zookeeper) — the usage-event bus. HEAVY amd64 datastore
# (MANUAL-sync: apps/35-analytics-kafka.yaml has NO automated syncPolicy). The
# Service lives in the auto-sync floor (manifests/analytics/discovery) so
# `kafka:9092` always resolves; this app brings the broker pod + its node-local PV.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: snapdragon-backend
  labels: { app: kafka, app.kubernetes.io/part-of: snapdragon.systems }
spec:
  replicas: 1
  selector: { matchLabels: { app: kafka } }
  template:
    metadata: { labels: { app: kafka } }
    spec:
      # Kafka's log dir is on snapdragon-local too — pin to the x86_64 host that
      # holds the data disks so the kafka-data PV mounts. nodeSelector, NOT a taint:
      # the shared x86 host stays schedulable for everything else.
      nodeSelector: { kubernetes.io/arch: amd64 }
      securityContext:
        seLinuxOptions:
          type: container_t
          level: "s0:c20"
      containers:
        - name: kafka
          image: bitnamilegacy/kafka:3.7.1-debian-12-r9
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits:   { cpu: 500m, memory: 1Gi }
          ports: [{ name: kafka, containerPort: 9092 }]
          env:
            - { name: KAFKA_CFG_NODE_ID, value: "0" }
            - { name: KAFKA_CFG_PROCESS_ROLES, value: "controller,broker" }
            - { name: KAFKA_CFG_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093" }
            - { name: KAFKA_CFG_CONTROLLER_QUORUM_VOTERS, value: "0@kafka:9093" }
            - { name: KAFKA_CFG_CONTROLLER_LISTENER_NAMES, value: "CONTROLLER" }
            - { name: KAFKA_CFG_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka:9092" }
          volumeMounts: [{ name: data, mountPath: /bitnami/kafka }]
      volumes: [{ name: data, persistentVolumeClaim: { claimName: kafka-data } }]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kafka-data
  namespace: snapdragon-backend
  labels: { app: kafka, app.kubernetes.io/part-of: snapdragon.systems }
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: snapdragon-local
  resources: { requests: { storage: 5Gi } }
# NOTE: there is no service-discovery registry in this analytics pipeline (or the
# cluster) — nothing uses a DiscoveryClient / lb:// anywhere; gateways route by
# static k8s DNS and the analytics pipeline reaches ClickHouse/Kafka by DNS too.
