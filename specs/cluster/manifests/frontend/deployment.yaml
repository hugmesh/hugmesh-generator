# snapdragon.systems Angular host — the gateway-forwarded front page.
# Built from github.com/Snapdragon-Systems/snapdragon.systems (Dockerfile +
# nginx.conf in that repo). Shows Matrix/Mastodon links to logged-in users;
# login/registration is delegated to Casdoor (Google + admin accounts).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: snapdragon-systems-web
  namespace: snapdragon-frontend
  labels: { app: snapdragon-systems-web, app.kubernetes.io/part-of: snapdragon.systems }
spec:
  replicas: 1
  selector: { matchLabels: { app: snapdragon-systems-web } }
  template:
    metadata: { labels: { app: snapdragon-systems-web } }
    spec:
      nodeSelector: { snapdragon.systems/frontend: "true" }
      # POD-level hardening (replicates the media-poisoner exemplar pattern):
      # CIS K8s 5.2.6 (runAsNonRoot), 5.7.2 (seccompProfile RuntimeDefault),
      # NIST 800-53 AC-6 (least privilege) / SC-39 (process isolation),
      # NIST 800-190 §4.5.3 (run as non-root). The first-party snapdragon.systems
      # nginx image is built to serve on an unprivileged port as UID 101 (the
      # nginx-unprivileged convention), so dropping ALL caps + non-root is safe.
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
        seLinuxOptions:
          type: container_t
          level: "s0:c40"
      containers:
        - name: web
          image: snapdragon-systems/snapdragon.systems:dev
          ports: [{ name: http, containerPort: 80 }]
          # CONTAINER-level hardening (audit: pod-only seLinuxOptions had NO
          # container securityContext). CIS K8s 5.2.5 (allowPrivilegeEscalation:
          # false), 5.2.7-5.2.9 (drop ALL caps), 5.2.x (readOnlyRootFilesystem).
          # UID 101 = the `nginx` user baked into the image; readOnlyRootFilesystem
          # requires an emptyDir for every path nginx writes (cache/pid/temp).
          securityContext:
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          env:
            # The host reads these at runtime to render the social links and
            # drive the Casdoor login button (no external login UI of its own).
            - { name: CASDOOR_ISSUER, value: "https://id.snapdragon.systems" }
            - { name: MATRIX_URL,   value: "https://matrix.snapdragon.systems" }
            - { name: MASTODON_URL, value: "https://mastodon.snapdragon.systems" }
            - { name: SOCIAL_UI_BASE, value: "/social" }
          readinessProbe: { httpGet: { path: /, port: http }, initialDelaySeconds: 5 }
          resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { cpu: 500m, memory: 256Mi } }
          # readOnlyRootFilesystem:true => every path nginx writes must be a
          # writable emptyDir (tmpfs). nginx writes the worker temp dirs under
          # /var/cache/nginx, the pid under /var/run, and request bodies to /tmp.
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: nginx-cache, mountPath: /var/cache/nginx }
            - { name: nginx-run, mountPath: /var/run }
      volumes:
        - name: tmp
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: snapdragon-systems-web
  namespace: snapdragon-frontend
spec:
  selector: { app: snapdragon-systems-web }
  ports: [{ name: http, port: 80, targetPort: http }]
