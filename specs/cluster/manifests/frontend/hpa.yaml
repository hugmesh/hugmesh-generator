# HorizontalPodAutoscaler for snapdragon-systems-web. Modelled byte-for-byte on
# manifests/remote-fragment/hpa.yaml (the first HPA in the cluster): plain
# autoscaling/v2, Resource metrics only. The host shell is a stateless static nginx server, so it scales out cleanly under load.
#
# REQUIRES metrics-server (apps/01-metrics-server.yaml, already live). Until the
# metrics API answers, this HPA stays inert and the Deployment's replicas floor
# governs. CPU 70% + memory 80% — both Resource targets read the
# resources.requests the Deployment already declares (cpu:50m, memory:128Mi). The replicaCount
# floor is held at the Deployment's current value (NOT raised here); min/max only
# widen the band the HPA may move within (min 2 keeps an HA pair).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: snapdragon-systems-web
  namespace: hugmesh-frontend
  labels: { app: snapdragon-systems-web, app.kubernetes.io/part-of: hugmesh.systems }
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: snapdragon-systems-web
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
    - type: Resource
      resource:
        name: memory
        target: { type: Utilization, averageUtilization: 80 }
