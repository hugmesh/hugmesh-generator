apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hugmesh-frontend
resources:
  - deployment.yaml
  - hpa.yaml
  - pdb.yaml

# First-party images now pull from the in-cluster Harbor container registry
# (registry.hugmesh.net = inherited from GitLab's chart hosts.domain default, kept as-is; now served by Harbor (apps/03a-harbor.yaml), project
# path = <group>/<repo>). The CI in each repo pushes :<branch> + :<sha>; we track
# the moving :main here for dev. Pulls need the harbor-registry imagePullSecret
# (ESO-materialized, see manifests/external-secrets).
images:
  - { name: hugmesh/hugmesh.net, newName: registry.hugmesh.net/hugmesh/hugmesh.net, newTag: main }
patches:
  - target: { kind: Deployment }
    patch: |
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: harbor-registry
