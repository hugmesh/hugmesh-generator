apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: snapdragon-backend
resources:
  - pvc.yaml
  - deployment.yaml
  - service.yaml

# federation owns its TABLES via Liquibase (applied by the app at startup), so no
# table DDL is seeded here. The initdb/ ConfigMap below is hardening + role setup
# only (runs once on an empty data dir, in alphabetical order):
#   00-hardening.sql  REVOKE PUBLIC + per-DB timeouts + scram password_encryption
#   10-roles.sh       the NON-OWNER least-privilege app login role (federation_app)
#                     from FEDERATION_APP_PASSWORD env — never committed
#   90-citus.sh       OPT-IN Citus extension (no-op unless SHARDING_CITUS=on)
configMapGenerator:
  - name: federation-db-initdb
    files:
      - initdb/00-hardening.sql
      - initdb/10-roles.sh
      - initdb/90-citus.sh

generatorOptions:
  disableNameSuffixHash: true
