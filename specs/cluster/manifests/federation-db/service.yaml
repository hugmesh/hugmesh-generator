# ClusterIP — reached only in-cluster by hugmesh-federation-api (R2DBC runtime +
# the JDBC handle Liquibase uses at startup). DNS:
#   federation-db.hugmesh-backend.svc.cluster.local:5432
apiVersion: v1
kind: Service
metadata:
  name: federation-db
  namespace: hugmesh-backend
  labels: { app: federation-db }
spec:
  type: ClusterIP
  selector: { app: federation-db }
  ports:
    - { name: postgres, port: 5432, targetPort: postgres }
