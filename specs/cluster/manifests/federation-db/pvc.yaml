# Persistent storage for the hugmesh-federation-api Postgres data directory
# (federation_modules / user_modules / moderation_requests / federation_override).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: federation-db
  namespace: hugmesh-backend
  labels: { app: federation-db }
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: hugmesh-local
  resources: { requests: { storage: 2Gi } }
