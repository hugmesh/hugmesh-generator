# Persistent storage for the snapdragon-federation Postgres data directory
# (federation_modules / user_modules / moderation_requests / federation_override).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: federation-db
  namespace: snapdragon-backend
  labels: { app: federation-db }
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: snapdragon-local
  resources: { requests: { storage: 2Gi } }
