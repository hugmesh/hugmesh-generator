# forum-admin-sync — reconciles Casdoor ROLE_ADMIN / ROLE_FORUM_MOD / ROLE_FORUM
# membership into phpBB groups via the hugmesh/forum-api extension admin
# endpoints over HTTP (ensureUser / setUserGroups / suspendUser). Runs IN the
# isolated hugmesh-forum namespace (so it is admitted to phpbb by the
# network-policy same-ns podSelector). Mirrors the akkoma/tuwunel admin-sync
# pattern but talks HTTP-to-extension (phpBB has no pleroma_ctl equivalent).
#
# DIFFERS from akkoma's ADDITIVE-only sync: this is a DECLARATIVE de-provisioning
# diff — it computes the FULL target group set per user from current Casdoor roles,
# enumerates current phpBB group members, and REMOVES stale memberships + applies/
# lifts bans idempotently. A demoted mod loses GLOBAL_MODERATORS; a role-removed
# user loses REGISTERED. Plus the invariant: ROLE_ADMIN -> ADMINISTRATORS ALWAYS
# (every tick, independent of external.forum.enabled).
#
# Role -> phpBB group:
#   ROLE_ADMIN                         -> ADMINISTRATORS     (always)
#   ROLE_FORUM_MOD (= MOD ∩ FORUM)     -> GLOBAL_MODERATORS
#   ROLE_FORUM (non-admin, non-mod)    -> REGISTERED
#   (none, non-admin)                  -> removed from all forum-managed groups
#
# STUB-AWARE: honors FORUM_EXTERNAL_ENABLED (default false = DARK). The forum-bff /
# admin-bff phpBB legs were flipped ON (PR #164, extension live smoke 2026-06-23), but
# THIS job stays dark until one thing this repo cannot verify offline is live-proven:
# that a Casdoor CLIENT-CREDENTIALS token carries admin authority through the
# extension's server-side re-derivation (roles[]/permissions[]/isAdmin claims on an app
# token — the extension fails closed with 403 if the minted token maps to no
# ROLE_ADMIN). When disabled it logs the would-be assignments + exits 0 (never
# crash-loops); the ROLE_ADMIN provisioning invariant is still attempted so a
# freshly-synced cluster has admins. Flip true after that on-cluster validation.
#
# ENDPOINT CONTRACT (pinned to the SHIPPED hugmesh/forum-api extension —
# config/routing.yml + admin_controller.php):
#   PUT /api/v1/hugmesh/users/{sub}/groups   (ROLE_ADMIN)
#   body GroupAssignment { casdoorSubject, group, roles[], lastSynced } -> 204.
# converge_groups_for_sub() lazily ENSURES the user, so no separate ensure call is
# needed. Auth = Casdoor JWT sent as BOTH `Authorization: Bearer` AND
# `X-HugMesh-JWT` (the extension enforces dual-header agreement when both are
# present, and apache only passes Authorization through via CGIPassAuth).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: forum-admin-sync-script
  namespace: hugmesh-forum
  labels: { app.kubernetes.io/name: phpbb, app.kubernetes.io/part-of: hugmesh.net }
data:
  sync.py: |
    #!/usr/bin/env python3
    """Reconcile Casdoor forum roles -> phpBB groups via the hugmesh/forum-api
    extension admin endpoints. Pure stdlib (urllib) — no extra packages.

    DECLARATIVE de-provisioning: computes the target group per subject, then has
    the extension converge — PUT /api/v1/hugmesh/users/{sub}/groups
    (GroupAssignment{casdoorSubject,group,roles,lastSynced} -> 204; the SHIPPED
    hugmesh/forum-api contract, config/routing.yml + admin_controller.php).
    converge_groups_for_sub() lazily ensures the user and REMOVES any
    forum-managed group not in the target. ROLE_ADMIN -> ADMINISTRATORS is
    enforced every tick.

    AUTH: the extension is fail-closed JWT-only. This job mints a Casdoor
    client-credentials token and sends it as BOTH `Authorization: Bearer` and
    `X-HugMesh-JWT` (dual-header agreement). Whether that app token carries
    admin authority through the extension's server-side re-derivation is the
    open on-cluster validation gating FORUM_EXTERNAL_ENABLED (see the manifest
    header)."""
    import datetime, json, os, base64, urllib.parse, urllib.request, urllib.error

    CASDOOR  = os.environ.get("CASDOOR_URL", "http://casdoor.hugmesh-pki.svc.cluster.local:8000")
    ORG      = os.environ.get("CASDOOR_ORG", "hugmesh")
    PHPBB    = os.environ.get("PHPBB_API", "http://phpbb.hugmesh-forum.svc.cluster.local:80")
    ENABLED  = os.environ.get("FORUM_EXTERNAL_ENABLED", "false").lower() == "true"
    # Casdoor role -> phpBB target group. Order matters: ADMIN is the strongest.
    ROLE_GROUP = [
        ("ROLE_ADMIN",      "ADMINISTRATORS"),
        ("ROLE_FORUM_MOD",  "GLOBAL_MODERATORS"),
        ("ROLE_FORUM",      "REGISTERED"),
    ]

    CLIENT_ID     = open("/secrets/casdoor/clientId").read().strip()
    CLIENT_SECRET = open("/secrets/casdoor/clientSecret").read().strip()

    def _get(url, headers=None):
        req = urllib.request.Request(url, headers=headers or {})
        with urllib.request.urlopen(req, timeout=15) as r:
            return json.loads(r.read() or "{}")

    def _send(url, body, method="POST", headers=None):
        data = json.dumps(body).encode()
        h = {"Content-Type": "application/json"}
        h.update(headers or {})
        req = urllib.request.Request(url, data=data, headers=h, method=method)
        with urllib.request.urlopen(req, timeout=20) as r:
            return r.status

    def mint_token():
        """Casdoor client-credentials grant -> a Casdoor-signed JWT for this app.
        The extension validates it against the SAME issuer/JWKS as user tokens."""
        form = urllib.parse.urlencode({
            "grant_type":    "client_credentials",
            "client_id":     CLIENT_ID,
            "client_secret": CLIENT_SECRET,
        }).encode()
        req = urllib.request.Request(
            f"{CASDOOR}/api/login/oauth/access_token", data=form,
            headers={"Content-Type": "application/x-www-form-urlencoded"})
        with urllib.request.urlopen(req, timeout=15) as r:
            tok = json.loads(r.read() or "{}").get("access_token") or ""
        if not tok:
            raise RuntimeError("Casdoor returned no access_token (client_credentials)")
        return tok

    def casdoor_members(role):
        token = CLIENT_ID + ":" + CLIENT_SECRET
        auth = {"Authorization": "Basic " + base64.b64encode(token.encode()).decode()}
        try:
            data = _get(f"{CASDOOR}/api/get-role?id={ORG}/{role}", auth)
        except urllib.error.HTTPError as e:
            print(f"  WARN get-role {role}: {e}"); return []
        users = (data.get("data") or {}).get("users") or []
        # Casdoor returns org/sub; the extension keys phpBB users by Casdoor sub.
        return [u.split("/")[-1] for u in users]

    # Build the target (group, source role) per subject (strongest role wins).
    target = {}
    for role, group in ROLE_GROUP:
        for sub in casdoor_members(role):
            if sub not in target:           # first (strongest) role wins
                target[sub] = (group, role)

    if not ENABLED:
        print(f"forum-admin-sync: FORUM_EXTERNAL_ENABLED=false (stub) — would converge "
              f"{len(target)} subject(s); ROLE_ADMIN provisioning still attempted")

    # The extension is fail-closed JWT-only: without a token every write is 401,
    # so mint once up front. Fail-SOFT (exit 0, never crash-loop): a dead Casdoor
    # must not wedge the PostSync hook.
    try:
        jwt = mint_token()
        auth_headers = {"Authorization": "Bearer " + jwt, "X-HugMesh-JWT": jwt}
    except Exception as e:
        print(f"forum-admin-sync: WARN cannot mint Casdoor client-credentials token ({e}) "
              f"— skipping all phpBB writes this tick")
        raise SystemExit(0)

    now = datetime.datetime.now(datetime.timezone.utc).isoformat()
    applied = 0
    for sub, (group, role) in target.items():
        # ROLE_ADMIN invariant runs even when the stub is off; other writes only
        # when enabled. PUT /users/{sub}/groups is DECLARATIVE: it lazily ensures
        # the user, sets exactly {group}, and REMOVES any other forum-managed group.
        if not ENABLED and group != "ADMINISTRATORS":
            continue
        try:
            _send(f"{PHPBB}/api/v1/hugmesh/users/{urllib.parse.quote(sub, safe='')}/groups",
                  {"casdoorSubject": sub, "group": group, "roles": [role], "lastSynced": now},
                  method="PUT", headers=auth_headers)
            applied += 1
        except Exception as e:
            print(f"  WARN setUserGroups {sub} -> {group}: {e}")
    print(f"forum-admin-sync: applied {applied} group assignment(s) "
          f"(declarative de-provisioning; stale memberships removed by the extension)")
---
# PostSync Job — runs once after each ArgoCD sync (admins available immediately).
apiVersion: batch/v1
kind: Job
metadata:
  name: forum-admin-sync
  namespace: hugmesh-forum
  labels: { app.kubernetes.io/name: phpbb, app.kubernetes.io/part-of: hugmesh.net }
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels: { app: forum-admin-sync }
    spec:
      restartPolicy: OnFailure
      nodeSelector: { hugmesh.net/backend: "true" }
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: sync
          image: python:3.12-alpine
          command: ["python3", "/script/sync.py"]
          env:
            - { name: CASDOOR_URL, value: "http://casdoor.hugmesh-pki.svc.cluster.local:8000" }
            - { name: CASDOOR_ORG, value: "hugmesh" }
            - { name: PHPBB_API,   value: "http://phpbb.hugmesh-forum.svc.cluster.local:80" }
            # DARK (false) — the endpoint contract is pinned to the shipped
            # extension, but flipping this needs the on-cluster proof that a
            # Casdoor client-credentials token re-derives ROLE_ADMIN in the
            # extension (see the manifest header). forum-bff/admin-bff's own
            # phpBB legs are already ON (PR #164).
            - { name: FORUM_EXTERNAL_ENABLED, value: "false" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: script,  mountPath: /script, readOnly: true }
            - { name: casdoor, mountPath: /secrets/casdoor, readOnly: true }
      volumes:
        - name: script
          configMap: { name: forum-admin-sync-script, defaultMode: 0555 }
        # ESO-materialized from Vault — never committed. casdoor-app-secrets holds
        # the OAuth2 client used to read ROLE_ADMIN/ROLE_FORUM_MOD/ROLE_FORUM membership.
        - name: casdoor
          secret: { secretName: casdoor-app-secrets }
---
# 5-min CronJob — the de-provisioning safety net (self-heals missed events,
# enforces the ROLE_ADMIN invariant, removes stale memberships idempotently).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: forum-admin-sync-cron
  namespace: hugmesh-forum
  labels: { app.kubernetes.io/name: phpbb, app.kubernetes.io/part-of: hugmesh.net }
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      ttlSecondsAfterFinished: 300
      template:
        metadata:
          labels: { app: forum-admin-sync }
        spec:
          restartPolicy: OnFailure
          nodeSelector: { hugmesh.net/backend: "true" }
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: sync
              image: python:3.12-alpine
              command: ["python3", "/script/sync.py"]
              env:
                - { name: CASDOOR_URL, value: "http://casdoor.hugmesh-pki.svc.cluster.local:8000" }
                - { name: CASDOOR_ORG, value: "hugmesh" }
                - { name: PHPBB_API,   value: "http://phpbb.hugmesh-forum.svc.cluster.local:80" }
                # DARK — same gate as the PostSync Job above (client-credentials
                # admin-authority proof pending; contract itself is pinned).
                - { name: FORUM_EXTERNAL_ENABLED, value: "false" }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              volumeMounts:
                - { name: script,  mountPath: /script, readOnly: true }
                - { name: casdoor, mountPath: /secrets/casdoor, readOnly: true }
          volumes:
            - name: script
              configMap: { name: forum-admin-sync-script, defaultMode: 0555 }
            - name: casdoor
              secret: { secretName: casdoor-app-secrets }
