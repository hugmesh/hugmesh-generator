# snapdragon-forum DEFAULT-DENY + the narrow allow-list — the PRIMARY isolation
# control for the backend-only phpBB forum.
#
# phpBB has NO gateway route and NO ingress (route-access is NOT default-deny for
# ungoverned paths, so the ONLY safe posture is "no route at all" — see the design
# §2/§9). These policies make that real at the network layer: in the dedicated
# snapdragon-forum namespace the ONLY ingress admitted to the phpbb pod is from
#   * snapdragon-forum-bff-api  (the single browser->phpBB path, role/ban-gated)
#   * snapdragon-admin-bff-api  (the admin Forum Console seam)
#   * forum-admin-sync          (the reconcile Job, runs IN snapdragon-forum)
# Everything else (the rest of snapdragon-backend, snapdragon-frontend, games,
# observability) is DENIED. phpbb-db admits ingress ONLY from the phpbb pod (+ the
# sync Job for the de-provisioning diff). This is intentionally STRICTER than
# akkoma/tuwunel (which have no per-pod isolation).
#
# k8s NetworkPolicy is additive-allow within a namespace; because snapdragon-forum
# is a FRESH namespace with NO tier-ingress policy selecting it, the default-deny
# below is authoritative (no broad allow to subtract). KEEP this the only ingress
# policy in the namespace.
#
# DEPLOY ORDERING: this policy + the phpbb/phpbb-db Deployments ship together
# (apps/30-phpbb). forum-bff-api boots with external.forum.enabled=false against a
# stub, so forum-bff does not hard-depend on phpbb being reachable at first boot;
# flip external.forum.enabled=true only after the extension is validated on-cluster.
---
# ── default-deny ALL ingress in snapdragon-forum ───────────────────────────────
# Selects every pod (podSelector: {}). With no `ingress:` rules, all ingress is
# denied; the specific allow policies below add back ONLY the legitimate callers.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: forum-default-deny-ingress
  namespace: snapdragon-forum
  labels: { app.kubernetes.io/part-of: snapdragon.systems }
spec:
  podSelector: {}
  policyTypes: [Ingress]
  # No ingress rules => deny all ingress (the allow policies below are additive).
---
# ── phpbb — reachable ONLY from forum-bff-api + admin-bff-api + the sync Job ────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: forum-allow-phpbb-ingress
  namespace: snapdragon-forum
  labels: { app.kubernetes.io/name: phpbb, app.kubernetes.io/part-of: snapdragon.systems }
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: phpbb }
  policyTypes: [Ingress]
  ingress:
    - from:
        # forum-bff-api (snapdragon-backend) — the SINGLE browser->phpBB path; it
        # presents the cluster-CA client cert + forwards the caller JWT. Matched by
        # the backend namespace label AND the app pod label (defence-in-depth: both
        # must hold).
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: snapdragon-backend }
          podSelector:
            matchLabels: { app: snapdragon-forum-bff-api }
        # admin-bff-api (snapdragon-backend) — the admin Forum Console seam. (admin
        # actions traverse forum-bff today; admin-bff is allowed directly too so a
        # future direct admin path stays inside the boundary, not around it.)
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: snapdragon-backend }
          podSelector:
            matchLabels: { app: snapdragon-admin-bff-api }
        # forum-admin-sync — the reconcile Job runs IN snapdragon-forum (same ns),
        # so a same-namespace podSelector (no namespaceSelector) admits it.
        - podSelector:
            matchLabels: { app: forum-admin-sync }
      ports:
        - { protocol: TCP, port: 80 }     # phpBB http (the json-api extension surface)
        - { protocol: TCP, port: 9000 }   # php-fpm (if the image fronts via fastcgi)
---
# ── phpbb-db — reachable ONLY from the phpbb pod + the sync Job ─────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: forum-allow-phpbb-db-ingress
  namespace: snapdragon-forum
  labels: { app.kubernetes.io/name: phpbb-db, app.kubernetes.io/part-of: snapdragon.systems }
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: phpbb-db }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: phpbb }
        # The sync Job's de-provisioning diff reads/writes via the extension over
        # HTTP (port 80 to phpbb), not the DB directly, so a phpbb-db rule for it is
        # belt-and-suspenders only — kept for parity should a future diff need it.
        - podSelector:
            matchLabels: { app: forum-admin-sync }
      ports:
        - { protocol: TCP, port: 5432 }   # Postgres
