# casdoor-games app.conf TEMPLATE — points the GAMES-realm Casdoor at its OWN
# external Postgres (casdoor-games-pg, db "threewizards") instead of the all-in-one
# image's bundled DB. Mirrors manifests/casdoor/app-conf-configmap.yaml for the
# SEPARATE games identity provider. Rendered into the real conf/app.conf by the
# "render-app-conf" initContainer in deployment.yaml (plain sed substitution of the
# __TOKEN__ placeholders below against env sourced from the ESO Secret
# casdoor-games-db). NO secrets here.
#
# NOTE: casbin/casdoor does NOT expand beego's "${ENV||default}" syntax inside a
# value: beego expands it only when the WHOLE value is one such expression. With
# `user=${CASDOOR_DB_USER||threewizards} ...` in dataSourceName, casbin/casdoor:3.80.0
# and v1.811.0 both used the literal string as the Postgres username and exited 2
# with `pq: password authentication failed for user "${CASDOOR_DB_USER||threewizards}"`
# (measured 2026-11-05 on throwaway containers). The systems Casdoor was fixed for
# exactly this in #263; this file carries the same initContainer render.
# tests/scripts/test-games-two-realms.sh refuses a `${` in any Casdoor dataSourceName.
apiVersion: v1
kind: ConfigMap
metadata:
  name: casdoor-games-app-conf
  namespace: hugmesh-games
  labels: { app: casdoor-games, app.kubernetes.io/part-of: hugmesh.games }
data:
  app.conf.template: |
    appname = casdoor
    httpport = 8000
    runmode = prod
    copyrequestbody = true
    SessionOn = true
    # External Postgres (casdoor-games-pg, db "threewizards"). For the postgres
    # driver Casdoor uses the dataSourceName verbatim (it only appends dbName for
    # MySQL), so dbname= must be set inline here. Credentials rendered in by the
    # initContainer (ESO Secret casdoor-games-db).
    driverName = postgres
    dataSourceName = "user=__CASDOOR_DB_USER__ password=__CASDOOR_DB_PASSWORD__ host=casdoor-games-pg port=5432 sslmode=disable dbname=threewizards"
    dbName = threewizards
    tableNamePrefix =
    showSql = false
    redisEndpoint =
    isCloudIntranet = false
    authState = "casdoor"
    socks5Proxy = ""
    verificationCodeTimeout = 10
    initScore = 0
    logPostOnly = true
    # Public issuer (OIDC `iss` origin) of the games realm. Parameterized on
    # GAMES_DOMAIN by parameterize_games_domain() in the stage4 builders: the
    # literal id.hugmesh.games is rewritten so the iss the Casdoor stamps into every
    # games JWT matches the published host: a GAMES_DOMAIN in its own zone gets
    # id.${GAMES_DOMAIN}, and the default subdomain gets the single-label
    # games-id.<CLUSTER_DOMAIN> so the one-label *.<CLUSTER_DOMAIN> wildcard covers it.
    # Leaving it as hugmesh.games would break iss-strict JWT validation on the
    # subdomain default — see docs/OPTIONAL-SERVICES.md "Games subdomain".
    origin = "https://id.hugmesh.games"
    enableGzip = true
    # ── Declarative seed (init_data.json) ───────────────────────────────────
    # Same fix as manifests/casdoor/app-conf-configmap.yaml, same reason: this file
    # REPLACES the image's conf/app.conf (which carries
    # `initDataFile = "./init_data.json"`), and object/init_data.go's InitFromFile()
    # returns immediately when conf.GetConfigString("initDataFile") is empty — so
    # the seed deployment.yaml mounts at /init_data.json was never read. Absolute
    # path so the import does not depend on the image workdir; kept byte-equal to
    # the mountPath (cross-checked by tests/scripts/test-casdoor-init-honesty.sh).
    initDataFile = "/init_data.json"
    # CREATE-ONLY — with the upstream default (false) every restart DELETEs and
    # re-adds each declared object, resetting the games realm's role membership to
    # the seed's empty lists. See the systems ConfigMap for the full note.
    initDataNewOnly = true
