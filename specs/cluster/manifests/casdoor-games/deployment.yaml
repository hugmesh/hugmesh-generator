# casdoor-games — the GAMES-realm Casdoor identity provider, a SEPARATE, INDEPENDENT
# Casdoor instance from the systems one (manifests/casdoor/). It mirrors the canonical
# hugmesh.games Casdoor (org "threewizards", app "threewizards-app"): it issues the
# OAuth2/OIDC JWTs the games BFF (manifests/games) validates, and owns its OWN native
# users/roles (GitHub-OAuth players, player / uploader / mod / publisher / play-* roles)
# that need NOT exist in the systems Casdoor. Runs in the hugmesh-games namespace on
# its OWN external Postgres (casdoor-games-pg, db "threewizards").
#
# Nothing in hugmesh.net writes into this realm: the hugmesh-actions GM sync that
# could mirror a systems role into a games role is OFF (manifests/hugmesh-apis/
# deployment.yaml), and this realm's admin comes only from its own `admin` role. The
# one coupling is the other way round: the games BFF (manifests/games) also trusts the
# systems issuer, so a mesh user reaches games through the fe-gateway with the mesh
# token.
#
# app.conf is RENDERED by the render-app-conf initContainer below (sed over the
# __TOKEN__ template in app-conf-configmap.yaml), the shape #263 gave the systems
# Casdoor: casbin/casdoor does not expand "${ENV||default}" inside a value, and the
# as-shipped ConfigMap made both pinned images exit 2 at boot (see that file).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: casdoor-games
  namespace: hugmesh-games
  labels: { app: casdoor-games, app.kubernetes.io/part-of: hugmesh.games }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: casdoor-games }
  template:
    metadata:
      labels: { app: casdoor-games }
    spec:
      nodeSelector:
        hugmesh.net/games: "true"
      securityContext:
        seLinuxOptions:
          type: container_t
          level: "s0:c35"
      initContainers:
        # Casdoor doesn't expand beego's "${ENV||default}" syntax inside app.conf
        # (see app-conf-configmap.yaml). Render the real conf/app.conf here via plain
        # sed substitution instead, into an emptyDir the main container mounts
        # read-only. Reuses the casdoor image itself (already has sh/sed) so no extra
        # image needs pulling. The ESO-minted credentials are base64 (no `|`, `&` or
        # `\`), so the sed delimiter and replacement are safe.
        - name: render-app-conf
          image: casbin/casdoor:3.80.0
          command: ["sh", "-c"]
          args:
            - |
              sed \
                -e "s|__CASDOOR_DB_USER__|${CASDOOR_DB_USER}|g" \
                -e "s|__CASDOOR_DB_PASSWORD__|${CASDOOR_DB_PASSWORD}|g" \
                /template/app.conf.template > /rendered/app.conf
          env:
            - name: CASDOOR_DB_USER
              valueFrom: { secretKeyRef: { name: casdoor-games-db, key: username } }
            - name: CASDOOR_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: casdoor-games-db, key: password } }
          volumeMounts:
            - { name: app-conf-template, mountPath: /template, readOnly: true }
            - { name: rendered-conf, mountPath: /rendered }
      containers:
        - name: casdoor
          image: casbin/casdoor:3.80.0
          ports:
            - { name: http, containerPort: 8000 }
          env:
            - name: RUNNING_IN_DOCKER
              value: "true"
            # External Postgres credentials — rendered into conf/app.conf by the
            # render-app-conf initContainer above. Materialized by ESO from Vault.
            - name: CASDOOR_DB_USER
              valueFrom: { secretKeyRef: { name: casdoor-games-db, key: username } }
            - name: CASDOOR_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: casdoor-games-db, key: password } }
            # GitHub OAuth federation client credentials — lets people sign up as a
            # NATIVE games "player" (mirrors the hugmesh.games GitHub provider).
            # Created by an admin in Casdoor, or seeded by the casdoor-games-init Job.
            - name: GITHUB_CLIENT_ID
              valueFrom: { secretKeyRef: { name: casdoor-games-github, key: clientId, optional: true } }
            - name: GITHUB_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: casdoor-games-github, key: clientSecret, optional: true } }
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            # app.conf rendered by the render-app-conf initContainer above. NOTE: the
            # conf path is image-version-specific (casbin/casdoor reads conf/app.conf
            # from its workdir) — validate against the deployed image.
            - { name: rendered-conf, mountPath: /conf/app.conf, subPath: app.conf, readOnly: true }
            # Declarative seed (threewizards org / role catalog / seed users), mirrored
            # from the hugmesh.games init_data.json.tpl. Casdoor reads this on boot
            # ONLY because app-conf-configmap.yaml sets `initDataFile` to this exact
            # path — the import is opt-in, not workdir-relative magic (omitting the
            # key made it a no-op on the first real cluster; see that ConfigMap).
            - { name: init-data, mountPath: /init_data.json, subPath: init_data.json, readOnly: true }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: "1",  memory: 768Mi }
      volumes:
        # DB state lives in casdoor-games-pg (external Postgres); this configMap
        # template (rendered by the initContainer above) just points Casdoor at it.
        - name: app-conf-template
          configMap:
            name: casdoor-games-app-conf
        - name: rendered-conf
          emptyDir: {}
        - name: init-data
          configMap:
            name: casdoor-games-init-data
