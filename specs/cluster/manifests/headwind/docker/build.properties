# snapdragon-headwind BUILD-TIME properties (server/build.properties — the file
# BUILD.txt requires; the reactor's copy-resources fails without it, proven by
# the first real image build). These are BAKED DEFAULTS ONLY: every
# deployment-relevant key here is overridden at RUNTIME by the Tomcat context
# ROOT.xml the derived docker-entrypoint.sh renders from
# templates/conf/context_template.xml (JDBC.*, base.url, directories — that
# override path is the entire design of upstream's own hmdm-docker image).
#
# hash.secret and jwt.secretkey are placeholders REPLACED AT IMAGE-BUILD TIME
# with fresh random values (see the Dockerfile's randomize step) — no real
# secret is committed here, and no two image builds share a JWT key.

# database settings (runtime: ROOT.xml JDBC.* parameters)
jdbc.url=jdbc:postgresql://localhost:5432/hmdm
jdbc.driver=org.postgresql.Driver
jdbc.username=hmdm
jdbc.password=runtime-overridden

# data directories (match templates/conf/context_template.xml; the single
# headwind.yaml PVC mount at /usr/local/tomcat/work persists all of them)
base.directory=/usr/local/tomcat/work
files.directory=/usr/local/tomcat/work/files
plugins.files.directory=/usr/local/tomcat/work/plugins
initialization.completion.signal.file=/usr/local/tomcat/work/initialized.txt
log4j.config=file:///usr/local/tomcat/work/log4j-hmdm.xml

# public URL (runtime: ROOT.xml base.url from PROTOCOL/BASE_DOMAIN)
base.url=http://localhost:8080

usage.scenario=private
secure.enrollment=0
# REPLACED at image build with a random value (unused while secure.enrollment=0)
hash.secret=RANDOMIZE-AT-IMAGE-BUILD
role.orgadmin.id=2
aapt.command=aapt

plugin.devicelog.persistence.config.class=com.hmdm.plugins.devicelog.persistence.postgres.DeviceLogPostgresPersistenceConfiguration

# embedded ActiveMQ MQTT push (headwind.yaml exposes :31000 ClusterIP-only)
mqtt.server.uri=localhost:31000
mqtt.auth=true
mqtt.message.delay=1000

device.fast.search.chars=5

# SMTP: deliberately inert (no real relay baked into an image; alerting mail is
# a post-deploy operator concern — add smtp.* Parameters to the rendered
# context if/when needed)
smtp.host=localhost
smtp.port=25
smtp.ssl=0
smtp.starttls=0
smtp.username=
smtp.password=
smtp.from=noreply@snapdragon.invalid

# JWT for the admin console session tokens. The secret key is REPLACED at image
# build with a fresh random value — rebuilding the image rotates it (console
# sessions only; device enrollment is unaffected).
jwt.secretkey=RANDOMIZE-AT-IMAGE-BUILD
jwt.validity=86400
jwt.validityrememberme=2592000
