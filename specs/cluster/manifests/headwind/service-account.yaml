# headwind ServiceAccounts — per-app identities for the Headwind MDM console and
# its Postgres. Both Deployments name these SAs (headwind.yaml `serviceAccountName:
# sa-headwind`, headwind-db.yaml `serviceAccountName: sa-headwind-db`), but no
# manifest created them — so the pods would never schedule (the SA must exist
# before a pod referencing it is admitted). Same per-application identity pattern
# as manifests/meshbridge/service-account.yaml: each workload runs as its own SA
# carrying its own MCS category (headwind s0:c78, headwind-db s0:c77 — see each
# Deployment's seLinuxOptions and docs/SECURITY.md §3), so a compromise of one
# cannot borrow the other's RBAC or read its category-isolated volumes. Neither
# workload needs the Kubernetes API (headwind talks HTTP to its DB + the phones;
# postgres talks to no one but headwind), so no Role/RoleBinding is attached and
# automountServiceAccountToken is disabled defence-in-depth.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sa-headwind
  namespace: hugmesh-pki
  labels:
    app.kubernetes.io/name: headwind
    app.kubernetes.io/part-of: hugmesh.net
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sa-headwind-db
  namespace: hugmesh-pki
  labels:
    app.kubernetes.io/name: headwind-db
    app.kubernetes.io/part-of: hugmesh.net
automountServiceAccountToken: false
