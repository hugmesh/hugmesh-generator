apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hugmesh-pki
resources:
  - service-account.yaml
  - headwind-db.yaml
  - headwind.yaml

configMapGenerator:
  - name: headwind-db-initdb
    files:
      - initdb/00-hardening.sql

generatorOptions:
  disableNameSuffixHash: true

# Custom build-from-source image pulls from the in-cluster Harbor registry
# (mutable :main tag; hugmesh-pki is not in the Kyverno digest-pin
# enforced-namespace list). NOTE: unlike forum/kustomization.yaml's phpbb.yaml
# base (which uses the short placeholder `image: snapdragon-systems/phpbb:dev`
# for kustomize's images: transform to rewrite), headwind.yaml's Deployment
# already hardcodes the FULL final image ref directly — an `images:` stanza
# here would match no container (kustomize's images transformer only rewrites
# resources whose image `name:` field matches exactly) and silently no-op on
# any future `newTag:` edit, so it is intentionally omitted. Bump the tag by
# editing headwind.yaml's `image:` field directly.
#
# PULL SECRET NAME: `hugmesh-registry-pull`, NOT `harbor-registry`. In every
# other namespace the ESO-materialized pull secret IS called `harbor-registry`,
# but hugmesh-pki is where the Harbor chart itself is released and that chart
# already owns a Secret of that name (its registry's REGISTRY_HTTP_SECRET /
# REGISTRY_REDIS_PASSWORD) — see manifests/external-secrets/secretstore.yaml's
# hugmesh-registry-pull block for the full citation and why the collision could
# never converge. Do not "align" this back to harbor-registry.
patches:
  - target: { kind: Deployment, name: headwind }
    patch: |
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: hugmesh-registry-pull
