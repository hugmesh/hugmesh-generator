# Spring Cloud Config Server (Phase 6) — central config for the Spring services,
# backed by the in-cluster Forgejo config repo. Services add Spring Cloud
# Kubernetes (ConfigMap/Secret discovery) + a config-client pointing here.
#
# ⚠️ NEEDS A BUILT IMAGE: snapdragon-systems/config-server (the spring-cloud-config-
# server dep is declared in Snapdragon/snapdragon-auth but no standalone image is
# built yet — that's service-repo work). And it depends on Forgejo being seeded
# with a config repo. Scaffold only until both exist.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server
  namespace: snapdragon-backend
  labels: { app.kubernetes.io/name: config-server }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: config-server } }
  template:
    metadata: { labels: { app.kubernetes.io/name: config-server } }
    spec:
      nodeSelector: { snapdragon.systems/backend: "true" }
      containers:
        - name: config-server
          image: snapdragon-systems/config-server:dev   # ⚠️ build this image
          ports: [{ name: http, containerPort: 8888 }]
          env:
            - { name: SPRING_PROFILES_ACTIVE, value: git }
            # Spring Cloud Config git backend = the in-cluster Forgejo config repo.
            - { name: SPRING_CLOUD_CONFIG_SERVER_GIT_URI,
                value: http://forgejo.snapdragon-pki.svc.cluster.local:3000/Snapdragon-Systems/snapdragon-config.git }
            - { name: SPRING_CLOUD_CONFIG_SERVER_GIT_CLONE_ON_START, value: "true" }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: config-server
  namespace: snapdragon-backend
  labels: { app.kubernetes.io/name: config-server }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: config-server }
  ports: [{ name: http, port: 8888, targetPort: http }]
