# coturn — STUN/TURN relay for Matrix (tuwunel) WebRTC audio/video calls.
# OPTIONAL SERVICE, DEFAULT-OFF (see specs/cluster/optional-services.yaml + the
# apps/13a ApplicationSet element installed:"false"). When NOT deployed, Matrix
# clients keep their existing host-only ICE behaviour (iceServers:[]) — a default
# build is byte-identical to today's mainline.
#
# Lives in snapdragon-backend ALONGSIDE tuwunel so the long-term-credential shared
# secret (Secret coturn-shared-secret, ESO-synced from Vault) is reachable by BOTH
# coturn (which validates client creds) and tuwunel (which mints them). See
# manifests/external-secrets/coturn-externalsecrets.yaml.
#
# PORTS: STUN/TURN 3478 (UDP+TCP), TLS 5349 (UDP+TCP), relay range 49152-49200
# (UDP) — a deliberately SMALL relay window (≈49 ports) so the K8s Service/NodePort
# port list stays bounded; widen min-port/max-port + the Service ports together for
# more concurrent calls. PUBLIC-REACHABILITY of these ports (NodePort/LoadBalancer +
# external-ip + firewall) is operator/cluster-topology work — DEFERRED, documented
# in docs/COTURN.md.
apiVersion: v1
kind: ConfigMap
metadata:
  name: coturn-config
  namespace: snapdragon-backend
  labels:
    app.kubernetes.io/name: coturn
    app.kubernetes.io/part-of: snapdragon.systems
    snapdragon.systems/optional-service: coturn
data:
  # turnserver.conf — HARDENED, SECRET-FREE. The static-auth-secret is NEVER in
  # this file: it is appended at start from the ESO-mounted Secret by the pod's
  # command (see the Deployment below), so no secret is ever committed to git.
  turnserver.conf: |
    # Matrix realm — matches the homeserver server_name (tuwunel).
    realm=snapdragon.systems
    server-name=coturn.snapdragon-backend.svc.cluster.local
    # Listen on all pod interfaces.
    listening-ip=0.0.0.0
    listening-port=3478
    tls-listening-port=5349
    # Relay port window (UDP). Kept small so the Service port list is bounded; the
    # NetworkPolicy + any NodePort/LoadBalancer must expose the SAME range.
    min-port=49152
    max-port=49200
    # No per-session/total bandwidth quota (0 = unlimited; tune per deployment).
    min-bps=0
    max-bps=0
    # --- REST long-term-credential mode (RFC 5766 / Matrix standard) ---
    # use-auth-secret + static-auth-secret: clients present a time-limited
    # username:password that tuwunel mints from the SAME shared secret. The secret
    # itself is appended at runtime (NOT here) from Secret coturn-shared-secret.
    use-auth-secret
    # --- Hardening ---
    no-cli                 # disable the telnet admin CLI
    fingerprint            # require the FINGERPRINT attribute
    no-multicast-peers     # no mDNS/multicast relay peer discovery
    no-tlsv1
    no-tlsv1_1
    no-tcp-relay           # relay over UDP only (no TCP relay allocations)
    stale-nonce=600
    # Deny relaying to cluster-internal + loopback/link-local ranges so a client
    # cannot use the relay to reach in-cluster services (SSRF backstop). Relay is
    # for PUBLIC peer addresses only.
    denied-peer-ip=0.0.0.0-0.255.255.255
    denied-peer-ip=10.0.0.0-10.255.255.255
    denied-peer-ip=100.64.0.0-100.127.255.255
    denied-peer-ip=127.0.0.0-127.255.255.255
    denied-peer-ip=169.254.0.0-169.254.255.255
    denied-peer-ip=172.16.0.0-172.31.255.255
    denied-peer-ip=192.168.0.0-192.168.255.255
    denied-peer-ip=::1
    denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
    denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
    # Log to stdout for the cluster log pipeline.
    log-file=stdout
    no-stdout-log=false
    simple-log
    # external-ip is set at runtime from the pod's status.hostIP (downward API) so
    # relay candidates advertise a routable address. For a node WITHOUT a public IP
    # this falls back to the host IP; true public reachability (NodePort/LB +
    # firewall) is DEFERRED operator work (docs/COTURN.md).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: snapdragon-coturn
  namespace: snapdragon-backend
  labels:
    app.kubernetes.io/name: coturn
    app: snapdragon-coturn
    app.kubernetes.io/part-of: snapdragon.systems
    snapdragon.systems/optional-service: coturn
spec:
  replicas: 1
  selector:
    matchLabels:
      app: snapdragon-coturn
  template:
    metadata:
      labels:
        app: snapdragon-coturn
        app.kubernetes.io/name: coturn
        app.kubernetes.io/part-of: snapdragon.systems
        snapdragon.systems/optional-service: coturn
    spec:
      serviceAccountName: sa-coturn
      automountServiceAccountToken: false
      nodeSelector:
        snapdragon.systems/backend: "true"
      securityContext:
        # Unique MCS category s0:c67 (docs/SECURITY.md §3 matrix row). No two
        # workloads may share a category — coturn is isolated from tuwunel (c32)
        # et al. even though it co-resides in snapdragon-backend.
        seLinuxOptions:
          type: container_t
          level: "s0:c67"
      containers:
        - name: coturn
          image: coturn/coturn:4.6.2
          # Append the ESO-mounted static-auth-secret to the secret-free conf and
          # advertise the node's external IP, then exec turnserver. Keeps the
          # shared secret OUT of the ConfigMap/git (read from the mounted Secret
          # file at start; never logged).
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              CONF=/run/coturn/turnserver.conf
              cp /etc/coturn/turnserver.conf "${CONF}"
              echo "static-auth-secret=$(cat /run/secrets/coturn/secret)" >> "${CONF}"
              echo "external-ip=${COTURN_EXTERNAL_IP}" >> "${CONF}"
              exec turnserver -c "${CONF}" --no-cli
          env:
            # external-ip for relay candidates — defaults to the node host IP via
            # the downward API. PUBLIC reachability (NodePort/LB + firewall) is
            # deferred operator work; the relay degrades to host-IP candidates.
            - name: COTURN_EXTERNAL_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          ports:
            - { name: stun-udp,  containerPort: 3478, protocol: UDP }
            - { name: stun-tcp,  containerPort: 3478, protocol: TCP }
            - { name: turns-udp, containerPort: 5349, protocol: UDP }
            - { name: turns-tcp, containerPort: 5349, protocol: TCP }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 512Mi }
          volumeMounts:
            - { name: config,  mountPath: /etc/coturn, readOnly: true }
            - { name: runtime, mountPath: /run/coturn }
            - { name: secret,  mountPath: /run/secrets/coturn, readOnly: true }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: ["ALL"]
            seccompProfile: { type: RuntimeDefault }
      volumes:
        - name: config
          configMap: { name: coturn-config }
        - name: runtime
          emptyDir: {}
        # ESO-synced shared secret (key "secret"). The pod is only scheduled when
        # coturn is selected at runtime; until the Vault path is provisioned the
        # Secret is absent and the pod stays Pending (no literal ever on git).
        - name: secret
          secret:
            secretName: coturn-shared-secret
---
# ── Services ─────────────────────────────────────────────────────────────────
# ClusterIP STUN/TURN Service (in-cluster discovery; tuwunel advertises this DNS
# name in turn_uris). PUBLIC exposure (NodePort/LoadBalancer + external-ip) for
# real off-LAN relay is DEFERRED operator/cluster-topology work — see docs/COTURN.md.
apiVersion: v1
kind: Service
metadata:
  name: coturn
  namespace: snapdragon-backend
  labels:
    app.kubernetes.io/name: coturn
    app.kubernetes.io/part-of: snapdragon.systems
    snapdragon.systems/optional-service: coturn
spec:
  type: ClusterIP
  selector:
    app: snapdragon-coturn
  ports:
    - { name: stun-udp,  port: 3478, targetPort: stun-udp,  protocol: UDP }
    - { name: stun-tcp,  port: 3478, targetPort: stun-tcp,  protocol: TCP }
    - { name: turns-udp, port: 5349, targetPort: turns-udp, protocol: UDP }
    - { name: turns-tcp, port: 5349, targetPort: turns-tcp, protocol: TCP }
