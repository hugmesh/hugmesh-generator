# coturn ServiceAccount — per-app identity for the TURN/STUN relay pod.
# Part of the per-application identity matrix (docs/SECURITY.md §3): the coturn
# Deployment runs as THIS SA and carries the unique MCS level s0:c67, so a
# compromised relay cannot read another workload's category-isolated volumes nor
# borrow another pod's RBAC. coturn needs NO Kubernetes API access (it is a pure
# network relay), so no Role/RoleBinding is attached — automountServiceAccountToken
# is disabled defence-in-depth.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sa-coturn
  namespace: snapdragon-backend
  labels:
    app.kubernetes.io/name: coturn
    app.kubernetes.io/part-of: snapdragon.systems
    snapdragon.systems/optional-service: coturn
automountServiceAccountToken: false
