apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hugmesh-inference
resources:
  - namespace.yaml
  - models-configmap.yaml
  - pvc.yaml
  - deployment.yaml

images:
  # Same tag as deployment.yaml's image (the test-edge-ai-ollama-pin.sh guard fails when they differ).
  - { name: ollama/ollama, newName: ollama/ollama, newTag: 0.40.0 }
