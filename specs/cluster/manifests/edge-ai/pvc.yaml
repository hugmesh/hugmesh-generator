# Model cache — persists pulled model weights across pod restarts so a node does
# not re-download multi-GB models every boot. Uses the cluster's local-path
# provisioner (node-pinned local PV; the inference pod is already pinned to the GPU
# node by nodeSelector). Size for the catalog you intend to preload + a working set.
#
# STORAGE CLASS: the mesh's local-path provisioner (manifests/local-path) defines ONE
# class, `hugmesh-local`. This claim used to name `local-path` — the class k3s ships,
# which no mesh cluster has — so the claim never bound ("storageclass.storage.k8s.io
# "local-path" not found") and the edge-ai pod never scheduled, even on a ready GPU
# node. tests/scripts/test-edge-ai-ollama-pin.sh checks the name against the classes
# the tree defines.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: edge-ai-models-cache
  namespace: hugmesh-inference
  labels:
    app.kubernetes.io/part-of: hugmesh.net
    hugmesh.net/slug: edge-ai
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: hugmesh-local    # the WaitForFirstConsumer local-path class
  resources:
    requests:
      storage: 40Gi
