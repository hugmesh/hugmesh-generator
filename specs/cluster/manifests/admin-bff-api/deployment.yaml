# admin-bff — the Backend-For-Frontend that the snapdragon-admin-ui talks to for
# route-access CRUD (and the other admin BFF endpoints: /bff/login,
# /bff/register, /bff/provision, /bff/me, /bff/admin/route-access).
#
# It is the ONLY writer of the gateway_route_access table (Postgres source of
# truth in snapdragon-pki; the gateways read-cache it in Cassandra). It is a
# ClusterIP-only service in snapdragon-backend: nothing reaches it from outside
# except via the fe-gateway, which routes same-origin /bff/** to it AND enforces
# the Casdoor role rules (/bff/admin/** => ROLE_ADMIN) from the route DB first.
#
# Defense in depth: this BFF independently re-validates the Casdoor JWT
# (OAuth2 resource server, CASDOOR_ISSUER_URI) before mutating the route DB.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: snapdragon-admin-bff-api
  namespace: snapdragon-backend
  labels: { app: snapdragon-admin-bff-api, app.kubernetes.io/part-of: snapdragon.systems }
spec:
  replicas: 1
  selector: { matchLabels: { app: snapdragon-admin-bff-api } }
  template:
    metadata: { labels: { app: snapdragon-admin-bff-api } }
    spec:
      nodeSelector: { snapdragon.systems/backend: "true" }
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
        seLinuxOptions:
          type: container_t
          level: "s0:c23"
      containers:
        - name: snapdragon-admin-bff-api
          image: snapdragon-systems/admin-bff-api:dev
          ports: [{ name: http, containerPort: 8080 }]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          env:
            # OAuth2 resource server: validate the cluster Casdoor JWT itself.
            - name: CASDOOR_ISSUER_URI
              value: "https://id.snapdragon.systems"
            # R2DBC handle to the gateway_route_access Postgres (snapdragon-pki).
            - name: ROUTE_ACCESS_R2DBC_URL
              value: "r2dbc:postgresql://route-access-db.snapdragon-pki.svc.cluster.local:5432/gateway"
            # This BFF also owns the usage-analytics aggregation (the role the
            # removed snapdragon-admin-bff-api copy used to run): Eureka-registered,
            # consumes the Kafka usage-event bus into ClickHouse, serves
            # /bff/admin/usage. Hence the eureka + clickhouse profiles + wiring.
            - name: SPRING_PROFILES_ACTIVE
              value: "casdoor,eureka,clickhouse"
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: "http://eureka.snapdragon-backend.svc.cluster.local:8761/eureka"
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
            - name: CLICKHOUSE_URL
              value: "http://clickhouse:8123"
            # Config datastore: the durable accounts / allowlist / sessions /
            # namespace-grants / iso_artifacts / gateway_route_access tables.
            # The app's application.yml defaults spring.r2dbc + spring.liquibase to
            # a literal `snapdragon-pg` host that does NOT exist; OVERRIDE both here
            # to the dedicated admin-bff-db (mirrors how federation overrides to
            # federation-db). R2DBC is the runtime handle; the JDBC handle is used
            # by Liquibase ONCE at startup. (The old dead SPRING_DATASOURCE_URL env
            # is removed — the app reads spring.r2dbc/spring.liquibase, not
            # spring.datasource.)  !!! DEV password — prod: ESO admin-bff-db-auth +
            # secretKeyRef, see docs/HANDOFF.md §3.3.
            - name: SPRING_R2DBC_URL
              value: "r2dbc:postgresql://admin-bff-db.snapdragon-backend.svc.cluster.local:5432/adminbff"
            - name: SPRING_R2DBC_USERNAME
              value: "adminbff"
            - name: SPRING_R2DBC_PASSWORD
              value: "adminbff"
            - name: SPRING_LIQUIBASE_URL
              value: "jdbc:postgresql://admin-bff-db.snapdragon-backend.svc.cluster.local:5432/adminbff"
            - name: SPRING_LIQUIBASE_USER
              value: "adminbff"
            - name: SPRING_LIQUIBASE_PASSWORD
              value: "adminbff"
            - name: CASSANDRA_CONTACT_POINTS
              value: "cassandra.snapdragon-pki.svc.cluster.local:9042"
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            initialDelaySeconds: 45
            periodSeconds: 15
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: "1",  memory: 768Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
