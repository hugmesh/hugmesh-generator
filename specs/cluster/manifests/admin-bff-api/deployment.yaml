# admin-bff — the Backend-For-Frontend that the hugmesh-admin-ui talks to for
# route-access CRUD (and the other admin BFF endpoints: /bff/login,
# /bff/register, /bff/provision, /bff/me, /bff/admin/route-access).
#
# It is the ONLY writer of the gateway_route_access table (Postgres source of
# truth in hugmesh-pki; the gateways read-cache it in Cassandra). It is a
# ClusterIP-only service in hugmesh-backend: nothing reaches it from outside
# except via the fe-gateway, which routes same-origin /bff/** to it AND enforces
# the Casdoor role rules (/bff/admin/** => ROLE_ADMIN) from the route DB first.
#
# Defense in depth: this BFF independently re-validates the Casdoor JWT
# (OAuth2 resource server, CASDOOR_ISSUER_URI) before mutating the route DB.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hugmesh-admin-bff-api
  namespace: hugmesh-backend
  labels: { app: hugmesh-admin-bff-api, app.kubernetes.io/part-of: hugmesh.net }
spec:
  # replicas is deliberately UNSET: the HorizontalPodAutoscaler below owns it.
  # Pinning it here made ArgoCD and the HPA fight forever — the HPA scaled to
  # minReplicas, ArgoCD saw drift and wrote it back, round and round. Measured
  # 2026-08-22 on kind: seven Deployments at generation ~950-964 after 38h,
  # one rewrite every ~2.4 minutes, and the Applications never left OutOfSync.
  selector: { matchLabels: { app: hugmesh-admin-bff-api } }
  template:
    metadata:
      labels: { app: hugmesh-admin-bff-api }
      annotations:
        # The CQL permission class claimed for CASSANDRA_USERNAME below, checked
        # for set EQUALITY against manifests/cassandra-init's GRANTs by
        # tests/scripts/test-cassandra-cluster-wiring.sh. `dml` = SELECT+MODIFY
        # and nothing else: CassandraRouteMirror / UrlRegistryRepository /
        # HsTokenRegistry are INSERT+DELETE+SELECT only — this service issues no
        # DDL and depends on the gateway's migration runner having created the
        # tables. The overlay this branch deleted had it the other way round
        # (admin-bff the writer, the gateways SELECT-only readers), which is why
        # the class is declared here and the grants are checked against it rather
        # than merely counted.
        hugmesh.net/cassandra-access: dml
    spec:
      nodeSelector: { hugmesh.net/backend: "true" }
      # ── Cloud-backups effector identity (least-privilege Velero CR apply) ────
      # The cloudbackup VeleroBackupEffector's fabric8 in-cluster client runs as
      # THIS pod's ServiceAccount. backups-effector (manifests/velero/rbac.yaml) is
      # bound ONLY to create/get/list/patch velero.io Backup/Restore CRs in the
      # `velero` namespace — NOT cluster-admin, NOT the Velero server SA. The token
      # is unused while the effector ships dark (BACKUPS_EFFECTOR_ENABLED=false
      # below); enabling backups (a superadmin opt-in) is what lights this seam up.
      # automount is required so the in-cluster client can read the SA token.
      serviceAccountName: backups-effector
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
        seLinuxOptions:
          type: container_t
          level: "s0:c23"
      # ── API-to-API mTLS identity (build-keystore) ───────────────────────────
      # Mirrors the hugmesh-gateway chart's build-keystore initContainer. It
      # turns the Vault-PKI-issued, ESO-synced TLS Secret
      # (hugmesh-admin-bff-api-mtls: tls.crt/tls.key/ca.crt) into the PKCS12
      # keystore.p12 (this service's identity) + truststore.p12 (cluster CA) that
      # the server-side server.ssl.* config (merged) loads to REQUIRE a client cert
      # chaining to the cluster CA (client-auth=need). keytool + openssl ship in
      # the eclipse-temurin JRE image, so we reuse the app image. The store
      # password is generated HERE, kept only in the tmpfs /stores emptyDir (never
      # in git / a Secret / Vault), and emitted into application.properties that
      # the app loads via SPRING_CONFIG_ADDITIONAL_LOCATION=file:/stores/ — so the
      # SSL_*_PASSWORD env vars stay empty in the pod spec and the secret never
      # leaves the pod.
      initContainers:
        - name: build-keystore
          image: hugmesh/admin-bff-api:dev
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          command: ["/bin/sh", "-ec"]
          args:
            - |
              P="$(openssl rand -base64 24 | tr -d '/+=' | cut -c1-24)"
              # mTLS identity: key + cert -> PKCS12 (Spring reads PKCS12 natively).
              openssl pkcs12 -export -inkey /pki/tls.key -in /pki/tls.crt \
                -certfile /pki/ca.crt -name hugmesh-admin-bff-api \
                -out /stores/keystore.p12 -passout "pass:${P}"
              # Truststore: the issuing (cluster) CA so we trust cluster peers.
              keytool -importcert -noprompt -alias hugmesh-cluster-ca \
                -file /pki/ca.crt -keystore /stores/truststore.p12 \
                -storetype PKCS12 -storepass "${P}"
              # Spring SSL config picked up from file:/stores/ (added to
              # SPRING_CONFIG_ADDITIONAL_LOCATION). Sets ONLY the in-pod-generated
              # store passwords; SSL_ENABLED / SSL_CLIENT_AUTH / paths come from env.
              # FILENAME IS LOAD-BEARING — do NOT rename this back to
              # application-tls.properties (or any application-<name>.properties).
              # SPRING_CONFIG_ADDITIONAL_LOCATION only adds a SEARCH DIRECTORY; Spring
              # auto-loads a profile-named doc (application-<name>.properties) from it ONLY
              # when a profile literally named <name> is active. No manifest activates a
              # `tls` profile, so the old application-tls.properties was silently never
              # loaded and the store passwords fell back to the packaged application.yml's
              # ${SSL_KEY_STORE_PASSWORD:} -> "" (empty), which cannot open the PKCS12
              # keystore. Plain application.properties loads UNCONDITIONALLY from the
              # additional location, with no profile needed.
              umask 077
              cat > /stores/application.properties <<EOF
              server.ssl.key-store-password=${P}
              server.ssl.trust-store-password=${P}
              EOF
              echo "keystore + truststore + application.properties built"
          volumeMounts:
            - { name: pki,    mountPath: /pki, readOnly: true }
            - { name: stores, mountPath: /stores }
      containers:
        - name: hugmesh-admin-bff-api
          image: hugmesh/admin-bff-api:dev
          ports: [{ name: http, containerPort: 8080 }]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          env:
            # ── EFFECTIVE in-cluster BRAND env (mesh repo-templating, Phase 3) ──
            # These override the application.yml env-defaults (deploy env wins).
            # Kept LITERAL hugmesh.net (NOT {{tokens}}): this manifest is the
            # canonical, RAW ArgoCD-synced deploy source, and its per-tenant brand
            # substitution is the existing build-x86-host-stage4.sh rebrand_sysroot
            # sed pass (hugmesh.net -> CLUSTER_DOMAIN), which rewrites all of
            # these to the tenant domain at ISO build. All must derive from that SAME
            # domain as the app.yml overlay or a tenant gets a self-inconsistent
            # issuer. Frozen (untouched): label keys, nodeSelector, mTLS/ESO secret
            # NAMES, the image alias — none templated.
            #
            # OAuth2 resource server: validate the cluster Casdoor JWT itself.
            - name: CASDOOR_ISSUER_URI
              value: "https://id.hugmesh.net"
            # ── Casdoor identity contract (must AGREE with casdoor-init) ────────
            # The Casdoor ORGANIZATION every login / admin write resolves against.
            # casdoor-init + init_data.json create org `hugmesh`; this app's
            # application.yml still defaults to the pre-rebrand org slug, so an
            # unset value makes every native login fail with
            # "The user: <pre-rebrand-org>/<name> doesn't exist" against an IdP that has the
            # persona (kind 2026-08-05, docs/KIND-SSO-E2E-FINDINGS.md #11).
            # compose.local.yaml has carried this override, with this exact
            # explanation, for all three BFFs. tests/scripts/test-service-env-contract.sh
            # fails the build if this stops matching what casdoor-init registers.
            - { name: CASDOOR_ORG, value: "hugmesh" }
            # casdoor.gateway-base — the pki-tier gateway this BFF reaches Casdoor
            # through for ordinary JWT traffic, and broker.gateway-url — the base
            # GatewayRevocationClient POSTs coarse ban keys to. BOTH default to the
            # pre-rebrand pki-gateway host (NXDOMAIN); the
            # deployed Service is hugmesh-pki-gateway in hugmesh-pki, plain HTTP 8080.
            - { name: PKI_GATEWAY_BASE,   value: "http://hugmesh-pki-gateway.hugmesh-pki.svc.cluster.local:8080" }
            - { name: BROKER_GATEWAY_URL, value: "http://hugmesh-pki-gateway.hugmesh-pki.svc.cluster.local:8080" }
            # casdoor.admin.base-url — the Casdoor ADMIN write API (add-user /
            # update-role). Ships dark (casdoor.admin.enabled=false) but its default is
            # the same pre-rebrand casdoor host, and it is ALSO the
            # fallback for app.local-login.casdoor-base-url — so pin it rather than
            # leave a dud that only surfaces the day either flag flips.
            - { name: CASDOOR_ADMIN_BASE_URL, value: "http://casdoor.hugmesh-pki.svc.cluster.local:8000" }
            # Default-admin Gmail/allowlist seed (local-part 'admin' stays literal).
            - name: ADMIN_EMAILS
              value: "admin@hugmesh.net"
            # WebAuthn brand value lives HERE, NOT app.yml (whose rp-id/origins
            # defaults are the dev-safe localhost/https://localhost — WRONG for an
            # in-cluster deploy). RP-ID = the admin host; origins = its https origin.
            # Previously ABSENT (a latent bug: in-cluster WebAuthn RP-ID fell back to
            # 'localhost'); adding the brand admin subdomain fixes it. rebrand_sysroot
            # carries admin.hugmesh.net -> admin.<domain> per tenant.
            - name: APP_MFA_WEBAUTHN_RP_ID
              value: "admin.hugmesh.net"
            - name: APP_MFA_WEBAUTHN_ORIGINS
              value: "https://admin.hugmesh.net"
            # In-cluster app-store Kaniko push registry host (brand).
            - name: APPSTORE_BUILDER_REGISTRY
              value: "registry.hugmesh.net"
            # ── API-to-API mTLS (server side) ─────────────────────────────────
            # Enforce a client cert chaining to the cluster CA. The store passwords
            # come from /stores/application.properties (in-pod generated, loaded
            # via SPRING_CONFIG_ADDITIONAL_LOCATION) — NOT set here, so the secret
            # never enters the pod spec. DEPLOY-ORDER: keep this in lockstep with the
            # gateway/BFF client-cert wave (see PR body) — flipping client-auth=need
            # before callers present certs rejects in-cluster traffic.
            - { name: SSL_ENABLED,          value: "true" }
            - { name: SSL_CLIENT_AUTH,      value: "need" }
            - { name: SSL_KEY_STORE,        value: "/stores/keystore.p12" }
            - { name: SSL_KEY_STORE_TYPE,   value: "PKCS12" }
            - { name: SSL_TRUST_STORE,      value: "/stores/truststore.p12" }
            - { name: SSL_TRUST_STORE_TYPE, value: "PKCS12" }
            # Load the in-pod-generated store passwords (application.properties).
            - { name: SPRING_CONFIG_ADDITIONAL_LOCATION, value: "file:/stores/" }
            # SessionExchangeConfig's self-loopback target. Left unset it falls back to
            # SessionExchangeConfig.DEFAULT_SELF_HOST, a PRE-REBRAND constant naming the
            # old brand's service AND namespace (not quoted verbatim here: the namespace
            # scanner reads comments too, and spelling it out turns
            # lint:cluster-manifest-integrity red for a string that is only being
            # described). It is NXDOMAIN on a real cluster. Every /bff/session read walks
            # user-bff -> admin-bff sessions -> this self-call, so with it wrong the
            # BFF answered a freshly-minted, perfectly valid session with
            #   503 {"error":"session_backend_unavailable"}
            # — a login that succeeds and then has nowhere to resolve. Hit LIVE on kind
            # 2026-08-06 while chasing spec 29; the pod logged the wrong host at boot
            # ("[bff-exchange] self-loopback WebClient -> https://hugmesh-...") and
            # nothing treated that as an error. Same finding-#14 class as CASDOOR_ORG
            # and ADMIN_BFF_INTERNAL_BASE_URL: the app's packaged default is
            # pre-rebrand and the generator overrode every sibling but this one.
            # https:// because SSL_ENABLED=true above — the scheme
            # SessionExchangeConfig.computeBaseUrl derives from server.ssl.enabled.
            - name: APP_BFF_EXCHANGE_SELF_BASE_URL
              value: "https://hugmesh-admin-bff-api.hugmesh-backend.svc.cluster.local:8080"
            # R2DBC handle to the gateway_route_access Postgres (hugmesh-pki).
            # Least-privilege: admin-bff is the ONLY writer, so it logs in as its
            # OWN role `admin_bff` (SELECT/INSERT/UPDATE/DELETE on
            # gateway_route_access — NOT the DB owner). Password from its OWN ESO
            # Secret (route-access-admin-bff, key password); k8s interpolates it
            # into the URL via $(VAR). DEV placeholder secret in test; Vault in prod.
            - name: ROUTE_ACCESS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: route-access-admin-bff
                  key: password
            - name: ROUTE_ACCESS_R2DBC_URL
              value: "r2dbc:postgresql://admin_bff:$(ROUTE_ACCESS_DB_PASSWORD)@route-access-db.hugmesh-pki.svc.cluster.local:5432/gateway"
            # This BFF also owns the usage-analytics aggregation: it consumes the
            # Kafka usage-event bus into ClickHouse and serves /bff/admin/usage.
            # Hence the clickhouse profile + Kafka/ClickHouse wiring. The gateway
            # addresses this BFF by its stable k8s Service DNS
            # (hugmesh-admin-bff-api.hugmesh-backend.svc) — there is no
            # client-side service discovery, so the active profiles are exactly
            # casdoor + clickhouse and no DEFAULTZONE env is set.
            - name: SPRING_PROFILES_ACTIVE
              value: "casdoor,clickhouse"
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
            - name: CLICKHOUSE_URL
              value: "http://clickhouse:8123"
            # Config datastore: the durable accounts / allowlist / sessions /
            # namespace-grants / iso_artifacts / gateway_route_access tables.
            # The app's application.yml defaults spring.r2dbc + spring.liquibase to
            # a literal `hugmesh-pg` host that does NOT exist; OVERRIDE both here
            # to the dedicated admin-bff-db (mirrors how federation overrides to
            # federation-db). R2DBC is the runtime handle; the JDBC handle is used
            # by Liquibase ONCE at startup. (The old dead SPRING_DATASOURCE_URL env
            # is removed — the app reads spring.r2dbc/spring.liquibase, not
            # spring.datasource.)  Password sourced from Vault via External Secrets
            # (ESO Secret admin-bff-db-auth, key password) — the SAME Secret the
            # admin-bff-db pod's POSTGRES_PASSWORD mounts, so the DB and its consumer
            # stay in sync. See docs/HANDOFF.md §3.3.
            # RUNTIME handle: log in as the dedicated NON-OWNER least-privilege role
            # `adminbff_app` (DML only, no DDL), created by admin-bff-db's
            # initdb/10-roles.sh. Password from its OWN ESO Secret
            # admin-bff-db-app-auth (the SAME the DB pod's ADMINBFF_APP_PASSWORD mounts).
            - name: SPRING_R2DBC_URL
              value: "r2dbc:postgresql://admin-bff-db.hugmesh-backend.svc.cluster.local:5432/adminbff"
            - name: SPRING_R2DBC_USERNAME
              value: "adminbff_app"
            - name: SPRING_R2DBC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: admin-bff-db-app-auth
                  key: password
            # JDBC handle used ONLY by Liquibase at startup. DDL needs the OWNER, so
            # Liquibase keeps the owner role `adminbff` + the owner ESO Secret
            # admin-bff-db-auth (the SAME the DB pod's POSTGRES_PASSWORD mounts).
            - name: SPRING_LIQUIBASE_URL
              value: "jdbc:postgresql://admin-bff-db.hugmesh-backend.svc.cluster.local:5432/adminbff"
            - name: SPRING_LIQUIBASE_USER
              value: "adminbff"
            - name: SPRING_LIQUIBASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: admin-bff-db-auth
                  key: password
            # ── Cassandra (route mirror + url_registry + hs_tokens) ─────────────
            # CASSANDRA_CONTACT_POINTS USED TO BE SET HERE AND BOUND TO NOTHING.
            # admin-bff excludes Spring's Cassandra auto-configuration and builds
            # its own CqlSession from app.mirror.cassandra.*, whose contact-point
            # placeholder is ${ROUTE_MIRROR_CASSANDRA} — so the env this manifest
            # emitted matched no placeholder and the mirror fell back to its baked
            # default, the PRE-REBRAND cassandra host… (NXDOMAIN). The
            # route mirror defaults ENABLED and swallows every failure, so the
            # gateways' gateway_route_access + url_registry rows were simply never
            # written and nothing said so. The upstream repo's own deploy manifest
            # already carries this correction (its comment: "the old
            # CASSANDRA_CONTACT_POINTS env matched NO placeholder (dead/no-op)").
            - name: ROUTE_MIRROR_CASSANDRA
              value: "cassandra.hugmesh-pki.svc.cluster.local:9042"
            # The KEYSPACE is deliberately left on its `hugmesh_gateway` default —
            # that is the LIVE keyspace name (charts/hugmesh-gateway/values.yaml and
            # cassandra-hardening/bootstrap-roles-configmap.yaml grant it by that name);
            # renaming it is the separate infra-migration wave, not a manifest edit.
            - name: ROUTE_MIRROR_KEYSPACE
              value: "hugmesh_gateway"
            # datacenter1, not dc1: apps/00-cassandra.yaml runs the chart-default
            # SimpleSnitch, which always advertises datacenter1 regardless of the
            # chart's `datacenter` value. The app default is dc1 → every dial would
            # end in NoNodeAvailableException.
            - name: ROUTE_MIRROR_LOCAL_DC
              value: "datacenter1"
            # Cassandra runs PasswordAuthenticator (bitnami image default), so
            # these are REQUIRED, not hardening: admin-bff dials as its own
            # DML-only role admin_bff_cass (SELECT+MODIFY on hugmesh_gateway,
            # no DDL — the gateway owns the schema). Role + password come from
            # apps/00b-cassandra-init.yaml and the cassandra-app-creds ESO Secret.
            - { name: CASSANDRA_AUTH_ENABLED, value: "true" }
            - name: CASSANDRA_USERNAME
              value: "admin_bff_cass"
            - name: CASSANDRA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cassandra-app-creds
                  key: admin-bff
            # ── Anubis PoW anti-scraper sidecar proxy (SUPERADMIN BFF surface) ──
            # The anubis package (GET /bff/admin/anubis/{status,metrics}) proxies
            # the Anubis management port. ANUBIS_ENABLED=true wires the BFF surface;
            # the Anubis component itself (manifests/anubis, hugmesh-frontend) is a
            # DEFAULT-OFF optional service created via the optional-services
            # ApplicationSet (apps/13a, installed flag in the installed-services
            # ConfigMap). MANAGEMENT_URL is the in-cluster Service DNS of the
            # metrics/health listener (:9090) — NOT the public PoW gate (:8923) —
            # reachable cross-namespace from this BFF pod once Anubis is enabled.
            # While Anubis is OFF the BFF's AnubisClient onErrorResume path returns a
            # structured "unreachable" instead of cascading 503s, so enabling the
            # proxy here is safe and it lights up the moment the operator flips Anubis on.
            - { name: ANUBIS_ENABLED,        value: "true" }
            - { name: ANUBIS_MANAGEMENT_URL, value: "http://anubis.hugmesh-frontend.svc.cluster.local:9090" }
            # ── Cloud-backups effector (the Velero leg) — SHIPS DARK ───────────
            # BACKUPS_EFFECTOR_ENABLED gates the REAL VeleroBackupEffector
            # (app.backups.effector.enabled). DEFAULT-OFF: while false the
            # foundation's NoopBackupEffector + StubRunningServiceProvider stay the
            # beans — a created backup_set is written to the catalog but NO Velero
            # CR is emitted and NO cluster ConfigMap is read, so installing Velero
            # does NOT silently start real backups. A SUPERADMIN turns backups on by
            # flipping this to "true" (and un-suspending the sweep CronJob) AFTER
            # apps/55-velero.yaml + apps/56-velero-config.yaml are synced and the
            # object store + Vault secret/<brand>/velero are provisioned. See
            # docs/CLOUD-BACKUPS.md. The other BACKUPS_* values are the effector's
            # defaults (velero ns, be/fe brand suffixes, 30d TTL, installed-services
            # ConfigMap ns) and are inert while the flag is off.
            - { name: BACKUPS_EFFECTOR_ENABLED,            value: "false" }
            - { name: BACKUPS_VELERO_NAMESPACE,            value: "velero" }
            - { name: BACKUPS_BRAND_NAMESPACE_SUFFIXES,    value: "be,fe" }
            - { name: BACKUPS_INSTALLED_SERVICES_NAMESPACE, value: "hugmesh-backend" }
            # ── egress-VPN config-Secret delivery — SHIPS DARK ─────────────────
            # EGRESS_VPN_SECRET_DELIVERY_ENABLED gates admin-bff's REAL
            # Fabric8VpnConfigSecretWriter (app.egress-vpn.secret-delivery.enabled).
            # DEFAULT-OFF and set explicitly here, the BACKUPS_EFFECTOR_ENABLED
            # pattern above: while false the NoopVpnConfigSecretWriter stays the
            # bean, an imported config's bytes are parse-validated then DROPPED,
            # and no cluster is dialed. Flip to "true" only AFTER the
            # manifests/egress-vpn overlay is enabled (its writer-rbac.yaml is
            # what grants this pod's backups-effector SA the write) and the
            # assigned nodes are labelled.
            #
            # EGRESS_VPN_SECRET_NAMESPACE is LOAD-BEARING, not decoration. The
            # app's own default is `hugmesh-backend`; the projector DaemonSet that
            # consumes these Secrets reads `hugmesh-egress-vpn`, because a
            # node-privileged host-writing reader must not be able to read the app
            # tier's DB/OIDC Secrets. Drop this env and the two halves silently
            # stop meeting — which is exactly how they shipped. The value is the
            # single source of truth in
            # specs/cluster/egress-vpn-secret-contract.env and is asserted against
            # it (and against the admin-bff source) by
            # tests/egress-vpn/test-secret-contract.sh.
            - { name: EGRESS_VPN_SECRET_DELIVERY_ENABLED, value: "false" }
            - { name: EGRESS_VPN_SECRET_NAMESPACE,        value: "hugmesh-egress-vpn" }
            # ── Node-storage reconciler (the push-with-ack leg) — SHIPS DARK ───
            # NODESTORAGE_RECONCILER_ENABLED gates admin-bff's node-storage push
            # reconciler: the FAST propagation path that pushes the signed
            # per-node storage-pool export at the node agent and tracks /ack
            # (pending->applied chip). The node agent's boot oneshot + 60s cron
            # PULL is the convergence floor and works without it, so the lever
            # staying dark only slows propagation — it never blocks it.
            # COMMENTED, not merely "false": the exact Spring relaxed-binding
            # name is being proven in the admin-bff lane — cross-check the
            # proven contract there before uncommenting. Absent env => the
            # reconciler stays dark (pull-only convergence).
            # - { name: NODESTORAGE_RECONCILER_ENABLED, value: "false" }
            # ── Forum admin/moderation console (the phpBB leg, via forum-bff) ──
            # GO-LIVE: the hugmesh/forumapi extension is live + proven end-to-end
            # (live smoke 2026-06-23), so turn on the admin forum-moderation proxy
            # (external.forum.enabled). The leg is hasRole('ADMIN')-gated end-to-end
            # and calls forum-bff (EXTERNAL_FORUM_BASE_URL default). By design it
            # degrades gracefully when the forum optional-service is absent (the
            # PhpbbAdminClient call is audited/stubbed, never hard-fails), so this is
            # safe on the always-deployed admin-bff for non-forum brands too.
            - { name: EXTERNAL_FORUM_ENABLED, value: "true" }
            # …and the address that leg calls. external.forum.base-url defaults to the
            # pre-rebrand forum-bff host, so with the
            # gate ON above and this unset the console's every forum call resolved to
            # NXDOMAIN (it degrades instead of hard-failing, which is exactly why it
            # went unnoticed). https:// — forum-bff serves TLS with client-auth=need,
            # the scheme the fe-gateway routes already use for this peer.
            - name: EXTERNAL_FORUM_BASE_URL
              value: "https://hugmesh-forum-bff-api.hugmesh-backend.svc.cluster.local:8080"
            # ── The rest of finding #14's family in this service ──────────────────
            # Everything below defaulted to a host or namespace this cluster does not
            # have. They were not found by reading the manifest; they are what
            # tests/scripts/service_env_contract.py DERIVES from this service's own
            # application.yml (every ${ENV:default} whose default names a namespace
            # specs/cluster never creates), which is the only way the long tail of
            # this class gets closed rather than the handful someone happened to hit.
            #
            # homeserver.admin.* — the account-state admin seam (akkoma suspend /
            # tuwunel deactivate) the access_suspension reconcile loop calls. Same two
            # Services as the broker's SYNAPSE_URL/MASTODON_URL below.
            - { name: HOMESERVER_AKKOMA_URL,  value: "http://akkoma.hugmesh-backend.svc.cluster.local:4000" }
            - { name: HOMESERVER_TUWUNEL_URL, value: "http://tuwunel.hugmesh-backend.svc.cluster.local:8008" }
            # external.mastodon.base-url — the console's Mastodon-API read leg. Same
            # akkoma Service, a DIFFERENT property from the broker's MASTODON_URL, so
            # setting one never covered the other.
            - { name: EXTERNAL_MASTODON_BASE_URL, value: "http://akkoma.hugmesh-backend.svc.cluster.local:4000" }
            # inference.edge-ai.base-url — the Ollama-protocol edge-AI endpoint. The
            # default named `edge-ai` in hugmesh-backend; the deployed Service is
            # hugmesh-edge-ai on :11434 in hugmesh-inference (manifests/edge-ai).
            - { name: INFERENCE_EDGE_AI_BASE_URL, value: "http://hugmesh-edge-ai.hugmesh-inference.svc.cluster.local:11434" }
            # federation-api, reached under TWO unrelated properties — the username
            # availability gate and the app-store's federation registration. Same peer
            # and same https:// client-auth=need scheme as user-bff/mod-bff use.
            - name: FEDERATION_USERNAME_GATE_BASE_URL
              value: "https://hugmesh-federation-api.hugmesh-backend.svc.cluster.local:8080"
            - name: APPSTORE_FEDERATION_BASE_URL
              value: "https://hugmesh-federation-api.hugmesh-backend.svc.cluster.local:8080"
            # app.appstore.scaffold.headscale-url — the mesh-join endpoint a scaffolded
            # service is handed. Its default `headscale.headscale` is NOT a pre-rebrand
            # name at all: there has never been a `headscale` namespace here. headscale
            # runs in hugmesh-pki (manifests/headscale), which is why a gate that looked
            # for the string `hugmesh` could not see this one.
            - { name: APPSTORE_SCAFFOLD_HEADSCALE_URL, value: "http://headscale.hugmesh-pki.svc.cluster.local:8080" }
            # app.registry.headscale-acl.base-url — the SECOND key with the identical
            # defect, and the one [env-derived] surfaced the moment the gate stopped
            # exiting INCOMPLETE (its container-matching prefix had gone stale in the
            # rebrand, so it had been scanning zero BFFs). Same non-existent `headscale`
            # namespace in the packaged default, same real Service in hugmesh-pki. The
            # ACL push leg ships DARK (APP_REGISTRY_HEADSCALE_ACL_ENABLED=false), so an
            # unpinned base-url is a dud that would only surface the day that flag flips
            # — pin it now, exactly as APPSTORE_SCAFFOLD_HEADSCALE_URL above.
            - { name: APP_REGISTRY_HEADSCALE_ACL_BASE_URL, value: "http://headscale.hugmesh-pki.svc.cluster.local:8080" }
            # (ROUTE_MIRROR_CASSANDRA — app.mirror.cassandra.contact-point — is set ONCE,
            # in the Cassandra block above. #543 added a second, identical entry here;
            # two entries of the same name in one container are not a redundancy, they
            # break the workloadConsole overlay: a strategic-merge patch merges env by
            # `name`, so the merged container keeps ONE of them and the lit render stops
            # being purely additive over the dark one.)
            # Namespaces this service LAUNCHES workloads into or reconciles. Not DNS —
            # a Job created in a namespace that does not exist is rejected by the API
            # server, which is the same defect one layer up.
            - { name: TESTREPORTS_LAUNCH_NAMESPACE, value: "hugmesh-backend" }
            - { name: IMAGEGEN_LAUNCH_NAMESPACE,    value: "hugmesh-backend" }
            # The Kaniko app-store build namespace — manifests/service-catalog-builder
            # creates hugmesh-service-catalog-builds (with its own default-deny netpol);
            # APPSTORE_BUILDER_REGISTRY above was already pinned, its namespace was not.
            - { name: APPSTORE_BUILDER_NAMESPACE, value: "hugmesh-service-catalog-builds" }
            # ── APP-STORE / SERVICE-CATALOG EFFECTOR GO-LIVE (D3, 2026-08-26) ──────
            # OBSERVED: the whole SUPERADMIN Service Catalog was inert. Provisioning a
            # service reported success and NOTHING was created in-cluster, and every
            # DOCKERFILE/ZIP submission came back 400 "requires the in-cluster image
            # builder". Root cause is NOT a bug in the flow — it is that all three
            # app.appstore.* gates default FALSE in the BFF's application.yml and this
            # deployment never overrode them, so the ships-dark Noop seams were the
            # only beans ever wired. Each flag is a TWO-BEAN @ConditionalOnProperty
            # switch (ArgoCdConfig / FederationModuleClientConfig), i.e. exactly one
            # bean is registered in either mode — flipping it swaps the seam, it does
            # not add an unguarded code path.
            #
            # 1) APPSTORE_EFFECTOR_ENABLED (app.appstore.effector.enabled)
            #    ArgoCdConfig: false → NoopArgoCdClient (AddServiceEffector runs its
            #    full sequence against a no-op ArgoCD seam and creates nothing);
            #    true → RestArgoCdClient, the real ArgoCD API client. This flag gates
            #    ONLY the ArgoCD seam. It does NOT gate cloud-backups: BackupEffector-
            #    Config names app.appstore.effector.enabled in its javadoc PROSE but
            #    conditions on app.backups.effector.enabled — reading the annotation,
            #    not the comment, is the whole difference (this repo has inverted a
            #    check off comment prose four times).
            # 2) APPSTORE_FEDERATION_ENABLED (app.appstore.federation.enabled)
            #    FederationModuleClientConfig: false → NoopFederationModuleClient (a
            #    federate call is LOGGED only and FederateOutcome.federationReal=false,
            #    so the wizard shows a service that was never registered); true →
            #    RestFederationModuleClient against APPSTORE_FEDERATION_BASE_URL, which
            #    is already pinned above.
            #
            # KNOWN GAP, deliberately not papered over: neither leg's bearer token has
            # a source in this tree. APPSTORE_ARGOCD_AUTH_TOKEN and
            # APPSTORE_FEDERATION_AUTH_TOKEN both default EMPTY in application.yml and
            # there is no ExternalSecret for either (grep external-secrets/ — argocd
            # has none; the federation token must be a Casdoor JWT carrying
            # ROLE_SUPERADMIN). Until they are provisioned these two legs make a REAL
            # call that comes back 401. That is a LOUD failure surfaced to the caller,
            # which is why it is acceptable to land ahead of the tokens — unlike the
            # builder below, whose failure mode is silent. They are NOT wired here as
            # secretKeyRefs on purpose: a non-optional secretKeyRef naming a Secret
            # that does not exist wedges this very pod in CreateContainerConfigError,
            # which would reproduce the exact hang class this unit exists to avoid.
            #
            # 3) APPSTORE_BUILDER_ENABLED — STAYS FALSE. ORDERING CONSTRAINT.
            #    false → no KanikoBuildLauncher bean (@ConditionalOnProperty) and
            #    AddServiceEffector rejects DOCKERFILE/ZIP with a 400. That 400 is the
            #    SAFE state. Flipping it true creates a real Kaniko Job whose pod
            #    mounts the registry push credential NON-optionally, so if the Secret
            #    is absent the build pod does not fail — it sits in ContainerCreating
            #    until activeDeadlineSeconds (1800s) with the operator watching a
            #    "build" that never started. A hang, not an error.
            #    This flips ONLY after the push-credential ExternalSecret lands (unit
            #    D1). tests/scripts/test-appstore-effector-flags.sh enforces the
            #    coupling in BOTH directions: builder=true without an APPLIED manifest
            #    creating the mounted Secret — right name, right `items` key, and in
            #    APPSTORE_BUILDER_NAMESPACE above, because a pod can only mount a
            #    Secret from its own namespace — is a RED test, so the flag cannot be
            #    flipped in a later PR without the secret coming with it.
            #    NOTE ON THE VALUE ITSELF: KanikoBuildLauncher's @ConditionalOnProperty
            #    carries NO havingValue, so Spring enables the bean for ANY value other
            #    than "false" (case-insensitive) — "TRUE", "yes", "1" and even "" all
            #    switch the builder ON. A typo here does not ship dark; it arms the
            #    wedge. The guard requires the literal string for exactly that reason.
            - { name: APPSTORE_EFFECTOR_ENABLED,   value: "true" }
            - { name: APPSTORE_FEDERATION_ENABLED, value: "true" }
            - { name: APPSTORE_BUILDER_ENABLED,    value: "false" }
            # Where the optional-services reconciler writes its policy objects: the
            # deployed namespace is hugmesh-policy (namespaces/namespaces.yaml).
            - { name: APP_OPTIONAL_SERVICES_RECONCILE_POLICY_NAMESPACE, value: "hugmesh-policy" }
            # ── THE OPTIONAL-SERVICES RECONCILER MASTER SWITCH (GitOps-only) ──
            # app.optional-services.reconcile.enabled. Until this line existed the
            # flag appeared EXACTLY ONCE in the whole platform — as the ":false"
            # default of ${APP_OPTIONAL_SERVICES_RECONCILE_ENABLED} in the BFF's own
            # application.yml — and was set by no manifest, no builder, no brand.conf
            # and no CLI flag. A feature with no reachable lever is not opt-in, it is
            # unreachable: `kubectl set env` against this Deployment is REVERTED on
            # the next selfHeal pass of apps/31-admin-bff-api.yaml (automated:
            # {prune:true,selfHeal:true}). Declaring it HERE is the lever: this file
            # is the single source, and flipping the value below to "true" is a
            # one-line reviewed commit that ArgoCD syncs and then ENFORCES.
            #
            # WHY IT STAYS "false" (the default is NOT flipped, deliberately):
            # turning the reconciler on makes it authoritative over the WHOLE closed
            # slug set on its very first tick — a known slug with NO OptionalService
            # CR is reconciled to false. The seed CRs ship akkoma/tuwunel/phpbb
            # enabled:true, and apps/30-akkoma.yaml, apps/30-tuwunel.yaml and
            # apps/30-phpbb.yaml are STILL hardcoded Applications, so the very first
            # lit tick makes the 13a ApplicationSet create optional-akkoma /
            # optional-tuwunel / optional-phpbb that DOUBLE-MANAGE manifests a
            # hardcoded Application already owns — two ArgoCD Applications fighting
            # over one manifest directory on every live mesh at once. That is the
            # hardcoded-app CUT-OVER (docs/OPTIONAL-SERVICES.md §10), and it is the
            # precondition for flipping this, not a follow-up to it.
            #
            # WHY THERE IS NO ignoreDifferences FOR IT: see the block in
            # apps/31-admin-bff-api.yaml. Short version — ArgoCD addresses env vars
            # by ARRAY INDEX, so the only pointer that could exempt this one var is
            # positional and silently starts exempting a DIFFERENT variable the next
            # time anything is inserted above it. The per-slug toggles are the
            # runtime surface (the OptionalService CRs); this master switch is not.
            - { name: APP_OPTIONAL_SERVICES_RECONCILE_ENABLED, value: "false" }
            # ── A3+A5 Casdoor-MFA step-up leg (app.casdoor.mfa.enabled) — GO-LIVE ──
            # Platform-wide rollout: a FRESH bff_session MFA stamp becomes a co-equal,
            # license-independent step-up satisfier alongside the existing token-based
            # step-up leg. This is a pure additive OR — every consumer ORs mfaFresh
            # against the pre-existing token-step-up check, so the token-only leg is
            # completely unaffected and ordinary (non-step-up) login never touches this
            # code path. bff_session.mfa_satisfied still defaults false at the schema,
            # so nothing is retroactively granted; a session only satisfies step-up via
            # this leg after the user actually completes an MFA stamp. Prerequisite
            # APP_MFA_FACTOR_KEY (below) is already provisioned by gen-cluster-secrets.
            - { name: APP_CASDOOR_MFA_ENABLED, value: "true" }
            # ── MFA TOTP-secret encryption key (app.mfa.factor-key) ────────────
            # APP_MFA_FACTOR_KEY is the 256-bit AES-GCM data key MfaSecretCipher uses
            # to encrypt each enrolled TOTP secret at rest (and seed the recovery-code
            # keyed hash). REQUIRED (no `optional:`): app.casdoor.mfa.enabled is "true"
            # above, so this key is load-bearing — a pod without it would run with an
            # INERT cipher and refuse every TOTP enroll. The Secret is ESO-materialized:
            # the admin-bff-mfa ExternalSecret (external-secrets/secretstore.yaml
            # admin-bff-mfa block) targets Secret admin-bff-mfa key `factor-key` from
            # Vault secret/<brand>/admin-bff-mfa property factor_key, which
            # gen-cluster-secrets.sh seeds (`openssl rand -base64 32`). With the ref
            # required, a genuinely absent Secret surfaces at the KUBERNETES layer as
            # CreateContainerConfigError with a clear "secret not found" reason —
            # loud and obvious — instead of a running-but-degraded pod; auth-core
            # >= 2.4.2 additionally WARNs at boot when MFA is on without a key.
            - name: APP_MFA_FACTOR_KEY
              valueFrom:
                secretKeyRef:
                  name: admin-bff-mfa
                  key: factor-key
            # ── Shared internal token — the INBOUND half (app.internal.token) ──
            # Every /bff/internal/** caller (fe-gateway BffSessionAuthFilter,
            # user-bff AdminBffInternalClient, mod-bff's session-introspect leg)
            # already mounts this same ESO Secret and SENDS X-Internal-Token — but
            # this manifest never mounted it, so auth-core's InternalTokenWebFilter
            # had no expected value configured and the app-layer check silently
            # no-op'd in-cluster (defence rested on mTLS + NetworkPolicy alone).
            # Mounting it closes the loop: when the Secret exists, a missing or
            # mismatched header fails CLOSED 401. optional: true keeps rollout
            # order-independent (absent Secret → filter no-ops, exactly as today).
            - name: INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: bff-internal-token
                  key: token
                  optional: true
            # ── Native-login session→JWT exchange, SERVING side (auth-core) ────
            # admin-bff is the exchange SERVER for the whole native-login fleet:
            # POST /bff/internal/session/exchange swaps a caller's bff_ session for
            # the custody-held Casdoor JWT. Its clients are user-bff's outbound
            # federation/media forwarding (user-bff-api#111, ALWAYS ON), mod-bff's
            # BearerForwardingFilter (mod-bff-api#72, lit in its manifest), the
            # gateway's dark exchange leg, and admin-bff's OWN appeals-decide
            # loopback (admin-bff-api#205, APP_BFF_EXCHANGE_ENABLED below). Serving
            # a real Bearer needs BOTH app.bff.oidc.enabled (the refresh leg's
            # OidcExchangeConfig beans; issuer + client-id come from auth-core's
            # in-cluster defaults, exactly as user-bff-api relies on them) AND the
            # custody key. Without these — the pre-fix state of this manifest —
            # every exchange 503s "custody disabled" and each caller silently
            # degrades to forwarding no Authorization header, so every
            # federation-backed surface 401s for native-login users in-cluster.
            - { name: APP_BFF_OIDC_ENABLED, value: "true" }
            # The client-id that refresh leg presents. The comment above USED to say
            # "issuer + client-id come from auth-core's in-cluster defaults" — half
            # true: auth-core's issuer default is already the in-cluster Casdoor, but
            # OidcExchangeConfig defaults app.bff.oidc.client-id to `user-bff`, while
            # casdoor-init registers the application as `app-user-bff`. Casdoor answers
            # a wrong client-id with "Invalid client_id" (docs/KIND-SSO-E2E-FINDINGS.md
            # #12), so every refresh through this exchange 400s and each caller
            # silently degrades to forwarding no Authorization header. One OIDC client,
            # two consumers: this MUST stay byte-identical to user-bff-api's
            # APP_BFF_OIDC_CLIENT_ID and to what casdoor-init registers — both are
            # asserted by tests/scripts/test-service-env-contract.sh.
            - { name: APP_BFF_OIDC_CLIENT_ID, value: "app-user-bff" }
            # Casdoor OIDC client secret for the exchange's refresh leg — the SAME
            # user-bff-oidc ESO Secret user-bff-api mounts (one OIDC client, two
            # consumers). optional: the pod boots without it; exchange refuses.
            - name: APP_BFF_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: user-bff-oidc
                  key: client-secret
                  optional: true
            # AES-256-GCM custody key — MUST be byte-identical to user-bff-api's
            # (user-bff ENCRYPTS the exchanged tokens, admin-bff DECRYPTS them), so
            # mount the SAME user-bff-custody-key ESO Secret rather than minting a
            # second key. optional: absent Secret → BffCustodyCipher unavailable →
            # exchange 503s (fail-closed), pod still boots.
            - name: APP_BFF_CUSTODY_KEY
              valueFrom:
                secretKeyRef:
                  name: user-bff-custody-key
                  key: key
                  optional: true
            # Lights admin-bff's OWN decide custody-exchange (admin-bff-api#205): a
            # native-login admin's POST /bff/admin/moderation/{id}/decide exchanges
            # the caller's bff_ session (loopback to the endpoint above — the
            # self-base-url default auto-computes this Service's DNS + tracks TLS)
            # and forwards the real JWT to federation-api. Fail-open like mod-bff's
            # leg: exchange failure degrades to the pre-fix no-header behaviour.
            - { name: APP_BFF_EXCHANGE_ENABLED, value: "true" }
            # ── Homeserver account broker (POST /bff/provision/{matrix,mastodon}) ──
            # broker.svc-password is the ONE placeholder in this app's
            # application.yml with NO default — deliberately, so a deployment that
            # forgets it cannot silently mint real homeserver tokens against a
            # publicly-known credential. The consequence is that an unset value is not
            # a degraded feature, it is a DEAD POD: ServiceTokenBroker fails bean
            # creation with
            #   Could not resolve placeholder 'SVC_PASSWORD' in value "${SVC_PASSWORD}"
            # and admin-bff never starts at all. That is what a fresh kind cluster hit
            # on 2026-08-05 (docs/KIND-SSO-E2E-FINDINGS.md #15); compose.local.yaml has
            # always set SVC_PASSWORD, so no compose run could ever surface it.
            #
            # SOURCE: the EXISTING user-bff-hs-token ExternalSecret's `svc-password`
            # property (manifests/external-secrets/secretstore.yaml) — deliberately NOT
            # a new Secret. It is the one shared homeserver service-account password:
            # user-bff's hs-token broker mints with it (APP_HS_TOKEN_SVC_PASSWORD,
            # same Secret, same key) and this broker mints with it too, so the two
            # brokers must hold the SAME credential or they register/authenticate as
            # different principals. NOT `optional:` — a missing Secret must surface at
            # the kubernetes layer as CreateContainerConfigError ("secret not found")
            # rather than as an unresolved-placeholder crash-loop deep in Spring, and
            # this pod genuinely cannot run without it. Same posture as
            # APP_MFA_FACTOR_KEY above.
            # DEPLOY-ORDER: ESO resolves an ExternalSecret ALL-OR-NOTHING, and
            # `svc-password` is one of the properties gen-cluster-secrets.sh had never
            # seeded (the ESO seed-contract fix). Land that seeding with — or before —
            # this reference, or the whole user-bff-hs-token Secret stays unresolved
            # and this pod reports CreateContainerConfigError.
            - name: SVC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: user-bff-hs-token
                  key: svc-password
            # …and the homeservers that broker actually provisions against. The app
            # defaults are matrix-synapse / mastodon-web in hugmesh-backend — the
            # wrong SERVICE NAMES *and* the wrong namespace (finding #14). This
            # platform ships tuwunel (Matrix CS-API, :8008) and akkoma (Mastodon API,
            # :4000) in hugmesh-backend; compose repoints the same two vars at its own
            # social tier for the same reason.
            # Direct Services, not the :4443 mTLS proxy fronts: the broker's own
            # comment defers that repoint to when it presents a client cert, which is
            # the separate client-cert wave, not this change.
            - { name: SYNAPSE_URL,  value: "http://tuwunel.hugmesh-backend.svc.cluster.local:8008" }
            - { name: MASTODON_URL, value: "http://akkoma.hugmesh-backend.svc.cluster.local:4000" }
          # Probes are HTTPS now that server.ssl is enabled. Because client-auth=need
          # rejects the TLS handshake of any caller WITHOUT a client cert, a plain
          # kubelet httpGet (which presents none) would fail — so the probe is an
          # exec'd curl that PRESENTS this pod's own client cert (/pki PEM, same
          # material the keystore was built from) and validates the server cert
          # against the cluster CA. --resolve maps the cert SAN (hugmesh-admin-bff-api)
          # to loopback so hostname verification passes. Exercises mTLS end to end.
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - >-
                  curl -sf --cert /pki/tls.crt --key /pki/tls.key --cacert /pki/ca.crt
                  --resolve hugmesh-admin-bff-api:8080:127.0.0.1
                  https://hugmesh-admin-bff-api:8080/actuator/health/readiness
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - >-
                  curl -sf --cert /pki/tls.crt --key /pki/tls.key --cacert /pki/ca.crt
                  --resolve hugmesh-admin-bff-api:8080:127.0.0.1
                  https://hugmesh-admin-bff-api:8080/actuator/health/liveness
            initialDelaySeconds: 45
            periodSeconds: 15
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: "1",  memory: 768Mi }
          volumeMounts:
            - { name: tmp,    mountPath: /tmp }
            - { name: stores, mountPath: /stores, readOnly: true }
            # PEM identity, read-only — used by the exec probe's curl client cert.
            - { name: pki,    mountPath: /pki,    readOnly: true }
      volumes:
        - name: tmp
          emptyDir: {}
        # Vault-PKI-issued mTLS material, synced by ESO (kubernetes.io/tls).
        - name: pki
          secret:
            secretName: hugmesh-admin-bff-api-mtls
        # tmpfs for the assembled PKCS12 stores + the in-pod SSL properties.
        - name: stores
          emptyDir:
            medium: Memory
