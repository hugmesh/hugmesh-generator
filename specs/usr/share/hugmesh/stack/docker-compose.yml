# HugMesh stack — local dockerized run. Brought up by ./hugmesh-stack up.
# Infra (Postgres + Casdoor) is always needed; app services build from the repos
# fetched next to this file (contexts are the REAL repo names, exactly as
# fetch-repos.sh clones them) and are gated behind the "app" profile so you can
# start only what you want:  ./hugmesh-stack up admin-bff login-ui
#
# EXPOSURE. Every published port binds ${STACK_BIND_ADDR:-127.0.0.1}: this machine only. The
# infra is not meant for the LAN: Casdoor ships its upstream factory admin and nothing in this
# scaffold changes it, so ./hugmesh-stack refuses a non-loopback STACK_BIND_ADDR. The database
# password is REQUIRED (no literal fallback): ./hugmesh-stack generates one into ./.env (0600) on
# first use; running `docker compose` by hand without it fails instead of using a public default.
#
# This is a SCAFFOLD that tracks your checked-out repos — extend the `app` block
# with the services/UIs you want to run (each just needs a build context + the
# DB/Casdoor env the BFFs already expect).
services:
  postgres:
    image: postgres:16
    profiles: ["infra"]
    environment:
      POSTGRES_USER: hugmesh
      POSTGRES_PASSWORD: ${HUGMESH_DB_PASS:?HUGMESH_DB_PASS is not set - run ./hugmesh-stack up (it generates one into ./.env)}
      POSTGRES_DB: hugmesh
    volumes: ["pgdata:/var/lib/postgresql/data"]
    ports: ["${STACK_BIND_ADDR:-127.0.0.1}:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hugmesh"]
      interval: 10s
      timeout: 5s
      retries: 5

  casdoor:
    image: casbin/casdoor:latest
    profiles: ["infra"]
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      RUNNING_IN_DOCKER: "true"
    ports: ["${STACK_BIND_ADDR:-127.0.0.1}:8000:8000"]

  admin-bff:
    profiles: ["app"]
    build: { context: ./hugmesh-admin-bff-api }
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/hugmesh
      SPRING_DATASOURCE_USERNAME: hugmesh
      SPRING_DATASOURCE_PASSWORD: ${HUGMESH_DB_PASS:?HUGMESH_DB_PASS is not set - run ./hugmesh-stack up (it generates one into ./.env)}
    ports: ["${STACK_BIND_ADDR:-127.0.0.1}:8081:8080"]

  login-ui:
    profiles: ["app"]
    build: { context: ./hugmesh-login-ui }
    ports: ["${STACK_BIND_ADDR:-127.0.0.1}:4200:80"]

volumes:
  pgdata:
