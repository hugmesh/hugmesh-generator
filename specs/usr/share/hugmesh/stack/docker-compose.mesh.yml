# Overlay for ./hugmesh-stack mesh-up — join an existing tailnet as a dockerized
# mesh node. A tailscale container provides the tailnet interface; point the app
# services at it with network_mode if you want them reachable only over the tailnet.
#
# Set TS_AUTHKEY in the environment (a tailnet/headscale auth key) before mesh-up.
services:
  tailscale:
    image: tailscale/tailscale:latest
    profiles: ["mesh"]
    hostname: ${HUGMESH_NODE_NAME:-hugmesh-node}
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?set TS_AUTHKEY to a tailnet/headscale auth key}
      TS_STATE_DIR: /var/lib/tailscale
      TS_EXTRA_ARGS: ${TS_EXTRA_ARGS:---accept-routes}
      # For a self-hosted headscale control plane, set TS_EXTRA_ARGS to include
      # "--login-server=https://<your-headscale>".
    volumes:
      - tsstate:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add: ["NET_ADMIN", "NET_RAW"]
    restart: unless-stopped

volumes:
  tsstate:
