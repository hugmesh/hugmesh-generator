# Cross-compile autoconf cache override for dev-lang/python — scoped via
# package.env (NOT make.conf): a GLOBAL EXTRA_ECONF leaks these ac_cv_* args into
# packages with hand-written, strict configure scripts (e.g. sys-apps/iproute2,
# whose ./configure rejects unknown options and dies).
#
# When CROSS-compiling, CPython's configure can't RUN its chflags()/lchflags()
# probe and falls back to a link test that FALSE-POSITIVES on glibc (chflags is
# BSD-only, absent from Linux); Modules/posixmodule.c then calls a nonexistent
# function and -Werror=implicit-function-declaration fails the build. The cache
# variable CPython actually gates HAVE_CHFLAGS on is ac_cv_have_chflags (a custom
# run-test), not the autotools ac_cv_func_chflags. Seed the real answer here.
EXTRA_ECONF="ac_cv_have_chflags=no ac_cv_have_lchflags=no"
