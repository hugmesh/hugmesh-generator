# Flatpak manifest for HugMesh Image Studio.
#
# RUNTIME CHOICE: org.kde.Platform, because the app is Qt6/PySide6 and the KDE runtime
# already ships Qt. Building against the GNOME runtime would mean bundling the whole
# of Qt into the app, roughly tripling the bundle for no gain.
#
# WHAT THIS SANDBOX CANNOT DO, stated here because the honest answer belongs next to
# the permissions and not only in the release notes:
#
#   The Studio is a FRONT END over host tooling. It shells out to docker, make, bash,
#   qemu, kubectl, lsblk and ssh, and it reads the build scripts and cluster specs out
#   of a hugmesh-generator checkout on the host. A sandbox that could not reach any of
#   that would install cleanly and then be unable to do the one thing it is for.
#
#   So this manifest asks for --filesystem=host (to read the checkout and write build
#   output) and --talk-name=org.freedesktop.Flatpak (to run host commands via
#   flatpak-spawn --host). Those are broad permissions and they are listed with their
#   reasons below rather than buried. An operator who does not want to grant them can
#   run the Studio from a checkout instead — it needs no installer.
app-id: org.hugmesh.ImageStudio
runtime: org.kde.Platform
runtime-version: '6.8'
sdk: org.kde.Sdk
command: hugmesh-studio

finish-args:
  # Display. Wayland first, X11 as the fallback — note that under Wayland a client
  # cannot position its own windows, which the Studio detects and works around
  # (core/platform_info.py); it is not a packaging problem.
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  # The tray icon. Without this the app runs but its whole tray surface — start/stop
  # the mesh, resource limits, running builds — is invisible.
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.Notifications
  # GPU access for the Qt renderer itself (not for builds).
  - --device=dri
  # Reaching a local mesh, a registry, and the Studio's own readiness probes.
  - --share=network
  # The hugmesh-generator checkout, the build output directory, and the operator's
  # config. There is no narrower grant that works: the checkout path is chosen by the
  # operator at first run and is different on every machine.
  - --filesystem=host
  # Run host commands (docker, make, qemu, kubectl) through flatpak-spawn --host.
  # Without it the build lane reports "No build backend" on a machine that has Docker.
  - --talk-name=org.freedesktop.Flatpak

modules:
  # PySide6 is installed from a pinned wheel set. python-deps.json is generated by
  # flatpak-pip-generator and COMMITTED, so the build is offline-reproducible and a
  # release cannot silently pick up a different Qt than the one that was tested:
  #
  #   flatpak-pip-generator --runtime=org.kde.Sdk//6.8 --output python-deps \
  #       'PySide6>=6.5' tzdata
  - python-deps.json

  - name: hugmesh-image-studio
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}"
          --prefix=${FLATPAK_DEST} --no-build-isolation .
      - install -Dm644 packaging/flatpak/org.hugmesh.ImageStudio.desktop
          ${FLATPAK_DEST}/share/applications/org.hugmesh.ImageStudio.desktop
      - install -Dm644 packaging/flatpak/org.hugmesh.ImageStudio.metainfo.xml
          ${FLATPAK_DEST}/share/metainfo/org.hugmesh.ImageStudio.metainfo.xml
      # Icons are RENDERED from the same painter the tray uses, not shipped as a
      # committed PNG, so the installed icon and the running app can never disagree.
      - QT_QPA_PLATFORM=offscreen python3 packaging/gen_icons.py --out build/icons
      - for size in 16 32 48 64 128 256; do
          install -Dm644 "build/icons/icon-${size}.png"
            "${FLATPAK_DEST}/share/icons/hicolor/${size}x${size}/apps/org.hugmesh.ImageStudio.png";
        done
    sources:
      - type: dir
        path: ../..
