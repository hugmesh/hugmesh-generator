# Flatpak manifest for HugMesh Image Studio.
#
# RUNTIME CHOICE: org.kde.Platform, because the app is Qt6/PySide6 and the KDE runtime
# supplies what a Qt program needs around its own libraries: the Wayland and X11 stack,
# GL, fonts and the KDE look. It does not supply the Qt the app actually runs on. The
# PySide6 wheels below carry their own Qt, and on the installed bundle the Python side
# loads that copy (measured 2026-09-30: 625 MB of the 675 MB app), not the runtime's.
# Both are 6.11.2 today, which is why python-deps.json pins it, but they are two copies
# all the same.
#
# WHAT THIS SANDBOX CANNOT DO, stated here because the honest answer belongs next to
# the permissions and not only in the release notes:
#
#   The Studio is a FRONT END over host tooling. It shells out to docker, make, bash,
#   qemu, kubectl, lsblk and ssh, and it reads the build scripts and cluster specs out
#   of a hugmesh-generator checkout on the host. A sandbox that could not reach any of
#   that would install cleanly and then be unable to do the one thing it is for.
#
#   So this manifest asks for --filesystem=host (to read the checkout and write build
#   output) and --talk-name=org.freedesktop.Flatpak (to run host commands via
#   flatpak-spawn --host). Those are broad permissions and they are listed with their
#   reasons below rather than buried. An operator who does not want to grant them can
#   run the Studio from a checkout instead — it needs no installer.
#
#   WHAT THAT BUYS TODAY, measured on the installed 1.0.0 bundle (2026-09-30, on a host
#   that has Docker): the Studio starts, draws its wizard and answers --print-specs, but
#   it cannot use the host's Docker. Nothing in the code calls flatpak-spawn --host, so
#   inside the sandbox `docker` is not on PATH, the Studio detects no backend and tells
#   the user "This machine can't build images yet". The permission is granted; the
#   application does not use it. Building images from the Flatpak needs that code first.
app-id: org.hugmesh.ImageStudio
runtime: org.kde.Platform
# The newest KDE branch Flathub offers that is not end-of-life (read with
# `flatpak remote-ls flathub` and `flatpak remote-info` on 2026-10-29: 6.10 and 6.11
# current, 6.8 and 6.9 flagged end-of-life, no 6.12). The release workflow installs this
# same branch by name, so the two have to move together:
# tests/test_flatpak_packaging_files.py holds them to it.
runtime-version: '6.11'
sdk: org.kde.Sdk
command: hugmesh-studio

finish-args:
  # Display. Wayland first, X11 as the fallback — note that under Wayland a client
  # cannot position its own windows, which the Studio detects and works around
  # (core/platform_info.py); it is not a packaging problem.
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  # The tray icon. Without this the app runs but its whole tray surface — start/stop
  # the mesh, resource limits, running builds — is invisible.
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.Notifications
  # GPU access for the Qt renderer itself (not for builds).
  - --device=dri
  # Reaching a local mesh, a registry, and the Studio's own readiness probes.
  - --share=network
  # The hugmesh-generator checkout, the build output directory, and the operator's
  # config. There is no narrower grant that works: the checkout path is chosen by the
  # operator at first run and is different on every machine.
  - --filesystem=host
  # Lets the app run host commands (docker, make, qemu, kubectl) through
  # flatpak-spawn --host. Granted but not used yet: the Studio never calls
  # flatpak-spawn (see the measurement at the top), so holding this does not change what
  # the app can do today.
  - --talk-name=org.freedesktop.Flatpak

modules:
  # PySide6 is installed from a pinned wheel set. python-deps.json is generated by
  # flatpak-pip-generator and COMMITTED, so the build is offline-reproducible and a
  # release cannot silently pick up a different Qt than the one that was tested.
  #
  # THE PIN FOLLOWS THE RUNTIME. org.kde.Platform//6.11 carries Qt 6.11.2 (read from
  # libQt6Core.so.6.11.2 in the installed runtime, 2026-10-29), so PySide6 is held at
  # 6.11.2 and the Qt inside the wheels is the same release as the Qt in the runtime.
  # Mixing releases (the runtime's platform plugins loaded into the wheels' libraries)
  # was not tried and is not worth finding out. When the runtime moves, move PySide6
  # with it and regenerate:
  #
  #   FLATPAK_PIP_GENERATOR_ALLOW_RESTRICTED_MODULES=1 flatpak-pip-generator \
  #       --runtime=org.kde.Sdk//6.11 \
  #       --prefer-wheels=PySide6,PySide6-Addons,PySide6-Essentials,shiboken6 \
  #       --output python-deps 'PySide6==6.11.2' tzdata
  #
  # The 6.11 wheels are cp310-abi3 / manylinux_2_34; the SDK's Python is 3.13 and its
  # glibc 2.42, so they fit.
  #
  # The generator refuses PySide6 ("please use the baseapp") unless that variable is
  # set, and it takes platform wheels only when asked, which PySide6 needs because it
  # publishes nothing else. README.md next to this file has the steps that work on a
  # machine with no sudo.
  - python-deps.json

  - name: hugmesh-image-studio
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}"
          --prefix=${FLATPAK_DEST} --no-build-isolation .
      - install -Dm644 packaging/flatpak/org.hugmesh.ImageStudio.desktop
          ${FLATPAK_DEST}/share/applications/org.hugmesh.ImageStudio.desktop
      - install -Dm644 packaging/flatpak/org.hugmesh.ImageStudio.metainfo.xml
          ${FLATPAK_DEST}/share/metainfo/org.hugmesh.ImageStudio.metainfo.xml
      # Icons are RENDERED from the same painter the tray uses, not shipped as a
      # committed PNG, so the installed icon and the running app can never disagree.
      - QT_QPA_PLATFORM=offscreen python3 packaging/gen_icons.py --out build/icons
      - for size in 16 32 48 64 128 256; do
          install -Dm644 "build/icons/icon-${size}.png"
            "${FLATPAK_DEST}/share/icons/hicolor/${size}x${size}/apps/org.hugmesh.ImageStudio.png";
        done
    sources:
      - type: dir
        path: ../..
        # What a working checkout piles up and a fresh clone does not. The build copies
        # everything under studio/ and `pip3 install .` packages whatever sits in
        # build/lib, so a module left there by an earlier build ships in the Flatpak
        # after it is gone from the source (measured 2026-09-30: a stale
        # build/lib/hugmesh_studio/zzz_stale_module.py was inside the built app). These
        # are exact paths relative to studio/: flatpak-builder takes no globs and no bare
        # names here, so a nested __pycache__ cannot be listed (it is never packaged).
        # The last three are what building in this directory by hand leaves behind.
        skip:
          - .venv
          - .venv-studio
          - .pytest_cache
          - build
          - dist
          - hugmesh_image_studio.egg-info
          - packaging/flatpak/build-dir
          - packaging/flatpak/.flatpak-builder
          - packaging/flatpak/repo
