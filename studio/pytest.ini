[pytest]
testpaths = tests
markers =
    real_mesh_monitor: run core.mesh_monitor.snapshot for real in this module (tests/conftest.py makes it do nothing by default)
    real_stack_probes: run LocalStackNode.status/e2e_ready and MeshNode.status for real in this module (tests/conftest.py makes them do nothing by default)
    real_local_ai: let this test reach the host's own Ollama on 127.0.0.1:11434 (tests/conftest.py fails any other test that does)
