# modules-load.d — NVIDIA Jetson Orin (Tegra234), MAINLINE kernel flavor.
#
# The hardened fragment builds the boot-critical Tegra drivers IN (=y), so this
# list is short: only the pieces that are commonly modular on a generic arm64
# defconfig and that OpenRC services expect at boot.
#
# L4T kernel flavor note (documented, not automated): the BSP loads its own set
# (nvgpu, nvmap, tegra-drm downstream, ...) via its own modprobe.d — do NOT
# mirror those names here; they do not exist on mainline.

# tailscale/egress-vpn need the tun device before the service starts.
tun

# zram swap (configured at first boot by the builder's zram helper).
zram
